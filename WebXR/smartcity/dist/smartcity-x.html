  box(g, w - 0.4, 0.05, 0.1, 0, 2.55, z + 0.2, accent, { emissive: accent, ei: 0.9, rough: 0.5, cast: false });
  const tones = [0x7a3a2c, 0x2c5a3a, 0xb8862b, 0x5a4a7a, 0x9a8a5a, 0x3a5a7a];
  for (let i = 0; i < 3; i++) for (let x = -w / 2 + 0.5; x < w / 2 - 0.3; x += 0.42) {
    cyl(g, 0.045, 0.045, 0.3, x, 1.07 + i * 0.55, z + 0.06, tones[(Math.round(x * 7) + i) % tones.length], { rough: 0.25, metal: 0.1, seg: 8, cast: false });
  }
  box(g, w + 1, 0.08, 0.7, 0, 1.08, z + 2.4, 0x3d2a1e, { rough: 0.35, metal: 0.05, cast: false });
  box(g, w + 1, 1.0, 0.12, 0, 0.55, z + 2.7, 0x2b211c, { rough: 0.6, cast: false });
  cyl(g, 0.025, 0.025, w + 0.8, 0, 1.18, z + 2.72, 0xb8862b, { rough: 0.3, metal: 0.8, seg: 8, cast: false }).rotation.z = Math.PI / 2;
  for (let x = -w / 2 + 1; x < w / 2; x += 2.2) {
    cyl(g, 0.01, 0.01, h - 1.9, x, h - (h - 1.9) / 2, z + 2.4, 0x1a1512, { rough: 0.6, seg: 4, cast: false });
    cyl(g, 0.16, 0.06, 0.16, x, 1.95, z + 2.4, 0xffd9a0, { emissive: 0xffd9a0, ei: 1.4, rough: 0.5, seg: 10, cast: false });
  }
}

/** A suspended acoustic-tile ceiling: the grid lines and the return grilles. */
function tileCeiling(g, style, y) {
  for (let x = -style.w / 2 + 0.6; x < style.w / 2; x += 0.6) box(g, 0.025, 0.02, style.d - 0.4, x, y, 0, 0xd0d5da, { rough: 0.6, metal: 0.3, cast: false });
  for (let z = -style.d / 2 + 0.6; z < style.d / 2; z += 0.6) box(g, style.w - 0.4, 0.02, 0.025, 0, y, z, 0xd0d5da, { rough: 0.6, metal: 0.3, cast: false });
  for (const [x, z] of [[-style.w * 0.3, -style.d * 0.3], [style.w * 0.3, style.d * 0.3]]) box(g, 0.58, 0.03, 0.58, x, y - 0.01, z, 0xaeb7bf, { rough: 0.5, metal: 0.5, cast: false });
}

/** Ladder tray, dual busway and a fibre run overhead — the data-hall style.
 *  The A and B busways are the point of the room: two feeds a metre apart in
 *  identical housings, which is what makes the hall maintainable and what
 *  makes working in it dangerous. */
function cableTrays(g, style, y, accent) {
  for (const z of [-3.9, 3.9]) {
    for (const dz of [-0.24, 0.24]) box(g, style.w - 1.0, 0.07, 0.05, 0, y, z + dz, 0x8f979e, { rough: 0.6, metal: 0.5, cast: false });
    for (let x = -style.w / 2 + 1; x < style.w / 2 - 0.6; x += 0.55) box(g, 0.05, 0.04, 0.5, x, y, z, 0x8f979e, { rough: 0.6, metal: 0.5, cast: false });
    for (let x = -style.w / 2 + 1.6; x < style.w / 2 - 1; x += 2.8) cyl(g, 0.02, 0.02, 0.55, x, y + 0.3, z, 0x6d7379, { rough: 0.6, metal: 0.5, seg: 6, cast: false });
    const bundle = cyl(g, 0.1, 0.1, style.w - 1.2, 0, y + 0.12, z, 0x2f3a45, { rough: 0.7, seg: 8, cast: false });
    bundle.rotation.z = Math.PI / 2;
  }
  for (const [z, tone] of [[-2.3, 0xb34b3a], [2.3, 0x2f6f8c]]) {
    box(g, style.w - 1.4, 0.26, 0.26, 0, y - 0.4, z, tone, { rough: 0.5, metal: 0.5, cast: false });
    for (let x = -style.w / 2 + 2.6; x < style.w / 2 - 1.6; x += 3.4) {
      box(g, 0.5, 0.42, 0.44, x, y - 0.72, z, 0x2a3138, { rough: 0.6, metal: 0.4, cast: false });
      ball(g, 0.045, x + 0.18, y - 0.58, z + 0.24, 0x59c97b, { emissive: 0x59c97b, ei: 1.4, cast: false, seg: 8, seg2: 6 });
    }
  }
  box(g, style.w - 1.0, 0.05, 0.3, 0, y + 0.6, 0, accent, { emissive: accent, ei: 0.45, rough: 0.5, cast: false });
}

/**
 * Build a room around the station.
 *   parent   a group inside the stage
 *   indoor   the style name the station declared
 *   accent   the station's accent, used on the trim stripe and a wall sign
 *   tod      { lift, mast, ambient } from the stage's time of day
 *   wx       the weather handle, so rooflights show what is happening outside
 * Returns { animate(t, dt), label } or null when the style is unknown.
 */
function buildInterior(parent, indoor, { accent = CITY.accent, daylight = 0.25, weatherKind = "clear" } = {}) {
  const style = interiorFor(indoor);
  if (!style) return null;
  const g = new THREE.Group();
  parent.add(g);
  const { w, d, h } = style;

  // Floor: sealed concrete in the light styles, deck plate in the shop.
  const floorTex = surfaceTexture(
    (cx, cw, ch) => (indoor === "shop" || indoor === "garage" || indoor === "datahall"
      ? deckPlateFace(cx, cw, ch)
      : indoor === "kitchen" ? pavingFace(cx, cw, ch, { tiles: 6, base: "#7a5a48", base2: "#6b4e3e", seam: "rgba(240,230,215,0.55)" })
      : indoor === "clinic" ? pavingFace(cx, cw, ch, { tiles: 2, base: "#b9c4c9", base2: "#aeb9bf", seam: "rgba(0,0,0,0.12)" })
      : indoor === "bar" ? pavingFace(cx, cw, ch, { tiles: 8, base: "#3a2f28", base2: "#2b221d", seam: "rgba(0,0,0,0.5)" })
      : pavingFace(cx, cw, ch, { tiles: 3, base: "#6a7076", base2: "#5f656b" })),
    { repeat: indoor === "shop" ? 10 : indoor === "datahall" ? 14 : indoor === "kitchen" ? 12 : 6, px: 512 });
  const floor = box(g, w, 0.2, d, 0, -0.1, 0, style.floor, { rough: 0.85, metal: 0.1 });
  floor.material = texturedMat(floorTex, { rough: 0.8, metal: 0.12, color: style.floor });
  floor.receiveShadow = true;
  // A painted walkway and a hazard-yellow edge stripe, the way a real floor is marked.
  slab(g, w - 3.2, 0.01, 1.4, 0, 0.005, d / 2 - 1.6, 0x2f6f8c, { radius: 0.02, rough: 0.9, opacity: 0.35, transparent: true, cast: false });
  for (let i = 0; i < 2; i++) box(g, w - 3.2, 0.006, 0.07, 0, 0.008, d / 2 - 1.6 + (i ? 0.72 : -0.72), 0xf2c14b, { rough: 0.85, cast: false });

  // Walls, with a trim stripe at working height in the station's accent.
  const walls = [[w, h, 0.2, 0, h / 2, -d / 2], [w, h, 0.2, 0, h / 2, d / 2],
    [0.2, h, d, -w / 2, h / 2, 0], [0.2, h, d, w / 2, h / 2, 0]];
  // Painted block, not a flat swatch. The floor has had a texture since the
  // interiors went in; the walls are the largest surface in the room and were
  // still one uniform grey, which is most of why these rooms read as diagrams.
  // The maps are shared per finish, so this is texture memory rather than
  // draw calls — see surface() in shared/kit.js.
  // Tiled per axis against each wall's own dimensions, so the grain is the
  // same physical size on a long wall and a short one.
  const PER_M = 1 / 2.4;
  for (const [ww, hh, dd, x, y, z] of walls) {
    const across = Math.max(2, Math.round(Math.max(ww, dd) * PER_M));
    box(g, ww, hh, dd, x, y, z, style.wall,
      { rough: 0.9, metal: 0.05, finish: "painted", tile: [across, Math.max(2, Math.round(hh * PER_M))] });
  }
  for (const [ww, dd, x, z] of [[w, 0.06, 0, -d / 2 + 0.11], [0.06, d, -w / 2 + 0.11, 0], [0.06, d, w / 2 - 0.11, 0]]) {
    box(g, ww, 0.12, dd, x, 1.15, z, accent, { emissive: accent, ei: 0.35, rough: 0.6, cast: false });
    box(g, ww, 0.5, dd, x, 0.25, z, style.trim,
      { rough: 0.85, cast: false, finish: "concrete", tile: [Math.max(3, Math.round(Math.max(ww, dd) * PER_M)), 1] });
  }

  // Ceiling deck and its structure.
  box(g, w, 0.2, d, 0, h + 0.1, 0, style.ceiling,
    { rough: 0.9, finish: "painted", tile: [Math.round(w * PER_M), Math.round(d * PER_M)] });
  if (indoor === "theatre") flyTower(g, style, h - 0.4, accent);
  else if (indoor === "datahall") cableTrays(g, style, h - 0.9, accent);
  else if (indoor === "kitchen") hoodLine(g, style, h - 0.3, accent);
  else if (indoor === "clinic") tileCeiling(g, style, h - 0.02);
  else if (indoor === "bar") backBar(g, style, h, accent);
  else if (indoor === "shop" || indoor === "garage") trusses(g, style, h - 0.5);
  else overheadPipes(g, style, h - 0.7, accent);

  // Light fittings: emissive panels with one point light each.
  const lamps = [];
  const rows = indoor === "theatre" ? 2 : (indoor === "datahall" || indoor === "clinic") ? 4 : 3;
  for (let r = 0; r < rows; r++) {
    for (const sx of [-1, 1]) {
      const x = sx * w * 0.24;
      const z = -d / 2 + (d / (rows + 1)) * (r + 1);
      box(g, 1.5, 0.08, 0.3, x, h - 0.35, z, 0x3a4048, { rough: 0.6, metal: 0.4, cast: false });
      const panel = box(g, 1.35, 0.03, 0.22, x, h - 0.41, z, style.lamp,
        { emissive: style.lamp, ei: style.lampI, rough: 0.4, cast: false });
      const light = new THREE.PointLight(style.lamp, style.lampI * 0.9, 13, 2);
      light.position.set(x, h - 0.6, z);
      g.add(light);
      lamps.push(panel);
    }
  }
  g.add(new THREE.AmbientLight(0xc8d2dc, style.ambient));
  g.add(new THREE.HemisphereLight(0xdfe8f0, style.floor, 0.9));

  // Rooflights: the room's only honest connection to the hour and the
  // weather. Their brightness follows the time of day; in rain they go
  // grey and a faint running-water tint crosses them.
  const skylights = [];
  for (let i = 0; i < style.rooflights; i++) {
    const x = (i - (style.rooflights - 1) / 2) * (w / (style.rooflights + 0.6));
    box(g, 2.2, 0.1, 1.6, x, h + 0.02, -1.0, 0x2c343d, { rough: 0.6, metal: 0.4, cast: false });
    const glass = box(g, 2.0, 0.04, 1.4, x, h - 0.02, -1.0, 0xdce9f4,
      { emissive: 0xdce9f4, ei: daylight, rough: 0.2, cast: false, transparent: true, opacity: 0.85 });
    skylights.push(glass);
  }

  // The way out: a roller shutter, a personnel door, or a dock opening.
  if (style.door === "roller") {
    const rd = group(g, 0, 0, d / 2 - 0.12);
    box(rd, 4.6, 0.25, 0.4, 0, 4.1, 0, 0x5a626a, { rough: 0.6, metal: 0.4 });
    for (let i = 0; i < 12; i++) box(rd, 4.4, 0.28, 0.08, 0, 0.16 + i * 0.3, 0, 0x98a2aa, { rough: 0.7, metal: 0.35, cast: false });
    for (const sx of [-1, 1]) box(rd, 0.16, 4.0, 0.2, sx * 2.35, 2.0, 0, style.trim, { rough: 0.7, metal: 0.3 });
  } else if (style.door === "dock") {
    const op = group(g, 0, 0, d / 2 - 0.12);
    box(op, 3.4, 0.3, 0.3, 0, 4.4, 0, 0x2a2b31, { rough: 0.7 });
    for (const sx of [-1, 1]) box(op, 0.3, 4.4, 0.3, sx * 1.85, 2.2, 0, 0x2a2b31, { rough: 0.7 });
    box(op, 3.2, 4.2, 0.06, 0, 2.1, 0.05, 0x0c0d10, { rough: 0.95 });
  } else {
    const pd = group(g, w / 2 - 0.14, 0, d / 4);
    box(pd, 0.1, 2.1, 0.95, 0, 1.05, 0, 0x8f979e, { rough: 0.7, metal: 0.3 });
    box(pd, 0.12, 2.3, 1.15, 0.02, 1.15, 0, style.trim, { rough: 0.8 });
    ball(pd, 0.045, -0.08, 1.05, 0.35, 0xdfe6ec, { rough: 0.4, metal: 0.7, seg: 10, seg2: 8 });
    box(pd, 0.03, 0.22, 0.5, -0.07, 2.35, 0, 0x2f7d4a, { emissive: 0x2f7d4a, ei: 1.1, rough: 0.5, cast: false });
  }

  // The room says what it is and what the station's accent belongs to.
  decal(g, 2.4, 0.42, 0, 2.6, -d / 2 + 0.12, signFace(style.label.toUpperCase(), { bg: "#101820", accent: "#eaf6fb", scale: 0.5 }), { px: 512 });

  return {
    label: style.label,
    root: g,
    // The stage needs the room's footprint to decide how far a learner may
    // walk in it and where the door they start at is.
    w: style.w, d: style.d,
    animate(t) {
      // Fittings hum rather than sit dead; rooflights breathe with the sky.
      const flicker = 1 + Math.sin(t * 0.9) * 0.02;
      for (const p of lamps) p.material.emissiveIntensity = style.lampI * flicker;
      for (const s of skylights) {
        const rain = weatherKind === "rain" || weatherKind === "storm";
        s.material.emissiveIntensity = daylight * (rain ? 0.55 + Math.sin(t * 3.1) * 0.06 : 1);
      }
    },
  };
}


/* ===== smartcity/js/ambient.js ===== */
// Life on the site.
//
// The apron gave every station a gate, a laydown, a crew truck and a muster
// point, and it was completely deserted. An empty site does not read as a site
// — it reads as a model of one, and a learner who is being taught to work
// around other people is being shown a world with no other people in it.
//
// So: a crew doing believable things at the distances they would really be at,
// a yard vehicle on a slow loop, and the plume off a vent. Nobody here is a
// step target or a hazard; the procedure is unchanged. What changes is that
// the place is inhabited, which is most of what makes an environment vivid.
//
// It is affordable because of mergeStatic's local mode: each figure and the
// truck are baked into two or three meshes that still move as a unit, so the
// whole ambient layer costs about a dozen draw calls rather than eighty.

function crew(parent, x, z, ry, o = {}) {
  const g = group(parent, x, 0, z, ry);
  standingFigure(g, 0, 0, { ry: 0, cloth: o.cloth ?? 0xe3a534, trousers: o.trousers ?? 0x2f3740, skin: o.skin });
  // Hard hat, because everyone on this site is wearing one and a learner will
  // notice the one person who is not.
  ball(g, 0.13, 0, 1.62, 0, o.hat ?? 0xf2c14b, { rough: 0.55, seg: 10 });
  cyl(g, 0.19, 0.19, 0.02, 0, 1.56, 0, o.hat ?? 0xf2c14b, { rough: 0.55, seg: 12 });
  if (o.holding === "clipboard") {
    box(g, 0.22, 0.29, 0.02, 0.2, 1.02, 0.16, 0xdfe6ec, { rough: 0.8 });
  } else if (o.holding === "wands") {
    for (const sx of [-1, 1]) cyl(g, 0.035, 0.035, 0.32, sx * 0.26, 1.02, 0.1, 0xe4622a, { rough: 0.6, seg: 8, emissive: 0xe4622a, ei: 0.5 });
  }
  // Two meshes, and they still stand where they are put and turn on the spot.
  mergeStatic(g, { local: true });
  g.userData.phase = Math.random() * Math.PI * 2;
  g.userData.home = ry;
  return g;
}

// A yard vehicle on a slow loop, well outside the work area. Movement in the
// periphery is what stops a scene reading as a photograph.
function yardTruck(parent, o = {}) {
  const g = group(parent);
  const body = group(g);
  box(body, 1.7, 0.5, 3.6, 0, 0.72, 0, o.color ?? 0xd8a33a, { rough: 0.6, metal: 0.25 });
  box(body, 1.65, 0.95, 1.4, 0, 1.4, -1.0, o.cab ?? 0xe0b04a, { rough: 0.55, metal: 0.3 });
  box(body, 1.4, 0.5, 0.05, 0, 1.55, -0.32, 0x9fc2d8, { rough: 0.25, metal: 0.45 });
  box(body, 1.55, 0.06, 2.1, 0, 1.0, 0.8, 0x4a535d, { rough: 0.7, metal: 0.4 });
  for (const [wx, wz] of [[-0.82, -1.2], [0.82, -1.2], [-0.82, 1.3], [0.82, 1.3]]) {
    const w = cyl(body, 0.36, 0.36, 0.24, wx, 0.36, wz, 0x15181c, { rough: 0.95, seg: 12 });
    w.rotation.z = Math.PI / 2;
  }
  mergeStatic(body, { local: true });
  // The beacon is the one part that has to keep its own material, because it
  // pulses — see ownMaterial() in shared/kit.js for why that matters.
  const beacon = box(g, 0.2, 0.12, 0.2, 0, 2.0, -1.0, 0xf2a03a, { cast: false, rough: 0.4, emissive: 0xf2a03a, ei: 1.2 });
  beacon.material = beacon.material.clone();
  beacon.material.userData.ownMaterial = true;
  return { root: g, beacon };
}

/**
 * Populate the apron. `radius` is the fence line, so the crew and the traffic
 * sit between the work and the boundary and never inside the work area.
 */
function buildAmbient(parent, o = {}) {
  const g = group(parent);
  const R = o.radius ?? 8.2;
  const at = (bearing, r = R) => [Math.sin(bearing) * r, Math.cos(bearing) * r];

  const people = [];
  // A supervisor by the gate with a clipboard, watching you come in.
  {
    const [x, z] = at(0.34, R + 1.6);
    people.push(crew(g, x, z, 0.34 - Math.PI, { holding: "clipboard", cloth: 0xdd7a2f }));
  }
  // Two on the laydown, working stock.
  {
    const [x, z] = at(2.1, R - 0.6);
    people.push(crew(g, x, z, 2.1 - Math.PI + 0.5, { cloth: 0xe3a534 }));
    const [x2, z2] = at(2.5, R + 0.4);
    people.push(crew(g, x2, z2, 2.5 - Math.PI - 0.7, { cloth: 0xc8d24a, trousers: 0x35404a }));
  }
  // A banksman on the plant route, wands down, waiting for the truck.
  {
    const [x, z] = at(Math.PI + 0.1, R + 0.9);
    people.push(crew(g, x, z, 0.1, { holding: "wands", cloth: 0xe4622a }));
  }

  const truck = yardTruck(g, {});
  const route = { r: R + 2.2, a: 1.2, speed: 0.085 };

  // A vent plume somewhere on the boundary — a site is always venting
  // something, and a moving column reads at any distance.
  const [vx, vz] = at(4.9, R + 1.4);
  const vent = group(g, vx, 0, vz);
  cyl(vent, 0.3, 0.36, 1.5, 0, 0.75, 0, 0x5a636c, { rough: 0.7, metal: 0.4, seg: 12 });
  cyl(vent, 0.34, 0.3, 0.14, 0, 1.56, 0, 0x39424b, { rough: 0.6, metal: 0.5, seg: 12 });
  mergeStatic(vent, { local: true });
  const plume = particles(vent, 26, 0xdfe6ec, { size: 0.16, opacity: 0.22 });
  plume.position.set(0, 1.6, 0);

  return {
    root: g,
    animate(t, dt = 0.016) {
      if (reducedMotion()) return;
      // People shift their weight and glance about. Two properties per figure,
      // no allocation, and it is the difference between a crew and a row of
      // mannequins.
      for (const p of people) {
        const ph = p.userData.phase;
        p.rotation.y = p.userData.home + Math.sin(t * 0.32 + ph) * 0.16;
        p.position.y = Math.sin(t * 1.15 + ph) * 0.012;
      }
      // The truck drives its loop and its beacon turns.
      route.a += route.speed * dt;
      truck.root.position.set(Math.sin(route.a) * route.r, 0, Math.cos(route.a) * route.r);
      truck.root.rotation.y = route.a + Math.PI / 2;
      truck.beacon.material.emissiveIntensity = 0.9 + Math.max(0, Math.sin(t * 3.4)) * 1.5;
      plume.userData.step?.(dt, plume.position, 0.22, 0.5, -0.12);
    },
  };
}

void CITY;


/* ===== smartcity/js/apron.js ===== */
// The site around the work.
//
// Every station was authored as a 2-to-2.6 metre work area on a 15 metre
// plaza, and the learner was clamped to a 4.5 metre circle around the middle
// of it. You could turn on the spot and reach everything; you could not walk
// anywhere, and the other ten metres of ground were empty pavement.
//
// This fills that ground with the things a real job site has between the gate
// and the work: the entry with its sign-in board, a materials laydown, the
// crew truck and welfare unit, a muster point, and a waste and spill station.
// The learner now spawns outside the work area and walks in past all of it,
// which is both how a shift actually starts and the only way the extra ground
// becomes worth crossing.
//
// The apron is scenery. Nothing in it is a step target or a hazard: the
// procedure is still entirely inside the station's own geometry, so adding
// the apron changed no station's assessment. What it changes is the distance,
// and therefore whether the place reads as somewhere you are standing.

// Where the learner comes in from, and how far out the fence line sits. The
// plaza deck is 15m across with a walk ring at 13.6 and light masts at 11.5,
// so the fence goes just inside the masts and the zones sit between the work
// area and the fence.
const APRON = {
  fence: 10.8,
  zone: 8.2,
  gateBearing: 0,     // +z, the direction a station already faces
  spawnRadius: 9.4,
};

const SIGN_BG = "#0d1319";

function signBoard(parent, x, z, ry, lines, o = {}) {
  const g = group(parent, x, 0, z, ry);
  const w = o.w ?? 1.5, h = o.h ?? 1.0, y = o.y ?? 1.5;
  for (const sx of [-1, 1]) cyl(g, 0.035, 0.04, y + h / 2, sx * (w / 2 - 0.12), (y + h / 2) / 2, 0, 0x4a535d, { rough: 0.5, metal: 0.6, seg: 10 });
  box(g, w + 0.08, h + 0.08, 0.05, 0, y, 0, 0x2c343d, { rough: 0.7 });
  decal(g, w, h, 0, y, 0.031, (c, cw, ch) => {
    c.fillStyle = o.bg ?? SIGN_BG; c.fillRect(0, 0, cw, ch);
    c.fillStyle = o.accentCss ?? CITY.accentCss; c.fillRect(0, 0, cw, Math.round(ch * 0.055));
    let ty = ch * 0.22;
    lines.forEach((line, i) => {
      const head = i === 0;
      c.fillStyle = head ? (o.accentCss ?? CITY.accentCss) : "#c9d6de";
      c.font = `${head ? 700 : 500} ${Math.round(ch * (head ? 0.15 : 0.092))}px 'Barlow Condensed', Arial, sans-serif`;
      c.textAlign = "left"; c.textBaseline = "middle";
      c.fillText(head ? String(line).toUpperCase() : String(line), cw * 0.06, ty);
      ty += ch * (head ? 0.19 : 0.125);
    });
  }, { px: 512, rough: 0.8 });
  return g;
}

// A pallet of stock: the unit a laydown area is actually counted in.
function pallet(parent, x, z, ry, color, o = {}) {
  const g = group(parent, x, 0, z, ry);
  for (let i = 0; i < 3; i++) box(g, 1.15, 0.035, 0.1, 0, 0.05, -0.4 + i * 0.4, 0x6b5a42, { rough: 0.95 });
  box(g, 1.15, 0.06, 1.0, 0, 0.12, 0, 0x7a6849, { rough: 0.95 });
  const n = o.layers ?? 3;
  for (let i = 0; i < n; i++) box(g, 1.02, 0.17, 0.86, 0, 0.24 + i * 0.19, 0, color, { rough: 0.85 });
  return g;
}

/**
 * Build the site apron. Returns where the learner starts, how far they may
 * walk, and an animate hook for the one thing on it that moves.
 */
function buildApron(parent, o = {}) {
  const accent = o.accent ?? CITY.accent;
  const accentCss = o.accentCss ?? CITY.accentCss;
  const g = group(parent);
  const R = APRON.zone;

  // ------------------------------------------------------------ the fence line
  // Not a full ring — a site is fenced where it meets the public and open
  // where it meets the rest of the works. Two arcs, with the gate in the gap.
  //
  // Heras panels drawn honestly cost eleven meshes each, and a ring of them is
  // three hundred meshes of scenery nobody walks up to. One segment here is two
  // posts, two rails and a single mesh decal: four meshes, and at the six
  // metres you ever see it from it reads the same.
  const meshTex = (c, cw, ch) => {
    c.clearRect(0, 0, cw, ch);
    c.strokeStyle = "rgba(196,206,214,0.85)"; c.lineWidth = Math.max(1, cw * 0.006);
    for (let i = 0; i <= 16; i++) { const x = (i / 16) * cw; c.beginPath(); c.moveTo(x, 0); c.lineTo(x, ch); c.stroke(); }
    for (let i = 0; i <= 6; i++) { const y = (i / 6) * ch; c.beginPath(); c.moveTo(0, y); c.lineTo(cw, y); c.stroke(); }
  };
  const SEGS = 14, SEG_W = (Math.PI * 2 * APRON.fence) / SEGS - 0.35;
  for (let i = 0; i < SEGS; i++) {
    const a = (i / SEGS) * Math.PI * 2;
    // Leave a gap at the gate bearing and a second one opposite, for the
    // plant route that every site has and nobody draws.
    const d = Math.abs(((a - APRON.gateBearing + Math.PI) % (Math.PI * 2)) - Math.PI);
    if (d < 0.5 || Math.abs(d - Math.PI) < 0.4) continue;
    const seg = group(g, Math.sin(a) * APRON.fence, 0, Math.cos(a) * APRON.fence, a);
    for (const sx of [-1, 1]) cyl(seg, 0.028, 0.028, 2.0, sx * (SEG_W / 2), 1.0, 0, 0x8b949c, { rough: 0.5, metal: 0.6, seg: 6 });
    for (const y of [0.1, 1.95]) box(seg, SEG_W, 0.05, 0.035, 0, y, 0, 0x8b949c, { rough: 0.5, metal: 0.6, cast: false });
    decal(seg, SEG_W, 1.8, 0, 1.03, 0, meshTex, { px: 192, transparent: true, rough: 0.7 });
  }

  // ------------------------------------------------------------------ the gate
  const gx = Math.sin(APRON.gateBearing) * APRON.fence, gz = Math.cos(APRON.gateBearing) * APRON.fence;
  const gate = group(g, gx, 0, gz, APRON.gateBearing);
  for (const sx of [-1, 1]) {
    cyl(gate, 0.09, 0.11, 2.9, sx * 1.9, 1.45, 0, 0x3d464f, { rough: 0.5, metal: 0.6, seg: 12 });
    box(gate, 0.5, 0.5, 0.5, sx * 1.9, 0.25, 0, 0x2b323a, { rough: 0.9 });
  }
  box(gate, 4.1, 0.26, 0.14, 0, 2.86, 0, 0x3d464f, { rough: 0.5, metal: 0.5 });
  decal(gate, 3.7, 0.2, 0, 2.86, 0.08, (c, cw, ch) => {
    c.fillStyle = "#11181f"; c.fillRect(0, 0, cw, ch);
    c.fillStyle = accentCss;
    c.font = `700 ${Math.round(ch * 0.72)}px 'Barlow Condensed', Arial, sans-serif`;
    c.textAlign = "center"; c.textBaseline = "middle";
    c.fillText("SITE ACCESS — ALL VISITORS REPORT TO THE OFFICE", cw / 2, ch * 0.56);
  }, { px: 768, glow: true, ei: 0.5, rough: 0.6 });

  // Sign-in board and the PPE notice beside it: the two boards on every gate.
  signBoard(gate, -2.9, 0.9, 0.5, [
    "Site induction",
    "Sign in and sign out. Every visit.",
    "Hard hat · hi-vis · safety boots",
    "Eye and hearing protection in marked areas",
    "Report every incident, however small",
  ], { accentCss, w: 1.6, h: 1.15, y: 1.45 });
  signBoard(gate, 2.9, 0.9, -0.5, [
    "Today on site",
    "Permit holder at the work area",
    "First aider: crew truck",
    "Nearest hospital: 4.2 km — see office",
  ], { accentCss: "#5ad18a", w: 1.5, h: 1.0, y: 1.45 });

  // The walk in: a painted route from the gate to the work area, so there is
  // somewhere the learner is meant to be while crossing the open ground.
  const walk = decal(g, 2.6, APRON.fence - 3.2, Math.sin(APRON.gateBearing) * ((APRON.fence + 3.2) / 2), 0.04,
    Math.cos(APRON.gateBearing) * ((APRON.fence + 3.2) / 2), (c, cw, ch) => {
      c.clearRect(0, 0, cw, ch);
      // A tinted running surface, not two hairlines: this is the only thing
      // telling a learner which way the work is across ten metres of pavement.
      c.fillStyle = "rgba(240,198,92,0.16)";
      c.fillRect(cw * 0.08, 0, cw * 0.84, ch);
      c.strokeStyle = "#f6cb56"; c.lineWidth = Math.max(4, cw * 0.05);
      c.beginPath(); c.moveTo(cw * 0.08, 0); c.lineTo(cw * 0.08, ch);
      c.moveTo(cw * 0.92, 0); c.lineTo(cw * 0.92, ch); c.stroke();
      // Chevrons pointing at the work, spaced so one is always underfoot.
      c.fillStyle = "rgba(246,203,86,0.72)";
      for (let i = 0; i < 9; i++) {
        const y = ch - (i + 0.62) * (ch / 9);
        c.beginPath();
        c.moveTo(cw * 0.5, y - ch * 0.030);
        c.lineTo(cw * 0.76, y + ch * 0.016);
        c.lineTo(cw * 0.66, y + ch * 0.016);
        c.lineTo(cw * 0.5, y - ch * 0.008);
        c.lineTo(cw * 0.34, y + ch * 0.016);
        c.lineTo(cw * 0.24, y + ch * 0.016);
        c.closePath(); c.fill();
      }
      // The one word a site walkway always has painted on it.
      c.save();
      c.translate(cw * 0.5, ch * 0.5); c.rotate(-Math.PI / 2);
      c.fillStyle = "rgba(246,203,86,0.5)";
      c.font = `700 ${Math.round(cw * 0.2)}px 'Barlow Condensed', Arial, sans-serif`;
      c.textAlign = "center"; c.textBaseline = "middle";
      c.fillText("WALKWAY — KEEP INSIDE THE LINES", 0, 0);
      c.restore();
    }, { px: 320, transparent: true, rough: 0.9 });
  walk.rotation.x = -Math.PI / 2;
  walk.rotation.z = -APRON.gateBearing;

  // --------------------------------------------------------------- the zones
  // Each sits on the ring between the work area and the fence, far enough
  // apart that walking between them takes a few seconds.
  const at = (bearing, r = R) => [Math.sin(bearing) * r, Math.cos(bearing) * r];

  // Materials laydown — marked bays, pallets, pipe stock, drums on a bund.
  {
    const [x, z] = at(2.25);
    const lay = group(g, x, 0, z, 2.25 - Math.PI);
    const bay = decal(lay, 5.0, 3.4, 0, 0.03, 0, (c, cw, ch) => {
      c.clearRect(0, 0, cw, ch);
      c.strokeStyle = "#d8dde3"; c.lineWidth = Math.max(2, cw * 0.007);
      c.strokeRect(cw * 0.02, ch * 0.03, cw * 0.96, ch * 0.94);
      c.beginPath(); c.moveTo(cw / 3, ch * 0.03); c.lineTo(cw / 3, ch * 0.97);
      c.moveTo((cw * 2) / 3, ch * 0.03); c.lineTo((cw * 2) / 3, ch * 0.97); c.stroke();
    }, { px: 512, transparent: true, rough: 0.9 });
    bay.rotation.x = -Math.PI / 2;
    pallet(lay, -1.6, 0.2, 0.1, 0x8d7f6a, { layers: 3 });
    pallet(lay, 0.1, -0.3, -0.12, 0x5f6b74, { layers: 2 });
    for (let i = 0; i < 4; i++) {
      const p = cyl(lay, 0.085, 0.085, 3.0, 1.7 + (i % 2) * 0.19, 0.1 + Math.floor(i / 2) * 0.17, 0.2, 0x8a6b4a, { rough: 0.85, seg: 10 });
      p.rotation.x = Math.PI / 2;
    }
    box(lay, 1.5, 0.12, 1.1, 1.8, 0.06, -1.2, 0x4a535d, { rough: 0.8, metal: 0.3 });
    for (const dx of [-0.35, 0.35]) cyl(lay, 0.26, 0.26, 0.85, 1.8 + dx, 0.53, -1.2, 0x2f6fa8, { rough: 0.7, seg: 14 });
    signBoard(lay, -2.0, -1.9, 0.2, ["Laydown", "Stock in marked bays only", "Nothing stored in the walkway"], { accentCss, w: 1.2, h: 0.72, y: 1.2 });
    holoTag(lay, "materials laydown", 0, 1.1, 1.8, { css: accentCss, w: 0.6 });
  }

  // Crew truck and welfare unit — where the shift starts and the kit lives.
  {
    const [x, z] = at(4.05);
    const yard = group(g, x, 0, z, 4.05 - Math.PI);
    // Welfare cabin on skids.
    const cab = group(yard, -1.4, 0, 0);
    box(cab, 3.0, 0.18, 2.4, 0, 0.16, 0, 0x2f3740, { rough: 0.85 });
    slab(cab, 3.0, 2.35, 2.4, 0, 1.35, 0, 0xd8dde3, { radius: 0.05, rough: 0.7 });
    box(cab, 3.1, 0.14, 2.5, 0, 2.55, 0, 0x39424b, { rough: 0.7, metal: 0.3 });
    box(cab, 0.9, 1.95, 0.06, -0.9, 1.2, 1.21, 0x4a6b8a, { rough: 0.5 });
    for (const wx of [0.55, 1.5]) box(cab, 0.7, 0.6, 0.05, wx, 1.6, 1.21, 0x93b8d4, { rough: 0.25, metal: 0.4 });
    holoTag(cab, "welfare · first aid · muster list", 0, 2.75, 1.1, { css: "#5ad18a", w: 0.78 });
    // Crew truck: flatbed with a rack and a set of kit on it.
    const truck = group(yard, 2.2, 0, 0.2, -0.25);
    box(truck, 2.0, 0.55, 4.6, 0, 0.72, 0, 0x8a3a2f, { rough: 0.6, metal: 0.25 });
    slab(truck, 1.95, 1.15, 1.7, 0, 1.55, -1.3, 0x9c4536, { radius: 0.06, rough: 0.55, metal: 0.3 });
    box(truck, 1.7, 0.55, 0.05, 0, 1.75, -0.44, 0x9fc2d8, { rough: 0.25, metal: 0.45 });
    box(truck, 1.9, 0.06, 2.7, 0, 1.02, 1.0, 0x4a535d, { rough: 0.7, metal: 0.4 });
    for (const sz of [-0.1, 2.2]) for (const sx of [-1, 1]) cyl(truck, 0.07, 0.07, 1.0, sx * 0.9, 1.52, sz, 0x59636d, { rough: 0.5, metal: 0.6, seg: 8 });
    box(truck, 1.8, 0.1, 0.07, 0, 2.02, 1.05, 0x59636d, { rough: 0.5, metal: 0.6 });
    // Kit on the deck. The comment above has promised it since this was
    // written and the bed was a bare grey panel — which is what it read as
    // from the gate, on every station, because the yard is near the approach.
    box(truck, 0.62, 0.34, 0.46, -0.52, 1.22, 0.35, 0x2f3740, { rough: 0.65, metal: 0.3 });
    box(truck, 0.5, 0.28, 0.4, -0.5, 1.5, 0.3, 0xe3a534, { rough: 0.7 });
    box(truck, 0.72, 0.26, 0.5, 0.52, 1.18, 1.45, 0x8a6a3a, { rough: 0.9 });
    for (const cz of [0.9, 1.55]) {
      const coil = torus(truck, 0.26, 0.07, 0.48, 1.12, cz, 0x1f2429, { rough: 0.9, seg: 8, seg2: 18 });
      coil.rotation.x = Math.PI / 2;
    }
    for (let i = 0; i < 5; i++) {
      cyl(truck, 0.045, 0.045, 2.3, -0.72 + i * 0.05, 1.08, 0.1, 0x9aa4ad, { rough: 0.5, metal: 0.65, seg: 8 })
        .rotation.x = Math.PI / 2;
    }
    for (const [wx, wz] of [[-0.95, -1.5], [0.95, -1.5], [-0.95, 1.6], [0.95, 1.6]]) {
      const w = cyl(truck, 0.42, 0.42, 0.28, wx, 0.42, wz, 0x15181c, { rough: 0.95, seg: 14 });
      w.rotation.z = Math.PI / 2;

    holoTag(truck, "crew truck", 0, 2.3, 1.05, { css: accentCss, w: 0.4 });

  }

  // Muster point — green, visible from anywhere, with the headcount board.
  {
    const [x, z] = at(5.3, R + 0.8);
    const m = group(g, x, 0, z, 5.3 - Math.PI);
    const disc = decal(m, 3.0, 3.0, 0, 0.032, 0, (c, cw, ch) => {
      c.clearRect(0, 0, cw, ch);
      c.fillStyle = "rgba(42,140,84,0.65)";
      c.beginPath(); c.arc(cw / 2, ch / 2, cw * 0.46, 0, Math.PI * 2); c.fill();
      c.strokeStyle = "#8ff0b4"; c.lineWidth = cw * 0.02;
      c.beginPath(); c.arc(cw / 2, ch / 2, cw * 0.46, 0, Math.PI * 2); c.stroke();
    }, { px: 256, transparent: true, rough: 0.9 });
    disc.rotation.x = -Math.PI / 2;
    cyl(m, 0.05, 0.06, 2.4, 0, 1.2, -1.1, 0x4a535d, { rough: 0.5, metal: 0.6, seg: 10 });
    box(m, 1.0, 0.7, 0.05, 0, 2.2, -1.1, 0x1f7a46, { rough: 0.7 });
    decal(m, 0.92, 0.62, 0, 2.2, -1.07, (c, cw, ch) => {
      c.fillStyle = "#1f7a46"; c.fillRect(0, 0, cw, ch);
      c.fillStyle = "#eafff2";
      c.font = `700 ${Math.round(ch * 0.26)}px 'Barlow Condensed', Arial, sans-serif`;
      c.textAlign = "center"; c.textBaseline = "middle";
      c.fillText("MUSTER", cw / 2, ch * 0.3);
      c.font = `500 ${Math.round(ch * 0.16)}px 'Barlow Condensed', Arial, sans-serif`;
      c.fillText("ASSEMBLY POINT A", cw / 2, ch * 0.62);
      c.fillText("HEADCOUNT HERE", cw / 2, ch * 0.83);
    }, { px: 384, glow: true, ei: 0.45, rough: 0.7 });
    holoTag(m, "muster point A", 0, 0.42, 1.2, { css: "#5ad18a", w: 0.44 });
  }

  // Waste, spill kit and the wash station — the end of every shift.
  {
    const [x, z] = at(1.15, R - 0.4);
    const waste = group(g, x, 0, z, 1.15 - Math.PI);
    // Skip.
    const skip = group(waste, -0.9, 0, 0, 0.15);
    for (const [bw, bd, by] of [[2.6, 1.5, 0.05]]) box(skip, bw, 0.1, bd, 0, by, 0, 0x4a4036, { rough: 0.9 });
    for (const [sx, sz, sw, sd] of [[0, -0.75, 2.6, 0.08], [0, 0.75, 2.6, 0.08], [-1.3, 0, 0.08, 1.5], [1.3, 0, 0.08, 1.5]]) {
      box(skip, sw, 0.95, sd, sx, 0.55, sz, 0x8a5a30, { rough: 0.85, metal: 0.2 });
    }
    for (let i = 0; i < 3; i++) box(skip, 0.78, 0.3, 1.2, -0.82 + i * 0.82, 1.0, 0, i % 2 ? 0x6b6255 : 0x574f44, { rough: 0.95 });
    holoTag(skip, "segregated waste", 0, 1.35, 0.85, { css: accentCss, w: 0.5 });
    equipmentCabinet(waste, 0.8, 1.2, 0.45, 1.5, 0, { color: 0xd8b13a, accent: 0xd8b13a });
    holoTag(waste, "spill kit", 1.5, 1.45, 0.3, { css: "#f2c14b", w: 0.3 });
    // Wash / eyewash station.
    const wash = group(waste, 2.7, 0, -0.4, -0.2);
    cyl(wash, 0.06, 0.07, 1.35, 0, 0.67, 0, 0x2f8f5a, { rough: 0.6, metal: 0.4, seg: 10 });
    box(wash, 0.55, 0.12, 0.4, 0, 1.4, 0, 0x2f8f5a, { rough: 0.6 });
    cyl(wash, 0.26, 0.26, 0.1, 0, 1.0, 0.2, 0xdfe6ec, { rough: 0.5, seg: 14 });
    holoTag(wash, "emergency eyewash", 0, 1.68, 0, { css: "#5ad18a", w: 0.46 });
  }

  // Cones down the walkway, because a route is only a route if it is marked.
  for (const s of [-1, 1]) {
    for (let i = 0; i < 2; i++) {
      const d = 4.8 + i * 2.8;
      cone(g, Math.sin(APRON.gateBearing) * d + s * 1.35 * Math.cos(APRON.gateBearing),
        Math.cos(APRON.gateBearing) * d - s * 1.35 * Math.sin(APRON.gateBearing), {});
    }
  }

  // Its own material: the animate loop below writes emissiveIntensity, and a
  // mat() material is shared by value with anything else the same colour.
  const beacon = ownMaterial(box(gate, 0.16, 0.1, 0.16, 0, 3.05, 0, 0xf2a03a,
    { emissive: 0xf2a03a, ei: 1.4, rough: 0.4, cast: false }));
  // The people and the traffic. Built after everything else so the crew can be
  // placed against the zones they are working, and kept out of the merge in
  // stage.js because they move. See ambient.js.
  const life = buildAmbient(g, { radius: R });
  void accent;

  return {
    root: g,
    // Where a shift starts: outside the gate, facing the work.
    spawn: {
      x: Math.sin(APRON.gateBearing) * APRON.spawnRadius,
      z: Math.cos(APRON.gateBearing) * APRON.spawnRadius,
      ry: APRON.gateBearing,
    },
    // How far out the learner may walk — just inside the fence line.
    roam: APRON.fence - 0.7,
    animate(t, dt = 0.016) {
      beacon.material.emissiveIntensity = 1.0 + Math.max(0, Math.sin(t * 2.2)) * 1.3;
      life.animate(t, dt);
    },
  };
}

// Flagship banner copy, product-owner-specified: SmartCiti.X is the visitor-facing
// simulator brand; AGI Corp and Visko are the umbrella/co-brands it is built and run under.
const MARQUEE_LINE = "SMARTCITI.X ~VR SIMULATORS";
const MARQUEE_SUB = "POWERED BY AGI CORP & VISKO";

/** Flagship entrance marquee: two support posts, a lit beam, a canvas wordmark and a
 *  small rotating holo-emblem. Built once; the returned refs are cheap to animate
 *  per-frame (no allocations, just property tweaks on cached materials). */
function buildMarquee(g) {
  const spanW = 6.2, postH = 4.6, postR = 0.16, mz = -9.6;
  const marquee = group(g, 0, 0, mz);
  for (const sx of [-1, 1]) {
    cyl(marquee, postR, postR * 1.15, postH, sx * spanW / 2, postH / 2, 0, 0x232b33, { rough: 0.4, metal: 0.65, seg: 14 });
    box(marquee, postR * 2.4, 0.22, postR * 2.4, sx * spanW / 2, 0.11, 0, 0x1a2129, { rough: 0.6, metal: 0.4 });
  }
  box(marquee, spanW + 0.5, 0.5, 0.4, 0, postH + 0.05, 0, 0x171f28, { rough: 0.45, metal: 0.55 });
  const trim = box(marquee, spanW + 0.3, 0.03, 0.05, 0, postH - 0.22, 0.21, CITY.accent,
    { emissive: CITY.accent, ei: 1.6, rough: 0.4, cast: false });

  // The sign is a 3.7:1 panel; the canvas takes that aspect, so nothing here
  // is drawn at a size it cannot fit. Every line is measured and shrunk to the
  // panel's width before it is drawn — the wordmark used to be set at a fixed
  // size that was wider than its canvas, and read "RTCITI.X ~VR SIMULA" from
  // every spawn point in the roster.
  const FAM_C = "'Barlow Condensed', 'Arial Narrow', Arial, sans-serif";
  const FAM = "'Barlow', Arial, sans-serif";
  const sign = decal(marquee, spanW - 0.4, 1.55, 0, postH - 1.0, 0.22, (cx, cw, ch) => {
    gradientFill(cx, cw, ch, [[0, "#04141c"], [1, "#0b2733"]]);
    noiseTexture(cx, cw, ch, { density: 260, alpha: 0.03, tone: "255,255,255" });
    const hair = Math.max(2, Math.round(ch * 0.012));
    cx.strokeStyle = "rgba(143,216,255,0.32)"; cx.lineWidth = hair;
    cx.strokeRect(hair * 1.5, hair * 1.5, cw - hair * 3, ch - hair * 3);
    const maxW = cw * 0.88;
    const fit = (text, weight, family, px) => {
      cx.font = `${weight} ${px}px ${family}`;
      const w = cx.measureText?.(text)?.width;
      const fitted = w && w > maxW ? Math.floor(px * maxW / w) : px;
      cx.font = `${weight} ${fitted}px ${family}`;
    };
    cx.textAlign = "center"; cx.textBaseline = "middle";
    try { cx.letterSpacing = "0.14em"; } catch { /* older canvas */ }
    fit(MARQUEE_SUB, 600, FAM_C, Math.round(ch * 0.115));
    cx.fillStyle = "#8fd8ff";
    cx.fillText(MARQUEE_SUB, cw / 2, ch * 0.165);
    try { cx.letterSpacing = "0.02em"; } catch { /* older canvas */ }
    fit(MARQUEE_LINE, 800, FAM_C, Math.round(ch * 0.40));
    cx.fillStyle = "#f4fbff";
    cx.fillText(MARQUEE_LINE, cw / 2, ch * 0.50);
    cx.fillStyle = CITY.accentCss;
    cx.fillRect(cw * 0.22, ch * 0.72, cw * 0.56, Math.max(2, Math.round(ch * 0.009)));
    try { cx.letterSpacing = "0.12em"; } catch { /* older canvas */ }
    fit("FLAGSHIP AR / VR TRAINING SIMULATORS", 500, FAM, Math.round(ch * 0.095));
    cx.fillStyle = CITY.accentCss;
    cx.fillText("FLAGSHIP AR / VR TRAINING SIMULATORS", cw / 2, ch * 0.86);
  }, { px: 2048, glow: true, ei: 0.85 });

  const emblem = group(marquee, 0, postH + 0.85, 0);
  torus(emblem, 0.4, 0.03, 0, 0, 0, CITY.accent, { emissive: CITY.accent, ei: 2, rough: 0.4, cast: false, seg: 8, seg2: 40 });
  const ring2 = torus(emblem, 0.28, 0.02, 0, 0, 0, CITY.violet, { emissive: CITY.violet, ei: 1.8, rough: 0.4, cast: false, seg: 6, seg2: 32 });
  ring2.rotation.x = Math.PI / 2.4;
  ball(emblem, 0.09, 0, 0, 0, 0xeaf6fb, { emissive: 0xeaf6fb, ei: 2.4, rough: 0.3 });
  const beam = new THREE.PointLight(CITY.accent, 2.2, 9, 2);
  beam.position.set(0, postH - 0.4, 0.4);
  marquee.add(beam);

  // The animate loop writes trim.material.emissiveIntensity every frame, and
  // mat() hands out shared materials — so this one has to be its own.
  ownMaterial(trim);
  return { sign, emblem, ring2, trim };
}

// The stage is everything that is *not* the training station.
//
// In AR the learner's own room is the environment, so the stage is almost
// nothing: passthrough behind, and a faint floor grid to anchor the station.
// In VR and on a flat screen there is no real room to stand in, so the same
// station is dropped into a digital-twin plaza with a city skyline around it,
// and a district for the station's trade category on the horizon between the
// two (districts.js): pylons behind a substation, a container terminal behind
// a lashing deck, a truss arch behind a company switch, with the sky, fog and
// light-mast tint to match.

const STAGE_MODES = ["ar", "vr", "flat"];

// Time of day for the plaza: the districts are authored for night, and a
// training hall running a day shift can ask for dusk or day with
// `?time=day|dusk|night`. Day lifts the sky and fog to a pale overcast,
// turns the key light up and the masts down; dusk is the sodium hour in
// between. Emissive props keep their glow (a lit window at noon is a small
// price for not rebuilding every district twice).
const TIMES_OF_DAY = ["night", "dusk", "day"];
const TIME = {
  night: { sky: null, fog: null, hemi: null, key: [0xd6e4f0, 1.3], mast: 1.0, glow: 0.34, hemiI: 2.0, ambient: 0.55, lift: 1.9 },
  dusk: { sky: 0x4a3a4c, fog: 0x5c4856, hemi: [0xe6b98f, 0x3a3240], key: [0xffb27a, 1.8], mast: 0.8, glow: 0.2, hemiI: 1.8, ambient: 0.45, lift: 1 },
  day: { sky: 0x9fb8cc, fog: 0xb8c9d8, hemi: [0xe9f0f6, 0x7a8590], key: [0xfff6e8, 2.6], mast: 0.15, glow: 0.04, hemiI: 1.6, ambient: 0.35, lift: 1 },
};
/** Lift a dark authored colour toward a readable one (night skies and fog). */
function lift(hex, k) {
  const c = new THREE.Color(hex);
  c.r = Math.min(1, c.r * k + 0.02); c.g = Math.min(1, c.g * k + 0.025); c.b = Math.min(1, c.b * k + 0.035);
  return c;
}
function timeOfDay() {
  const t = typeof location !== "undefined" ? new URLSearchParams(location.search).get("time") : null;
  return TIMES_OF_DAY.includes(t) ? t : "night";
}

function buildStage(root, mode, scene, accent = CITY.accent, category = null, weather = null, indoor = null) {
  const g = group(root);
  const ar = mode === "ar";
  const district = districtFor(category);
  const tod = TIME[timeOfDay()];

  if (ar) {
    // Passthrough: no sky, no ground, nothing that would paint over the room.
    scene.background = null;
    scene.fog = null;
    // A low-contrast grid disc so the station still feels placed on the floor.
    for (let ring = 1; ring <= 3; ring++) {
      torus(g, ring * 0.9, 0.004, 0, 0.004, 0, CITY.accent,
        { emissive: CITY.accent, ei: 0.5, rough: 0.4, cast: false, seg: 6, seg2: 48 });
    }
    for (let i = 0; i < 12; i++) {
      const a = (i / 12) * Math.PI * 2;
      const spoke = box(g, 0.004, 0.004, 2.7, Math.sin(a) * 1.35, 0.004, Math.cos(a) * 1.35,
        CITY.accent, { emissive: CITY.accent, ei: 0.35, rough: 0.4, cast: false });
      spoke.rotation.y = a;
    }
    root.add(new THREE.HemisphereLight(0xdfeaf2, 0x6a7480, 1.5));
    const key = new THREE.DirectionalLight(0xffffff, 0.7);
    key.position.set(2.5, 5, 3);
    root.add(key);
    // No apron in AR: the learner's own room is the site, and a fence line
    // through their furniture helps nobody.
    return { root: g, ar, roam: null, spawn: null, weather: { kind: "clear", label: "Passthrough", note: "In AR the learner's own room is the environment; the stage adds nothing." }, animate() {} };
  }

  // A station that is indoors gets a room, not a plaza with a skyline behind
  // it. The weather still exists — it is what the rooflights are showing —
  // and the hour still sets how bright they are.
  const interiorStyle = interiorFor(indoor);
  if (interiorStyle) {
    scene.background = new THREE.Color(0x0b0e13);
    scene.fog = new THREE.Fog(0x0b0e13, 26, 70);
    const wxIn = buildWeather(g, scene, weatherFor(weather));
    const daylight = { night: 0.06, dusk: 0.22, day: 0.7 }[timeOfDay()] ?? 0.06;
    const room = buildInterior(g, indoor, { accent, daylight, weatherKind: wxIn.kind });
    // Indoors the weather particles belong outside the shell; keep only its
    // label and note, which are what the learner is actually told.
    wxIn.root.visible = false;
    // An interior is already a walkable space; the learner may use all of it
    // up to the walls, and they start at the door rather than mid-floor.
    const half = Math.min(room?.w ?? 12, room?.d ?? 12) / 2 - 1.1;
    return {
      root: g, ar, indoor,
      roam: Math.max(3.4, half),
      spawn: { x: 0, z: Math.max(2.6, (room?.d ?? 12) / 2 - 1.6), ry: 0 },
      weather: { kind: wxIn.kind, label: wxIn.label, note: wxIn.note },
      animate(t, dt = 0.016) {
        if (reducedMotion()) return;
        room?.animate(t, dt);
      },
    };
  }

  scene.background = tod.sky !== null ? new THREE.Color(tod.sky) : lift(district.sky, tod.lift);
  // A district on the horizon needs the fog held back past it (r ≈ 20–46).
  scene.fog = new THREE.Fog(tod.fog !== null ? new THREE.Color(tod.fog) : lift(district.fog, tod.lift), district.build ? 36 : 22, district.build ? 96 : 64);

  // Plaza deck: cast-concrete paving tiled across the disc (the cylinder cap's
  // planar UVs make a repeating texture read as a real slab grid), with a
  // deck-plate walk ring around the perimeter so the edge reads as a
  // different material rather than the same colour to the horizon.
  //
  // NOTE FOR STATION AUTHORS: this disc is solid, 15m in radius, and occupies
  // y from -0.30 to 0. Anything a station builds below that is under a slab
  // and cannot be seen — though it can still be clicked, because picking
  // raycasts against state.selectables rather than the scene, so no checker
  // and no scripted drive will ever tell you. The stations with below-grade
  // content that read correctly (trench-box, valve-vault, hot-tap) all do the
  // same thing: raise a local pad or apron above the deck and cut the
  // excavation into that, so the hole has a visible rim. A station with
  // nothing to raise — a ship's side, a quay — builds its outboard
  // arrangement above plaza level instead and accepts the compressed
  // freeboard. Either way, look at a spawn screenshot before you believe it.
  const pavingTex = surfaceTexture((cx, w, h) => pavingFace(cx, w, h, { tiles: 4 }), { repeat: 7, px: 512 });
  const deck = cyl(g, 15, 15, 0.3, 0, -0.15, 0, 0x151b22, { rough: 0.55, metal: 0.2, seg: 64 });
  deck.material = texturedMat(pavingTex, { rough: 0.9, metal: 0.04, color: 0xd8dde3 });
  deck.receiveShadow = true;
  const plateTex = surfaceTexture((cx, w, h) => deckPlateFace(cx, w, h), { repeat: 22, px: 256 });
  const walkRing = cyl(g, 13.6, 13.6, 0.04, 0, 0.02, 0, 0x232b33, { rough: 0.6, metal: 0.5, seg: 64 });
  walkRing.material = texturedMat(plateTex, { rough: 0.55, metal: 0.55, color: 0xcfd6dd });
  walkRing.receiveShadow = true;
  cyl(g, 11.8, 11.8, 0.05, 0, 0.025, 0, 0x121920, { rough: 0.9, metal: 0.05, seg: 64, cast: false })
    .material = texturedMat(surfaceTexture((cx, w, h) => pavingFace(cx, w, h, { tiles: 3, base: "#1c242d", base2: "#171e26" }), { repeat: 5, px: 512 }), { rough: 0.9, metal: 0.04, color: 0xd0d6dc });
  // Station-accent glow ring and an inner hazard-yellow kerb line: the ring
  // takes the current station's colour so each sim's plaza is subtly its own.
  torus(g, 12.6, 0.05, 0, 0.03, 0, accent,
    { emissive: accent, ei: 1.6, rough: 0.4, cast: false, seg: 6, seg2: 72 });
  torus(g, 11.75, 0.02, 0, 0.055, 0, CITY.hiVis,
    { emissive: CITY.hiVis, ei: 0.6, rough: 0.5, cast: false, seg: 6, seg2: 72 });

  // Perimeter light masts.
  for (let i = 0; i < 8; i++) {
    const a = (i / 8) * Math.PI * 2 + Math.PI / 8;
    const mx = Math.sin(a) * 11.5, mz = Math.cos(a) * 11.5;
    cyl(g, 0.055, 0.075, 5.2, mx, 2.6, mz, 0x2b333c, { rough: 0.5, metal: 0.6, seg: 12 });
    const head = box(g, 0.5, 0.09, 0.26, mx, 5.2, mz, 0x2b333c, { rough: 0.5, metal: 0.6 });
    head.rotation.y = a;
    const lamp = box(g, 0.42, 0.03, 0.2, mx, 5.14, mz, district.mast,
      { emissive: district.mast, ei: 1.8 * tod.mast, rough: 0.4, cast: false });
    lamp.rotation.y = a;
    const light = new THREE.PointLight(district.mast, 1.6 * tod.mast, 16, 2);
    light.position.set(mx * 0.82, 4.6, mz * 0.82);
    g.add(light);
  }

  const sky = skyline(g, { gap: district.skylineGap ?? null });
  sky.name = "skyline";
  const marquee = buildMarquee(g);
  // Weather goes on after the sky and fog are set for the hour, because it
  // scales both; the stage hands its label and note back to the app.
  const wx = buildWeather(g, scene, weatherFor(weather));
  let districtAnimate = null;
  if (district.build) { const dg = group(g); dg.name = "district"; districtAnimate = district.build(dg, accent); selfLight(dg, tod.glow); }

  const key = new THREE.DirectionalLight(tod.key[0], tod.key[1] * wx.lightScale);
  key.position.set(4, 9, 5);
  key.castShadow = true;
  key.shadow.mapSize.set(2048, 2048);
  key.shadow.camera.left = -9; key.shadow.camera.right = 9;
  key.shadow.camera.top = 9; key.shadow.camera.bottom = -9;
  key.shadow.bias = -0.0008;
  g.add(key);
  const hemi = tod.hemi ?? [lift(district.hemi[0], 1.35).getHex(), lift(district.hemi[1], 1.6).getHex()];
  g.add(new THREE.HemisphereLight(hemi[0], hemi[1], tod.hemiI));
  // A flat fill so no face of a station ever goes to black — the districts and
  // the station props are authored bright enough to read at a glance.
  g.add(new THREE.AmbientLight(0xb8c8d8, tod.ambient));
  // A soft overhead wash in the station's own accent — the one light that
  // changes per sim, so the same plaza reads warm for a boiler room and cool
  // for a chiller plant without rebuilding anything.
  const wash = new THREE.PointLight(accent, 1.6 * wx.lightScale, 12, 2);
  wash.position.set(0, 4.2, 0.6);
  g.add(wash);
  // Cool rim from behind the marquee so silhouettes separate from the skyline.
  const rim = new THREE.DirectionalLight(0x6fb8ff, 0.55);
  rim.position.set(-3, 4, -8);
  g.add(rim);

  // The site around the work: gate, sign-in, laydown, crew truck, muster point
  // and waste station, spread across ground that used to be empty pavement the
  // learner was not allowed to walk on anyway. See apron.js.
  const apron = buildApron(g, { accent, accentCss: `#${accent.toString(16).padStart(6, "0")}` });

  const beacons = sky.userData.beacons ?? [];

  // Collapse the scenery into one mesh per material. An outdoor scene was
  // measuring 518 draw calls with 652 visible meshes; almost all of that is
  // the skyline, the district, the masts and the site apron, none of which
  // moves or is ever clicked. The station itself is never merged — it is the
  // part the procedure touches. See mergeStatic() in shared/kit.js.
  //
  // The beacons and the marquee trim animate their own materials and carry
  // the ownMaterial flag, so the merge steps over them and they still pulse.
  const merged = mergeStatic(g);

  return {
    root: g, ar, roam: apron.roam, spawn: apron.spawn, merged,
    weather: { kind: wx.kind, label: wx.label, note: wx.note },
    animate(t, dt = 0.016) {
      // A learner who asked their system for less animation gets a still
      // plaza: the station itself still moves, because the procedure needs
      // it, but the scenery, the weather and the beacons hold.
      if (reducedMotion()) return;
      // Cheap flagship motion: rotate the holo-emblem, pulse its inner ring and the
      // marquee trim, and blink a handful of rooftop beacons — property tweaks on
      // already-built meshes/materials, nothing allocated per frame.
      marquee.emblem.rotation.y = t * 0.5;
      marquee.ring2.rotation.z = t * 0.8;
      marquee.trim.material.emissiveIntensity = 1.4 + Math.sin(t * 1.6) * 0.3;
      for (const beacon of beacons) {
        beacon.material.emissiveIntensity = 1.1 + Math.max(0, Math.sin(t * 1.4 + beacon.userData.phase)) * 1.4;
      }
      if (districtAnimate) districtAnimate(t);
      apron.animate(t, dt);
      wx.animate(t, dt);
    },
  };
}

        "body": "Between 2003 and 2014 the Navy's radiological remediation contractor, Tetra Tech EC, was required to survey soil and buildings and remediate excess radiation so parcels could be transferred to the city. Federal False Claims Act litigation alleged that employees and subcontractors substituted clean soil for potentially contaminated samples and fabricated radiological readings the Navy relied on. A Navy review found roughly 48% of the contractor's radiological data suspect or showing signs of manipulation; an EPA letter raised concerns about a far larger share in parts of the site. In August 2026 a federal judge approved a $57 million settlement of the government's False Claims Act claims; the company did not admit liability, and the settlement does not resolve a separate suit by homeowners.",

/**
 * Training programmes: the ordered sets of stations a hall actually buys.
 *
 * A station on its own teaches one procedure. What a training director runs
 * is a programme — a first-period apprentice block, a confined-space
 * qualification, a fall-protection refresher — with an order, a reason for
 * each station being in it, and a completion rule they can show a regulator.
 * This file is that layer. It holds no scoring of its own: a station counts
 * toward a programme when the shared training record says it was passed
 * (two or more stars, no unsafe action), which is the same bar the
 * certificate claim rests on.
 *
 * Stations are named by app and id so a programme can cross SmartCiti.X and
 * the Trade Skills Simulator, which is what a real apprenticeship does.
 * `tools/check_smartcity.mjs` fails the build if any id here does not exist.
 */

const CURRICULA = [
  {
    id: "electrical-first-period",

      { app: "smartcity", id: "pilot-transfer", why: "The harbour pilot brought aboard by ladder in open water, where the transfer itself is the highest-risk minute of the whole call." },
      { app: "smartcity", id: "mooring-line", why: "Taking the lines that hold the ship to all of this: snap-back zones and the bight nobody stands in." },
    ],
  },
];

/**
 * Progress for one programme against the shared training record.
 * `records` is TrainingRecords.list(); a station counts when it has a
 * passing attempt (two or more stars, no unsafe action).
 */
function curriculumProgress(curriculum, records = []) {
  const passed = new Set(records.filter((r) => r.passed).map((r) => r.simId));
  const stations = curriculum.stations.map((s) => ({ ...s, done: passed.has(s.id) }));
  const done = stations.filter((s) => s.done).length;
  const next = stations.find((s) => !s.done) ?? null;
  // How the learner has handled the interruptions in this programme's
  // stations. A block built on noticing things needs to be reportable on
  // noticing things, not only on whether the procedure underneath was passed.
  const ids = new Set(curriculum.stations.map((s) => s.id));
  let caught = 0, dropped = 0, runs = 0;
  for (const r of records) {
    const iv = r.debrief?.interrupts;
    if (!iv || !ids.has(r.simId)) continue;
    runs += 1;
    caught += iv.answered | 0;
    dropped += (iv.missed | 0) + (iv.wrong | 0);
  }
  const attention = runs
    ? { runs, caught, dropped, pct: caught + dropped ? Math.round((caught / (caught + dropped)) * 100) : null }
    : null;
  return {
    attention,
    id: curriculum.id, name: curriculum.name, union: curriculum.union,
    certification: curriculum.certification, summary: curriculum.summary, accent: curriculum.accent,
    stations, done, total: stations.length,
    pct: stations.length ? Math.round((done / stations.length) * 100) : 0,
    complete: done === stations.length && stations.length > 0,
    next,
  };
}

/** Every programme's progress, most-advanced-but-unfinished first. */
function allProgress(records = []) {
  return CURRICULA.map((c) => curriculumProgress(c, records))
    .sort((a, b) => (a.complete === b.complete ? b.pct - a.pct : a.complete ? 1 : -1));
}


/* ===== smartcity/js/scenarios.js ===== */
// User-created scenarios: let a learner or instructor build their own drill
// out of a real simulator's real steps, and run it through the exact same
// procedure engine that scores every built-in SmartCiti.X station.
//
// A custom scenario never invents new 3D content or new hazards — it curates
// and reorders the *existing* steps of one base simulator (the station it was
// built from is what gets constructed and walked). That keeps every custom
// drill grounded in an authored, reviewed procedure instead of arbitrary
// user-typed text standing in for real training content, and it means the
// engine, the hazards, the gamified rank system and the 3D station all keep
// working exactly as they already do — nothing new to verify there.

const SCENARIO_STORE_KEY = "smartcity-custom-scenarios-v1";
const MAX_SCENARIOS = 30;

/**
 * Local-only library of custom scenario descriptors. A descriptor is plain
 * data (never functions), so it survives localStorage round-tripping:
 * { id, baseId, name, tagline, stepIds, parSeconds, createdAt }
 */
const CustomScenarios = {
  list() {
    try {
      const raw = JSON.parse(localStorage.getItem(SCENARIO_STORE_KEY) || "[]");
      return Array.isArray(raw) ? raw : [];
    } catch (_) { return []; }
  },

  get(id) { return this.list().find((e) => e.id === id) ?? null; },

  save(entry) {
    const all = this.list();
    const i = all.findIndex((e) => e.id === entry.id);
    if (i >= 0) all[i] = entry;
    else all.push(entry);
    // Oldest-first eviction rather than a hard refusal once the shelf is full —
    // a local library should keep working, not block a save with an error.
    while (all.length > MAX_SCENARIOS) all.shift();
    try { localStorage.setItem(SCENARIO_STORE_KEY, JSON.stringify(all)); } catch (_) { /* ignore */ }
    return entry;
  },

  remove(id) {
    const all = this.list().filter((e) => e.id !== id);
    try { localStorage.setItem(SCENARIO_STORE_KEY, JSON.stringify(all)); } catch (_) { /* ignore */ }
  },
};

/** A short, collision-safe id with no dependency on crypto.randomUUID. */
function newScenarioId() {
  return `${Date.now().toString(36)}-${Math.random().toString(36).slice(2, 8)}`;
}

/**
 * The par time a drill gets when its author leaves "Par time" blank: the
 * base sim's own par, scaled down by how much of the procedure survived the
 * cut. Shared by buildCustomRoom() (the room that's actually played) and
 * app.js's customRoomMeta() (the hub-card/roster preview of that same room)
 * so the two can never quote a different number for the same drill. Takes
 * plain counts rather than the base sim object itself: customRoomMeta()
 * only ever has the lightweight SIMS_META entry (a `stepCount` number, no
 * `steps` array), while buildCustomRoom() has the fully-loaded sim module.
 */
function estimateParSeconds(baseParSeconds, totalSteps, keptSteps) {
  const fraction = totalSteps ? keptSteps / totalSteps : 1;
  return Math.max(45, Math.round(baseParSeconds * fraction));
}

/**
 * Build a full room-shaped object from a base simulator plus a scenario
 * descriptor. The result is a real drop-in room: same build() (so the same
 * 3D station, the same interactables, the same hazards), same gamified
 * system (so it ranks and pays out in that trade's own currency), but with
 * `steps` narrowed and reordered to whatever the author kept. `Session`,
 * `Progress`, the hub and the leaderboard never need to know a room is
 * custom — they only ever see the shape they already understand.
 */
function buildCustomRoom(baseSim, entry) {
  const byId = new Map(baseSim.steps.map((s) => [s.id, s]));
  const steps = entry.stepIds.map((id) => byId.get(id)).filter(Boolean);
  return {
    ...baseSim,
    id: `custom:${entry.id}`,
    index: "★",
    domain: "Custom",
    name: entry.name,
    title: `${entry.name} — Custom Drill`,
    tagline: entry.tagline?.trim() || `A custom drill built from ${baseSim.name}: ${steps.length} of ${baseSim.steps.length} steps.`,
    parSeconds: entry.parSeconds ?? estimateParSeconds(baseSim.parSeconds, baseSim.steps.length, steps.length),
    steps,
    isCustom: true,
    baseId: baseSim.id,
    baseName: baseSim.name,
    build: (root) => baseSim.build(root),
  };
}

// The district selector. Twenty simulators, each its own gamified system, laid
// out as kiosks around a plaza. Selecting one starts that simulator's own
// AR/VR/flat session; the kiosk shows that system's own rank and currency,
// never a shared platform score, because there isn't one.

/** Clip a single line to `maxWidth` with an ellipsis, using the context's current font. */
function fitText(g, text, maxWidth) {
  let s = String(text);
  if (g.measureText(s).width <= maxWidth) return s;
  while (s.length > 1 && g.measureText(s + "…").width > maxWidth) s = s.slice(0, -1);
  return s.trimEnd() + "…";
}

function buildHub(root, sims) {
  const hits = {};
  const reg = (obj, id) => { markInteractive(obj, id); hits[id] = obj; return obj; };
  // Scale the ring so kiosk spacing stays roughly constant as the roster grows —
  // 6.4 was tuned for 10 kiosks; keep that floor so a smaller roster never crowds.
  const R = Math.max(6.4, sims.length * 0.4);

  // Atrium floor: the same cast-concrete paving as the plaza, with a
  // deck-plate walk ring under the kiosks so the selector lane reads as a
  // different, tougher surface than the paving inside it.
  const floor = cyl(root, R + 1.8, R + 1.8, 0.2, 0, -0.1, 0, 0x0d1319, { rough: 0.4, metal: 0.2, seg: 64 });
  floor.material = texturedMat(
    surfaceTexture((cx, w, h) => pavingFace(cx, w, h, { tiles: 4, base: "#161e27", base2: "#111820" }), { repeat: 6, px: 512 }),
    { rough: 0.9, metal: 0.04, color: 0xd6dbe1 });
  floor.receiveShadow = true;
  const lane = cyl(root, R + 0.9, R + 0.9, 0.03, 0, 0.012, 0, 0x232b33, { rough: 0.6, metal: 0.5, seg: 64, cast: false });
  lane.material = texturedMat(surfaceTexture((cx, w, h) => deckPlateFace(cx, w, h), { repeat: 16, px: 256 }),
    { rough: 0.55, metal: 0.55, color: 0xcfd6dd });
  lane.receiveShadow = true;
  cyl(root, R - 1.1, R - 1.1, 0.035, 0, 0.018, 0, 0x121920, { rough: 0.9, metal: 0.05, seg: 64, cast: false })
    .material = texturedMat(surfaceTexture((cx, w, h) => pavingFace(cx, w, h, { tiles: 3, base: "#1b232c", base2: "#161d25" }), { repeat: 4, px: 512 }),
      { rough: 0.9, metal: 0.04, color: 0xd0d6dc });
  torus(root, R - 1.0, 0.03, 0, 0.04, 0, CITY.accent,

      box(kiosk, 0.02, 1.84, 0.02, sx * 0.535, 1.04, 0.1, sim.accent, { emissive: sim.accent, ei: 1.3, rough: 0.4, cast: false });

    const indexBadge = decal(kiosk, 0.3, 0.3, -0.3, 1.7, 0.1, () => {}, { px: 256, glow: true, ei: 0.7 });
    const sign = decal(kiosk, 0.94, 0.7, 0.02, 1.15, 0.1, () => {}, { px: 512, glow: true, ei: 0.6 });
    const record = decal(kiosk, 0.94, 0.44, 0, 0.4, 0.1, () => {}, { px: 512, glow: true, ei: 0.5 });
    doorFaces[sim.id] = { indexBadge, sign, record, sim };

    const spot = cyl(kiosk, 0.7, 0.7, 0.008, 0, 0.012, 0.6, sim.accent,

    reg(box(kiosk, 1.1, 2.0, 0.5, 0, 1.0, 0.2, 0x000000, { opacity: 0.001, transparent: true, cast: false }),

        g.fillStyle = "#8fb3c4";

        g.fillText(sim.name.toUpperCase(), w / 2, h * 0.37);
        g.fillStyle = accentCss;
        g.font = `${Math.round(h * 0.095)}px Arial, sans-serif`;
        g.fillText(sim.trade, w / 2, h * 0.58);
        // The real union + credential for this trade, split at the em dash so
        // the union sits on its own line and the credential is clipped to fit.
        const [union, credential] = String(sim.certification ?? "").split(" — ");
        g.fillStyle = "#c9dbe6";

        g.fillStyle = "#6d8296";
        g.font = `${Math.round(h * 0.07)}px Arial, sans-serif`;
        g.fillText(fitText(g, credential ?? "", w * 0.92), w / 2, h * 0.87);
      });
      const rank = Progress.simRank(sim.id, sim.game);
      const state = Progress.roomState(sim.id);
      repaint(record, (g, w, h) => {
        g.fillStyle = "rgba(10,16,22,0.9)"; g.fillRect(0, 0, w, h);
        g.fillStyle = accentCss; g.fillRect(0, 0, 5, h);
        g.textAlign = "left"; g.textBaseline = "middle";
        g.fillStyle = "#8fb3c4";
        g.font = `600 ${Math.round(h * 0.11)}px 'Barlow Condensed', Arial, sans-serif`;
        g.fillText(sim.game?.system?.toUpperCase() ?? "PROGRESS", w * 0.07, h * 0.16);
        g.fillStyle = "#eaf6fb";
        g.font = `600 ${Math.round(h * 0.2)}px 'Barlow Condensed', Arial, sans-serif`;
        g.fillText(rank.name.toUpperCase(), w * 0.07, h * 0.42);
        g.fillStyle = accentCss;
        g.font = `600 ${Math.round(h * 0.13)}px 'Barlow Condensed', Arial, sans-serif`;
        g.textAlign = "right";
        g.fillText(`${rank.xp} ${sim.game?.currency ?? "XP"}`, w * 0.93, h * 0.42);
        g.textAlign = "left";
        g.fillStyle = "#1d2833"; g.fillRect(w * 0.07, h * 0.58, w * 0.86, h * 0.08);
        g.fillStyle = accentCss;
        g.fillRect(w * 0.07, h * 0.58, w * 0.86 * (rank.max ? 1 : Math.max(0.02, rank.into / Math.max(1, rank.span))), h * 0.08);
        g.fillStyle = "#8fb3c4";
        g.font = `${Math.round(h * 0.095)}px Arial, sans-serif`;
        const stars = "★".repeat(state.stars) + "☆".repeat(3 - state.stars);
        g.fillText(state.runs ? `${stars}  best ${state.best}` : "not attempted", w * 0.07, h * 0.78);
        const badgeCount = state.badges?.length ?? 0;
        g.fillText(badgeCount ? `${badgeCount} badge${badgeCount === 1 ? "" : "s"} earned` : "no badges yet", w * 0.07, h * 0.92);
      });
    }
  }
  paintKiosks();

  const key = new THREE.DirectionalLight(0xdbe6f2, 0.85);
  key.position.set(3, 8, 4);
  key.castShadow = true;
  key.shadow.mapSize.set(2048, 2048);
  key.shadow.camera.left = -10; key.shadow.camera.right = 10;
  key.shadow.camera.top = 10; key.shadow.camera.bottom = -10;
  key.shadow.bias = -0.0008;
  root.add(key);
  root.add(new THREE.HemisphereLight(0xa9c0d6, 0x2a323b, 2.0));
  root.add(new THREE.AmbientLight(0xb8c8d8, 0.4));
  const rim = new THREE.DirectionalLight(0x6fb8ff, 0.3);
  rim.position.set(-4, 5, -7);
  root.add(rim);

  return {
    hits,
    isHub: true,
    spawnLook: new THREE.Vector3(0, 1.5, 0),
    refresh() { paintKiosks(); },
    animate(t) {
      beacon.material.emissiveIntensity = 2.0 + Math.sin(t * 1.5) * 0.7;
      beacon.position.y = 1.35 + Math.sin(t * 0.8) * 0.04;
      halo.rotation.z = t * 0.4;
      halo.position.y = beacon.position.y;
    },
  };
}


/* ===== smartcity/js/store.js ===== */
/**
 * A minimal reactive store — just enough pub-sub to let app.js (the Three.js
 * engine) hand its UI state to react-ui.js (the 2D chrome) without either
 * side reaching into the other's DOM. Every write replaces the whole state
 * object (or a named slice of it) so React's useSyncExternalStore can tell
 * "changed" from "same" with a plain reference check.
 */
function createStore(initial) {
  let state = initial;
  const subs = new Set();

  function get() {
    return state;
  }

  function set(patch) {
    state = typeof patch === "function" ? patch(state) : { ...state, ...patch };
    for (const fn of subs) fn(state);
  }

  /** Shallow-merge `partial` (or the object a function of the previous slice
   * returns) into the named top-level slice, e.g. "hud". */
  function patch(key, partial) {
    const prev = state[key];
    const delta = typeof partial === "function" ? partial(prev) : partial;
    set({ [key]: { ...prev, ...delta } });
  }

  function subscribe(fn) {
    subs.add(fn);
    return () => subs.delete(fn);
  }

  return { get, set, patch, subscribe };
}

// The 20 sims are lazy-loaded: SIMS_META (see tools/gen_sims_meta.mjs) is the
// small, always-available metadata every display surface (hub kiosks,
// leaderboards, the tour, the editor's base-simulator picker) actually needs;
// a sim's real module — its steps, hazards and build() — is only fetched via
// loadSim() the moment a player actually enters it. This is why
// dist/smartcity-x.html ships as a folder (index.html + sims/ + citykit.js +
// gamify.js) rather than one self-contained file: see tools/bundle_webxr.py.
const SIMS_META_BY_ID = Object.fromEntries(SIMS_META.map((s) => [s.id, s]));
// Crew tags and custom-scenario names are learner-typed text that ends up
// inside HTML template strings (results card, leaderboards) rendered via
// react-ui.js's dangerouslySetInnerHTML — escape before interpolating so a
// tag like `<b>` typed as a crew name renders literally instead of as
// markup on a shared kiosk's next screen.
const AR_DIORAMA_SCALE = 0.34; // tabletop scale so a 2 m station fits on a desk

const simModuleCache = new Map();
function loadSim(id) {
  if (simModuleCache.has(id)) return simModuleCache.get(id);
  const exportName = `SIM_${id.toUpperCase().replace(/-/g, "_")}`;
  const promise = import(`./sims/${id}.js`).then((mod) => mod[exportName]);
  simModuleCache.set(id, promise);
  return promise;
}

// The 20 built-in stations plus whatever the learner has built in the
// scenario editor — the hub, the leaderboard and every sim lookup work off
// this combined roster so a custom drill is a first-class citizen everywhere
// a built-in one is, with zero special-casing downstream. This is metadata
// only (never a custom room's full steps/build) — see loadSim()/findSim()
// for what actually runs a station.
// Cached rather than rebuilt on every call: this is read on every HUD sync —
// several times a second during an active run with combos and streaks
// firing. Invalidated only where the roster can actually change: saving or
// deleting a custom scenario.
let allSimsCache = null;
function invalidateSimsCache() { allSimsCache = null; }
function customRoomMeta(entry) {
  const base = SIMS_META_BY_ID[entry.baseId];
  if (!base) return null;
  return {
    ...base,
    id: `custom:${entry.id}`,
    index: "★",
    domain: "Custom",
    name: entry.name,
    title: `${entry.name} — Custom Drill`,
    tagline: entry.tagline?.trim() || `A custom drill built from ${base.name}: ${entry.stepIds.length} of ${base.stepCount} steps.`,
    parSeconds: entry.parSeconds ?? estimateParSeconds(base.parSeconds, base.stepCount, entry.stepIds.length),
    isCustom: true,
    baseId: base.id,
    baseName: base.name,
  };
}
function allSims() {
  if (!allSimsCache) allSimsCache = [...SIMS_META, ...CustomScenarios.list().map(customRoomMeta).filter(Boolean)];
  return allSimsCache;
}
/** True the instant a real or custom sim COULD be entered, with no fetch —
 * used to decide hub-vs-enter before actually awaiting findSim(). */
function simExists(id) {
  if (SIMS_META_BY_ID[id]) return true;
  if (typeof id === "string" && id.startsWith("custom:")) {
    const entry = CustomScenarios.get(id.slice(7));
    return !!(entry && SIMS_META_BY_ID[entry.baseId]);
  }
  return false;
}
async function findSim(id) {
  if (SIMS_META_BY_ID[id]) return loadSim(id);
  if (typeof id === "string" && id.startsWith("custom:")) {
    const entry = CustomScenarios.get(id.slice(7));
    if (!entry) return null;
    const base = await loadSim(entry.baseId);
    if (!base) return null;
    return buildCustomRoom(base, entry);
  }
  return null;
}

// ---------------------------------------------------- interruption alarm
// An interruption arrives mid-step and runs on its own clock (see the
// interrupt layer in shared/game.js). It gets its own loud banner rather
// than the feedback rail, because the whole point is that it is not part of
// the step the learner is working on.
const alarmEl = {
  root: document.getElementById("alarm"),
  kind: document.getElementById("alarm-kind"),
  left: document.getElementById("alarm-left"),
  body: document.getElementById("alarm-body"),
  cue: document.getElementById("alarm-cue"),
  fill: document.getElementById("alarm-fill"),
};
function showAlarm(it) {
  if (!alarmEl.root) return;
  alarmEl.kind.textContent = it.kind ?? "Interruption";
  alarmEl.body.textContent = it.alert ?? "";
  alarmEl.cue.textContent = it.cue ?? "Deal with it now — the procedure can wait.";
  alarmEl.left.textContent = `${Math.ceil(it.seconds ?? 12)}s`;
  alarmEl.fill.style.width = "100%";
  alarmEl.root.hidden = false;
}
function hideAlarm() { if (alarmEl.root) alarmEl.root.hidden = true; }
function syncAlarm(s) {
  const it = s?.activeInterrupt;
  if (!it || !alarmEl.root || alarmEl.root.hidden) return;
  const total = it.seconds ?? 12;
  const left = Math.max(0, it.left ?? total);
  alarmEl.left.textContent = `${Math.ceil(left)}s`;
  alarmEl.fill.style.width = `${Math.max(0, (left / total) * 100).toFixed(1)}%`;
}

function syncHud() {
  const s = state.session;
  if (!s) {
    store.patch("hud", {
      room: "SMARTCITI.X",
      step: "Choose a station",
      cue: "Select a kiosk to start that station's procedure and rank ladder.",
      score: "----", comboText: `LV ${Progress.level} · ${Progress.levelName.toUpperCase()}`, comboHot: false, comboFire: false,
      count: `${Progress.roomsClearedIn(allSims().map((s) => s.id))}/${allSims().length} CLEARED`,
      fillPct: (Progress.roomsClearedIn(allSims().map((s) => s.id)) / allSims().length) * 100,
      timer: "",
      gestureVisible: false,
    });
    vrHudDirty = true;
    return;
  }
  const rank = Progress.simRank(s.room.id, s.room.game);
  const secs = Math.floor(s.elapsed);
  const patch = {
    room: state.tour ? `TOUR ${state.tour.i + 1}/${SIMS_META.length} · ${s.room.title.toUpperCase()}` : s.room.title.toUpperCase(),
    score: String(Math.round(s.score)).padStart(4, "0"),
    comboText: s.comboLabel ? `${s.comboLabel.toUpperCase()} ×${s.combo.toFixed(1)}` : rank.name,
    comboHot: s.streak >= 4,
    comboFire: s.combo >= 1.8,
    count: `STEP ${Math.min(s.index + 1, s.steps.length)}/${s.steps.length}`,
    fillPct: s.progress01 * 100,
    timer: `${String(Math.floor(secs / 60)).padStart(2, "0")}:${String(secs % 60).padStart(2, "0")} / ${
      String(Math.floor(s.room.parSeconds / 60)).padStart(2, "0")}:${String(s.room.parSeconds % 60).padStart(2, "0")}`,
  };
  const step = s.step;
  if (step) {
    let cue = step.cue;
    if (step.kind === "sequence" || step.kind === "find") cue += `  (${s.sequence.length}/${step.targets.length})`;
    if (step.kind === "hold" || step.kind === "track") cue += `  (${s.holdFor.toFixed(1)}s / ${step.seconds}s)`;
    if (step.kind === "turn" && s.turn) cue += `  (${Math.round((s.turn.amount / s.turn.required) * 100)}%)`;
    const hint = GESTURE_HINTS[step.kind];
    patch.step = step.title;
    patch.cue = cue;
    patch.gestureVerb = hint?.verb ?? "";
    patch.gestureVisible = !!hint;

  store.patch("hud", patch);

}

const GESTURE_SEEN_KEY = "smartcity-gestures-seen";
