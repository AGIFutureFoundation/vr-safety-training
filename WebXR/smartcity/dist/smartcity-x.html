      a.href = url; a.download = `perf-log-${new Date().toISOString().slice(0, 10)}.json`; document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    });
    document.body.appendChild(overlay);
    return overlay;
  },
  LOG_KEY,
};


/* ===== shared/weather.js ===== */
// Weather for the plaza. Every station declares the conditions its procedure
// is actually written for — a wet-weather stormwater grab happens in rain, a
// scaffold lift happens in wind, an aerial set happens in the dark — and the
// stage builds them. `?weather=` overrides for a hall that wants to drill a
// crew in conditions the station does not default to.
//
// Each kind carries an operational note: what the weather means for the work,
// shown to the learner with the station's tagline. That is the point of the
// layer. A rain shader is decoration; "the deck is slick and the runoff is
// the sample" is training.
//
// Everything here is a few hundred recycled points and a couple of planes,
// animated by property writes, so a headset pays almost nothing for it. AR
// mode gets none of it: the learner's own room is the weather there.

const WEATHER_KINDS = ["clear", "overcast", "rain", "fog", "wind", "storm", "smoke"];

const WEATHER = {
  clear: {
    label: "Clear",
    note: "Clear and still — nothing in the conditions is working against the procedure today.",
    fog: 1, light: 1, drops: 0, gust: 0, wet: 0, sky: 1,
  },
  overcast: {
    label: "Overcast",
    note: "Overcast and flat — colour cues and small print are harder to read than the plan assumes.",
    fog: 0.85, light: 0.8, drops: 0, gust: 0.2, wet: 0.1, sky: 0.9,
  },
  rain: {
    label: "Rain",
    note: "Steady rain — footing is slick, anything on the deck is going somewhere, and paper gets useless fast.",
    fog: 0.7, light: 0.72, drops: 900, gust: 0.35, wet: 0.55, sky: 0.8,
  },
  fog: {
    label: "Fog",
    note: "Thick fog — hand signals stop working at the distance the plan assumes, so everything moves on the radio.",
    fog: 0.34, light: 0.85, drops: 0, gust: 0.1, wet: 0.25, sky: 1.25,
  },
  wind: {
    label: "High wind",
    note: "Sustained wind with gusts — load charts derate, anything with a face on it becomes a sail, and dropped objects travel.",
    fog: 0.95, light: 0.95, drops: 0, gust: 1, wet: 0, sky: 1,
  },
  storm: {
    label: "Storm",
    note: "Driving rain and gusting wind — this is the condition most procedures say to stop for, so the call to keep going is part of the task.",
    fog: 0.55, light: 0.62, drops: 1400, gust: 1.2, wet: 0.7, sky: 0.7,
  },
  // Wildfire smoke: the air itself is the hazard. The sky and the fog take
  // the plume's colour, ash drifts down, and the sun is a dim orange disc.
  // The note carries the rule a crew actually works to.
  smoke: {
    label: "Wildfire smoke",
    note: "Wildfire smoke — the AQI decides the shift: under Cal/OSHA's wildfire smoke rule, respirators are offered when PM2.5 reaches an AQI of 151 and required above 500, and every instrument on site is reading the plume, not the work.",
    fog: 0.42, light: 0.66, drops: 0, gust: 0.25, wet: 0, sky: 0.8, tint: 0x8a5a33, ash: 240,
  },
};

/** The station's own conditions, unless the URL asks for something else. */
function weatherFor(stationWeather) {
  const q = typeof location !== "undefined" ? new URLSearchParams(location.search).get("weather") : null;
  if (q && WEATHER_KINDS.includes(q)) return q;
  return WEATHER_KINDS.includes(stationWeather) ? stationWeather : "clear";
}

/** A falling-and-recycling point cloud over a box around the plaza. */
function rainfall(parent, count, { spread = 34, height = 16, speed = 22, slant = 0, colour = 0x9fc6e0, size = 0.055 } = {}) {
  const positions = new Float32Array(count * 3);
  const fall = new Float32Array(count);
  for (let i = 0; i < count; i++) {
    positions[i * 3] = (Math.random() - 0.5) * spread;
    positions[i * 3 + 1] = Math.random() * height;
    positions[i * 3 + 2] = (Math.random() - 0.5) * spread;
    fall[i] = speed * (0.75 + Math.random() * 0.5);
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute("position", new THREE.BufferAttribute(positions, 3));
  const mat = new THREE.PointsMaterial({ color: colour, size, transparent: true, opacity: 0.62, depthWrite: false, sizeAttenuation: true });
  mat.userData.ownMaterial = true;
  const pts = new THREE.Points(geo, mat);
  pts.frustumCulled = false;
  parent.add(pts);
  pts.userData.step = (dt, gust) => {
    for (let i = 0; i < count; i++) {
      positions[i * 3 + 1] -= fall[i] * dt;
      positions[i * 3] += (slant + gust) * dt * 3;
      if (positions[i * 3 + 1] < 0) {
        positions[i * 3 + 1] = height;
        positions[i * 3] = (Math.random() - 0.5) * spread;
        positions[i * 3 + 2] = (Math.random() - 0.5) * spread;
      } else if (Math.abs(positions[i * 3]) > spread / 2) {
        positions[i * 3] = -Math.sign(positions[i * 3]) * spread / 2;
      }
    }
    geo.attributes.position.needsUpdate = true;
  };
  return pts;
}

/** Wind-borne dust and litter: slow horizontal streaks at working height. */
function windborne(parent, count = 90, { spread = 26 } = {}) {
  const positions = new Float32Array(count * 3);
  for (let i = 0; i < count; i++) {
    positions[i * 3] = (Math.random() - 0.5) * spread;
    positions[i * 3 + 1] = 0.2 + Math.random() * 4.5;
    positions[i * 3 + 2] = (Math.random() - 0.5) * spread;
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute("position", new THREE.BufferAttribute(positions, 3));
  const mat = new THREE.PointsMaterial({ color: 0xcdbfa6, size: 0.07, transparent: true, opacity: 0.35, depthWrite: false, sizeAttenuation: true });
  mat.userData.ownMaterial = true;
  const pts = new THREE.Points(geo, mat);
  pts.frustumCulled = false;
  parent.add(pts);
  pts.userData.step = (dt, gust) => {
    for (let i = 0; i < count; i++) {
      positions[i * 3] += (2.2 + gust * 5) * dt;
      positions[i * 3 + 1] += Math.sin(positions[i * 3] * 0.7 + i) * dt * 0.25;
      if (positions[i * 3] > spread / 2) { positions[i * 3] = -spread / 2; positions[i * 3 + 2] = (Math.random() - 0.5) * spread; }
    }
    geo.attributes.position.needsUpdate = true;
  };
  return pts;
}

/**
 * Build the weather over a plaza.
 *   parent  a group inside the stage (freed with it)
 *   scene   for the fog, which the caller has already set for time of day
 *   kind    one of WEATHER_KINDS
 * Returns { animate(t, dt), gustAt(t), label, note, lightScale, kind }.
 */
function buildWeather(parent, scene, kind = "clear") {
  const w = WEATHER[WEATHER_KINDS.includes(kind) ? kind : "clear"];
  const g = new THREE.Group();
  parent.add(g);

  if (scene?.fog && w.fog !== 1) {
    scene.fog.near *= w.fog;
    scene.fog.far *= w.fog;
  }
  if (scene?.background?.isColor && w.sky !== 1) {
    scene.background.multiplyScalar(w.sky);
  }
  // A tinted kind pulls the sky and the fog toward the plume's colour, so
  // the horizon reads as smoke rather than as an evening.
  if (w.tint !== undefined) {
    const tint = new THREE.Color(w.tint);
    if (scene?.background?.isColor) scene.background.lerp(tint, 0.55);
    if (scene?.fog?.color) scene.fog.color.lerp(tint, 0.6);
  }

  // Wet deck: a dark, very reflective disc just above the plaza so the lights
  // and the station's accent smear across it the way they do on a wet apron.
  let wet = null;
  if (w.wet > 0) {
    const geo = new THREE.CircleGeometry(14.8, 48);
    const mat = new THREE.MeshStandardMaterial({ color: 0x0a1016, roughness: 0.08, metalness: 0.9, transparent: true, opacity: w.wet * 0.75, depthWrite: false });
    mat.userData.ownMaterial = true;
    wet = new THREE.Mesh(geo, mat);
    wet.rotation.x = -Math.PI / 2;
    wet.position.y = 0.062;
    g.add(wet);
  }

  const drops = w.drops > 0 ? rainfall(g, w.drops, { speed: kind === "storm" ? 28 : 20, slant: kind === "storm" ? 1.4 : 0.5, size: kind === "storm" ? 0.075 : 0.062 }) : null;
  const dust = w.gust >= 0.8 ? windborne(g) : null;
  // Ash: the same recycling cloud as rain, falling slowly, pale, and few.
  const ash = w.ash > 0 ? rainfall(g, w.ash, { speed: 1.1, slant: 0.25, colour: 0xd9d1c4, size: 0.05, height: 12 }) : null;
  if (w.tint !== undefined) {
    const sun = new THREE.DirectionalLight(0xff9a4a, 0.55);
    sun.position.set(8, 6, -14);
    g.add(sun);
  }

  // A cold overhead fill so a rainy or foggy plaza reads as weather rather
  // than as an under-lit scene.
  if (w.light < 0.95) {
    const damp = new THREE.HemisphereLight(0x9fb4c6, 0x1a222c, (1 - w.light) * 2.4);
    g.add(damp);
  }
  // Lightning on a storm: one shared flash light, dark except when it fires.
  let flash = null, nextFlash = 3 + Math.random() * 6, flashFor = 0;
  if (kind === "storm") {
    flash = new THREE.DirectionalLight(0xdfeaf2, 0);
    flash.position.set(-6, 14, -10);
    g.add(flash);
  }

  const gustAt = (t) => w.gust === 0 ? 0 : w.gust * (0.55 + Math.sin(t * 0.7) * 0.25 + Math.sin(t * 2.3) * 0.2);

  return {
    kind: WEATHER_KINDS.includes(kind) ? kind : "clear",
    label: w.label,
    note: w.note,
    lightScale: w.light,
    gustAt,
    root: g,
    animate(t, dt) {
      const gust = gustAt(t);
      if (drops) drops.userData.step(dt, gust);
      if (dust) dust.userData.step(dt, gust);
      if (ash) ash.userData.step(dt, gust);
      if (wet) wet.material.opacity = w.wet * (0.62 + Math.sin(t * 0.8) * 0.08);
      if (flash) {
        if (flashFor > 0) {
          flashFor -= dt;
          flash.intensity = flashFor > 0 ? 2.2 + Math.random() * 1.6 : 0;
        } else {
          nextFlash -= dt;
          if (nextFlash <= 0) { flashFor = 0.12 + Math.random() * 0.12; nextFlash = 5 + Math.random() * 12; }
        }
      }
    },
  };
}


/* ===== shared/environment.js ===== */
// Real-world environments: a licensed GLB — a scanned street, a modelled
// terminal, a surveyed shoreline — placed around a station in place of the
// generated district. The loader is three's own GLTFLoader, fetched on
// demand from the repository's own vendored copy, so a station that never
// declares an environment pays nothing for the feature. The page carries an
// import map for "three" so the loader shares the app's own three instance.
//
// A station declares
//   environment: { url: "assets/env/terminal.glb", scale: 1, position: [0, 0, 0],
//                  rotationY: 0, skyline: false, district: false }
// with the url relative to WebXR/. `?env=<url>` (with `envScale`, `envY`,
// `envRy`) previews any file against any station without editing it —
// which is how a model is judged before it is committed.
//
// Licensing is not the loader's job, but it is the reason the assets
// directory has a README: nothing goes in it without a licence that allows
// redistribution and an attribution line. Game rips are not that.

// three's GLTFLoader, vendored under WebXR/vendor (MIT) rather than fetched
// from a CDN, so the only network dependency stays the one three fetch every
// app already makes. Resolved against the WebXR root the same way assets are.
const LOADER_PATH = "vendor/three/examples/jsm/loaders/GLTFLoader.js";
let loaderModule = null;

/** The WebXR root for the page asking: the source page sits one directory
 *  below it and the bundled page two. */
function webxrBase() {
  const here = typeof document !== "undefined" ? document.baseURI : "";
  const m = here.match(/^(.*\/)(smartcity|trades|holodeck|instructor)\//);
  return m ? m[1] : (here ? new URL("../", here).href : "");
}

/** The environment a room asks for, or the one the URL asks to preview. */
function environmentFor(room) {
  const q = typeof location !== "undefined" ? new URLSearchParams(location.search) : null;
  const url = q?.get("env");
  if (url) {
    return {
      url, scale: Number(q.get("envScale") ?? 1) || 1,
      position: [0, Number(q.get("envY") ?? 0) || 0, 0],
      rotationY: Number(q.get("envRy") ?? 0) || 0,
      skyline: q.get("envSkyline") === "1", district: q.get("envDistrict") === "1",
    };
  }
  return room?.environment ?? null;
}

/**
 * Load a GLB around the station.
 *   parent  the stage's root group, so the model is freed with the stage
 *   spec    the environment declaration (see above)
 *   stage   the stage handle, whose named "skyline" and "district" groups
 *           are hidden unless the spec keeps them
 * Resolves to the model's root group, or rejects with a readable error.
 */
async function loadEnvironment(parent, spec, stage = null) {
  if (!spec?.url) throw new Error("environment needs a url");
  console.info(`[environment] loading ${spec.url}`);
  const base = webxrBase();
  loaderModule ??= await import(spec.loader ?? resolveUrl(LOADER_PATH, base));
  const loader = new loaderModule.GLTFLoader();
  const href = resolveUrl(spec.url, base);
  console.info(`[environment] fetching ${href}`);
  const gltf = await new Promise((resolve, reject) => loader.load(href, resolve, undefined, (e) => reject(new Error(`environment "${spec.url}" failed to load: ${e?.message ?? e}`))));
  console.info(`[environment] loaded ${spec.url}`);
  const root = gltf.scene;
  root.name = "environment";
  const s = spec.scale ?? 1;
  root.scale.set(s, s, s);
  const [px = 0, py = 0, pz = 0] = spec.position ?? [];
  root.position.set(px, py, pz);
  root.rotation.y = spec.rotationY ?? 0;
  // Everything the file brought in belongs to this stage and is freed with
  // it; a shared cache would keep a scanned street resident forever.
  root.traverse((o) => {
    if (!o.isMesh) return;
    o.castShadow = false; o.receiveShadow = true;
    const mats = Array.isArray(o.material) ? o.material : [o.material];
    for (const m of mats) { if (m) { m.userData.ownMaterial = true; m.userData.ownTexture = true; } }
  });
  parent.add(root);
  if (stage?.root) {
    const sky = stage.root.getObjectByName("skyline");
    const district = stage.root.getObjectByName("district");
    if (sky && !spec.skyline) sky.visible = false;
    if (district && !spec.district) district.visible = false;
  }
  return root;
}

function resolveUrl(url, base) {
  if (/^(https?:)?\/\//.test(url) || url.startsWith("/") || !base) return url;
  return new URL(url, base).href;
}


/* ===== shared/observer.js ===== */
/**
 * Instructor mode: a live view of a learner's session for the person running
 * the class.
 *
 * Every VR training sale asks for this, and it is the largest single feature
 * in the roadmap's pilot phase. This is the part that needs no server: the
 * learner's app broadcasts its session on a BroadcastChannel, and an
 * instructor console open on the same machine — another tab, another window,
 * a second monitor at the front of the room — receives it and can send notes
 * back. That covers the common case of a hall with a row of laptops or
 * headsets mirrored to one screen.
 *
 * What it does not do is cross the network. A BroadcastChannel is same-origin
 * and same-device by definition. An instructor watching from another machine
 * needs the relay, which is a roadmap item and is not pretended at here; when
 * the app is embedded in an LMS the same events already go to the host page
 * through Identity.emit, which is the other honest path.
 *
 * Nothing is stored. The channel carries what is happening right now, and
 * closing the console loses it; the record of the attempt is the training
 * record, which is a different, durable thing.
 */

const CHANNEL = "smartcitix:instructor";
const OBSERVER_PROTOCOL = 1;

// Learner → instructor.
const EV_HELLO = "hello";       // a session opened (or answered a roll call)
const EV_STATE = "state";       // throttled snapshot: station, step, score
const EV_STEP = "step";         // a step completed
const EV_HAZARD = "hazard";     // an unsafe action, with its consequence
const EV_FINISH = "finish";     // the run ended, with the verdict
const EV_BYE = "bye";           // the session left a station or closed
// Instructor → learner.
const CMD_ROLL = "roll";        // who is out there?
const CMD_NOTE = "note";        // a line to put in front of the learner
const CMD_FREEZE = "freeze";    // pause / resume the session
const LEARNER_EVENTS = [EV_HELLO, EV_STATE, EV_STEP, EV_HAZARD, EV_FINISH, EV_BYE];
const INSTRUCTOR_COMMANDS = [CMD_ROLL, CMD_NOTE, CMD_FREEZE];

const MAX_TEXT = 400;
const clip = (v, n = MAX_TEXT) => (typeof v === "string" ? v.slice(0, n) : v);

/** A stable id for this tab, so one console can tell two learners apart. */
function tabId() {
  return `s-${Math.random().toString(36).slice(2, 8)}${Date.now().toString(36).slice(-4)}`;
}

function openChannel() {
  if (typeof BroadcastChannel !== "function") return null;
  try { return new BroadcastChannel(CHANNEL); } catch (_) { return null; }
}

/**
 * The learner side. `app` is "smartcity" | "trades" | "holodeck".
 * Returns a handle even when BroadcastChannel is missing, so callers never
 * have to branch: every method is then a no-op.
 */
function createBroadcaster(app, { learner = "", station = "", stationName = "" } = {}) {
  const ch = openChannel();
  const id = tabId();
  let last = 0, onCommand = null, closed = false;
  let ctx = { app, learner, station, stationName: stationName || station };

  const post = (kind, data = {}) => {
    if (!ch || closed) return false;
    try { ch.postMessage({ protocol: OBSERVER_PROTOCOL, kind, id, at: Date.now(), ...ctx, ...data }); return true; }
    catch (_) { return false; }
  };

  if (ch) {
    ch.onmessage = (e) => {
      const m = e?.data;
      if (!m || m.protocol !== OBSERVER_PROTOCOL) return;
      if (m.kind === CMD_ROLL) { post(EV_HELLO); return; }
      if (!INSTRUCTOR_COMMANDS.includes(m.kind)) return;
      // A command addressed to one session is ignored by the others.
      if (m.to && m.to !== id) return;
      onCommand?.({ kind: m.kind, text: clip(m.text), on: !!m.on });
    };
  }

  return {
    id,
    get available() { return !!ch; },
    /** Update who and where, and announce it. */
    hello(next = {}) { ctx = { ...ctx, ...next }; return post(EV_HELLO); },
    /** Throttled: the console does not need more than a few frames a second. */
    state(snapshot, { minMs = 500 } = {}) {
      const now = Date.now();
      if (now - last < minMs) return false;
      last = now;
      return post(EV_STATE, snapshot);
    },
    step(data) { return post(EV_STEP, data); },
    hazard(data) { return post(EV_HAZARD, { ...data, note: clip(data?.note) }); },
    finish(data) { return post(EV_FINISH, data); },
    bye() { const ok = post(EV_BYE); return ok; },
    onCommand(fn) { onCommand = typeof fn === "function" ? fn : null; },
    close() { if (closed) return; post(EV_BYE); closed = true; try { ch?.close(); } catch (_) {} },
  };
}

/**
 * The instructor side. `onEvent` receives every learner event; call
 * `roll()` once on open so sessions that started earlier announce themselves.
 */
function createConsole(onEvent) {
  const ch = openChannel();
  if (ch) {
    ch.onmessage = (e) => {
      const m = e?.data;
      if (!m || m.protocol !== OBSERVER_PROTOCOL || !LEARNER_EVENTS.includes(m.kind)) return;
      onEvent?.(m);
    };
  }
  const send = (kind, extra = {}) => {
    if (!ch) return false;
    try { ch.postMessage({ protocol: OBSERVER_PROTOCOL, kind, at: Date.now(), ...extra }); return true; }
    catch (_) { return false; }
  };
  return {
    get available() { return !!ch; },
    roll() { return send(CMD_ROLL); },
    note(to, text) { return send(CMD_NOTE, { to, text: clip(text) }); },
    freeze(to, on) { return send(CMD_FREEZE, { to, on: !!on }); },
    close() { try { ch?.close(); } catch (_) {} },
  };
}

/** Fold a stream of learner events into a roster the console can render. */
function reduceRoster(roster, ev, { staleMs = 45000 } = {}) {
  const next = new Map(roster);
  const prev = next.get(ev.id) ?? { id: ev.id, events: [], hazards: 0, steps: 0 };
  const row = {
    ...prev,
    id: ev.id, app: ev.app ?? prev.app, learner: ev.learner || prev.learner || "Unnamed",
    station: ev.station ?? prev.station, stationName: ev.stationName ?? prev.stationName ?? prev.station,
    at: ev.at,
  };
  if (ev.kind === EV_STATE) {
    Object.assign(row, {
      stepIndex: ev.stepIndex, stepCount: ev.stepCount, stepTitle: ev.stepTitle,
      score: ev.score, stars: ev.stars, errors: ev.errors, hazardHits: ev.hazardHits, seconds: ev.seconds,
      live: true, finished: false,
    });
  }
  if (ev.kind === EV_STEP) { row.steps = (prev.steps ?? 0) + 1; row.live = true; }
  if (ev.kind === EV_HAZARD) {
    row.hazards = (prev.hazards ?? 0) + 1;
    row.events = [...(prev.events ?? []), { at: ev.at, kind: "hazard", text: ev.note ?? ev.hazardId ?? "unsafe action" }].slice(-12);
    row.live = true;
  }
  if (ev.kind === EV_FINISH) {
    Object.assign(row, { finished: true, live: true, passed: !!ev.passed, stars: ev.stars, score: ev.score, seconds: ev.seconds });
    row.events = [...(prev.events ?? []), { at: ev.at, kind: ev.passed ? "pass" : "fail", text: ev.verdict ?? (ev.passed ? "passed" : "not passed") }].slice(-12);
  }
  if (ev.kind === EV_BYE) row.live = false;
  next.set(ev.id, row);
  // Drop rows nothing has been heard from for a while.
  const cutoff = Date.now() - staleMs;
  for (const [k, v] of next) if (!v.live && v.at < cutoff) next.delete(k);
  return next;
}


/* ===== smartcity/js/citykit.js ===== */
// SmartCity.X asset kit — the pieces every station is assembled from.
//
// These stations are authored for augmented reality: each one occupies a small
// footprint the learner walks around in their own room, so the props are
// human-scale and free-standing rather than built into walls. Everything reads
// correctly with passthrough behind it, which is why the holographic elements
// are emissive and the physical equipment is not.

const CITY = {
  accent: 0x4fd1ff,          // SmartCity.X holo cyan
  accentCss: "#4fd1ff",
  holo: 0x7ee6ff,
  violet: 0xa079ff,
  steel: 0x8b949d,
  darkSteel: 0x3c444c,
  case: 0x2a3138,
  hiVis: 0xf2c14b,
  alert: 0xf0645b,
  good: 0x59c97b,
};

// ------------------------------------------------------------ surface textures
//
// Tiling canvas textures for the large flat surfaces (plaza deck, atrium
// floor) that previously read as one flat colour. Generated once per build,
// owned by the material they're attached to (userData.ownTexture/ownMaterial)
// so disposeTree() frees them with the room. Every canvas call is guarded the
// same way kit.js's gradientFill is, so the headless checkers' 2D-context stub
// never throws even though nothing in the checker path actually calls these.

/** A repeating CanvasTexture drawn by `draw(g, w, h)`. */
function surfaceTexture(draw, o = {}) {
  const px = o.px ?? 512;
  const canvas = document.createElement("canvas");
  canvas.width = px; canvas.height = px;
  const g = canvas.getContext("2d");
  draw(g, px, px);
  const tex = new THREE.CanvasTexture(canvas);
  if (THREE.RepeatWrapping !== undefined) { tex.wrapS = THREE.RepeatWrapping; tex.wrapT = THREE.RepeatWrapping; }
  tex.repeat?.set?.(o.repeat ?? 4, o.repeat ?? 4);
  tex.anisotropy = 8;
  if (THREE.SRGBColorSpace !== undefined) tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}

/** A standard material carrying its own (disposable) texture map. */
function texturedMat(tex, o = {}) {
  const m = new THREE.MeshStandardMaterial({
    map: tex, color: o.color ?? 0xffffff, roughness: o.rough ?? 0.85, metalness: o.metal ?? 0.05,
    emissive: o.emissive ?? 0x000000, emissiveIntensity: o.ei ?? 1, emissiveMap: o.glow ? tex : null,
  });
  m.userData.ownMaterial = true;
  m.userData.ownTexture = true;
  return m;
}

/**
 * Cast-concrete plaza paving: a cool base with per-tile tonal variation, a fine
 * grain, saw-cut seam lines on a grid, and a faint lighter chamfer along each
 * seam so tiles read as separate slabs under raking light.
 */
function pavingFace(g, w, h, o = {}) {
  const tiles = o.tiles ?? 4;
  const base = o.base ?? "#1a222b";
  gradientFill(g, w, h, [[0, base], [1, o.base2 ?? "#151c24"]]);
  const t = w / tiles;
  for (let i = 0; i < tiles; i++) {
    for (let j = 0; j < tiles; j++) {
      const v = ((i * 7 + j * 13) % 5) - 2; // deterministic tone jitter per slab
      g.fillStyle = `rgba(${v > 0 ? "255,255,255" : "0,0,0"},${(Math.abs(v) * 0.025).toFixed(3)})`;
      g.fillRect(i * t, j * t, t, t);
    }
  }
  noiseTexture(g, w, h, { density: 2600, alpha: 0.09, tone: "0,0,0" });
  noiseTexture(g, w, h, { density: 1400, alpha: 0.06, tone: "200,220,235" });
  g.fillStyle = o.seam ?? "rgba(0,0,0,0.55)";
  for (let i = 0; i <= tiles; i++) {
    g.fillRect(i * t - 1.5, 0, 3, h);
    g.fillRect(0, i * t - 1.5, w, 3);
  }
  g.fillStyle = "rgba(255,255,255,0.05)";
  for (let i = 0; i <= tiles; i++) {
    g.fillRect(i * t + 1.5, 0, 1.5, h);
    g.fillRect(0, i * t + 1.5, w, 1.5);
  }
}

/**
 * Anti-slip deck plate for walk lanes: darker steel with a raised-dot pattern
 * and a subtle directional brushing.
 */
function deckPlateFace(g, w, h, o = {}) {
  gradientFill(g, w, h, [[0, o.base ?? "#232b33"], [1, o.base2 ?? "#1b222a"]], { horizontal: true });
  noiseTexture(g, w, h, { density: 3000, alpha: 0.07, tone: "0,0,0" });
  const step = o.step ?? 24;
  for (let y = step / 2; y < h; y += step) {
    for (let x = ((y / step) | 0) % 2 ? step / 2 : 0; x < w; x += step) {
      g.fillStyle = "rgba(255,255,255,0.10)";
      g.fillRect(x - 2, y - 2, 4, 4);
      g.fillStyle = "rgba(0,0,0,0.35)";
      g.fillRect(x - 2, y + 2, 4, 1.5);
    }
  }
  for (let y = 0; y < h; y += 3) {
    g.fillStyle = `rgba(255,255,255,${(0.01 + ((y / 3) % 4) * 0.004).toFixed(3)})`;
    g.fillRect(0, y, w, 1);
  }
}

/**
 * Bay water for the shoreline districts: a deep teal base that lightens toward
 * one edge the way water does under a low sky, a fine grain, and two scales of
 * ripple — long low strokes for the swell and short bright flecks where the
 * light catches a crest. Tiled and drifted by the district's animate, so a
 * still disc reads as moving water without a shader.
 */
function waterFace(g, w, h, o = {}) {
  gradientFill(g, w, h, [[0, o.base ?? "#0c2531"], [0.55, o.mid ?? "#0f2e3a"], [1, o.base2 ?? "#0a1f29"]]);
  noiseTexture(g, w, h, { density: 2200, alpha: 0.05, tone: "0,0,0" });
  const swell = o.swell ?? 46, crest = o.crest ?? 260;
  for (let i = 0; i < swell; i++) {
    const y = Math.random() * h, x = Math.random() * w, len = 60 + Math.random() * 180;
    g.fillStyle = `rgba(120,170,185,${(0.05 + Math.random() * 0.06).toFixed(3)})`;
    g.fillRect(x, y, len, 1.5);
    g.fillStyle = "rgba(0,0,0,0.10)";
    g.fillRect(x + 6, y + 3, len * 0.7, 1);
  }
  for (let i = 0; i < crest; i++) {
    const y = Math.random() * h, x = Math.random() * w, len = 6 + Math.random() * 22;
    g.fillStyle = `rgba(190,225,235,${(0.08 + Math.random() * 0.14).toFixed(3)})`;
    g.fillRect(x, y, len, 1);
  }
}

/**
 * Tidal mudflat for the marsh edge: a grey-brown base darker where it is
 * still wet, a fine grain, desiccation cracks as short jointed dark strokes,
 * and a few shallow pools that catch the sky. Reads as the ground a living
 * shoreline is built on rather than a lawn.
 */
function mudflatFace(g, w, h, o = {}) {
  gradientFill(g, w, h, [[0, o.base ?? "#3a3630"], [1, o.base2 ?? "#2c2a26"]], { radial: true });
  noiseTexture(g, w, h, { density: 3200, alpha: 0.10, tone: "0,0,0" });
  noiseTexture(g, w, h, { density: 900, alpha: 0.05, tone: "170,160,140" });
  const cracks = o.cracks ?? 70;
  for (let i = 0; i < cracks; i++) {
    let x = Math.random() * w, y = Math.random() * h;
    const steps = 4 + Math.floor(Math.random() * 6);
    for (let k = 0; k < steps; k++) {
      const dx = (Math.random() - 0.5) * 34, dy = (Math.random() - 0.5) * 34;
      const nx = x + dx, ny = y + dy, len = Math.hypot(dx, dy);
      g.fillStyle = "rgba(0,0,0,0.42)";
      for (let t = 0; t < len; t += 2) g.fillRect(x + (dx * t) / len, y + (dy * t) / len, 1.6, 1.6);
      x = nx; y = ny;
    }
  }
  const pools = o.pools ?? 5;
  for (let i = 0; i < pools; i++) {
    const cx = Math.random() * w, cy = Math.random() * h, r = 14 + Math.random() * 30;
    g.fillStyle = "rgba(70,95,105,0.35)";
    try { g.beginPath(); g.ellipse(cx, cy, r, r * 0.55, Math.random() * Math.PI, 0, Math.PI * 2); g.fill(); } catch { g.fillRect(cx - r, cy - r * 0.55, r * 2, r * 1.1); }
  }
}

/** The station footprint: a holographic pad the equipment stands on. */
function stationPad(parent, radius = 1.75, accent = CITY.accent) {
  const g = group(parent);
  torus(g, radius, 0.014, 0, 0.012, 0, accent,
    { emissive: accent, ei: 2.2, rough: 0.4, cast: false, seg: 8, seg2: 56 });
  torus(g, radius - 0.09, 0.005, 0, 0.012, 0, accent,
    { emissive: accent, ei: 1.1, rough: 0.4, cast: false, seg: 6, seg2: 56 });
  for (let i = 0; i < 8; i++) {
    const a = (i / 8) * Math.PI * 2 + Math.PI / 8;
    const tick = box(g, 0.03, 0.006, 0.17, Math.sin(a) * radius, 0.012, Math.cos(a) * radius,
      accent, { emissive: accent, ei: 1.8, rough: 0.4, cast: false });
    tick.rotation.y = a;
  }
  return g;
}

/** Free-standing holographic panel: the station's readouts and paperwork in AR. */
function holoPanel(parent, w, h, x, y, z, draw, o = {}) {
  const g = group(parent, x, y, z, o.ry ?? 0);
  const accent = o.accent ?? CITY.accent;
  const face = decal(g, w, h, 0, 0, 0, draw, { px: o.px ?? 640, glow: true, ei: o.ei ?? 0.95, transparent: true });
  // Corner brackets rather than a full frame — reads as a projection, not a screen.
  for (const sx of [-1, 1]) for (const sy of [-1, 1]) {
    box(g, w * 0.16, 0.006, 0.004, sx * (w / 2 - w * 0.08), sy * (h / 2), -0.002, accent,
      { emissive: accent, ei: 2.4, rough: 0.4, cast: false });
    box(g, 0.006, h * 0.22, 0.004, sx * (w / 2), sy * (h / 2 - h * 0.11), -0.002, accent,
      { emissive: accent, ei: 2.4, rough: 0.4, cast: false });
  }
  if (o.stalk) {
    cyl(g, 0.008, 0.008, y - 0.02, 0, -(y - 0.02) / 2 - h / 2, 0, accent,
      { emissive: accent, ei: 0.9, rough: 0.4, seg: 8, cast: false });
  }
  g.userData.face = face;
  return g;
}

/** Small floating caption used to name a piece of equipment in the AR overlay. */
function holoTag(parent, text, x, y, z, o = {}) {
  const accent = o.accent ?? CITY.accent;
  return decal(parent, o.w ?? 0.3, o.h ?? 0.07, x, y, z, (g, w, h) => {
    g.fillStyle = "rgba(6,14,20,0.82)";
    g.fillRect(0, 0, w, h);
    g.fillStyle = o.css ?? CITY.accentCss;
    g.fillRect(0, 0, 4, h);
    g.fillStyle = "#eaf6fb";
    g.font = `600 ${Math.round(h * 0.56)}px 'Barlow Condensed', Arial, sans-serif`;
    g.textAlign = "left"; g.textBaseline = "middle";
    g.fillText(String(text).toUpperCase(), w * 0.06, h * 0.56);
  }, { px: 320, glow: true, ei: 0.8, transparent: true });
}

/**
 * A thin transparent decal laid over a flat-coloured surface to add grain and grime
 * without hiding the material colour underneath — an overlay, not a face.
 */
function weatherPanel(parent, w, h, x, y, z, o = {}) {
  return decal(parent, w, h, x, y, z, (g, cw, ch) => {
    g.clearRect(0, 0, cw, ch);
    noiseTexture(g, cw, ch, { density: o.density ?? 650, alpha: o.alpha ?? 0.05, tone: o.tone ?? "8,8,8" });
    grimeOverlay(g, cw, ch, {
      blotches: o.blotches ?? 3, streaks: o.streaks ?? 2,
      tone: o.tone ?? "12,10,6", alpha: o.grime ?? 0.2,
    });
  }, { px: o.px ?? 192, transparent: true, rough: 0.95 });
}

/** Street / plant equipment cabinet with a hinged door, louvres and plinth. */
function equipmentCabinet(parent, w, h, d, x, z, o = {}) {
  const g = group(parent, x, 0, z, o.ry ?? 0);
  const shell = o.color ?? 0x6f7a83;
  box(g, w + 0.1, 0.09, d + 0.1, 0, 0.045, 0, 0x2d3339, { rough: 0.85, finish: "concrete", tile: 2 }); // plinth
  // Painted sheet steel, not a flat swatch: the finish gives the body an orange
  // peel under the key light and a grain on the rain cap. Shared maps, so a
  // yard full of cabinets is still one draw call per colour. See surface().
  box(g, w, h, d, 0, 0.09 + h / 2, 0, shell,
    { rough: o.rough ?? 0.5, metal: o.metal ?? 0.5, finish: o.finish ?? "painted", tile: 2 });
  box(g, w + 0.06, 0.04, d + 0.06, 0, 0.09 + h + 0.02, 0, shell,
    { rough: 0.5, metal: 0.5, finish: o.finish ?? "painted", tile: 2 }); // rain cap
  for (let i = 0; i < 4; i++) {                                                     // louvres
    box(g, w * 0.5, 0.014, 0.01, 0, 0.09 + h * 0.28 + i * 0.05, d / 2 + 0.006, shell,
      { rough: 0.6, metal: 0.4 });
  }
  const door = group(g, -w / 2 + 0.01, 0.09 + h / 2, d / 2);
  box(door, w - 0.03, h - 0.06, 0.022, (w - 0.03) / 2, 0, 0.012, o.doorColor ?? shell,
    { rough: 0.45, metal: 0.55, finish: o.finish ?? "painted", tile: 2 });
  box(door, 0.03, 0.13, 0.03, w - 0.09, 0, 0.03, CITY.steel, { rough: 0.3, metal: 0.9 });
  if (o.weathered !== false) {
    weatherPanel(door, (w - 0.03) * 0.94, (h - 0.06) * 0.94, (w - 0.03) / 2, 0, 0.024,
      { tone: "10,9,6", alpha: 0.045, grime: 0.16 });
  }
  if (o.open) door.rotation.y = o.open;
  g.userData.door = door;
  return g;
}

/** 19-inch equipment rack — telecom nodes, controllers, inverters. */

/** Traffic cone with a reflective collar. */

/** Gas / fluid cylinder, upright and secured. */

    [0.042, 1.06], [0.001, 1.065]], 0, 0, 0, color, { rough: 0.45, metal: 0.5, seg: 28, finish: "galvanised" });
  cyl(g, 0.05, 0.055, 0.08, 0, 1.11, 0, CITY.steel, { rough: 0.35, metal: 0.85, seg: 18, finish: "brushed" });
  if (o.gauge !== false) {
    cyl(g, 0.035, 0.035, 0.014, 0.07, 1.09, 0, 0xdfe4e8, { rough: 0.3, metal: 0.4, seg: 14 })
      .rotation.z = Math.PI / 2;

  if (o.plate !== false) {
    const plate = group(g, 0.107, o.plateY ?? 0.5, 0, Math.PI / 2);

      (o.plateLines ?? ["INSPECT BEFORE USE", "SEE TAG FOR CONTENTS"]).forEach((line, i) =>
        cx.fillText(line, cw / 2, ch * 0.42 + i * ch * 0.11));

/** Pipe run with flanges — plant rooms, vaults, chiller skids. */
function pipeRun(parent, points, radius, color, o = {}) {
  const g = group(parent);
  hose(g, points, radius, color, { steps: o.steps ?? 24, rough: o.rough ?? 0.5, metal: o.metal ?? 0.6 });
  for (const p of o.flanges ?? []) {
    const f = cyl(g, radius * 1.8, radius * 1.8, 0.03, p[0], p[1], p[2], CITY.darkSteel,
      { rough: 0.5, metal: 0.7, seg: 16 });
    if (o.flangeAxis === "z") f.rotation.x = Math.PI / 2;
    if (o.flangeAxis === "x") f.rotation.z = Math.PI / 2;
  }
  return g;
}

/** Hand wheel valve on a body — vaults, chiller plant, water main. */
function valveWheel(parent, x, y, z, o = {}) {
  const g = group(parent, x, y, z, o.ry ?? 0);
  const r = o.r ?? 0.16;
  box(g, 0.16, 0.18, 0.16, 0, 0, 0, o.body ?? 0x2f6f4a, { rough: 0.6, metal: 0.4 });
  cyl(g, 0.02, 0.02, 0.2, 0, 0.16, 0, CITY.steel, { rough: 0.4, metal: 0.8, seg: 10 });
  const wheel = group(g, 0, 0.27, 0);
  torus(wheel, r, 0.016, 0, 0, 0, o.color ?? 0xb8402f, { rough: 0.6, seg: 8, seg2: 24 })
    .rotation.x = Math.PI / 2;
  for (let i = 0; i < 4; i++) {
    const spoke = box(wheel, r * 2, 0.014, 0.02, 0, 0, 0, o.color ?? 0xb8402f, { rough: 0.6 });
    spoke.rotation.y = (i * Math.PI) / 4;
  }
  cyl(wheel, 0.028, 0.028, 0.03, 0, 0, 0, CITY.steel, { rough: 0.4, metal: 0.8, seg: 12 });
  g.userData.wheel = wheel;
  return g;
}

/** Padlock and tag, the shared vocabulary of every isolation step. */
function lockTag(parent, x, y, z, o = {}) {
  const g = group(parent, x, y, z, o.ry ?? 0);
  torus(g, 0.022, 0.006, 0, 0.024, 0, 0xc0c6cc, { rough: 0.25, metal: 0.95 }).rotation.y = Math.PI / 2;
  box(g, 0.03, 0.04, 0.017, 0, 0, 0, o.color ?? 0xd8232a, { rough: 0.5 });
  const tag = decal(g, 0.075, 0.1, 0, -0.085, 0.008,
    paperFace("DANGER", o.lines ?? ["DO NOT", "OPERATE"], { bg: "#f4e9d8", band: "#b81410", worn: true }), { px: 192 });
  tag.rotation.z = o.tilt ?? 0.07;
  return g;
}

/** Hand-held instrument with a live canvas readout — meters, probes, analysers. */
function instrument(parent, x, y, z, o = {}) {
  const g = group(parent, x, y, z, o.ry ?? 0);
  slab(g, o.w ?? 0.13, 0.04, o.d ?? 0.21, 0, 0, 0, o.color ?? CITY.hiVis, { radius: 0.012, rough: 0.55 });
  const screen = decal(g, (o.w ?? 0.13) * 0.78, (o.d ?? 0.21) * 0.34, 0, 0.021, -(o.d ?? 0.21) * 0.2,
    signFace(o.idle ?? "----", { bg: "#0d1c24", accent: CITY.accentCss, fg: "#bfeaf7", scale: 0.62 }),
    { glow: true, ei: 0.85, px: 320 });
  screen.rotation.x = -Math.PI / 2;
  for (let i = 0; i < 6; i++) {
    box(g, 0.02, 0.006, 0.014, -0.035 + (i % 3) * 0.035, 0.022, (o.d ?? 0.21) * 0.16 + Math.floor(i / 3) * 0.03,
      0x22262b, { rough: 0.6 });
  }
  g.userData.screen = screen;
  return g;
}

/** Standing figure — casualties, bystanders, crew members. */
function standingFigure(parent, x, z, o = {}) {
  const g = group(parent, x, 0, z, o.ry ?? 0);
  // Tag them the way the trades bays tag theirs, so tools/check_layout.mjs
  // holds a SmartCiti.X figure to the same rule: a person has to be standing
  // somewhere, not inside a cabinet. A figure that is meant to be lying down,
  // or riding something, is exempt — that is where it is supposed to be.
  // `atStation` is for a figure whose position against the equipment is the
  // content — a casualty down the hole, a coworker riding the forks. Those are
  // meant to be where they are; everyone else is standing somewhere and has to
  // be standing somewhere real.
  if (!o.lying && !o.atStation) g.userData.crew = true;
  const skin = o.skin ?? 0xc99878;
  const cloth = o.cloth ?? 0x37505f;
  const lying = !!o.lying;
  const body = group(g, 0, 0, 0);
  if (lying) { body.rotation.x = -Math.PI / 2; body.position.set(0, 0.16, 0); }
  box(body, 0.36, 0.52, 0.22, 0, 1.05, 0, cloth, { rough: 0.9 });
  box(body, 0.32, 0.14, 0.22, 0, 0.75, 0, cloth, { rough: 0.9 });
  for (const sx of [-1, 1]) {
    cyl(body, 0.065, 0.06, 0.7, sx * 0.1, 0.35, 0, o.trousers ?? 0x2f3740, { rough: 0.9, seg: 10 });
    box(body, 0.1, 0.06, 0.2, sx * 0.1, 0.03, 0.05, 0x1b1e22, { rough: 0.85 });
    cyl(body, 0.05, 0.045, 0.55, sx * 0.24, 1.02, 0, cloth, { rough: 0.9, seg: 10 });
    ball(body, 0.045, sx * 0.24, 0.73, 0.02, skin, { rough: 0.75, seg: 12 });
  }
  cyl(body, 0.05, 0.055, 0.1, 0, 1.36, 0, skin, { rough: 0.75, seg: 12 });
  const head = group(body, 0, 1.5, 0);
  ball(head, 0.115, 0, 0, 0, skin, { rough: 0.75, seg: 18 });
  box(head, 0.16, 0.1, 0.1, 0, -0.05, 0.05, skin, { rough: 0.75 });
  if (o.helmet) {
    lathe(head, [[0.001, 0.05], [0.09, 0.06], [0.125, 0.02], [0.13, 0.0], [0.001, 0.0]], 0, 0.05, 0,
      o.helmet, { rough: 0.4, seg: 16 });
    box(head, 0.2, 0.02, 0.1, 0, 0.05, 0.09, o.helmet, { rough: 0.4 });
  }
  if (o.vest) box(body, 0.38, 0.46, 0.24, 0, 1.05, 0, o.vest, { rough: 0.85 });
  g.userData.head = head;
  g.userData.body = body;
  return g;
}

// Discrete tone/finish sets — reused across towers so the material cache stays small
// instead of minting one unique material per random roughness value.
const SKY_TONES = [0x283547, 0x2d3c53, 0x222d3d, 0x323e51, 0x1f2b3b, 0x354a62];
const SKY_ROUGH = [0.82, 0.88, 0.94, 1.0];
const SKY_WINDOW = [0x4fd1ff, 0x7ee6ff, 0xffd28a, 0xa079ff];

/**
 * Distant skyline for the non-AR stage: a silhouette ring, never lit by scene lights.
 * Each tower gets its own height/tone/window-band treatment so the ring reads as a
 * real mixed-use district rather than a repeated block; a handful of rooftops carry a
 * slow-pulsing beacon (returned in `userData.beacons` for the caller to animate).
 */
function skyline(parent, o = {}) {
  const g = group(parent);
  const count = o.count ?? 54;
  const beacons = [];
  // A district on a shoreline opens the ring toward the water: `gap` is the
  // [from, to] bearing (radians, 0 = +z, π = the side the learner faces) in
  // which no tower is built, so the horizon there is whatever the district
  // puts across the bay instead of a wall of city.
  const gap = o.gap ?? null;
  const inGap = (a) => { if (!gap) return false; const n = ((a % (Math.PI * 2)) + Math.PI * 2) % (Math.PI * 2); return n >= gap[0] && n <= gap[1]; };
  for (let i = 0; i < count; i++) {
    const a = (i / count) * Math.PI * 2 + Math.random() * 0.05;
    if (inGap(a)) continue;
    const r = 34 + Math.random() * 16;
    const h = 5 + Math.random() * 24;
    const w = 3 + Math.random() * 5;
    const tone = SKY_TONES[i % SKY_TONES.length];
    const rough = SKY_ROUGH[i % SKY_ROUGH.length];
    const metal = i % 5 === 0 ? 0.3 : 0;
    const tower = box(g, w, h, w, Math.sin(a) * r, h / 2 - 1.5, Math.cos(a) * r,
      tone, { rough, metal, cast: false, receive: false });
    tower.rotation.y = a;
    const bands = 1 + (i % 3 === 0 ? 1 : 0);
    for (let b = 0; b < bands; b++) {
      if ((i + b * 7) % 5 === 0) continue; // leave some floors dark
      const wt = SKY_WINDOW[(i + b) % SKY_WINDOW.length];
      const lit = box(g, w * (0.55 + ((i + b) % 4) * 0.06), 0.06, 0.05,
        Math.sin(a) * r, h * (0.25 + b * 0.32 + ((i * 7 + b) % 5) * 0.05) - 1.5,
        Math.cos(a) * r + w / 2, wt,
        { emissive: wt, ei: 1.3 + ((i + b) % 4) * 0.35, rough: 0.4, cast: false, receive: false });
      lit.rotation.y = a;
    }
    if (i % 9 === 0) {
      const beacon = ball(g, 0.09, Math.sin(a) * r, h - 1.5 + 0.12, Math.cos(a) * r, 0xff5f5f,
        { emissive: 0xff5f5f, ei: 1.6, rough: 0.3, cast: false });
      // Give each beacon its own material instance (cheap — a handful of towers only)
      // so the pulse below can stagger per-beacon instead of every one sharing (and
      // fighting over) the single cached material `mat()` would otherwise reuse.
      beacon.material = beacon.material.clone();
      beacon.material.userData.ownMaterial = true; // disposeTree() should free this clone
      beacon.userData.phase = (i / count) * Math.PI * 2;
      beacons.push(beacon);
    }
  }
  g.userData.beacons = beacons;
  return g;
}

function reg(hits, obj, id) {
  markInteractive(obj, id);
  hits[id] = obj;
  return obj;
}


/* ===== smartcity/js/gamify.js ===== */
// Per-simulator gamified systems.
//
// Every SmartCiti.X area is its own system: its own name, its own currency, its
// own rank ladder and its own badges and challenges. A learner can be a Fault
// Lead on the charge point and still an apprentice in the valve vault — rank is
// earned inside a trade, not across the platform.

/** Product naming: every area is "SmartCiti.X~ <Name> VR". */
const BRAND = "SmartCiti.X";
const simTitle = (name) => `${BRAND}~ ${name} VR`;

/** Predicates the systems judge a finished run against. */
const AWARD = {
  /** No wrong selections at all. */
  clean: (s) => s.errors === 0,
  /** No unsafe-action selections — you may have fumbled the order, never the safety. */
  safe: (s) => s.hazardHits === 0,
  /** Finished inside a fraction of par time. */
  fast: (fraction = 0.8) => (s) => s.elapsed <= s.room.parSeconds * fraction,
  /** Mean accuracy across the graded skill steps. */
  precise: (level = 0.75) => (s) => s.gaugeScores.length > 0 && s.precision >= level,
  /** Every timed hold carried to full duration first time. */
  unbroken: (s) => s.holdBreaks === 0,
  /** Reached the maximum combo multiplier at some point in the run. */
  streak: (n = 10) => (s) => {
    let best = 0, run = 0;
    for (const entry of s.log) { run = entry.ok ? run + 1 : 0; best = Math.max(best, run); }
    return best >= n;
  },
  /** A specific step completed without any error recorded against it. */
  stepClean: (stepId) => (s) => !s.log.some((e) => e.step === stepId && !e.ok),
  /** Combine predicates. */
  all: (...tests) => (s) => tests.every((t) => t(s)),
};

const DEFAULT_RANK_AT = [0, 900, 2200, 4000, 6500];

/**
 * Fill in a simulator's system definition. Ranks are required — they are what
 * makes each area feel like its own progression rather than a shared score.
 */
function system({ name, currency, ranks, rankAt, badges = [], challenges = [] }) {
  return {
    system: name,
    currency,
    ranks,
    rankAt: rankAt ?? DEFAULT_RANK_AT.slice(0, ranks.length),
    badges,
    challenges,
  };
}


/* ===== smartcity/js/districts.js ===== */
// Districts: the part of the VR / flat-screen stage that changes with the
// station's trade category. The plaza, marquee and skyline are shared; a
// district adds the horizon a worker in that trade would actually see —
// transmission pylons behind a substation, a container terminal behind a
// lashing deck, a truss arch behind a company switch — plus the sky, fog
// and light-mast tint that go with it. Everything is built from the shared
// kit at twenty to sixty meshes a district, placed in the ring between the
// plaza edge (r ≈ 15) and the skyline (r ≈ 34+), so nothing crowds the
// station and nothing costs a headset frame. Animations are property tweaks
// on already-built materials and groups: no per-frame allocation.

/** Give a mesh its own material so it can pulse without dragging every
 *  cached sibling with it; disposeTree() frees the clone. */
function own(mesh) {
  mesh.material = mesh.material.clone();
  mesh.material.userData.ownMaterial = true;
  return mesh;
}

/** A thin bar between two points (wires, cables, guys). */
function span(g, a, b, r = 0.03, color = 0x4a5561) {
  const [x1, y1, z1] = a, [x2, y2, z2] = b;
  const len = Math.hypot(x2 - x1, y2 - y1, z2 - z1);
  const m = box(g, r, r, len, (x1 + x2) / 2, (y1 + y2) / 2, (z1 + z2) / 2, color, { rough: 0.5, metal: 0.4, cast: false, receive: false });
  m.lookAt(new THREE.Vector3(x2, y2, z2));
  return m;
}

/** Transmission pylon: four splayed legs, three crossarms with insulators, a top beacon. */
function pylon(g, x, z, h = 14, ry = 0) {
  const t = group(g, x, -1.5, z, ry);
  for (const [sx, sz] of [[-1, -1], [1, -1], [-1, 1], [1, 1]]) {
    const leg = cyl(t, 0.07, 0.16, h, sx * 1.2, h / 2, sz * 1.2, 0x8b98a5, { rough: 0.6, metal: 0.6, seg: 6, cast: false, receive: false });
    leg.rotation.z = -sx * 0.07; leg.rotation.x = sz * 0.07;
  }
  const arms = [];
  for (const [y, w] of [[h * 0.6, 6.4], [h * 0.76, 5.4], [h * 0.9, 4.2]]) {
    box(t, w, 0.16, 0.16, 0, y, 0, 0x8b98a5, { rough: 0.6, metal: 0.6, cast: false, receive: false });
    for (const sx of [-1, 1]) {
      cyl(t, 0.05, 0.05, 0.9, sx * w / 2, y - 0.5, 0, 0xc9d6df, { rough: 0.3, seg: 6, cast: false, receive: false });
      arms.push([x + Math.cos(ry) * sx * w / 2, y - 1.0 - 1.5, z - Math.sin(ry) * sx * w / 2]);
    }
  }
  ball(t, 0.12, 0, h + 0.1, 0, 0xff5f5f, { emissive: 0xff5f5f, ei: 1.6, cast: false, seg: 8, seg2: 6 });
  return arms;
}

/** A floodlight over a district so its structures read against the sky:
 *  a dim directional light aimed at the plaza from above the district, so
 *  the faces that look back at the learner are lit. Directional because a
 *  point light under physically-based falloff is black twenty metres out. */
function flood(g, x, y, z, color = 0xdfeaf2, intensity = 1.1) {
  const l = new THREE.DirectionalLight(color, intensity);
  l.position.set(x, y, z);
  g.add(l);
  g.add(l.target);
  return l;
}

/** Night structures carry a little of their own light (sodium wash, deck
 *  lights, safety lighting); a faint self-glow on every unlit district mesh
 *  keeps the silhouettes legible at any exposure without a light per prop. */
function selfLight(root, ei = 0.22) {
  root.traverse((o) => {
    if (!o.isMesh || !o.material?.emissive || o.material.emissiveIntensity > 0.5 && o.material.emissive.getHex() !== 0) return;
    if (o.material.emissive.getHex() !== 0) return;
    o.material = o.material.clone();
    o.material.userData.ownMaterial = true;
    o.material.emissive.copy(o.material.color);
    o.material.emissiveIntensity = ei;
  });
}

/** Still water to the horizon, under the skyline and the plaza edge. */
function water(g, color = 0x0a1a26) {
  const w = cyl(g, 64, 64, 0.1, 0, -0.55, 0, color, { rough: 0.22, metal: 0.7, seg: 48, cast: false });
  w.receiveShadow = false;

/** Ship-to-shore gantry crane silhouette: portal legs, sill beams, boom over the water. */
function gantry(g, x, z, ry = 0) {
  const c = group(g, x, -1.5, z, ry);
  for (const sx of [-1, 1]) for (const sz of [-1, 1]) cyl(c, 0.22, 0.28, 16, sx * 3, 8, sz * 2.2, 0x6b7885, { rough: 0.55, metal: 0.6, seg: 8, cast: false, receive: false });
  box(c, 7, 0.5, 5, 0, 16, 0, 0x6b7885, { rough: 0.55, metal: 0.6, cast: false, receive: false });
  const boom = box(c, 1.0, 0.8, 24, 0, 17.6, -6, 0x75828f, { rough: 0.55, metal: 0.6, cast: false, receive: false });
  boom.rotation.x = -0.12;
  box(c, 2.4, 2.2, 2.4, 0, 14.6, 3.5, 0x4a5561, { rough: 0.6, metal: 0.4, cast: false, receive: false });
  cyl(c, 0.12, 0.12, 8, 0, 21, -2, 0x6b7885, { rough: 0.55, metal: 0.6, seg: 6, cast: false, receive: false });
  own(ball(c, 0.16, 0, 25, -2, 0xff5f5f, { emissive: 0xff5f5f, ei: 1.5, cast: false, seg: 8, seg2: 6 }));
  return c;
}

const BOX_TONES = [0x7a3a2c, 0x2c5a7a, 0x3d6b3a, 0x8a7a2c, 0x5a5f66, 0x7a2c5a];

/** Blast containment: a scaffold cage wrapped in shroud sheeting with the

 *  the other side of. Returns the beacons. */
function perimeter(g, r = 20, a0 = -1.9, a1 = -1.2, bays = 7) {
  const beacons = [];
  for (let i = 0; i <= bays; i++) {
    const a = a0 + (a1 - a0) * (i / bays);
    const x = Math.sin(a) * r, z = Math.cos(a) * r;
    cyl(g, 0.04, 0.04, 2.4, x, -0.3, z, 0x8b949d, { rough: 0.5, metal: 0.6, seg: 6, cast: false, receive: false });
    if (i < bays) {
      const na = a0 + (a1 - a0) * ((i + 1) / bays);
      const mx = (x + Math.sin(na) * r) / 2, mz = (z + Math.cos(na) * r) / 2;
      const len = Math.hypot(Math.sin(na) * r - x, Math.cos(na) * r - z);
      const panel = box(g, len, 2.2, 0.02, mx, -0.4, mz, 0xb8c1c9, { rough: 0.6, metal: 0.4, opacity: 0.35, cast: false, receive: false });
      panel.rotation.y = -((a + na) / 2);
    }
    if (i % 3 === 1) {
      box(g, 0.34, 0.5, 0.28, x, 0.75, z, 0xe6ecf1, { rough: 0.5, cast: false, receive: false });
      cyl(g, 0.05, 0.05, 0.3, x, 1.15, z, 0x4a5561, { rough: 0.5, seg: 6, cast: false, receive: false });

  }
  return beacons;
}

        cordgrass(g, Math.sin(a) * r, Math.cos(a) * r, 10 + (i % 4) * 2);
      }
      const beacons = perimeter(g, 20, -1.0, -0.25, 8);
      const leds = [monitorMast(g, -18, -18, 6), monitorMast(g, 21, -12, 7)];
      const dr = dredge(g, 19, -27, -0.45);
      const sock = group(g, -14, -0.5, -20);
      cyl(sock, 0.05, 0.05, 6, 0, 3, 0, 0xb8c1c9, { rough: 0.5, seg: 6, cast: false, receive: false });
      const cone = cyl(sock, 0.28, 0.14, 1.6, 0.9, 5.9, 0, 0xff7a3b, { rough: 0.9, seg: 10, open: true, cast: false, receive: false });
      cone.rotation.z = Math.PI / 2;
      return (t) => {
        waterTex.offset.x = t * 0.004; waterTex.offset.y = Math.sin(t * 0.05) * 0.02;
        for (let i = 0; i < leds.length; i++) leds[i].material.emissiveIntensity = ((Math.floor(t * 1.5 + i * 0.7)) % 3 === 0) ? 2.2 : 0.4;
        for (let i = 0; i < beacons.length; i++) beacons[i].material.emissiveIntensity = Math.sin(t * 2.4 + i) > 0.6 ? 2.4 : 0.5;
        cone.rotation.y = Math.sin(t * 0.5) * 0.5;
        dr.d.position.y = -0.5 + Math.sin(t * 0.6) * 0.06; dr.d.rotation.z = Math.sin(t * 0.45) * 0.008;
        // The bucket cycle: down, dwell, up and slew to the scow, back.
        const c = (t * 0.18) % 1;
        const drop = c < 0.3 ? c / 0.3 : c < 0.5 ? 1 : c < 0.8 ? 1 - (c - 0.5) / 0.3 : 0;
        dr.line.scale.y = 1 + drop * 0.3; dr.line.position.y = 4.0 - drop * 0.9;
        dr.bucket.position.y = 0.6 - drop * 1.8;
        dr.slew.rotation.y = c >= 0.8 ? Math.sin((c - 0.8) / 0.2 * Math.PI) * 1.2 : 0;
      };
    },
  },
  "Surface Prep & Coatings": {
    sky: 0x0b0906, fog: 0x12100b, hemi: [0x8f8272, 0x1a1512], mast: 0xffe2b8,
    build(g) {
      flood(g, 0, 14, -22, 0xffe2b8, 1.3);
      const con = containment(g, -16, -26, 14, 9, 0.28);
      abrasiveSilo(g, 8, -30);
      coatingStore(g, 24, -22, -0.5);
      const dehu = dehuSkid(g, -1, -20, 0.1);
      return (t) => {
        // The blast light inside the shroud rises and falls with the nozzle:
        // long passes, a pause to move the staging, another pass.
        const on = Math.sin(t * 0.55) > -0.3;
        const flick = on ? 0.9 + Math.sin(t * 9) * 0.25 + Math.sin(t * 23) * 0.1 : 0.12;
        for (const s of con.sheets) s.material.emissiveIntensity = flick;
        // Negative-air keeps pulling whether or not the nozzle is open.
        const p = 1 + Math.sin(t * 0.9) * 0.14;
        con.plume.scale.set(p, 1 + Math.sin(t * 0.7) * 0.22, p);
        // Dehumidifier cycles green (holding dew point) to amber (regenerating).
        const reg = Math.sin(t * 0.22) > 0.7;
        dehu.material.emissive.setHex(reg ? 0xf2c14b : 0x59c97b);
        dehu.material.emissiveIntensity = reg ? 2.0 : 1.4;
      };
    },
  },
};

/** The district for a category (the shared plaza with the default sky when
 *  the category has none or the hub is showing). */
function districtFor(category) {
  return { ...DEFAULT, ...(DISTRICTS[category] ?? {}) };
}


/* ===== smartcity/js/interiors.js ===== */
// Interiors: a room for the stations that are actually indoors.
//
// A chlorine room, a machining cell and a theatre loft do not stand on a
// plaza under a city skyline, and putting them there was the last obvious
// lie in the environment. A station declares `indoor: "<style>"` and the
// stage builds a room around it instead: floor, walls, a roller door or an
// exit, a ceiling with real fittings, and rooflights that let the weather
// and the hour through so the room still knows what time it is.
//
// Nine styles, because nine is what the roster actually needs. Each is the
// same shell with different surfaces, dressing and light temperature, so
// the whole layer is about a hundred meshes rather than six separate rooms.

/** The style a station asked for, or null when it belongs outdoors. */
function interiorFor(indoor) {
  return INTERIOR_STYLES.includes(indoor) ? STYLE[indoor] : null;
}

/** A run of overhead pipe with hangers — plant rooms and service rooms. */
function overheadPipes(g, style, y, accent) {
  const runs = [[-3.2, 0x8b959c, 0.11], [-2.6, 0xb8853a, 0.07], [2.8, 0x7b8a86, 0.13], [3.3, accent, 0.06]];
  for (const [z, colour, r] of runs) {
    const pipe = cyl(g, r, r, style.w - 1.2, 0, y, z, colour, { rough: 0.5, metal: 0.55, seg: 12, cast: false });
    pipe.rotation.z = Math.PI / 2;
    for (let x = -style.w / 2 + 2; x < style.w / 2 - 1; x += 3.2) {
      cyl(g, 0.02, 0.02, 0.45, x, y + 0.24, z, 0x6d7379, { rough: 0.6, metal: 0.5, seg: 6, cast: false });
      box(g, r * 2.6, 0.04, r * 2.6, x, y + r + 0.02, z, 0x6d7379, { rough: 0.6, metal: 0.5, cast: false });
    }
  }
}

/** Roof trusses across the span — shops and garages. */
function trusses(g, style, y) {
  for (let z = -style.d / 2 + 2; z < style.d / 2 - 1; z += 3.4) {
    box(g, style.w - 0.6, 0.12, 0.12, 0, y, z, 0x6d7379, { rough: 0.55, metal: 0.5, cast: false });
    box(g, style.w - 0.6, 0.12, 0.12, 0, y - 0.7, z, 0x6d7379, { rough: 0.55, metal: 0.5, cast: false });
    for (let x = -style.w / 2 + 1.2; x < style.w / 2 - 0.5; x += 1.7) {
      const web = box(g, 0.06, 0.78, 0.06, x, y - 0.35, z, 0x6d7379, { rough: 0.55, metal: 0.5, cast: false });
      web.rotation.z = (x % 3.4 < 1.7) ? 0.42 : -0.42;
    }
  }
}

/** A black-walled fly tower with a catwalk — the theatre style. */
function flyTower(g, style, y, accent) {
  for (let i = 0; i < 6; i++) {
    const bar = cyl(g, 0.035, 0.035, style.w - 1.4, 0, y - 0.4 - i * 0.0, -3.6 + i * 1.3, 0x14151a, { rough: 0.5, metal: 0.6, seg: 8, cast: false });
    bar.rotation.z = Math.PI / 2;
  }
  const cat = box(g, style.w - 1.0, 0.08, 1.0, 0, y - 2.2, -style.d / 2 + 1.6, 0x2a2b31, { rough: 0.7, metal: 0.3, cast: false });
  for (const dz of [-0.45, 0.45]) box(g, style.w - 1.0, 0.7, 0.04, 0, y - 1.85, -style.d / 2 + 1.6 + dz, 0x2a2b31, { rough: 0.7, metal: 0.3, cast: false });
  box(g, style.w - 1.0, 0.05, 0.05, 0, y - 2.6, -style.d / 2 + 1.1, accent, { emissive: accent, ei: 0.7, rough: 0.5, cast: false });
  void cat;
}

/** The exhaust hood line along the back wall of a kitchen: stainless canopy,
 *  baffle filters, a duct up through the ceiling, and the fire-suppression
 *  nozzles that NFPA 96 puts over every appliance. */
function hoodLine(g, style, y, accent) {
  const z = -style.d / 2 + 1.35, w = style.w - 3;
  box(g, w, 0.9, 1.6, 0, y - 0.55, z, 0xc9d0d6, { rough: 0.35, metal: 0.8, cast: false });
  for (let x = -w / 2 + 0.6; x < w / 2 - 0.3; x += 0.55) box(g, 0.5, 0.42, 0.04, x, y - 0.72, z + 0.5, 0xaeb7bf, { rough: 0.4, metal: 0.7, cast: false });
  box(g, 1.2, 0.3, 1.2, -w / 4, y - 0.05, z, 0xb0b9c2, { rough: 0.45, metal: 0.7, cast: false });
  box(g, 1.2, 0.3, 1.2, w / 4, y - 0.05, z, 0xb0b9c2, { rough: 0.45, metal: 0.7, cast: false });
  for (let x = -w / 2 + 1.2; x < w / 2 - 0.6; x += 1.5) cyl(g, 0.03, 0.03, 0.22, x, y - 1.05, z + 0.2, 0xb3261e, { rough: 0.5, seg: 6, cast: false });
  box(g, w, 0.04, 0.04, 0, y - 1.0, z + 0.78, accent, { emissive: accent, ei: 0.5, rough: 0.5, cast: false });
}

/** The back bar along the back wall: shelved bottles under a lit mirror
