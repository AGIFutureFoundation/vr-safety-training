  }),

  hazards: {
    "standing-under-load": "You are standing directly beneath a loaded batten and arbor. A parted rope or a dropped counterweight brick falls fast and gives no warning — nobody works or walks under a flown line while it can still move.",
    "unlocked-rail": "That arbor's locking rail pin is out and the line set is not secured. An unlocked arbor can run away the moment the rope weight shifts, and it takes whatever is in its path with it.",
    "shortcut-call": "That is an override call button that skips the clearance check. Calling 'moving' before the deck confirms clear is how a batten comes down on someone who never heard the cue.",
    "excess-bricks": "That stack adds weight past the batten's rated capacity. An overloaded line set can overhaul the operator at the rail, part a rope, or bring the batten down out of control.",
  },

  lateNotes: {
    "locking-rail": "The arbor only gets locked once the counterweight is actually balanced against the batten's load — not before.",
    "trim-lock-pin": "The trim pin only goes in once the fly cue has actually brought the batten to its final position.",
  },

  steps: [
    {
      id: "plot", kind: "select", target: "rigging-plot",
      title: "Read the rigging plot",
      cue: "Confirm the batten's rated capacity, planned load and trim height on the plot.",
      why: "The plot is the plan for this line set specifically — capacity, load and trim height are not the same from one batten to the next.",
    },
    {
      id: "inspect", kind: "find", noHint: true,
      targets: ["fault-arbor-lock", "fault-rope", "fault-brick"],
      itemNames: {
        "fault-arbor-lock": "unlocked arbor on line 3", "fault-rope": "frayed lift line on line 5", "fault-brick": "unsecured counterweight brick",
      },
      itemNotes: {
        "fault-arbor-lock": "An arbor left unlocked between shows can shift the moment its rope takes a load — lock it before it becomes someone else's surprise.",
        "fault-rope": "A lift line with broken strands is rated for nothing until it is replaced — flag it and take that line set out of service.",
        "fault-brick": "A brick sitting loose in the arbor cage can shift or fall the first time that arbor moves — reseat and secure it before flying anything on that line.",
      },
      decoyNotes: {
        "stacked-bricks-good": "That arbor is stacked correctly and fully caged — nothing to action.",
        "locked-arbor-good": "That arbor rail is engaged and locked — leave it alone.",
      },
      title: "Walk the counterweight system",
      cue: "Check the arbors, ropes and locking rails. Three things are wrong — find them by looking.",
      why: "A pre-show rigging check is a search across every line set on the rail, not a glance at the one you're about to fly.",
    },
    {
      id: "comms-check", kind: "select", target: "headset",
      title: "Check comms with the fly floor",
      cue: "Put on the headset and confirm a clear channel with the deck.",
      why: "Every cue on this rail runs over that channel. If it isn't clear before you start, nobody downstairs hears 'clear' or 'moving' when it matters.",
    },
    {
      id: "clear-floor", kind: "select", target: "floor-watch",
      title: "Post a floor watch",
      cue: "Post someone to keep the deck clear under the batten before it moves.",
      why: "The floor watch is a second set of eyes on the one place a rigger at the rail cannot see — directly beneath the load.",
    },
    {
      id: "lower-batten", kind: "select", target: "batten-line",
      title: "Lower the batten to load position",
      cue: "Bring the empty batten down to the deck at the pin rail.",
      why: "Counterweight goes on at the deck, not at height. The batten comes down to a working position before anything is loaded onto it.",
    },
    {
      id: "capacity-check", kind: "select", target: "capacity-plate",
      title: "Check the batten's rated capacity",
      cue: "Read the capacity plate and confirm the planned load is inside it.",
      why: "The plate is the hard limit for this specific batten and its rope set. The plot's planned load is checked against it before a single brick goes in.",
    },
    {
      id: "load-weights", kind: "gauge", target: "arbor",
      title: "Load the arbor to balance",
      cue: "Add counterweight and commit once the arbor balances the batten's load.",
      why: "A balanced arbor is what lets one person hold a loaded line at the rail. Under- or over-loaded, the rope does the deciding instead of the operator.",
      gauge: {
        label: "ARBOR — COUNTERWEIGHT BALANCE", speed: 0.6, green: [0.42, 0.58],
        readout: (t) => `${Math.round(160 + t * 60)} lb`,
        missNote: "Off balance. Add or pull bricks and recheck before the rail is locked.",
      },
    },
    {
      id: "lock-arbor", kind: "select", target: "locking-rail",
      title: "Lock the arbor rail",
      cue: "Engage the locking rail pin now that the arbor is balanced.",
      why: "The lock is what keeps a balanced arbor from drifting the moment you step away from the rail.",
    },
    {
      id: "fly-cue", kind: "sequence",
      targets: ["call-clear", "call-moving", "call-stopped"],
      itemNames: { "call-clear": "call clear", "call-moving": "call moving", "call-stopped": "call stopped" },
      title: "Call the fly cue",
      cue: "Call clear, wait for confirmation, call moving, then call stopped at trim.",
      why: "Clear has to come back before moving is ever called — moving is a commitment that the deck is not still checking under the line.",
      outOfOrderNote: "Wrong order — clear is called and confirmed first, then moving, then stopped once the batten is in position.",
    },
    {
      id: "trim-lock", kind: "select", target: "trim-lock-pin",
      title: "Lock off at trim height",
      cue: "Pin the arbor at trim now that the batten is in its final position.",
      why: "The trim pin is the second, physical lock that holds the line set exactly where the cue left it, independent of the rail lock.",
    },
    {
      id: "auto-teach", kind: "sequence", targets: ["auto-park", "auto-mid", "auto-out"],
      title: "Teach the automation winch's cue positions",
      cue: "Record line 6's park, mid-show and full-out positions in the order the cue actually runs.",
      why: "A motorized automation line plays back a taught cue exactly as recorded — teach full-out before mid-show and the batten runs straight past the position an actor is expecting it to stop at, on stage, live.",
      itemNames: { "auto-park": "park position", "auto-mid": "mid-show position", "auto-out": "full-out position" },
      itemNotes: {
        "auto-park": "Clear of the grid, out of the way between cues.",
        "auto-mid": "Where the piece sits for the scene it's used in.",
        "auto-out": "Fully deployed for the final reveal.",
      },
      outOfOrderNote: "That position comes later in the cue. Park, then mid-show, then full-out — the console runs them back in the order you taught them, not the order that looks obvious from the deck.",
    },
    {
      id: "auto-save", kind: "select", target: "auto-save-btn",
      title: "Save the automation cue",
      cue: "Commit the three taught positions to the automation controller as one cue.",
      why: "An untaught position list is just where the winch happened to stop. Saving it as a cue is what lets the board operator fire it with one button during the actual show.",
    },
    {
      id: "auto-run", kind: "hold", target: "auto-run-btn", seconds: 2.5,
      title: "Run the cue at rehearsal speed and verify the deck",
      cue: "Hold RUN CUE and confirm the automated line clears the deck through every position.",
      why: "You run a brand-new automation cue at rehearsal speed with your hand on the console before it ever fires at full speed during a live show with the cast on stage.",
      holdBreakNote: "Released before the cue finished running — hold it through the whole sequence, that's the only way to catch a position that fouls the deck.",
    },
    {
      id: "log", kind: "select", target: "rigging-plot",
      title: "Sign the rigging log",
      cue: "Record the load, trim height and lock status, and sign the plot closed.",
      why: "The log is what the next call tells the next operator — load, trim and lock status, not a memory of how the show went.",
    },
  ],

  build(root) {
    const hits = {};
    const g = group(root);
    stationPad(g, 2.05, 0xff6fae);

    // -------------------------------------------------------------- pin rail + arbors
    const rail = group(g, -1.4, 0, 0, 0.3);
    slab(rail, 0.1, 2.0, 2.6, 0, 1.0, 0, 0x3a4048, { radius: 0.02, rough: 0.7, metal: 0.3 });
    for (let i = 0; i < 4; i++) {
      box(rail, 0.12, 0.03, 2.6, 0.06, 0.4 + i * 0.45, 0, CITY.darkSteel, { rough: 0.5, metal: 0.6 });
    }

    // The working line: line 4, being loaded and flown this session.
    const arborTrack = group(rail, 0.09, 0, 0.9);
    const arborCage = group(arborTrack, 0, 0, 0);
    box(arborCage, 0.02, 1.7, 0.32, 0, 0.85, 0, 0x2b3138, { rough: 0.5, metal: 0.5, cast: false });
    const bricks = [];
    for (let i = 0; i < 4; i++) {
      const brick = box(arborCage, 0.16, 0.08, 0.26, 0.05, 0.2 + i * 0.1, 0, 0x8b929a, { rough: 0.6, metal: 0.4 });
      bricks.push(brick);
    }
    holoTag(arborCage, "Line 4 · Arbor", 0, 1.78, 0, { css: "#ff6fae", w: 0.32 });
    reg(hits, arborCage, "arbor");

    const railPin = group(arborTrack, 0.14, 0.62, 0.12);
    box(railPin, 0.03, 0.03, 0.12, 0, 0, 0, 0xf2c14b, { rough: 0.5 });
    holoTag(railPin, "Locking rail", 0, 0.12, 0, { css: "#ff6fae", w: 0.3 });
    reg(hits, railPin, "locking-rail");

    const trimPin = group(arborTrack, -0.14, 1.4, 0.1);
    cyl(trimPin, 0.008, 0.008, 0.1, 0, 0, 0, 0xf2c14b, { rough: 0.5, seg: 8 }).rotation.x = Math.PI / 2;
    holoTag(trimPin, "Trim lock pin", 0, 0.1, 0, { css: "#ff6fae", w: 0.3 });
    reg(hits, trimPin, "trim-lock-pin");

    // Rope from the arbor up to the grid, and the batten it lifts.
    const rope = hose(rail, [[0.09, 1.75, 0.9], [0.5, 3.0, 0.5], [1.1, 3.1, 0.0], [1.6, 3.0, 0.0]], 0.009, 0xdfe4e8, { steps: 20, rough: 0.7 });
    const batten = group(g, 0.6, 1.9, 0, 0);
    box(batten, 2.4, 0.05, 0.05, 0, 0, 0, 0x545e67, { rough: 0.5, metal: 0.5 });
    const capacityPlate = decal(batten, 0.24, 0.06, 1.0, 0, 0.03, signFace("RATED 220 lb", { accent: "#ff6fae", scale: 0.5 }), { px: 128 });
    holoTag(batten, "Batten — line 4", 0, 0.12, 0, { css: "#ff6fae", w: 0.34 });
    reg(hits, batten, "batten-line");
    reg(hits, capacityPlate, "capacity-plate");

    // Floor zone directly under the batten — always a hazard when occupied.
    const dangerZone = box(g, 1.6, 0.01, 0.6, 0.6, 0.01, 0, 0xf0645b, { rough: 0.6, opacity: 0.16, cast: false, receive: false });
    dangerZone.material.transparent = true;
    holoTag(dangerZone, "No standing under load", 0, 0.06, 0.35, { css: "#f0645b", w: 0.4 });
    reg(hits, dangerZone, "standing-under-load");

    // Other line sets down the rail — one carrying the pre-show faults.
    const faultTrack = group(rail, 0.09, 0, -0.5);
    const faultCage = group(faultTrack, 0, 0, 0);
    box(faultCage, 0.02, 1.5, 0.3, 0, 0.75, 0, 0x2b3138, { rough: 0.5, metal: 0.5, cast: false });
    for (let i = 0; i < 3; i++) box(faultCage, 0.15, 0.08, 0.24, 0.05, 0.2 + i * 0.1, 0, 0x8b929a, { rough: 0.6, metal: 0.4 });
    const faultBrick = box(faultCage, 0.15, 0.08, 0.24, -0.12, 0.5, 0.05, 0x8b929a, { rough: 0.6, metal: 0.4 });
    holoTag(faultCage, "Line 3", 0, 1.6, 0, { css: "#ff6fae", w: 0.2 });
    reg(hits, faultBrick, "fault-brick");
    const faultPin = group(faultTrack, 0.14, 0.72, 0.12);
    box(faultPin, 0.03, 0.03, 0.12, 0.09, 0, 0, 0xf2c14b, { rough: 0.5 });
    reg(hits, faultPin, "fault-arbor-lock");
    holoTag(faultPin, "Rail pin OUT", 0, -0.08, 0, { css: "#f0645b", w: 0.3 });

    const ropeTrack = group(rail, 0.09, 0, -1.1);
    const faultRope = hose(ropeTrack, [[0, 1.4, 0], [0.05, 2.4, 0.1], [0.08, 3.0, 0.15]], 0.008, 0xc0c6cc, { steps: 14, rough: 0.7 });
    for (let i = 0; i < 4; i++) {
      hose(ropeTrack, [[0.03, 1.6 + i * 0.15, 0.02], [0.06 + (Math.random() - 0.5) * 0.05, 1.72 + i * 0.15, 0.05]], 0.002, 0xdfe4e8, { steps: 4 });
    }
    holoTag(ropeTrack, "Line 5 · Frayed", 0, 3.1, 0.16, { css: "#f0645b", w: 0.32 });
    reg(hits, faultRope, "fault-rope");

    // Unlocked arbor rail left disengaged mid-operation — a standing hazard elsewhere on the rail.
    const looseRail = group(rail, 0.11, 0.3, -1.7);
    box(looseRail, 0.03, 0.03, 0.14, 0, 0, 0, 0xf0645b, { rough: 0.5 });
    holoTag(looseRail, "Rail unlocked", 0, 0.1, 0, { css: "#f0645b", w: 0.3 });
    reg(hits, looseRail, "unlocked-rail");

    // ------------------------------------------------------- automation winch
    // A motorized "house automation" line, separate from the hand-hauled
    // counterweight lines above — the same teach/save/verify pattern used for
    // Robot Cell's arm and Flight Deck's drone, applied to a stage automation
    // winch console.
    const autoTrack = group(rail, 0.09, 0, 1.7);
    cyl(autoTrack, 0.09, 0.09, 0.3, 0, 2.6, 0, 0x2b3138, { rough: 0.4, metal: 0.6, seg: 16 });
    cyl(autoTrack, 0.01, 0.01, 2.2, 0.3, 1.5, 0, CITY.darkSteel, { rough: 0.5, metal: 0.7, seg: 8 });
    holoTag(autoTrack, "Line 6 · House Automation", 0, 2.85, 0, { css: "#ff6fae", w: 0.42 });
    const autoBatten = box(autoTrack, 0.4, 0.02, 0.02, 0.3, 2.3, 0, 0x545e67, { rough: 0.5, metal: 0.5 });

    const autoPositions = { park: 2.3, mid: 1.5, out: 0.7 };
    const autoPosDefs = [
      [autoPositions.park, "auto-park", "Park", 0x59c97b],
      [autoPositions.mid, "auto-mid", "Mid-show", 0x4fd1ff],
      [autoPositions.out, "auto-out", "Full-out", 0xffcc00],
    ];
    for (const [y, id, label, color] of autoPosDefs) {
      const ring = torus(autoTrack, 0.08, 0.01, 0.3, y, 0, color,
        { emissive: color, ei: 1.1, rough: 0.4, cast: false, seg: 6, seg2: 24 });
      ring.rotation.x = Math.PI / 2;
      holoTag(autoTrack, label, 0.3, y + 0.14, 0, { css: "#ff6fae", w: 0.3 });
      reg(hits, ring, id);
    }

    // Excess bricks stacked beside the arbor — the overload trap.
    const excess = group(g, -0.85, 0, 1.0);
    for (let i = 0; i < 5; i++) box(excess, 0.16, 0.07, 0.24, 0, 0.045 + i * 0.08, 0, 0x8b929a, { rough: 0.6, metal: 0.4 });
    holoTag(excess, "Spare bricks", 0, 0.5, 0, { css: "#f0645b", w: 0.3 });
    reg(hits, excess, "excess-bricks");

    // --------------------------------------------------------------------- fly rail HMI
    const desk = group(g, 0.2, 0, 1.55, -0.4);
    slab(desk, 0.6, 0.9, 0.3, 0, 0.45, 0, 0x53585e, { radius: 0.03, rough: 0.5, metal: 0.4 });
    const headsetHook = group(desk, -0.15, 0.75, 0);
    torus(headsetHook, 0.06, 0.012, 0, 0, 0, 0x2b3138, { rough: 0.5 });
    box(headsetHook, 0.03, 0.1, 0.02, 0, -0.06, 0, 0x2b3138, { rough: 0.5 });
    holoTag(headsetHook, "Comms headset", 0, 0.14, 0, { css: "#ff6fae", w: 0.3 });
    reg(hits, headsetHook, "headset");

    // Automation cue console, on the same fly rail desk as the manual calls.
    const autoConsole = group(desk, -0.15, 0.5, 0.16);
    const autoScreen = decal(autoConsole, 0.1, 0.06, 0, 0.05, 0.006,
      signFace("CUE 6", { bg: "#11181f", accent: "#ff6fae", fg: "#fdecf3", scale: 0.55 }), { glow: true, ei: 0.8, px: 160 });
    const autoSaveBtn = cyl(autoConsole, 0.016, 0.016, 0.01, -0.025, -0.03, 0.006, 0x59c97b, { rough: 0.4, seg: 14 });
    autoSaveBtn.rotation.x = Math.PI / 2;
    reg(hits, autoSaveBtn, "auto-save-btn");
    const autoRunBtn = cyl(autoConsole, 0.016, 0.016, 0.01, 0.025, -0.03, 0.006, 0x4fd1ff, { rough: 0.4, seg: 14 });
    autoRunBtn.rotation.x = Math.PI / 2;
    reg(hits, autoRunBtn, "auto-run-btn");
    holoTag(autoConsole, "Save · Run cue", 0, -0.06, 0, { css: "#ff6fae", w: 0.3 });

    const callBoard = group(desk, 0.15, 0.75, 0.05);
    const callFaces = {};
    const calls = [{ id: "call-clear", label: "CLEAR", x: -0.09 }, { id: "call-moving", label: "MOVING", x: 0 }, { id: "call-stopped", label: "STOPPED", x: 0.09 }];
    for (const c of calls) {
      const holder = group(callBoard, c.x, 0, 0);
      box(holder, 0.08, 0.05, 0.01, 0, 0, 0, 0x11181f, { rough: 0.6 });
      callFaces[c.id] = decal(holder, 0.07, 0.042, 0, 0, 0.006, signFace(c.label, { bg: "#11181f", accent: "#ff6fae", scale: 0.4 }), { px: 128 });
      reg(hits, holder, c.id);
    }
    holoTag(callBoard, "Fly cue calls", 0, 0.14, 0, { css: "#ff6fae", w: 0.32 });

    // Override shortcut call button — the hazard.
    const shortcut = group(desk, 0, 0.5, 0.16);
    cyl(shortcut, 0.03, 0.03, 0.03, 0, 0, 0, 0xf2c14b, { rough: 0.5, seg: 14 }).rotation.x = Math.PI / 2;
    decal(shortcut, 0.07, 0.02, 0, -0.045, 0, signFace("OVERRIDE", { bg: "#2a1a0d", accent: "#f2c14b", scale: 0.5 }), { px: 96 });
    holoTag(shortcut, "No clearance check", 0, 0.08, 0, { css: "#f0645b", w: 0.32 });
    reg(hits, shortcut, "shortcut-call");

    // Floor watch stagehand.
    const watch = standingFigure(g, 1.4, -1.0, { ry: 2.6, cloth: 0x2b3138, vest: 0xff6fae, helmet: 0x1b1e22 });
    holoTag(watch, "Floor watch", 0, 1.95, 0.15, { css: "#ff6fae", w: 0.28 });
    reg(hits, watch, "floor-watch");

    // -------------------------------------------------------------------- rigging plot
    const chest = toolChest(g, 1.7, -1.3, { ry: -0.6, color: 0xff6fae });
    const plot = holoPanel(g, 0.56, 0.4, 1.9, 1.5, -0.6, (ctx, w, h) => {
      ctx.fillStyle = "rgba(20,6,16,0.9)"; ctx.fillRect(0, 0, w, h);
      ctx.fillStyle = "#ff6fae"; ctx.fillRect(0, 0, w, 5);
      ctx.fillStyle = "#e2a9c0";
      ctx.font = `600 ${Math.round(h * 0.09)}px 'Barlow Condensed', Arial, sans-serif`;
      ctx.textAlign = "left"; ctx.textBaseline = "middle";
      ctx.fillText("RIGGING PLOT — LINE 4", w * 0.06, h * 0.14);
      ctx.fillStyle = "#fdecf3";
      ctx.font = `600 ${Math.round(h * 0.14)}px 'Barlow Condensed', Arial, sans-serif`;
      ctx.fillText("ACT 2 BACKDROP", w * 0.06, h * 0.33);
      ctx.font = `${Math.round(h * 0.085)}px Arial, sans-serif`;
      ctx.fillStyle = "#e2a9c0";
      ["Rated capacity: 220 lb", "Planned load: 190 lb",
       "Trim height: 24' 0\"", "Comms: channel 2",
       "Floor watch: posted"].forEach((line, i) => ctx.fillText(line, w * 0.06, h * (0.5 + i * 0.11)));
    }, { ry: -0.5, accent: 0xff6fae });
    reg(hits, plot, "rigging-plot");
    const arborMeter = instrument(chest, -0.08, 0.79, 0, { ry: 0.3, idle: "-- lb", color: 0xff6fae });
    holoTag(arborMeter, "Arbor scale", 0, 0.16, 0, { css: "#ff6fae", w: 0.28 });

    let batOnRail = false;
    let flying = false;

    return {
      hits,
      footprint: 2.05,

      onStepComplete(step) {
        if (step.id === "load-weights") bricks.forEach((b, i) => { b.material = mat(0xff9dc4, { rough: 0.5, metal: 0.3 }); });
        if (step.id === "lock-arbor") { batOnRail = true; railPin.rotation.z = -0.9; }
        if (step.id === "fly-cue") { flying = true; }
        if (step.id === "trim-lock") { flying = false; trimPin.rotation.z = 1.2; }
        if (step.id === "auto-save") {
          repaint(autoScreen, signFace("SAVED", { bg: "#0f1b14", accent: "#59c97b", fg: "#bff7d4", scale: 0.5 }));
        }
        if (step.id === "auto-run") {
          autoBatten.position.y = autoPositions.out;
          repaint(autoScreen, signFace("VERIFIED", { bg: "#0f1b14", accent: "#59c97b", fg: "#bff7d4", scale: 0.4 }));
        }
        if (step.id === "log") {
          repaint(callFaces["call-stopped"], signFace("LOGGED", { bg: "#0f1b14", accent: "#59c97b", fg: "#bff7d4", scale: 0.34 }));
        }
      },

      animate(t, dt, session) {
        if (flying) batten.position.y = 1.9 - Math.min(0.5, (t % 4) * 0.15);
        watch.userData.head.rotation.y = Math.sin(t * 0.6) * 0.3;

        const gg = session?.gauge;
        if (gg && !gg.committed && session.step?.id === "load-weights") {
          const lb = Math.round(160 + gg.t * 60);
          repaint(arborMeter.userData.screen, signFace(`${lb} lb`, {
            bg: "#0d1c24", accent: gg.t > 0.42 && gg.t < 0.58 ? "#59c97b" : "#ff6fae", fg: "#bfeaf7", scale: 0.55,
          }));
        }

        // Cue playback: the automation batten rides park -> mid -> full-out in
        // step with how far the RUN CUE hold has gotten.
        if (session?.step?.id === "auto-run" && session.holding) {
          const p = Math.min(1, session.holdFor / session.step.seconds);
          const { park, mid, out } = autoPositions;
          autoBatten.position.y = p < 0.5 ? park + (mid - park) * (p * 2) : mid + (out - mid) * ((p - 0.5) * 2);
        }
      },
    };
  },
};

// SmartCiti.X~ Line Truck VR — its own gamified system: Storm Command.
// Bucket-truck line work. Rubber goes on before the boom goes near a
// conductor, the truck is bonded before the boom moves at all, and a ground
// clamp only ever meets a line the tester has already proven dead.

const SIM_LINE_TRUCK = {
  id: "line-truck",
  index: "19",
  domain: "Energy",
  trade: "Outside / overhead lineworker (IBEW)",
  name: "Line Truck",
  title: simTitle("Line Truck"),
  tagline: "Bucket-truck line work: rubber goods testing, isolation and correct grounding order",
  accent: 0xfcee21,
  accentCss: "#fcee21",
  parSeconds: 250,
  badge: { id: "storm-ready", name: "Storm Ready", note: "Full de-energized procedure with rubber proven and grounds applied in order" },

  game: system({
    name: "Storm Command",
    currency: "VOLT",
    ranks: ["Ground Hand", "Apprentice Lineman", "Journeyman Lineman", "Crew Lead", "Storm Certified"],
    badges: [
      { id: "rubber-proven", name: "Rubber Proven", note: "Never approach the conductor unprotected", test: AWARD.safe },
      { id: "dead-line-true", name: "Dead Line True", note: "Hold every test reading near band centre", test: AWARD.precise(0.72) },
      { id: "grounds-clean", name: "Grounds Clean", note: "Apply every ground in the correct order", test: AWARD.stepClean("apply-grounds") },
    ],
    challenges: [
      { id: "storm-window", name: "Storm Window", note: "Complete inside 80% of par", test: AWARD.fast(0.8) },
      { id: "no-flash", name: "No Flash", note: "Clean run, no corrections", test: AWARD.clean },
      { id: "crew-streak", name: "Crew Streak", note: "Nine correct actions in a row", test: AWARD.streak(9) },
    ],
  }),

  hazards: {
    "energized-conductor": "You brought the bucket inside the minimum approach distance without rubber gloves and sleeves donned. Inside that distance the air gap itself is no longer your protection — the rubber is, and it goes on before the boom does.",
    "damaged-glove": "That rubber glove has a puncture that the air test would have caught. Wearing a failed glove is worse than wearing none, because it tells you it's protecting you right up until it doesn't.",
    "ground-point-untested": "You reached for the equipment ground before the tester confirmed the line was actually dead. If that conductor is still live, the ground set becomes the path to ground — through whoever is holding it.",
    "boom-control": "That is the boom lift control. Operating the boom before the truck chassis is bonded and grounded leaves the whole vehicle, and anyone touching it, at line potential the instant the boom contacts an energized conductor.",
  },

  lateNotes: {
    "hotstick-meter": "Zero energy is confirmed with the tester after the switch is open — the switch position alone is never treated as proof by itself.",
    "ground-electrode-clamp": "Grounds go on only after the line has tested dead on the meter — never on the strength of the switch position alone.",
  },

  steps: [
    {
      id: "tailboard", kind: "select", target: "tailboard-board",
      title: "Hold the tailboard briefing",
      cue: "Read the job briefing: hazards, PPE and the minimum approach distance for this voltage class.",
      why: "The minimum approach distance changes with voltage class. Everyone on the crew hears the same number before anyone leaves the ground.",
    },
    {
      id: "outrigger", kind: "select", target: "outriggers",
      title: "Set the outriggers",
      cue: "Extend and set the truck's outriggers before raising the boom.",
      why: "A boom worked from an unstabilized truck can shift the whole vehicle under load — the outriggers are what turn the truck into a fixed base.",
    },
    {
      id: "truck-ground", kind: "select", target: "truck-ground-rod",
      title: "Bond and ground the truck",
      cue: "Drive the ground rod and bond the chassis before any boom work begins.",
      why: "If the boom ever contacts an energized conductor, the bond is what keeps the truck body from becoming the fastest path to ground through a person standing on it.",
    },
    {
      id: "glove-test", kind: "gauge", target: "glove-inflator",
      title: "Air-test the rubber gloves",
      cue: "Inflate the gloves and commit once they hold pressure with no leak.",
      why: "A pinhole in rubber goods is invisible until it's under pressure. The air test finds it before the glove ever gets near a conductor.",
      gauge: {
        label: "GLOVE AIR TEST — HELD PRESSURE", speed: 0.6, green: [0.62, 0.85],
        readout: (t) => `${Math.round(t * 100)}% held`,
        missNote: "Pressure dropping — that's a leak. Pull that pair from service and test the spares.",
      },
    },
    {
      id: "sleeve-check", kind: "select", target: "sleeves",
      title: "Inspect the rubber sleeves",
      cue: "Check the sleeves for cuts, ozone cracking or embedded debris.",
      why: "Sleeves cover the reach between the glove and the shoulder — a cut there is just as live a path as a cut in the glove itself.",
    },
    {
      id: "liner-check", kind: "select", target: "bucket-liner",
      title: "Inspect the bucket liner",
      cue: "Check the fibreglass bucket liner for cracks or contamination.",
      why: "The liner is the insulating barrier between you and the boom's conductive structure. A cracked or dirty liner stops being an insulator exactly when you need it to be one.",
    },
    {
      id: "boom-test", kind: "gauge", target: "boom-tester",
      title: "Dielectric-test the boom",
      cue: "Run the insulation test on the boom and commit inside the passing range.",
      why: "The boom's fibreglass insulation is tested on its own schedule, not assumed sound because it looked fine yesterday.",
      gauge: {
        label: "BOOM DIELECTRIC TEST — INSULATION", speed: 0.65, green: [0.55, 0.75],
        readout: (t) => `${Math.round(t * 150)} MΩ`,
        missNote: "Below the passing resistance. Tag the boom out of service rather than trust it near a conductor.",
      },
    },
    {
      id: "mad-check", kind: "select", target: "mad-marker",
      title: "Confirm the minimum approach distance",
      cue: "Mark and confirm the minimum approach boundary for this voltage class before the boom moves in.",
      why: "The boundary is set before the boom starts moving, not judged by eye once the bucket is already close to the conductor.",
    },
    {
      id: "isolate", kind: "turn", target: "line-switch",
      title: "Open the line switch",
      cue: "Grab the switch handle and pull the upstream switch open.",
      why: "This is the isolation. Everything from here on is checked against the assumption that a switch position can still be wrong.",
      turn: { turns: 0.16, axis: "z", reverse: true, label: "LINE SWITCH" },
    },
    {
      id: "verify-dead", kind: "gauge", target: "hotstick-meter",
      title: "Test the line dead with a hot stick",
      cue: "Phase the line with the hot stick tester and commit when it reads dead.",
      why: "The switch tells you what should be true. The hot stick tester tells you what is actually true on this conductor, right now.",
      gauge: {
        label: "PHASING TESTER — LINE VOLTAGE", speed: 0.6, green: [0.0, 0.08],
        readout: (t) => `${Math.round(t * 14400)} V`,
        missNote: "Still reading live. Recheck the switch and the phasing before any ground goes on.",
      },
    },
    {
      id: "apply-grounds", kind: "sequence",
      targets: ["ground-electrode-clamp", "neutral-clamp", "phase-clamp"],
      itemNames: {
        "ground-electrode-clamp": "ground electrode clamp", "neutral-clamp": "neutral clamp", "phase-clamp": "phase conductor clamp",
      },
      title: "Apply personal protective grounds in order",
      cue: "Clamp to the ground electrode first, then the neutral, then the phase conductor last.",
      why: "Clamping the ground end first means if the phase turns out to be live when you make that last connection, the low-resistance path is already there waiting for the fault current instead of you.",
      outOfOrderNote: "Wrong order — ground electrode first, then neutral, then the phase conductor. Removal happens in the exact reverse.",
    },
    {
      id: "rescue-ready", kind: "select", target: "rescue-hook",
      title: "Confirm rescue readiness",
      cue: "Check the pole-top and bucket rescue hook and line are staged and ready.",
      why: "Rescue equipment staged before work starts is the only version that is actually usable in the first thirty seconds of an emergency.",
    },
  ],

  build(root) {
    const hits = {};
    const g = group(root);
    stationPad(g, 2.1, 0xfcee21);

    // ---------------------------------------------------------------------- the truck
    const truck = group(g, -0.9, 0, 0.5, 0.5);
    slab(truck, 1.6, 0.6, 0.9, 0, 0.5, 0, 0xf2c14b, { radius: 0.05, rough: 0.4, metal: 0.5 });
    box(truck, 0.9, 0.5, 0.85, -0.5, 0.9, 0, 0xe8e8e8, { radius: 0.04, rough: 0.35, metal: 0.4 });
    for (const [wx, wz] of [[-0.55, -0.42], [-0.55, 0.42], [0.55, -0.42], [0.55, 0.42]]) {
      cyl(truck, 0.22, 0.22, 0.18, wx, 0.22, wz, 0x1b1e22, { rough: 0.8, seg: 16 }).rotation.x = Math.PI / 2;
    }
    holoTag(truck, "Bucket truck 12", 0, 1.3, 0.4, { css: "#fcee21", w: 0.34 });

    const outriggerGroup = group(truck, 0, 0.15, -0.5);
    const outriggerPads = [];
    for (const sx of [-1, 1]) {
      const pad = box(outriggerGroup, 0.22, 0.05, 0.22, sx * 0.75, -0.1, 0, 0x2b3138, { rough: 0.6, metal: 0.4 });
      box(outriggerGroup, 0.04, 0.15, 0.04, sx * 0.75, -0.02, 0, CITY.steel, { rough: 0.4, metal: 0.8 });
      outriggerPads.push(pad);
    }
    holoTag(outriggerGroup, "Outriggers", 0, 0.1, 0, { css: "#fcee21", w: 0.3 });
    reg(hits, outriggerGroup, "outriggers");

    // Boom, bucket, and lift control.
    const boomBase = group(truck, 0.2, 1.1, 0, -0.3);
    const boomArm = group(boomBase, 0, 0, 0);
    box(boomArm, 0.14, 0.14, 1.6, 0, 0.1, 0.8, 0xf2c14b, { radius: 0.04, rough: 0.55, metal: 0.2 });
    boomArm.rotation.x = -0.5;
    const bucket = group(boomArm, 0, 0.55, 1.55);
    box(bucket, 0.34, 0.5, 0.3, 0, 0, 0, 0xe8e8e8, { radius: 0.04, rough: 0.45 });
    holoTag(bucket, "Bucket", 0, 0.35, 0, { css: "#fcee21", w: 0.24 });
    reg(hits, bucket, "bucket-liner");

    const boomCtrl = group(boomBase, -0.16, -0.05, -0.1);
    box(boomCtrl, 0.1, 0.14, 0.08, 0, 0, 0, 0x22272c, { rough: 0.5, metal: 0.4 });
    const boomLever = box(boomCtrl, 0.02, 0.09, 0.02, 0, 0.08, 0.03, 0xd8232a, { rough: 0.5 });
    holoTag(boomCtrl, "Boom lift control", 0, 0.16, 0, { css: "#f0645b", w: 0.32 });
    reg(hits, boomCtrl, "boom-control");

    // Ground rod and bonding cable for the chassis.
    const groundRod = group(truck, -0.9, -0.5, 0.5);
    cyl(groundRod, 0.012, 0.012, 0.5, 0, 0.25, 0, 0x8b5a2b, { rough: 0.6, seg: 10 });
    hose(truck, [[-0.9, 0.0, 0.5], [-0.7, 0.1, 0.3], [-0.5, 0.5, 0]], 0.008, 0x2b3138, { steps: 12, rough: 0.6 });
    holoTag(groundRod, "Chassis ground", 0, 0.55, 0, { css: "#fcee21", w: 0.3 });
    reg(hits, groundRod, "truck-ground-rod");

    // -------------------------------------------------------------------------- pole
    const pole = group(g, 1.1, 0, -0.9);
    cyl(pole, 0.07, 0.09, 2.6, 0, 1.3, 0, 0x6b4b30, { rough: 0.85, seg: 12 });
    const crossarm = box(pole, 0.9, 0.06, 0.08, 0, 2.3, 0, 0x6b4b30, { rough: 0.85 });
    const phases = [];
    for (const px of [-0.35, 0, 0.35]) {
      const insulator = cyl(pole, 0.02, 0.03, 0.12, px, 2.4, 0, 0x8b929a, { rough: 0.5, metal: 0.4, seg: 10 });
      const wire = hose(pole, [[px, 2.46, 0], [px, 2.46, -1.6]], 0.008, 0x2b3138, { steps: 8, rough: 0.6 });
      phases.push(wire);
    }
    reg(hits, phases[1], "energized-conductor");
    const neutral = hose(pole, [[0, 1.9, 0], [0, 1.9, -1.6]], 0.008, 0x2b3138, { steps: 8, rough: 0.6 });
    const lineSwitchGroup = group(pole, -0.5, 1.6, 0);
    box(lineSwitchGroup, 0.14, 0.24, 0.08, 0, 0, 0, 0x53585e, { rough: 0.5, metal: 0.4 });
    const switchHandle = box(lineSwitchGroup, 0.03, 0.14, 0.03, 0, 0.16, 0.05, 0xd8232a, { rough: 0.5 });
    holoTag(lineSwitchGroup, "Line switch", 0, 0.3, 0, { css: "#fcee21", w: 0.28 });
    reg(hits, lineSwitchGroup, "line-switch");
    lineSwitchGroup.userData.wheel = switchHandle; // the part app.js actually spins for the 'turn' step

    // Minimum approach distance boundary marker on the ground beneath the pole.
    const madRing = torus(g, 1.1, 0.02, 1.1, 0.01, -0.9, 0xf0645b, { emissive: 0xf0645b, ei: 1.2, rough: 0.4, cast: false, seg: 6, seg2: 40 });
    madRing.rotation.x = Math.PI / 2;
    holoTag(g, "Minimum approach boundary", 1.1, 0.3, -1.9, { css: "#f0645b", w: 0.42 });
    reg(hits, madRing, "mad-marker");

    // Ground clamp set, hanging on the truck bed ready to be applied.
    const groundSet = group(truck, 0.4, -0.15, 0.5);
    const clampFaces = { "ground-electrode-clamp": null, "neutral-clamp": null, "phase-clamp": null };
    const clamps = [
      { id: "ground-electrode-clamp", label: "GND", x: -0.14 },
      { id: "neutral-clamp", label: "NEUT", x: 0 },
      { id: "phase-clamp", label: "PHASE", x: 0.14 },
    ];
    for (const c of clamps) {
      const holder = group(groundSet, c.x, 0, 0);
      cyl(holder, 0.018, 0.018, 0.09, 0, 0, 0, CITY.steel, { rough: 0.35, metal: 0.85, seg: 10 });
      const face = decal(holder, 0.09, 0.03, 0, 0.06, 0, signFace(c.label, { bg: "#2a1a0d", accent: "#fcee21", scale: 0.5 }), { px: 96 });
      clampFaces[c.id] = face;
      reg(hits, holder, c.id);
    }
    holoTag(groundSet, "Protective grounds", 0, 0.14, 0, { css: "#fcee21", w: 0.34 });

    // Untested ground point on the pole — reaching here before the tester is the trap.
    const groundPointTrap = group(pole, 0.5, 1.9, 0);
    cyl(groundPointTrap, 0.02, 0.02, 0.06, 0, 0, 0, 0x8b5a2b, { rough: 0.6, seg: 10 });
    holoTag(groundPointTrap, "Untested ground point", 0, 0.1, 0, { css: "#f0645b", w: 0.36 });
    reg(hits, groundPointTrap, "ground-point-untested");

    // ------------------------------------------------------------ PPE and instruments
    const chest = toolChest(g, 1.5, 1.4, { ry: -0.7, color: 0xfcee21 });
    const gloveGroup = group(chest, -0.14, 0.79, 0.06, 0.3);
    for (const sx of [-1, 1]) box(gloveGroup, 0.05, 0.14, 0.02, sx * 0.03, 0, 0, 0xd8b23a, { rough: 0.65 });
    holoTag(gloveGroup, "Rubber gloves", 0, 0.16, 0, { css: "#fcee21", w: 0.3 });
    const inflator = instrument(chest, -0.14, 0.79, 0.16, { ry: 0.4, idle: "-- % held", color: 0xfcee21 });
    holoTag(inflator, "Glove inflator", 0, 0.16, 0, { css: "#fcee21", w: 0.3 });
    reg(hits, inflator, "glove-inflator");

    const damagedGlove = group(g, 1.7, 0, 1.1, -0.3);
    box(damagedGlove, 0.05, 0.16, 0.02, 0, 0.16, 0, 0xd8b23a, { rough: 0.65 });
    decal(damagedGlove, 0.03, 0.02, 0.026, 0.14, 0, signFace("X", { bg: "#2a1a0d", accent: "#f0645b", scale: 0.7 }), { px: 64 });
    holoTag(damagedGlove, "Punctured glove", 0, 0.28, 0, { css: "#f0645b", w: 0.3 });
    reg(hits, damagedGlove, "damaged-glove");

    const sleeveGroup = group(chest, 0, 0.79, 0.1, 0.3);
    for (const sx of [-1, 1]) cyl(sleeveGroup, 0.045, 0.045, 0.16, sx * 0.06, 0, 0, 0xd8b23a, { rough: 0.65, seg: 12 });
    holoTag(sleeveGroup, "Rubber sleeves", 0, 0.18, 0, { css: "#fcee21", w: 0.3 });
    reg(hits, sleeveGroup, "sleeves");

    const boomTester = instrument(chest, 0.12, 0.79, 0.02, { ry: -0.4, idle: "-- MΩ", color: 0xfcee21 });
    holoTag(boomTester, "Megger", 0, 0.16, 0, { css: "#fcee21", w: 0.26 });
    reg(hits, boomTester, "boom-tester");

    const hotstick = instrument(chest, -0.02, 0.82, -0.1, { ry: 0.2, idle: "-- V", color: 0xfcee21 });
    holoTag(hotstick, "Hot stick tester", 0, 0.16, 0, { css: "#fcee21", w: 0.32 });
    reg(hits, hotstick, "hotstick-meter");

    const rescueHook = group(g, -1.7, 0, 1.4, 0.3);
    cyl(rescueHook, 0.014, 0.014, 1.1, 0, 0.55, 0, 0xd8b23a, { rough: 0.55, seg: 8 });
    cyl(rescueHook, 0.03, 0.02, 0.1, 0, 1.08, 0.03, CITY.steel, { rough: 0.4, metal: 0.7, seg: 10 }).rotation.x = 0.6;
    holoTag(rescueHook, "Rescue hook", 0, 1.2, 0, { css: "#fcee21", w: 0.3 });
    reg(hits, rescueHook, "rescue-hook");

    const tailboard = holoPanel(g, 0.56, 0.4, -1.9, 1.5, -0.6, (ctx, w, h) => {
      ctx.fillStyle = "rgba(20,18,4,0.9)"; ctx.fillRect(0, 0, w, h);
      ctx.fillStyle = "#fcee21"; ctx.fillRect(0, 0, w, 5);
      ctx.fillStyle = "#e0dca0";
      ctx.font = `600 ${Math.round(h * 0.09)}px 'Barlow Condensed', Arial, sans-serif`;
      ctx.textAlign = "left"; ctx.textBaseline = "middle";
      ctx.fillText("TAILBOARD BRIEFING", w * 0.06, h * 0.14);
      ctx.fillStyle = "#fbfbe6";
      ctx.font = `600 ${Math.round(h * 0.14)}px 'Barlow Condensed', Arial, sans-serif`;
      ctx.fillText("CIRCUIT 12 — 14.4 kV", w * 0.06, h * 0.33);
      ctx.font = `${Math.round(h * 0.085)}px Arial, sans-serif`;
      ctx.fillStyle = "#e0dca0";
      ["Min. approach: 2 ft 2 in", "Rubber gloves + sleeves: class 2",
       "Grounds: ground, neutral, phase", "Truck bonded before boom work",
       "Rescue hook staged"].forEach((line, i) => ctx.fillText(line, w * 0.06, h * (0.5 + i * 0.11)));
    }, { ry: 0.6, accent: 0xfcee21 });
    reg(hits, tailboard, "tailboard-board");

    let energized = true;
    let grounded = false;

    return {
      hits,
      footprint: 2.1,

      onStepComplete(step) {
        if (step.id === "outrigger") outriggerPads.forEach((p) => { p.position.y = -0.15; });
        // switchHandle is turned live by the player's drag while this step is active.
        if (step.id === "isolate") energized = false;
        if (step.id === "verify-dead") phases.forEach((p) => { p.material = mat(0x53585e, { rough: 0.6 }); });
        if (step.id === "apply-grounds") { grounded = true; }
        if (step.id === "rescue-ready") holoTag(g, "Ready", -1.7, 1.5, 1.4, { css: "#59c97b", w: 0.2 });
      },

      animate(t, dt, session) {
        boomLever.rotation.x = Math.sin(t * 0.6) * 0.1;

        const gg = session?.gauge;
        if (gg && !gg.committed) {
          if (session.step?.id === "glove-test") {
            repaint(inflator.userData.screen, signFace(`${Math.round(gg.t * 100)}% held`, {
              bg: "#0d1c24", accent: gg.t > 0.62 && gg.t < 0.85 ? "#59c97b" : "#f0645b", fg: "#bfeaf7", scale: 0.45,
            }));
          }
          if (session.step?.id === "boom-test") {
            repaint(boomTester.userData.screen, signFace(`${Math.round(gg.t * 150)} MΩ`, {
              bg: "#0d1c24", accent: gg.t > 0.55 && gg.t < 0.75 ? "#59c97b" : "#f0645b", fg: "#bfeaf7", scale: 0.5,
            }));
          }
          if (session.step?.id === "verify-dead") {
            repaint(hotstick.userData.screen, signFace(`${Math.round(gg.t * 14400)} V`, {
              bg: "#0d1c24", accent: gg.t < 0.08 ? "#59c97b" : "#f0645b", fg: "#bfeaf7", scale: 0.5,
            }));
          }
        }
      },
    };
  },
};

const SIM_DOCK_CRANE = {
  id: "dock-crane",
  index: "20",
  domain: "Maritime",
  trade: "Longshoreman / container-crane operator",
  name: "Dock Crane",

  badge: { id: "waterfront-certified", name: "Waterfront Certified", note: "Full lift cycle with the red zone clear and every lock verified" },

  game: system({
    name: "Waterfront Authority",
    currency: "DOCK",
    ranks: ["Lashing Hand", "Signal Person", "Crane Operator", "Gang Boss", "Waterfront Certified"],
    badges: [
      { id: "red-zone-clear", name: "Red Zone Clear", note: "Never stand under a suspended load", test: AWARD.safe },

      { id: "gang-streak", name: "Gang Streak", note: "Nine correct actions in a row", test: AWARD.streak(9) },

  hazards: {

    "lashing-cutter": "That is a cutting tool, not a release. Cutting a lashing rod instead of unwinding the turnbuckle releases it with no control at all — exactly the uncontrolled shift that the top-down order exists to prevent.",
    "hoist-override": "That switch silences the unseated twist-lock warning instead of fixing it. Hoisting on an overridden warning means you find out which corner wasn't locked only after the container is already in the air.",
    "wind-override": "That switch bypasses the wind-speed lockout. Above the crane's rated wind limit the load can swing further than the operator can control, and overriding the limit does not change what the wind is actually doing to the box.",
  },

  lateNotes: {
    "spreader-bar": "The spreader only comes down onto the container once every lashing rod for that tier is off — not while one is still holding it to the stack.",
    "hoist-lever": "The hoist only takes weight once every corner lock reads engaged — not on three out of four.",
  },

  steps: [
    {
      id: "briefing", kind: "select", target: "lift-plan",
      title: "Hold the pre-lift briefing",
      cue: "Confirm the container weight, lift plan and the lashing gang's positions.",
      why: "The lashing gang and the crane operator are working the same box from two different places — the briefing is what keeps their timing matched.",
    },
    {
      id: "load-chart", kind: "select", target: "load-chart-board",
      title: "Check the load chart",
      cue: "Confirm the container's weight is inside the crane's rated capacity at this radius.",
      why: "Rated capacity falls as boom radius increases. The chart is checked for this specific lift, not assumed from a similar box lifted yesterday.",
    },
    {
      id: "wind-check", kind: "gauge", target: "anemometer",
      title: "Check wind speed against the rated limit",
      cue: "Read the anemometer and commit while it holds inside the crane's operating limit.",
      why: "A container is a sail once it leaves the stack. Wind speed against the crane's rated limit is checked before the box is off the chassis, not discovered mid-swing.",
      gauge: {
        label: "ANEMOMETER — WIND SPEED", speed: 0.55, green: [0.0, 0.42],
        readout: (t) => `${Math.round(t * 48)} mph`,
        missNote: "Over the crane's rated wind limit. Hold the lift and secure the boom until it drops.",
      },
    },
    {
      id: "red-zone-clear", kind: "select", target: "red-zone-marker",
      title: "Confirm the red zone is clear",
      cue: "Check and flag the red zone beneath the lift path clear of the lashing gang.",
      why: "This is confirmed before the box leaves the stack — once it's swinging, the red zone is not a place anyone can duck into or out of safely.",
    },
    {
      id: "lashing-release", kind: "sequence",
      targets: ["lash-top", "lash-mid", "lash-bottom"],
      itemNames: { "lash-top": "top-tier lashing rods", "lash-mid": "mid-tier lashing rods", "lash-bottom": "bottom-tier lashing rods" },
      title: "Release the lashings top-down",
      cue: "Unwind and free the lashing rods from the top tier down to the bottom.",
      why: "A stack is only stable while the tiers above are still tied. Releasing bottom-up leaves an upper tier held by nothing while someone is still standing among the containers.",
      outOfOrderNote: "Wrong order — lashings release top-tier first, then mid, then bottom. Bottom-up leaves an upper tier unsupported.",
    },
    {
      id: "spreader-position", kind: "select", target: "spreader-bar",
      title: "Position the spreader over the container",
      cue: "Land the spreader bar squarely on the container's corner castings.",
      why: "A spreader set even slightly off the castings will not seat the twist-locks properly no matter how solid they look going in.",
    },
    {
      id: "twist-lock-check", kind: "find", noHint: true,
      targets: ["corner-unlatched", "indicator-false"],
      itemNames: { "corner-unlatched": "unlatched corner lock", "indicator-false": "corner light showing false-locked" },
      itemNotes: {
        "corner-unlatched": "That twist-lock handle is still open — the corner casting is not actually captured no matter what the panel says.",
        "indicator-false": "That indicator reads locked but the lock itself has not rotated fully closed — the light is telling you something that isn't true.",
      },
      decoyNotes: {
        "corner-good-1": "That corner is fully seated and reading correctly — leave it.",
        "corner-good-2": "That corner is fully seated and reading correctly — leave it.",
      },
      title: "Verify all four twist-locks",
      cue: "Check each corner by hand. Two of the four don't match what the panel shows.",
      why: "The panel tells you what the sensors think happened. Checking the handles is how you find out what actually happened.",
    },
    {
      id: "signal-check", kind: "select", target: "signal-person",
      title: "Confirm with the signal person",
      cue: "Get a clear signal from the deck before taking any weight on the hook.",
      why: "The operator's view of the container is partly blocked from the cab. The signal person is watching the one angle the operator can't.",
    },
    {
      id: "hoist", kind: "select", target: "hoist-lever",
      title: "Take the lift",
      cue: "Take up slack smoothly and lift the container clear of the stack.",
      why: "A smooth take-up lets you feel the load coming on evenly. A snatched lift is how a marginal lock finally lets go.",
    },
    {
      id: "land-release", kind: "sequence",
      targets: ["lower-container", "release-twist-locks", "retract-spreader"],
      itemNames: { "lower-container": "lower onto the chassis", "release-twist-locks": "release the twist-locks", "retract-spreader": "retract the spreader" },
      title: "Land and release in order",
      cue: "Lower fully onto the chassis, confirm the hook is slack, then release the locks and retract.",
      why: "The locks only release once the container's full weight is back on the chassis — releasing early hands the load's weight to whatever is left holding it, which may be nothing.",
      outOfOrderNote: "Wrong order — the container lands and takes its own weight first, then the locks release, then the spreader retracts.",
    },
    {
      id: "log", kind: "select", target: "lift-plan",
      title: "Close the lift log",
      cue: "Record the lift weight, wind reading and lock verification, and sign the plan closed.",
      why: "The log is the record a surveyor or the next shift reads — what was lifted, in what wind, with which corners verified.",
    },
  ],

  build(root) {
    const hits = {};
    const g = group(root);
    stationPad(g, 2.1, 0x3a7ca5);

    // ------------------------------------------------------------------- container stack
    const stack = group(g, -0.9, 0, 0.2);
    const tierColors = [0xb8402f, 0x2f6f8c, 0xd8b23a];
    const rods = [];
    for (let tier = 0; tier < 3; tier++) {
      const box1 = box(stack, 1.1, 0.42, 0.5, 0, 0.25 + tier * 0.44, 0, tierColors[tier], { rough: 0.6, metal: 0.15 });
      const rod = cyl(stack, 0.012, 0.012, 0.4, -0.4, 0.05 + tier * 0.44, 0.3, 0xc0c6cc, { rough: 0.4, metal: 0.7, seg: 8 });
      rod.rotation.z = Math.PI / 2.2;
      rods.push(rod);
    }
    reg(hits, rods[2], "lash-top");
    reg(hits, rods[1], "lash-mid");
    reg(hits, rods[0], "lash-bottom");
    holoTag(stack, "Stack 14 — 3 tier", 0, 1.6, 0.3, { css: "#3a7ca5", w: 0.36 });

    // Cutting tool left beside the stack — the shortcut trap.
    const cutter = group(g, -1.5, 0, 0.6, 0.4);
    box(cutter, 0.28, 0.03, 0.06, 0, 0.1, 0, 0xd8232a, { rough: 0.5 });
    box(cutter, 0.03, 0.14, 0.02, 0.12, 0.14, 0, 0x22272c, { rough: 0.5 });
    holoTag(cutter, "Bolt cutter", 0, 0.24, 0, { css: "#f0645b", w: 0.28 });
    reg(hits, cutter, "lashing-cutter");

    // ------------------------------------------------------------------------- the crane
    const crane = group(g, 0.6, 0, -0.6);
    box(crane, 0.5, 2.6, 0.5, 0, 1.3, 0, 0x53585e, { rough: 0.55, metal: 0.4 });
    const boom = group(crane, 0, 2.6, 0, -0.1);
    box(boom, 3.0, 0.22, 0.3, 1.3, 0, 0, 0x3a7ca5, { rough: 0.5, metal: 0.3 });
    const trolley = group(boom, 2.4, -0.15, 0);
    box(trolley, 0.22, 0.14, 0.26, 0, 0, 0, 0x2b3138, { rough: 0.5, metal: 0.5 });
    const hoistCable = hose(trolley, [[0, 0, 0], [0, -1.5, 0]], 0.01, 0x22272c, { steps: 10, rough: 0.6 });

    const spreader = group(trolley, 0, -1.6, 0);
    box(spreader, 1.05, 0.1, 0.42, 0, 0, 0, 0x8b929a, { rough: 0.45, metal: 0.5 });
    holoTag(spreader, "Spreader bar", 0, 0.16, 0, { css: "#3a7ca5", w: 0.3 });
    reg(hits, spreader, "spreader-bar");

    const corners = [];
    const cornerFaces = {};
    const cornerSpecs = [
      { x: -0.48, z: -0.18, id: "corner-good-1" },
      { x: 0.48, z: -0.18, id: "corner-unlatched" },
      { x: -0.48, z: 0.18, id: "indicator-false" },
      { x: 0.48, z: 0.18, id: "corner-good-2" },
    ];
    for (const c of cornerSpecs) {
      const lockGroup = group(spreader, c.x, -0.08, c.z);
      cyl(lockGroup, 0.025, 0.025, 0.1, 0, 0, 0, 0x2b3138, { rough: 0.5, metal: 0.5, seg: 10 });
      const handle = box(lockGroup, 0.09, 0.014, 0.014, 0, -0.06, 0, 0xf2c14b, { rough: 0.5 });
      const lamp = ball(lockGroup, 0.01, 0, -0.09, 0.03, 0x59c97b, { emissive: 0x59c97b, ei: 1.4 });
      corners.push({ lockGroup, handle, lamp, id: c.id });
      if (c.id === "corner-unlatched" || c.id === "indicator-false") reg(hits, lockGroup, c.id);
      if (c.id === "corner-unlatched") handle.rotation.y = 0.9;
      if (c.id === "indicator-false") lamp.material = mat(0x59c97b, { emissive: 0x59c97b, ei: 1.4 }); // shows green despite being unseated
    }

    const cab = group(crane, 0.35, 2.2, 0, -0.1);
    box(cab, 0.4, 0.35, 0.4, 0, 0, 0, 0xdfe4e8, { radius: 0.03, rough: 0.35, metal: 0.3 });
    const hoistLever = group(cab, -0.1, -0.1, 0.2);
    box(hoistLever, 0.02, 0.1, 0.02, 0, 0, 0, 0xd8232a, { rough: 0.5 });
    holoTag(hoistLever, "Hoist lever", 0, 0.14, 0, { css: "#3a7ca5", w: 0.28 });
    reg(hits, hoistLever, "hoist-lever");

    const overrideSwitch = group(cab, 0.12, -0.1, 0.2);
    box(overrideSwitch, 0.05, 0.03, 0.05, 0, 0, 0, 0xf2c14b, { rough: 0.5 });
    decal(overrideSwitch, 0.045, 0.018, 0, 0.02, 0.026, signFace("OVERRIDE", { bg: "#2a1a0d", accent: "#f2c14b", scale: 0.5 }), { px: 96 });
    holoTag(overrideSwitch, "Silence lock warning", 0, 0.1, 0, { css: "#f0645b", w: 0.34 });
    reg(hits, overrideSwitch, "hoist-override");

    const windOverride = group(crane, -0.22, 1.7, 0.22, 0.3);
    box(windOverride, 0.06, 0.04, 0.03, 0, 0, 0, 0xf2c14b, { rough: 0.5 });
    decal(windOverride, 0.05, 0.022, 0, 0, 0.016, signFace("WIND BYPASS", { bg: "#2a1a0d", accent: "#f2c14b", scale: 0.42 }), { px: 96 });
    holoTag(windOverride, "Wind lockout bypass", 0, 0.09, 0, { css: "#f0645b", w: 0.36 });
    reg(hits, windOverride, "wind-override");

    const anemo = group(crane, 0, 2.65, 0, 0.2);
    cyl(anemo, 0.01, 0.01, 0.3, 0, 0.15, 0, CITY.steel, { rough: 0.4, metal: 0.7, seg: 8 });
    const anemoInstrument = instrument(anemo, 0, 0.34, 0, { ry: 0, idle: "-- mph", color: 0x3a7ca5 });
    holoTag(anemo, "Anemometer", 0, 0.5, 0, { css: "#3a7ca5", w: 0.3 });
    reg(hits, anemoInstrument, "anemometer");

    // ------------------------------------------------------------------- red zone + gang
    const redZone = torus(g, 0.55, 0.02, 0.6, 0.01, -1.4, 0xf0645b, { emissive: 0xf0645b, ei: 1.3, rough: 0.4, cast: false, seg: 6, seg2: 32 });
    redZone.rotation.x = Math.PI / 2;
    reg(hits, box(g, 1.1, 0.02, 1.1, 0.6, 0.01, -1.4, 0x000000, { opacity: 0.001, transparent: true, cast: false, receive: false }),
      "under-load-zone");
    holoTag(g, "Red zone", 0.6, 0.06, -1.95, { css: "#f0645b", w: 0.26 });

    const marker = group(g, 1.1, 0, -1.9, -0.3);
    cyl(marker, 0.012, 0.012, 0.7, 0, 0.35, 0, 0xf2c14b, { rough: 0.5, seg: 8 });
    box(marker, 0.14, 0.1, 0.01, 0, 0.66, 0, 0x3a7ca5, { rough: 0.5 });
    holoTag(marker, "Red zone marker", 0, 0.78, 0, { css: "#3a7ca5", w: 0.32 });
    reg(hits, marker, "red-zone-marker");

    const signal = standingFigure(g, 1.7, 0.5, { ry: -2.2, cloth: 0x2b3138, vest: 0xfcee21, helmet: 0x1b1e22 });
    holoTag(signal, "Signal person", 0, 1.95, 0.15, { css: "#3a7ca5", w: 0.3 });
    reg(hits, signal, "signal-person");

    // ------------------------------------------------------------------- landing chassis
    const chassis = group(g, -0.2, 0, 1.3);
    box(chassis, 1.2, 0.12, 0.5, 0, 0.06, 0, 0x53585e, { rough: 0.6, metal: 0.4 });
    for (const wx of [-0.5, 0.5]) for (const wz of [-0.2, 0.2]) {
      cyl(chassis, 0.09, 0.09, 0.08, wx, 0.04, wz, 0x1b1e22, { rough: 0.8, seg: 12 }).rotation.x = Math.PI / 2;
    }
    holoTag(chassis, "Chassis", 0, 0.2, 0.3, { css: "#3a7ca5", w: 0.24 });
    reg(hits, chassis, "lower-container");
    const releaseHandle = group(chassis, 0, 0.14, 0.22);
    box(releaseHandle, 0.06, 0.03, 0.02, 0, 0, 0, 0xf2c14b, { rough: 0.5 });
    reg(hits, releaseHandle, "release-twist-locks");
    reg(hits, trolley, "retract-spreader");

    // ------------------------------------------------------------------------- paperwork
    const chest = toolChest(g, 1.8, 1.3, { ry: -0.7, color: 0x3a7ca5 });
    const chart = holoPanel(g, 0.56, 0.4, 1.9, 1.5, 0.6, (ctx, w, h) => {
      ctx.fillStyle = "rgba(6,16,22,0.9)"; ctx.fillRect(0, 0, w, h);
      ctx.fillStyle = "#3a7ca5"; ctx.fillRect(0, 0, w, 5);
      ctx.fillStyle = "#9dc0d4";
      ctx.font = `600 ${Math.round(h * 0.09)}px 'Barlow Condensed', Arial, sans-serif`;
      ctx.textAlign = "left"; ctx.textBaseline = "middle";
      ctx.fillText("LOAD CHART — CRANE 6", w * 0.06, h * 0.14);
      ctx.fillStyle = "#eaf4fb";
      ctx.font = `600 ${Math.round(h * 0.14)}px 'Barlow Condensed', Arial, sans-serif`;
      ctx.fillText("40 FT BOX — 28.4 t", w * 0.06, h * 0.33);
      ctx.font = `${Math.round(h * 0.085)}px Arial, sans-serif`;
      ctx.fillStyle = "#9dc0d4";
      ["Rated at radius: 32 t", "Wind limit: 20 mph",
       "Lashings: top, mid, bottom", "Locks: all 4 corners verified",
       "Red zone: clear before lift"].forEach((line, i) => ctx.fillText(line, w * 0.06, h * (0.5 + i * 0.11)));
    }, { ry: -0.6, accent: 0x3a7ca5 });
    reg(hits, chart, "load-chart-board");

    const plan = holoPanel(g, 0.44, 0.3, -1.9, 1.5, 0.9, (ctx, w, h) => {
      ctx.fillStyle = "rgba(6,16,22,0.9)"; ctx.fillRect(0, 0, w, h);
      ctx.fillStyle = "#3a7ca5"; ctx.fillRect(0, 0, w, 5);
      ctx.fillStyle = "#eaf4fb";
      ctx.font = `600 ${Math.round(h * 0.18)}px 'Barlow Condensed', Arial, sans-serif`;
      ctx.textAlign = "center"; ctx.textBaseline = "middle";
      ctx.fillText("PRE-LIFT PLAN", w / 2, h * 0.32);
      ctx.font = `${Math.round(h * 0.11)}px Arial, sans-serif`;
      ctx.fillStyle = "#9dc0d4";
      ctx.fillText("Vessel 4 — bay 14, stack 14", w / 2, h * 0.62);
      ctx.fillText("Gang: 3 lashers + signal", w / 2, h * 0.8);
    }, { ry: 0.6, accent: 0x3a7ca5 });
    reg(hits, plan, "lift-plan");

    let hoisting = false;

    return {
      hits,
      footprint: 2.1,

      onStepComplete(step) {
        if (step.id === "lashing-release") rods.forEach((r) => { r.visible = false; });
        if (step.id === "twist-lock-check") {
          corners.forEach((c) => { c.handle.rotation.y = 0; c.lamp.material = mat(0x59c97b, { emissive: 0x59c97b, ei: 1.6 }); });
        }
        if (step.id === "hoist") { hoisting = true; }
        if (step.id === "land-release") { hoisting = false; spreader.position.y = -1.6; }
      },

      animate(t, dt, session) {
        if (hoisting) {
          const lift = Math.min(0.6, (t % 3) * 0.3);
          spreader.position.y = -1.6 + lift;
          hoistCable.scale.y = 1 - lift / 1.5;
        }
        signal.userData.head.rotation.y = Math.sin(t * 0.5) * 0.3;

        const gg = session?.gauge;
        if (gg && !gg.committed && session.step?.id === "wind-check") {
          const v = Math.round(gg.t * 48);
          repaint(anemoInstrument.userData.screen, signFace(`${v} mph`, {
            bg: "#0d1c24", accent: gg.t < 0.42 ? "#59c97b" : "#f0645b", fg: "#bfeaf7", scale: 0.55,
          }));
        }
      },
    };
  },
};


/* ===== smartcity/js/scenarios.js ===== */
// User-created scenarios: let a learner or instructor build their own drill
// out of a real simulator's real steps, and run it through the exact same
// procedure engine that scores every built-in SmartCiti.X station.
//
// A custom scenario never invents new 3D content or new hazards — it curates
// and reorders the *existing* steps of one base simulator (the station it was
// built from is what gets constructed and walked). That keeps every custom
// drill grounded in an authored, reviewed procedure instead of arbitrary
// user-typed text standing in for real training content, and it means the
// engine, the hazards, the gamified rank system and the 3D station all keep
// working exactly as they already do — nothing new to verify there.

const SCENARIO_STORE_KEY = "smartcity-custom-scenarios-v1";
const MAX_SCENARIOS = 30;

/**
 * Local-only library of custom scenario descriptors. A descriptor is plain
 * data (never functions), so it survives localStorage round-tripping:
 * { id, baseId, name, tagline, stepIds, parSeconds, createdAt }
 */
const CustomScenarios = {
  list() {
    try {
      const raw = JSON.parse(localStorage.getItem(SCENARIO_STORE_KEY) || "[]");
      return Array.isArray(raw) ? raw : [];
    } catch (_) { return []; }
  },

  get(id) { return this.list().find((e) => e.id === id) ?? null; },

  save(entry) {
    const all = this.list();
    const i = all.findIndex((e) => e.id === entry.id);
    if (i >= 0) all[i] = entry;
    else all.push(entry);
    // Oldest-first eviction rather than a hard refusal once the shelf is full —
    // a local library should keep working, not block a save with an error.
    while (all.length > MAX_SCENARIOS) all.shift();
    try { localStorage.setItem(SCENARIO_STORE_KEY, JSON.stringify(all)); } catch (_) { /* ignore */ }
    return entry;
  },

  remove(id) {
    const all = this.list().filter((e) => e.id !== id);
    try { localStorage.setItem(SCENARIO_STORE_KEY, JSON.stringify(all)); } catch (_) { /* ignore */ }
  },
};

/** A short, collision-safe id with no dependency on crypto.randomUUID. */
function newScenarioId() {
  return `${Date.now().toString(36)}-${Math.random().toString(36).slice(2, 8)}`;
}

/**
 * Build a full room-shaped object from a base simulator plus a scenario
 * descriptor. The result is a real drop-in room: same build() (so the same
 * 3D station, the same interactables, the same hazards), same gamified
 * system (so it ranks and pays out in that trade's own currency), but with
 * `steps` narrowed and reordered to whatever the author kept. `Session`,
 * `Progress`, the hub and the leaderboard never need to know a room is
 * custom — they only ever see the shape they already understand.
 */
function buildCustomRoom(baseSim, entry) {
  const byId = new Map(baseSim.steps.map((s) => [s.id, s]));
  const steps = entry.stepIds.map((id) => byId.get(id)).filter(Boolean);
  const fraction = baseSim.steps.length ? steps.length / baseSim.steps.length : 1;
  return {
    ...baseSim,
    id: `custom:${entry.id}`,
    index: "★",
    domain: "Custom",
    name: entry.name,
    title: `${entry.name} — Custom Drill`,
    tagline: entry.tagline?.trim() || `A custom drill built from ${baseSim.name}: ${steps.length} of ${baseSim.steps.length} steps.`,
    parSeconds: entry.parSeconds ?? Math.max(45, Math.round(baseSim.parSeconds * fraction)),
    steps,
    isCustom: true,
    baseId: baseSim.id,
    baseName: baseSim.name,
    build: (root) => baseSim.build(root),
  };
}

/**
 * Resolve every saved descriptor against the live base-sim catalogue into
 * playable room objects, silently dropping any whose base simulator no
 * longer exists (e.g. content was renamed) rather than crashing the hub.
 */
function customRooms(simById) {
  const rooms = [];
  for (const entry of CustomScenarios.list()) {
    const base = simById[entry.baseId];
    if (base) rooms.push(buildCustomRoom(base, entry));
  }
  return rooms;
}


/* ===== smartcity/js/hub.js ===== */
// The district selector. Twenty simulators, each its own gamified system, laid
// out as kiosks around a plaza. Selecting one starts that simulator's own
// AR/VR/flat session; the kiosk shows that system's own rank and currency,
// never a shared platform score, because there isn't one.

function buildHub(root, sims) {
  const hits = {};
  const reg = (obj, id) => { markInteractive(obj, id); hits[id] = obj; return obj; };
  // Scale the ring so kiosk spacing stays roughly constant as the roster grows —
  // 6.4 was tuned for 10 kiosks; keep that floor so a smaller roster never crowds.
  const R = Math.max(6.4, sims.length * 0.4);

  const floor = cyl(root, R + 1.8, R + 1.8, 0.2, 0, -0.1, 0, 0x0d1319, { rough: 0.4, metal: 0.2, seg: 64 });
  floor.receiveShadow = true;
  torus(root, R - 1.0, 0.03, 0, 0.012, 0, CITY.accent,
    { emissive: CITY.accent, ei: 1.4, rough: 0.4, cast: false, seg: 6, seg2: 64 });

  const pillar = group(root, 0, 0, 0);
  cyl(pillar, 0.4, 0.5, 0.9, 0, 0.5, 0, 0x1b232b, { rough: 0.45, metal: 0.4, seg: 24 });
  const beacon = ball(pillar, 0.1, 0, 1.35, 0, CITY.accent, { emissive: CITY.accent, ei: 2.6, rough: 0.3 });
  // Slow-spinning holo halo around the beacon — flagship-plaza flourish, cheap to animate
  // (one rotation.z tweak per frame, no new geometry or materials).
  const halo = torus(pillar, 0.62, 0.012, 0, 1.35, 0, CITY.violet,
    { emissive: CITY.violet, ei: 1.4, rough: 0.4, cast: false, seg: 6, seg2: 40 });
  const titleFace = decal(pillar, 1.3, 0.5, 0, 1.95, 0, () => {}, { px: 640, glow: true, ei: 0.7 });
  function paintTitle() {
    repaint(titleFace, (g, w, h) => {
      g.fillStyle = "rgba(6,14,20,0.0)"; g.clearRect(0, 0, w, h);
      g.fillStyle = "#8fd8ff";
      g.font = `600 ${Math.round(h * 0.12)}px 'Barlow Condensed', Arial, sans-serif`;
      g.textAlign = "center"; g.textBaseline = "middle";
      g.fillText("POWERED BY AGI CORP & VISKO", w / 2, h * 0.15);
      g.fillStyle = "#4fd1ff";
      g.font = `700 ${Math.round(h * 0.3)}px 'Barlow Condensed', Arial, sans-serif`;
      g.fillText("SMARTCITI.X ~VR SIMULATORS", w / 2, h * 0.52);
      g.fillStyle = "#eaf6fb";
      g.font = `500 ${Math.round(h * 0.14)}px 'Barlow', Arial, sans-serif`;
      g.fillText("AR TRAINING SIMULATORS", w / 2, h * 0.82);
    });
  }
  paintTitle();

  const doorFaces = {};
  sims.forEach((sim, i) => {
    const a = (i / sims.length) * Math.PI * 2 - Math.PI / 2;
    const dx = Math.sin(a) * R, dz = Math.cos(a) * R;
    const kiosk = group(root, dx, 0, dz, a + Math.PI);

    box(kiosk, 1.0, 2.0, 0.18, 0, 1.0, 0, 0x1b232b, { rough: 0.5, metal: 0.45 });
    box(kiosk, 1.06, 0.06, 0.24, 0, 2.02, 0, sim.accent, { emissive: sim.accent, ei: 1.6, rough: 0.4, cast: false });
    box(kiosk, 1.06, 0.03, 0.2, 0, 0.03, 0.02, sim.accent, { emissive: sim.accent, ei: 1.0, rough: 0.4, cast: false });

    const indexBadge = decal(kiosk, 0.3, 0.3, -0.3, 1.7, 0.1, () => {}, { px: 256, glow: true, ei: 0.7 });
    const sign = decal(kiosk, 0.94, 0.7, 0.02, 1.15, 0.1, () => {}, { px: 512, glow: true, ei: 0.6 });
    const record = decal(kiosk, 0.94, 0.44, 0, 0.4, 0.1, () => {}, { px: 512, glow: true, ei: 0.5 });
    doorFaces[sim.id] = { indexBadge, sign, record, sim };

    const spot = cyl(kiosk, 0.7, 0.7, 0.008, 0, 0.012, 0.6, sim.accent,
      { rough: 0.6, emissive: sim.accent, ei: 0.7, cast: false, seg: 24 });
    reg(box(kiosk, 1.1, 2.0, 0.5, 0, 1.0, 0.2, 0x000000, { opacity: 0.001, transparent: true, cast: false }),
      `enter-${sim.id}`);

    lamp.position.set(dx * 0.85, 2.1, dz * 0.85);

  function paintKiosks() {
    for (const id of Object.keys(doorFaces)) {
      const { indexBadge, sign, record, sim } = doorFaces[id];
      const accentCss = sim.accentCss;
      repaint(indexBadge, (g, w, h) => {
        g.fillStyle = "rgba(10,16,22,0.85)"; g.fillRect(0, 0, w, h);
        g.fillStyle = accentCss;
        g.font = `700 ${Math.round(h * 0.55)}px 'Barlow Condensed', Arial, sans-serif`;
        g.textAlign = "center"; g.textBaseline = "middle";
        g.fillText(sim.index, w / 2, h * 0.5);
      });
      repaint(sign, (g, w, h) => {
        g.fillStyle = "rgba(10,16,22,0.92)"; g.fillRect(0, 0, w, h);
        g.fillStyle = accentCss; g.fillRect(0, h - 6, w, 6);
        g.fillStyle = "#8fb3c4";
        g.font = `600 ${Math.round(h * 0.1)}px 'Barlow Condensed', Arial, sans-serif`;
        g.textAlign = "center"; g.textBaseline = "middle";
        g.fillText(sim.domain.toUpperCase(), w / 2, h * 0.14);
        g.fillStyle = "#eaf6fb";
        g.font = `600 ${Math.round(h * 0.24)}px 'Barlow Condensed', Arial, sans-serif`;
        g.fillText(sim.name.toUpperCase(), w / 2, h * 0.4);
        g.fillStyle = accentCss;
        g.font = `${Math.round(h * 0.1)}px Arial, sans-serif`;
        g.fillText(sim.trade, w / 2, h * 0.64);
        g.fillStyle = "#6d8296";
        g.font = `500 ${Math.round(h * 0.08)}px 'Barlow Condensed', Arial, sans-serif`;
        g.fillText(`SMARTCITI.X~ ${sim.name.toUpperCase()} VR`, w / 2, h * 0.84);
      });
      const rank = Progress.simRank(sim.id, sim.game);
      const state = Progress.roomState(sim.id);
      repaint(record, (g, w, h) => {
        g.fillStyle = "rgba(10,16,22,0.9)"; g.fillRect(0, 0, w, h);
        g.fillStyle = accentCss; g.fillRect(0, 0, 5, h);
        g.textAlign = "left"; g.textBaseline = "middle";
        g.fillStyle = "#8fb3c4";
        g.font = `600 ${Math.round(h * 0.11)}px 'Barlow Condensed', Arial, sans-serif`;
        g.fillText(sim.game?.system?.toUpperCase() ?? "PROGRESS", w * 0.07, h * 0.16);
        g.fillStyle = "#eaf6fb";
        g.font = `600 ${Math.round(h * 0.2)}px 'Barlow Condensed', Arial, sans-serif`;
        g.fillText(rank.name.toUpperCase(), w * 0.07, h * 0.42);
        g.fillStyle = accentCss;
        g.font = `600 ${Math.round(h * 0.13)}px 'Barlow Condensed', Arial, sans-serif`;
        g.textAlign = "right";
        g.fillText(`${rank.xp} ${sim.game?.currency ?? "XP"}`, w * 0.93, h * 0.42);
        g.textAlign = "left";
        g.fillStyle = "#1d2833"; g.fillRect(w * 0.07, h * 0.58, w * 0.86, h * 0.08);
        g.fillStyle = accentCss;
        g.fillRect(w * 0.07, h * 0.58, w * 0.86 * (rank.max ? 1 : Math.max(0.02, rank.into / Math.max(1, rank.span))), h * 0.08);
        g.fillStyle = "#8fb3c4";
        g.font = `${Math.round(h * 0.095)}px Arial, sans-serif`;
        const stars = "★".repeat(state.stars) + "☆".repeat(3 - state.stars);
        g.fillText(state.runs ? `${stars}  best ${state.best}` : "not attempted", w * 0.07, h * 0.78);
        const badgeCount = state.badges?.length ?? 0;
        g.fillText(badgeCount ? `${badgeCount} badge${badgeCount === 1 ? "" : "s"} earned` : "no badges yet", w * 0.07, h * 0.92);
      });
    }
  }
  paintKiosks();

  const key = new THREE.DirectionalLight(0xdbe6f2, 0.7);
  key.position.set(3, 8, 4);
  root.add(key);
  root.add(new THREE.HemisphereLight(0x8ea9c2, 0x1e242b, 1.3));

  return {
    hits,
    isHub: true,
    spawnLook: new THREE.Vector3(0, 1.5, 0),
    refresh() { paintKiosks(); },
    animate(t) {
      beacon.material.emissiveIntensity = 2.0 + Math.sin(t * 1.5) * 0.7;
      beacon.position.y = 1.35 + Math.sin(t * 0.8) * 0.04;
      halo.rotation.z = t * 0.4;
      halo.position.y = beacon.position.y;
    },
  };
}


/* ===== smartcity/js/store.js ===== */
/**
 * A minimal reactive store — just enough pub-sub to let app.js (the Three.js
 * engine) hand its UI state to react-ui.js (the 2D chrome) without either
 * side reaching into the other's DOM. Every write replaces the whole state
 * object (or a named slice of it) so React's useSyncExternalStore can tell
 * "changed" from "same" with a plain reference check.
 */
function createStore(initial) {
  let state = initial;
  const subs = new Set();

  function get() {
    return state;
  }

  function set(patch) {
    state = typeof patch === "function" ? patch(state) : { ...state, ...patch };
    for (const fn of subs) fn(state);
  }

  /** Shallow-merge `partial` (or the object a function of the previous slice
   * returns) into the named top-level slice, e.g. "hud". */
  function patch(key, partial) {
    const prev = state[key];
    const delta = typeof partial === "function" ? partial(prev) : partial;
    set({ [key]: { ...prev, ...delta } });
  }

  function subscribe(fn) {
    subs.add(fn);
    return () => subs.delete(fn);
  }

  return { get, set, patch, subscribe };
}

        h("div", { className: "btnrow", id: "ed-close-row" }, h("button", { id: "ed-close", onClick: actions.closeEditor }, "Close"))));

  function App() {

      h(HudMission), h(HudMetrics), h(HudObjective), h(HudRail), h(HudHint),
      h(GestureTip), h(ArPrompt), h(ScaleRow),

  }

  ReactDOM.createRoot(document.getElementById("react-root")).render(h(App));
}

  SIM_ELEVATOR_PIT, SIM_ABATEMENT_CHAMBER, SIM_RIGGING_LOFT, SIM_LINE_TRUCK, SIM_DOCK_CRANE,
];

// The 20 built-in stations plus whatever the learner has built in the
// scenario editor — the hub, the leaderboard and every sim lookup work off
// this combined roster so a custom drill is a first-class citizen everywhere
// a built-in one is, with zero special-casing downstream.
function allSims() { return [...SIMS, ...customRooms(SIM_BY_ID)]; }
function findSim(id) {
  if (SIM_BY_ID[id]) return SIM_BY_ID[id];
  if (typeof id === "string" && id.startsWith("custom:")) {
    const entry = CustomScenarios.get(id.slice(7));
    const base = entry && SIM_BY_ID[entry.baseId];
    if (base) return buildCustomRoom(base, entry);
  }
  return null;
}

function setRail(kind, html) {
  store.patch("hud", { railState: kind, feedbackHtml: html });

}

function syncHud() {
  const s = state.session;
  if (!s) {
    store.patch("hud", {
      room: "SMARTCITI.X",
      step: "Choose a district",
      cue: "Select a simulator to begin its own procedure and its own rank system.",
      score: "----", comboText: "", comboHot: false, comboFire: false,
      count: `${Progress.completedRooms}/${allSims().length} CLEARED`,
      fillPct: (Progress.completedRooms / allSims().length) * 100,
      timer: "",
      gestureVisible: false,
    });
    vrHudDirty = true;
    return;
  }
  const rank = Progress.simRank(s.room.id, s.room.game);
  const secs = Math.floor(s.elapsed);
  const patch = {
    room: state.tour ? `TOUR ${state.tour.i + 1}/${SIMS.length} · ${s.room.title.toUpperCase()}` : s.room.title.toUpperCase(),
    score: String(Math.round(s.score)).padStart(4, "0"),
    comboText: s.comboLabel ? `${s.comboLabel.toUpperCase()} ×${s.combo.toFixed(1)}` : rank.name,
    comboHot: s.streak >= 4,
    comboFire: s.combo >= 1.8,
    count: `STEP ${Math.min(s.index + 1, s.steps.length)}/${s.steps.length}`,
    fillPct: s.progress01 * 100,
    timer: `${String(Math.floor(secs / 60)).padStart(2, "0")}:${String(secs % 60).padStart(2, "0")} / ${
      String(Math.floor(s.room.parSeconds / 60)).padStart(2, "0")}:${String(s.room.parSeconds % 60).padStart(2, "0")}`,
  };
  const step = s.step;
  if (step) {
    let cue = step.cue;
    if (step.kind === "sequence" || step.kind === "find") cue += `  (${s.sequence.length}/${step.targets.length})`;
    if (step.kind === "hold" || step.kind === "track") cue += `  (${s.holdFor.toFixed(1)}s / ${step.seconds}s)`;
    if (step.kind === "turn" && s.turn) cue += `  (${Math.round((s.turn.amount / s.turn.required) * 100)}%)`;
    const hint = GESTURE_HINTS[step.kind];
    patch.step = step.title;
    patch.cue = cue;
    patch.gestureVerb = hint?.verb ?? "";
    patch.gestureVisible = !!hint;
  }
  store.patch("hud", patch);
  vrHudDirty = true;
}
