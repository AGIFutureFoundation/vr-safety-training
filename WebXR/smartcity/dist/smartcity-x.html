<html lang="en">
<head>

<title>SmartCiti.X ~VR Simulators (Powered by AGI Corp &amp; Visko)</title>

<style>
  :root{
    --void:#050a10; --panel:#0c1620; --glass:rgba(9,18,26,.88); --raised:#131f2b;
    --text:#eaf6fb; --muted:#8fb3c4; --accent:#4fd1ff; --warn:#f2c14b;
    --danger:#f0645b; --edge:#28414f; --good:#59c97b;
    --sans:"Barlow", system-ui, sans-serif; --cond:"Barlow Condensed", "Barlow", system-ui, sans-serif;
  }
  *{box-sizing:border-box}
  [hidden]{display:none !important}
  html,body{height:100%;margin:0;overscroll-behavior:none}
  body{ background:var(--void); color:var(--text); font-family:var(--sans); overflow:hidden; -webkit-font-smoothing:antialiased; }
  #stage{position:fixed;inset:0}
  #stage canvas{display:block;touch-action:none}

  .chip{ position:fixed; background:var(--glass); border:1px solid var(--edge); border-radius:5px;
         padding:9px 14px; pointer-events:none; backdrop-filter:blur(4px); }
  .eyebrow{ font-family:var(--cond); font-weight:600; font-size:11px; letter-spacing:.16em;
            text-transform:uppercase; color:var(--muted); }
  .brandline{ font-family:var(--cond); font-weight:600; font-size:10.5px; letter-spacing:.2em;
              text-transform:uppercase; color:var(--accent); opacity:.85; margin:0 0 4px; }
  #hud-mission{ top:14px; left:14px; max-width:min(52vw,440px); border-left:3px solid var(--accent); }
  #hud-room{ font-family:var(--cond); font-weight:600; font-size:20px; letter-spacing:.04em; text-transform:uppercase; }
  #hud-metrics{ top:14px; right:14px; text-align:right; min-width:150px; }
  #hud-score{ font-family:var(--cond); font-weight:600; font-size:26px; letter-spacing:.05em; font-variant-numeric:tabular-nums; }
  #hud-combo{ font-family:var(--cond); font-weight:600; font-size:13px; letter-spacing:.08em; color:var(--accent);
    transition:color .15s, transform .15s; }
  #hud-combo.hot{ color:var(--warn); }
  #hud-combo.fire{ color:var(--danger); animation:pulse .5s ease-in-out infinite; }
  @keyframes pulse{ 0%,100%{ transform:scale(1); } 50%{ transform:scale(1.08); } }
  .score-pop{ position:absolute; right:4px; top:34px; font-family:var(--cond); font-weight:700;
    font-size:15px; color:var(--good); pointer-events:none; animation:popUp .9s ease-out forwards; }
  .score-pop.big{ font-size:20px; color:var(--warn); }
  @keyframes popUp{ 0%{ opacity:0; transform:translateY(0); } 15%{ opacity:1; }
    100%{ opacity:0; transform:translateY(-30px); } }
  .rank-up{ font-family:var(--cond); font-weight:700; font-size:15px; letter-spacing:.12em;
    text-transform:uppercase; color:var(--warn); text-align:center;
    background:rgba(242,193,75,.12); border:1px solid var(--warn); border-radius:5px;
    padding:8px; margin:0 0 10px; animation:rankGlow 1.1s ease-in-out infinite; }
  @keyframes rankGlow{ 0%,100%{ box-shadow:0 0 0 rgba(242,193,75,0); } 50%{ box-shadow:0 0 18px rgba(242,193,75,.5); } }
  @media (prefers-reduced-motion:reduce){
    #hud-combo.fire{ animation:none; } .rank-up{ animation:none; }
  }

  #hud-objective{ position:fixed; left:50%; transform:translateX(-50%); top:14px;
    background:var(--glass); border:1px solid var(--edge); border-top:3px solid var(--accent);
    border-radius:5px; padding:9px 18px; text-align:center; pointer-events:none;
    max-width:min(58vw,560px); backdrop-filter:blur(4px); }
  #hud-step{ font-family:var(--cond); font-weight:600; font-size:18px; letter-spacing:.03em; }
  #hud-cue{ font-size:13px; color:var(--muted); line-height:1.4; margin-top:2px; }
  #hud-gesture{ display:inline-block; margin-top:6px; font-family:var(--cond); font-weight:600;
    font-size:10.5px; letter-spacing:.1em; color:var(--accent); border:1px solid var(--accent);
    border-radius:3px; padding:2px 8px; text-transform:uppercase; }
  #gesture-tip{ position:fixed; left:50%; bottom:98px; transform:translateX(-50%) translateY(6px);
    max-width:min(520px, calc(100vw - 28px)); background:var(--glass); border:1px solid var(--accent);
    border-radius:6px; padding:10px 16px; text-align:center; font-size:13px; color:var(--text);
    line-height:1.4; pointer-events:none; opacity:0; transition:opacity .25s ease, transform .25s ease;
    z-index:12; backdrop-filter:blur(4px); }
  #gesture-tip.show{ opacity:1; transform:translateX(-50%) translateY(0); }
  #gesture-tip b{ color:var(--accent); }
  @media (prefers-reduced-motion:reduce){ #gesture-tip{ transition:opacity .25s ease } }

  #hud-rail{ position:fixed; left:50%; transform:translateX(-50%); bottom:14px;
    width:min(780px, calc(100vw - 28px)); background:var(--glass);
    border:1px solid var(--edge); border-left:3px solid var(--edge);
    border-radius:5px; padding:11px 16px; pointer-events:none; backdrop-filter:blur(4px); }
  #hud-rail[data-state="ok"]{ border-left-color:var(--good) }
  #hud-rail[data-state="warn"]{ border-left-color:var(--warn) }
  #hud-rail[data-state="danger"]{ border-left-color:var(--danger) }
  #hud-rail[data-state="neutral"]{ border-left-color:var(--accent) }
  #hud-feedback{ font-size:14px; line-height:1.5 }
  #hud-feedback b{ font-weight:600 }
  #hud-feedback .mult{ color:var(--accent); font-family:var(--cond) }
  #hud-progress{ display:flex; align-items:center; gap:14px; margin-top:9px }
  #hud-track{ flex:1; height:5px; background:var(--raised); border-radius:3px; overflow:hidden }
  #hud-fill{ height:100%; width:0; background:var(--accent); transition:width .2s ease-out }
  #hud-count,#hud-timer{ font-family:var(--cond); font-weight:600; font-size:11.5px; letter-spacing:.09em;
    color:var(--muted); white-space:nowrap; font-variant-numeric:tabular-nums; }
  #hud-hint{ position:fixed; left:14px; bottom:14px; font-family:var(--cond); font-size:11.5px;
    letter-spacing:.09em; color:var(--muted); pointer-events:none; text-transform:uppercase; }

  #ar-prompt{ position:fixed; left:50%; top:50%; transform:translate(-50%,-50%);
    background:var(--glass); border:1px solid var(--accent); border-radius:6px;
    padding:14px 20px; text-align:center; pointer-events:none; }
  #ar-prompt b{ font-family:var(--cond); font-size:16px; letter-spacing:.03em; text-transform:uppercase; }
  #scale-row{ position:fixed; bottom:70px; left:50%; transform:translateX(-50%);
    display:flex; gap:8px; }
  #scale-row button{ pointer-events:auto; padding:12px 18px; font-size:16px; min-width:56px; }

  .overlay{ position:fixed; inset:0; z-index:20; display:flex; align-items:center; justify-content:center;
    background:rgba(3,7,11,.85); padding:16px; overflow-y:auto; }
  .card{ width:min(680px,100%); max-height:calc(100vh - 32px); max-height:calc(100dvh - 32px); overflow-y:auto;
    background:var(--panel); border:1px solid var(--edge); border-top:3px solid var(--accent);
    border-radius:8px; padding:24px 28px; }
  .card h1{ font-family:var(--cond); font-weight:600; font-size:clamp(26px,5vw,36px);
    letter-spacing:.03em; text-transform:uppercase; margin:3px 0 5px; }
  .card p{ color:var(--muted); font-size:13.5px; line-height:1.55; margin:0 0 10px; max-width:64ch }
  .card p.lead{ color:var(--text) }
  .sims{ display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:6px; margin:14px 0 16px }
  .sim{ background:var(--raised); border-radius:4px; padding:8px 10px; border-left:3px solid var(--tint) }
  .sim b{ display:block; font-family:var(--cond); font-weight:600; font-size:14px; letter-spacing:.02em; text-transform:uppercase }
  .sim span{ font-size:11.5px; color:var(--muted); line-height:1.3; display:block; margin-top:1px }
  .btnrow{ display:flex; gap:8px; flex-wrap:wrap; margin:10px 0 12px }
  button{ font-family:var(--cond); font-weight:600; font-size:15px; letter-spacing:.08em;
    text-transform:uppercase; cursor:pointer; border-radius:4px; padding:11px 20px; min-height:44px;
    border:1px solid var(--edge); background:var(--raised); color:var(--text); touch-action:manipulation; }
  button.primary{ background:var(--accent); border-color:var(--accent); color:#04212b }
  button:hover{ filter:brightness(1.12) }
  button:focus-visible{ outline:2px solid var(--accent); outline-offset:2px }
  button[disabled]{ opacity:.4; cursor:not-allowed; filter:none }
  kbd{ background:var(--raised); border:1px solid var(--edge); border-radius:3px;
    padding:1px 6px; font-family:var(--cond); font-size:12px; }
  .fineprint{ font-size:12px; color:var(--muted); line-height:1.55; margin:0 }
  .namerow{ margin:14px 0 4px }
  .namerow label{ display:block; margin-bottom:5px }
  .namerow input{ width:180px; background:var(--raised); border:1px solid var(--edge); border-radius:4px;
    color:var(--text); font-family:var(--cond); font-weight:600; font-size:16px; letter-spacing:.08em;
    padding:9px 12px; text-transform:uppercase; }
  .namerow input:focus{ outline:2px solid var(--accent); outline-offset:1px }

  .lb-table{ width:100%; border-collapse:collapse; margin:4px 0 14px; font-size:13.5px }
  .lb-table th{ text-align:left; font-family:var(--cond); font-weight:600; letter-spacing:.08em;
    font-size:11px; color:var(--muted); text-transform:uppercase; padding:4px 8px; border-bottom:1px solid var(--edge) }
  .lb-table td{ padding:6px 8px; border-bottom:1px solid rgba(40,65,79,.4); font-variant-numeric:tabular-nums }
  .lb-table tr.me{ background:rgba(79,209,255,.12) }
  .lb-table tr.me td:first-child{ color:var(--accent); font-weight:700 }
  .lb-empty{ color:var(--muted); font-size:13px; padding:10px 0 }
  .lb-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:10px; max-height:60vh; overflow-y:auto }
  .lb-card{ background:var(--raised); border-left:3px solid var(--tint,var(--accent)); border-radius:4px; padding:10px 12px }
  .lb-card h3{ margin:0 0 6px; font-family:var(--cond); font-weight:600; font-size:14px; letter-spacing:.03em; text-transform:uppercase }
  .lb-card .lb-top{ font-size:12.5px; color:var(--muted) }
  .lb-card .lb-top b{ color:var(--text) }

  .ed-row{ margin:12px 0 }
  .ed-row label{ display:block; margin-bottom:5px }
  .ed-row select, .ed-row input{ width:100%; max-width:420px; background:var(--raised);
    border:1px solid var(--edge); border-radius:4px; color:var(--text); font-family:var(--sans);
    font-size:14px; padding:9px 12px; }
  .ed-row select:focus, .ed-row input:focus{ outline:2px solid var(--accent); outline-offset:1px }
  .ed-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:4px 16px }
  .ed-steps{ max-height:38vh; overflow-y:auto; border:1px solid var(--edge); border-radius:5px;
    background:var(--raised); margin:6px 0 4px }
  .ed-step{ display:flex; align-items:center; gap:10px; padding:8px 10px; border-bottom:1px solid rgba(40,65,79,.5) }
  .ed-step:last-child{ border-bottom:none }
  .ed-step.off{ opacity:.42 }
  .ed-step .kind{ font-family:var(--cond); font-weight:600; font-size:10px; letter-spacing:.08em;
    text-transform:uppercase; color:var(--accent); border:1px solid var(--edge); border-radius:3px;
    padding:2px 6px; white-space:nowrap; }
  .ed-step .title{ flex:1; font-size:13.5px; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .ed-step .mv{ font-family:var(--cond); font-weight:600; padding:3px 8px; font-size:13px; }
  .ed-error{ color:var(--danger); font-size:13px; margin:6px 0 0 }
  .ed-library{ display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:10px;
    margin:6px 0 4px; max-height:32vh; overflow-y:auto }
  .ed-lib-card{ background:var(--raised); border-left:3px solid var(--accent); border-radius:4px; padding:10px 12px }
  .ed-lib-card h3{ margin:0 0 4px; font-family:var(--cond); font-weight:600; font-size:14px; letter-spacing:.02em; text-transform:uppercase }
  .ed-lib-card p{ margin:0 0 8px; font-size:12px; color:var(--muted) }
  .ed-lib-card .btnrow{ margin:0; gap:6px }
  .ed-lib-card button{ padding:6px 10px; font-size:12px }
  .ed-empty{ color:var(--muted); font-size:13px; padding:8px 2px }

  .res-stars{ font-size:36px; letter-spacing:.1em; color:var(--warn); line-height:1 }
  #results h2{ font-family:var(--cond); font-weight:600; font-size:26px; letter-spacing:.02em;
    text-transform:uppercase; margin:10px 0 2px }
  .res-trade{ color:var(--accent) !important; font-family:var(--cond); letter-spacing:.08em;
    text-transform:uppercase; font-size:12.5px; margin:0 0 14px !important }
  .res-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(110px,1fr)); gap:8px; margin:0 0 14px }
  .res-grid>div{ background:var(--raised); border-radius:4px; padding:8px 10px }
  .res-grid dt{ font-family:var(--cond); font-size:10.5px; letter-spacing:.12em; text-transform:uppercase; color:var(--muted) }
  .res-grid dd{ margin:2px 0 0; font-family:var(--cond); font-weight:600; font-size:20px; font-variant-numeric:tabular-nums }
  .res-badges{ display:flex; flex-direction:column; gap:6px; margin-bottom:12px }
  .res-badge{ background:rgba(242,193,75,.1); border-left:3px solid var(--warn); border-radius:4px;
    padding:9px 11px; color:var(--text) !important; font-size:13.5px !important; margin:0 !important }
  .res-badge span{ display:block; color:var(--muted); font-size:12px; margin-top:2px }
  .res-note{ font-size:13px !important }

  body.danger-flash::after{ content:""; position:fixed; inset:0; pointer-events:none; z-index:15;
    background:radial-gradient(circle at 50% 55%, rgba(240,100,91,.34), rgba(240,100,91,0) 62%);
    animation:flash .42s ease-out; }
  @keyframes flash{ from{opacity:1} to{opacity:0} }
  @media (prefers-reduced-motion:reduce){ body.danger-flash::after{ animation:none; opacity:.28 } #hud-fill{ transition:none } }
  @media (max-width:640px){
    #hud-objective{ top:auto; bottom:120px; max-width:calc(100vw - 28px) }
    #hud-room{ font-size:15px } #hud-score{ font-size:20px } #hud-hint{ display:none }
    .sims{ grid-template-columns:1fr 1fr }
    .btnrow button{ flex:1 1 calc(50% - 4px) }
    .card{ padding:20px 18px }
  }
  @supports (padding: max(0px)){
    #hud-mission{ left:max(14px, env(safe-area-inset-left)) }
    #hud-metrics{ right:max(14px, env(safe-area-inset-right)) }
    #hud-hint{ left:max(14px, env(safe-area-inset-left)); bottom:max(14px, env(safe-area-inset-bottom)) }
    #hud-rail{ bottom:max(14px, env(safe-area-inset-bottom)) }
  }
</style>

<script type="module">
import * as THREE from "https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.module.min.js";

/* ===== shared/kit.js ===== */
// Shared procedural asset kit. Every prop in the simulator is built from these
// primitives at real-world scale in metres, so rooms stay consistent and no
// external model files are needed.

const TAU = Math.PI * 2;

// HUD tokens from DESIGN.md, reused so the web build reads like the headset build.
const HUD = {
  void: "#071018", panel: "#101C27", raised: "#172735", text: "#F4F8FB",
  muted: "#9FB0BF", accent: "#37D6C0", warn: "#F2B84B", danger: "#F0645B",
  edge: "#426174", good: "#59C97B",

/**
 * What a step kind physically asks the learner's hands to do, in one short
 * verb for the HUD and one sentence for a first-time explainer. A room's own
 * `cue` text always says *what* to touch; this says *how* to touch it — the
 * part a new interaction (like turning a valve by dragging it) can't be
 * assumed to be obvious just from staring at the 3D object.
 */
const GESTURE_HINTS = {
  select: { verb: "CLICK", tip: "Click the highlighted control to select it." },
  sequence: { verb: "CLICK IN ORDER", tip: "Click each highlighted item, in the order the procedure calls for." },
  find: { verb: "SEARCH & CLICK", tip: "Look around and click whatever you find wrong — some objects are decoys." },
  gauge: { verb: "WATCH & CLICK", tip: "Watch the marker sweep the band, then click to commit while it's centred." },
  hold: { verb: "PRESS & HOLD", tip: "Press and hold the highlighted control for the full duration — releasing early breaks it." },
  track: { verb: "HOLD TO CORRECT", tip: "Hold to raise the value, release to let it fall, and keep it inside the band." },
  turn: { verb: "CLICK & DRAG TO TURN", tip: "Click the control and drag in a circle around it, like turning a real wheel or handle." },
  drag: { verb: "CLICK & DRAG TO CARRY", tip: "Click and hold the object, drag it to the marker, then let go." },

const materialCache = new Map();
const disposables = new Set();

function mat(color, o = {}) {
  const key = [color, o.rough ?? 0.8, o.metal ?? 0, o.emissive ?? 0, o.ei ?? 1,
    o.opacity ?? 1, o.flat ? 1 : 0, o.side ?? 0].join("|");
  let m = materialCache.get(key);
  if (!m) {
    m = new THREE.MeshStandardMaterial({
      color,
      roughness: o.rough ?? 0.8,
      metalness: o.metal ?? 0,
      emissive: o.emissive ?? 0x000000,
      emissiveIntensity: o.ei ?? 1,
      transparent: (o.opacity ?? 1) < 1,
      opacity: o.opacity ?? 1,
      flatShading: !!o.flat,
      side: o.side === 2 ? THREE.DoubleSide : THREE.FrontSide,

  }
  return m;
}

function track(geometry) { disposables.add(geometry); return geometry; }

/** Dispose geometry created for a room. Materials stay cached and shared. */
function disposeTree(root) {
  root.traverse((o) => {
    if (o.isMesh || o.isLine || o.isPoints) {
      o.geometry?.dispose();
      disposables.delete(o.geometry);
      if (o.material?.map && o.material.userData.ownTexture) o.material.map.dispose();
      if (o.material?.userData.ownMaterial) o.material.dispose();

  parent?.add(g);

  return m;

function cyl(parent, rTop, rBot, h, x, y, z, color, o = {}) {
  const m = new THREE.Mesh(
    track(new THREE.CylinderGeometry(rTop, rBot, h, o.seg ?? 20, 1, !!o.open)), mat(color, o));
  m.position.set(x, y, z);
  m.castShadow = o.cast !== false;
  m.receiveShadow = o.receive !== false;
  parent.add(m);
  return m;
}

function ball(parent, r, x, y, z, color, o = {}) {
  const m = new THREE.Mesh(track(new THREE.SphereGeometry(r, o.seg ?? 18, o.seg2 ?? 14)), mat(color, o));
  m.position.set(x, y, z);
  m.castShadow = o.cast !== false;
  m.receiveShadow = o.receive !== false;
  parent.add(m);
  return m;

function torus(parent, r, tube, x, y, z, color, o = {}) {
  const m = new THREE.Mesh(track(new THREE.TorusGeometry(r, tube, o.seg ?? 10, o.seg2 ?? 24)), mat(color, o));
  m.position.set(x, y, z);
  m.castShadow = o.cast !== false;
  parent.add(m);
  return m;

/** Rounded slab — a box with chamfered vertical edges. Reads far better than a plain cube. */
function slab(parent, w, h, d, x, y, z, color, o = {}) {
  const r = Math.min(o.radius ?? 0.02, w / 2 - 0.001, d / 2 - 0.001);
  const shape = new THREE.Shape();
  const hw = w / 2 - r, hd = d / 2 - r;
  shape.moveTo(-hw - r, -hd);
  shape.lineTo(-hw - r, hd);
  shape.quadraticCurveTo(-hw - r, hd + r, -hw, hd + r);
  shape.lineTo(hw, hd + r);
  shape.quadraticCurveTo(hw + r, hd + r, hw + r, hd);
  shape.lineTo(hw + r, -hd);
  shape.quadraticCurveTo(hw + r, -hd - r, hw, -hd - r);

  shape.quadraticCurveTo(-hw - r, -hd - r, -hw - r, -hd);

  const m = new THREE.Mesh(geo, mat(color, o));
  m.position.set(x, y, z);
  m.castShadow = o.cast !== false;
  m.receiveShadow = o.receive !== false;

/** Lathe profile — bottles, jars, funnels. `profile` is [[radius, y], ...] bottom-up. */
function lathe(parent, profile, x, y, z, color, o = {}) {
  const pts = profile.map(([r, py]) => new THREE.Vector2(Math.max(r, 0.0005), py));
  const m = new THREE.Mesh(track(new THREE.LatheGeometry(pts, o.seg ?? 20)), mat(color, o));
  m.position.set(x, y, z);
  m.castShadow = o.cast !== false;
  m.receiveShadow = o.receive !== false;
  parent.add(m);
  return m;
}

/** Flexible run — cables, hoses, tubing. `points` are local Vector3-ish triples. */
function hose(parent, points, radius, color, o = {}) {
  const curve = new THREE.CatmullRomCurve3(points.map((p) => new THREE.Vector3(...p)));
  const m = new THREE.Mesh(
    track(new THREE.TubeGeometry(curve, o.steps ?? 32, radius, o.seg ?? 8, false)), mat(color, o));
  m.castShadow = o.cast !== false;
  parent.add(m);
  return m;
}

// ---------------------------------------------------------------- canvas art

/** Painted panel: signage, dials, labels, screens. Returns the mesh; texture is owned by it. */
function decal(parent, w, h, x, y, z, draw, o = {}) {
  const px = o.px ?? 512;
  const canvas = document.createElement("canvas");
  canvas.width = px;
  canvas.height = Math.max(8, Math.round(px * (h / w)));
  const g = canvas.getContext("2d");
  draw(g, canvas.width, canvas.height);
  const tex = new THREE.CanvasTexture(canvas);
  tex.anisotropy = 4;
  const material = new THREE.MeshStandardMaterial({
    map: tex, roughness: o.rough ?? 0.7, metalness: o.metal ?? 0,
    emissive: o.emissive ?? 0x000000, emissiveIntensity: o.ei ?? 1,
    emissiveMap: o.glow ? tex : null,
    transparent: !!o.transparent,
    side: THREE.DoubleSide,
  });
  material.userData.ownMaterial = true;
  material.userData.ownTexture = true;
  const m = new THREE.Mesh(track(new THREE.PlaneGeometry(w, h)), material);
  m.position.set(x, y, z);
  m.castShadow = false;
  m.receiveShadow = false;
  m.userData.canvas = canvas;
  m.userData.ctx = g;
  m.userData.texture = tex;
  parent.add(m);
  return m;
}

function repaint(mesh, draw) {
  const { ctx, canvas, texture } = mesh.userData;
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  draw(ctx, canvas.width, canvas.height);
  texture.needsUpdate = true;
}

// ---------------------------------------------------------------- surface texture helpers

/**
 * Flat gradient fill for a canvas 2D context. Falls back to a solid fill using the
 * gradient's last stop when the context has no real gradient support (e.g. the
 * headless mock used by the CI content checkers), so callers never need to special-case it.
 */
function gradientFill(g, w, h, stops, o = {}) {
  let grad = null;
  try {
    grad = o.radial
      ? g.createRadialGradient(w / 2, h / 2, 0, w / 2, h / 2, Math.max(w, h) / 2)
      : g.createLinearGradient(0, 0, o.horizontal ? w : 0, o.horizontal ? 0 : h);
  } catch { grad = null; }
  if (grad && typeof grad.addColorStop === "function") {
    for (const [stop, color] of stops) grad.addColorStop(stop, color);
    g.fillStyle = grad;
  } else {
    g.fillStyle = stops[stops.length - 1][1];
  }
  g.fillRect(0, 0, w, h);
}

/** Cheap grain: scattered translucent specks that break up a flat canvas fill. */
function noiseTexture(g, w, h, o = {}) {
  const count = Math.round((o.density ?? 900) * (w * h) / (512 * 512));
  const alpha = o.alpha ?? 0.05;
  const tone = o.tone ?? "0,0,0";
  for (let i = 0; i < count; i++) {
    g.fillStyle = `rgba(${tone},${(Math.random() * alpha).toFixed(3)})`;
    g.fillRect(Math.random() * w, Math.random() * h, 1, 1);
  }
}

/**
 * Weathering pass: soft grime blotches and drip streaks toward the lower half of a
 * panel. Silently draws nothing where the 2D context has no gradient support, rather
 * than throwing, so it is safe to call from code paths the headless checkers exercise.
 */
function grimeOverlay(g, w, h, o = {}) {
  const tone = o.tone ?? "18,14,9";
  const alpha = o.alpha ?? 0.22;
  for (let i = 0; i < (o.blotches ?? 4); i++) {
    const x = Math.random() * w, y = h * (0.5 + Math.random() * 0.5);
    const r = Math.min(w, h) * (0.18 + Math.random() * 0.22);
    let grad = null;
    try { grad = g.createRadialGradient(x, y, 0, x, y, r); } catch { grad = null; }
    if (!grad || typeof grad.addColorStop !== "function") continue;
    grad.addColorStop(0, `rgba(${tone},${alpha})`);
    grad.addColorStop(1, `rgba(${tone},0)`);
    g.fillStyle = grad;
    g.fillRect(x - r, y - r, r * 2, r * 2);
  }
  for (let i = 0; i < (o.streaks ?? 3); i++) {
    const x = w * (0.1 + Math.random() * 0.8);
    const len = h * (0.25 + Math.random() * 0.45);
    let grad = null;
    try { grad = g.createLinearGradient(x, 0, x, len); } catch { grad = null; }
    if (!grad || typeof grad.addColorStop !== "function") continue;
    grad.addColorStop(0, `rgba(${tone},${alpha * 0.8})`);
    grad.addColorStop(1, `rgba(${tone},0)`);
    g.fillStyle = grad;
    g.fillRect(x - (o.streakWidth ?? 2), 0, o.streakWidth ?? 2, len);
  }
}

/** Standard sign face: dark plate, accent rule, centred caps text. */
function signFace(text, o = {}) {
  return (g, w, h) => {
    g.fillStyle = o.bg ?? "#0b141d";
    g.fillRect(0, 0, w, h);
    if (o.worn) {
      noiseTexture(g, w, h, { density: 500, alpha: 0.05, tone: "0,0,0" });
      grimeOverlay(g, w, h, { blotches: 2, streaks: 2, alpha: 0.16 });
    }
    g.fillStyle = o.accent ?? HUD.accent;
    g.fillRect(0, h - Math.max(3, h * 0.07), w, Math.max(3, h * 0.07));
    g.fillStyle = o.fg ?? HUD.text;
    g.font = `600 ${Math.round(h * (o.scale ?? 0.46))}px 'Barlow Condensed', Arial, sans-serif`;
    g.textAlign = "center";
    g.textBaseline = "middle";
    const lines = String(text).split("\n");
    const step = h * 0.44;
    lines.forEach((line, i) => g.fillText(line, w / 2, h / 2 - ((lines.length - 1) * step) / 2 + i * step));
  };
}

/** Printed paper: permit, chart, schedule, label sheet. */
function paperFace(title, rows, o = {}) {
  return (g, w, h) => {
    g.fillStyle = o.bg ?? "#f2efe6";
    g.fillRect(0, 0, w, h);
    if (o.worn) {
      noiseTexture(g, w, h, { density: 350, alpha: 0.05, tone: o.wornTone ?? "90,74,46" });
      grimeOverlay(g, w, h, { blotches: 2, streaks: 1, tone: o.wornTone ?? "120,96,52", alpha: 0.16 });
    }
    g.fillStyle = o.band ?? "#22303c";
    g.fillRect(0, 0, w, h * 0.16);
    g.fillStyle = "#ffffff";
    g.font = `600 ${Math.round(h * 0.1)}px 'Barlow Condensed', Arial, sans-serif`;
    g.textAlign = "left";
    g.textBaseline = "middle";
    g.fillText(title, w * 0.05, h * 0.08);
    g.fillStyle = "#1d262e";
    g.font = `${Math.round(h * 0.062)}px Arial, sans-serif`;
    rows.forEach((row, i) => {
      const y = h * 0.26 + i * h * 0.1;
      g.fillStyle = "#63707c";
      g.fillRect(w * 0.05, y + h * 0.045, w * 0.9, 1);
      g.fillStyle = "#1d262e";
      g.fillText(row, w * 0.06, y);
    });
  };
}

// ---------------------------------------------------------------- room shells

/**
 * Enclosed room shell with floor, four walls, ceiling and a skirting rail.
 * Rooms are built around the origin; the learner spawns near +z looking to -z.
 */
function shell(parent, o = {}) {
  const w = o.w ?? 8, d = o.d ?? 8, h = o.h ?? 3.1;
  const g = group(parent);
  const floor = box(g, w, 0.12, d, 0, -0.06, 0, o.floor ?? 0x3a4048,
    { rough: o.floorRough ?? 0.85, metal: o.floorMetal ?? 0, cast: false });
  floor.receiveShadow = true;
  box(g, w, h, 0.12, 0, h / 2, -d / 2, o.wall ?? 0x5b6672, { rough: 0.94, cast: false });
  box(g, 0.12, h, d, -w / 2, h / 2, 0, o.wall ?? 0x5b6672, { rough: 0.94, cast: false });
  box(g, 0.12, h, d, w / 2, h / 2, 0, o.wall ?? 0x5b6672, { rough: 0.94, cast: false });
  box(g, w, 0.12, d, 0, h, 0, o.ceiling ?? 0x2b3238, { rough: 0.96, cast: false });
  if (o.backWall !== false) box(g, w, h, 0.12, 0, h / 2, d / 2, o.wall ?? 0x5b6672, { rough: 0.94, cast: false });
  if (o.skirt !== false) {
    box(g, w, 0.1, 0.04, 0, 0.05, -d / 2 + 0.08, o.skirtColor ?? 0x2a3038, { cast: false });
    box(g, 0.04, 0.1, d, -w / 2 + 0.08, 0.05, 0, o.skirtColor ?? 0x2a3038, { cast: false });
    box(g, 0.04, 0.1, d, w / 2 - 0.08, 0.05, 0, o.skirtColor ?? 0x2a3038, { cast: false });
  }
  return g;
}

/** Recessed ceiling panel that also acts as the room's key light source. */
function ceilingPanel(parent, x, z, o = {}) {
  const y = o.y ?? 3.02;
  box(parent, o.w ?? 1.2, 0.06, o.d ?? 0.32, x, y, z, 0x22282e, { cast: false, rough: 0.6, metal: 0.5 });
  const lens = box(parent, (o.w ?? 1.2) - 0.08, 0.03, (o.d ?? 0.32) - 0.06, x, y - 0.05, z,
    o.color ?? 0xfff4e2, { cast: false, emissive: o.color ?? 0xfff4e2, ei: o.ei ?? 1.5, rough: 0.4 });
  const lamp = new THREE.PointLight(o.color ?? 0xfff4e2, o.lamp ?? 1.5, o.range ?? 9, 2);
  lamp.position.set(x, y - 0.18, z);
  parent.add(lamp);
  return lens;
}

// ------------------------------------------------------------ composite props

/** Stainless / laminate work counter with legs, apron and optional undershelf. */
function counter(parent, w, d, x, z, color = 0x9aa4ad, o = {}) {
  const g = group(parent, x, 0, z, o.ry ?? 0);
  const hgt = o.height ?? 0.92;
  slab(g, w, 0.05, d, 0, hgt, 0, color, { rough: o.rough ?? 0.34, metal: o.metal ?? 0.72, radius: 0.02 });
  box(g, w - 0.06, 0.1, 0.03, 0, hgt - 0.08, -d / 2 + 0.03, color, { rough: 0.4, metal: 0.6 });
  for (const sx of [-1, 1]) for (const sz of [-1, 1]) {
    cyl(g, 0.022, 0.022, hgt - 0.05, sx * (w / 2 - 0.09), (hgt - 0.05) / 2, sz * (d / 2 - 0.09),
      0x7c848c, { rough: 0.35, metal: 0.85, seg: 10 });
  }
  if (o.undershelf !== false) {
    slab(g, w - 0.16, 0.03, d - 0.16, 0, 0.24, 0, color, { rough: 0.45, metal: 0.6, radius: 0.01 });
  }
  return g;
}

/** Wheeled trolley — salon trolley, phlebotomy cart, tool cart. */
function trolley(parent, x, z, color = 0x2b3239, o = {}) {
  const g = group(parent, x, 0, z, o.ry ?? 0);
  const w = o.w ?? 0.52, d = o.d ?? 0.4;
  for (const y of [0.34, 0.6, 0.86]) slab(g, w, 0.028, d, 0, y, 0, color, { rough: 0.42, metal: 0.35, radius: 0.015 });
  for (const sx of [-1, 1]) for (const sz of [-1, 1]) {
    cyl(g, 0.014, 0.014, 0.86, sx * (w / 2 - 0.03), 0.45, sz * (d / 2 - 0.03), 0x8d959d,
      { rough: 0.3, metal: 0.9, seg: 8 });
    const caster = cyl(g, 0.035, 0.035, 0.018, sx * (w / 2 - 0.03), 0.035, sz * (d / 2 - 0.03), 0x16191d,
      { rough: 0.8, seg: 12 });
    caster.rotation.z = Math.PI / 2;
  }
  return g;
}

/** Wall cabinet with doors and handles. */
function cabinet(parent, w, h, d, x, y, z, color = 0xd7dce1, o = {}) {
  const g = group(parent, x, y, z, o.ry ?? 0);
  box(g, w, h, d, 0, 0, 0, color, { rough: 0.55, metal: 0.1 });
  const gap = 0.006;
  for (const sx of [-1, 1]) {
    box(g, w / 2 - gap, h - 0.04, 0.018, sx * (w / 4), 0, d / 2 + 0.01, o.doorColor ?? color,
      { rough: 0.42, metal: 0.15 });
    box(g, 0.02, 0.11, 0.02, sx * 0.045, 0, d / 2 + 0.03, 0x8d959d, { rough: 0.3, metal: 0.9 });
  }
  return g;
}

/** Seated human stand-in: client in a salon chair, patient in a draw chair. */
function seatedFigure(parent, x, y, z, o = {}) {
  const g = group(parent, x, y, z, o.ry ?? 0);
  const skin = o.skin ?? 0xc99878;
  const cloth = o.cloth ?? 0x37505f;
  const torso = group(g, 0, 0, 0);
  box(torso, 0.4, 0.5, 0.26, 0, 0.72, 0, cloth, { rough: 0.9 });
  box(torso, 0.34, 0.16, 0.26, 0, 0.42, 0.02, cloth, { rough: 0.9 });        // lap
  for (const sx of [-1, 1]) {
    box(torso, 0.14, 0.14, 0.44, sx * 0.16, 0.4, 0.2, cloth, { rough: 0.9 }); // thighs
    cyl(torso, 0.055, 0.05, 0.42, sx * 0.16, 0.21, 0.4, cloth, { rough: 0.9, seg: 10 });
  }
  const head = group(torso, 0, 1.06, 0.01);
  ball(head, 0.115, 0, 0, 0, skin, { rough: 0.75, seg: 20 });
  box(head, 0.16, 0.1, 0.1, 0, -0.05, 0.05, skin, { rough: 0.75 });          // jaw
  cyl(torso, 0.05, 0.055, 0.12, 0, 0.98, 0, skin, { rough: 0.75, seg: 12 }); // neck
  const arms = [];
  for (const sx of [-1, 1]) {
    const shoulder = group(torso, sx * 0.23, 0.88, 0);
    cyl(shoulder, 0.05, 0.045, 0.3, 0, -0.15, 0, cloth, { rough: 0.9, seg: 10 });
    const fore = group(shoulder, 0, -0.3, 0);
    cyl(fore, 0.042, 0.038, 0.28, 0, -0.13, 0.02, skin, { rough: 0.75, seg: 10 });
    ball(fore, 0.045, 0, -0.28, 0.04, skin, { rough: 0.75, seg: 12 });
    arms.push({ shoulder, fore });
  }
  return { root: g, torso, head, arms };
}

// ------------------------------------------------------------------ particles

/** Cheap additive point burst reused for sparks, steam and water. */
function particles(parent, count, color, o = {}) {
  const positions = new Float32Array(count * 3);
  const geo = track(new THREE.BufferGeometry());
  geo.setAttribute("position", new THREE.BufferAttribute(positions, 3));
  const material = new THREE.PointsMaterial({
    color, size: o.size ?? 0.02, transparent: true, opacity: o.opacity ?? 0.9,
    blending: o.additive === false ? THREE.NormalBlending : THREE.AdditiveBlending,
    depthWrite: false, sizeAttenuation: true,
  });
  material.userData.ownMaterial = true;
  const points = new THREE.Points(geo, material);
  points.frustumCulled = false;
  points.visible = false;
  parent.add(points);
  const life = new Float32Array(count);
  const vel = new Float32Array(count * 3);
  points.userData.step = (dt, origin, spread, speed, gravity) => {
    for (let i = 0; i < count; i++) {
      life[i] -= dt;
      if (life[i] <= 0) {
        life[i] = 0.25 + Math.random() * (o.life ?? 0.6);
        positions[i * 3] = origin.x + (Math.random() - 0.5) * spread;
        positions[i * 3 + 1] = origin.y + (Math.random() - 0.5) * spread;
        positions[i * 3 + 2] = origin.z + (Math.random() - 0.5) * spread;
        vel[i * 3] = (Math.random() - 0.5) * speed;
        vel[i * 3 + 1] = (Math.random() * 0.6 + 0.4) * speed;
        vel[i * 3 + 2] = (Math.random() - 0.5) * speed;
      }
      positions[i * 3] += vel[i * 3] * dt;
      positions[i * 3 + 1] += vel[i * 3 + 1] * dt;
      positions[i * 3 + 2] += vel[i * 3 + 2] * dt;
      vel[i * 3 + 1] += gravity * dt;
    }
    geo.attributes.position.needsUpdate = true;
  };
  return points;
}

/**
 * A one-shot, self-driving particle celebration for "big moment" feedback — a
 * hot-streak step, a rank-up, a personal best. Parented once to `parent` (any
 * static node already in the scene, e.g. the room root); after that, call the
 * returned `fire(localPoint)` whenever the moment happens and call `update(dt)`
 * unconditionally from the render loop — it is a cheap no-op once the burst
 * has finished, so the caller never needs to track whether one is playing.
 */
function celebrationBurst(parent, o = {}) {
  const points = particles(parent, o.count ?? 70, o.color ?? 0xffe37a, {
    size: o.size ?? 0.032, life: o.life ?? 0.6, additive: o.additive !== false, opacity: o.opacity ?? 0.95,
  });
  const origin = new THREE.Vector3();
  let timer = 0;
  return {
    fire(localPoint) {
      origin.copy(localPoint);
      timer = o.duration ?? 0.5;
      points.visible = true;
    },
    update(dt) {
      if (timer <= 0) { if (points.visible) points.visible = false; return; }
      timer -= dt;
      points.userData.step(dt, origin, o.spread ?? 0.1, o.speed ?? 1.6, o.gravity ?? -1.8);
    },
  };
}

// ------------------------------------------------------------------- helpers

function markInteractive(objectOrGroup, id, o = {}) {
  objectOrGroup.userData.hitId = id;
  objectOrGroup.userData.hitLabel = o.label ?? id;
  return objectOrGroup;
}

const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
const lerp = (a, b, t) => a + (b - a) * t;
const easeOut = (t) => 1 - Math.pow(1 - clamp(t, 0, 1), 3);


/* ===== shared/game.js ===== */
// Procedure engine and gamification layer.
//
// A room supplies an ordered list of steps. The engine owns correctness: it
// decides whether an interaction advances the procedure, applies score, and
// produces the coaching line the HUD shows. Rooms never score themselves, so
// the assessment stays deterministic and auditable — the same contract the
// Unity build uses.

const STEP_POINTS = 100;
const WRONG_STEP_PENALTY = 25;
const HAZARD_PENALTY = 50;
const MAX_COMBO = 2.0;

// Named combo tiers — the HUD shows the label, not just the multiplier, so a
// hot streak reads as a game feel moment rather than an accounting detail.
const COMBO_TIERS = [
  { at: 0, label: "" },
  { at: 1.2, label: "Nice" },
  { at: 1.4, label: "Great" },
  { at: 1.6, label: "Awesome" },
  { at: 1.8, label: "On Fire" },
  { at: MAX_COMBO, label: "Unstoppable" },
];

const STORE_KEY = "trades-sim-v1";

// ---------------------------------------------------------------- progression

const MAX_BOARD_ENTRIES = 8;
const NAME_KEY = "trades-sim-name";

const Progress = {
  data: { xp: 0, rooms: {}, badges: [], boards: {} },
  playerName: "YOU",

  load() {
    try {
      const raw = JSON.parse(localStorage.getItem(STORE_KEY) || "null");
      if (raw && typeof raw === "object") {
        this.data = {
          xp: raw.xp | 0,
          rooms: raw.rooms && typeof raw.rooms === "object" ? raw.rooms : {},
          badges: Array.isArray(raw.badges) ? raw.badges : [],
          boards: raw.boards && typeof raw.boards === "object" ? raw.boards : {},
        };
      }
    } catch (_) { /* private mode or blocked storage — run unsaved */ }
    try {
      const savedName = localStorage.getItem(NAME_KEY);
      if (savedName) this.playerName = savedName.slice(0, 12);
    } catch (_) { /* ignore */ }
    return this.data;
  },

  setPlayerName(name) {
    this.playerName = (name || "YOU").trim().slice(0, 12).toUpperCase() || "YOU";
    try { localStorage.setItem(NAME_KEY, this.playerName); } catch (_) { /* ignore */ }
  },

  save() {
    try { localStorage.setItem(STORE_KEY, JSON.stringify(this.data)); } catch (_) { /* ignore */ }
  },

  reset() {
    this.data = { xp: 0, rooms: {}, badges: [], boards: {} };
    try { localStorage.removeItem(STORE_KEY); } catch (_) { /* ignore */ }
  },

  /**
   * Local competitive leaderboard for one simulator: the top runs recorded on
   * this device, arcade-cabinet style. Everyone sharing the machine — a crew,
   * a classroom, a kiosk — competes on the same board under their own name.
   * There is no server: this never leaves the browser.
   */
  leaderboard(simId) {
    return (this.data.boards[simId] ?? []).slice().sort(
      (a, b) => b.score - a.score || a.seconds - b.seconds);
  },

  submitScore(simId, { name, score, seconds, stars }) {
    const board = this.leaderboard(simId);
    const entry = { name: (name || this.playerName).slice(0, 12).toUpperCase(), score, seconds, stars, at: Date.now() };
    board.push(entry);
    board.sort((a, b) => b.score - a.score || a.seconds - b.seconds);
    const trimmed = board.slice(0, MAX_BOARD_ENTRIES);
    this.data.boards[simId] = trimmed;
    this.save();
    const rank = trimmed.indexOf(entry);
    return { rank: rank < 0 ? null : rank + 1, board: trimmed, madeBoard: rank >= 0 };
  },

  /** Combined standing across every simulator this device has played — the
   * suite-wide leaderboard that rewards breadth across the whole SmartCiti.X campus. */
  suiteStanding() {
    let totalScore = 0, totalRuns = 0, totalStars = 0, simsPlayed = 0;
    for (const state of Object.values(this.data.rooms)) {
      if (!state.runs) continue;
      simsPlayed += 1;
      totalRuns += state.runs | 0;
      totalScore += state.best | 0;
      totalStars += state.stars | 0;
    }
    return { totalScore, totalRuns, totalStars, simsPlayed };
  },

  get level() { return 1 + Math.floor(Math.sqrt(this.data.xp / 120)); },
  get xpIntoLevel() {
    const base = Math.pow(this.level - 1, 2) * 120;
    const next = Math.pow(this.level, 2) * 120;
    return { into: this.data.xp - base, span: next - base };
  },
  roomState(id) {
    return this.data.rooms[id] || { stars: 0, best: 0, bestTime: null, runs: 0, xp: 0, badges: [] };
  },

  /**
   * Rank inside one simulator's own system. Each area defines its own ladder,
   * so a learner is (say) a Fault Lead on the charge point and still an
   * apprentice in the vault — progression is per trade, not one global level.
   */
  simRank(id, game) {
    const xp = this.roomState(id).xp | 0;
    const marks = game?.rankAt ?? [0, 900, 2200, 4000, 6500];
    const names = game?.ranks ?? ["Apprentice", "Operator", "Technician", "Lead", "Certified"];
    let tier = 0;
    for (let i = 0; i < marks.length; i++) if (xp >= marks[i]) tier = i;
    const next = marks[tier + 1] ?? null;
    return {
      tier, name: names[Math.min(tier, names.length - 1)], xp,
      next, into: xp - marks[tier], span: next == null ? 0 : next - marks[tier],
      max: tier >= marks.length - 1,
    };
  },

  simBadges(id) { return this.roomState(id).badges ?? []; },
  get completedRooms() { return Object.values(this.data.rooms).filter((r) => r.stars > 0).length; },
  get totalStars() { return Object.values(this.data.rooms).reduce((n, r) => n + (r.stars | 0), 0); },

  record(roomId, { score, stars, seconds, badge, earned = [] }) {
    const prev = this.roomState(roomId);
    const badges = [...(prev.badges ?? [])];
    for (const id of earned) if (!badges.includes(id)) badges.push(id);
    const next = {
      stars: Math.max(prev.stars | 0, stars),
      best: Math.max(prev.best | 0, score),
      bestTime: prev.bestTime == null ? seconds : Math.min(prev.bestTime, seconds),
      runs: (prev.runs | 0) + 1,
      xp: (prev.xp | 0) + Math.max(0, score),
      badges,
    };
    this.data.rooms[roomId] = next;
    this.data.xp += Math.max(0, Math.round(score / 8));
    if (badge && !this.data.badges.includes(badge)) this.data.badges.push(badge);
    for (const id of earned) {
      const scoped = `${roomId}:${id}`;
      if (!this.data.badges.includes(scoped)) this.data.badges.push(scoped);
    }
    this.save();
    return next;
  },
};

// ------------------------------------------------------------------ the audio

/** Tiny WebAudio synth — feedback tones with no asset downloads. */
const Sfx = {
  ctx: null,
  muted: false,
  ensure() {
    if (!this.ctx) {
      const Ctor = window.AudioContext || window.webkitAudioContext;
      if (Ctor) this.ctx = new Ctor();
    }
    if (this.ctx?.state === "suspended") this.ctx.resume();
    return this.ctx;
  },
  blip(freq, dur = 0.12, type = "sine", gain = 0.06) {
    if (this.muted) return;
    const ctx = this.ensure();
    if (!ctx) return;
    const osc = ctx.createOscillator();
    const amp = ctx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, ctx.currentTime);
    amp.gain.setValueAtTime(0.0001, ctx.currentTime);
    amp.gain.exponentialRampToValueAtTime(gain, ctx.currentTime + 0.01);
    amp.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + dur);
    osc.connect(amp).connect(ctx.destination);
    osc.start();
    osc.stop(ctx.currentTime + dur + 0.02);
  },
  good() { this.blip(660, 0.09, "triangle"); setTimeout(() => this.blip(990, 0.12, "triangle"), 70); },
  great() { [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => this.blip(f, 0.1, "triangle"), i * 65)); },
  bad() { this.blip(150, 0.22, "sawtooth", 0.05); },
  tick() { this.blip(1200, 0.03, "square", 0.02); },
  alarm() { [0, 1, 2].forEach((i) => setTimeout(() => this.blip(220, 0.16, "square", 0.05), i * 190)); },
};

// ---------------------------------------------------------------- the session

/**
 * One run of one room. `hooks` receives every state change so the HUD, the 3D
 * scene and the audio stay in sync without the engine knowing about any of them.
 */
class Session {
  constructor(room, hooks = {}) {
    this.room = room;
    this.hooks = hooks;
    this.index = 0;
    this.score = 0;
    this.streak = 0;
    this.peakCombo = 1;      // best combo multiplier reached this run
    this.errors = 0;
    this.finished = false;
    this.elapsed = 0;
    this.log = [];
    this.sequence = [];      // progress within a 'sequence' step
    this.holdFor = 0;        // progress within a 'hold' step
    this.holding = false;
    this.gauge = null;       // live gauge state for a 'gauge' step
    this.track = null;       // live state for a 'track' step
    this.turn = null;        // live state for a 'turn' step
    this.stars = 0;
    this.badgeEarned = null;
    this.hazardHits = 0;      // unsafe-action selections in this run
    this.gaugeScores = [];    // 0..1 accuracy for each graded skill step
    this.holdBreaks = 0;      // timed steps released early
    this.earned = [];         // per-sim badges and challenges cleared this run
  }

  /** Mean accuracy across graded steps, 0 when the run had none. */
  get precision() {
    if (!this.gaugeScores.length) return 0;
    return this.gaugeScores.reduce((a, b) => a + b, 0) / this.gaugeScores.length;
  }

  get steps() { return this.room.steps; }
  get step() { return this.steps[this.index] || null; }
  get combo() { return Math.min(MAX_COMBO, 1 + this.streak * 0.1); }
  /** Named tier for the current combo — the HUD shows this, not just the number. */
  get comboLabel() {
    let label = "";
    for (const tier of COMBO_TIERS) if (this.combo >= tier.at) label = tier.label;
    return label;
  }
  get progress01() { return this.steps.length ? this.index / this.steps.length : 0; }

  start() {
    this.elapsed = 0;
    // Snapshot rank before this run so finish() can tell whether it moved the
    // needle — a rank-up mid-progression is a moment worth celebrating.
    this.rankBefore = this.room.game ? Progress.simRank(this.room.id, this.room.game) : null;
    this.enterStep();
    return this;
  }

  enterStep() {
    const step = this.step;
    this.sequence = [];
    this.holdFor = 0;
    this.holding = false;
    this.gauge = null;
    this.track = null;
    this.turn = null;
    if (!step) return;
    if (step.kind === "track") {
      const cfg = step.track ?? {};
      this.track = {
        v: cfg.start ?? 0.1,
        green: cfg.green ?? [0.42, 0.62],
        rise: cfg.rise ?? 0.62,
        fall: cfg.fall ?? 0.46,
        drift: cfg.drift ?? 0.1,
        wobble: Math.random() * 6,
        inBand: 0,
        dropouts: 0,
        wasIn: false,
        label: cfg.label ?? "",
        readout: cfg.readout ?? null,
      };
    }
    if (step.kind === "gauge") {
      this.gauge = {
        t: 0, dir: 1,
        speed: step.gauge.speed ?? 0.85,
        green: step.gauge.green ?? [0.44, 0.62],
        label: step.gauge.label ?? "",
        readout: step.gauge.readout ?? null,
        committed: false,
      };
    }
    if (step.kind === "turn") {
      this.turn = {
        amount: 0,
        required: step.turn?.turns ?? 1,
        label: step.turn?.label ?? "",
        readout: step.turn?.readout ?? null,
      };
    }
    this.hooks.onStep?.(step, this);
  }

  /** Player selected an interactable by id. Returns a feedback record. */
  select(hitId) {
    if (this.finished || !this.step) return null;
    const step = this.step;

    if (step.kind === "sequence") return this.selectInSequence(hitId, step);

    if (step.kind === "gauge") {
      if (hitId === step.target || hitId === "gauge-commit") return this.commitGauge();
      return this.wrong(hitId, "Set the gauge first, then commit the reading.");
    }

    if (step.kind === "hold" || step.kind === "track") {
      if (hitId === step.target) return null; // driven by press and release
      return this.wrong(hitId);
    }

    if (step.kind === "turn") {
      if (hitId === step.target) return null; // driven by rotate(), a continuous drag input
      return this.wrong(hitId);
    }

    if (step.kind === "drag") {
      if (hitId === step.target) return null; // driven by dropAt(), a pick-up-and-carry gesture
      return this.wrong(hitId);
    }

    if (step.kind === "find") return this.selectInSequence(hitId, { ...step, anyOrder: true });

    if (hitId === step.target) return this.advance(STEP_POINTS);
    return this.wrong(hitId);
  }

  selectInSequence(hitId, step) {
    if (this.sequence.includes(hitId)) {
      const feedback = { kind: "partial", text: `Already verified — ${step.itemNames?.[hitId] ?? hitId}.` };
      this.hooks.onFeedback?.(feedback, this);
      return feedback;
    }
    // anyOrder steps require completeness, not a particular order: use them where
    // the real procedure has no mandated sequence, and strict order where it does.
    const expected = step.anyOrder
      ? (step.targets.includes(hitId) ? hitId : null)
      : step.targets[this.sequence.length];
    if (hitId === expected) {
      this.sequence.push(hitId);
      const done = this.sequence.length === step.targets.length;
      if (done) return this.advance(STEP_POINTS + 20 * (step.targets.length - 1));
      Sfx.tick();
      const note = step.itemNotes?.[hitId];
      const feedback = {
        kind: "partial",
        text: `<b>${this.sequence.length}/${step.targets.length} — ${step.itemNames?.[hitId] ?? hitId}.</b>` +
          (note ? `<br>${note}` : " Keep going."),
      };
      this.hooks.onFeedback?.(feedback, this);
      return feedback;
    }
    if (step.decoyNotes?.[hitId]) {
      return this.wrong(hitId, step.decoyNotes[hitId]);
    }
    if (step.targets.includes(hitId)) {
      return this.wrong(hitId, step.outOfOrderNote
        ?? "Out of order. Sequence matters here — reset and take them in the required order.", true);
    }
    return this.wrong(hitId);
  }

  /** Called each frame while a 'hold' step's target is held. */
  setHolding(on) {
    if (!this.step) return;
    if (this.step.kind === "track") { this.holding = on; return; }
    if (this.step.kind !== "hold") return;
    this.holding = on;
    if (!on && this.holdFor > 0 && this.holdFor < this.step.seconds) {
      this.holdFor = 0;
      this.holdBreaks += 1;
      const feedback = { kind: "warn", text: `${this.step.holdBreakNote ?? "Released too early — start the full duration again."}` };
      Sfx.bad();
      this.hooks.onFeedback?.(feedback, this);
    }
  }

  commitGauge() {
    const step = this.step;
    if (!this.gauge || this.gauge.committed) return null;
    const [lo, hi] = this.gauge.green;
    const t = this.gauge.t;
    this.gauge.committed = true;
    if (t < lo || t > hi) {
      this.gauge.committed = false;
      return this.wrong(step.target, step.gauge.missNote
        ?? "Outside the acceptable band. Watch the marker and commit inside the green zone.");
    }
    const centre = (lo + hi) / 2;
    const halfBand = (hi - lo) / 2;
    const accuracy = 1 - Math.abs(t - centre) / halfBand;      // 1 at centre, 0 at edge
    this.gaugeScores.push(Math.max(0, accuracy));
    const bonus = Math.round(50 * Math.max(0, accuracy));
    return this.advance(STEP_POINTS + bonus, bonus >= 40 ? "Dead centre." : null);
  }

  /**
   * Continuous rotational input for a 'turn' step — spinning a valve wheel or
   * throwing a switch by dragging it, rather than clicking an abstract target.
   * `deltaTurns` is a signed fraction of one full turn; the UI layer converts a
   * pointer or controller angular delta into this. Turning backward is free —
   * it lets a learner back off an overshoot rather than being penalised for it.
   */
  rotate(hitId, deltaTurns) {
    if (this.finished || !this.step || this.step.kind !== "turn" || hitId !== this.step.target || !this.turn) return null;
    this.turn.amount = Math.max(0, Math.min(this.turn.required, this.turn.amount + deltaTurns));
    if (this.turn.amount >= this.turn.required) return this.advance(STEP_POINTS);
    return null;
  }

  /** Whether `hitId` is a live pick-up point for the current 'drag' step. */
  canDrag(hitId) {
    return !this.finished && this.step?.kind === "drag" && hitId === this.step.target;
  }

  /**
   * Player released a carried object. `distance` is how far, in metres, the
   * drop landed from the step's required socket; pass null for "no useful
   * distance" (also treated as a miss). Unlike a gauge, a drag near-miss costs
   * nothing — carrying something into place is exploratory, not a precision
   * test — the object is expected to spring back to be tried again. Dropping
   * it onto a registered hazard is still scored, through the normal hazard
   * path, by calling wrong() with that hazard's id instead of this method.
   */
  dropAt(hitId, distance) {
    if (this.finished || !this.step || this.step.kind !== "drag" || hitId !== this.step.target) return null;
    const radius = this.step.drag?.radius ?? 0.35;
    if (distance != null && distance <= radius) return this.advance(STEP_POINTS);
    const feedback = { kind: "partial", text: this.step.drag?.missNote ?? "Not quite lined up — line it up with the marker and try again." };
    this.hooks.onFeedback?.(feedback, this);
    return feedback;
  }

  advance(points, extraNote = null) {
    const step = this.step;
    const earned = Math.round(points * this.combo);
    this.score += earned;
    this.streak += 1;
    this.peakCombo = Math.max(this.peakCombo, this.combo);
    this.log.push({ step: step.id, ok: true, points: earned });
    const feedback = {
      kind: "ok",
      points: earned,
      combo: this.combo,
      text: `<b>+${earned} — ${step.title}</b>${this.combo > 1.05 ? ` <span class="mult">×${this.combo.toFixed(1)}</span>` : ""}<br>${extraNote ? extraNote + " " : ""}${step.why}`,
    };
    if (this.combo >= 1.5) Sfx.great(); else Sfx.good();
    this.hooks.onFeedback?.(feedback, this);
    this.hooks.onStepComplete?.(step, this);
    this.index += 1;
    if (this.index >= this.steps.length) this.finish();
    else this.enterStep();
    return feedback;
  }

  /** True when `hitId` belongs to a step the learner has not reached yet. */
  isLaterStep(hitId) {
    for (let i = this.index + 1; i < this.steps.length; i++) {
      const s = this.steps[i];
      if (s.target === hitId || s.targets?.includes(hitId)) return s;
    }
    return null;
  }

  wrong(hitId, note = null, isOrderError = false) {
    const hazard = this.room.hazards?.[hitId];
    const later = hazard ? null : this.isLaterStep(hitId);
    const penalty = hazard ? HAZARD_PENALTY : WRONG_STEP_PENALTY;
    this.score = Math.max(0, this.score - penalty);
    this.streak = 0;
    this.errors += 1;
    this.log.push({ step: this.step?.id, ok: false, hit: hitId });
    const lateNote = later
      ? (this.room.lateNotes?.[hitId] ?? `That control belongs to a later step. ${this.step?.cue ?? ""}`)
      : null;
    const body = hazard ?? note ?? lateNote ?? `That is not the next control. ${this.step?.cue ?? ""}`;
    const label = hazard ? "Unsafe action"
      : isOrderError ? "Out of sequence"
      : later ? "Too early" : "Wrong step";
    const feedback = {
      kind: hazard ? "danger" : "warn",
      text: `<b>−${penalty} — ${label}</b><br>${body}`,
      hazard: !!hazard,
    };
    if (hazard) { this.hazardHits += 1; Sfx.alarm(); this.hooks.onHazard?.(hitId, this); } else Sfx.bad();
    this.hooks.onFeedback?.(feedback, this);
    return feedback;
  }

  tick(dt) {
    if (this.finished) return;
    this.elapsed += dt;
    const step = this.step;
    if (!step) return;

    if (step.kind === "gauge" && this.gauge && !this.gauge.committed) {
      this.gauge.t += this.gauge.dir * this.gauge.speed * dt;
      if (this.gauge.t >= 1) { this.gauge.t = 1; this.gauge.dir = -1; }
      if (this.gauge.t <= 0) { this.gauge.t = 0; this.gauge.dir = 1; }
    }

    if (step.kind === "track" && this.track) {
      const tr = this.track;
      // Press to drive the value up, release to let it fall, with a slow drift
      // the learner has to correct for — the point is holding it steady.
      tr.v += (this.holding ? tr.rise : -tr.fall) * dt;
      tr.v += Math.sin((this.elapsed + tr.wobble) * 1.7) * tr.drift * dt;
      tr.v = Math.max(0, Math.min(1, tr.v));
      const inside = tr.v >= tr.green[0] && tr.v <= tr.green[1];
      if (inside) {
        tr.inBand += dt;
        if (!tr.wasIn) Sfx.tick();
      } else {
        if (tr.wasIn) tr.dropouts += 1;
        tr.inBand = Math.max(0, tr.inBand - dt * 0.8);
      }
      tr.wasIn = inside;
      if (tr.inBand >= step.seconds) {
        const clean = Math.max(0, 40 - tr.dropouts * 12);
        this.advance(STEP_POINTS + 20 + clean,
          tr.dropouts === 0 ? "Held it clean the whole way." : null);
      }
      return;
    }

    if (step.kind === "hold" && this.holding) {
      const before = this.holdFor;
      this.holdFor = Math.min(step.seconds, this.holdFor + dt);
      if (Math.floor(this.holdFor) !== Math.floor(before)) Sfx.tick();
      if (this.holdFor >= step.seconds) {
        this.holding = false;
        this.advance(STEP_POINTS + 25);
      }
    }
  }

  finish() {
    if (this.finished) return;
    this.finished = true;
    const par = this.room.parSeconds ?? 150;
    const timeBonus = Math.max(0, Math.round((par - this.elapsed) * 2));
    this.score += timeBonus;
    this.timeBonus = timeBonus;
    this.stars = this.errors === 0 && this.elapsed <= par ? 3
      : this.errors <= 1 && this.elapsed <= par * 1.5 ? 2 : 1;
    if (this.stars === 3 && this.room.badge) this.badgeEarned = this.room.badge.id;

    // Each simulator judges its own badges and challenges against this run.
    const system = this.room.game;
    if (system) {
      for (const award of [...(system.badges ?? []), ...(system.challenges ?? [])]) {
        try {
          if (award.test?.(this)) this.earned.push(award.id);
        } catch (_) { /* a broken predicate must not break the run */ }
      }
    }

    const summary = Progress.record(this.room.id, {
      score: this.score, stars: this.stars, seconds: Math.round(this.elapsed),
      badge: this.badgeEarned, earned: this.earned,
    });
    this.rank = Progress.simRank(this.room.id, system);
    this.rankedUp = !!(this.rankBefore && this.rank.tier > this.rankBefore.tier);
    this.leaderboard = Progress.submitScore(this.room.id, {
      score: this.score, seconds: Math.round(this.elapsed), stars: this.stars,
    });
    Sfx.great();
    this.hooks.onFinish?.(this, summary);
  }
}


/* ===== smartcity/js/citykit.js ===== */
// SmartCity.X asset kit — the pieces every station is assembled from.
//
// These stations are authored for augmented reality: each one occupies a small
// footprint the learner walks around in their own room, so the props are
// human-scale and free-standing rather than built into walls. Everything reads
// correctly with passthrough behind it, which is why the holographic elements
// are emissive and the physical equipment is not.

const CITY = {
  accent: 0x4fd1ff,          // SmartCity.X holo cyan
  accentCss: "#4fd1ff",
  holo: 0x7ee6ff,
  violet: 0xa079ff,
  steel: 0x8b949d,
  darkSteel: 0x3c444c,
  case: 0x2a3138,
  hiVis: 0xf2c14b,
  alert: 0xf0645b,
  good: 0x59c97b,
};

/** The station footprint: a holographic pad the equipment stands on. */
function stationPad(parent, radius = 1.75, accent = CITY.accent) {
  const g = group(parent);
  torus(g, radius, 0.014, 0, 0.012, 0, accent,
    { emissive: accent, ei: 2.2, rough: 0.4, cast: false, seg: 8, seg2: 56 });
  torus(g, radius - 0.09, 0.005, 0, 0.012, 0, accent,
    { emissive: accent, ei: 1.1, rough: 0.4, cast: false, seg: 6, seg2: 56 });
  for (let i = 0; i < 8; i++) {
    const a = (i / 8) * Math.PI * 2 + Math.PI / 8;
    const tick = box(g, 0.03, 0.006, 0.17, Math.sin(a) * radius, 0.012, Math.cos(a) * radius,
      accent, { emissive: accent, ei: 1.8, rough: 0.4, cast: false });
    tick.rotation.y = a;
  }
  return g;
}

/** Free-standing holographic panel: the station's readouts and paperwork in AR. */
function holoPanel(parent, w, h, x, y, z, draw, o = {}) {
  const g = group(parent, x, y, z, o.ry ?? 0);
  const accent = o.accent ?? CITY.accent;
  const face = decal(g, w, h, 0, 0, 0, draw, { px: o.px ?? 640, glow: true, ei: o.ei ?? 0.95, transparent: true });
  // Corner brackets rather than a full frame — reads as a projection, not a screen.
  for (const sx of [-1, 1]) for (const sy of [-1, 1]) {
    box(g, w * 0.16, 0.006, 0.004, sx * (w / 2 - w * 0.08), sy * (h / 2), -0.002, accent,
      { emissive: accent, ei: 2.4, rough: 0.4, cast: false });
    box(g, 0.006, h * 0.22, 0.004, sx * (w / 2), sy * (h / 2 - h * 0.11), -0.002, accent,
      { emissive: accent, ei: 2.4, rough: 0.4, cast: false });
  }
  if (o.stalk) {
    cyl(g, 0.008, 0.008, y - 0.02, 0, -(y - 0.02) / 2 - h / 2, 0, accent,
      { emissive: accent, ei: 0.9, rough: 0.4, seg: 8, cast: false });
  }
  g.userData.face = face;
  return g;
}

/** Small floating caption used to name a piece of equipment in the AR overlay. */
function holoTag(parent, text, x, y, z, o = {}) {
  const accent = o.accent ?? CITY.accent;
  return decal(parent, o.w ?? 0.3, o.h ?? 0.07, x, y, z, (g, w, h) => {
    g.fillStyle = "rgba(6,14,20,0.82)";
    g.fillRect(0, 0, w, h);
    g.fillStyle = o.css ?? CITY.accentCss;
    g.fillRect(0, 0, 4, h);
    g.fillStyle = "#eaf6fb";
    g.font = `600 ${Math.round(h * 0.56)}px 'Barlow Condensed', Arial, sans-serif`;
    g.textAlign = "left"; g.textBaseline = "middle";
    g.fillText(String(text).toUpperCase(), w * 0.06, h * 0.56);
  }, { px: 320, glow: true, ei: 0.8, transparent: true });
}

/**
 * A thin transparent decal laid over a flat-coloured surface to add grain and grime
 * without hiding the material colour underneath — an overlay, not a face.
 */
function weatherPanel(parent, w, h, x, y, z, o = {}) {
  return decal(parent, w, h, x, y, z, (g, cw, ch) => {
    g.clearRect(0, 0, cw, ch);
    noiseTexture(g, cw, ch, { density: o.density ?? 650, alpha: o.alpha ?? 0.05, tone: o.tone ?? "8,8,8" });
    grimeOverlay(g, cw, ch, {
      blotches: o.blotches ?? 3, streaks: o.streaks ?? 2,
      tone: o.tone ?? "12,10,6", alpha: o.grime ?? 0.2,
    });
  }, { px: o.px ?? 192, transparent: true, rough: 0.95 });
}

/** Street / plant equipment cabinet with a hinged door, louvres and plinth. */
function equipmentCabinet(parent, w, h, d, x, z, o = {}) {
  const g = group(parent, x, 0, z, o.ry ?? 0);
  const shell = o.color ?? 0x6f7a83;
  box(g, w + 0.1, 0.09, d + 0.1, 0, 0.045, 0, 0x2d3339, { rough: 0.85 });          // plinth
  box(g, w, h, d, 0, 0.09 + h / 2, 0, shell, { rough: o.rough ?? 0.5, metal: o.metal ?? 0.5 });
  box(g, w + 0.06, 0.04, d + 0.06, 0, 0.09 + h + 0.02, 0, shell, { rough: 0.5, metal: 0.5 }); // rain cap
  for (let i = 0; i < 4; i++) {                                                     // louvres
    box(g, w * 0.5, 0.014, 0.01, 0, 0.09 + h * 0.28 + i * 0.05, d / 2 + 0.006, shell,
      { rough: 0.6, metal: 0.4 });
  }
  const door = group(g, -w / 2 + 0.01, 0.09 + h / 2, d / 2);
  box(door, w - 0.03, h - 0.06, 0.022, (w - 0.03) / 2, 0, 0.012, o.doorColor ?? shell,
    { rough: 0.45, metal: 0.55 });

// Discrete tone/finish sets — reused across towers so the material cache stays small
// instead of minting one unique material per random roughness value.
const SKY_TONES = [0x141b23, 0x171f2a, 0x11161d, 0x1a2029, 0x0f151c, 0x1c2733];
const SKY_ROUGH = [0.82, 0.88, 0.94, 1.0];
const SKY_WINDOW = [0x4fd1ff, 0x7ee6ff, 0xffd28a, 0xa079ff];

/**
 * Distant skyline for the non-AR stage: a silhouette ring, never lit by scene lights.
 * Each tower gets its own height/tone/window-band treatment so the ring reads as a
 * real mixed-use district rather than a repeated block; a handful of rooftops carry a
 * slow-pulsing beacon (returned in `userData.beacons` for the caller to animate).
 */
function skyline(parent, o = {}) {
  const g = group(parent);
  const count = o.count ?? 54;
  const beacons = [];
  for (let i = 0; i < count; i++) {
    const a = (i / count) * Math.PI * 2 + Math.random() * 0.05;
    const r = 34 + Math.random() * 16;
    const h = 5 + Math.random() * 24;
    const w = 3 + Math.random() * 5;
    const tone = SKY_TONES[i % SKY_TONES.length];
    const rough = SKY_ROUGH[i % SKY_ROUGH.length];
    const metal = i % 5 === 0 ? 0.3 : 0;
    const tower = box(g, w, h, w, Math.sin(a) * r, h / 2 - 1.5, Math.cos(a) * r,
      tone, { rough, metal, cast: false, receive: false });
    tower.rotation.y = a;
    const bands = 1 + (i % 3 === 0 ? 1 : 0);
    for (let b = 0; b < bands; b++) {
      if ((i + b * 7) % 5 === 0) continue; // leave some floors dark
      const wt = SKY_WINDOW[(i + b) % SKY_WINDOW.length];
      const lit = box(g, w * (0.55 + ((i + b) % 4) * 0.06), 0.06, 0.05,
        Math.sin(a) * r, h * (0.25 + b * 0.32 + ((i * 7 + b) % 5) * 0.05) - 1.5,
        Math.cos(a) * r + w / 2, wt,
        { emissive: wt, ei: 1.3 + ((i + b) % 4) * 0.35, rough: 0.4, cast: false, receive: false });
      lit.rotation.y = a;
    }
    if (i % 9 === 0) {
      const beacon = ball(g, 0.09, Math.sin(a) * r, h - 1.5 + 0.12, Math.cos(a) * r, 0xff5f5f,
        { emissive: 0xff5f5f, ei: 1.6, rough: 0.3, cast: false });
      // Give each beacon its own material instance (cheap — a handful of towers only)
      // so the pulse below can stagger per-beacon instead of every one sharing (and
      // fighting over) the single cached material `mat()` would otherwise reuse.
      beacon.material = beacon.material.clone();
      beacon.material.userData.ownMaterial = true; // disposeTree() should free this clone
      beacon.userData.phase = (i / count) * Math.PI * 2;
      beacons.push(beacon);
    }
  }
  g.userData.beacons = beacons;
  return g;
}

function reg(hits, obj, id) {
  markInteractive(obj, id);
  hits[id] = obj;
  return obj;
}


/* ===== smartcity/js/gamify.js ===== */
// Per-simulator gamified systems.
//
// Every SmartCiti.X area is its own system: its own name, its own currency, its
// own rank ladder and its own badges and challenges. A learner can be a Fault
// Lead on the charge point and still an apprentice in the valve vault — rank is
// earned inside a trade, not across the platform.

/** Product naming: every area is "SmartCiti.X~ <Name> VR". */
const BRAND = "SmartCiti.X";
const simTitle = (name) => `${BRAND}~ ${name} VR`;

/** Predicates the systems judge a finished run against. */
const AWARD = {
  /** No wrong selections at all. */
  clean: (s) => s.errors === 0,
  /** No unsafe-action selections — you may have fumbled the order, never the safety. */
  safe: (s) => s.hazardHits === 0,
  /** Finished inside a fraction of par time. */
  fast: (fraction = 0.8) => (s) => s.elapsed <= s.room.parSeconds * fraction,
  /** Mean accuracy across the graded skill steps. */
  precise: (level = 0.75) => (s) => s.gaugeScores.length > 0 && s.precision >= level,
  /** Every timed hold carried to full duration first time. */
  unbroken: (s) => s.holdBreaks === 0,
  /** Reached the maximum combo multiplier at some point in the run. */
  streak: (n = 10) => (s) => {
    let best = 0, run = 0;
    for (const entry of s.log) { run = entry.ok ? run + 1 : 0; best = Math.max(best, run); }
    return best >= n;
  },
  /** A specific step completed without any error recorded against it. */
  stepClean: (stepId) => (s) => !s.log.some((e) => e.step === stepId && !e.ok),
  /** Combine predicates. */
  all: (...tests) => (s) => tests.every((t) => t(s)),
};

const DEFAULT_RANK_AT = [0, 900, 2200, 4000, 6500];

/**
 * Fill in a simulator's system definition. Ranks are required — they are what
 * makes each area feel like its own progression rather than a shared score.
 */
function system({ name, currency, ranks, rankAt, badges = [], challenges = [] }) {
  return {
    system: name,
    currency,
    ranks,
    rankAt: rankAt ?? DEFAULT_RANK_AT.slice(0, ranks.length),
    badges,
    challenges,
  };
}

// Flagship banner copy, product-owner-specified: SmartCiti.X is the visitor-facing
// simulator brand; AGI Corp and Visko are the umbrella/co-brands it is built and run under.
const MARQUEE_LINE = "SMARTCITI.X ~VR SIMULATORS";
const MARQUEE_SUB = "POWERED BY AGI CORP & VISKO";

/** Flagship entrance marquee: two support posts, a lit beam, a canvas wordmark and a
 *  small rotating holo-emblem. Built once; the returned refs are cheap to animate
 *  per-frame (no allocations, just property tweaks on cached materials). */
function buildMarquee(g) {
  const spanW = 6.2, postH = 4.6, postR = 0.16, mz = -9.6;
  const marquee = group(g, 0, 0, mz);
  for (const sx of [-1, 1]) {
    cyl(marquee, postR, postR * 1.15, postH, sx * spanW / 2, postH / 2, 0, 0x232b33, { rough: 0.4, metal: 0.65, seg: 14 });
    box(marquee, postR * 2.4, 0.22, postR * 2.4, sx * spanW / 2, 0.11, 0, 0x1a2129, { rough: 0.6, metal: 0.4 });
  }
  box(marquee, spanW + 0.5, 0.5, 0.4, 0, postH + 0.05, 0, 0x171f28, { rough: 0.45, metal: 0.55 });
  const trim = box(marquee, spanW + 0.3, 0.03, 0.05, 0, postH - 0.22, 0.21, CITY.accent,
    { emissive: CITY.accent, ei: 1.6, rough: 0.4, cast: false });

  const sign = decal(marquee, spanW - 0.4, 1.55, 0, postH - 1.0, 0.22, (cx, cw, ch) => {
    gradientFill(cx, cw, ch, [[0, "#04141c"], [1, "#0b2733"]]);
    noiseTexture(cx, cw, ch, { density: 260, alpha: 0.03, tone: "255,255,255" });
    cx.fillStyle = "#8fd8ff";
    cx.font = `600 ${Math.round(ch * 0.13)}px 'Barlow Condensed', Arial, sans-serif`;
    cx.textAlign = "center"; cx.textBaseline = "middle";
    cx.fillText(MARQUEE_SUB, cw / 2, ch * 0.18);
    cx.fillStyle = "#eaf6fb";
    cx.font = `700 ${Math.round(ch * 0.36)}px 'Barlow Condensed', Arial, sans-serif`;
    cx.fillText(MARQUEE_LINE, cw / 2, ch * 0.55);
    cx.fillStyle = CITY.accentCss;
    cx.font = `500 ${Math.round(ch * 0.11)}px 'Barlow', Arial, sans-serif`;
    cx.fillText("FLAGSHIP AR / VR TRAINING SIMULATORS", cw / 2, ch * 0.85);
  }, { px: 1024, glow: true, ei: 0.85 });

  const emblem = group(marquee, 0, postH + 0.85, 0);
  torus(emblem, 0.4, 0.03, 0, 0, 0, CITY.accent, { emissive: CITY.accent, ei: 2, rough: 0.4, cast: false, seg: 8, seg2: 40 });
  const ring2 = torus(emblem, 0.28, 0.02, 0, 0, 0, CITY.violet, { emissive: CITY.violet, ei: 1.8, rough: 0.4, cast: false, seg: 6, seg2: 32 });
  ring2.rotation.x = Math.PI / 2.4;
  ball(emblem, 0.09, 0, 0, 0, 0xeaf6fb, { emissive: 0xeaf6fb, ei: 2.4, rough: 0.3 });
  const beam = new THREE.PointLight(CITY.accent, 2.2, 9, 2);
  beam.position.set(0, postH - 0.4, 0.4);
  marquee.add(beam);

  return { sign, emblem, ring2, trim };
}

// The stage is everything that is *not* the training station.
//
// In AR the learner's own room is the environment, so the stage is almost
// nothing: passthrough behind, and a faint floor grid to anchor the station.
// In VR and on a flat screen there is no real room to stand in, so the same
// station is dropped into a digital-twin plaza with a city skyline around it.

const STAGE_MODES = ["ar", "vr", "flat"];

function buildStage(root, mode, scene) {
  const g = group(root);
  const ar = mode === "ar";

  if (ar) {
    // Passthrough: no sky, no ground, nothing that would paint over the room.
    scene.background = null;
    scene.fog = null;
    // A low-contrast grid disc so the station still feels placed on the floor.
    for (let ring = 1; ring <= 3; ring++) {
      torus(g, ring * 0.9, 0.004, 0, 0.004, 0, CITY.accent,
        { emissive: CITY.accent, ei: 0.5, rough: 0.4, cast: false, seg: 6, seg2: 48 });
    }
    for (let i = 0; i < 12; i++) {
      const a = (i / 12) * Math.PI * 2;
      const spoke = box(g, 0.004, 0.004, 2.7, Math.sin(a) * 1.35, 0.004, Math.cos(a) * 1.35,
        CITY.accent, { emissive: CITY.accent, ei: 0.35, rough: 0.4, cast: false });
      spoke.rotation.y = a;
    }
    root.add(new THREE.HemisphereLight(0xdfeaf2, 0x6a7480, 1.5));
    const key = new THREE.DirectionalLight(0xffffff, 0.7);
    key.position.set(2.5, 5, 3);
    root.add(key);
    return { root: g, ar, animate() {} };
  }

  scene.background = new THREE.Color(0x070c12);
  scene.fog = new THREE.Fog(0x070c12, 20, 62);

  // Plaza deck.
  const deck = cyl(g, 15, 15, 0.3, 0, -0.15, 0, 0x151b22, { rough: 0.55, metal: 0.2, seg: 56 });
  deck.receiveShadow = true;
  for (let i = -7; i <= 7; i++) {
    box(g, 30, 0.004, 0.014, 0, 0.004, i * 2, 0x223140, { cast: false, receive: false });
    box(g, 0.014, 0.004, 30, i * 2, 0.004, 0, 0x223140, { cast: false, receive: false });
  }
  torus(g, 12.4, 0.05, 0, 0.02, 0, CITY.accent,
    { emissive: CITY.accent, ei: 1.5, rough: 0.4, cast: false, seg: 6, seg2: 64 });

  // Perimeter light masts.
  for (let i = 0; i < 8; i++) {
    const a = (i / 8) * Math.PI * 2 + Math.PI / 8;
    const mx = Math.sin(a) * 11.5, mz = Math.cos(a) * 11.5;
    cyl(g, 0.055, 0.075, 5.2, mx, 2.6, mz, 0x2b333c, { rough: 0.5, metal: 0.6, seg: 12 });
    const head = box(g, 0.5, 0.09, 0.26, mx, 5.2, mz, 0x2b333c, { rough: 0.5, metal: 0.6 });
    head.rotation.y = a;
    const lamp = box(g, 0.42, 0.03, 0.2, mx, 5.14, mz, 0xdfeaf2,
      { emissive: 0xdfeaf2, ei: 1.8, rough: 0.4, cast: false });
    lamp.rotation.y = a;
    const light = new THREE.PointLight(0xdfeaf2, 1.6, 16, 2);
    light.position.set(mx * 0.82, 4.6, mz * 0.82);
    g.add(light);
  }

  const sky = skyline(g);
  const marquee = buildMarquee(g);

  const key = new THREE.DirectionalLight(0xbcd4e8, 0.55);
  key.position.set(4, 9, 5);
  key.castShadow = true;
  key.shadow.mapSize.set(1024, 1024);
  key.shadow.camera.left = -8; key.shadow.camera.right = 8;
  key.shadow.camera.top = 8; key.shadow.camera.bottom = -8;
  g.add(key);
  g.add(new THREE.HemisphereLight(0x6d8296, 0x121820, 1.15));

  const beacons = sky.userData.beacons ?? [];
  return {
    root: g, ar,
    animate(t) {
      // Cheap flagship motion: rotate the holo-emblem, pulse its inner ring and the
      // marquee trim, and blink a handful of rooftop beacons — property tweaks on
      // already-built meshes/materials, nothing allocated per frame.
      marquee.emblem.rotation.y = t * 0.5;
      marquee.ring2.rotation.z = t * 0.8;
      marquee.trim.material.emissiveIntensity = 1.4 + Math.sin(t * 1.6) * 0.3;
      for (const beacon of beacons) {
        beacon.material.emissiveIntensity = 1.1 + Math.max(0, Math.sin(t * 1.4 + beacon.userData.phase)) * 1.4;
      }
    },
  };
}

  build(root) {
    const hits = {};
    const g = group(root);
    stationPad(g, 1.95, 0x59c97b);

    // ------------------------------------------------------------- the charger
    const charger = group(g, -0.55, 0, -0.85, 0.28);
    slab(charger, 0.82, 1.95, 0.52, 0, 0.98, 0, 0x27313a, { radius: 0.05, rough: 0.42, metal: 0.45 });

    decal(door, 0.3, 0.2, 0.4, 0.4, 0.017,

    const bay = group(charger, 0, 1.0, 0.14);
    box(bay, 0.72, 1.44, 0.05, 0, 0, -0.12, 0x11161b, { rough: 0.9 });
    const modules = [];
    for (let i = 0; i < 4; i++) {
      const m = group(bay, 0, 0.5 - i * 0.32, 0);
      box(m, 0.66, 0.27, 0.3, 0, 0, -0.02, i === 1 ? 0x4a2b2b : 0x232b32, { rough: 0.5, metal: 0.4 });
      for (let v = 0; v < 5; v++) box(m, 0.02, 0.19, 0.01, -0.24 + v * 0.06, 0, 0.13, 0x11161b, { rough: 0.7 });
      ball(m, 0.011, 0.26, 0.09, 0.14, i === 1 ? CITY.alert : CITY.good,
        { emissive: i === 1 ? CITY.alert : CITY.good, ei: 2.4 });
      decal(m, 0.16, 0.05, 0.02, -0.09, 0.14, signFace(`PM-${i + 1}`, { scale: 0.6, accent: "#59c97b" }));

    reg(hits, modules[1], "power-module");

    // DC link busbar behind a clear guard — reachable, which is the point.

    for (const sx of [-1, 1]) {

    box(link, 0.4, 0.03, 0.02, 0, 0.08, -0.04, 0xb87333, { rough: 0.3, metal: 0.95 });
    const guard = box(link, 0.46, 0.26, 0.01, 0, 0, 0.06, 0xbfe4f2,
      { rough: 0.1, opacity: 0.28, metal: 0.1 });
    decal(link, 0.2, 0.05, 0, 0.16, 0.062, signFace("DC LINK", { bg: "#2a1416", accent: "#f0645b", scale: 0.6 }));
    reg(hits, link, "dc-busbar");

    // Interlock jumper hanging on the door frame — the shortcut.

    // ---------------------------------------------------------- the vehicle side
    const vehicle = group(g, 1.35, 0, -0.5, -0.3);
    slab(vehicle, 1.1, 0.5, 2.0, 0, 0.62, 0, 0x33424f, { radius: 0.14, rough: 0.35, metal: 0.5 });
    slab(vehicle, 0.95, 0.34, 1.15, 0, 0.98, -0.1, 0x1b232b, { radius: 0.12, rough: 0.2, metal: 0.3, opacity: 0.85 });
    for (const sx of [-1, 1]) for (const sz of [-1, 1]) {
      const wheel = cyl(vehicle, 0.28, 0.28, 0.17, sx * 0.52, 0.28, sz * 0.66, 0x14171a, { rough: 0.9, seg: 18 });
      wheel.rotation.z = Math.PI / 2;
      const rim = cyl(vehicle, 0.16, 0.16, 0.18, sx * 0.52, 0.28, sz * 0.66, 0x99a3ab, { rough: 0.35, metal: 0.8, seg: 14 });

    const inlet = group(vehicle, -0.56, 0.72, 0.5);

    slab(connector, 0.16, 0.13, 0.13, 0, 0, 0, 0x22272c, { radius: 0.03, rough: 0.5 });
    cyl(connector, 0.055, 0.055, 0.06, 0.08, 0, 0, 0x2b3138, { rough: 0.5, seg: 14 }).rotation.z = Math.PI / 2;

    torus(spare, 0.19, 0.024, 0, 0.07, 0.01, 0x14171a, { rough: 0.85, seg: 8, seg2: 26 })

    box(spare, 0.05, 0.02, 0.03, 0.19, 0.08, 0.02, 0xb87333, { rough: 0.35, metal: 0.9 });   // exposed screen

    box(discBody, 0.16, 0.2, 0.05, 0, 0, 0, 0x22272c, { rough: 0.45, metal: 0.6 });

    hasp.rotation.y = Math.PI / 2;
    reg(hits, handlePivot, "ac-disconnect");
    const appliedLock = lockTag(discBody, -0.07, -0.07, 0.06);

    const lockBoard = group(g, -1.75, 0, -0.55, 1.1);
    box(lockBoard, 0.42, 0.34, 0.04, 0, 1.15, 0, 0xd8232a, { rough: 0.6 });

    // ------------------------------------------------------------- technician kit
    const chest = toolChest(g, 1.45, 1.15, { ry: -0.6 });
    const ppe = group(chest, 0, 0.76, 0);
    slab(ppe, 0.4, 0.1, 0.28, 0, 0.05, 0, 0x1f2830, { radius: 0.02, rough: 0.5 });

    }
    const shield = ball(ppe, 0.09, 0, 0.14, -0.12, 0xffb26b, { rough: 0.12, opacity: 0.5, side: 2 });
    shield.scale.set(1, 0.8, 0.55);
    holoTag(ppe, "Class 0 kit", 0, 0.4, 0, { css: "#59c97b", w: 0.26 });
    reg(hits, ppe, "ppe-case");

    const meter = instrument(chest, -0.1, 0.79, 0.06, { ry: 0.4, idle: "0.0 V" });

    const wrench = group(chest, 0.16, 0.79, -0.06, -0.5);

    const wrenchScale = decal(wrench, 0.03, 0.12, 0.019, 0.005, 0.06,
      signFace("22", { bg: "#1b2026", accent: "#59c97b", scale: 0.7 }), { px: 128 });
    wrenchScale.rotation.y = Math.PI / 2;
    holoTag(wrench, "Torque wrench", 0, 0.14, 0, { css: "#59c97b", w: 0.3 });
    reg(hits, wrench, "torque-wrench");

    // --------------------------------------------------------- work zone hardware
    reg(hits, cone(g, -0.2, 1.5), "cone-a");
    reg(hits, cone(g, 1.9, 0.45), "cone-b");
    reg(hits, barrierPanel(g, 0.7, 1.75, { ry: 0.1 }), "barrier-rail");

    // ------------------------------------------------------------- holo paperwork
    const order = holoPanel(g, 0.56, 0.4, -1.6, 1.5, -1.35, (ctx, w, h) => {
      ctx.fillStyle = "rgba(6,16,22,0.9)"; ctx.fillRect(0, 0, w, h);
      ctx.fillStyle = "#59c97b"; ctx.fillRect(0, 0, w, 5);
      ctx.fillStyle = "#8fb3c4";
      ctx.font = `600 ${Math.round(h * 0.09)}px 'Barlow Condensed', Arial, sans-serif`;
      ctx.textAlign = "left"; ctx.textBaseline = "middle";
      ctx.fillText("WORK ORDER  WO-4471", w * 0.06, h * 0.14);
      ctx.fillStyle = "#eaf6fb";
      ctx.font = `600 ${Math.round(h * 0.16)}px 'Barlow Condensed', Arial, sans-serif`;
      ctx.fillText("FAULT 0x2E — PM-2 OVERTEMP", w * 0.06, h * 0.32);
      ctx.font = `${Math.round(h * 0.085)}px Arial, sans-serif`;
      ctx.fillStyle = "#a9c6d6";
      ["Unit: Bay 04 · 350 kW dual CCS", "Isolation: feeder 12 disconnect",
       "DC link bleed: 10 min stated", "Busbar torque: 22 N·m",

    reg(hits, order, "work-order");
