<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SmartCiti.X ~VR Simulators (Powered by AGI Corp &amp; Visko)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600;700&display=swap">
<style>
  /* ------------------------------------------------------------ tokens
     One surface/colour/radius/elevation system for every piece of 2D chrome.
     The 3D scene owns its own palette (citykit.js CITY); these mirror it. */
  :root{
    --void:#050a10; --panel:#0b141d; --panel-2:#101b27; --raised:#142130; --raised-2:#192a3b;
    --glass:rgba(10,19,28,.82);
    --text:#edf6fb; --muted:#93b2c3; --dim:#6f8ea2;
    --accent:#4fd1ff; --accent-2:#7ee6ff; --accent-ink:#03202b; --violet:#a079ff;
    --warn:#f2c14b; --danger:#f0645b; --good:#59c97b;
    --edge:rgba(126,170,200,.16); --edge-strong:rgba(126,170,200,.32);
    --r-sm:6px; --r-md:10px; --r-lg:14px;
    --shadow-1:0 6px 18px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.04);
    --shadow-2:0 24px 60px rgba(0,0,0,.55), 0 2px 0 rgba(255,255,255,.03) inset;
    --ring:0 0 0 3px rgba(79,209,255,.22);
    --sans:"Barlow", system-ui, sans-serif; --cond:"Barlow Condensed", "Barlow", system-ui, sans-serif;
    --surface-chip:linear-gradient(180deg, rgba(22,36,52,.92), rgba(10,19,28,.86));
    --surface-card:linear-gradient(180deg, var(--panel-2), var(--panel));
    --surface-raised:linear-gradient(180deg, var(--raised-2), var(--raised));
  }
  *{box-sizing:border-box}
  [hidden]{display:none !important}
  html,body{height:100%;margin:0;overscroll-behavior:none}
  body{ background:var(--void); color:var(--text); font-family:var(--sans); overflow:hidden;
    -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility; }
  ::selection{ background:rgba(79,209,255,.35); color:#fff }
  #stage{position:fixed;inset:0}
  #stage canvas{display:block;touch-action:none}

  /* -------------------------------------------------------------- HUD */
  .chip{ position:fixed; background:var(--surface-chip); border:1px solid var(--edge); border-radius:var(--r-md);
         padding:10px 15px; pointer-events:none; backdrop-filter:blur(12px) saturate(1.25);
         -webkit-backdrop-filter:blur(12px) saturate(1.25); box-shadow:var(--shadow-1); }
  .eyebrow{ font-family:var(--cond); font-weight:600; font-size:11px; letter-spacing:.16em;
            text-transform:uppercase; color:var(--muted); }
  .brandline{ font-family:var(--cond); font-weight:600; font-size:10.5px; letter-spacing:.2em;
              text-transform:uppercase; color:var(--accent); opacity:.9; margin:0 0 4px; }
  #hud-mission{ top:14px; left:14px; max-width:min(52vw,440px); border-left:3px solid var(--accent); }
  #hud-room{ font-family:var(--cond); font-weight:600; font-size:19px; letter-spacing:.04em; text-transform:uppercase; line-height:1.15; }
  #hud-metrics{ top:14px; right:14px; text-align:right; min-width:156px; }
  #hud-score{ font-family:var(--cond); font-weight:700; font-size:28px; letter-spacing:.04em; line-height:1;
    font-variant-numeric:tabular-nums; margin-top:2px; }
  #hud-combo{ font-family:var(--cond); font-weight:600; font-size:12.5px; letter-spacing:.1em; color:var(--accent);
    margin-top:3px; transition:color .15s, transform .15s; }

  /* Interruption alarm: something is happening to the learner right now and
     they have to break off and deal with it. Deliberately loud, deliberately
     not where the step cue is, and it carries its own clock. */
  .prog-attention{ margin:8px 0 0; font-size:13px; line-height:1.45; color:#ffd2cc;
    background:rgba(240,100,91,.10); border-left:3px solid var(--danger);
    padding:7px 10px; border-radius:0 6px 6px 0; }
  .prog-attention b{ color:var(--danger); }
  #alarm{ position:fixed; left:50%; top:96px; transform:translateX(-50%);
    width:min(560px,92vw); z-index:60; pointer-events:none;
    background:linear-gradient(180deg,rgba(60,14,10,.97),rgba(34,10,8,.97));
    border:2px solid var(--danger); border-radius:14px; padding:14px 18px 12px;
    box-shadow:0 18px 48px rgba(0,0,0,.55), 0 0 0 4px rgba(240,100,91,.14);
    animation:alarmIn .18s ease-out; }
  #alarm[hidden]{ display:none; }
  #alarm .alarm-head{ display:flex; align-items:baseline; gap:10px;
    font:700 13px/1 "Barlow Condensed",system-ui,sans-serif; letter-spacing:.14em;
    text-transform:uppercase; color:var(--danger); }
  #alarm .alarm-left{ margin-left:auto; font-variant-numeric:tabular-nums; color:#ffd9d4; }
  #alarm .alarm-body{ margin-top:7px; font-size:15px; line-height:1.4; color:#ffeae7; }
  #alarm .alarm-cue{ margin-top:6px; font-size:13px; color:#ffbdb5; }
  #alarm .alarm-bar{ margin-top:10px; height:5px; border-radius:3px;
    background:rgba(255,255,255,.14); overflow:hidden; }
  #alarm .alarm-fill{ height:100%; width:100%; background:var(--danger);
    transition:width .12s linear; }
  @keyframes alarmIn{ from{ opacity:0; transform:translateX(-50%) translateY(-8px) } to{ opacity:1 } }
  @media (prefers-reduced-motion:reduce){ #alarm{ animation:none } }
  #hud-combo.hot{ color:var(--warn); }
  #hud-combo.fire{ color:var(--danger); animation:pulse .5s ease-in-out infinite; }
  @keyframes pulse{ 0%,100%{ transform:scale(1); } 50%{ transform:scale(1.08); } }
  .score-pop{ position:absolute; right:6px; top:36px; font-family:var(--cond); font-weight:700;
    font-size:15px; color:var(--good); pointer-events:none; animation:popUp .9s ease-out forwards;
    text-shadow:0 0 12px rgba(89,201,123,.5); }
  .score-pop.big{ font-size:20px; color:var(--warn); text-shadow:0 0 14px rgba(242,193,75,.55); }
  @keyframes popUp{ 0%{ opacity:0; transform:translateY(0); } 15%{ opacity:1; }
    100%{ opacity:0; transform:translateY(-30px); } }
  .rank-up{ font-family:var(--cond); font-weight:700; font-size:15px; letter-spacing:.12em;
    text-transform:uppercase; color:var(--warn); text-align:center;
    background:linear-gradient(180deg, rgba(242,193,75,.18), rgba(242,193,75,.08));
    border:1px solid rgba(242,193,75,.7); border-radius:var(--r-sm);
    padding:9px 12px; margin:0 0 10px; animation:rankGlow 1.1s ease-in-out infinite; }
  @keyframes rankGlow{ 0%,100%{ box-shadow:0 0 0 rgba(242,193,75,0); } 50%{ box-shadow:0 0 22px rgba(242,193,75,.45); } }
  @media (prefers-reduced-motion:reduce){
    #hud-combo.fire{ animation:none; } .rank-up{ animation:none; }
  }

  #hud-objective{ position:fixed; left:50%; transform:translateX(-50%); top:14px;
    background:var(--surface-chip); border:1px solid var(--edge); border-top:3px solid var(--accent);
    border-radius:var(--r-md); padding:10px 20px 11px; text-align:center; pointer-events:none;
    max-width:min(58vw,560px); backdrop-filter:blur(12px) saturate(1.25); -webkit-backdrop-filter:blur(12px) saturate(1.25);
    box-shadow:var(--shadow-1); }
  #hud-step{ font-family:var(--cond); font-weight:600; font-size:18px; letter-spacing:.03em; line-height:1.15; }
  #hud-cue{ font-size:13px; color:var(--muted); line-height:1.45; margin-top:3px; }
  #hud-gesture{ display:inline-block; margin-top:7px; font-family:var(--cond); font-weight:600;
    font-size:10.5px; letter-spacing:.12em; color:var(--accent); border:1px solid rgba(79,209,255,.55);
    background:rgba(79,209,255,.08); border-radius:999px; padding:3px 10px; text-transform:uppercase; }
  #gesture-tip{ position:fixed; left:50%; bottom:98px; transform:translateX(-50%) translateY(6px);
    max-width:min(520px, calc(100vw - 28px)); background:var(--surface-chip); border:1px solid rgba(79,209,255,.55);
    border-radius:var(--r-md); padding:11px 18px; text-align:center; font-size:13px; color:var(--text);
    line-height:1.45; pointer-events:none; opacity:0; transition:opacity .25s ease, transform .25s ease;
    z-index:12; backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px); box-shadow:var(--shadow-1); }
  #gesture-tip.show{ opacity:1; transform:translateX(-50%) translateY(0); }
  #gesture-tip b{ color:var(--accent); }
  @media (prefers-reduced-motion:reduce){ #gesture-tip{ transition:opacity .25s ease } }

  #hud-rail{ position:fixed; left:50%; transform:translateX(-50%); bottom:14px;
    width:min(780px, calc(100vw - 28px)); background:var(--surface-chip);
    border:1px solid var(--edge); border-left:3px solid var(--edge);
    border-radius:var(--r-md); padding:12px 18px; pointer-events:none;
    backdrop-filter:blur(12px) saturate(1.25); -webkit-backdrop-filter:blur(12px) saturate(1.25);
    box-shadow:var(--shadow-1); transition:border-left-color .2s; }
  #hud-rail[data-state="ok"]{ border-left-color:var(--good) }
  #hud-rail[data-state="warn"]{ border-left-color:var(--warn) }
  #hud-rail[data-state="danger"]{ border-left-color:var(--danger) }
  #hud-rail[data-state="neutral"]{ border-left-color:var(--accent) }
  #hud-feedback{ font-size:14px; line-height:1.5 }
  #hud-feedback b{ font-weight:600 }
  #hud-feedback .mult{ color:var(--accent); font-family:var(--cond) }
  #hud-progress{ display:flex; align-items:center; gap:14px; margin-top:10px }
  #hud-track{ flex:1; height:6px; background:rgba(0,0,0,.45); border-radius:999px; overflow:hidden;
    box-shadow:inset 0 1px 2px rgba(0,0,0,.5) }
  #hud-fill{ height:100%; width:0; border-radius:999px;
    background:linear-gradient(90deg, var(--accent), var(--accent-2)); box-shadow:0 0 10px rgba(79,209,255,.45);
    transition:width .2s ease-out }
  #hud-count,#hud-timer{ font-family:var(--cond); font-weight:600; font-size:11.5px; letter-spacing:.1em;
    color:var(--muted); white-space:nowrap; font-variant-numeric:tabular-nums; }
  #hud-hint{ position:fixed; left:14px; bottom:14px; font-family:var(--cond); font-size:11.5px; font-weight:500;
    letter-spacing:.1em; color:var(--dim); pointer-events:none; text-transform:uppercase; }

  #voice-btn{ position:fixed; right:14px; bottom:14px; z-index:11; padding:9px 16px; font-size:12px; }
  #voice-btn.listening{ background:var(--danger); border-color:var(--danger); color:#2a0c0c;
    animation:voicePulse 1s ease-in-out infinite; }
  @keyframes voicePulse{ 0%,100%{ transform:scale(1); } 50%{ transform:scale(1.06); } }
  #voice-heard{ position:fixed; right:14px; bottom:58px; z-index:11; max-width:min(320px, calc(100vw - 28px));
    background:var(--surface-chip); border:1px solid rgba(79,209,255,.55); border-radius:var(--r-md); padding:8px 12px;
    font-size:12.5px; color:var(--text); pointer-events:none; text-align:right; box-shadow:var(--shadow-1); }
  #voice-heard.error{ border-color:var(--danger); color:var(--danger); }
  @media (prefers-reduced-motion:reduce){ #voice-btn.listening{ animation:none } }

  #speak-btn{ position:fixed; right:14px; bottom:60px; z-index:11; display:flex; align-items:center;
    justify-content:center; width:40px; height:40px; border-radius:50%; font-size:16px; padding:0; }

  #ar-prompt{ position:fixed; left:50%; top:50%; transform:translate(-50%,-50%);
    background:var(--surface-chip); border:1px solid rgba(79,209,255,.55); border-radius:var(--r-md);
    padding:14px 20px; text-align:center; pointer-events:none; box-shadow:var(--shadow-1); }
  #ar-prompt b{ font-family:var(--cond); font-size:16px; letter-spacing:.03em; text-transform:uppercase; }
  #scale-row{ position:fixed; bottom:70px; left:50%; transform:translateX(-50%);
    display:flex; gap:8px; }
  #scale-row button{ pointer-events:auto; padding:12px 18px; font-size:16px; min-width:56px; }

  /* ---------------------------------------------------------- overlays */
  .overlay{ position:fixed; inset:0; z-index:20; display:flex; align-items:center; justify-content:center;
    background:radial-gradient(1200px 700px at 50% -10%, rgba(79,209,255,.08), transparent 60%), rgba(3,7,11,.86);
    padding:16px; overflow-y:auto; backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px); }
  .card{ width:min(700px,100%); max-height:calc(100vh - 32px); max-height:calc(100dvh - 32px); overflow-y:auto;
    background:var(--surface-card); border:1px solid var(--edge-strong); border-top:3px solid var(--accent);
    border-radius:var(--r-lg); padding:26px 30px 24px; box-shadow:var(--shadow-2);
    scrollbar-width:thin; scrollbar-color:rgba(126,170,200,.28) transparent; }
  .card::-webkit-scrollbar{ width:10px }
  .card::-webkit-scrollbar-thumb{ background:rgba(126,170,200,.28); border-radius:8px; border:2px solid transparent; background-clip:padding-box }
  .card::-webkit-scrollbar-track{ background:transparent }
  .card h1{ font-family:var(--cond); font-weight:700; font-size:clamp(28px,5vw,38px);
    letter-spacing:.02em; text-transform:uppercase; margin:4px 0 8px; line-height:1.05; }
  .card p{ color:var(--muted); font-size:13.5px; line-height:1.6; margin:0 0 10px; max-width:66ch }
  .card p.lead{ color:var(--text); font-size:14.5px }
  .card .eyebrow{ margin-bottom:2px }

  .sim-category{ display:flex; align-items:center; gap:12px; font-family:var(--cond); font-weight:600;
    letter-spacing:.12em; text-transform:uppercase; font-size:12px; color:var(--accent); margin:18px 0 8px }
  .sim-category::after{ content:""; flex:1; height:1px; background:linear-gradient(90deg, var(--edge-strong), transparent) }
  .sim-category:first-of-type{ margin-top:8px }
  .sims{ display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:8px; margin:0 0 4px }
  .sim{ background:var(--surface-raised); border:1px solid var(--edge); border-left:3px solid var(--tint);
    border-radius:8px; padding:10px 12px; box-shadow:inset 0 1px 0 rgba(255,255,255,.03) }
  .sim b{ display:block; font-family:var(--cond); font-weight:600; font-size:14.5px; letter-spacing:.03em; text-transform:uppercase }
  .sim span{ font-size:11.5px; color:var(--muted); line-height:1.35; display:block; margin-top:2px }
  .sim span.sim-cert{ color:var(--text); opacity:.72; font-style:italic; margin-top:4px }

  /* --------------------------------------------------------- controls */
  .btnrow{ display:flex; gap:8px; flex-wrap:wrap; margin:12px 0 14px }
  button{ font-family:var(--cond); font-weight:600; font-size:15px; letter-spacing:.08em;
    text-transform:uppercase; cursor:pointer; border-radius:var(--r-sm); padding:11px 20px; min-height:44px;
    border:1px solid var(--edge-strong); background:var(--surface-raised); color:var(--text); touch-action:manipulation;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.05);
    transition:transform .12s ease, box-shadow .15s ease, border-color .15s ease, filter .15s ease; }
  button:hover{ border-color:rgba(79,209,255,.5); transform:translateY(-1px); box-shadow:0 6px 16px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.06) }
  button:active{ transform:translateY(0); box-shadow:inset 0 2px 4px rgba(0,0,0,.35) }
  /* Primary follows --accent so a station that re-tints the HUD (app.js sets
     --accent per sim) re-tints its buttons too; the plain fallback covers
     browsers without color-mix(). */
  button.primary{ background:var(--accent); border-color:transparent; color:var(--accent-ink);
    box-shadow:0 0 0 1px rgba(255,255,255,.12), 0 8px 22px rgba(0,0,0,.35) }
  @supports (background: color-mix(in srgb, red 50%, white)){
    button.primary{ background:linear-gradient(180deg, color-mix(in srgb, var(--accent) 78%, white), var(--accent));
      box-shadow:0 0 0 1px color-mix(in srgb, var(--accent) 45%, transparent), 0 8px 22px color-mix(in srgb, var(--accent) 28%, transparent) }
    button.primary:hover{ box-shadow:0 0 0 1px color-mix(in srgb, var(--accent) 60%, transparent), 0 10px 26px color-mix(in srgb, var(--accent) 36%, transparent) }
  }
  button.primary:hover{ filter:brightness(1.06) }
  button:focus-visible{ outline:2px solid var(--accent); outline-offset:2px }
  button[disabled]{ opacity:.38; cursor:not-allowed; transform:none; box-shadow:none; filter:none }
  kbd{ background:var(--raised); border:1px solid var(--edge-strong); border-bottom-width:2px; border-radius:4px;
    padding:1px 7px; font-family:var(--cond); font-size:12px; letter-spacing:.06em; }
  .fineprint{ font-size:12px; color:var(--muted); line-height:1.6; margin:0 }
  .fineprint a{ color:var(--accent); text-decoration-color:rgba(79,209,255,.4); text-underline-offset:2px }
  .fineprint a:hover{ text-decoration-color:var(--accent) }
  .namerow{ margin:16px 0 4px }
  .namerow label{ display:block; margin-bottom:6px }
  input, select{ accent-color:var(--accent) }
  .namerow input{ width:200px; background:var(--raised); border:1px solid var(--edge-strong); border-radius:var(--r-sm);
    color:var(--text); font-family:var(--cond); font-weight:600; font-size:16px; letter-spacing:.08em;
    padding:10px 12px; text-transform:uppercase; transition:border-color .15s, box-shadow .15s; }
  .namerow input::placeholder{ color:var(--dim) }
  .namerow input:focus{ outline:none; border-color:var(--accent); box-shadow:var(--ring) }
  .namerow input[readonly]{ opacity:.8; cursor:default; border-style:dashed }
  .identity-note{ margin-top:6px; color:var(--accent) }

  /* ------------------------------------------------------ leaderboards */
  .lb-table{ width:100%; border-collapse:collapse; margin:4px 0 14px; font-size:13.5px }
  .lb-table th{ text-align:left; font-family:var(--cond); font-weight:600; letter-spacing:.1em;
    font-size:11px; color:var(--muted); text-transform:uppercase; padding:5px 8px; border-bottom:1px solid var(--edge-strong) }
  .lb-table td{ padding:7px 8px; border-bottom:1px solid var(--edge); font-variant-numeric:tabular-nums }
  .lb-table tbody tr:nth-child(even) td{ background:rgba(255,255,255,.02) }
  .lb-table tr.me td{ background:rgba(79,209,255,.12) }
  .lb-table tr.me td:first-child{ color:var(--accent); font-weight:700 }
  .lb-empty{ color:var(--muted); font-size:13px; padding:10px 0 }
  .lb-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:10px; max-height:60vh; overflow-y:auto }
  .lb-card{ background:var(--surface-raised); border:1px solid var(--edge); border-left:3px solid var(--tint,var(--accent));
    border-radius:8px; padding:11px 13px }
  .lb-card h3{ margin:0 0 6px; font-family:var(--cond); font-weight:600; font-size:14.5px; letter-spacing:.03em; text-transform:uppercase }
  .lb-card .lb-top{ font-size:12.5px; color:var(--muted) }
  .lb-card .lb-top b{ color:var(--text) }

  /* --------------------------------------------------- training records */
  .card.card-wide{ width:min(960px,100%) }
  .sim em.sim-flat{ font-style:normal; font-family:var(--cond); font-weight:600; font-size:10px; letter-spacing:.12em; text-transform:uppercase;
    color:var(--tint); border:1px solid var(--tint); border-radius:999px; padding:1px 7px; margin-left:8px; vertical-align:middle }
  .prebrief-steps{ margin:8px 0 6px; padding-left:22px; display:grid; gap:8px }
  .prebrief-steps li{ font-size:13.5px; line-height:1.45 }
  .prebrief-steps li b{ display:block; color:var(--text) }
  .prebrief-steps li span{ color:var(--muted) }
  .cred-list{ list-style:none; margin:4px 0 12px; padding:0; display:grid; gap:6px }
  .cred-row{ background:var(--surface-raised); border:1px solid var(--edge); border-left:3px solid var(--good); border-radius:8px; padding:8px 12px; font-size:13px }
  .cred-row b{ display:block } .cred-row span{ color:var(--muted); font-size:12px }
  .flat-overlay{ align-items:flex-start; padding-top:76px }
  .flat-card{ max-height:calc(100vh - 92px); max-height:calc(100dvh - 92px) }
  .flat-cert{ color:var(--accent); font-style:italic }
  .dossier{ background:var(--surface-raised); border:1px solid var(--edge); border-radius:8px; padding:8px 14px; margin:10px 0 14px }
  .dossier summary{ cursor:pointer; font-family:var(--cond); font-weight:600; letter-spacing:.1em; text-transform:uppercase; font-size:12px; color:var(--accent); padding:4px 0 }
  .dossier-section{ border-top:1px solid var(--edge); padding:10px 0 4px }
  .dossier-section h3{ margin:0 0 6px; font-size:15px }
  .dossier-section p{ margin:0 0 6px; font-size:13.5px; line-height:1.5; color:var(--text) }
  .dossier-src{ font-size:12px; color:var(--muted) }
  .dossier-src a{ color:var(--accent) }
  .flat-q h2{ margin:6px 0 4px; font-size:20px; line-height:1.25 }
  .flat-cue{ margin:0 0 10px; color:var(--muted); font-size:13.5px }
  .flat-options{ display:grid; gap:8px; margin:0 0 10px }
  .flat-opt{ text-align:left; white-space:normal; line-height:1.4; padding:10px 14px; font-size:14px; font-weight:500; letter-spacing:0; text-transform:none }
  .flat-opt.picked{ border-color:var(--good); color:var(--good); opacity:.85 }
  .flat-feedback{ border-left:3px solid var(--edge-strong); background:var(--surface-raised); border-radius:0 8px 8px 0; padding:10px 12px; font-size:13.5px; line-height:1.45 }
  .flat-feedback.ok{ border-left-color:var(--good) } .flat-feedback.danger{ border-left-color:var(--danger) }
  .flat-feedback.warn{ border-left-color:var(--warn, #f2ae14) }
  /* Training programmes: one card per block, with a progress bar in the
     programme's own accent and the station list underneath. */
  .prog-list{ display:grid; gap:14px; margin:6px 0 16px }

/* ===== shared/a11y.js ===== */
// Accessibility support shared by every app.
//
// A simulator that can only be operated by looking and clicking is one a
// publicly funded training centre cannot buy, and it excludes learners who
// belong in the trade. This module carries the three things the apps need to
// offer a keyboard path and a spoken one: a live region a screen reader
// reads, a keyboard cursor over the current step's targets, and a
// reduced-motion flag the scene honours.
//
// What it does not do is pretend the headset modes are keyboard-operable.
// A VR session is hand controllers by definition; the accessible path is the
// flat-screen mode, which runs the same procedure, scores it the same way and
// writes the same record. That is stated plainly in ACCESSIBILITY.md rather

/** The learner asked their system for less animation. Read once per call so a
 *  change during a session is picked up on the next frame that asks. */
/**
 * Escape text before it goes into innerHTML.
 *
 * This lived as a private function in SmartCiti.X's app.js while the Trade
 * Skills app called it by the same name and never defined it — so every
 * trades debrief threw ReferenceError the moment it tried to render a step
 * title, and the results screen never appeared. Shared, because the next app
 * to build a debrief will reach for it too.
 */
function escapeHtml(s) {
  return String(s ?? "").replace(/[&<>"']/g, (c) =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

function reducedMotion() {
  try { return !!window.matchMedia?.("(prefers-reduced-motion: reduce)")?.matches; }
  catch (_) { return false; }
}

/**
 * A visually hidden ARIA live region. Everything the app says out loud —
 * the step, the focused control, feedback, the verdict — goes here too, so a
 * screen reader user gets it without the synthesised voice.
 *
 * Polite by default; hazards and other interruptions are assertive.
 */
function createAnnouncer(doc = typeof document !== "undefined" ? document : null) {
  if (!doc?.body) return { say() { return false; }, alert() { return false; }, node: null };

    const n = doc.createElement("div");
    n.setAttribute("role", live === "assertive" ? "alert" : "status");
    n.setAttribute("aria-live", live);
    n.setAttribute("aria-atomic", "true");

    node: polite,

/* ===== shared/hands.js ===== */
/**
 * Hand gesture control for the XR sessions.
 *
 * A gloved trade is the wrong audience for "press the grip button": the whole
 * point of these simulators is that the actions look like the real ones, and

 * written to be driven by a table of coordinates and checked headlessly
 * (tools/check_hands.mjs). What is left unverified is the plumbing — that the
 * runtime hands us joints at all — which is the part a device has to confirm.
 */

const JOINTS = {
  wrist: "wrist",
  thumbTip: "thumb-tip",
  indexTip: "index-finger-tip",
  middleTip: "middle-finger-tip",
  ringTip: "ring-finger-tip",
  pinkyTip: "pinky-finger-tip",
  indexKnuckle: "index-finger-phalanx-proximal",
  middleKnuckle: "middle-finger-phalanx-proximal",
  ringKnuckle: "ring-finger-phalanx-proximal",
  pinkyKnuckle: "pinky-finger-phalanx-proximal",

// Metres. Hand tracking is noisy, so every threshold has a release value

// boundary is worse than one that is slightly slow to let go.
const PINCH_ON = 0.022;
const PINCH_OFF = 0.035;

const CURL_OFF = 0.085;

const dist = (a, b) => (a && b ? Math.hypot(a.x - b.x, a.y - b.y, a.z - b.z) : Infinity);

  const j = (name) => joints?.[name] ?? null;
  const wrist = j(JOINTS.wrist);

  const wasPinch = !!prev?.pinch;

  // tip-to-knuckle rather than tip-to-palm keeps it independent of hand size.
  const fingers = [
    [JOINTS.indexTip, JOINTS.indexKnuckle],
    [JOINTS.middleTip, JOINTS.middleKnuckle],
    [JOINTS.ringTip, JOINTS.ringKnuckle],
    [JOINTS.pinkyTip, JOINTS.pinkyKnuckle],
  ].map(([tip, knuckle]) => dist(j(tip), j(knuckle)));

  if (!known.length) return { pinch: false, grab: false, point: false, open: false, pinchGap, curled: 0, tracked: false };

  const limit = prev?.grab ? CURL_OFF : CURL_ON;
  const curled = fingers.filter((d) => Number.isFinite(d) && d < limit).length;

  // fingers alone cannot: a pointing hand has three folded and so does a fist

  // time somebody indicated something across the bay.
  const indexCurled = Number.isFinite(fingers[0]) && fingers[0] < limit;

  if (!src) return out;

    const joint = src[name];
    if (joint?.position) out[name] = { x: joint.position.x, y: joint.position.y, z: joint.position.z };

 *   onGrabStart(hand)    a fist closed         — sustained hold, for drag and turn
 *   onGrabEnd(hand)
 *   onRoll(hand, delta)  wrist roll while grabbing, in radians — drives turn steps
 *   onPose(hand, pose)   every frame, for the pointer ray and the gesture hint
 *
 * Returns { hands, update(), dispose() }. update() is called from the render
 * loop; everything else is event-driven off three.js's own pinch events where
 * they exist, with the classifier as the fallback and the source of grab.
 */
function createHandInput(renderer, rig, handlers = {}) {
  const THREE = renderer?.xr?.constructor ? null : null;   // three is passed in via meshFactory
  const hands = [];
  const state = [];
  if (!renderer?.xr?.getHand) return { hands, update() {}, dispose() {}, supported: false };

  for (let i = 0; i < 2; i++) {
    const hand = renderer.xr.getHand(i);
    hand.userData.index = i;
    if (handlers.decorate) handlers.decorate(hand, i);
    rig.add(hand);
    hands.push(hand);
    state.push({ pose: null, grabbing: false, lastRoll: null, pinching: false });
  }

  function update() {
    for (let i = 0; i < hands.length; i++) {
      const hand = hands[i];
      const st = state[i];
      const joints = readJoints(hand);
      const pose = classifyHandPose(joints, st.pose);
      st.pose = pose;
      if (!pose.tracked) {
        if (st.grabbing) { st.grabbing = false; handlers.onGrabEnd?.(hand); }
        if (st.pinching) { st.pinching = false; handlers.onSelectEnd?.(hand); }
        continue;
      }
      handlers.onPose?.(hand, pose);

      if (pose.pinch && !st.pinching) { st.pinching = true; handlers.onSelectStart?.(hand); }
      else if (!pose.pinch && st.pinching) { st.pinching = false; handlers.onSelectEnd?.(hand); }

      if (pose.grab && !st.grabbing) {
        st.grabbing = true;
        st.lastRoll = hand.rotation?.z ?? 0;
        handlers.onGrabStart?.(hand);
      } else if (!pose.grab && st.grabbing) {
        st.grabbing = false;
        st.lastRoll = null;
        handlers.onGrabEnd?.(hand);
      } else if (pose.grab && st.grabbing && handlers.onRoll) {
        const roll = hand.rotation?.z ?? 0;
        if (st.lastRoll != null) {
          let d = roll - st.lastRoll;
          // Shortest way round, so passing through ±π does not read as a
          // whole turn of the valve.
          if (d > Math.PI) d -= Math.PI * 2;
          if (d < -Math.PI) d += Math.PI * 2;
          if (Math.abs(d) > 1e-4) handlers.onRoll(hand, d);
        }
        st.lastRoll = roll;
      }
    }
  }

  function dispose() {
    for (const hand of hands) hand.parent?.remove(hand);
    hands.length = 0;
  }

  void THREE;
  return { hands, update, dispose, supported: true, poseOf: (i) => state[i]?.pose ?? null };
}

/** What to tell the learner their hands can do, in the app's own hint rail. */
const HAND_HINTS = {
  pinch: "Pinch thumb and finger to select",
  grab: "Close your hand to grab and hold",
  roll: "Grab and turn your wrist to rotate",
  point: "Point to aim at something further away",
};


/* ===== shared/kit.js ===== */
// Shared procedural asset kit. Every prop in the simulator is built from these
// primitives at real-world scale in metres, so rooms stay consistent and no
// external model files are needed.

const TAU = Math.PI * 2;

// HUD tokens from DESIGN.md, reused so the web build reads like the headset build.
const HUD = {
  void: "#071018", panel: "#101C27", raised: "#172735", text: "#F4F8FB",
  muted: "#9FB0BF", accent: "#37D6C0", warn: "#F2B84B", danger: "#F0645B",
  edge: "#426174", good: "#59C97B",
};

/**
 * What a step kind physically asks the learner's hands to do, in one short
 * verb for the HUD and one sentence for a first-time explainer. A room's own
 * `cue` text always says *what* to touch; this says *how* to touch it — the
 * part a new interaction (like turning a valve by dragging it) can't be
 * assumed to be obvious just from staring at the 3D object.
 */
const GESTURE_HINTS = {
  select: { verb: "CLICK", tip: "Click the highlighted control to select it." },
  sequence: { verb: "CLICK IN ORDER", tip: "Click each highlighted item, in the order the procedure calls for." },
  find: { verb: "SEARCH & CLICK", tip: "Look around and click whatever you find wrong — some objects are decoys." },
  gauge: { verb: "WATCH & CLICK", tip: "Watch the marker sweep the band, then click to commit while it's centred." },
  hold: { verb: "PRESS & HOLD", tip: "Press and hold the highlighted control for the full duration — releasing early breaks it." },
  track: { verb: "HOLD TO CORRECT", tip: "Hold to raise the value, release to let it fall, and keep it inside the band." },
  turn: { verb: "CLICK & DRAG TO TURN", tip: "Click the control and drag in a circle around it, like turning a real wheel or handle." },
  drag: { verb: "CLICK & DRAG TO CARRY", tip: "Click and hold the object, drag it to the marker, then let go." },
};

const materialCache = new Map();

// ---------------------------------------------------------------- surfaces
//
// Every surface in the network used to be one flat colour, which is what made
// the scenes read as diagrams rather than places: real concrete is blotchy,
// real steel has a grain direction, real rubber scatters light unevenly. These
// build that variation procedurally — a roughness map and a normal map per
// finish, drawn once into a canvas at 256 square and then shared by every
// material that asks for the same finish.
//
// Sharing is the whole point. A map per material would multiply draw calls;
// one map instance per finish means a hundred concrete surfaces still batch
// the way they did before, and the cost is a few hundred kilobytes of texture
// memory rather than anything the frame budget notices.
const surfaceCache = new Map();
// `shade` is how much the finish darkens and lightens the base colour. It is
// the one that actually reads: roughness and normal variation change how a
// surface catches a moving light, but a still frame of flat-coloured concrete
// still looks like flat-coloured concrete until the colour itself varies.
const FINISHES = {
  // grain: 0 = isotropic speckle, 1 = horizontal brushing, -1 = vertical
  concrete:   { speckle: 0.34, cell: 3.2, grain: 0, bump: 1.4, shade: 0.26, rough: [0.70, 0.98] },
  asphalt:    { speckle: 0.46, cell: 2.1, grain: 0, bump: 1.8, shade: 0.30, rough: [0.80, 1.0] },
  brushed:    { speckle: 0.16, cell: 1.0, grain: 1, bump: 0.7, shade: 0.12, rough: [0.20, 0.46] },
  painted:    { speckle: 0.14, cell: 5.0, grain: 0, bump: 0.5, shade: 0.10, rough: [0.40, 0.64] },
  galvanised: { speckle: 0.30, cell: 1.6, grain: 0, bump: 1.0, shade: 0.20, rough: [0.32, 0.68] },
  rubber:     { speckle: 0.24, cell: 2.6, grain: 0, bump: 1.2, shade: 0.16, rough: [0.86, 1.0] },
  rust:       { speckle: 0.50, cell: 2.4, grain: 0, bump: 1.9, shade: 0.38, rough: [0.72, 1.0] },
  grating:    { speckle: 0.20, cell: 1.2, grain: -1, bump: 1.5, shade: 0.18, rough: [0.52, 0.88] },
};

function noiseCanvas(px, draw) {
  const c = document.createElement("canvas");
  c.width = px; c.height = px;
  const g = c.getContext("2d");
  draw(g, px);
  return c;
}

/**
 * The shared map set for one finish. Returns null when there is no canvas to
 * draw on — the headless checkers run without one, and a station has to build
 * there exactly as it does in a browser.
 */
function surface(name) {
  const f = FINISHES[name];
  if (!f) return null;
  if (surfaceCache.has(name)) return surfaceCache.get(name);
  let set = null;
  try {
    const PX = 256;
    // Value noise at two scales: broad blotches, then fine tooth.
    const field = new Float32Array(PX * PX);
    const lattice = (n) => {
      const g = new Float32Array((n + 1) * (n + 1));
      for (let i = 0; i < g.length; i++) g[i] = Math.random();
      return (u, v) => {
        const x = u * n, y = v * n;
        const x0 = Math.floor(x), y0 = Math.floor(y);
        const fx = x - x0, fy = y - y0;
        const sx = fx * fx * (3 - 2 * fx), sy = fy * fy * (3 - 2 * fy);
        const at = (i, j) => g[(j % (n + 1)) * (n + 1) + (i % (n + 1))];
        return (at(x0, y0) * (1 - sx) + at(x0 + 1, y0) * sx) * (1 - sy) +
               (at(x0, y0 + 1) * (1 - sx) + at(x0 + 1, y0 + 1) * sx) * sy;
      };
    };
    const broad = lattice(Math.max(2, Math.round(8 / f.cell)));
    const fine = lattice(Math.max(4, Math.round(48 / f.cell)));
    for (let y = 0; y < PX; y++) {
      for (let x = 0; x < PX; x++) {
        // Brushing stretches the sample along one axis, which is what gives
        // steel its direction under a moving light.
        const u = f.grain === 1 ? x / PX / 6 : x / PX;
        const v = f.grain === -1 ? y / PX / 6 : y / PX;
        field[y * PX + x] = broad(u, v) * 0.6 + fine(u, v) * 0.4;
      }
    }
    const [r0, r1] = f.rough;
    const roughCanvas = noiseCanvas(PX, (g) => {
      const img = g.createImageData(PX, PX);
      for (let i = 0; i < PX * PX; i++) {
        const n = (field[i] - 0.5) * f.speckle * 2;
        const r = Math.max(0, Math.min(1, (r0 + r1) / 2 + n * (r1 - r0)));
        const v = Math.round(r * 255);
        img.data[i * 4] = v; img.data[i * 4 + 1] = v; img.data[i * 4 + 2] = v; img.data[i * 4 + 3] = 255;
      }
      g.putImageData(img, 0, 0);
    });
    // Normals from the height field's own slope, so the bumps line up with the
    // roughness rather than being an unrelated pattern laid over it.
    const normCanvas = noiseCanvas(PX, (g) => {
      const img = g.createImageData(PX, PX);
      const at = (x, y) => field[((y + PX) % PX) * PX + ((x + PX) % PX)];
      for (let y = 0; y < PX; y++) {
        for (let x = 0; x < PX; x++) {
          const dx = (at(x + 1, y) - at(x - 1, y)) * f.bump * 4;
          const dy = (at(x, y + 1) - at(x, y - 1)) * f.bump * 4;
          const len = Math.hypot(dx, dy, 1);
          const i = (y * PX + x) * 4;
          img.data[i] = Math.round((-dx / len * 0.5 + 0.5) * 255);
          img.data[i + 1] = Math.round((-dy / len * 0.5 + 0.5) * 255);
          img.data[i + 2] = Math.round((1 / len * 0.5 + 0.5) * 255);
          img.data[i + 3] = 255;
        }
      }
      g.putImageData(img, 0, 0);
    });
    // Greyscale blotching that multiplies the material's own colour, so one
    // map serves every colour a finish is ever used in.
    const shadeCanvas = noiseCanvas(PX, (g) => {
      const img = g.createImageData(PX, PX);
      for (let i = 0; i < PX * PX; i++) {
        const v = Math.round(Math.max(0, Math.min(1, 1 - f.shade / 2 + (field[i] - 0.5) * f.shade)) * 255);
        img.data[i * 4] = v; img.data[i * 4 + 1] = v; img.data[i * 4 + 2] = v; img.data[i * 4 + 3] = 255;
      }
      g.putImageData(img, 0, 0);
    });
    const wrap = (c) => {
      const t = new THREE.CanvasTexture(c);
      t.wrapS = THREE.RepeatWrapping; t.wrapT = THREE.RepeatWrapping;
      t.anisotropy = 4;
      return t;
    };
    const shadeMap = wrap(shadeCanvas);
    shadeMap.colorSpace = THREE.SRGBColorSpace ?? shadeMap.colorSpace;
    set = { map: shadeMap, roughnessMap: wrap(roughCanvas), normalMap: wrap(normCanvas), bump: f.bump };
  } catch (e) {
    set = null;                       // headless: no canvas, so no maps
  }
  surfaceCache.set(name, set);
  return set;
}

function mat(color, o = {}) {
  const key = [color, o.rough ?? 0.8, o.metal ?? 0, o.emissive ?? 0, o.ei ?? 1,
    o.opacity ?? 1, o.flat ? 1 : 0, o.side ?? 0, o.finish ?? "", String(o.tile ?? 1)].join("|");
  let m = materialCache.get(key);
  if (!m) {
    const skin = o.finish ? surface(o.finish) : null;
    m = new THREE.MeshStandardMaterial({
      color,
      roughness: o.rough ?? 0.8,
      metalness: o.metal ?? 0,
      emissive: o.emissive ?? 0x000000,
      emissiveIntensity: o.ei ?? 1,
      transparent: (o.opacity ?? 1) < 1,
      opacity: o.opacity ?? 1,
      flatShading: !!o.flat,
      side: o.side === 2 ? THREE.DoubleSide : THREE.FrontSide,
      ...(skin ? { map: skin.map, roughnessMap: skin.roughnessMap, normalMap: skin.normalMap } : {}),
    });
    // `tile` may be a number or a [u, v] pair. The pair matters: a kerb is
    // twelve metres long and half a metre tall, and tiling it equally on both
    // axes squashes the grain into horizontal stripes that read as a defect
    // rather than as concrete.
    const tu = Array.isArray(o.tile) ? o.tile[0] : (o.tile ?? 1);
    const tv = Array.isArray(o.tile) ? o.tile[1] : (o.tile ?? 1);
    if (skin && (tu !== 1 || tv !== 1)) {
      // A tiled material needs its own texture objects, since repeat lives on
      // the texture rather than the material. Still one set per (finish, tile)
      // rather than one set per surface in the scene.
      const rm = skin.roughnessMap.clone(), nm = skin.normalMap.clone(), am = skin.map.clone();
      rm.needsUpdate = nm.needsUpdate = am.needsUpdate = true;
      for (const t of [rm, nm, am]) t.repeat.set(tu, tv);
      m.roughnessMap = rm; m.normalMap = nm; m.map = am;
    }
    if (skin) {
      const b = (o.bump ?? 1) * (skin.bump ?? 1);
      m.normalScale = new THREE.Vector2(b, b);
    }
    materialCache.set(key, m);
  }
  return m;
}

// A geometry-constructor passthrough — every call site below wraps its own
// `new THREE.XGeometry(...)` in this. It used to also add the geometry to a
// module-level Set for later disposal, but disposeTree() below never
// actually read that Set (it disposes by traversing the live scene graph
// instead) — pure dead bookkeeping, removed.
function track(geometry) { return geometry; }

/**
 * Give a mesh a material of its own.
 *
 * mat() returns a SHARED cached material keyed on its parameters, which is
 * what keeps draw calls down — but it means `mesh.material.emissiveIntensity =
 * x` in an animate loop writes to every other mesh built with the same colour
 * and finish. The skyline beacons already cloned by hand for exactly this
 * reason; anything else that animates a material has to do the same, and
 * mergeStatic() reads the ownMaterial flag to know what it must leave alone.
 */
function ownMaterial(mesh) {
  mesh.material = mesh.material.clone();
  mesh.material.userData.ownMaterial = true;
  return mesh;
}

/**
 * Collapse static scenery into one mesh per material.
 *
 * An outdoor SmartCiti.X scene was measuring 518 draw calls: 652 visible
 * meshes, and frustum culling only takes about a fifth of those off because
 * most of the scene is the ground and the horizon, which are always in shot. A
 * Quest wants that number in the low hundreds.
 *
 * Almost all of it is scenery that never moves and is never clicked — the
 * skyline, the district, the light masts, the site fence, the laydown. Every
 * one of those meshes already shares a cached material with its neighbours
 * (see mat()), so they can be baked into a single buffer per material and
 * drawn in one call. Nothing about how the scenery is authored changes: it is
 * still written as boxes and cylinders in readable code, and this runs once at
 * the end of the build.
 *
 * What it will NOT touch, and why the caller has to be deliberate:
 *   - anything interactive: it would lose its own transform and its id
 *   - anything animated: a merged mesh has no separate parts to move
 *   - anything with its own material or texture (decals, canvas panels), which
 *     is one draw call each whatever happens
 * Pass only subtrees that are none of those.
 *
 * Returns { before, after } so a caller can report what it saved. A no-op on
 * a THREE without the geometry API (the headless checkers' stub), so the same
 * build runs in both places.
 */
function mergeStatic(root, o = {}) {
  const probe = new THREE.BufferGeometry();
  if (typeof probe.setAttribute !== "function" || typeof probe.applyMatrix4 !== "function") {
    return { before: 0, after: 0, skipped: "no geometry API" };
  }
  root.updateMatrixWorld?.(true);
  // `local` bakes into the subtree's OWN space instead of the world's, so the
  // subtree keeps its transform and can still be moved, turned or driven as a
  // unit. That is what makes ambient life affordable: a figure or a vehicle
  // becomes two or three draw calls that still walk around, instead of twenty
  // that cannot be merged at all because the thing moves.
  const local = !!o.local;
  const inverse = local && root.matrixWorld ? new THREE.Matrix4().copy(root.matrixWorld).invert() : null;
  const buckets = new Map();
  const doomed = [];
  let before = 0;
  root.traverse((o) => {
    if (!o.isMesh) return;
    before += 1;
    // Leave alone anything that has to stay its own object.
    if (o.userData?.interactiveId || o.userData?.noMerge || o.userData?.canvas) return;
    if (!o.geometry?.attributes?.position || o.material?.userData?.ownMaterial) return;
    if (Array.isArray(o.material)) return;
    let list = buckets.get(o.material);
    if (!list) { list = []; buckets.set(o.material, list); }
    list.push(o);
    doomed.push(o);
  });

  for (const [material, meshes] of buckets) {
    if (meshes.length < 2) continue;
    const positions = [], normals = [], uvs = [];
    let ok = true;
    for (const m of meshes) {
      let g = m.geometry;
      if (g.index) g = g.toNonIndexed();
      else g = g.clone();
      g.applyMatrix4(m.matrixWorld);
      if (inverse) g.applyMatrix4(inverse);
      const pos = g.getAttribute("position"), nor = g.getAttribute("normal"), uv = g.getAttribute("uv");
      if (!pos || !nor) { ok = false; g.dispose(); break; }
      for (let i = 0; i < pos.count; i++) {
        positions.push(pos.getX(i), pos.getY(i), pos.getZ(i));
        normals.push(nor.getX(i), nor.getY(i), nor.getZ(i));
        uvs.push(uv ? uv.getX(i) : 0, uv ? uv.getY(i) : 0);
      }
      g.dispose();
    }
    if (!ok) continue;
    const merged = new THREE.BufferGeometry();
    merged.setAttribute("position", new THREE.Float32BufferAttribute(positions, 3));
    merged.setAttribute("normal", new THREE.Float32BufferAttribute(normals, 3));
    merged.setAttribute("uv", new THREE.Float32BufferAttribute(uvs, 2));
    merged.computeBoundingSphere();
    const one = new THREE.Mesh(merged, material);
    // In world mode the geometry already carries its world placement, so the
    // holder must not add a transform on top of it. In local mode the holder
    // is the thing that moves, so it keeps updating normally.
    if (!local) one.matrixAutoUpdate = false;
    one.castShadow = meshes.some((m) => m.castShadow);
    one.receiveShadow = meshes.some((m) => m.receiveShadow);
    one.userData.merged = meshes.length;
    root.add(one);
    for (const m of meshes) { m.geometry.dispose(); m.parent?.remove(m); }
  }

  let after = 0;
  root.traverse((o) => { if (o.isMesh) after += 1; });
  void doomed;
  return { before, after };
}

/** Dispose geometry created for a room. Materials stay cached and shared. */
function disposeTree(root) {
  root.traverse((o) => {
    if (o.isMesh || o.isLine || o.isPoints) {
      o.geometry?.dispose();
      if (o.material?.map && o.material.userData.ownTexture) o.material.map.dispose();
      if (o.material?.userData.ownMaterial) o.material.dispose();
    }
  });
  root.parent?.remove(root);
}

function group(parent, x = 0, y = 0, z = 0, ry = 0) {
  const g = new THREE.Group();
  g.position.set(x, y, z);
  g.rotation.y = ry;
  parent?.add(g);
  return g;
}

function box(parent, w, h, d, x, y, z, color, o = {}) {
  const m = new THREE.Mesh(track(new THREE.BoxGeometry(w, h, d)), mat(color, o));
  m.position.set(x, y, z);
  m.castShadow = o.cast !== false;
  m.receiveShadow = o.receive !== false;
  parent.add(m);
  return m;
}

function cyl(parent, rTop, rBot, h, x, y, z, color, o = {}) {
  const m = new THREE.Mesh(
    track(new THREE.CylinderGeometry(rTop, rBot, h, o.seg ?? 20, 1, !!o.open)), mat(color, o));
  m.position.set(x, y, z);
  m.castShadow = o.cast !== false;
  m.receiveShadow = o.receive !== false;
  parent.add(m);
  return m;
}

function ball(parent, r, x, y, z, color, o = {}) {
  const m = new THREE.Mesh(track(new THREE.SphereGeometry(r, o.seg ?? 18, o.seg2 ?? 14)), mat(color, o));
  m.position.set(x, y, z);
  m.castShadow = o.cast !== false;
  m.receiveShadow = o.receive !== false;
  parent.add(m);
  return m;
}

function torus(parent, r, tube, x, y, z, color, o = {}) {
  const m = new THREE.Mesh(track(new THREE.TorusGeometry(r, tube, o.seg ?? 10, o.seg2 ?? 24)), mat(color, o));
  m.position.set(x, y, z);
  m.castShadow = o.cast !== false;
  parent.add(m);
  return m;
}

/** Rounded slab — a box with chamfered vertical edges. Reads far better than a plain cube. */
function slab(parent, w, h, d, x, y, z, color, o = {}) {
  const r = Math.min(o.radius ?? 0.02, w / 2 - 0.001, d / 2 - 0.001);
  const shape = new THREE.Shape();
  const hw = w / 2 - r, hd = d / 2 - r;
  shape.moveTo(-hw - r, -hd);
  shape.lineTo(-hw - r, hd);
  shape.quadraticCurveTo(-hw - r, hd + r, -hw, hd + r);
  shape.lineTo(hw, hd + r);
  shape.quadraticCurveTo(hw + r, hd + r, hw + r, hd);
  shape.lineTo(hw + r, -hd);
  shape.quadraticCurveTo(hw + r, -hd - r, hw, -hd - r);
  shape.lineTo(-hw, -hd - r);
  shape.quadraticCurveTo(-hw - r, -hd - r, -hw - r, -hd);
  const geo = track(new THREE.ExtrudeGeometry(shape, { depth: h, bevelEnabled: false, curveSegments: 4 }));
  geo.rotateX(-Math.PI / 2);
  geo.translate(0, h / 2, 0);
  const m = new THREE.Mesh(geo, mat(color, o));
  m.position.set(x, y, z);
  m.castShadow = o.cast !== false;
  m.receiveShadow = o.receive !== false;
  parent.add(m);
  return m;
}

/** Lathe profile — bottles, jars, funnels. `profile` is [[radius, y], ...] bottom-up. */
function lathe(parent, profile, x, y, z, color, o = {}) {
  const pts = profile.map(([r, py]) => new THREE.Vector2(Math.max(r, 0.0005), py));
  const m = new THREE.Mesh(track(new THREE.LatheGeometry(pts, o.seg ?? 20)), mat(color, o));
  m.position.set(x, y, z);
  m.castShadow = o.cast !== false;
  m.receiveShadow = o.receive !== false;
  parent.add(m);
  return m;
}

/** Flexible run — cables, hoses, tubing. `points` are local Vector3-ish triples. */
function hose(parent, points, radius, color, o = {}) {
  const curve = new THREE.CatmullRomCurve3(points.map((p) => new THREE.Vector3(...p)));
  const m = new THREE.Mesh(
    track(new THREE.TubeGeometry(curve, o.steps ?? 32, radius, o.seg ?? 8, false)), mat(color, o));
  m.castShadow = o.cast !== false;
  parent.add(m);
  return m;
}

// ---------------------------------------------------------------- canvas art

/** Painted panel: signage, dials, labels, screens. Returns the mesh; texture is owned by it. */
function decal(parent, w, h, x, y, z, draw, o = {}) {
  const px = o.px ?? 512;
  const canvas = document.createElement("canvas");
  canvas.width = px;
  canvas.height = Math.max(8, Math.round(px * (h / w)));
  const g = canvas.getContext("2d");
  draw(g, canvas.width, canvas.height);
  const tex = new THREE.CanvasTexture(canvas);
  tex.anisotropy = 4;
  const material = new THREE.MeshStandardMaterial({
    map: tex, roughness: o.rough ?? 0.7, metalness: o.metal ?? 0,
    emissive: o.emissive ?? 0x000000, emissiveIntensity: o.ei ?? 1,
    emissiveMap: o.glow ? tex : null,
    transparent: !!o.transparent,
    side: THREE.DoubleSide,
  });
  material.userData.ownMaterial = true;
  material.userData.ownTexture = true;
  const m = new THREE.Mesh(track(new THREE.PlaneGeometry(w, h)), material);
  m.position.set(x, y, z);
  m.castShadow = false;
  m.receiveShadow = false;
  m.userData.canvas = canvas;
  m.userData.ctx = g;
  m.userData.texture = tex;
  parent.add(m);
  return m;
}

function repaint(mesh, draw) {
  const { ctx, canvas, texture } = mesh.userData;
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  draw(ctx, canvas.width, canvas.height);
  texture.needsUpdate = true;
}

// ---------------------------------------------------------------- surface texture helpers

/**
 * Flat gradient fill for a canvas 2D context. Falls back to a solid fill using the
 * gradient's last stop when the context has no real gradient support (e.g. the
 * headless mock used by the CI content checkers), so callers never need to special-case it.
 */
function gradientFill(g, w, h, stops, o = {}) {
  let grad = null;
  try {
    grad = o.radial
      ? g.createRadialGradient(w / 2, h / 2, 0, w / 2, h / 2, Math.max(w, h) / 2)
      : g.createLinearGradient(0, 0, o.horizontal ? w : 0, o.horizontal ? 0 : h);
  } catch { grad = null; }
  if (grad && typeof grad.addColorStop === "function") {
    for (const [stop, color] of stops) grad.addColorStop(stop, color);
    g.fillStyle = grad;
  } else {
    g.fillStyle = stops[stops.length - 1][1];
  }
  g.fillRect(0, 0, w, h);
}

/** Cheap grain: scattered translucent specks that break up a flat canvas fill. */
function noiseTexture(g, w, h, o = {}) {
  const count = Math.round((o.density ?? 900) * (w * h) / (512 * 512));
  const alpha = o.alpha ?? 0.05;
  const tone = o.tone ?? "0,0,0";
  for (let i = 0; i < count; i++) {
    g.fillStyle = `rgba(${tone},${(Math.random() * alpha).toFixed(3)})`;
    g.fillRect(Math.random() * w, Math.random() * h, 1, 1);
  }
}

/**
 * Weathering pass: soft grime blotches and drip streaks toward the lower half of a
 * panel. Silently draws nothing where the 2D context has no gradient support, rather
 * than throwing, so it is safe to call from code paths the headless checkers exercise.
 */
function grimeOverlay(g, w, h, o = {}) {
  const tone = o.tone ?? "18,14,9";
  const alpha = o.alpha ?? 0.22;
  for (let i = 0; i < (o.blotches ?? 4); i++) {
    const x = Math.random() * w, y = h * (0.5 + Math.random() * 0.5);
    const r = Math.min(w, h) * (0.18 + Math.random() * 0.22);
    let grad = null;
    try { grad = g.createRadialGradient(x, y, 0, x, y, r); } catch { grad = null; }
    if (!grad || typeof grad.addColorStop !== "function") continue;
    grad.addColorStop(0, `rgba(${tone},${alpha})`);
    grad.addColorStop(1, `rgba(${tone},0)`);
    g.fillStyle = grad;
    g.fillRect(x - r, y - r, r * 2, r * 2);
  }
  for (let i = 0; i < (o.streaks ?? 3); i++) {
    const x = w * (0.1 + Math.random() * 0.8);
    const len = h * (0.25 + Math.random() * 0.45);
    let grad = null;
    try { grad = g.createLinearGradient(x, 0, x, len); } catch { grad = null; }
    if (!grad || typeof grad.addColorStop !== "function") continue;
    grad.addColorStop(0, `rgba(${tone},${alpha * 0.8})`);
    grad.addColorStop(1, `rgba(${tone},0)`);
    g.fillStyle = grad;
    g.fillRect(x - (o.streakWidth ?? 2), 0, o.streakWidth ?? 2, len);
  }
}

/** Standard sign face: dark plate, accent rule, centred caps text. */
function signFace(text, o = {}) {
  return (g, w, h) => {
    g.fillStyle = o.bg ?? "#0b141d";
    g.fillRect(0, 0, w, h);
    if (o.worn) {
      noiseTexture(g, w, h, { density: 500, alpha: 0.05, tone: "0,0,0" });
      grimeOverlay(g, w, h, { blotches: 2, streaks: 2, alpha: 0.16 });
    }
    g.fillStyle = o.accent ?? HUD.accent;
    g.fillRect(0, h - Math.max(3, h * 0.07), w, Math.max(3, h * 0.07));
    g.fillStyle = o.fg ?? HUD.text;
    g.font = `600 ${Math.round(h * (o.scale ?? 0.46))}px 'Barlow Condensed', Arial, sans-serif`;
    g.textAlign = "center";
    g.textBaseline = "middle";
    const lines = String(text).split("\n");
    const step = h * 0.44;
    lines.forEach((line, i) => g.fillText(line, w / 2, h / 2 - ((lines.length - 1) * step) / 2 + i * step));
  };
}

/** Printed paper: permit, chart, schedule, label sheet. */
function paperFace(title, rows, o = {}) {
  return (g, w, h) => {
    g.fillStyle = o.bg ?? "#f2efe6";
    g.fillRect(0, 0, w, h);
    if (o.worn) {
      noiseTexture(g, w, h, { density: 350, alpha: 0.05, tone: o.wornTone ?? "90,74,46" });
      grimeOverlay(g, w, h, { blotches: 2, streaks: 1, tone: o.wornTone ?? "120,96,52", alpha: 0.16 });
    }
    g.fillStyle = o.band ?? "#22303c";
    g.fillRect(0, 0, w, h * 0.16);
    g.fillStyle = "#ffffff";
    g.font = `600 ${Math.round(h * 0.1)}px 'Barlow Condensed', Arial, sans-serif`;
    g.textAlign = "left";
    g.textBaseline = "middle";
    g.fillText(title, w * 0.05, h * 0.08);
    g.fillStyle = "#1d262e";
    g.font = `${Math.round(h * 0.062)}px Arial, sans-serif`;
    rows.forEach((row, i) => {
      const y = h * 0.26 + i * h * 0.1;
      g.fillStyle = "#63707c";
      g.fillRect(w * 0.05, y + h * 0.045, w * 0.9, 1);
      g.fillStyle = "#1d262e";
      g.fillText(row, w * 0.06, y);
    });
  };
}

// ---------------------------------------------------------------- room shells

/**
 * Enclosed room shell with floor, four walls, ceiling and a skirting rail.
 * Rooms are built around the origin; the learner spawns near +z looking to -z.
 */
/**
 * Light a room in proportion to its floor, not to a number somebody typed once.
 *
 * Each bay hand-placed three or four ceiling fittings, which was right for an
 * eight-metre room and leaves a fourteen-metre one with black corners and a
 * far wall nobody can read. This lays fittings on a grid whose spacing is
 * fixed, so a bigger floor simply gets more of them, and adds the low
 * hemisphere fill that stops an unlit corner going to pure black — a real shop
 * has bounce off the walls and these rooms had none at all.
 *
 * Call it after spreadLayout(), so the grid is sized to the room the learner
 * actually walks into.
 */
function ceilingGrid(parent, w, d, o = {}) {
  const spacing = o.spacing ?? 5.0;
  const nx = Math.max(2, Math.min(3, Math.round(w / spacing)));
  const nz = Math.max(2, Math.min(3, Math.round(d / spacing)));
  const y = o.y ?? 2.94;
  const cellW = w / nx, cellD = d / nz;
  const colour = o.color ?? 0xfff4e2;
  const lamps = [];
  for (let i = 0; i < nx; i++) {
    for (let j = 0; j < nz; j++) {
      const x = (i + 0.5) * cellW - w / 2;
      const z = (j + 0.5) * cellD - d / 2;
      // One emissive slab per fitting, not a housing plus a lens: at ceiling
      // height the housing is never seen, and doubling the mesh count of every
      // fitting in every room to draw it put the colour studio over budget.
      lamps.push(box(parent, Math.min(cellW * 0.42, 3.4), 0.05, 0.3, x, y, z, colour,
        { cast: false, emissive: colour, ei: o.ei ?? 1.6, rough: 0.4 }));
      // Light only a checker of the fittings, with the range to cover their
      // neighbours. A dozen point lights in one room is a real cost on a
      // headset and buys nothing a wider-throw half-dozen does not.
      if ((i + j) % 2 === 0) {
        const lamp = new THREE.PointLight(colour, o.lamp ?? 2.2, o.range ?? Math.max(14, spacing * 3.2), 2);
        lamp.position.set(x, y - 0.2, z);
        parent.add(lamp);
      }
    }
  }
  // Bounce. Without it a face turned away from every fitting renders black,
  // which is the one thing a real room never does.
  parent.add(new THREE.HemisphereLight(o.sky ?? 0xdceaf6, o.groundTone ?? 0x4a535d, o.fill ?? 0.95));
  return lamps;
}

/**
 * Push a room's workstations apart without resizing any of them.
 *
 * Every bay was laid out inside about eight metres because that is all the
 * learner was ever allowed to walk. Making the room bigger on its own just
 * adds an empty ring of floor: the bench, the machine, the permit board and
 * the PPE stand all stay huddled in the middle, and the extra space reads as
 * a mistake rather than a shop.
 *
 * This scales the POSITION of each thing standing on the room floor, and
 * nothing else. A bench four metres out goes to six and a half; the bench
 * itself, and everything parented to it, is untouched, because a child's
 * position is local to its group. Anything already at the origin — the shell,
 * the floor paint — does not move, which is exactly right.
 *
 * Call it at the end of build(), before returning, so the room a checker
 * measures is the room the learner walks into.
 */
function spreadLayout(root, k = 1) {
  if (!(k > 0) || k === 1) return root;
  for (const child of root.children ?? []) {
    child.position.x *= k;
    child.position.z *= k;
  }
  return root;
}

// 0xrrggbb to the "#rrggbb" a canvas context wants.
function hex(color) {
  return `#${(color & 0xffffff).toString(16).padStart(6, "0")}`;
}

function shell(parent, o = {}) {
  const w = o.w ?? 8, d = o.d ?? 8, h = o.h ?? 3.1;
  const g = group(parent);
  // Finishes, not flat colour: a shop floor is sealed concrete with a tooth to
  // it, and block walls are painted rather than poured light. The maps are
  // shared per finish (see surface()), so this costs texture memory and not
  // draw calls. Tiling is set against the room's size so the grain stays the
  // same physical scale whether the bay is six metres or twelve.
  const FLOOR_TILE = Math.max(2, Math.round(Math.max(w, d) / 2.4));
  const WALL_TILE = Math.max(2, Math.round(Math.max(w, d) / 3.2));
  const floor = box(g, w, 0.12, d, 0, -0.06, 0, o.floor ?? 0x3a4048,
    { rough: o.floorRough ?? 0.85, metal: o.floorMetal ?? 0, cast: false,
      finish: o.floorFinish ?? "concrete", tile: FLOOR_TILE });
  floor.receiveShadow = true;
  const wallOpts = { rough: 0.94, cast: false, finish: o.wallFinish ?? "painted", tile: WALL_TILE };
  box(g, w, h, 0.12, 0, h / 2, -d / 2, o.wall ?? 0x5b6672, wallOpts);
  box(g, 0.12, h, d, -w / 2, h / 2, 0, o.wall ?? 0x5b6672, wallOpts);
  box(g, 0.12, h, d, w / 2, h / 2, 0, o.wall ?? 0x5b6672, wallOpts);
  box(g, w, 0.12, d, 0, h, 0, o.ceiling ?? 0x2b3238, { rough: 0.96, cast: false, finish: "painted", tile: WALL_TILE });
  if (o.backWall !== false) box(g, w, h, 0.12, 0, h / 2, d / 2, o.wall ?? 0x5b6672, wallOpts);
  if (o.skirt !== false) {
    box(g, w, 0.1, 0.04, 0, 0.05, -d / 2 + 0.08, o.skirtColor ?? 0x2a3038, { cast: false });
    box(g, 0.04, 0.1, d, -w / 2 + 0.08, 0.05, 0, o.skirtColor ?? 0x2a3038, { cast: false });
    box(g, 0.04, 0.1, d, w / 2 - 0.08, 0.05, 0, o.skirtColor ?? 0x2a3038, { cast: false });
  }
  // A real shop has paint on the floor, a trim line on the wall, structure in
  // the ceiling and a way out. A room that has none of those reads as a box
  // with props in it, so any room can ask for them here.
  if (o.walkway) floorPaint(g, w, d, o.walkway === true ? {} : o.walkway);
  if (o.trim) wallTrim(g, w, d, h, o.trim);
  if (o.structure) ceilingStructure(g, w, d, h, o.structure, o.structureColor);
  if (o.door) wayOut(g, w, d, h, o.door, o.doorColor, { daylight: o.doorDaylight });
  return g;
}

// Floor paint: a walkway down the middle with a hazard-hatched edge either
// side, the way a shop marks where you are allowed to stand. One decal, so it
// costs a single mesh however detailed the marking is.
function floorPaint(parent, w, d, o = {}) {
  const lane = o.lane ?? 0xf2c14b, hatch = o.hatch ?? 0xd8dde3, base = o.base ?? null;
  const px = o.px ?? 1024;
  // Everything here is set out in metres and converted, not in fractions of
  // the canvas. Drawn in fractions, the same markings on a fourteen-metre
  // floor came out as sparse white ticks scattered across it that read as
  // litter rather than as a hazard border.
  const perM = px / w;
  const laneW = o.laneMetres ?? 1.9;     // a walkway you can pass someone in
  const margin = o.marginMetres ?? 0.85; // the hazard border along the walls
  const pitch = o.pitchMetres ?? 0.34;   // stripe spacing in that border
  const m = decal(parent, w, d, 0, 0.012, 0, (g, cw, ch) => {
    g.clearRect(0, 0, cw, ch);
    if (base) { g.fillStyle = hex(base); g.fillRect(0, 0, cw, ch); }
    const lw = laneW * perM, lx = (cw - lw) / 2;
    g.fillStyle = `${hex(lane)}22`;
    g.fillRect(lx, 0, lw, ch);
    g.strokeStyle = hex(lane); g.lineWidth = Math.max(3, 0.1 * perM);
    g.beginPath(); g.moveTo(lx, 0); g.lineTo(lx, ch); g.moveTo(lx + lw, 0); g.lineTo(lx + lw, ch); g.stroke();
    // Hazard border: continuous diagonal stripes at a fixed pitch, so the
    // band reads as painted-on chevrons at any room size.
    const marg = margin * perM, step = pitch * perM;
    g.strokeStyle = hex(hatch); g.lineWidth = Math.max(2, 0.09 * perM);
    for (let y = -marg; y < ch + marg; y += step) {
      g.beginPath(); g.moveTo(0, y); g.lineTo(marg, y + marg); g.stroke();
      g.beginPath(); g.moveTo(cw, y); g.lineTo(cw - marg, y + marg); g.stroke();
    }
  }, { px, transparent: !base, rough: 0.9 });
  m.rotation.x = -Math.PI / 2;
  return m;
}

// Wall trim: the painted band at shoulder height that tells you at a glance
// whose bay you are standing in. Three walls, three meshes.
function wallTrim(parent, w, d, h, color, o = {}) {
  const y = o.y ?? Math.min(2.1, h - 0.9), t = o.thickness ?? 0.09;
  const g = group(parent);
  box(g, w, t, 0.02, 0, y, -d / 2 + 0.07, color, { cast: false, rough: 0.7 });
  box(g, 0.02, t, d, -w / 2 + 0.07, y, 0, color, { cast: false, rough: 0.7 });
  box(g, 0.02, t, d, w / 2 - 0.07, y, 0, color, { cast: false, rough: 0.7 });
  return g;
}

// Ceiling structure: pipe runs on hangers for a plant or service room, roof
// trusses for a shop or bay, bare for a clinic or salon that really does have
// a flat tile ceiling.
function ceilingStructure(parent, w, d, h, kind, color) {
  const g = group(parent);
  const steel = color ?? 0x6b7581;
  if (kind === "pipes") {
    const runs = [[-w * 0.26, 0.20], [0, 0.13], [w * 0.24, 0.16]];
    for (const [x, r] of runs) {
      const pipe = cyl(g, r, r, d - 0.4, x, h - 0.34, 0, steel, { seg: 12, cast: false, rough: 0.55, metal: 0.6 });
      pipe.rotation.x = Math.PI / 2;
      for (const z of [-d * 0.3, 0, d * 0.3]) {
        box(g, 0.05, 0.3, 0.05, x, h - 0.19, z, 0x4b5460, { cast: false, rough: 0.7, metal: 0.4 });
      }
    }
  } else if (kind === "trusses") {
    for (const z of [-d * 0.3, 0, d * 0.3]) {
      box(g, w - 0.3, 0.1, 0.12, 0, h - 0.5, z, steel, { cast: false, rough: 0.6, metal: 0.5 });
      box(g, w - 0.3, 0.1, 0.12, 0, h - 0.14, z, steel, { cast: false, rough: 0.6, metal: 0.5 });
      for (let i = -2; i <= 2; i++) {
        const web = box(g, 0.06, 0.42, 0.06, (i * (w - 0.8)) / 5, h - 0.32, z, steel,
          { cast: false, rough: 0.6, metal: 0.5 });
        web.rotation.z = i % 2 ? 0.5 : -0.5;
      }
    }
  }
  return g;
}

// A way out. Not decoration: a room with no visible exit is the one thing a
// trainee notices as wrong, and in a hot-work or confined bay the exit is part
// of the procedure being taught.
function wayOut(parent, w, d, h, kind, color, o = {}) {
  const g = group(parent, 0, 0, d / 2 - 0.08);
  const frame = color ?? 0x3b434d;
  if (kind === "shutter") {
    const dw = Math.min(2.8, w * 0.42), dh = Math.min(2.6, h - 0.25);
    box(g, dw + 0.2, 0.14, 0.1, 0, dh + 0.08, 0, frame, { cast: false, rough: 0.7, metal: 0.4 });
    for (let i = 0; i < 9; i++) {
      box(g, dw, dh / 9 - 0.02, 0.06, 0, 0.08 + (i + 0.5) * (dh / 9), 0, i % 2 ? 0x8a929b : 0x7b838c,
        { cast: false, rough: 0.6, metal: 0.45 });
    }
  } else if (kind === "personnel") {
    const dw = 0.98, dh = Math.min(2.1, h - 0.4);
    box(g, dw + 0.12, dh + 0.08, 0.08, 0, dh / 2, 0, frame, { cast: false, rough: 0.8 });
    box(g, dw, dh, 0.05, 0, dh / 2, 0.03, 0xb8c0c8, { cast: false, rough: 0.55, metal: 0.3 });
    cyl(g, 0.03, 0.03, 0.26, dw / 2 - 0.16, dh * 0.48, 0.09, 0xd8dde3, { seg: 10, cast: false, metal: 0.7, rough: 0.35 });
    // Exit sign above it, lit, because that is how you find it in smoke.
    box(g, 0.44, 0.17, 0.05, 0, dh + 0.22, 0, 0x1d6b3a, { cast: false, emissive: 0x2fbf6a, ei: 1.3, rough: 0.5 });
  } else if (kind === "dock") {
    const dw = Math.min(3.2, w * 0.46), dh = Math.min(2.7, h - 0.2);
    box(g, dw + 0.3, 0.16, 0.12, 0, dh + 0.1, 0, frame, { cast: false, rough: 0.75 });
    box(g, 0.16, dh, 0.12, -dw / 2 - 0.12, dh / 2, 0, frame, { cast: false, rough: 0.75 });
    box(g, 0.16, dh, 0.12, dw / 2 + 0.12, dh / 2, 0, frame, { cast: false, rough: 0.75 });
    // Daylight in the opening, so the room reads as connected to outside. A
    // room built without that wall is already open, so it skips the pane.
    if (o.daylight !== false) {
      box(g, dw, dh, 0.03, 0, dh / 2, 0.02, 0xa8bccd, { cast: false, emissive: 0x8fb0c9, ei: 0.85, rough: 0.9 });
    }
  }
  return g;
}

/** Recessed ceiling panel that also acts as the room's key light source. */
function ceilingPanel(parent, x, z, o = {}) {
  const y = o.y ?? 3.02;
  box(parent, o.w ?? 1.2, 0.06, o.d ?? 0.32, x, y, z, 0x22282e, { cast: false, rough: 0.6, metal: 0.5 });
  const lens = box(parent, (o.w ?? 1.2) - 0.08, 0.03, (o.d ?? 0.32) - 0.06, x, y - 0.05, z,
    o.color ?? 0xfff4e2, { cast: false, emissive: o.color ?? 0xfff4e2, ei: o.ei ?? 1.5, rough: 0.4 });
  const lamp = new THREE.PointLight(o.color ?? 0xfff4e2, o.lamp ?? 1.5, o.range ?? 9, 2);
  lamp.position.set(x, y - 0.18, z);
  parent.add(lamp);
  return lens;
}

// ------------------------------------------------------------ composite props

/** Stainless / laminate work counter with legs, apron and optional undershelf. */
function counter(parent, w, d, x, z, color = 0x9aa4ad, o = {}) {
  const g = group(parent, x, 0, z, o.ry ?? 0);
  const hgt = o.height ?? 0.92;
  slab(g, w, 0.05, d, 0, hgt, 0, color, { rough: o.rough ?? 0.34, metal: o.metal ?? 0.72, radius: 0.02 });
  box(g, w - 0.06, 0.1, 0.03, 0, hgt - 0.08, -d / 2 + 0.03, color, { rough: 0.4, metal: 0.6, finish: "brushed", tile: 2 });
  for (const sx of [-1, 1]) for (const sz of [-1, 1]) {
    cyl(g, 0.022, 0.022, hgt - 0.05, sx * (w / 2 - 0.09), (hgt - 0.05) / 2, sz * (d / 2 - 0.09),
      0x7c848c, { rough: 0.35, metal: 0.85, seg: 10 });
  }
  if (o.undershelf !== false) {
    slab(g, w - 0.16, 0.03, d - 0.16, 0, 0.24, 0, color, { rough: 0.45, metal: 0.6, radius: 0.01 });
  }
  return g;
}

/** Wheeled trolley — salon trolley, phlebotomy cart, tool cart. */
function trolley(parent, x, z, color = 0x2b3239, o = {}) {
  const g = group(parent, x, 0, z, o.ry ?? 0);
  const w = o.w ?? 0.52, d = o.d ?? 0.4;
  for (const y of [0.34, 0.6, 0.86]) slab(g, w, 0.028, d, 0, y, 0, color, { rough: 0.42, metal: 0.35, finish: "painted", tile: 2, radius: 0.015 });
  for (const sx of [-1, 1]) for (const sz of [-1, 1]) {
    cyl(g, 0.014, 0.014, 0.86, sx * (w / 2 - 0.03), 0.45, sz * (d / 2 - 0.03), 0x8d959d,
      { rough: 0.3, metal: 0.9, seg: 8 });
    const caster = cyl(g, 0.035, 0.035, 0.018, sx * (w / 2 - 0.03), 0.035, sz * (d / 2 - 0.03), 0x16191d,
      { rough: 0.8, seg: 12 });
    caster.rotation.z = Math.PI / 2;
  }
  return g;
}

/** Wall cabinet with doors and handles. */
function cabinet(parent, w, h, d, x, y, z, color = 0xd7dce1, o = {}) {
  const g = group(parent, x, y, z, o.ry ?? 0);
  box(g, w, h, d, 0, 0, 0, color, { rough: 0.55, metal: 0.1, finish: "painted", tile: 2 });
  const gap = 0.006;
  for (const sx of [-1, 1]) {
    box(g, w / 2 - gap, h - 0.04, 0.018, sx * (w / 4), 0, d / 2 + 0.01, o.doorColor ?? color,
      { rough: 0.42, metal: 0.15 });
    box(g, 0.02, 0.11, 0.02, sx * 0.045, 0, d / 2 + 0.03, 0x8d959d, { rough: 0.3, metal: 0.9 });
  }
  return g;
}

/** Seated human stand-in: client in a salon chair, patient in a draw chair. */
/**
 * A standing person, with the parts a trade needs to pose them: the head and
 * both arms are their own groups, so a room can have somebody looking at a
 * bench, holding a tool, or turning to talk to you.
 *
 * Pose first, then call mergeStatic(fig.root, { local: true }) if the figure
 * only has to move as a whole — that takes it from about twenty meshes to
 * three and it still walks, turns and bobs.
 */
function standingPerson(parent, x, z, o = {}) {
  const g = group(parent, x, 0, z, o.ry ?? 0);
  const skin = o.skin ?? 0xc99878;
  const cloth = o.cloth ?? 0x37505f;
  const legs = o.legs ?? 0x2f3740;
  const torso = group(g, 0, 0, 0);
  box(torso, 0.4, 0.54, 0.24, 0, 1.12, 0, cloth, { rough: 0.9 });
  box(torso, 0.36, 0.16, 0.24, 0, 0.8, 0, legs, { rough: 0.9 });
  for (const sx of [-1, 1]) {
    cyl(torso, 0.07, 0.06, 0.78, sx * 0.11, 0.38, 0, legs, { rough: 0.9, seg: 10 });
    box(torso, 0.11, 0.07, 0.24, sx * 0.11, 0.035, 0.05, o.boots ?? 0x1b1e22, { rough: 0.85 });
  }
  const head = group(torso, 0, 1.52, 0);
  ball(head, 0.115, 0, 0, 0, skin, { rough: 0.75, seg: 18 });
  box(head, 0.16, 0.1, 0.1, 0, -0.05, 0.05, skin, { rough: 0.75 });
  cyl(torso, 0.05, 0.055, 0.12, 0, 1.4, 0, skin, { rough: 0.75, seg: 12 });
  if (o.hat) {
    // A dome sitting on the top of the head with a brim, not a sphere the
    // same size as the head — at r=0.135 centred on the skull it swallowed
    // the face and the figure read as a person with an orange ball for a head.
    const shell = ball(head, 0.125, 0, 0.055, 0, o.hat, { rough: 0.5, seg: 14 });
    shell.scale.y = 0.62;
    cyl(head, 0.175, 0.175, 0.018, 0, 0.022, 0.005, o.hat, { rough: 0.5, seg: 16 });
  }
  if (o.hiVis !== false) {
    // The band that makes somebody visible across a shop, which is the point
    // of putting them in the room at all.
    box(torso, 0.42, 0.07, 0.26, 0, 1.2, 0, o.vis ?? 0xd8e33a, { rough: 0.7, emissive: o.vis ?? 0xd8e33a, ei: 0.25 });
  }
  const arms = [];
  for (const sx of [-1, 1]) {
    const shoulder = group(torso, sx * 0.235, 1.34, 0);
    cyl(shoulder, 0.05, 0.045, 0.32, 0, -0.16, 0, cloth, { rough: 0.9, seg: 10 });
    const fore = group(shoulder, 0, -0.32, 0);
    cyl(fore, 0.042, 0.038, 0.3, 0, -0.14, 0, skin, { rough: 0.75, seg: 10 });
    ball(fore, 0.045, 0, -0.3, 0, skin, { rough: 0.75, seg: 10 });
    arms.push({ shoulder, fore });
  }
  return { root: g, torso, head, arms };
}

function seatedFigure(parent, x, y, z, o = {}) {
  const g = group(parent, x, y, z, o.ry ?? 0);
  const skin = o.skin ?? 0xc99878;
  const cloth = o.cloth ?? 0x37505f;
  const torso = group(g, 0, 0, 0);
  box(torso, 0.4, 0.5, 0.26, 0, 0.72, 0, cloth, { rough: 0.9 });
  box(torso, 0.34, 0.16, 0.26, 0, 0.42, 0.02, cloth, { rough: 0.9 });        // lap
  for (const sx of [-1, 1]) {
    box(torso, 0.14, 0.14, 0.44, sx * 0.16, 0.4, 0.2, cloth, { rough: 0.9 }); // thighs
    cyl(torso, 0.055, 0.05, 0.42, sx * 0.16, 0.21, 0.4, cloth, { rough: 0.9, seg: 10 });
  }
  const head = group(torso, 0, 1.06, 0.01);
  ball(head, 0.115, 0, 0, 0, skin, { rough: 0.75, seg: 20 });
  box(head, 0.16, 0.1, 0.1, 0, -0.05, 0.05, skin, { rough: 0.75 });          // jaw
  cyl(torso, 0.05, 0.055, 0.12, 0, 0.98, 0, skin, { rough: 0.75, seg: 12 }); // neck
  const arms = [];
  for (const sx of [-1, 1]) {
    const shoulder = group(torso, sx * 0.23, 0.88, 0);
    cyl(shoulder, 0.05, 0.045, 0.3, 0, -0.15, 0, cloth, { rough: 0.9, seg: 10 });
    const fore = group(shoulder, 0, -0.3, 0);
    cyl(fore, 0.042, 0.038, 0.28, 0, -0.13, 0.02, skin, { rough: 0.75, seg: 10 });
    ball(fore, 0.045, 0, -0.28, 0.04, skin, { rough: 0.75, seg: 12 });
    arms.push({ shoulder, fore });
  }
  return { root: g, torso, head, arms };
}

// ------------------------------------------------------------------ particles

/** Cheap additive point burst reused for sparks, steam and water. */
function particles(parent, count, color, o = {}) {
  const positions = new Float32Array(count * 3);
  const geo = track(new THREE.BufferGeometry());
  geo.setAttribute("position", new THREE.BufferAttribute(positions, 3));
  const material = new THREE.PointsMaterial({
    color, size: o.size ?? 0.02, transparent: true, opacity: o.opacity ?? 0.9,
    blending: o.additive === false ? THREE.NormalBlending : THREE.AdditiveBlending,
    depthWrite: false, sizeAttenuation: true,
  });
  material.userData.ownMaterial = true;
  const points = new THREE.Points(geo, material);
  points.frustumCulled = false;
  points.visible = false;
  parent.add(points);
  const life = new Float32Array(count);
  const vel = new Float32Array(count * 3);
  points.userData.step = (dt, origin, spread, speed, gravity) => {
    for (let i = 0; i < count; i++) {
      life[i] -= dt;
      if (life[i] <= 0) {
        life[i] = 0.25 + Math.random() * (o.life ?? 0.6);
        positions[i * 3] = origin.x + (Math.random() - 0.5) * spread;
        positions[i * 3 + 1] = origin.y + (Math.random() - 0.5) * spread;
        positions[i * 3 + 2] = origin.z + (Math.random() - 0.5) * spread;
        vel[i * 3] = (Math.random() - 0.5) * speed;
        vel[i * 3 + 1] = (Math.random() * 0.6 + 0.4) * speed;
        vel[i * 3 + 2] = (Math.random() - 0.5) * speed;
      }
      positions[i * 3] += vel[i * 3] * dt;
      positions[i * 3 + 1] += vel[i * 3 + 1] * dt;
      positions[i * 3 + 2] += vel[i * 3 + 2] * dt;
      vel[i * 3 + 1] += gravity * dt;
    }
    geo.attributes.position.needsUpdate = true;
  };
  return points;
}

/**
 * A one-shot, self-driving particle celebration for "big moment" feedback — a
 * hot-streak step, a rank-up, a personal best. Parented once to `parent` (any
 * static node already in the scene, e.g. the room root); after that, call the
 * returned `fire(localPoint)` whenever the moment happens and call `update(dt)`
 * unconditionally from the render loop — it is a cheap no-op once the burst
 * has finished, so the caller never needs to track whether one is playing.
 */
function celebrationBurst(parent, o = {}) {
  const points = particles(parent, o.count ?? 70, o.color ?? 0xffe37a, {
    size: o.size ?? 0.032, life: o.life ?? 0.6, additive: o.additive !== false, opacity: o.opacity ?? 0.95,
  });
  const origin = new THREE.Vector3();
  let timer = 0;
  return {
    fire(localPoint) {
      origin.copy(localPoint);
      timer = o.duration ?? 0.5;
      points.visible = true;
    },
    update(dt) {
      if (timer <= 0) { if (points.visible) points.visible = false; return; }
      timer -= dt;
      points.userData.step(dt, origin, o.spread ?? 0.1, o.speed ?? 1.6, o.gravity ?? -1.8);
    },
  };
}

// ------------------------------------------------------------------- helpers

function markInteractive(objectOrGroup, id, o = {}) {
  objectOrGroup.userData.hitId = id;
  objectOrGroup.userData.hitLabel = o.label ?? id;
  return objectOrGroup;
}

const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
const lerp = (a, b, t) => a + (b - a) * t;
const easeOut = (t) => 1 - Math.pow(1 - clamp(t, 0, 1), 3);


/* ===== shared/game.js ===== */
// Procedure engine and gamification layer.
//
// A room supplies an ordered list of steps. The engine owns correctness: it
// decides whether an interaction advances the procedure, applies score, and
// produces the coaching line the HUD shows. Rooms never score themselves, so
// the assessment stays deterministic and auditable — the same contract the
// Unity build uses.

const STEP_POINTS = 100;
const WRONG_STEP_PENALTY = 25;
const HAZARD_PENALTY = 50;
const MAX_COMBO = 2.0;
// Noticing an interruption while task-loaded is worth more than a step,
// because it is the harder thing and the one nobody practises. Answering
// quickly is worth more again — the whole measure is how long you took.
const INTERRUPT_POINTS = 120;
const INTERRUPT_SPEED_BONUS = 60;

// Named combo tiers — the HUD shows the label, not just the multiplier, so a
// hot streak reads as a game feel moment rather than an accounting detail.
const COMBO_TIERS = [
  { at: 0, label: "" },
  { at: 1.2, label: "Nice" },
  { at: 1.4, label: "Great" },
  { at: 1.6, label: "Awesome" },
  { at: 1.8, label: "On Fire" },
  { at: MAX_COMBO, label: "Unstoppable" },
];

// One profile, shared on purpose: SmartCiti.X, Trade Skills Simulator and
// Holodeck's real-station mode all import this same module, so a learner's
// XP/level/badges/player name are a single cross-app total rather than
// three separate ones — a room/sim's own record (data.rooms[id]) can't
// collide between apps because every id in the whole vocabulary is unique.
// The key name predates that: it was written when only Trade Skills
// existed. Renamed to say what it actually is now, with a one-time,
// one-way migration from the old key so nobody's saved progress vanishes.
const STORE_KEY = "vr-training-profile-v1";
const LEGACY_STORE_KEY = "trades-sim-v1";
const NAME_KEY = "vr-training-profile-name";
const LEGACY_NAME_KEY = "trades-sim-name";

// ---------------------------------------------------------------- progression

const MAX_BOARD_ENTRIES = 8;

// The account-wide level ladder — one number spanning every room/sim across
// every app sharing this profile, capped at a real endgame rather than
// growing forever. Levels 1-32 use a smooth curve (each level costs more
// than the last); level 33 is the cap — once reached, further XP still
// accumulates (it still counts toward suite standing and leaderboards) but
// no longer raises the level number. Tuned so clearing every sim in the
// current 20-sim SmartCiti.X catalog once (roughly 300 XP each) lands
// solidly in the "Journeyworker" band, leaving "Foreman" and above as a
// real long-term goal — one that gets more reachable, not less, as the
// catalog grows toward its planned 330 sims.
const MAX_LEVEL = 33;
const LEVEL_XP = Array.from({ length: MAX_LEVEL }, (_, i) => Math.round(120 * Math.pow(i, 1.65)));
// Several levels share a tier name, the same way a real trade ladder doesn't
// mint a new title every single level — "through" is the highest level still
// carrying that name.
const LEVEL_TIERS = [
  { through: 4, name: "Trainee" },
  { through: 8, name: "Apprentice" },
  { through: 12, name: "Journeyworker" },
  { through: 16, name: "Technician" },
  { through: 20, name: "Specialist" },
  { through: 24, name: "Foreman" },
  { through: 28, name: "Master" },
  { through: 32, name: "Certified Master" },
  { through: MAX_LEVEL, name: "Legend" },
];

/**
 * Awards every station can earn, judged by the engine itself rather than by
 * a sim's own system — the flipped-classroom mechanic lives here so all
 * three apps reward it identically. Apps merge these into a sim's own
 * badge/challenge list when naming what a run earned.
 */
const UNIVERSAL_AWARDS = [
  {
    id: "prepared", name: "Prepared",
    note: "Studied the pre-brief before the run — learn first, prove it in the sim",
    test: (s) => !!s.prepared,
  },
];
/** Score bonus for a run the learner prepared for (fraction of the run's own score). */
const PREPARED_BONUS = 0.1;

const Progress = {
  data: { xp: 0, rooms: {}, badges: [], boards: {}, briefed: {} },
  playerName: "YOU",

  load() {
    try {
