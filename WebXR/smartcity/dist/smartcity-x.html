// Flagship banner copy, product-owner-specified: SmartCiti.X is the visitor-facing
// simulator brand; AGI Corp and Visko are the umbrella/co-brands it is built and run under.
const MARQUEE_LINE = "SMARTCITI.X ~VR SIMULATORS";
const MARQUEE_SUB = "POWERED BY AGI CORP & VISKO";

/** Flagship entrance marquee: two support posts, a lit beam, a canvas wordmark and a
 *  small rotating holo-emblem. Built once; the returned refs are cheap to animate
 *  per-frame (no allocations, just property tweaks on cached materials). */
function buildMarquee(g) {
  const spanW = 6.2, postH = 4.6, postR = 0.16, mz = -9.6;
  const marquee = group(g, 0, 0, mz);
  for (const sx of [-1, 1]) {
    cyl(marquee, postR, postR * 1.15, postH, sx * spanW / 2, postH / 2, 0, 0x232b33, { rough: 0.4, metal: 0.65, seg: 14 });
    box(marquee, postR * 2.4, 0.22, postR * 2.4, sx * spanW / 2, 0.11, 0, 0x1a2129, { rough: 0.6, metal: 0.4 });
  }
  box(marquee, spanW + 0.5, 0.5, 0.4, 0, postH + 0.05, 0, 0x171f28, { rough: 0.45, metal: 0.55 });
  const trim = box(marquee, spanW + 0.3, 0.03, 0.05, 0, postH - 0.22, 0.21, CITY.accent,
    { emissive: CITY.accent, ei: 1.6, rough: 0.4, cast: false });

  const sign = decal(marquee, spanW - 0.4, 1.55, 0, postH - 1.0, 0.22, (cx, cw, ch) => {
    gradientFill(cx, cw, ch, [[0, "#04141c"], [1, "#0b2733"]]);
    noiseTexture(cx, cw, ch, { density: 260, alpha: 0.03, tone: "255,255,255" });
    cx.fillStyle = "#8fd8ff";
    cx.font = `600 ${Math.round(ch * 0.13)}px 'Barlow Condensed', Arial, sans-serif`;
    cx.textAlign = "center"; cx.textBaseline = "middle";
    cx.fillText(MARQUEE_SUB, cw / 2, ch * 0.18);
    cx.fillStyle = "#eaf6fb";
    cx.font = `700 ${Math.round(ch * 0.36)}px 'Barlow Condensed', Arial, sans-serif`;
    cx.fillText(MARQUEE_LINE, cw / 2, ch * 0.55);
    cx.fillStyle = CITY.accentCss;
    cx.font = `500 ${Math.round(ch * 0.11)}px 'Barlow', Arial, sans-serif`;
    cx.fillText("FLAGSHIP AR / VR TRAINING SIMULATORS", cw / 2, ch * 0.85);
  }, { px: 1024, glow: true, ei: 0.85 });

  const emblem = group(marquee, 0, postH + 0.85, 0);
  torus(emblem, 0.4, 0.03, 0, 0, 0, CITY.accent, { emissive: CITY.accent, ei: 2, rough: 0.4, cast: false, seg: 8, seg2: 40 });
  const ring2 = torus(emblem, 0.28, 0.02, 0, 0, 0, CITY.violet, { emissive: CITY.violet, ei: 1.8, rough: 0.4, cast: false, seg: 6, seg2: 32 });
  ring2.rotation.x = Math.PI / 2.4;
  ball(emblem, 0.09, 0, 0, 0, 0xeaf6fb, { emissive: 0xeaf6fb, ei: 2.4, rough: 0.3 });
  const beam = new THREE.PointLight(CITY.accent, 2.2, 9, 2);
  beam.position.set(0, postH - 0.4, 0.4);
  marquee.add(beam);

  return { sign, emblem, ring2, trim };
}

// The stage is everything that is *not* the training station.
//
// In AR the learner's own room is the environment, so the stage is almost
// nothing: passthrough behind, and a faint floor grid to anchor the station.
// In VR and on a flat screen there is no real room to stand in, so the same
// station is dropped into a digital-twin plaza with a city skyline around it.

const STAGE_MODES = ["ar", "vr", "flat"];

function buildStage(root, mode, scene, accent = CITY.accent) {
  const g = group(root);
  const ar = mode === "ar";

  if (ar) {
    // Passthrough: no sky, no ground, nothing that would paint over the room.
    scene.background = null;
    scene.fog = null;
    // A low-contrast grid disc so the station still feels placed on the floor.
    for (let ring = 1; ring <= 3; ring++) {
      torus(g, ring * 0.9, 0.004, 0, 0.004, 0, CITY.accent,
        { emissive: CITY.accent, ei: 0.5, rough: 0.4, cast: false, seg: 6, seg2: 48 });
    }
    for (let i = 0; i < 12; i++) {
      const a = (i / 12) * Math.PI * 2;
      const spoke = box(g, 0.004, 0.004, 2.7, Math.sin(a) * 1.35, 0.004, Math.cos(a) * 1.35,
        CITY.accent, { emissive: CITY.accent, ei: 0.35, rough: 0.4, cast: false });
      spoke.rotation.y = a;
    }
    root.add(new THREE.HemisphereLight(0xdfeaf2, 0x6a7480, 1.5));
    const key = new THREE.DirectionalLight(0xffffff, 0.7);
    key.position.set(2.5, 5, 3);
    root.add(key);
    return { root: g, ar, animate() {} };
  }

  scene.background = new THREE.Color(0x060a11);
  scene.fog = new THREE.Fog(0x080d16, 22, 64);

  // Plaza deck: cast-concrete paving tiled across the disc (the cylinder cap's
  // planar UVs make a repeating texture read as a real slab grid), with a
  // deck-plate walk ring around the perimeter so the edge reads as a
  // different material rather than the same colour to the horizon.
  const pavingTex = surfaceTexture((cx, w, h) => pavingFace(cx, w, h, { tiles: 4 }), { repeat: 7, px: 512 });
  const deck = cyl(g, 15, 15, 0.3, 0, -0.15, 0, 0x151b22, { rough: 0.55, metal: 0.2, seg: 64 });
  deck.material = texturedMat(pavingTex, { rough: 0.9, metal: 0.04, color: 0xd8dde3 });
  deck.receiveShadow = true;
  const plateTex = surfaceTexture((cx, w, h) => deckPlateFace(cx, w, h), { repeat: 22, px: 256 });
  const walkRing = cyl(g, 13.6, 13.6, 0.04, 0, 0.02, 0, 0x232b33, { rough: 0.6, metal: 0.5, seg: 64 });
  walkRing.material = texturedMat(plateTex, { rough: 0.55, metal: 0.55, color: 0xcfd6dd });
  walkRing.receiveShadow = true;
  cyl(g, 11.8, 11.8, 0.05, 0, 0.025, 0, 0x121920, { rough: 0.9, metal: 0.05, seg: 64, cast: false })
    .material = texturedMat(surfaceTexture((cx, w, h) => pavingFace(cx, w, h, { tiles: 3, base: "#1c242d", base2: "#171e26" }), { repeat: 5, px: 512 }), { rough: 0.9, metal: 0.04, color: 0xd0d6dc });
  // Station-accent glow ring and an inner hazard-yellow kerb line: the ring
  // takes the current station's colour so each sim's plaza is subtly its own.
  torus(g, 12.6, 0.05, 0, 0.03, 0, accent,
    { emissive: accent, ei: 1.6, rough: 0.4, cast: false, seg: 6, seg2: 72 });
  torus(g, 11.75, 0.02, 0, 0.055, 0, CITY.hiVis,
    { emissive: CITY.hiVis, ei: 0.6, rough: 0.5, cast: false, seg: 6, seg2: 72 });

  // Perimeter light masts.
  for (let i = 0; i < 8; i++) {
    const a = (i / 8) * Math.PI * 2 + Math.PI / 8;
    const mx = Math.sin(a) * 11.5, mz = Math.cos(a) * 11.5;
    cyl(g, 0.055, 0.075, 5.2, mx, 2.6, mz, 0x2b333c, { rough: 0.5, metal: 0.6, seg: 12 });
    const head = box(g, 0.5, 0.09, 0.26, mx, 5.2, mz, 0x2b333c, { rough: 0.5, metal: 0.6 });
    head.rotation.y = a;
    const lamp = box(g, 0.42, 0.03, 0.2, mx, 5.14, mz, 0xdfeaf2,
      { emissive: 0xdfeaf2, ei: 1.8, rough: 0.4, cast: false });
    lamp.rotation.y = a;
    const light = new THREE.PointLight(0xdfeaf2, 1.6, 16, 2);
    light.position.set(mx * 0.82, 4.6, mz * 0.82);
    g.add(light);
  }

  const sky = skyline(g);
  const marquee = buildMarquee(g);

  const key = new THREE.DirectionalLight(0xbcd4e8, 0.6);
  key.position.set(4, 9, 5);
  key.castShadow = true;
  key.shadow.mapSize.set(2048, 2048);
  key.shadow.camera.left = -9; key.shadow.camera.right = 9;
  key.shadow.camera.top = 9; key.shadow.camera.bottom = -9;
  key.shadow.bias = -0.0008;
  g.add(key);
  g.add(new THREE.HemisphereLight(0x6d8296, 0x121820, 1.1));
  // A soft overhead wash in the station's own accent — the one light that
  // changes per sim, so the same plaza reads warm for a boiler room and cool
  // for a chiller plant without rebuilding anything.
  const wash = new THREE.PointLight(accent, 1.1, 10, 2);
  wash.position.set(0, 4.2, 0.6);
  g.add(wash);
  // Cool rim from behind the marquee so silhouettes separate from the skyline.
  const rim = new THREE.DirectionalLight(0x6fb8ff, 0.35);
  rim.position.set(-3, 4, -8);
  g.add(rim);

  const beacons = sky.userData.beacons ?? [];
  return {
    root: g, ar,
    animate(t) {
      // Cheap flagship motion: rotate the holo-emblem, pulse its inner ring and the
      // marquee trim, and blink a handful of rooftop beacons — property tweaks on
      // already-built meshes/materials, nothing allocated per frame.
      marquee.emblem.rotation.y = t * 0.5;
      marquee.ring2.rotation.z = t * 0.8;
      marquee.trim.material.emissiveIntensity = 1.4 + Math.sin(t * 1.6) * 0.3;
      for (const beacon of beacons) {
        beacon.material.emissiveIntensity = 1.1 + Math.max(0, Math.sin(t * 1.4 + beacon.userData.phase)) * 1.4;
      }
    },
  };
}

      {
        "title": "What the site is",
        "body": "Hunters Point Naval Shipyard (HPNS) is an 866-acre former U.S. Navy shipyard on the southeast San Francisco waterfront. It has been on the EPA's National Priorities List (a Superfund site) since 1989. The Navy is the lead agency for investigation and cleanup; the U.S. EPA and California's regulators (DTSC and the Regional Water Board) oversee and enforce the Navy's work. Contamination includes radionuclides, PCBs, heavy metals, petroleum fuels, pesticides and volatile organic compounds, in soil and groundwater on land and in bay sediment offshore (the ~443-acre Parcel F).",

      {
        "title": "The data-integrity case",
        "body": "Between 2003 and 2014 the Navy's radiological remediation contractor, Tetra Tech EC, was required to survey soil and buildings and remediate excess radiation so parcels could be transferred to the city. Federal False Claims Act litigation alleged that employees and subcontractors substituted clean soil for potentially contaminated samples and fabricated radiological readings the Navy relied on. A Navy review found roughly 48% of the contractor's radiological data suspect or showing signs of manipulation; an EPA letter raised concerns about a far larger share in parts of the site. In August 2026 a federal judge approved a $57 million settlement of the government's False Claims Act claims; the company did not admit liability, and the settlement does not resolve a separate suit by homeowners.",
        "source": {
          "label": "U.S. Department of Justice press release (2026)",
          "url": "https://www.justice.gov/opa/pr/tetra-tech-ec-inc-agrees-pay-57m-settle-false-claims-act-allegations-falsifying-soil-test"
        }
      },
      {
        "title": "The community and the litigation",
        "body": "Bayview Hunters Point is a residential neighborhood next to the shipyard fence. Greenaction for Health and Environmental Justice filed a federal lawsuit against the Navy in 2024 alleging the cleanup is not protective of human health and the environment; a court hearing on it was held in February 2026, and in June 2026 Greenaction and the Marie Harrison Community Foundation issued a public call to action and demands. Marie Harrison (1948–2019) was a Greenaction organizer, a Bayview resident for decades and, as a young woman, a worker at the shipyard; residents later installed neighborhood air monitors in her memory. That community air-monitoring effort, run by Greenaction with the Marie Harrison Community Foundation, is the independent neighborhood air record this station points you to — there is no on-site monitoring program of ours here.",
        "source": {
          "label": "Greenaction — Bayview Hunters Point",
          "url": "https://greenaction.org/bayview-hunters-point/"

/* ===== smartcity/js/scenarios.js ===== */
// User-created scenarios: let a learner or instructor build their own drill
// out of a real simulator's real steps, and run it through the exact same
// procedure engine that scores every built-in SmartCiti.X station.
//
// A custom scenario never invents new 3D content or new hazards — it curates
// and reorders the *existing* steps of one base simulator (the station it was
// built from is what gets constructed and walked). That keeps every custom
// drill grounded in an authored, reviewed procedure instead of arbitrary
// user-typed text standing in for real training content, and it means the
// engine, the hazards, the gamified rank system and the 3D station all keep
// working exactly as they already do — nothing new to verify there.

const SCENARIO_STORE_KEY = "smartcity-custom-scenarios-v1";
const MAX_SCENARIOS = 30;

/**
 * Local-only library of custom scenario descriptors. A descriptor is plain
 * data (never functions), so it survives localStorage round-tripping:
 * { id, baseId, name, tagline, stepIds, parSeconds, createdAt }
 */
const CustomScenarios = {
  list() {
    try {
      const raw = JSON.parse(localStorage.getItem(SCENARIO_STORE_KEY) || "[]");
      return Array.isArray(raw) ? raw : [];
    } catch (_) { return []; }
  },

  get(id) { return this.list().find((e) => e.id === id) ?? null; },

  save(entry) {
    const all = this.list();
    const i = all.findIndex((e) => e.id === entry.id);
    if (i >= 0) all[i] = entry;
    else all.push(entry);
    // Oldest-first eviction rather than a hard refusal once the shelf is full —
    // a local library should keep working, not block a save with an error.
    while (all.length > MAX_SCENARIOS) all.shift();
    try { localStorage.setItem(SCENARIO_STORE_KEY, JSON.stringify(all)); } catch (_) { /* ignore */ }
    return entry;
  },

  remove(id) {
    const all = this.list().filter((e) => e.id !== id);
    try { localStorage.setItem(SCENARIO_STORE_KEY, JSON.stringify(all)); } catch (_) { /* ignore */ }
  },
};

/** A short, collision-safe id with no dependency on crypto.randomUUID. */
function newScenarioId() {
  return `${Date.now().toString(36)}-${Math.random().toString(36).slice(2, 8)}`;
}

/**
 * The par time a drill gets when its author leaves "Par time" blank: the
 * base sim's own par, scaled down by how much of the procedure survived the
 * cut. Shared by buildCustomRoom() (the room that's actually played) and
 * app.js's customRoomMeta() (the hub-card/roster preview of that same room)
 * so the two can never quote a different number for the same drill. Takes
 * plain counts rather than the base sim object itself: customRoomMeta()
 * only ever has the lightweight SIMS_META entry (a `stepCount` number, no
 * `steps` array), while buildCustomRoom() has the fully-loaded sim module.
 */
function estimateParSeconds(baseParSeconds, totalSteps, keptSteps) {
  const fraction = totalSteps ? keptSteps / totalSteps : 1;
  return Math.max(45, Math.round(baseParSeconds * fraction));
}

/**
 * Build a full room-shaped object from a base simulator plus a scenario
 * descriptor. The result is a real drop-in room: same build() (so the same
 * 3D station, the same interactables, the same hazards), same gamified
 * system (so it ranks and pays out in that trade's own currency), but with
 * `steps` narrowed and reordered to whatever the author kept. `Session`,
 * `Progress`, the hub and the leaderboard never need to know a room is
 * custom — they only ever see the shape they already understand.
 */
function buildCustomRoom(baseSim, entry) {
  const byId = new Map(baseSim.steps.map((s) => [s.id, s]));
  const steps = entry.stepIds.map((id) => byId.get(id)).filter(Boolean);
  return {
    ...baseSim,
    id: `custom:${entry.id}`,
    index: "★",
    domain: "Custom",
    name: entry.name,
    title: `${entry.name} — Custom Drill`,
    tagline: entry.tagline?.trim() || `A custom drill built from ${baseSim.name}: ${steps.length} of ${baseSim.steps.length} steps.`,
    parSeconds: entry.parSeconds ?? estimateParSeconds(baseSim.parSeconds, baseSim.steps.length, steps.length),
    steps,
    isCustom: true,
    baseId: baseSim.id,
    baseName: baseSim.name,
    build: (root) => baseSim.build(root),
  };
}

// never a shared platform score, because there isn't one.

/** Clip a single line to `maxWidth` with an ellipsis, using the context's current font. */
function fitText(g, text, maxWidth) {
  let s = String(text);
  if (g.measureText(s).width <= maxWidth) return s;
  while (s.length > 1 && g.measureText(s + "…").width > maxWidth) s = s.slice(0, -1);
  return s.trimEnd() + "…";
}

function buildHub(root, sims) {
  const hits = {};
  const reg = (obj, id) => { markInteractive(obj, id); hits[id] = obj; return obj; };
  // Scale the ring so kiosk spacing stays roughly constant as the roster grows —
  // 6.4 was tuned for 10 kiosks; keep that floor so a smaller roster never crowds.
  const R = Math.max(6.4, sims.length * 0.4);

  // deck-plate walk ring under the kiosks so the selector lane reads as a
  // different, tougher surface than the paving inside it.

  floor.material = texturedMat(
    surfaceTexture((cx, w, h) => pavingFace(cx, w, h, { tiles: 4, base: "#161e27", base2: "#111820" }), { repeat: 6, px: 512 }),
    { rough: 0.9, metal: 0.04, color: 0xd6dbe1 });
  floor.receiveShadow = true;
  const lane = cyl(root, R + 0.9, R + 0.9, 0.03, 0, 0.012, 0, 0x232b33, { rough: 0.6, metal: 0.5, seg: 64, cast: false });
  lane.material = texturedMat(surfaceTexture((cx, w, h) => deckPlateFace(cx, w, h), { repeat: 16, px: 256 }),
    { rough: 0.55, metal: 0.55, color: 0xcfd6dd });
  lane.receiveShadow = true;
  cyl(root, R - 1.1, R - 1.1, 0.035, 0, 0.018, 0, 0x121920, { rough: 0.9, metal: 0.05, seg: 64, cast: false })
    .material = texturedMat(surfaceTexture((cx, w, h) => pavingFace(cx, w, h, { tiles: 3, base: "#1b232c", base2: "#161d25" }), { repeat: 4, px: 512 }),
      { rough: 0.9, metal: 0.04, color: 0xd0d6dc });

    box(kiosk, 1.08, 0.04, 0.24, 0, 2.13, 0, sim.accent, { emissive: sim.accent, ei: 1.6, rough: 0.4, cast: false });

    const indexBadge = decal(kiosk, 0.3, 0.3, -0.3, 1.7, 0.1, () => {}, { px: 256, glow: true, ei: 0.7 });

    doorFaces[sim.id] = { indexBadge, sign, record, sim };

        g.fillStyle = "#8fb3c4";
        g.font = `600 ${Math.round(h * 0.09)}px 'Barlow Condensed', Arial, sans-serif`;
        g.textAlign = "center"; g.textBaseline = "middle";

        g.fillStyle = "#eaf6fb";
        g.font = `600 ${Math.round(h * 0.24)}px 'Barlow Condensed', Arial, sans-serif`;
        g.fillText(sim.name.toUpperCase(), w / 2, h * 0.37);
        g.fillStyle = accentCss;
        g.font = `${Math.round(h * 0.095)}px Arial, sans-serif`;
        g.fillText(sim.trade, w / 2, h * 0.58);
        // The real union + credential for this trade, split at the em dash so
        // the union sits on its own line and the credential is clipped to fit.
        const [union, credential] = String(sim.certification ?? "").split(" — ");
        g.fillStyle = "#c9dbe6";
        g.font = `600 ${Math.round(h * 0.08)}px 'Barlow Condensed', Arial, sans-serif`;
        g.fillText((union ?? "").toUpperCase(), w / 2, h * 0.74);
        g.fillStyle = "#6d8296";
        g.font = `${Math.round(h * 0.07)}px Arial, sans-serif`;
        g.fillText(fitText(g, credential ?? "", w * 0.92), w / 2, h * 0.87);
      });
      const rank = Progress.simRank(sim.id, sim.game);
      const state = Progress.roomState(sim.id);
      repaint(record, (g, w, h) => {
        g.fillStyle = "rgba(10,16,22,0.9)"; g.fillRect(0, 0, w, h);

        g.textAlign = "left"; g.textBaseline = "middle";
        g.fillStyle = "#8fb3c4";

        g.font = `600 ${Math.round(h * 0.2)}px 'Barlow Condensed', Arial, sans-serif`;
        g.fillText(rank.name.toUpperCase(), w * 0.07, h * 0.42);
        g.fillStyle = accentCss;
        g.font = `600 ${Math.round(h * 0.13)}px 'Barlow Condensed', Arial, sans-serif`;
        g.textAlign = "right";
        g.fillText(`${rank.xp} ${sim.game?.currency ?? "XP"}`, w * 0.93, h * 0.42);
        g.textAlign = "left";
        g.fillStyle = "#1d2833"; g.fillRect(w * 0.07, h * 0.58, w * 0.86, h * 0.08);
        g.fillStyle = accentCss;
        g.fillRect(w * 0.07, h * 0.58, w * 0.86 * (rank.max ? 1 : Math.max(0.02, rank.into / Math.max(1, rank.span))), h * 0.08);
        g.fillStyle = "#8fb3c4";
        g.font = `${Math.round(h * 0.095)}px Arial, sans-serif`;
        const stars = "★".repeat(state.stars) + "☆".repeat(3 - state.stars);
        g.fillText(state.runs ? `${stars}  best ${state.best}` : "not attempted", w * 0.07, h * 0.78);
        const badgeCount = state.badges?.length ?? 0;
        g.fillText(badgeCount ? `${badgeCount} badge${badgeCount === 1 ? "" : "s"} earned` : "no badges yet", w * 0.07, h * 0.92);
      });
    }
  }
  paintKiosks();

  const key = new THREE.DirectionalLight(0xdbe6f2, 0.85);
  key.position.set(3, 8, 4);
  key.castShadow = true;
  key.shadow.mapSize.set(2048, 2048);
  key.shadow.camera.left = -10; key.shadow.camera.right = 10;
  key.shadow.camera.top = 10; key.shadow.camera.bottom = -10;
  key.shadow.bias = -0.0008;
  root.add(key);
  root.add(new THREE.HemisphereLight(0x8ea9c2, 0x1e242b, 1.4));
  const rim = new THREE.DirectionalLight(0x6fb8ff, 0.3);
  rim.position.set(-4, 5, -7);
  root.add(rim);

  return {
    hits,
    isHub: true,
    spawnLook: new THREE.Vector3(0, 1.5, 0),
    refresh() { paintKiosks(); },
    animate(t) {
      beacon.material.emissiveIntensity = 2.0 + Math.sin(t * 1.5) * 0.7;
      beacon.position.y = 1.35 + Math.sin(t * 0.8) * 0.04;
      halo.rotation.z = t * 0.4;
      halo.position.y = beacon.position.y;
    },
  };
}


/* ===== smartcity/js/store.js ===== */
/**
 * A minimal reactive store — just enough pub-sub to let app.js (the Three.js
 * engine) hand its UI state to react-ui.js (the 2D chrome) without either
 * side reaching into the other's DOM. Every write replaces the whole state
 * object (or a named slice of it) so React's useSyncExternalStore can tell
 * "changed" from "same" with a plain reference check.
 */
function createStore(initial) {
  let state = initial;
  const subs = new Set();

  function get() {
    return state;
  }

  function set(patch) {
    state = typeof patch === "function" ? patch(state) : { ...state, ...patch };
    for (const fn of subs) fn(state);
  }

  /** Shallow-merge `partial` (or the object a function of the previous slice
   * returns) into the named top-level slice, e.g. "hud". */
  function patch(key, partial) {
    const prev = state[key];
    const delta = typeof partial === "function" ? partial(prev) : partial;
    set({ [key]: { ...prev, ...delta } });
  }

  function subscribe(fn) {
    subs.add(fn);
    return () => subs.delete(fn);
  }

  return { get, set, patch, subscribe };
}

/* ===== smartcity/js/app.js ===== */
// The 20 sims are lazy-loaded: SIMS_META (see tools/gen_sims_meta.mjs) is the
// small, always-available metadata every display surface (hub kiosks,
// leaderboards, the tour, the editor's base-simulator picker) actually needs;
// a sim's real module — its steps, hazards and build() — is only fetched via
// loadSim() the moment a player actually enters it. This is why
// dist/smartcity-x.html ships as a folder (index.html + sims/ + citykit.js +
// gamify.js) rather than one self-contained file: see tools/bundle_webxr.py.
const SIMS_META_BY_ID = Object.fromEntries(SIMS_META.map((s) => [s.id, s]));
// Crew tags and custom-scenario names are learner-typed text that ends up
// inside HTML template strings (results card, leaderboards) rendered via
// react-ui.js's dangerouslySetInnerHTML — escape before interpolating so a
// tag like `<b>` typed as a crew name renders literally instead of as
// markup on a shared kiosk's next screen.
function escapeHtml(s) {
  return String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
const AR_DIORAMA_SCALE = 0.34; // tabletop scale so a 2 m station fits on a desk

const simModuleCache = new Map();
function loadSim(id) {
  if (simModuleCache.has(id)) return simModuleCache.get(id);
  const exportName = `SIM_${id.toUpperCase().replace(/-/g, "_")}`;
  const promise = import(`./sims/${id}.js`).then((mod) => mod[exportName]);
  simModuleCache.set(id, promise);
  return promise;
}

// The 20 built-in stations plus whatever the learner has built in the
// scenario editor — the hub, the leaderboard and every sim lookup work off
// this combined roster so a custom drill is a first-class citizen everywhere
// a built-in one is, with zero special-casing downstream. This is metadata
// only (never a custom room's full steps/build) — see loadSim()/findSim()
// for what actually runs a station.
// Cached rather than rebuilt on every call: this is read on every HUD sync —
// several times a second during an active run with combos and streaks
// firing. Invalidated only where the roster can actually change: saving or
// deleting a custom scenario.
let allSimsCache = null;
function invalidateSimsCache() { allSimsCache = null; }
function customRoomMeta(entry) {
  const base = SIMS_META_BY_ID[entry.baseId];
  if (!base) return null;
  return {
    ...base,
    id: `custom:${entry.id}`,
    index: "★",
    domain: "Custom",
    name: entry.name,
    title: `${entry.name} — Custom Drill`,
    tagline: entry.tagline?.trim() || `A custom drill built from ${base.name}: ${entry.stepIds.length} of ${base.stepCount} steps.`,
    parSeconds: entry.parSeconds ?? estimateParSeconds(base.parSeconds, base.stepCount, entry.stepIds.length),
    isCustom: true,
    baseId: base.id,
    baseName: base.name,
  };
}
function allSims() {
  if (!allSimsCache) allSimsCache = [...SIMS_META, ...CustomScenarios.list().map(customRoomMeta).filter(Boolean)];
  return allSimsCache;
}
/** True the instant a real or custom sim COULD be entered, with no fetch —
 * used to decide hub-vs-enter before actually awaiting findSim(). */
function simExists(id) {
  if (SIMS_META_BY_ID[id]) return true;
  if (typeof id === "string" && id.startsWith("custom:")) {
    const entry = CustomScenarios.get(id.slice(7));
    return !!(entry && SIMS_META_BY_ID[entry.baseId]);
  }
  return false;
}
async function findSim(id) {
  if (SIMS_META_BY_ID[id]) return loadSim(id);
  if (typeof id === "string" && id.startsWith("custom:")) {
    const entry = CustomScenarios.get(id.slice(7));
    if (!entry) return null;
    const base = await loadSim(entry.baseId);
    if (!base) return null;
    return buildCustomRoom(base, entry);
  }
  return null;
}

// Launch identity (an LMS/portal URL or an embedding page's postMessage)

function identityLabel() {
  const id = Identity.current;

  return `Launched as ${id.name}${id.id !== id.name ? ` (${id.id})` : ""}${host}`;
}
function applyIdentity() {

}
Identity.load();

let vrHudDirty = true;

function setRail(kind, html) {

function syncHud() {
  const s = state.session;
  if (!s) {
    store.patch("hud", {
      room: "SMARTCITI.X",
      step: "Choose a station",
      cue: "Select a kiosk to start that station's procedure and rank ladder.",
      score: "----", comboText: `LV ${Progress.level} · ${Progress.levelName.toUpperCase()}`, comboHot: false, comboFire: false,
      count: `${Progress.roomsClearedIn(allSims().map((s) => s.id))}/${allSims().length} CLEARED`,
      fillPct: (Progress.roomsClearedIn(allSims().map((s) => s.id)) / allSims().length) * 100,
      timer: "",
      gestureVisible: false,
    });
    vrHudDirty = true;
    return;
  }
  const rank = Progress.simRank(s.room.id, s.room.game);
  const secs = Math.floor(s.elapsed);
  const patch = {
    room: state.tour ? `TOUR ${state.tour.i + 1}/${SIMS_META.length} · ${s.room.title.toUpperCase()}` : s.room.title.toUpperCase(),
    score: String(Math.round(s.score)).padStart(4, "0"),
    comboText: s.comboLabel ? `${s.comboLabel.toUpperCase()} ×${s.combo.toFixed(1)}` : rank.name,
    comboHot: s.streak >= 4,
    comboFire: s.combo >= 1.8,
    count: `STEP ${Math.min(s.index + 1, s.steps.length)}/${s.steps.length}`,
    fillPct: s.progress01 * 100,
    timer: `${String(Math.floor(secs / 60)).padStart(2, "0")}:${String(secs % 60).padStart(2, "0")} / ${
      String(Math.floor(s.room.parSeconds / 60)).padStart(2, "0")}:${String(s.room.parSeconds % 60).padStart(2, "0")}`,
  };
  const step = s.step;
  if (step) {
    let cue = step.cue;
    if (step.kind === "sequence" || step.kind === "find") cue += `  (${s.sequence.length}/${step.targets.length})`;
    if (step.kind === "hold" || step.kind === "track") cue += `  (${s.holdFor.toFixed(1)}s / ${step.seconds}s)`;
    if (step.kind === "turn" && s.turn) cue += `  (${Math.round((s.turn.amount / s.turn.required) * 100)}%)`;
    const hint = GESTURE_HINTS[step.kind];
    patch.step = step.title;
    patch.cue = cue;
    patch.gestureVerb = hint?.verb ?? "";
    patch.gestureVisible = !!hint;
  }
  store.patch("hud", patch);
  vrHudDirty = true;
}

// ------------------------------------------------------------- world objects

const state = {
  mode: "flat",          // "ar" | "vr" | "flat"
  roomRoot: null,
  api: null,
  room: null,
  session: null,
  hits: {},
  selectables: [],
  hovered: null,
  paused: true,
  placed: false,          // AR: has the learner tapped a surface yet
  stage: null,
  tour: null,             // { i } while walking the built-in curriculum in order
};

const hint = new THREE.Group();
const hintRing = new THREE.Mesh(
  new THREE.TorusGeometry(0.42, 0.022, 8, 36),
  new THREE.MeshBasicMaterial({ color: 0x4fd1ff, transparent: true, opacity: 0.85 }));
hintRing.rotation.x = -Math.PI / 2;
hint.add(hintRing);
const hintPip = new THREE.Mesh(new THREE.OctahedronGeometry(0.07), new THREE.MeshBasicMaterial({ color: 0x4fd1ff }));
hint.add(hintPip);
hint.visible = false;
worldRoot.add(hint);
const hintTargets = [];

const gauge = new THREE.Group();
gauge.visible = false;
const gaugePanel = decal(gauge, 0.62, 0.2, 0, 0, 0, () => {}, { px: 512, glow: true, ei: 0.5 });
const gaugeReadout = decal(gauge, 0.28, 0.09, 0, 0.16, 0.002, () => {}, { px: 256, glow: true, ei: 0.7 });
const gaugeMarker = new THREE.Mesh(new THREE.BoxGeometry(0.012, 0.1, 0.014), new THREE.MeshBasicMaterial({ color: 0xffffff }));
gaugeMarker.position.z = 0.006;
gauge.add(gaugeMarker);
worldRoot.add(gauge);
let gaugeReadoutAt = 0;

// A hot-streak or a satisfying carry/turn completion gets a one-shot particle
// burst right where the learner's hands are — anchored to worldRoot so a
// world position just needs converting into its local space to fire it.
const burst = celebrationBurst(worldRoot, { color: 0xffe37a });
let lastActivatedId = null;
function burstAtHit(id) {
  const obj = id && state.hits[id];
  if (!obj) return;
  const p = new THREE.Vector3();
  obj.getWorldPosition(p);
  worldRoot.worldToLocal(p);
  burst.fire(p);
}

// One-time, just-in-time teaching: the first time a learner's own play
// history ever reaches a given step kind, explain the physical gesture it
// wants — after that it never interrupts again, trusting the HUD gesture
// chip (and by then, muscle memory) to carry it.
const GESTURE_SEEN_KEY = "smartcity-gestures-seen";
let gestureTipTimer = null;
function hasSeenGesture(kind) {
  try { return JSON.parse(localStorage.getItem(GESTURE_SEEN_KEY) || "[]").includes(kind); }
  catch (_) { return true; } // if storage is blocked, don't nag every single step
}
function markGestureSeen(kind) {
  try {
    const seen = new Set(JSON.parse(localStorage.getItem(GESTURE_SEEN_KEY) || "[]"));
    seen.add(kind);
    localStorage.setItem(GESTURE_SEEN_KEY, JSON.stringify([...seen]));
  } catch (_) { /* ignore */ }
}
function maybeShowGestureTip(kind) {
  const hint = GESTURE_HINTS[kind];
  if (!hint || hasSeenGesture(kind)) return;
  markGestureSeen(kind);
  store.patch("gestureTip", { html: `<b>${hint.verb}</b><br>${hint.tip}`, show: true });
  clearTimeout(gestureTipTimer);
  gestureTipTimer = setTimeout(() => store.patch("gestureTip", { show: false }), 5200);
}

function paintGaugeBand(step) {
  const [lo, hi] = step.gauge.green ?? [0.44, 0.62];
  repaint(gaugePanel, (g, w, h) => {
    g.fillStyle = "rgba(6,14,20,0.94)"; g.fillRect(0, 0, w, h);
    g.strokeStyle = HUD.edge; g.lineWidth = 3; g.strokeRect(1.5, 1.5, w - 3, h - 3);
    g.fillStyle = HUD.muted;
    g.font = `600 ${Math.round(h * 0.17)}px 'Barlow Condensed', Arial, sans-serif`;
    g.textAlign = "left"; g.textBaseline = "middle";
    g.fillText(step.gauge.label ?? "SET THE VALUE", w * 0.05, h * 0.2);
    const barY = h * 0.5, barH = h * 0.3, x0 = w * 0.05, x1 = w * 0.95;
    g.fillStyle = "#1d2833"; g.fillRect(x0, barY - barH / 2, x1 - x0, barH);
    g.fillStyle = "rgba(89,201,123,0.85)";
    g.fillRect(x0 + (x1 - x0) * lo, barY - barH / 2, (x1 - x0) * (hi - lo), barH);
    g.strokeStyle = HUD.good; g.lineWidth = 2;
    g.strokeRect(x0 + (x1 - x0) * lo, barY - barH / 2, (x1 - x0) * (hi - lo), barH);
    g.fillStyle = HUD.muted;
    g.font = `${Math.round(h * 0.14)}px Arial, sans-serif`;
    g.textAlign = "center";
    g.fillText("select to commit", w / 2, h * 0.87);
  });
}
function placeGauge(targetObj) {
  if (!targetObj) return;
  const boxHelper = new THREE.Box3().setFromObject(targetObj);
  const c = boxHelper.getCenter(new THREE.Vector3());
  gauge.position.set(c.x, Math.min(Math.max(boxHelper.max.y + 0.3, 1.0), 2.0), c.z);
}

// ------------------------------------------------------------ scene lifecycle

function clearRoom() {
  if (state.roomRoot) { disposeTree(state.roomRoot); state.roomRoot = null; }
  if (state.stage) { disposeTree(state.stage.root); state.stage = null; }
  state.api = null;
  state.hits = {};
  state.selectables = [];
  state.hovered = null;
  hint.visible = false;
  gauge.visible = false;
  store.patch("flat", { visible: false });
}

function collectSelectables() {
  state.selectables = [];
  for (const id of Object.keys(state.hits)) {
    state.hits[id].traverse((o) => { if (o.isMesh) state.selectables.push(o); });
  }
}

function resetPlacement() {
  placement.position.set(0, 0, 0);
  placement.quaternion.identity();
  placement.scale.setScalar(state.mode === "ar" ? AR_DIORAMA_SCALE : 1);
  state.placed = state.mode !== "ar";
}

function enterHub() {
  clearRoom();
  state.session = null;
  state.room = null;
  const stage = buildStage(worldRoot, state.mode, scene);
  state.stage = stage;
  const root = new THREE.Group();
  worldRoot.add(root);
  state.roomRoot = root;
  state.api = buildHub(root, allSims());
  state.hits = state.api.hits;
  collectSelectables();
  resetPlacement();
  if (state.mode !== "ar") { rig.position.set(0.4, 0, 4.9); rig.rotation.y = 0; }
  else { rig.position.set(0, 0, 0); }
  yaw = 0; pitch = 0;
  camera.rotation.set(0, 0, 0);
  store.patch("arPrompt", { visible: state.mode === "ar" });
  store.patch("scaleRow", { visible: state.mode === "ar" });
  setRail("neutral", `<b>SmartCiti.X training campus.</b> ${allSims().length} stations across ${categoryCount()} categories, each with its own rank ladder. Select a kiosk to begin.`);
  syncHud();
}

// Bumped on every call so a station whose dynamic import is still in flight
// can tell, once it resolves, whether it is still the one the player wants —
// two quick kiosk picks in a row must not race and land in the wrong room.
let enterSimToken = 0;
async function enterSim(id) {
  const myToken = ++enterSimToken;
  setRail("neutral", "<b>Loading station…</b>");
  const room = await findSim(id);
  if (myToken !== enterSimToken) return; // superseded by a later pick
  if (!room) { enterHub(); return; }
  const flat = !!(room.flat ?? SIMS_META_BY_ID[room.baseId]?.flat);
  if (flat && state.mode !== "flat") {
    // A dossier card cannot be shown inside an immersive session; say so
    // instead of dropping the learner into an empty scene.
    setRail("warn", `<b>${escapeHtml(room.name ?? room.title)}</b> is a flat briefing station — it runs on screen, not in AR/VR. Exit the headset view to open it.`);
    return;
  }
  clearRoom();
  const stage = buildStage(worldRoot, state.mode, scene, room.accent);
  state.stage = stage;
  const root = new THREE.Group();
  worldRoot.add(root);
  state.roomRoot = root;
  state.room = room;
  state.api = room.build(root);
  state.hits = state.api.hits;
  collectSelectables();
  resetPlacement();
  if (flat) {
    hint.visible = false; gauge.visible = false;
    store.patch("flat", {
      visible: true, name: room.name ?? room.title, category: room.category ?? "", tagline: room.tagline ?? "",
      certification: room.certification ?? "", dossier: room.dossier ?? SIMS_META_BY_ID[room.baseId]?.dossier ?? [],
      stepIndex: 0, stepCount: room.steps.length, question: "", cue: "", options: [], picked: [], feedback: null,
    });
  }

  if (state.mode !== "ar") {
    const spawnR = (room.footprint ?? 2) + 1.4;
    rig.position.set(0, 0, spawnR);
    rig.rotation.y = 0;
  } else {
    rig.position.set(0, 0, 0);
  }
  yaw = 0; pitch = 0;
  camera.rotation.set(0, 0, 0);
  document.documentElement.style.setProperty("--accent", room.accentCss);
  store.patch("arPrompt", { visible: state.mode === "ar" });
  store.patch("scaleRow", { visible: state.mode === "ar" });

  state.session = new Session(room, {
    onStep: (step, s) => {
      state.api.onStep?.(step, s);
      if (flat) { flatSyncStep(step, s); syncHud(); return; }
      updateHintForStep(step);
      if (step.kind === "gauge") { paintGaugeBand(step); placeGauge(state.hits[step.target]); gauge.visible = true; }
      else gauge.visible = false;
      maybeShowGestureTip(step.kind);
      syncHud();
    },
    onFeedback: (fb, s) => {
      state.api.onFeedback?.(fb, s);
      setRail(fb.kind === "ok" ? "ok" : fb.kind === "danger" ? "danger" : fb.kind === "partial" ? "neutral" : "warn", fb.text);
      if (fb.kind === "danger") { flashDanger(); if (fb.speech) announce(fb.speech); }
      if (fb.kind === "ok" && fb.points) {
        scorePop(`+${fb.points}`, fb.combo >= 1.6);
        if (fb.combo >= 1.6 && !flat) burstAtHit(lastActivatedId);
      }
      if (flat) store.patch("flat", { feedback: { kind: fb.kind, html: fb.text }, picked: [...s.sequence] });
      syncHud();
    },
    onStepComplete: (step, s) => { state.api.onStepComplete?.(step, s); },
    onHazard: (hitId, s) => { state.api.onHazard?.(hitId, s); },
    onFinish: (s, summary) => showResults(s, summary),
  });
  state.session.start();
  if (!flat) faceFirstTask();
  setRail("neutral", `<b>${escapeHtml(room.title)}</b> — ${escapeHtml(room.tagline)}. ${state.mode === "ar" ? "Tap a surface to place the station." : "Follow the procedure in order."}`);
  syncHud();
}

function faceFirstTask() {
  if (state.mode === "ar") return;
  const first = hintTargets[0];
  if (!first) return;
  const p = new THREE.Vector3();
  first.getWorldPosition(p);
  const dx = p.x - rig.position.x, dz = p.z - rig.position.z;
  if (Math.hypot(dx, dz) < 0.2) return;
  rig.rotation.y = Math.atan2(-dx, -dz);
}

function updateHintForStep(step) {
  hintTargets.length = 0;
  // A "find" step marked noHint is a search-among-decoys exercise (GESTURE_HINTS.find
  // literally tells the learner "some objects are decoys") — ringing the correct
  // targets would hand over the answer, so it gets no objective ring at all.
  if (!step || (step.kind === "find" && step.noHint)) { hint.visible = false; return; }
  const ids = step.kind === "sequence" || step.kind === "find" ? step.targets : [step.target];
  for (const id of ids) if (state.hits[id]) hintTargets.push(state.hits[id]);
  hint.visible = hintTargets.length > 0;
}

function flashDanger() {
  document.body.classList.add("danger-flash");
  setTimeout(() => document.body.classList.remove("danger-flash"), 420);
}

// ------------------------------------------------------------------- results

function showResults(s, summary) {
  const room = s.room;
  const rank = Progress.simRank(room.id, room.game);
  const stars = "★★★".slice(0, s.stars) + "☆☆☆".slice(0, 3 - s.stars);
  const mins = Math.floor(s.elapsed / 60), secs = Math.round(s.elapsed % 60);
  const earnedNames = s.earned
    .map((id) => [...(room.game?.badges ?? []), ...(room.game?.challenges ?? [])].find((a) => a.id === id))
    .filter(Boolean);
  const bodyHtml = `
    ${s.leveledUp ? `<div class="rank-up">LEVEL UP — ${escapeHtml(s.levelName.toUpperCase())} (LEVEL ${s.level})</div>` : ""}
    ${s.rankedUp ? `<div class="rank-up">RANK UP — ${escapeHtml(rank.name.toUpperCase())}</div>` : ""}
    <div class="res-stars">${stars}</div>
    <h2>${escapeHtml(room.title)}</h2>
    <p class="res-trade">${escapeHtml(room.game?.system ?? "")} · ${escapeHtml(rank.name)}</p>
    <dl class="res-grid">
      <div><dt>Score</dt><dd>${s.score}</dd></div>
      <div><dt>Time</dt><dd>${mins}:${String(secs).padStart(2, "0")}</dd></div>
      <div><dt>Errors</dt><dd>${s.errors}</dd></div>
      <div><dt>${room.game?.currency ?? "XP"}</dt><dd>${rank.xp}</dd></div>
      <div><dt>Personal best</dt><dd>${summary.best}</dd></div>
      <div><dt>Best combo</dt><dd>×${s.peakCombo.toFixed(1)}</dd></div>
    </dl>
    ${earnedNames.length ? `<div class="res-badges">${earnedNames.map((a) =>
      `<p class="res-badge"><b>${a.name}</b><span>${a.note}</span></p>`).join("")}</div>` : ""}
    <p class="res-note">${s.errors === 0
      ? "Clean run: every control taken in order, no unsafe action."
      : `${s.errors} correction${s.errors === 1 ? "" : "s"} — re-run for a cleaner pass.`}</p>
    ${s.leaderboard?.madeBoard
      ? `<p class="res-note"><b>New #${s.leaderboard.rank} on the local leaderboard</b> for ${escapeHtml(room.title)}, crew tag ${escapeHtml(Progress.playerName)}.</p>`
      : ""}
    ${state.tour ? renderTourFooter() : ""}`;
  // The auditable record of this attempt — separate from the gamified
  // Progress profile, exportable as CSV or xAPI from the Training Records
  // overlay. Custom scenarios record under their base station's category.
  const attempt = TrainingRecords.record({
    app: "smartcity", learner: Progress.playerName,
    learnerName: Identity.current?.name, learnerId: Identity.current?.id, homePage: Identity.current?.homePage,
    simId: room.id, simName: room.name ?? room.title, category: room.category ?? SIMS_META_BY_ID[room.baseId]?.category,
    trade: room.trade, certification: room.certification ?? SIMS_META_BY_ID[room.baseId]?.certification,
    system: room.game?.system,
    score: s.score, stars: s.stars, errors: s.errors, hazardHits: s.hazardHits, holdBreaks: s.holdBreaks,
    seconds: Math.round(s.elapsed), parSeconds: room.parSeconds,
    badges: earnedNames.map((a) => a.name), level: s.level, levelName: s.levelName,
  });
  // Hand the attempt to the hosting LMS page, if there is one and it told
  // us who the learner is — only ever to that origin (see identity.js).
  Identity.emit("smartcitix:record", { record: attempt });
  shipToLrs([attempt]);
  const touring = !!state.tour;
  const tourDone = touring && state.tour.i + 1 >= SIMS_META.length;
  store.patch("results", {
    visible: true,
    html: bodyHtml,
    showNext: touring && !tourDone,
    retryPrimary: !touring || tourDone,
  });
  state.paused = true;
  announce(`${room.title} complete. ${s.stars} star${s.stars === 1 ? "" : "s"}.` +
    (s.leveledUp ? ` Level up — ${s.levelName}, level ${s.level}.` : "") +
    (s.rankedUp ? ` Rank up — ${rank.name}.` : "") +
    (earnedNames.length ? ` ${earnedNames.map((a) => a.name).join(", ")} earned.` : "") +
    (s.leaderboard?.madeBoard ? ` New number ${s.leaderboard.rank} on the local leaderboard.` : ""));
}

/** Progress line shown on the results card while a guided tour is running. */
function renderTourFooter() {
  const done = state.tour.i + 1;
  const tourDone = done >= SIMS_META.length;
  return `<p class="res-note" style="color:var(--accent) !important">${
    tourDone
      ? `<b>That's all ${SIMS_META.length} stations.</b> The guided tour ends here — nice work.`
      : `<b>Guided tour: stop ${done} of ${SIMS_META.length} complete.</b> Next up: ${SIMS_META[done].name}.`
  }</p>`;
}

// ----------------------------------------------------------------- leaderboards

function renderLeaderboards() {
  const roster = allSims();
  const standing = Progress.suiteStanding(roster.map((s) => s.id));
  const cards = roster.map((room) => {
    const board = Progress.leaderboard(room.id);
    const rows = board.length
      ? `<table class="lb-table"><thead><tr><th>#</th><th>Crew</th><th>Score</th><th>Stars</th></tr></thead><tbody>${
          board.map((e, i) => `<tr class="${e.name === Progress.playerName ? "me" : ""}">
            <td>${i + 1}</td><td>${escapeHtml(e.name)}</td><td>${e.score}</td><td>${"★".repeat(e.stars)}</td></tr>`).join("")}
        </tbody></table>`

// ------------------------------------------------------------- scenario editor
//
// A custom scenario never invents new steps or new 3D content — it curates
// and reorders the real steps a real station already has, so it plays
// through the exact same engine, hazards and rank system as the original.

let edOrder = []; // [{ id, title, kind, on }] — the checklist's live working order

function edPopulateBaseOptions() {
  store.patch("editor", { baseValue: "", stepsVisible: false });
}

function edRenderSteps() {
  store.patch("editor", { steps: edOrder.map((s) => ({ ...s })) });
}

async function edLoadBase(simId) {
  if (!SIMS_META_BY_ID[simId]) { store.patch("editor", { baseValue: simId, stepsVisible: false }); return; }
  store.patch("editor", { baseValue: simId, stepsVisible: false });
  const sim = await loadSim(simId);
  // The picker may have moved on to a different (or no) base while this
  // station's module was still in flight — a stale response must not clobber
  // whatever the editor is showing now.
  if (store.get().editor.baseValue !== simId) return;
  if (!sim) { store.patch("editor", { error: "Could not load that simulator." }); return; }
  edOrder = sim.steps.map((s) => ({ id: s.id, title: s.title, kind: s.kind, on: true }));
  store.patch("editor", { name: "", tagline: "", par: "", error: "", stepsVisible: true });
  edRenderSteps();
}

function edToggleStep(i, on) { edOrder[i].on = on; edRenderSteps(); }
function edMoveStep(i, dir) {
  const j = i + dir;
  if (j < 0 || j >= edOrder.length) return;
  [edOrder[i], edOrder[j]] = [edOrder[j], edOrder[i]];
  edRenderSteps();
}
function edSetName(v) { store.patch("editor", { name: v }); }
function edSetPar(v) { store.patch("editor", { par: v }); }
function edSetTagline(v) { store.patch("editor", { tagline: v }); }
function edSelectBase(v) { edLoadBase(v); }

function edValidate() {
  const ed = store.get().editor;
  if (!ed.baseValue) return "Pick a base simulator first.";
  if (!ed.name.trim()) return "Give the scenario a name.";
  if (!edOrder.some((s) => s.on)) return "Keep at least one step.";
  // A number input can still hold an unparseable transient value (a bare
  // "-", for instance) — catch it here rather than silently saving a NaN
  // par time that would poison every future run's score (timeBonus = NaN).
  if (ed.par && !Number.isFinite(Number(ed.par))) return "Par time must be a number, or left blank.";
  return null;
}

function edEnter(customId) {
  store.patch("editor", { visible: false });
  pendingEnter = customId;
  begin();
}

function edSave(andPlay) {
  const err = edValidate();
  if (err) { store.patch("editor", { error: err }); return; }
  const ed = store.get().editor;
  const par = ed.par ? Math.max(30, Math.min(900, Number(ed.par))) : null;
  const entry = {
    id: newScenarioId(),
    baseId: ed.baseValue,
    name: ed.name.trim(),
    tagline: ed.tagline.trim(),
    stepIds: edOrder.filter((s) => s.on).map((s) => s.id),
    parSeconds: par,
    createdAt: Date.now(),
  };
  CustomScenarios.save(entry);
  invalidateSimsCache();
  edRenderLibrary();
  if (andPlay) edEnter(`custom:${entry.id}`);
  else store.patch("editor", { error: "", stepsVisible: false, baseValue: "" });
}
function edSavePlay() { edSave(true); }
function edSaveOnly() { edSave(false); }
function edCancel() { store.patch("editor", { stepsVisible: false, baseValue: "" }); }

function edRenderLibrary() {
  const list = CustomScenarios.list();
  const library = list.map((entry) => {
    const base = SIMS_META_BY_ID[entry.baseId];
    return {
      id: entry.id,
      name: entry.name,
      baseName: base ? base.name : "base simulator removed",
      stepCount: entry.stepIds.length,
      playable: !!base,
    };
  });

}

function edPlayLibrary(id) { edEnter(`custom:${id}`); }
function edDeleteLibrary(id) { CustomScenarios.remove(id); invalidateSimsCache(); edRenderLibrary(); }
