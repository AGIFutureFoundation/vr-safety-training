      why: "The lift is not finished when the load lands — it is finished when the rigging is recovered, the area is confirmed clear and the pick is logged for the next crew.",
    },
  ],

  build(root) {
    const hits = {};
    const g = group(root);
    stationPad(g, 2.1, 0x2f8fdb);

    // ------------------------------------------------------------------- yard
    box(g, 4.6, 0.14, 4.6, 0, 0.07, 0, 0x59606a, { rough: 0.92 });
    for (let i = -3; i <= 3; i++) box(g, 4.6, 0.004, 0.02, 0, 0.145, i * 0.7, 0x484f57, { cast: false, receive: false });

    // ------------------------------------------------------------------- the crane
    const crane = group(g, -1.0, 0, -1.3, 0.3);
    slab(crane, 1.0, 0.5, 1.7, 0, 0.32, 0, 0x545e67, { radius: 0.04, rough: 0.5, metal: 0.4 });
    for (const sx of [-1, 1]) for (const sz of [-1, 1]) {
      cyl(crane, 0.05, 0.05, 0.14, sx * 0.4, 0.07, sz * 0.7, 0x2b3138, { rough: 0.7, seg: 12 });
    }
    const cab = group(crane, 0, 0.75, 0.55);
    box(cab, 0.55, 0.42, 0.5, 0, 0, 0, 0x2f8fdb, { rough: 0.45, metal: 0.5 });
    box(cab, 0.4, 0.24, 0.02, 0, 0.02, -0.26, 0x9fd8ff, { rough: 0.2, opacity: 0.8, transparent: true });
    const boom = group(crane, 0, 0.8, -0.1, -0.1);
    box(boom, 3.4, 0.18, 0.18, 1.6, 0.35, 0, 0xf2c14b, { rough: 0.5, metal: 0.4 });
    holoTag(crane, "60 t mobile crane", 0, 1.3, 0.5, { css: "#2f8fdb", w: 0.4 });

    // Outriggers: four beams that extend on the setup step.
    const outriggerBeams = { front: [], rear: [] };
    for (const sz of [-1, 1]) {
      const key = sz < 0 ? "front" : "rear";
      for (const sx of [-1, 1]) {
        const beam = box(crane, 0.9, 0.09, 0.14, sx * 0.85, 0.14, sz * 0.75, 0x545e67, { rough: 0.5, metal: 0.5 });
        beam.scale.x = 0.15;
        const pad = cyl(crane, 0.14, 0.14, 0.03, sx * 1.5, 0.06, sz * 0.75, 0x2b3138, { rough: 0.7, seg: 16 });
        pad.visible = false;
        reg(hits, beam, key === "front" ? "outrigger-front" : "outrigger-rear");
        outriggerBeams[key].push({ beam, pad, sx });
      }
    }

    const bubbleHousing = group(crane, 0, 0.6, 0.3);
    box(bubbleHousing, 0.14, 0.06, 0.14, 0, 0, 0, 0x2b3138, { rough: 0.6 });
    const bubbleFace = decal(bubbleHousing, 0.12, 0.05, 0, 0.033, 0,
      signFace("LEVEL", { bg: "#0d1c24", accent: "#2f8fdb", fg: "#bfeaf7", scale: 0.5 }), { px: 200, glow: true, ei: 0.8 });
    bubbleFace.rotation.x = -Math.PI / 2;
    holoTag(bubbleHousing, "Level bubble", 0, 0.09, 0, { css: "#2f8fdb", w: 0.28 });
    reg(hits, bubbleHousing, "level-bubble");

    // ------------------------------------------------------------------- the load
    const hookCable = hose(g, [[0.45, 2.5, -0.7], [0.4, 1.6, 0.0], [0.35, 0.95, 0.15]], 0.014, CITY.steel,
      { steps: 18, rough: 0.5, metal: 0.6 });
    const hookBlock = group(g, 0.35, 0.9, 0.15);
    box(hookBlock, 0.1, 0.08, 0.1, 0, 0, 0, 0x2b3138, { rough: 0.5, metal: 0.5 });
    torus(hookBlock, 0.05, 0.012, 0, -0.06, 0, 0xd8b23a, { rough: 0.4, metal: 0.6, seg: 8, seg2: 16 });
    reg(hits, hookBlock, "hook-block");

    const load = group(g, 0.35, 0.4, 0.15);
    box(load, 0.5, 0.4, 0.5, 0, 0, 0, 0x8b929a, { rough: 0.5, metal: 0.4 });
    const slingHang = hose(load, [[-0.24, 0.5, -0.24], [0, 0.9, 0], [0.24, 0.5, 0.24]], 0.01, CITY.steel,
      { steps: 12, rough: 0.5, metal: 0.6 });
    reg(hits, load, "suspended-load");

    const swingShadow = box(g, 3.0, 0.005, 3.0, -1.0, 0.15, -1.3, 0x000000, { opacity: 0.16, transparent: true, cast: false });
    holoTag(swingShadow, "Swing radius", -1.0, 0.3, 0.3, { css: "#f0645b", w: 0.32 });
    reg(hits, swingShadow, "swing-radius-stand");

    const twoBlockZone = ball(g, 0.08, 0.4, 2.55, -0.75, 0xf0645b, { emissive: 0xf0645b, ei: 1.6, opacity: 0.7, transparent: true });
    holoTag(twoBlockZone, "Two-block limit", 0, 0.16, 0, { css: "#f0645b", w: 0.32 });
    reg(hits, twoBlockZone, "two-block-risk");

    // ------------------------------------------------------------------- rigging kit
    const chest = toolChest(g, 1.7, 1.2, { ry: -0.5, color: 0x2f8fdb });
    const ratedSling = group(chest, -0.14, 0.79, 0, 0.4);
    torus(ratedSling, 0.06, 0.012, 0, 0, 0, 0xf2c14b, { rough: 0.6, seg: 8, seg2: 18 });
    holoTag(ratedSling, "Rated sling", 0, 0.13, 0, { css: "#2f8fdb", w: 0.28 });
    reg(hits, ratedSling, "rated-sling");

    const kinkedSling = group(chest, 0.16, 0.79, 0.06, -0.3);
    torus(kinkedSling, 0.05, 0.012, 0, 0, 0, 0xb8402f, { rough: 0.7, seg: 8, seg2: 18 });
    box(kinkedSling, 0.03, 0.02, 0.02, 0.05, 0, 0, 0x6a3a2a, { rough: 0.8 });
    holoTag(kinkedSling, "Kinked sling", 0, 0.11, 0, { css: "#f0645b", w: 0.3 });
    reg(hits, kinkedSling, "kinked-sling");

    const shackle = group(chest, 0, 0.8, -0.16, 0.2);
    torus(shackle, 0.03, 0.008, 0, 0, 0, CITY.steel, { rough: 0.35, metal: 0.85, seg: 8, seg2: 16 });
    holoTag(shackle, "Rigging shackle", 0, 0.09, 0, { css: "#2f8fdb", w: 0.3 });
    reg(hits, shackle, "shackle");

    const angleTool = group(chest, -0.08, 0.79, -0.14, -0.3);
    box(angleTool, 0.1, 0.02, 0.02, 0, 0, 0, 0xdfe4e8, { rough: 0.4, metal: 0.6 });
    holoTag(angleTool, "Sling angle check", 0, 0.08, 0, { css: "#2f8fdb", w: 0.32 });
    reg(hits, angleTool, "sling-angle-check");

    // ------------------------------------------------------------------- people
    const signalPerson = standingFigure(g, 1.6, -0.6, { ry: -1.9, cloth: 0x2b3138, vest: 0xf2c14b, helmet: 0xf2f2f2 });
    holoTag(signalPerson, "Signal person", 0, 1.95, 0.15, { css: "#2f8fdb", w: 0.3 });
    reg(hits, signalPerson, "signal-person");

    const tagLine = group(g, 0.7, 0, 0.4, -0.3);
    hose(tagLine, [[0, 1.4, -0.25], [0.15, 0.6, -0.1], [0.3, 0.02, 0]], 0.008, 0xf2c14b, { steps: 14, rough: 0.75 });
    holoTag(tagLine, "Tag line", 0.3, 0.15, 0, { css: "#2f8fdb", w: 0.24 });
    reg(hits, tagLine, "tag-line-crane");

    const landingZone = group(g, 1.5, 0, 1.3);
    box(landingZone, 0.9, 0.02, 0.9, 0, 0.15, 0, 0x2f8fdb, { rough: 0.6, opacity: 0.5, transparent: true, cast: false });
    holoTag(landingZone, "Landing zone", 0, 0.28, 0, { css: "#2f8fdb", w: 0.3 });
    // A plain, non-interactive marker at the load's actual resting transform
    // (same footprint as the pad above, but at the load's own resting height,
    // not the pad's) — the drag step measures and snaps against this, never
    // against the pad itself.
    const loadSocket = group(g, 1.5, 0.2, 1.3);
    hits["load-socket"] = loadSocket;

    // ------------------------------------------------------------------- paperwork
    const plan = holoPanel(g, 0.58, 0.4, -1.9, 1.5, 1.6, (ctx, w, h) => {
      ctx.fillStyle = "rgba(6,16,22,0.9)"; ctx.fillRect(0, 0, w, h);
      ctx.fillStyle = "#2f8fdb"; ctx.fillRect(0, 0, w, 5);
      ctx.fillStyle = "#8fb3c4";
      ctx.font = `600 ${Math.round(h * 0.09)}px 'Barlow Condensed', Arial, sans-serif`;
      ctx.textAlign = "left"; ctx.textBaseline = "middle";
      ctx.fillText("LIFT PLAN · PICK 6", w * 0.06, h * 0.14);
      ctx.fillStyle = "#eaf6fb";
      ctx.font = `600 ${Math.round(h * 0.14)}px 'Barlow Condensed', Arial, sans-serif`;
      ctx.fillText("18,000 LB AT 30 FT RADIUS", w * 0.06, h * 0.33);
      ctx.font = `${Math.round(h * 0.085)}px Arial, sans-serif`;
      ctx.fillStyle = "#a9c6d6";
      ["Chart margin required: ≥ 25%", "Sling rated: 8,000 lb per leg",
       "Ground bearing: verified for pads", "Swing radius: 12 m, keep clear",
       "Signal person: dedicated, radio linked"].forEach((line, i) => ctx.fillText(line, w * 0.06, h * (0.5 + i * 0.11)));
    }, { ry: 0.7, accent: 0x2f8fdb });
    reg(hits, plan, "lift-plan");

    const chartPanel = instrument(chest, 0.16, 0.79, 0.06, { ry: -0.4, idle: "-- %", color: 0x2f8fdb });
    holoTag(chartPanel, "Load chart", 0, 0.16, 0, { css: "#2f8fdb", w: 0.3 });
    reg(hits, chartPanel, "load-chart");

    // Overload marker on the boom — the trap for a pick logged past the chart.
    const overloadMarker = group(boom, -0.6, 0.16, 0, 0);
    ball(overloadMarker, 0.03, 0, 0, 0, 0xf0645b, { emissive: 0xf0645b, ei: 1.8 });
    holoTag(overloadMarker, "Radius exceeds chart", 0, 0.1, 0, { css: "#f0645b", w: 0.34 });
    reg(hits, overloadMarker, "chart-exceeded");

    const craneLog = group(g, 1.9, 0, -0.6, 0.6);
    slab(craneLog, 0.4, 0.3, 0.03, 0, 1.1, 0, 0x1b232b, { radius: 0.01, rough: 0.6 });
    const logFace = decal(craneLog, 0.36, 0.26, 0, 1.1, 0.02,
      signFace("LIFT LOG\nOPEN", { bg: "#11181f", accent: "#2f8fdb", scale: 0.32 }), { px: 320 });
    holoTag(craneLog, "Lift log", 0, 1.32, 0, { css: "#2f8fdb", w: 0.28 });
    reg(hits, craneLog, "crane-log");

    let outriggersDown = false;

    return {
      hits,
      footprint: 2.1,

      // While the load is actually being carried by hand to its landing spot,
      // the crane's own hook and cable would otherwise stay frozen pointing
      // at wherever the load started — hiding them for the moment reads as
      // "guided in by the tag line" rather than a visibly broken rig.
      onDragStart(id) {
        if (id !== "suspended-load") return;
        hookCable.visible = false;
        hookBlock.visible = false;
      },
      onDragEnd(id) {
        if (id !== "suspended-load") return;
        hookCable.visible = true;
        hookBlock.visible = true;
      },

      onStepComplete(step) {
        if (step.id === "outrigger-setup") {
          outriggersDown = true;
          for (const key of ["front", "rear"]) {
            for (const o of outriggerBeams[key]) { o.beam.scale.x = 1; o.pad.visible = true; }
          }
        }
        // load's own position/rotation are already set by the drag-and-drop
        // gesture itself (app.js snaps it onto load-socket on a successful
        // drop) — nothing to do here.
        if (step.id === "log-lift") {
          repaint(logFace, signFace("LIFT LOG\nCLOSED", { bg: "#0f1b14", accent: "#59c97b", fg: "#bff7d4", scale: 0.32 }));
        }
      },

      onHazard() {},

      animate(t, dt, session) {
        signalPerson.userData.head.rotation.y = Math.sin(t * 0.7) * 0.5;
        twoBlockZone.material.emissiveIntensity = 1.3 + Math.sin(t * 3) * 0.5;
        if (!outriggersDown) boom.rotation.z = Math.sin(t * 0.3) * 0.01;

        const gg = session?.gauge;
        if (gg && !gg.committed) {
          if (session.step?.id === "level-check") {
            const off = ((gg.t - 0.5) * 6).toFixed(1);
            repaint(bubbleFace, signFace(`${off}°`, {
              bg: "#0d1c24", accent: gg.t > 0.46 && gg.t < 0.58 ? "#59c97b" : "#f0645b", fg: "#bfeaf7", scale: 0.45,
            }));
          }
          if (session.step?.id === "load-chart") {
            const pct = Math.round(gg.t * 100);
            repaint(chartPanel.userData.screen, signFace(`${pct}%`, {
              bg: "#0d1c24", accent: gg.t > 0.55 && gg.t < 0.85 ? "#59c97b" : "#f0645b", fg: "#bfeaf7", scale: 0.55,
            }));
          }
        }
      },
    };
  },
};

      gauge: {

      why: "A ladder within 25 feet means an exit is never more than a few steps away, in the trench or on the surface, in an emergency that gives you no time to walk further.",
    },
    {
      id: "spotter-comm", kind: "hold", target: "spotter", seconds: 8,
      title: "Maintain contact with the spotter",
      cue: "Hold continuous contact with the surface spotter while work is underway below grade.",
      why: "The spotter watches the walls, the spoil pile and the surrounding area the whole time you cannot, because your attention below grade is on the pipe, not the edge.",
      holdBreakNote: "Contact with the spotter dropped. Re-establish it and hold it for the whole task — nobody works below grade unwatched.",
    },
    {
      id: "pipe-work", kind: "select", target: "utility-line",
      title: "Complete the utility line repair",
      cue: "Make the repair to the utility line now that the trench is shored and tested.",
      why: "The actual task only starts once guarding, inspection, atmosphere and shoring are all already in place — not run in parallel with them to save time.",
    },
    {
      id: "exit-count", kind: "select", target: "headcount-board",
      title: "Take a headcount before backfill",
      cue: "Confirm everyone is out of the trench and account for tools before anything closes up.",
      why: "A headcount against the crew list is what confirms the trench is actually empty — not an assumption because the ladder looked clear from the surface.",
    },
    {
      id: "remove-box", kind: "select", target: "trench-box",
      title: "Remove the protective box",
      cue: "Lift the box clear once the crew is out and the trench is ready to close.",
      why: "The box comes out only after everyone is confirmed clear of the trench — removing protection with anyone still below grade defeats the entire point of having placed it.",
    },
    {
      id: "backfill", kind: "select", target: "backfill-panel",
      title: "Backfill and compact",
      cue: "Backfill the trench in lifts and compact each one before signing off.",
      why: "Backfilling in compacted lifts is what keeps the surface from settling later and undoing the repair that was just made underneath it.",
    },
  ],

  build(root) {
    const hits = {};
    const g = group(root);
    stationPad(g, 2.1, 0x7ed321);

    // ------------------------------------------------------------------ ground
    box(g, 4.6, 0.14, 4.6, 0, 0.07, 0, 0x6b5a3f, { rough: 0.95 });

    // ------------------------------------------------------------------ the trench
    const trench = group(g, -0.2, 0, -0.1);
    const trenchW = 0.9, trenchL = 2.6, trenchD = 1.1;
    box(trench, trenchW, 0.02, trenchL, 0, -trenchD / 2, 0, 0x2b2118, { rough: 0.98, cast: false });
    for (const sx of [-1, 1]) {
      box(trench, 0.06, trenchD, trenchL, sx * trenchW / 2, -trenchD / 2, 0, 0x453522, { rough: 0.96, cast: false });
    }
    const wallCrack = box(trench, 0.3, 0.4, 0.02, trenchW / 2 - 0.02, -0.5, 0.6, 0x2b2118, { rough: 0.98, cast: false });

    // Protective box, staged beside the excavation until it is carried into place.
    const boxStageX = trenchW / 2 + 0.85;
    const trenchBox = group(trench, boxStageX, 0.06, 0);
    for (const sx of [-1, 1]) {
      box(trenchBox, 0.05, trenchD - 0.1, trenchL - 0.2, sx * (trenchW / 2 - 0.05), 0, 0, 0xd8b23a, { rough: 0.5, metal: 0.5 });
    }
    for (let i = 0; i < 3; i++) {
      box(trenchBox, trenchW - 0.1, 0.06, 0.06, 0, -trenchD / 2 + 0.15 + i * 0.35, -trenchL / 2 + 0.25 + i * 0.9,
        0xd8b23a, { rough: 0.5, metal: 0.5 });
    }
    holoTag(trenchBox, "Trench box — carry it in", 0, trenchD * 0.55, 0, { css: "#7ed321", w: 0.4 });
    reg(hits, trenchBox, "trench-box");

    // A plain, non-interactive marker for where the box actually belongs — the
    // drag step measures against this, never against the box's own footprint.
    const trenchSocket = group(trench, 0, -trenchD / 2 + 0.06, 0);
    hits["trench-socket"] = trenchSocket;

    const ladder = group(trench, 0.2, -trenchD, trenchL / 2 - 0.3, 0.1);
    for (const sx of [-1, 1]) cyl(ladder, 0.012, 0.012, trenchD + 0.4, sx * 0.14, (trenchD + 0.4) / 2, 0, 0xa8b0b8, { rough: 0.5, metal: 0.7, seg: 8 });
    for (let i = 0; i < 6; i++) {
      cyl(ladder, 0.01, 0.01, 0.3, 0, 0.15 + i * 0.22, 0, 0xa8b0b8, { rough: 0.5, metal: 0.7, seg: 8 }).rotation.z = Math.PI / 2;
    }
    ladder.visible = false;
    reg(hits, ladder, "ladder");

    const utilityLine = group(trench, 0, -trenchD + 0.15, 0);
    cyl(utilityLine, 0.06, 0.06, trenchL - 0.4, 0, 0, 0, 0x2f6f8c, { rough: 0.5, metal: 0.4, seg: 14 }).rotation.x = Math.PI / 2;
    holoTag(utilityLine, "Utility line", 0, 0.18, 0, { css: "#7ed321", w: 0.3 });
    reg(hits, utilityLine, "utility-line");

    // Unprotected entry point and untested-entry hazard clickable on the trench itself.
    reg(hits, wallCrack, "unshored-entry");
    const trenchFloor = box(trench, trenchW - 0.1, 0.01, trenchL - 0.1, 0, -trenchD + 0.02, 0, 0x1c1712,
      { rough: 0.98, cast: false, opacity: 0.01, transparent: true });
    reg(hits, trenchFloor, "untested-entry");

    // Spoil pile — too close to the edge until relocated.
    const spoil = group(g, 0.65, 0, -0.1);
    cyl(spoil, 0.4, 0.55, 0.4, 0, 0.2, 0, 0x6b5a3f, { rough: 0.98, seg: 16 });
    holoTag(spoil, "Spoil pile", 0, 0.5, 0, { css: "#7ed321", w: 0.3 });
    reg(hits, spoil, "spoil-pile");

    // Surcharge warning at the edge under the pile — the hazard, separate from the pile itself.
    const surchargeMark = group(g, 0.55, 0, -0.35);
    box(surchargeMark, 0.3, 0.02, 0.3, 0, 0.16, 0, 0x000000, { opacity: 0.001, transparent: true, cast: false });
    holoTag(surchargeMark, "Surcharge risk", 0, 0.2, 0, { css: "#f0645b", w: 0.32 });
    reg(hits, surchargeMark, "spoil-too-close");

    // No ladder access marker on the far end of the trench, until the ladder step runs.
    const farEnd = group(g, -0.2, 0, -1.3);
    box(farEnd, 0.3, 0.03, 0.3, 0, 0.16, 0, 0x000000, { opacity: 0.001, transparent: true, cast: false });
    reg(hits, farEnd, "no-ladder-access");

    // ------------------------------------------------------------------ guarding
    reg(hits, cone(g, -1.9, -1.2, { color: 0x7ed321 }), "cone-a");
    reg(hits, cone(g, 1.6, 1.3, { color: 0x7ed321 }), "cone-b");
    const railPanels = [];
    for (const [rx, rz, ry] of [[-0.7, 1.4, 0], [0.3, 1.4, 0], [-1.3, 0.4, Math.PI / 2], [0.9, 0.4, Math.PI / 2]]) {
      const panel = barrierPanel(g, rx, rz, { ry, w: 1.1, color: 0x7ed321 });
      panel.visible = false;
      railPanels.push(panel);
    }
    const railKit = group(g, 1.6, 0, -1.0, 0.3);
    slab(railKit, 1.0, 0.14, 0.18, 0, 0.08, 0, 0x7ed321, { radius: 0.02, rough: 0.6 });
    holoTag(railKit, "Trench guard", 0, 0.3, 0, { css: "#7ed321", w: 0.3 });
    reg(hits, railKit, "trench-guard");

    // ------------------------------------------------------------------ crew
    const spotter = standingFigure(g, 1.3, -0.9, { ry: -2.0, cloth: 0x2b3138, vest: 0xf2c14b, helmet: 0xf2f2f2 });
    holoTag(spotter, "Spotter", 0, 1.95, 0.15, { css: "#7ed321", w: 0.24 });
    reg(hits, spotter, "spotter");

    // ------------------------------------------------------------------ paperwork + gear
    const permit = holoPanel(g, 0.58, 0.4, -1.9, 1.5, 1.1, (ctx, w, h) => {
      ctx.fillStyle = "rgba(6,16,22,0.9)"; ctx.fillRect(0, 0, w, h);
      ctx.fillStyle = "#7ed321"; ctx.fillRect(0, 0, w, 5);
      ctx.fillStyle = "#8fb3c4";
      ctx.font = `600 ${Math.round(h * 0.09)}px 'Barlow Condensed', Arial, sans-serif`;
      ctx.textAlign = "left"; ctx.textBaseline = "middle";
      ctx.fillText("EXCAVATION PERMIT · TR-19", w * 0.06, h * 0.14);
      ctx.fillStyle = "#eaf6fb";
      ctx.font = `600 ${Math.round(h * 0.14)}px 'Barlow Condensed', Arial, sans-serif`;
      ctx.fillText("WATER LINE REPAIR, 6 FT DEPTH", w * 0.06, h * 0.33);
      ctx.font = `${Math.round(h * 0.085)}px Arial, sans-serif`;
      ctx.fillStyle = "#a9c6d6";
      ["Soil classification: Type B", "Protective system: trench box, rated 6 ft",
       "Spoil setback: 2 ft minimum", "O₂ safe range: 19.5–23.5%",
       "Ladder: within 25 ft of all workers"].forEach((line, i) => ctx.fillText(line, w * 0.06, h * (0.5 + i * 0.11)));
    }, { ry: 0.7, accent: 0x7ed321 });
    reg(hits, permit, "excavation-permit");

    const inspectBoard = group(g, -1.6, 0, 0.6, 0.5);
    slab(inspectBoard, 0.42, 0.32, 0.03, 0, 1.1, 0, 0x1b232b, { radius: 0.01, rough: 0.6 });
    const inspectFace = decal(inspectBoard, 0.38, 0.28, 0, 1.1, 0.02,
      signFace("SOIL CLASS\nPENDING", { bg: "#11181f", accent: "#7ed321", scale: 0.3 }), { px: 320 });
    holoTag(inspectBoard, "Competent-person log", 0, 1.34, 0, { css: "#7ed321", w: 0.34 });
    reg(hits, inspectBoard, "soil-inspect");

    const chest = toolChest(g, 1.7, 0.6, { ry: -0.4, color: 0x7ed321 });
    const meter = instrument(chest, -0.08, 0.79, 0.05, { ry: 0.3, idle: "-- %", color: 0x7ed321 });
    holoTag(meter, "4-gas meter", 0, 0.16, 0, { css: "#7ed321", w: 0.26 });
    reg(hits, meter, "gas-meter");

    const headcount = group(g, 1.9, 0, 0.0, 0.6);
    slab(headcount, 0.4, 0.3, 0.03, 0, 1.05, 0, 0x1b232b, { radius: 0.01, rough: 0.6 });
    const headcountFace = decal(headcount, 0.36, 0.26, 0, 1.05, 0.02,
      signFace("CREW\nBELOW GRADE", { bg: "#11181f", accent: "#7ed321", scale: 0.3 }), { px: 320 });
    holoTag(headcount, "Headcount board", 0, 1.28, 0, { css: "#7ed321", w: 0.32 });
    reg(hits, headcount, "headcount-board");

    const backfill = group(g, 0.9, 0, -1.5, 0.4);
    slab(backfill, 0.5, 0.16, 0.2, 0, 0.09, 0, 0x6b5a3f, { radius: 0.02, rough: 0.85 });
    holoTag(backfill, "Backfill and compact", 0, 0.32, 0, { css: "#7ed321", w: 0.36 });
    reg(hits, backfill, "backfill-panel");

    const dust = particles(spoil, 24, 0x9a8a6a, { size: 0.02, life: 0.6, additive: false, opacity: 0.2 });

    let shored = false;

    return {
      hits,
      footprint: 2.1,

      onStepComplete(step) {
        if (step.id === "guard-site") railPanels.forEach((p) => { p.visible = true; });
        if (step.id === "relocate-spoil") { spoil.position.set(1.6, 0, -1.4); }
        // The box's own position is already set by the drag-and-drop gesture
        // itself (app.js snaps it onto the socket on a successful drop) — this
        // just flips the bookkeeping flag.
        if (step.id === "install-box") shored = true;
        if (step.id === "place-ladder") { ladder.visible = true; }
        if (step.id === "pipe-work") {
          repaint(inspectFace, signFace("SOIL CLASS B\nCONFIRMED", { bg: "#0f1b14", accent: "#59c97b", fg: "#bff7d4", scale: 0.24 }));
        }
        if (step.id === "exit-count") {
          repaint(headcountFace, signFace("CREW\nCLEAR", { bg: "#0f1b14", accent: "#59c97b", fg: "#bff7d4", scale: 0.32 }));
        }
        if (step.id === "remove-box") { trenchBox.visible = false; shored = false; ladder.visible = false; }
      },

      onHazard(hitId) { if (hitId === "spoil-too-close") { dust.visible = true; } },

      animate(t, dt, session) {
        spotter.userData.head.rotation.y = Math.sin(t * 0.6) * 0.4;
        if (dust.visible) dust.userData.step(dt, new THREE.Vector3(0, 0.4, 0), 0.15, 0.15, -0.1);

        const gg = session?.gauge;
        if (gg && !gg.committed && session.step?.id === "atmosphere-test") {
          const o2 = (15 + gg.t * 12).toFixed(1);
          repaint(meter.userData.screen, signFace(`${o2}%`, {
            bg: "#0d1c24", accent: gg.t > 0.46 && gg.t < 0.6 ? "#59c97b" : "#f0645b", fg: "#bfeaf7", scale: 0.6,
          }));
        }
      },
    };
  },
};


/* ===== smartcity/js/sims/boiler-room.js ===== */
// SmartCiti.X~ Boiler Room VR — its own gamified system: Steam Certified.
// Boiler lockout and firebox entry. Stored energy here is pressure and heat, not
// electricity, and it does not discharge the instant a switch is thrown — it
// has to actually cool and bleed down before the boiler is safe to open.

const SIM_BOILER_ROOM = {
  id: "boiler-room",
  index: "15",
  domain: "Facilities",
  trade: "Stationary engineer / steamfitter",
  name: "Boiler Room",
  title: simTitle("Boiler Room"),
  tagline: "Boiler lockout, confined-space firebox entry and a controlled re-light",
  accent: 0xd83a2a,
  accentCss: "#d83a2a",
  parSeconds: 245,
  badge: { id: "steam-certified", name: "Steam Certified", note: "Isolated, cooled, tested and relit with nothing skipped" },

  game: system({
    name: "Steam Certified",
    currency: "STEAM",
    ranks: ["Fireman", "Boiler Operator", "Stationary Engineer", "Plant Lead", "Steam Certified"],
    badges: [
      { id: "cold-and-clear", name: "Cold and Clear", note: "Never open the port before pressure and atmosphere are proven safe", test: AWARD.safe },
      { id: "double-block", name: "Double Block Certified", note: "Isolate the fuel train in the correct order every time", test: AWARD.stepClean("isolate-fuel-train") },
      { id: "steam-precise", name: "Steam Precise", note: "Hold every reading near band centre", test: AWARD.precise(0.72) },
    ],
    challenges: [
      { id: "fast-relight", name: "Fast Relight", note: "Complete inside 80% of par", test: AWARD.fast(0.8) },
      { id: "clean-shift", name: "Clean Shift", note: "Clean run, no corrections", test: AWARD.clean },
      { id: "steam-streak", name: "Steam Streak", note: "Nine correct actions in a row", test: AWARD.streak(9) },
    ],
  }),

  hazards: {
    "hot-inspection-port": "You are opening the inspection port before pressure and temperature are confirmed safe. Flash steam and superheated water erupting from a pressurised drum cause burns before you can pull your hand back.",
    "live-fuel-valve": "That fuel valve is not actually isolated. Working on the burner train with a live gas or oil supply behind it means one dropped spark or one hot surface away from an explosion.",
    "firebox-no-test": "You are entering the firebox before the atmosphere has been tested. Residual combustion gases in an unventilated firebox displace oxygen with no smell to warn you before you are already affected.",
    "relight-not-clear": "You are relighting the burner without confirming the isolation locks are removed and everyone is clear. A relight with a lock still in place or a person still inside the firebox can ignite trapped fuel or catch someone in the burner path.",
  },

  lateNotes: {
    "inspection-port": "The port only gets opened once the drum has cooled into the safe band and the firebox atmosphere has tested clear — not to check on progress along the way.",
    "lockout-point": "Both isolation locks go on before anyone reaches toward the firebox, and neither comes off until the repair is actually finished and the space is clear.",
  },

  steps: [
    {
      id: "workorder", kind: "select", target: "work-order",
      title: "Read the work order",
      cue: "Confirm the boiler, the refractory repair task and the required isolations.",
      why: "The work order names exactly which fuel and steam lines this repair needs isolated. Working from memory on a multi-boiler plant is how the wrong line gets left live.",
    },
    {
      id: "shutdown", kind: "select", target: "boiler-hmi",
      title: "Shut the boiler down",
      cue: "Stop the burner from the control panel and confirm flame-out.",
      why: "A controlled shutdown lets the burner cycle down cleanly instead of isolating fuel and steam lines on a boiler that is still firing.",
    },
    {
      id: "cooldown", kind: "gauge", target: "pressure-gauge",
      title: "Confirm the drum has cooled and depressurised",
      cue: "Watch the drum pressure and temperature fall, and commit once it is inside the safe band.",
      why: "A boiler drum holds stored heat and pressure long after the burner stops. The safe band is what actually makes the inspection port and the firebox approachable, not the elapsed time since shutdown.",
      gauge: {
        label: "DRUM PRESSURE / TEMPERATURE", speed: 0.5, green: [0.0, 0.15],
        readout: (t) => `${Math.round(t * 180)} psig · ${Math.round(100 + t * 280)}°F`,
        missNote: "Still hot and pressurised. Keep bleeding down — the port and firebox stay closed until this reads inside the safe band.",
      },
    },
    {
      id: "isolate-fuel-train", kind: "sequence",
      targets: ["fuel-valve", "fuel-block-valve", "bleed-valve"],
      itemNames: { "fuel-valve": "upstream fuel block valve", "fuel-block-valve": "downstream fuel block valve", "bleed-valve": "bleed valve" },
      title: "Isolate the fuel train — double block and bleed",
      cue: "Close the upstream block, close the downstream block, then open the bleed valve between them.",
      why: "Two closed valves with a vented bleed point between them is what proves the fuel train is actually isolated — the bleed valve venting nothing is your confirmation, not a guess based on two closed handles.",
      outOfOrderNote: "Wrong order — both blocks close before the bleed valve opens, so the vent is confirming isolation rather than releasing line pressure.",
    },
    {
      id: "isolate-steam", kind: "turn", target: "steam-valve",
      title: "Isolate the main steam stop valve",
      cue: "Grab the handwheel and turn it closed — a full turn and a half.",
      why: "The steam side gets isolated independently of the fuel side — a firebox repair with the steam header still connected leaves a pressurised path back into the drum you are working next to.",
      turn: { turns: 1.5, axis: "z", label: "MAIN STEAM STOP", readout: (t) => `${Math.round(t * 100)}% CLOSED` },
    },
    {
      id: "lock-all", kind: "select", target: "lockout-point",
      title: "Lock out the isolation points",
      cue: "Apply lockout tags to the fuel train and the steam stop valve.",
      why: "The locks are what stop the fuel or steam isolation from being reversed by someone else on shift while you are standing in the firebox.",
    },
    {
      id: "atmosphere-test", kind: "gauge", target: "gas-meter",
      title: "Test the firebox atmosphere",
      cue: "Sample the firebox air and commit only inside the safe oxygen range.",
      why: "A firebox that has just been fired holds residual combustion gases that do not clear on their own timeline you can guess at — the meter is what actually proves it is breathable.",
      gauge: {
        label: "FIREBOX ATMOSPHERE — OXYGEN", speed: 0.6, green: [0.46, 0.6],
        readout: (t) => `${(15 + t * 12).toFixed(1)} % O₂`,
        missNote: "Outside the safe range. Ventilate the firebox and re-test before anyone's head goes near that opening.",
      },
    },
    {
      id: "entry-permit", kind: "select", target: "csp-permit",
      title: "Open the confined-space entry permit",
      cue: "Sign the permit for firebox entry: attendant posted, retrieval plan named.",
      why: "The firebox is a confined space in its own right, separate from the boiler lockout. It gets its own permit and its own attendant before anyone's shoulders go through that port.",
    },
    {
      id: "open-port", kind: "select", target: "inspection-port",
      title: "Open the inspection port",
      cue: "Unbolt and swing open the inspection port now that pressure and atmosphere are confirmed safe.",
      why: "This is the point where every control before it pays off — cooled, depressurised, isolated, tested. Open it any earlier and at least one of those is still unresolved.",
    },
    {
      id: "firebox-entry", kind: "select", target: "firebox-repair",
      title: "Complete the refractory repair",
      cue: "Enter the firebox and repair the damaged refractory lining.",
      why: "The repair only happens once the space is confirmed cold, isolated and breathable — that is the entire reason the steps ahead of this one exist.",
    },
    {
      id: "remove-locks", kind: "select", target: "lockout-point",
      title: "Remove the isolation locks",
      cue: "Confirm the repair is complete and everyone is clear, then remove the fuel and steam locks.",
      why: "Locks come off only once the firebox is confirmed empty and the port is closed — removing isolation while anyone could still be inside defeats the reason the locks went on.",
    },
    {
      id: "relight", kind: "select", target: "boiler-hmi",
      title: "Run the controlled re-light",
      cue: "Purge the firebox, then ignite the burner and bring the boiler back to pressure.",
      why: "A purge cycle clears any fuel vapour that collected during the work before the igniter ever fires — skipping straight to ignition is how a re-light becomes a firebox explosion.",
    },
  ],

  build(root) {
    const hits = {};
    const g = group(root);
    stationPad(g, 2.1, 0xd83a2a);

    // ------------------------------------------------------------- plant room
    box(g, 4.6, 0.14, 4.6, 0, 0.07, 0, 0x545c63, { rough: 0.9 });
    for (let i = -3; i <= 3; i++) box(g, 4.6, 0.004, 0.014, 0, 0.145, i * 0.7, 0x424951, { cast: false, receive: false });

    // ------------------------------------------------------------- the boiler
    const boiler = group(g, -0.5, 0, -1.0, 0.2);
    cyl(boiler, 0.55, 0.55, 1.6, 0, 0.85, 0, 0x6b747c, { rough: 0.5, metal: 0.5, seg: 22 });
    lathe(boiler, [[0.001, 0], [0.35, 0.05], [0.5, 0.18], [0.55, 0.5]], 0, 1.6, 0, 0x6b747c, { rough: 0.5, metal: 0.5, seg: 22 });
    const hmi = decal(boiler, 0.4, 0.28, 0.5, 1.0, 0.2,
      signFace("RUNNING\n120 psig", { bg: "#0d1c24", accent: "#d83a2a", fg: "#ffc9bf", scale: 0.26 }),
      { glow: true, ei: 0.9, px: 384 });
    hmi.rotation.y = Math.PI / 2;
    reg(hits, hmi, "boiler-hmi");
    holoTag(boiler, "Boiler 1 · 150 HP", 0, 1.85, 0, { css: "#d83a2a", w: 0.4 });

    // Manual igniter switch — the trap for relighting before locks are off and the space is clear.
    const igniter = group(boiler, 0.55, 0.7, 0.1);
    box(igniter, 0.05, 0.03, 0.03, 0, 0, 0, 0xd8232a, { rough: 0.5 });
    holoTag(igniter, "Igniter", 0, 0.07, 0, { css: "#f0645b", w: 0.26 });
    reg(hits, igniter, "relight-not-clear");

    const pressureFace = decal(boiler, 0.28, 0.16, -0.5, 1.3, 0.2,
      signFace("140 psig\n410°F", { bg: "#0d1c24", accent: "#d83a2a", fg: "#ffc9bf", scale: 0.28 }), { glow: true, ei: 0.85, px: 256 });
    pressureFace.rotation.y = -Math.PI / 2;
    reg(hits, pressureFace, "pressure-gauge");

    // Inspection port on the shell — the flash-hazard trap.
    const port = group(boiler, 0.5, 0.55, 0.3);
    cyl(port, 0.11, 0.11, 0.06, 0, 0, 0, 0x2b3138, { rough: 0.5, metal: 0.5, seg: 18 });
    for (let i = 0; i < 6; i++) {
      const a = (i / 6) * Math.PI * 2;
      cyl(port, 0.012, 0.012, 0.03, Math.cos(a) * 0.1, 0, Math.sin(a) * 0.1, CITY.steel, { rough: 0.3, metal: 0.85, seg: 8 })
        .rotation.x = Math.PI / 2;
    }
    port.rotation.y = 0.6;
    holoTag(port, "Inspection port", 0, 0.18, 0, { css: "#d83a2a", w: 0.32 });
    reg(hits, port, "inspection-port");
    const flashSteam = particles(port, 40, 0xdfeaf2, { size: 0.03, life: 0.5, additive: false, opacity: 0.35 });

    // Port dogging bolts — the trap for reaching to unbolt the port before it is confirmed safe.
    const portBolts = group(port, 0.14, 0, 0);
    cyl(portBolts, 0.014, 0.014, 0.03, 0, 0, 0, 0xd8b23a, { rough: 0.4, metal: 0.7, seg: 10 });
    holoTag(portBolts, "Dogging bolts", 0, 0.08, 0, { css: "#f0645b", w: 0.3 });
    reg(hits, portBolts, "hot-inspection-port");

    // Firebox opening below the shell, dark until the port is opened.
    const firebox = group(boiler, 0, 0.15, 0.35);
    box(firebox, 0.5, 0.3, 0.3, 0, 0, 0, 0x11151a, { rough: 0.95, cast: false });
    const refractory = box(firebox, 0.4, 0.2, 0.02, 0.1, 0, 0.12, 0xb8402f, { rough: 0.85 });
    holoTag(firebox, "Firebox", 0, 0.22, 0.16, { css: "#d83a2a", w: 0.28 });
    reg(hits, refractory, "firebox-repair");

    const fireboxDoor = box(firebox, 0.5, 0.3, 0.02, 0, 0, -0.14, 0x2b3138, { rough: 0.6, metal: 0.4 });
    holoTag(fireboxDoor, "Firebox door", 0, 0.2, 0, { css: "#f0645b", w: 0.3 });
    reg(hits, fireboxDoor, "firebox-no-test");

    const burnGlow = ball(firebox, 0.06, 0, -0.02, 0.1, 0xff8a3c, { emissive: 0xff8a3c, ei: 2.0 });

    // ------------------------------------------------------------- fuel train
    const fuelSkid = group(g, -1.9, 0, -0.2, 0.5);
    pipeRun(fuelSkid, [[-0.5, 0.4, 0], [0, 0.4, 0], [0.5, 0.4, 0]], 0.05, 0x2f6f4a,
      { steps: 14, flanges: [[-0.3, 0.4, 0], [0.3, 0.4, 0]], flangeAxis: "x" });
    const fuelValve = valveWheel(fuelSkid, -0.3, 0.5, 0, { r: 0.09, color: 0xf2c14b, body: 0x2f6f4a });
    reg(hits, fuelValve, "fuel-valve");
    const fuelBlockValve = valveWheel(fuelSkid, 0.3, 0.5, 0, { r: 0.09, color: 0xf2c14b, body: 0x2f6f4a });
    reg(hits, fuelBlockValve, "fuel-block-valve");
    const bleedValve = valveWheel(fuelSkid, 0, 0.62, 0.12, { r: 0.05, color: 0x4fd1ff, body: 0x2f6f4a });
    reg(hits, bleedValve, "bleed-valve");
    const bleedMist = particles(bleedValve, 20, 0xdfeaf2, { size: 0.015, life: 0.3, additive: false, opacity: 0.3 });
    holoTag(fuelSkid, "Fuel train", 0, 0.85, 0.12, { css: "#d83a2a", w: 0.3 });

    const liveFuelIndicator = group(fuelSkid, 0.6, 0.4, 0.15);
    ball(liveFuelIndicator, 0.02, 0, 0, 0, 0xf0645b, { emissive: 0xf0645b, ei: 1.8 });
    holoTag(liveFuelIndicator, "Fuel supply", 0, 0.1, 0, { css: "#f0645b", w: 0.28 });
    reg(hits, liveFuelIndicator, "live-fuel-valve");

    const steamValve = valveWheel(g, 0.6, 0.75, -1.3, { r: 0.1, color: 0xd8232a, body: 0x2f6f4a, ry: 0.4 });
    holoTag(steamValve, "Main steam stop", 0, 0.28, 0, { css: "#d83a2a", w: 0.32 });
    reg(hits, steamValve, "steam-valve");

    const lockCab = group(g, -1.85, 0, -1.5, 0.4);
    box(lockCab, 0.4, 0.6, 0.16, 0, 0.4, 0, 0x545e67, { rough: 0.5, metal: 0.5 });
    const hasp = torus(lockCab, 0.02, 0.006, 0, 0.5, 0.09, CITY.steel, { rough: 0.3, metal: 0.9 });
    hasp.rotation.y = Math.PI / 2;
    reg(hits, hasp, "lockout-point");
    const fuelLock = lockTag(lockCab, -0.06, 0.5, 0.1, { color: 0xd8232a });
    const steamLock = lockTag(lockCab, 0.06, 0.5, 0.1, { color: 0x1f7ae0 });
    fuelLock.visible = false; steamLock.visible = false;

    // ------------------------------------------------------------- paperwork + gear
    const order = holoPanel(g, 0.58, 0.4, -1.9, 1.5, 1.5, (ctx, w, h) => {
      ctx.fillStyle = "rgba(6,16,22,0.9)"; ctx.fillRect(0, 0, w, h);
      ctx.fillStyle = "#d83a2a"; ctx.fillRect(0, 0, w, 5);
      ctx.fillStyle = "#8fb3c4";
      ctx.font = `600 ${Math.round(h * 0.09)}px 'Barlow Condensed', Arial, sans-serif`;
      ctx.textAlign = "left"; ctx.textBaseline = "middle";
      ctx.fillText("WORK ORDER WO-4410", w * 0.06, h * 0.14);
      ctx.fillStyle = "#eaf6fb";
      ctx.font = `600 ${Math.round(h * 0.14)}px 'Barlow Condensed', Arial, sans-serif`;
      ctx.fillText("BOILER 1 — REFRACTORY REPAIR", w * 0.06, h * 0.33);
      ctx.font = `${Math.round(h * 0.085)}px Arial, sans-serif`;
      ctx.fillStyle = "#a9c6d6";
      ["Safe entry: ≤ 25 psig, ≤ 130°F", "Fuel: double block and bleed",
       "Steam: main stop isolated and tagged", "O₂ safe range: 19.5–23.5%",
       "Firebox: separate confined-space permit"].forEach((line, i) => ctx.fillText(line, w * 0.06, h * (0.5 + i * 0.11)));
    }, { ry: 0.7, accent: 0xd83a2a });
    reg(hits, order, "work-order");

    const chest = toolChest(g, 1.7, 1.2, { ry: -0.6, color: 0xd83a2a });
    const meter = instrument(chest, -0.08, 0.79, 0.05, { ry: 0.3, idle: "-- %", color: 0xd83a2a });
    holoTag(meter, "4-gas meter", 0, 0.16, 0, { css: "#d83a2a", w: 0.28 });
    reg(hits, meter, "gas-meter");

    const permitBoard = group(chest, 0.14, 0.79, 0.02, -0.4);
    slab(permitBoard, 0.2, 0.16, 0.02, 0, 0.09, 0, 0x1b232b, { radius: 0.01, rough: 0.6 });
    const permitFace = decal(permitBoard, 0.18, 0.14, 0, 0.09, 0.012,
      signFace("CSP\nPENDING", { bg: "#11181f", accent: "#d83a2a", scale: 0.3 }), { px: 220 });
    holoTag(permitBoard, "Confined-space permit", 0, 0.2, 0, { css: "#d83a2a", w: 0.34 });
    reg(hits, permitBoard, "csp-permit");

    let running = true;
    let fuelIsolated = false;
    let firing = 0;

    return {
      hits,
      footprint: 2.1,

      onStepComplete(step) {
        if (step.id === "shutdown") {
          running = false;
          repaint(hmi, signFace("STOPPED\n120 psig", { bg: "#2a1a0d", accent: "#f2c14b", fg: "#ffe3ac", scale: 0.26 }));
        }
        if (step.id === "isolate-fuel-train") {
          fuelIsolated = true;
          fuelValve.userData.wheel.rotation.z += 1.6;
          fuelBlockValve.userData.wheel.rotation.z += 1.6;
          bleedValve.userData.wheel.rotation.z += 1.6;
          liveFuelIndicator.children[0].material = mat(0x59c97b, { emissive: 0x59c97b, ei: 1.6 });
        }
        // The steam stop valve's handwheel is turned live by the player's drag —
        // app.js drives its rotation directly from session.turn while the
        // 'isolate-steam' step is active, so there is nothing to do here.
        if (step.id === "lock-all") { fuelLock.visible = true; steamLock.visible = true; }
        if (step.id === "entry-permit") {
          repaint(permitFace, signFace("CSP\nSIGNED", { bg: "#0f1b14", accent: "#59c97b", fg: "#bff7d4", scale: 0.3 }));
        }
        if (step.id === "open-port") { port.rotation.y = 1.7; }
        if (step.id === "firebox-entry") refractory.material = mat(0x8b929a, { rough: 0.6, metal: 0.3 });
        if (step.id === "remove-locks") { fuelLock.visible = false; steamLock.visible = false; }
        if (step.id === "relight") {
          running = true; fuelIsolated = false; port.rotation.y = 0.6; firing = 1;
          repaint(hmi, signFace("RUNNING\n120 psig", { bg: "#0d1c24", accent: "#d83a2a", fg: "#ffc9bf", scale: 0.26 }));
        }
      },

      onHazard(hitId) {
        if (hitId === "hot-inspection-port") flashSteam.visible = true;
        if (hitId === "live-fuel-valve" && !fuelIsolated) bleedMist.visible = true;
      },

      animate(t, dt, session) {
        burnGlow.material.emissiveIntensity = running ? 1.6 + Math.sin(t * 6) * 0.6 : 0.1;
        if (flashSteam.visible) flashSteam.userData.step(dt, new THREE.Vector3(0, 0, 0), 0.05, 0.5, 0.3);
        if (bleedMist.visible) bleedMist.userData.step(dt, new THREE.Vector3(0, 0, 0), 0.03, 0.2, 0.2);
        if (firing > 0) firing -= dt;

        const gg = session?.gauge;
        if (gg && !gg.committed) {
          if (session.step?.id === "cooldown") {
            const psi = Math.round(gg.t * 180), degf = Math.round(100 + gg.t * 280);
            repaint(pressureFace, signFace(`${psi} psig\n${degf}°F`, {
              bg: "#0d1c24", accent: gg.t < 0.15 ? "#59c97b" : "#d83a2a", fg: "#ffc9bf", scale: 0.28,
            }));
          }
          if (session.step?.id === "atmosphere-test") {
            const o2 = (15 + gg.t * 12).toFixed(1);
            repaint(meter.userData.screen, signFace(`${o2}%`, {
              bg: "#0d1c24", accent: gg.t > 0.46 && gg.t < 0.6 ? "#59c97b" : "#f0645b", fg: "#bfeaf7", scale: 0.6,
            }));
          }
        }
      },
    };
  },
};

      cue: "Remove the lock, close the disconnect and run the car on a test trip.",

    },
  ],

  build(root) {
    const hits = {};
    const g = group(root);
    stationPad(g, 2.0, 0x2dd4bf);

    // ------------------------------------------------------------- machine room floor
    box(g, 4.2, 0.16, 4.2, 0, 0.08, 0, 0x555c63, { rough: 0.9 });
    for (let i = -2; i <= 2; i++) {
      box(g, 4.2, 0.004, 0.02, 0, 0.165, i * 0.85, 0x434a52, { cast: false, receive: false });
    }

    // --------------------------------------------------------------------- the shaft
    const shaftX = -0.35, shaftZ = -0.3, shaftR = 0.52;
    const shaft = group(g, shaftX, 0, shaftZ);
    cyl(shaft, shaftR, shaftR, 1.95, 0, -0.98, 0, 0x14181e, { rough: 0.98, seg: 26, open: true, side: 2, cast: false });
    const pitFloor = cyl(shaft, shaftR, shaftR, 0.03, 0, -1.94, 0, 0x101318, { rough: 0.95, seg: 24, cast: false });

    // Fixed pit ladder along the shaft wall.
    const ladder = group(shaft, 0, 0, -shaftR + 0.06);
    for (const sx of [-1, 1]) cyl(ladder, 0.015, 0.015, 1.85, sx * 0.15, -0.98, 0, 0xa8b0b8, { rough: 0.5, metal: 0.7, seg: 8 });
    const rungs = [];
    for (let i = 0; i < 6; i++) {
      const r = cyl(ladder, 0.011, 0.011, 0.3, 0, -0.16 - i * 0.3, 0, 0xa8b0b8, { rough: 0.5, metal: 0.7, seg: 8 });
      r.rotation.z = Math.PI / 2;
      rungs.push(r);
    }
    reg(hits, ladder, "pit-ladder");
    rungs[3].material = mat(0x7a5a3a, { rough: 0.85, metal: 0.3 });
    decal(ladder, 0.1, 0.03, 0.02, -1.06, 0, signFace("CORRODED", { bg: "#2a1a0d", accent: "#f0645b", scale: 0.5 }), { px: 128 });
    reg(hits, rungs[3], "loose-rung");

    // Buffers on the pit floor — one under the car, one under the counterweight.
    const carBuffer = cyl(shaft, 0.055, 0.06, 0.32, 0.16, -1.78, 0.1, 0x8b929a, { rough: 0.5, metal: 0.5, seg: 14 });
    decal(shaft, 0.09, 0.03, 0.16, -1.6, 0.16, signFace("CRACKED", { bg: "#2a1a0d", accent: "#f0645b", scale: 0.5 }), { px: 128 });
    reg(hits, carBuffer, "worn-buffer");
    cyl(shaft, 0.055, 0.06, 0.32, -0.2, -1.78, -0.22, 0x8b929a, { rough: 0.5, metal: 0.5, seg: 14 });

    // Flooded sump in the far corner of the pit floor.
    const sump = group(shaft, -0.28, -1.9, 0.22);
    cyl(sump, 0.14, 0.14, 0.06, 0, 0.02, 0, 0x1b2126, { rough: 0.6, metal: 0.3, seg: 16 });
    const sumpWater = particles(sump, 20, 0x4fa3ff, { size: 0.014, life: 0.5, additive: false, opacity: 0.5 });
    holoTag(sump, "Sump", 0, 0.16, 0, { css: "#f0645b", w: 0.24 });
    reg(hits, sump, "sump-overflow");

    // Counterweight, parked low in the runby with a marked hazard zone at its base.
    const cwt = group(shaft, 0.05, 0, -0.24);
    for (const sx of [-1, 1]) cyl(cwt, 0.01, 0.01, 1.7, sx * 0.09, -1.05, 0, CITY.steel, { rough: 0.4, metal: 0.8, seg: 8 });
    for (let i = 0; i < 5; i++) {
      box(cwt, 0.2, 0.09, 0.14, 0, -1.85 + i * 0.1, 0, 0x545e67, { rough: 0.55, metal: 0.4 });
    }
    torus(shaft, 0.22, 0.014, 0.05, -1.93, -0.24, 0xf0645b, { emissive: 0xf0645b, ei: 1.4, rough: 0.4, cast: false, seg: 6, seg2: 28 })
      .rotation.x = Math.PI / 2;
    reg(hits, cwt, "counterweight-zone");

    // ------------------------------------------------------------------------ the car
    const car = group(g, shaftX, 0, shaftZ);
    box(car, 0.86, 1.0, 0.86, 0, 0.5, 0, 0x36414b, { rough: 0.55, metal: 0.3 });
    const carTop = group(car, 0, 1.0, 0);
    box(carTop, 0.9, 0.03, 0.9, 0, 0, 0, 0x2b3339, { rough: 0.55, metal: 0.4 });
    const rail = group(carTop, 0, 0.28, 0);
    for (const [rx, rz, ry] of [[0, -0.42, 0], [-0.42, 0, Math.PI / 2], [0.42, 0, Math.PI / 2]]) {
      box(rail, 0.86, 0.03, 0.02, rx, 0, rz, 0xd8b23a, { rough: 0.6 }).rotation.y = ry;
    }
    holoTag(rail, "Open edge — no rail", 0.42, 0, 0, { css: "#f0645b", w: 0.34 });
    reg(hits, box(carTop, 0.02, 0.3, 0.9, 0.43, 0.15, 0, 0x000000, { opacity: 0.001, transparent: true, cast: false }),
      "cartop-edge");

    const hatch = group(carTop, -0.15, 0.02, 0.1, 0.15);
    box(hatch, 0.36, 0.02, 0.34, 0, 0, 0, 0x3c4650, { rough: 0.5, metal: 0.4 });
    box(hatch, 0.06, 0.03, 0.02, 0.12, 0.02, 0.16, CITY.steel, { rough: 0.35, metal: 0.85 });
    holoTag(hatch, "Car-top hatch", 0, 0.12, 0, { css: "#2dd4bf", w: 0.3 });
    reg(hits, hatch, "car-top-hatch");

    const cartopSwitch = group(carTop, 0.24, 0.02, -0.28, -0.3);
    box(cartopSwitch, 0.12, 0.14, 0.06, 0, 0.07, 0, 0x22272c, { rough: 0.5, metal: 0.4 });
    const cartopLever = box(cartopSwitch, 0.03, 0.08, 0.03, 0, 0.15, 0.02, 0xd8232a, { rough: 0.5 });
    const cartopLamp = ball(cartopSwitch, 0.014, 0, 0.13, 0.035, 0xd8232a, { emissive: 0xd8232a, ei: 1.6 });
    holoTag(cartopSwitch, "Car-top stop", 0, 0.24, 0, { css: "#2dd4bf", w: 0.3 });
    reg(hits, cartopSwitch, "cartop-stop-switch");

    // -------------------------------------------------------------- governor + rope
    const governor = group(g, 0.55, 0, -1.6, -0.4);
    cyl(governor, 0.16, 0.16, 0.08, 0, 1.55, 0, 0x53585e, { rough: 0.5, metal: 0.5, seg: 18 });
    cyl(governor, 0.05, 0.05, 0.1, 0, 1.55, 0.1, 0x22272c, { rough: 0.5, seg: 12 }).rotation.x = Math.PI / 2;
    holoTag(governor, "Governor", 0, 1.75, 0.05, { css: "#2dd4bf", w: 0.26 });
    const govInstrument = instrument(governor, 0, 1.35, 0.14, { ry: 0, idle: "-- N", color: 0x2dd4bf });
    reg(hits, govInstrument, "governor-instrument");

    const ropePts = [[0.55, 1.5, -1.55], [0.4, 0.6, -0.85], [0.15, -0.6, -0.4], [-0.1, -1.5, -0.32], [-0.23, -1.9, -0.24]];
    hose(g, ropePts, 0.01, 0xdfe4e8, { steps: 20, rough: 0.6, metal: 0.5 });
    const frayGroup = group(g, 0.2, -0.4, -0.5, 0.3);
    for (let i = 0; i < 5; i++) {
      hose(frayGroup, [[0, -0.06 + i * 0.03, 0], [(Math.random() - 0.5) * 0.09, 0.06 + i * 0.03, (Math.random() - 0.5) * 0.06]],
        0.003, 0xc0c6cc, { steps: 4, rough: 0.6 });
    }
    holoTag(frayGroup, "Broken wires", 0, 0.14, 0, { css: "#f0645b", w: 0.3 });
    reg(hits, frayGroup, "frayed-governor-rope");

    // ------------------------------------------------------------------ machine room
    const wall = group(g, 1.55, 0, -0.6, -0.5);
    slab(wall, 0.44, 1.1, 0.26, 0, 0.75, 0, 0x545e67, { radius: 0.03, rough: 0.5, metal: 0.5 });
    const discHandle = group(wall, 0, 1.0, 0.14);
    box(discHandle, 0.05, 0.16, 0.05, 0, 0, 0, 0xf0645b, { rough: 0.5 });
    decal(wall, 0.36, 0.06, 0, 1.24, 0.135, signFace("MAIN LINE DISCONNECT", { accent: "#2dd4bf", scale: 0.4 }));
    reg(hits, discHandle, "main-disconnect");

    const hasp = torus(wall, 0.022, 0.006, 0.13, 0.62, 0.14, CITY.steel, { rough: 0.3, metal: 0.9 });
    hasp.rotation.y = Math.PI / 2;
    reg(hits, hasp, "lockout-hasp");
    const appliedLock = lockTag(wall, 0.13, 0.62, 0.16);
    appliedLock.visible = false;

    const restoreBtn = group(wall, -0.13, 0.5, 0.14);
    cyl(restoreBtn, 0.045, 0.045, 0.04, 0, 0, 0.02, 0xf2c14b, { rough: 0.5, seg: 16 }).rotation.x = Math.PI / 2;
    decal(restoreBtn, 0.08, 0.025, 0, -0.05, 0.02, signFace("RESTORE", { bg: "#2a1a0d", accent: "#f2c14b", scale: 0.5 }), { px: 96 });
    holoTag(restoreBtn, "Bypass — do not use", 0, 0.08, 0, { css: "#f0645b", w: 0.32 });
    reg(hits, restoreBtn, "quick-restore-switch");

    const controller = group(g, 1.7, 0, 0.6, -0.9);
    slab(controller, 0.3, 0.4, 0.1, 0, 0.95, 0, 0x2b3138, { radius: 0.03, rough: 0.5, metal: 0.4 });
    const controllerScreen = decal(controller, 0.24, 0.16, 0, 1.05, 0.052,
      signFace("ARMED", { bg: "#2a1416", accent: "#f0645b", fg: "#ffd2ce", scale: 0.4 }), { glow: true, ei: 0.85, px: 256 });
    holoTag(controller, "Car controller", 0, 1.2, 0.06, { css: "#2dd4bf", w: 0.3 });
    reg(hits, controller, "controller-panel");

    const pitSwitch = group(g, -0.35, 0, 0.28, 0.2);
    box(pitSwitch, 0.14, 0.18, 0.08, 0, 0.65, 0, 0x22272c, { rough: 0.5, metal: 0.4 });
    const pitLever = box(pitSwitch, 0.035, 0.09, 0.035, 0, 0.73, 0.03, 0xd8232a, { rough: 0.5 });
    const pitLamp = ball(pitSwitch, 0.016, 0, 0.79, 0.05, 0xd8232a, { emissive: 0xd8232a, ei: 1.6 });
    decal(pitSwitch, 0.11, 0.04, 0, 0.55, 0.041, signFace("PIT STOP", { accent: "#2dd4bf", scale: 0.5 }), { px: 128 });
    holoTag(pitSwitch, "Pit stop switch", 0, 0.85, 0, { css: "#2dd4bf", w: 0.32 });
    reg(hits, pitSwitch, "pit-stop-switch");

    // ------------------------------------------------------------------- tool + docs
    const chest = toolChest(g, 1.5, 1.55, { ry: -0.7, color: 0x2dd4bf });
    const meter = instrument(chest, -0.06, 0.79, 0.02, { ry: 0.3, idle: "-- V", color: 0x2dd4bf });
    holoTag(meter, "CAT III meter", 0, 0.16, 0, { css: "#2dd4bf", w: 0.28 });
    reg(hits, meter, "panel-meter");

    const workOrder = holoPanel(g, 0.56, 0.4, -1.85, 1.5, 1.0, (ctx, w, h) => {
      ctx.fillStyle = "rgba(6,16,22,0.9)"; ctx.fillRect(0, 0, w, h);
      ctx.fillStyle = "#2dd4bf"; ctx.fillRect(0, 0, w, 5);
      ctx.fillStyle = "#8fc4bc";
      ctx.font = `600 ${Math.round(h * 0.09)}px 'Barlow Condensed', Arial, sans-serif`;
      ctx.textAlign = "left"; ctx.textBaseline = "middle";
      ctx.fillText("WORK PERMIT EL-441", w * 0.06, h * 0.14);
      ctx.fillStyle = "#eafffb";
      ctx.font = `600 ${Math.round(h * 0.14)}px 'Barlow Condensed', Arial, sans-serif`;
      ctx.fillText("CAR 3 — PIT + CAR-TOP", w * 0.06, h * 0.33);
      ctx.font = `${Math.round(h * 0.085)}px Arial, sans-serif`;
      ctx.fillStyle = "#a9d6ce";
      ["Isolation: machine room DS-3", "Pit switch + car-top switch, both", "Governor tension: 190-210 N",
       "Signage: all landings out-of-service", "Test run before release"].forEach((line, i) =>
        ctx.fillText(line, w * 0.06, h * (0.5 + i * 0.11)));
    }, { ry: 0.7, accent: 0x2dd4bf });
    reg(hits, workOrder, "work-order");

    let live = true;
    let pitOn = false;
    let cartopOn = false;

    return {
      hits,
      footprint: 2.0,

      onStepComplete(step) {
        // discHandle is turned live by the player's drag while this step is active.
        if (step.id === "disconnect") { live = false; repaint(controllerScreen, signFace("ISOLATED", { bg: "#2a1a0d", accent: "#f2c14b", fg: "#ffe3ac", scale: 0.38 })); }
        if (step.id === "lock") appliedLock.visible = true;
        if (step.id === "verify-zero") repaint(controllerScreen, signFace("DE-ENERGISED", { bg: "#0d1c14", accent: "#59c97b", fg: "#bff7d4", scale: 0.3 }));
        if (step.id === "pit-switch") { pitOn = true; pitLever.rotation.x = -1.0; pitLamp.material = mat(0x59c97b, { emissive: 0x59c97b, ei: 1.8 }); }
        if (step.id === "cartop-switch") { cartopOn = true; cartopLever.rotation.x = -1.0; cartopLamp.material = mat(0x59c97b, { emissive: 0x59c97b, ei: 1.8 }); }
        if (step.id === "cartop-access") hatch.rotation.x = -1.1;
        if (step.id === "restore") {
          pitOn = false; cartopOn = false;
          pitLever.rotation.x = 0; cartopLever.rotation.x = 0;
          pitLamp.material = mat(0xd8232a, { emissive: 0xd8232a, ei: 1.6 });
          cartopLamp.material = mat(0xd8232a, { emissive: 0xd8232a, ei: 1.6 });
          appliedLock.visible = false; discHandle.rotation.z = 0; live = true;
          repaint(controllerScreen, signFace("READY", { bg: "#0d1c14", accent: "#59c97b", fg: "#bff7d4", scale: 0.4 }));
        }
        if (step.id === "test-run") repaint(controllerScreen, signFace("TEST\nTRIP OK", { bg: "#0d1c14", accent: "#2dd4bf", fg: "#bfeaf7", scale: 0.32 }));
      },

      animate(t, dt, session) {
        sumpWater.visible = true;
        sumpWater.userData.step(dt, new THREE.Vector3(0, 0.04, 0), 0.1, 0.08, -0.6);
        if (live) controllerScreen.material.emissiveIntensity = 0.7 + Math.sin(t * 2) * 0.15;

        const gg = session?.gauge;
        if (gg && !gg.committed) {
          if (session.step?.id === "verify-zero") {
            const v = Math.round(gg.t * 480);
            repaint(meter.userData.screen, signFace(`${v} V`, {
              bg: "#0d1c24", accent: v < 38 ? "#59c97b" : "#f0645b", fg: "#bfeaf7", scale: 0.6,
            }));
          }
          if (session.step?.id === "governor-check") {
            const n = Math.round(gg.t * 220);
            repaint(govInstrument.userData.screen, signFace(`${n} N`, {
              bg: "#0d1c24", accent: gg.t > 0.42 && gg.t < 0.58 ? "#59c97b" : "#f2c14b", fg: "#bfeaf7", scale: 0.55,
            }));
          }
        }
      },
    };
  },
};

  build(root) {

    const g = group(root);

    // -------------------------------------------------------------- containment area

    holoTag(flap, "Entry flap", 0, 1.85, 0.02, { css: "#f0645b", w: 0.3 });

    const fanGrille = cyl(naMachine, 0.13, 0.13, 0.03, 0, 0.24, 0.16, 0x22272c, { rough: 0.6, seg: 18 });
    fanGrille.rotation.x = Math.PI / 2;
    const fanBlades = group(naMachine, 0, 0.24, 0.145);
    for (let i = 0; i < 5; i++) {

      b.rotation.z = (i * Math.PI * 2) / 5;
    }
    const lamp = ball(naMachine, 0.012, 0.14, 0.4, 0.14, 0xd8232a, { emissive: 0xd8232a, ei: 1.5 });
    hose(cont, [[-0.55, 0.4, -0.24], [-0.7, 0.5, 0.1], [-0.78, 0.5, 0.6]], 0.05, 0xdfe4e8, { steps: 16, rough: 0.7 });
    holoTag(naMachine, "Negative-air unit", 0, 0.5, 0.2, { css: "#c9e265", w: 0.34 });
    reg(hits, naMachine, "negative-air-machine");

    const manometer = instrument(cont, -0.1, 0.95, -0.73, { ry: 0, idle: "0.000\"", color: 0xc9e265 });
    hose(cont, [[-0.1, 0.9, -0.72], [-0.3, 0.85, -0.5], [-0.55, 0.6, -0.4]], 0.006, 0xdfe4e8, { steps: 10, rough: 0.7 });
    holoTag(manometer, "Manometer", 0, 0.16, 0, { css: "#c9e265", w: 0.28 });
    reg(hits, manometer, "manometer");

    // Dry scraper — the trap on a shelf beside the wet-method sprayer.
    const dryTool = group(cont, 0.5, 0, -0.4, -0.2);
    box(dryTool, 0.02, 0.02, 0.3, 0, 0.5, 0, 0x8b929a, { rough: 0.4, metal: 0.6 });
    box(dryTool, 0.08, 0.04, 0.01, 0, 0.5, 0.15, 0xc0c6cc, { rough: 0.35, metal: 0.7 });
    holoTag(dryTool, "Dry scraper", 0, 0.6, 0, { css: "#f0645b", w: 0.28 });
    reg(hits, dryTool, "dry-removal-tool");

    const sprayer = group(cont, 0.5, 0, -0.05, -0.2);
    cyl(sprayer, 0.08, 0.09, 0.32, 0, 0.2, 0, 0x59c97b, { rough: 0.5, metal: 0.2, seg: 16 });
    cyl(sprayer, 0.012, 0.012, 0.2, 0.06, 0.42, 0, 0x22272c, { rough: 0.5, seg: 8 }).rotation.z = Math.PI / 2.4;
    holoTag(sprayer, "Amended water", 0, 0.5, 0, { css: "#c9e265", w: 0.34 });
    reg(hits, sprayer, "sprayer");

    // Wrapped pipe material overhead — the ACM to remove.
    const acm = group(cont, 0.1, 0, 0.35);
    const pipe = cyl(acm, 0.045, 0.045, 1.1, 0, 1.6, 0, 0xd8cba0, { rough: 0.8, seg: 14 });
    pipe.rotation.z = Math.PI / 2;
    holoTag(acm, "Pipe insulation — ACM", 0, 1.78, 0, { css: "#c9e265", w: 0.4 });
    reg(hits, acm, "acm-material");

    const wasteStation = group(cont, -0.4, 0, 0.5, 0.3);
    box(wasteStation, 0.3, 0.02, 0.24, 0, 0.02, 0, 0x2b3138, { rough: 0.7 });
    const bagInner = box(wasteStation, 0.24, 0.2, 0.2, 0, 0.12, 0, 0xd8232a, { rough: 0.55 });
    const bagOuter = box(wasteStation, 0.28, 0.24, 0.24, 0, 0.14, 0, 0xf2c14b, { rough: 0.55, opacity: 0.001 });
    bagOuter.material.transparent = true;
    decal(wasteStation, 0.2, 0.06, 0, 0.24, 0.101, signFace("ACM WASTE", { bg: "#7d1512", accent: "#f2ae14", scale: 0.5 }), { px: 128 });
    holoTag(wasteStation, "Waste bagging", 0, 0.34, 0, { css: "#c9e265", w: 0.32 });
    reg(hits, wasteStation, "waste-bag");

    // ------------------------------------------------------------------- PPE station
    const ppe = group(g, 1.4, 0, -1.4, -0.6);
    slab(ppe, 0.5, 1.6, 0.1, 0, 0.8, 0, 0x53585e, { radius: 0.02, rough: 0.5, metal: 0.4 });
    const coverallsHook = group(ppe, -0.14, 0.9, 0.07);
    box(coverallsHook, 0.16, 0.5, 0.05, 0, -0.1, 0, 0xdfe6a8, { rough: 0.85 });
    holoTag(coverallsHook, "Coveralls", 0, 0.22, 0, { css: "#c9e265", w: 0.28 });
    reg(hits, coverallsHook, "coveralls");

    const respMask = group(ppe, 0.14, 0.95, 0.08);
    box(respMask, 0.12, 0.08, 0.06, 0, 0, 0, 0x2b3138, { rough: 0.5, metal: 0.2 });
    torus(respMask, 0.045, 0.012, 0, 0, 0.03, 0x3c4650, { rough: 0.4 });
    holoTag(respMask, "Respirator", 0, 0.14, 0, { css: "#c9e265", w: 0.28 });
    reg(hits, respMask, "respirator");

    const gloveTape = group(ppe, 0, 1.35, 0.07);
    box(gloveTape, 0.1, 0.05, 0.1, -0.08, 0, 0, 0xf2c14b, { rough: 0.6 });
    cyl(gloveTape, 0.04, 0.04, 0.03, 0.08, 0, 0, 0xdfe4e8, { rough: 0.6, seg: 14 }).rotation.x = Math.PI / 2;
    holoTag(gloveTape, "Gloves + tape", 0, 0.14, 0, { css: "#c9e265", w: 0.3 });
    reg(hits, gloveTape, "glove-tape");

    // --------------------------------------------------------------------- decon line
    const decon = group(g, 1.1, 0, 1.0, -0.5);
    const dirty = group(decon, -0.7, 0, 0);
    box(dirty, 0.7, 1.9, 0.7, 0, 0.95, 0, 0x3a4048, { rough: 0.9, cast: false });
    decal(dirty, 0.3, 0.06, 0, 1.55, 0.36, signFace("DIRTY ROOM", { bg: "#2a1a0d", accent: "#f2c14b", scale: 0.45 }));
    holoTag(dirty, "1 · Dirty room", 0, 1.75, 0.36, { css: "#c9e265", w: 0.34 });
    reg(hits, dirty, "dirty-room");

    // Bin near the dirty room — the temptation to strip the respirator early.

    cyl(binTrap, 0.1, 0.09, 0.2, 0, 0.1, 0, 0x2b3138, { rough: 0.6, seg: 14 });
    holoTag(binTrap, "Bin", 0, 0.24, 0, { css: "#f0645b", w: 0.2 });
    reg(hits, binTrap, "early-respirator-removal");

    const shower = group(decon, 0, 0, 0);
    box(shower, 0.7, 1.9, 0.7, 0, 0.95, 0, 0x2f6f8c, { rough: 0.7, cast: false });
    const showerHead = cyl(shower, 0.03, 0.03, 0.1, 0, 1.7, 0, CITY.steel, { rough: 0.4, metal: 0.7, seg: 10 });
    const showerSpray = particles(shower, 30, 0xbfe4ff, { size: 0.014, life: 0.4, additive: false, opacity: 0.5 });
    decal(shower, 0.3, 0.06, 0, 1.55, 0.36, signFace("SHOWER", { bg: "#0d2430", accent: "#4fa3ff", scale: 0.45 }));
    holoTag(shower, "2 · Shower", 0, 1.75, 0.36, { css: "#c9e265", w: 0.3 });
    reg(hits, shower, "shower-stage");

    const clean = group(decon, 0.7, 0, 0);
    box(clean, 0.7, 1.9, 0.7, 0, 0.95, 0, 0xdfe6d8, { rough: 0.6, cast: false });
    decal(clean, 0.3, 0.06, 0, 1.55, 0.36, signFace("CLEAN ROOM", { bg: "#0f1b14", accent: "#59c97b", scale: 0.42 }));
    holoTag(clean, "3 · Clean room", 0, 1.75, 0.36, { css: "#c9e265", w: 0.34 });
    reg(hits, clean, "clean-room");

    // A loose unlabeled bag left in the clean room — the trap.
    const strayBag = group(clean, -0.2, 0, 0.2);
    box(strayBag, 0.18, 0.14, 0.14, 0, 0.07, 0, 0x7a7a7a, { rough: 0.7 });
    holoTag(strayBag, "Unlabeled bag", 0, 0.2, 0, { css: "#f0645b", w: 0.3 });
    reg(hits, strayBag, "unlabeled-bag");

    // ------------------------------------------------------------------- paperwork
    const chest = toolChest(g, -1.7, 1.3, { ry: 0.7, color: 0xc9e265 });
    const plan = holoPanel(g, 0.56, 0.4, -1.8, 1.5, 1.5, (ctx, w, h) => {
      ctx.fillStyle = "rgba(10,14,4,0.9)"; ctx.fillRect(0, 0, w, h);
      ctx.fillStyle = "#c9e265"; ctx.fillRect(0, 0, w, 5);
      ctx.fillStyle = "#c8d19a";
      ctx.font = `600 ${Math.round(h * 0.09)}px 'Barlow Condensed', Arial, sans-serif`;
      ctx.textAlign = "left"; ctx.textBaseline = "middle";
      ctx.fillText("CONTAINMENT PLAN AB-19", w * 0.06, h * 0.14);
      ctx.fillStyle = "#f4f8e6";
      ctx.font = `600 ${Math.round(h * 0.13)}px 'Barlow Condensed', Arial, sans-serif`;
      ctx.fillText("PIPE INSULATION — FRIABLE ACM", w * 0.06, h * 0.33);
      ctx.font = `${Math.round(h * 0.08)}px Arial, sans-serif`;
      ctx.fillStyle = "#c8d19a";
      ["Pressure: -0.02\" WC minimum", "Method: wet removal only",
       "Decon: dirty, shower, clean — in order", "Waste: double bag + label",
       "Respirator off in clean room only"].forEach((line, i) => ctx.fillText(line, w * 0.06, h * (0.5 + i * 0.11)));
    }, { ry: 0.7, accent: 0xc9e265 });
    reg(hits, plan, "work-plan");

    let naRunning = false;
    let wetted = false;

    return {
      hits,
      footprint: 2.05,

      onStepComplete(step) {
        if (step.id === "negative-air") { naRunning = true; lamp.material = mat(0x59c97b, { emissive: 0x59c97b, ei: 1.6 }); }
        if (step.id === "pressure-check") repaint(manometer.userData.screen, signFace("-0.03\"", { bg: "#0f1b14", accent: "#59c97b", fg: "#bff7d4", scale: 0.55 }));
        if (step.id === "wet-method") { wetted = true; pipe.material = mat(0xb0a67c, { rough: 0.5 }); }
        if (step.id === "removal") acm.visible = false;
        if (step.id === "bag-label") { bagOuter.material.transparent = false; bagOuter.material.opacity = 1; }
        if (step.id === "respirator-off") respMask.visible = false;
      },

      animate(t, dt, session) {
        if (naRunning) fanBlades.rotation.z += dt * 14;
        showerSpray.visible = session?.step?.id === "decon-sequence";
        if (showerSpray.visible) showerSpray.userData.step(dt, new THREE.Vector3(1.1 + 0, 2.3, 1.0), 0.05, 0.5, -1.4);

        const gg = session?.gauge;
        if (gg && !gg.committed && session.step?.id === "pressure-check") {
          const v = (gg.t * 0.09).toFixed(3);
          repaint(manometer.userData.screen, signFace(`-${v}"`, {
            bg: "#0d1c24", accent: gg.t > 0.22 && gg.t < 0.5 ? "#59c97b" : "#f0645b", fg: "#bfeaf7", scale: 0.5,
          }));
        }
      },
    };
  },
};
