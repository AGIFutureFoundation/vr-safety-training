      signFace("WAIT\n10:00", { bg: "#2a1a0d", accent: "#f2c14b", fg: "#ffe3ac", scale: 0.34 }),
      { glow: true, ei: 0.9, px: 320 });
    holoTag(timer, "Discharge timer", 0, 1.34, 0.03, { css: "#f2c14b", w: 0.32 });
    reg(hits, timer, "discharge-timer");

    let energised = true;
    let dcVolts = 780;
    let arcTimer = 0;

    return {
      hits,
      footprint: 1.95,

      onStepComplete(step) {
        if (step.id === "stopsession") {
          repaint(hmi, signFace("SESSION\nENDED", { bg: "#0d1c14", accent: "#59c97b", fg: "#bff7d4", scale: 0.3 }));
        }
        if (step.id === "isolate") {
          energised = false;
          handlePivot.rotation.z = -Math.PI / 2.2;
          statusBar.material = mat(0xf2c14b, { emissive: 0xf2c14b, ei: 1.2, rough: 0.4 });
          repaint(hmi, signFace("ISOLATED", { bg: "#2a1a0d", accent: "#f2c14b", fg: "#ffe3ac", scale: 0.36 }));
        }
        if (step.id === "lock") appliedLock.visible = true;
        if (step.id === "discharge") dcVolts = 6;
        if (step.id === "verify") {
          guard.visible = false;
          repaint(timerFace, signFace("SAFE\n0 V", { bg: "#0d1c14", accent: "#59c97b", fg: "#bff7d4", scale: 0.34 }));
        }
        if (step.id === "swap") modules[1].position.x = 0.55;
        if (step.id === "restore") {
          statusBar.material = mat(0x59c97b, { emissive: 0x59c97b, ei: 1.9, rough: 0.4 });
          repaint(hmi, signFace("READY\n350 kW", { bg: "#0d1c14", accent: "#59c97b", fg: "#bff7d4", scale: 0.3 }));
        }
      },

      onHazard(hitId) { if (hitId === "dc-busbar" && dcVolts > 60) arcTimer = 0.5; },

      animate(t, dt, session) {
        statusBar.material.emissiveIntensity = 1.5 + Math.sin(t * 2.2) * 0.5;

        // The discharge timer counts down while the learner actually stands there.
        const step = session?.step;
        if (step?.id === "discharge") {
          const left = Math.max(0, step.seconds - (session.holdFor ?? 0));
          const mm = Math.floor((left / step.seconds) * 10);
          const ss = Math.floor(((left / step.seconds) * 600) % 60);
          repaint(timerFace, signFace(`WAIT\n${String(mm).padStart(2, "0")}:${String(ss).padStart(2, "0")}`, {
            bg: session.holding ? "#0d1c14" : "#2a1a0d",
            accent: session.holding ? "#59c97b" : "#f2c14b",
            fg: session.holding ? "#bff7d4" : "#ffe3ac", scale: 0.34,
          }));
          dcVolts = 780 * (1 - (session.holdFor ?? 0) / step.seconds);
        }

        if (arcTimer > 0) {
          arcTimer -= dt;
          dcSpark.visible = true;
          dcSpark.userData.step(dt, new THREE.Vector3(0, 0, 0.04), 0.16, 1.8, -3.5);
        } else if (dcSpark.visible) dcSpark.visible = false;

        const gg = session?.gauge;
        if (gg && !gg.committed && step?.id === "verify") {
          const v = Math.round(gg.t * 820);
          repaint(meter.userData.screen, signFace(`${v} V`, {
            bg: "#0d1c24", accent: v < 60 ? "#59c97b" : "#f0645b", fg: "#bfeaf7", scale: 0.62,
          }));
        }
        if (gg && !gg.committed && step?.id === "torque") {
          repaint(wrenchScale, signFace(`${Math.round(8 + gg.t * 34)}`, {
            bg: "#1b2026", accent: gg.t > 0.44 && gg.t < 0.62 ? "#59c97b" : "#f2c14b", scale: 0.7,
          }));
        }
      },
    };
  },
};

      gauge: {

      cue: "Pick the zone up in reverse order, arrow board last out of the lane.",
      why: "The zone comes down from the traffic side inward, so you are never the first thing an approaching driver meets unprotected.",
    },
  ],

  build(root) {
    const hits = {};
    const g = group(root);
    stationPad(g, 2.0, 0xf2c14b);

    // Kerb and a slice of roadway, so the station reads as street furniture.
    box(g, 4.4, 0.14, 1.3, 0.4, 0.07, 1.55, 0x3b4148, { rough: 0.95 });
    box(g, 4.4, 0.02, 0.12, 0.4, 0.15, 0.95, 0xd8dce0, { rough: 0.9, cast: false });
    for (let i = 0; i < 5; i++) {
      box(g, 0.5, 0.004, 0.1, -1.4 + i * 0.95, 0.145, 2.05, 0xe8dfae, { rough: 0.9, cast: false });
    }
    reg(hits, box(g, 4.2, 0.02, 0.7, 0.4, 0.16, 2.1, 0x2f3439, { rough: 0.95, cast: false }), "step-into-road");

    // ------------------------------------------------------- controller cabinet
    const cab = equipmentCabinet(g, 0.72, 1.5, 0.56, -0.75, -0.4, { ry: 0.18, color: CAB, metal: 0.55 });
    cab.userData.door.rotation.y = 1.35;
    decal(cab, 0.3, 0.08, 0, 1.66, 0.29, signFace("TS2 · INT 118", { accent: "#f2c14b", scale: 0.55 }));
    holoTag(cab, "Controller cabinet", 0, 1.86, 0.1, { css: "#f2c14b", w: 0.36 });
    const lockBody = box(cab, 0.05, 0.07, 0.04, 0.3, 0.9, 0.3, CITY.steel, { rough: 0.3, metal: 0.9 });
    reg(hits, lockBody, "cabinet-lock");

    // Rack inside the cabinet.
    const rack = group(cab, 0, 0.09, 0.06);
    box(rack, 0.62, 1.4, 0.04, 0, 0.75, -0.2, 0x191f24, { rough: 0.9 });
    const controllerFace = decal(rack, 0.5, 0.22, 0, 1.28, 0.03,
      signFace("PHASE 2 · GREEN\nCYCLE 96 s", { bg: "#101a12", accent: "#59c97b", fg: "#bff7d4", scale: 0.26 }),
      { glow: true, ei: 0.9, px: 448 });
    reg(hits, controllerFace, "controller-face");

    // Load switch bank — one scorched, one healthy, plus the monitor and supply.
    const bank = group(rack, 0, 0.92, 0.02);
    const scorched = group(bank, -0.17, 0, 0);
    box(scorched, 0.11, 0.2, 0.11, 0, 0, 0, 0x4a3a30, { rough: 0.75 });
    box(scorched, 0.09, 0.05, 0.02, 0, 0.06, 0.06, 0x2a1c14, { rough: 0.9 });
    ball(scorched, 0.009, 0, -0.06, 0.06, 0xf0645b, { emissive: 0xf0645b, ei: 2.2 });
    decal(scorched, 0.08, 0.03, 0, -0.11, 0.06, signFace("LS-2", { scale: 0.6, accent: "#f0645b" }));
    reg(hits, scorched, "fault-loadswitch");

    const healthy = group(bank, 0.0, 0, 0);
    box(healthy, 0.11, 0.2, 0.11, 0, 0, 0, 0x2b3138, { rough: 0.6 });
    ball(healthy, 0.009, 0, -0.06, 0.06, CITY.good, { emissive: CITY.good, ei: 2.2 });
    decal(healthy, 0.08, 0.03, 0, -0.11, 0.06, signFace("LS-4", { scale: 0.6, accent: "#59c97b" }));
    reg(hits, healthy, "healthy-switch");

    const replacement = group(bank, -0.17, 0, 0);
    box(replacement, 0.11, 0.2, 0.11, 0, 0, 0, 0x2b3138, { rough: 0.6 });
    ball(replacement, 0.009, 0, -0.06, 0.06, CITY.good, { emissive: CITY.good, ei: 2.2 });
    replacement.visible = false;

    const monitor = group(bank, 0.19, 0, 0);
    box(monitor, 0.13, 0.22, 0.11, 0, 0, 0, 0x22303c, { rough: 0.5 });
    const monitorFace = decal(monitor, 0.1, 0.07, 0, 0.05, 0.06,
      signFace("MMU", { bg: "#0d1c24", accent: "#4fd1ff", scale: 0.6 }), { glow: true, ei: 0.8 });
    for (let i = 0; i < 3; i++) {
      ball(monitor, 0.007, -0.03 + i * 0.03, -0.05, 0.06, [CITY.good, CITY.hiVis, CITY.alert][i],
        { emissive: [CITY.good, CITY.hiVis, CITY.alert][i], ei: 1.6 });
    }
    holoTag(monitor, "Conflict monitor", 0, 0.17, 0.06, { css: "#4fd1ff", w: 0.3 });
    reg(hits, monitor, "monitor-unit");

    const supply = group(bank, 0.36, 0, 0);
    box(supply, 0.09, 0.2, 0.11, 0, 0, 0, 0x2b3138, { rough: 0.6 });
    ball(supply, 0.008, 0, -0.06, 0.06, CITY.good, { emissive: CITY.good, ei: 2 });
    reg(hits, supply, "power-supply");

    // The monitor bypass jumper, hanging where a previous crew left it.
    const bypass = group(rack, 0.24, 0.66, 0.06);
    hose(bypass, [[0, 0, 0], [0.03, -0.07, 0.02], [0, -0.14, 0]], 0.005, 0xf0645b, { steps: 10 });
    for (const y of [0, -0.14]) box(bypass, 0.016, 0.012, 0.012, 0, y, 0, 0x22262b, { rough: 0.5 });
    holoTag(bypass, "Bypass jumper", 0.02, 0.08, 0.02, { css: "#f0645b", w: 0.26, h: 0.055 });
    reg(hits, bypass, "conflict-bypass");

    // Field terminal block — live even in flash.
    const terminals = group(rack, 0, 0.42, 0.03);
    box(terminals, 0.56, 0.1, 0.06, 0, 0, 0, 0x1b2026, { rough: 0.7 });
    for (let i = 0; i < 12; i++) {
      cyl(terminals, 0.008, 0.008, 0.03, -0.25 + i * 0.045, 0.02, 0.04, 0xb87333,
        { rough: 0.35, metal: 0.9, seg: 8 }).rotation.x = Math.PI / 2;
    }
    reg(hits, terminals, "live-terminals");

    // Corroded ground bond at the base of the cabinet.
    const bond = group(rack, -0.24, 0.14, 0.02);
    box(bond, 0.05, 0.05, 0.02, 0, 0, 0, 0x7f8b6a, { rough: 0.95 });
    hose(bond, [[0, 0, 0.01], [0.04, -0.07, 0.03], [0.02, -0.13, 0]], 0.008, 0x5f7a4a, { steps: 10, rough: 0.95 });
    reg(hits, bond, "fault-ground");

    // Detector loop terminals on the lower shelf, one backed out.
    const loops = group(rack, 0.14, 0.2, 0.02);
    box(loops, 0.22, 0.07, 0.06, 0, 0, 0, 0x1b2026, { rough: 0.7 });
    for (let i = 0; i < 4; i++) {
      const lead = cyl(loops, 0.005, 0.005, i === 2 ? 0.1 : 0.05, -0.075 + i * 0.05, 0.02, 0.04,
        i === 2 ? 0xf2c14b : 0x2b6f8c, { rough: 0.6, seg: 8 });
      lead.rotation.x = i === 2 ? Math.PI / 2.6 : Math.PI / 2;
    }
    reg(hits, loops, "fault-detector");

    // Flash transfer switch on the cabinet frame.
    const flash = group(cab, -0.26, 1.2, 0.3);
    box(flash, 0.1, 0.14, 0.04, 0, 0, 0, 0x22262b, { rough: 0.5, metal: 0.5 });
    const flashLever = box(flash, 0.03, 0.08, 0.03, 0, -0.02, 0.03, 0xf0645b, { rough: 0.5 });
    decal(flash, 0.09, 0.03, 0, 0.055, 0.025, signFace("FLASH", { accent: "#f2c14b", scale: 0.6 }));
    reg(hits, flash, "flash-switch");

    // ------------------------------------------------------------ signal head
    const mast = group(g, 1.45, 0, -0.9);
    cyl(mast, 0.07, 0.09, 3.1, 0, 1.55, 0, 0x4d545b, { rough: 0.6, metal: 0.5, seg: 14 });
    cyl(mast, 0.2, 0.24, 0.12, 0, 0.06, 0, 0x3b4148, { rough: 0.7, seg: 16 });
    const arm = group(mast, 0, 3.0, 0);
    cyl(arm, 0.05, 0.05, 1.5, -0.75, 0, 0, 0x4d545b, { rough: 0.6, metal: 0.5, seg: 12 }).rotation.z = Math.PI / 2;
    const headGroup = group(arm, -1.35, -0.32, 0);
    box(headGroup, 0.22, 0.62, 0.18, 0, 0, 0, 0x1f2429, { rough: 0.7 });
    const lamps = [];
    for (let i = 0; i < 3; i++) {
      const colour = [0xf0645b, 0xf2c14b, 0x59c97b][i];
      const lamp = ball(headGroup, 0.062, 0, 0.19 - i * 0.19, 0.09, colour,
        { emissive: colour, ei: i === 2 ? 2.4 : 0.15, rough: 0.4 });
      box(headGroup, 0.2, 0.03, 0.11, 0, 0.25 - i * 0.19, 0.12, 0x14171a, { rough: 0.8 });
      lamps.push(lamp);
    }
    holoTag(mast, "Approach 2", 0, 2.3, 0.1, { css: "#f2c14b", w: 0.26 });

    // Unsecured ladder leaning on the mast — the trap.
    const ladder = group(g, 1.9, 0, -0.2, -0.5);
    for (const sx of [-1, 1]) {
      const rail = cyl(ladder, 0.022, 0.022, 2.6, sx * 0.17, 1.25, 0, 0xc0c6cc, { rough: 0.4, metal: 0.7, seg: 8 });
      rail.rotation.x = 0.28;
    }
    for (let i = 0; i < 8; i++) {
      const rung = cyl(ladder, 0.014, 0.014, 0.34, 0, 0.25 + i * 0.3, -0.34 + i * 0.085, 0xc0c6cc,
        { rough: 0.4, metal: 0.7, seg: 8 });
      rung.rotation.z = Math.PI / 2;
    }
    reg(hits, ladder, "ladder-unsecured");

    // --------------------------------------------------------- work zone kit
    reg(hits, cone(g, -1.55, 1.15), "cone-a");
    reg(hits, cone(g, -0.35, 1.7), "cone-b");

    const sign = group(g, -2.05, 0, 0.35, 0.7);
    cyl(sign, 0.02, 0.02, 1.2, 0, 0.6, 0, 0x4d545b, { rough: 0.5, metal: 0.6, seg: 10 });
    const signFacePanel = decal(sign, 0.52, 0.52, 0, 1.35, 0.01, (ctx, w, h) => {
      ctx.save(); ctx.translate(w / 2, h / 2); ctx.rotate(Math.PI / 4);
      ctx.fillStyle = "#f2a51e"; ctx.fillRect(-w * 0.33, -h * 0.33, w * 0.66, h * 0.66);
      ctx.strokeStyle = "#1b1e22"; ctx.lineWidth = 6;
      ctx.strokeRect(-w * 0.33, -h * 0.33, w * 0.66, h * 0.66);
      ctx.restore();
      ctx.fillStyle = "#1b1e22";
      ctx.font = `600 ${Math.round(h * 0.13)}px 'Barlow Condensed', Arial, sans-serif`;
      ctx.textAlign = "center"; ctx.textBaseline = "middle";
      ctx.fillText("SIGNAL", w / 2, h * 0.44);
      ctx.fillText("CREW", w / 2, h * 0.58);
    }, { px: 320, transparent: true });
    reg(hits, sign, "sign-advance");

    const arrowBoard = group(g, 0.9, 0, 1.75, 0.15);
    box(arrowBoard, 1.0, 0.55, 0.08, 0, 1.15, 0, 0x1b1e22, { rough: 0.6 });
    for (const sx of [-1, 1]) cyl(arrowBoard, 0.025, 0.03, 0.9, sx * 0.4, 0.45, 0, 0x4d545b, { rough: 0.5, metal: 0.6, seg: 10 });
    box(arrowBoard, 1.0, 0.06, 0.4, 0, 0.03, 0, 0x2b3138, { rough: 0.7 });
    const arrowLamps = [];
    for (let i = 0; i < 9; i++) {
      const lx = -0.36 + (i % 5) * 0.18;
      const ly = 1.15 + (i < 5 ? 0 : (i < 7 ? 0.14 : -0.14));
      const l = ball(arrowBoard, 0.026, lx, ly, 0.05, 0xf2c14b, { emissive: 0xf2c14b, ei: 0.4, rough: 0.4 });
      arrowLamps.push(l);
    }
    holoTag(arrowBoard, "Arrow board", 0, 1.55, 0.05, { css: "#f2c14b", w: 0.3 });
    reg(hits, arrowBoard, "arrow-board");

    // Crew vehicle side: vest and radio on the tailgate.
    const chest = toolChest(g, -1.85, -1.2, { ry: 0.9, color: 0xf2a51e });
    const vest = group(chest, 0, 0.79, 0);
    box(vest, 0.3, 0.06, 0.22, 0, 0, 0, 0xf2c14b, { rough: 0.85 });
    for (const z of [-0.06, 0.06]) box(vest, 0.31, 0.02, 0.04, 0, 0.035, z, 0xdfe8ee, { rough: 0.5 });
    holoTag(vest, "Class 3 vest", 0, 0.2, 0, { css: "#f2c14b", w: 0.28 });
    reg(hits, vest, "hi-vis");

    const radio = group(chest, 0.18, 0.82, 0.1, -0.4);
    slab(radio, 0.07, 0.13, 0.04, 0, 0, 0, 0x22262b, { radius: 0.01, rough: 0.6 });
    cyl(radio, 0.005, 0.005, 0.14, 0.025, 0.12, 0, 0x14171a, { rough: 0.6, seg: 8 });
    ball(radio, 0.007, -0.02, 0.06, 0.021, CITY.good, { emissive: CITY.good, ei: 2 });
    holoTag(radio, "TMC radio", 0, 0.2, 0, { css: "#f2c14b", w: 0.24 });
    reg(hits, radio, "radio");

    // Holographic intersection state board.
    const board = holoPanel(g, 0.6, 0.4, -1.9, 1.55, -1.7, (ctx, w, h) => {
      ctx.fillStyle = "rgba(6,16,22,0.9)"; ctx.fillRect(0, 0, w, h);
      ctx.fillStyle = "#f2c14b"; ctx.fillRect(0, 0, w, 5);
      ctx.fillStyle = "#8fb3c4";
      ctx.font = `600 ${Math.round(h * 0.09)}px 'Barlow Condensed', Arial, sans-serif`;
      ctx.textAlign = "left"; ctx.textBaseline = "middle";
      ctx.fillText("INTERSECTION 118 · 5TH & CANAL", w * 0.06, h * 0.14);
      ctx.fillStyle = "#eaf6fb";
      ctx.font = `600 ${Math.round(h * 0.15)}px 'Barlow Condensed', Arial, sans-serif`;
      ctx.fillText("PHASE 2 DROPPED — NO CALL", w * 0.06, h * 0.33);
      ctx.font = `${Math.round(h * 0.085)}px Arial, sans-serif`;
      ctx.fillStyle = "#a9c6d6";
      ["Approach speed: 50 km/h", "Yellow change: 4.0 s calculated",
       "MMU trip window: 0.60 – 0.80 s", "Detector: loop 2B intermittent",
       "TMC contact: channel 4"].forEach((line, i) => ctx.fillText(line, w * 0.06, h * (0.5 + i * 0.11)));
    }, { ry: 0.8, accent: 0xf2c14b });

    let inFlash = false;
    let phase = 0;
    let phaseTimer = 0;

    return {
      hits,
      footprint: 2.0,

      onStepComplete(step) {
        if (step.id === "zone") arrowLamps.forEach((l) => { l.material = mat(0xf2c14b, { emissive: 0xf2c14b, ei: 2.4, rough: 0.4 }); });
        if (step.id === "open") cab.userData.door.rotation.y = 2.0;
        if (step.id === "flash" && !inFlash) {
          inFlash = true;
          flashLever.rotation.z = -0.9;
          repaint(controllerFace, signFace("FLASH MODE\nALL RED", {
            bg: "#2a1416", accent: "#f0645b", fg: "#ffd2ce", scale: 0.26,
          }));
        } else if (step.id === "restore") {
          inFlash = false;
          flashLever.rotation.z = 0;
          repaint(controllerFace, signFace("NORMAL · CYCLE 96 s", {
            bg: "#101a12", accent: "#59c97b", fg: "#bff7d4", scale: 0.24,
          }));
        }
        if (step.id === "replace") { scorched.visible = false; replacement.visible = true; }
        if (step.id === "monitor") {
          repaint(monitorFace, signFace("PASS", { bg: "#0d1c14", accent: "#59c97b", fg: "#bff7d4", scale: 0.6 }));
        }
        if (step.id === "clear") arrowLamps.forEach((l) => { l.material = mat(0xf2c14b, { emissive: 0xf2c14b, ei: 0.3, rough: 0.4 }); });
      },

      animate(t, dt, session) {
        // The head actually runs: flashing red in flash, cycling otherwise.
        phaseTimer += dt;
        if (inFlash) {
          const on = Math.floor(t * 1.6) % 2 === 0;
          lamps[0].material.emissiveIntensity = on ? 2.6 : 0.1;
          lamps[1].material.emissiveIntensity = 0.1;
          lamps[2].material.emissiveIntensity = 0.1;
        } else {
          if (phaseTimer > 4) { phaseTimer = 0; phase = (phase + 1) % 3; }
          const order = [2, 1, 0];
          lamps.forEach((l, i) => { l.material.emissiveIntensity = i === order[phase] ? 2.4 : 0.12; });
        }
        arrowLamps.forEach((l, i) => {
          if (l.material.emissiveIntensity > 1) {
            l.material.emissiveIntensity = 1.6 + Math.sin(t * 6 - i * 0.5) * 1.0;
          }
        });

        const gg = session?.gauge;
        if (gg && !gg.committed && session.step?.id === "timing") {
          repaint(controllerFace, signFace(`YELLOW ${(2 + gg.t * 4).toFixed(1)} s`, {
            bg: "#101a12", accent: gg.t > 0.42 && gg.t < 0.58 ? "#59c97b" : "#f2c14b",
            fg: "#bff7d4", scale: 0.34,
          }));
        }
        if (gg && !gg.committed && session.step?.id === "monitor") {
          repaint(monitorFace, signFace(`${(gg.t * 1.2).toFixed(2)}`, {
            bg: "#0d1c24", accent: gg.t > 0.5 && gg.t < 0.66 ? "#59c97b" : "#f2c14b", scale: 0.6,
          }));
        }
      },
    };
  },
};

// SmartCiti.X~ Valve Vault VR — its own gamified system: Entry Authority.

const SIM_VALVE_VAULT = {

      title: "Guard the opening",
      cue: "Cone the approach and set the guard rail around the hatch.",
      why: "The opening is a hazard to everyone who is not on your crew. It gets guarded before the cover comes off and stays guarded until it goes back.",
    },
    {
      id: "roles", kind: "sequence",
      targets: ["badge-supervisor", "badge-attendant", "badge-entrant"],
      itemNames: {

      title: "Assign the entry roles",

      itemNames: { "test-oxygen": "oxygen", "test-flammable": "flammable gas", "test-toxic": "toxic gas" },
      title: "Test the atmosphere in order",
      cue: "Oxygen first, then flammable, then toxic — top, middle and bottom of the space.",
      why: "Oxygen comes first because the flammable sensor cannot be trusted in an oxygen-deficient atmosphere. The order is not a convention, it is what makes the other two readings mean anything.",
      outOfOrderNote: "Wrong order. Oxygen is measured first — the combustible sensor's reading depends on it.",
    },
    {
      id: "oxygen-level", kind: "gauge", target: "gas-meter",
      title: "Confirm the oxygen reading",
      cue: "Hold the meter at the working level and commit inside the acceptable range.",
      why: "Between 19.5% and 23.5%. Below and you lose consciousness without warning; above and everything in the space becomes far more flammable than it looks.",
      gauge: {
        label: "OXYGEN", speed: 0.6, green: [0.46, 0.6],
        readout: (t) => `${(15 + t * 12).toFixed(1)} % O₂`,
        missNote: "Outside the acceptable range. Keep ventilating and re-test — nobody enters on that reading.",
      },
    },
    {
      id: "retrieval", kind: "select", target: "tripod",
      title: "Rig the retrieval system",
      cue: "Stand the tripod and run the winch line to the entrant's harness.",
      why: "A vertical space needs a retrieval line attached before entry, because a rescue that starts by finding equipment has already lost the time it needed.",
    },
    {
      id: "harness", kind: "select", target: "harness",
      title: "Fit the full-body harness",
      cue: "Harness the entrant and clip the retrieval line at the dorsal D-ring.",
      why: "The dorsal attachment is what lets a winch lift somebody through an opening they cannot climb out of.",
    },
    {
      id: "comms", kind: "hold", target: "attendant", seconds: 10,
      title: "Establish continuous communication",
      cue: "Hold contact with the attendant while the entrant descends.",
      why: "Continuous means continuous. The attendant's only job is to stay in contact and to never, under any circumstance, go in themselves.",
      holdBreakNote: "Contact dropped. The attendant lost the entrant — re-establish and hold it all the way down.",
    },
    {
      id: "exit", kind: "select", target: "permit-board",
      title: "Close the permit",
      cue: "Entrant out, headcount, sign the permit closed.",
      why: "The entry is not over when the last person climbs out — it is over when the space is secured and the permit is closed against a headcount.",
    },
  ],

  build(root) {
    const hits = {};
    const g = group(root);
    stationPad(g, 2.0, 0x4fa3ff);

    // Footway slab with the vault opening cut into it.
    box(g, 4.2, 0.18, 4.2, 0, 0.09, 0, 0x555c63, { rough: 0.95 });
    for (let i = -2; i <= 2; i++) {
      box(g, 4.2, 0.004, 0.02, 0, 0.185, i * 0.85, 0x424951, { cast: false, receive: false });
      box(g, 0.02, 0.004, 4.2, i * 0.85, 0.185, 0, 0x424951, { cast: false, receive: false });
    }

    // The vault: a dark shaft with a ladder and pipework at the bottom.
    const shaftRadius = 0.52;
    const shaft = group(g, -0.25, 0, -0.15);
    cyl(shaft, shaftRadius, shaftRadius, 2.2, 0, -1.0, 0, 0x161b21,
      { rough: 0.98, seg: 28, open: true, side: 2, cast: false });
    cyl(shaft, shaftRadius, shaftRadius, 0.02, 0, -2.1, 0, 0x11151a, { rough: 0.98, seg: 24, cast: false });
    torus(shaft, shaftRadius + 0.04, 0.04, 0, 0.19, 0, 0x6f7a83, { rough: 0.6, metal: 0.5, seg: 8, seg2: 32 });
    const cover = cyl(shaft, shaftRadius + 0.02, shaftRadius + 0.02, 0.05, 0.95, 0.21, 0.5, 0x4d545b,
      { rough: 0.8, metal: 0.4, seg: 26 });
    decal(cover, 0.5, 0.5, 0, 0.027, 0, (ctx, w, h) => {
      ctx.fillStyle = "#4d545b"; ctx.beginPath(); ctx.arc(w / 2, h / 2, w * 0.48, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = "#353c43"; ctx.lineWidth = 6;
      for (let i = 0; i < 6; i++) {
        ctx.beginPath(); ctx.arc(w / 2, h / 2, w * (0.1 + i * 0.07), 0, Math.PI * 2); ctx.stroke();
      }
      ctx.fillStyle = "#2c333a";
      ctx.font = `600 ${Math.round(h * 0.1)}px 'Barlow Condensed', Arial, sans-serif`;
      ctx.textAlign = "center"; ctx.textBaseline = "middle";
      ctx.fillText("CITY WATER", w / 2, h / 2);
    }, { px: 320 }).rotation.x = -Math.PI / 2;
    reg(hits, box(shaft, 1.0, 0.02, 1.0, 0, 0.2, 0, 0x000000, { opacity: 0.001, transparent: true, cast: false }),
      "open-hatch-unattended");

    const ladder = group(shaft, 0, 0, -shaftRadius + 0.07);
    for (const sx of [-1, 1]) cyl(ladder, 0.016, 0.016, 2.1, sx * 0.16, -1.0, 0, 0xa8b0b8, { rough: 0.5, metal: 0.7, seg: 8 });
    for (let i = 0; i < 7; i++) {
      cyl(ladder, 0.012, 0.012, 0.32, 0, -0.12 - i * 0.28, 0, 0xa8b0b8, { rough: 0.5, metal: 0.7, seg: 8 })
        .rotation.z = Math.PI / 2;
    }
    reg(hits, ladder, "ladder");

    // Pipework and the isolation valve at the bottom of the shaft.
    const pipes = group(shaft, 0, -1.75, 0.05);
    pipeRun(pipes, [[-0.45, 0, 0], [0, 0.02, 0], [0.45, 0, 0]], 0.09, 0x2f6f8c,
      { steps: 16, flanges: [[-0.28, 0, 0], [0.28, 0.01, 0]], flangeAxis: "x" });
    const valve = valveWheel(pipes, 0, 0.1, 0, { color: 0xb8402f, body: 0x2f6f4a, r: 0.13 });
    // A permanently invisible marker for exactly where the blank belongs — the
    // drag step measures and snaps against this transform; the plate the
    // player actually sees and carries is spareBlank, below.
    const blank = cyl(pipes, 0.13, 0.13, 0.02, 0.3, 0.01, 0, 0xc0c6cc, { rough: 0.35, metal: 0.85, seg: 18 });
    blank.rotation.z = Math.PI / 2;
    blank.visible = false;
    hits["blank-socket"] = blank;
    const valveLock = lockTag(pipes, 0.02, 0.3, 0.1, { color: 0x1f7ae0 });
    valveLock.visible = false;
    const waterDrip = particles(pipes, 40, 0x6fb4d8, { size: 0.012, life: 0.5, additive: false, opacity: 0.6 });

    // Blank plate staged by the kerb, waiting to be carried to the flange gap.
    // Its own child mesh carries no extra tilt — dragging sets the group's
    // full transform directly, and a baked-in child rotation would survive a
    // snap onto the socket and leave the plate sitting crooked once fitted.
    const spareBlank = group(g, 0.75, 0, 0.55, 0.4);
    cyl(spareBlank, 0.17, 0.17, 0.02, 0, 0.19, 0, 0xc0c6cc, { rough: 0.35, metal: 0.85, seg: 20 });
    decal(spareBlank, 0.2, 0.06, 0, 0.42, 0, signFace("BLANK DN150", { accent: "#4fa3ff", scale: 0.5 }));
    reg(hits, spareBlank, "blank-plate");
    reg(hits, valve, "valve-lock");
    reg(hits, box(pipes, 0.3, 0.16, 0.16, -0.34, 0.02, 0, 0x2f6f8c, { rough: 0.55, metal: 0.4 }), "no-blank");

    // ------------------------------------------------------------- ventilation
    const blower = group(g, 1.15, 0, -0.95, -0.5);
    slab(blower, 0.44, 0.4, 0.4, 0, 0.22, 0, 0x2f6f8c, { radius: 0.04, rough: 0.55, metal: 0.3 });
    const fanGuard = cyl(blower, 0.17, 0.17, 0.04, 0, 0.24, 0.21, 0x22272c, { rough: 0.6, seg: 20 });
    fanGuard.rotation.x = Math.PI / 2;
    const fanBlades = group(blower, 0, 0.24, 0.19);
    for (let i = 0; i < 5; i++) {
      const b = box(fanBlades, 0.13, 0.03, 0.01, 0, 0, 0, 0xa8b0b8, { rough: 0.5, metal: 0.6, cast: false });
      b.rotation.z = (i * Math.PI * 2) / 5;
    }
    const duct = hose(g, [[1.15, 0.4, -0.75], [0.85, 0.5, -0.3], [0.2, 0.4, -0.2], [-0.2, 0.05, -0.15], [-0.25, -1.4, -0.15]],
      0.085, 0xf2c14b, { steps: 26, rough: 0.8 });
    holoTag(blower, "Electric blower", 0, 0.6, 0.2, { css: "#4fa3ff", w: 0.32 });
    reg(hits, blower, "blower");

    // Petrol blower sitting beside it — the trap.
    const petrol = group(g, 1.75, 0, -0.2, 0.3);
    slab(petrol, 0.4, 0.32, 0.34, 0, 0.18, 0, 0xb8402f, { radius: 0.03, rough: 0.6 });
    cyl(petrol, 0.09, 0.09, 0.16, -0.1, 0.42, 0, 0x2b3138, { rough: 0.5, seg: 14 });
    cyl(petrol, 0.02, 0.02, 0.2, 0.16, 0.42, 0, 0x22262b, { rough: 0.6, seg: 8 });      // exhaust
    const fumes = particles(petrol, 40, 0x9aa0a6, { size: 0.05, life: 1.2, additive: false, opacity: 0.25 });
    holoTag(petrol, "Petrol blower", 0, 0.62, 0, { css: "#f0645b", w: 0.3 });
    reg(hits, petrol, "petrol-blower");

    // ------------------------------------------------------------- retrieval
    const tripod = group(g, -0.25, 0, -0.15);
    const legs = [];
    for (let i = 0; i < 3; i++) {
      const a = (i / 3) * Math.PI * 2 + 0.5;
      const leg = cyl(tripod, 0.028, 0.032, 2.3, Math.sin(a) * 0.62, 1.12, Math.cos(a) * 0.62,
        0xd8b23a, { rough: 0.45, metal: 0.6, seg: 10 });
      leg.rotation.set(Math.cos(a) * 0.28, 0, -Math.sin(a) * 0.28);
      legs.push(leg);
    }
    const head = ball(tripod, 0.09, 0, 2.22, 0, 0x2b3138, { rough: 0.5, metal: 0.5 });
    const winch = group(tripod, 0.42, 0.9, 0.3);
    slab(winch, 0.18, 0.2, 0.14, 0, 0, 0, 0xd8b23a, { radius: 0.02, rough: 0.5, metal: 0.4 });
    cyl(winch, 0.02, 0.02, 0.14, 0.12, 0.02, 0, CITY.steel, { rough: 0.3, metal: 0.9, seg: 10 })
      .rotation.z = Math.PI / 2;
    const line = hose(tripod, [[0.42, 1.0, 0.3], [0.2, 1.9, 0.14], [0, 2.15, 0], [0, 1.2, 0]],
      0.008, 0xdfe4e8, { steps: 20, rough: 0.6 });
    tripod.visible = false;
    const tripodCase = group(g, -1.55, 0, 0.6, 0.6);
    slab(tripodCase, 1.4, 0.18, 0.24, 0, 0.1, 0, 0x2b3138, { radius: 0.03, rough: 0.6 });
    decal(tripodCase, 0.5, 0.08, 0, 0.2, 0, signFace("TRIPOD + WINCH", { accent: "#4fa3ff", scale: 0.5 }))
      .rotation.x = -Math.PI / 2;
    holoTag(tripodCase, "Retrieval system", 0, 0.42, 0, { css: "#4fa3ff", w: 0.34 });
    reg(hits, tripodCase, "tripod");

    // ------------------------------------------------------------- the crew
    const attendant = standingFigure(g, 0.95, 0.75, { ry: -2.4, cloth: 0x2f6f8c, vest: 0xf2c14b, helmet: 0xf2f2f2 });
    holoTag(attendant, "Attendant", 0, 1.95, 0.15, { css: "#4fa3ff", w: 0.26 });
    reg(hits, attendant, "attendant");
    const entrant = standingFigure(g, -1.35, -0.65, { ry: 1.2, cloth: 0x36505e, vest: 0xf2c14b, helmet: 0x4fa3ff });
    holoTag(entrant, "Entrant", 0, 1.95, 0.15, { css: "#4fa3ff", w: 0.24 });
    reg(hits, entrant, "rescue-entry");

    // Role badges on the permit board.
    const boardPost = group(g, -1.85, 0, -1.5, 0.85);
    cyl(boardPost, 0.03, 0.04, 1.3, 0, 0.65, 0, CITY.darkSteel, { rough: 0.5, metal: 0.6, seg: 12 });
    box(boardPost, 0.62, 0.46, 0.04, 0, 1.45, 0, 0x1b232b, { rough: 0.6 });
    const permitFace = decal(boardPost, 0.56, 0.4, 0, 1.45, 0.026, (ctx, w, h) => {
      ctx.fillStyle = "#f2efe6"; ctx.fillRect(0, 0, w, h);
      ctx.fillStyle = "#1d4f7a"; ctx.fillRect(0, 0, w, h * 0.17);
      ctx.fillStyle = "#ffffff";
      ctx.font = `600 ${Math.round(h * 0.11)}px 'Barlow Condensed', Arial, sans-serif`;
      ctx.textAlign = "left"; ctx.textBaseline = "middle";
      ctx.fillText("CONFINED SPACE ENTRY PERMIT", w * 0.05, h * 0.085);
      ctx.fillStyle = "#1d262e";
      ctx.font = `${Math.round(h * 0.07)}px Arial, sans-serif`;
      ["Space: valve vault VV-212", "Hazards: O₂ deficiency, H₂S, engulfment",
       "Isolation: DN150 closed + blanked", "Ventilation: electric, continuous",
       "Rescue: tripod retrieval, non-entry", "Attendant: never enters"].forEach((line, i) => {
        ctx.fillText(line, w * 0.06, h * (0.28 + i * 0.11));
      });
    }, { px: 512 });
    reg(hits, boardPost, "permit-board");

    const badges = group(boardPost, 0, 1.05, 0.03);
    const badgeSpecs = [
      { id: "badge-supervisor", label: "SUPERVISOR", x: -0.19, c: "#f2c14b" },
      { id: "badge-attendant", label: "ATTENDANT", x: 0, c: "#4fa3ff" },
      { id: "badge-entrant", label: "ENTRANT", x: 0.19, c: "#59c97b" },
    ];
    const badgeFaces = {};
    for (const b of badgeSpecs) {
      const holder = group(badges, b.x, 0, 0);
      box(holder, 0.16, 0.1, 0.012, 0, 0, 0, 0x11181f, { rough: 0.6 });
      badgeFaces[b.id] = decal(holder, 0.15, 0.085, 0, 0, 0.008,
        signFace(b.label + "\nUNASSIGNED", { bg: "#11181f", accent: b.c, scale: 0.3 }), { px: 256 });
      reg(hits, holder, b.id);
    }

    // -------------------------------------------------------------- gas meter
    const chest = toolChest(g, 1.7, 1.15, { ry: -0.9, color: 0x2f6f8c });
    const meter = instrument(chest, -0.08, 0.79, 0, { ry: 0.3, idle: "-- %", color: 0x4fa3ff, w: 0.12, d: 0.19 });
    holoTag(meter, "4-gas meter", 0, 0.16, 0, { css: "#4fa3ff", w: 0.26 });
    reg(hits, meter, "gas-meter");
    // Sample points at three depths — the reason the test is a sequence.
    const depths = [
      { id: "test-oxygen", y: -0.3, label: "TOP" },
      { id: "test-flammable", y: -1.1, label: "MID" },
      { id: "test-toxic", y: -1.85, label: "BOTTOM" },
    ];
    for (const d of depths) {
      const pt = group(shaft, 0.3, d.y, 0.18);
      ball(pt, 0.035, 0, 0, 0, 0x4fa3ff, { emissive: 0x4fa3ff, ei: 1.6, rough: 0.4 });
      torus(pt, 0.07, 0.006, 0, 0, 0, 0x4fa3ff, { emissive: 0x4fa3ff, ei: 1.2, rough: 0.4, cast: false })
        .rotation.x = Math.PI / 2;
      reg(hits, pt, d.id);
    }

    const harness = group(chest, 0.16, 0.8, 0.06, 0.5);
    for (const sx of [-1, 1]) {
      const strap = box(harness, 0.035, 0.02, 0.2, sx * 0.05, 0, 0, 0xf2c14b, { rough: 0.85 });
      strap.rotation.x = 0.2;
    }
    box(harness, 0.14, 0.02, 0.04, 0, 0.012, 0.02, 0xf2c14b, { rough: 0.85 });
    torus(harness, 0.02, 0.005, 0, 0.03, -0.06, CITY.steel, { rough: 0.3, metal: 0.9 });
    holoTag(harness, "Full-body harness", 0, 0.18, 0, { css: "#4fa3ff", w: 0.34 });
    reg(hits, harness, "harness");

    // Guarding kit.
    reg(hits, cone(g, -1.5, 1.35, { color: 0x4fa3ff }), "cone-a");
    reg(hits, cone(g, 1.05, 1.75, { color: 0x4fa3ff }), "cone-b");
    const rail = group(g, -0.25, 0, 0.75);
    rail.visible = true;
    const railPanels = [];
    for (const [rx, rz, ry] of [[0, 0.85, 0], [-0.85, 0, Math.PI / 2], [0.85, 0, Math.PI / 2]]) {
      const panel = barrierPanel(rail, rx, rz - 0.9, { ry, w: 1.5, color: 0x4fa3ff });
      panel.visible = false;
      railPanels.push(panel);
    }
    const railKit = group(g, 0.4, 0, 1.45, 0.2);
    slab(railKit, 1.5, 0.16, 0.2, 0, 0.09, 0, 0x4fa3ff, { radius: 0.02, rough: 0.6 });
    holoTag(railKit, "Hatch guard", 0, 0.34, 0, { css: "#4fa3ff", w: 0.28 });
    reg(hits, railKit, "hatch-guard");

    let ventilating = false;
    let engineRunning = true;
    let commsActive = false;

    return {
      hits,
      footprint: 2.0,

      onStepComplete(step, session) {
        if (step.id === "guard") { railPanels.forEach((p) => { p.visible = true; }); railKit.visible = false; }
        if (step.id === "roles") {
          for (const b of badgeSpecs) {
            repaint(badgeFaces[b.id], signFace(b.label + "\nASSIGNED", {
              bg: "#0f1b14", accent: "#59c97b", fg: "#bff7d4", scale: 0.3,
            }));
          }
        }
        // spareBlank's own position/rotation are already set by the drag-and-
        // drop gesture (app.js snaps it onto the socket's exact transform on
        // a successful drop) — nothing to do here.
        if (step.id === "lock") valveLock.visible = true;
        if (step.id === "ventilate") { ventilating = true; }
        if (step.id === "retrieval") { tripod.visible = true; tripodCase.visible = false; }
        if (step.id === "comms") commsActive = true;
        if (step.id === "exit") {
          repaint(permitFace, (ctx, w, h) => {
            ctx.fillStyle = "#f2efe6"; ctx.fillRect(0, 0, w, h);
            ctx.fillStyle = "#1d6b34"; ctx.fillRect(0, 0, w, h * 0.17);
            ctx.fillStyle = "#ffffff";
            ctx.font = `600 ${Math.round(h * 0.11)}px 'Barlow Condensed', Arial, sans-serif`;
            ctx.textAlign = "left"; ctx.textBaseline = "middle";
            ctx.fillText("PERMIT CLOSED — HEADCOUNT COMPLETE", w * 0.05, h * 0.085);
            ctx.fillStyle = "#1d262e";
            ctx.font = `${Math.round(h * 0.09)}px Arial, sans-serif`;
            ctx.fillText("Space secured. Isolation released.", w * 0.06, h * 0.4);
            ctx.fillText("Entrant out, attendant stood down.", w * 0.06, h * 0.55);
          });
        }
      },

      animate(t, dt, session) {
        if (ventilating) fanBlades.rotation.z += dt * 12;
        waterDrip.visible = true;
        waterDrip.userData.step(dt, new THREE.Vector3(0.28, 0.06, 0), 0.05, 0.06, -1.6);
        if (engineRunning) {
          fumes.visible = true;
          fumes.userData.step(dt, new THREE.Vector3(0.16, 0.45, 0), 0.05, 0.25, 0.35);
        }
        attendant.userData.head.rotation.y = Math.sin(t * 0.6) * 0.35 - 0.2;
        entrant.userData.head.rotation.y = Math.sin(t * 0.5 + 1) * 0.2;
        if (commsActive || session?.step?.id === "comms") {
          attendant.userData.head.rotation.x = Math.sin(t * 3) * 0.06;
        }

        const gg = session?.gauge;
        if (gg && !gg.committed && session.step?.id === "oxygen-level") {
          const o2 = (15 + gg.t * 12).toFixed(1);
          repaint(meter.userData.screen, signFace(`${o2}%`, {
            bg: "#0d1c24", accent: gg.t > 0.46 && gg.t < 0.6 ? "#59c97b" : "#f0645b", fg: "#bfeaf7", scale: 0.6,
          }));
        }
      },
    };
  },
};


/* ===== smartcity/js/sims/solar-deck.js ===== */

  lateNotes: {

    "bess-panel": "The battery comes last — the array side is isolated first so you are not working two live sources at once.",
  },

  steps: [
    {
      id: "survey", kind: "select", target: "roof-plan",
      title: "Survey the roof and anchor plan",
      cue: "Read the plan: anchor points, edge distances, array layout.",
      why: "You establish where the anchors are and where the unprotected edges start before you step onto the deck, not while you are on it.",
    },
    {

    },
    {

      title: "Don and check the harness",
      cue: "Fit the harness and check the D-ring and lanyard condition.",

    {
      id: "ac-isolate", kind: "turn", target: "ac-disconnect",
      title: "Open the AC disconnect",
      cue: "Grab the AC disconnect handle and pull it open.",
      why: "Now the inverter has neither a source nor a grid connection. Both sides are what makes it isolated rather than just quiet.",
      turn: { turns: 0.25, axis: "z", reverse: true, label: "AC DISCONNECT" },
    },
    {
      id: "lock", kind: "select", target: "lock-point",
      title: "Lock both disconnects",
      cue: "Lock and tag the DC and AC disconnects.",
      why: "Two isolations, two locks. An inverter that gets reset remotely during a string test is a very expensive lesson.",
    },
    {
      id: "voc", kind: "gauge", target: "string-meter",
      title: "Measure string open-circuit voltage",
      cue: "Read Voc on string 3 and commit inside the expected band.",
      why: "Voc against the expected value for this string length and temperature is how you find a missing module, a reversed pair or a shaded run before you energise.",
      gauge: {
        label: "STRING 3 — OPEN CIRCUIT VOLTAGE", speed: 0.68, green: [0.5, 0.64],
        readout: (t) => `${Math.round(t * 1200)} V DC`,
        missNote: "Off the expected Voc for this string. That is a module count or a connection problem — find it before commissioning.",
      },
    },
    {
      id: "checks", kind: "sequence",
      targets: ["check-polarity", "check-insulation", "check-continuity"],
      itemNames: {
        "check-polarity": "polarity", "check-insulation": "insulation resistance", "check-continuity": "earth continuity",
      },
      title: "Complete the string tests in order",
      cue: "Polarity, then insulation resistance, then earth continuity.",
      why: "Polarity first, because an insulation test on a reversed string tells you nothing useful and can damage the tester. Continuity last confirms the protective path you have been relying on.",
      outOfOrderNote: "Wrong order — polarity is confirmed before any test that injects voltage into the string.",
    },
    {
      id: "bess", kind: "gauge", target: "bess-panel",
      title: "Check the battery state",
      cue: "Read pack state of charge and commit inside the commissioning window.",
      why: "A battery commissioned at the extremes of its charge window cannot be balanced properly, and the first cycle is when cell imbalance shows itself.",
      gauge: {
        label: "PACK STATE OF CHARGE", speed: 0.6, green: [0.4, 0.58],
        readout: (t) => `${Math.round(t * 100)} % SOC`,
        missNote: "Outside the commissioning window — bring the pack into range before the first cycle.",
      },
    },
    {
      id: "energise", kind: "select", target: "commission-panel",
      title: "Energise and record",
      cue: "Remove the locks, energise in reverse order and log the commissioning data.",
      why: "Energise AC then DC, watch the inverter come up, and record the readings. The commissioning record is what the next technician inherits.",
    },
  ],

  build(root) {
    const hits = {};
    const g = group(root);
    stationPad(g, 2.05, 0xffb648);

    // ------------------------------------------------------------- roof deck
    box(g, 4.6, 0.16, 4.6, 0, 0.08, 0, 0x4a4f55, { rough: 0.96 });
    for (let i = -3; i <= 3; i++) {
      box(g, 4.6, 0.005, 0.03, 0, 0.165, i * 0.7, 0x3c4147, { cast: false, receive: false });
    }
    // Parapet on two sides, open edge on the third — that open edge is the hazard.
    for (const [px, pz, pw, pd, pry] of [[0, -2.3, 4.6, 0.16, 0], [-2.3, 0, 0.16, 4.6, 0]]) {
      box(g, pw, 0.5, pd, px, 0.4, pz, 0x5d646b, { rough: 0.9 });
      box(g, pw + 0.04, 0.05, pd + 0.04, px, 0.67, pz, 0x6d747b, { rough: 0.8 });
    }
    const edge = box(g, 4.6, 0.02, 0.5, 0, 0.17, 2.15, 0x2b3138, { rough: 0.95, cast: false });
    for (let i = 0; i < 9; i++) {
      box(g, 0.28, 0.006, 0.1, -2.1 + i * 0.52, 0.18, 2.15, 0xf0645b, { rough: 0.8, cast: false });
    }
    holoTag(g, "Unprotected edge", 0, 0.55, 2.15, { css: "#f0645b", w: 0.36 });
    reg(hits, edge, "roof-edge");

    // ------------------------------------------------------------ PV array
    const array = group(g, -0.35, 0, -1.15, 0.12);
    const modules = [];
    for (let row = 0; row < 2; row++) {
      for (let col = 0; col < 3; col++) {
        const m = group(array, -0.98 + col * 0.98, 0, -0.45 + row * 0.92);
        // Tilted frame on ballasted feet.
        for (const sx of [-1, 1]) {
          cyl(m, 0.02, 0.024, 0.36, sx * 0.42, 0.18, -0.3, 0xa8b0b8, { rough: 0.4, metal: 0.7, seg: 8 });
          cyl(m, 0.02, 0.024, 0.12, sx * 0.42, 0.06, 0.3, 0xa8b0b8, { rough: 0.4, metal: 0.7, seg: 8 });
          box(m, 0.2, 0.07, 0.18, sx * 0.42, 0.035, 0, 0x53585e, { rough: 0.95 });
        }
        const panel = group(m, 0, 0.3, 0);
        panel.rotation.x = 0.34;
        box(panel, 0.92, 0.03, 0.6, 0, 0, 0, 0x9aa3ab, { rough: 0.4, metal: 0.6 });
        const glass = box(panel, 0.88, 0.012, 0.56, 0, 0.021, 0, 0x152a48,
          { rough: 0.1, metal: 0.25, opacity: 0.95 });
        for (let c = 0; c < 6; c++) {
          box(panel, 0.008, 0.004, 0.54, -0.37 + c * 0.148, 0.028, 0, 0x2c4a72, { rough: 0.3, cast: false });
        }
        modules.push({ panel, glass });
      }
    }
    holoTag(array, "String 3 · 18 modules", 0, 0.95, -0.5, { css: "#ffb648", w: 0.42 });

    // MC4 connectors under the array — pulling one live is the trap.
    const mc4 = group(array, 0.55, 0.16, 0.42);
    for (const sx of [-1, 1]) {
      cyl(mc4, 0.014, 0.014, 0.09, sx * 0.03, 0, 0, sx < 0 ? 0x1b1e22 : 0xb8402f, { rough: 0.5, seg: 10 })
        .rotation.z = Math.PI / 2;
    }
    hose(mc4, [[-0.08, 0, 0], [-0.3, -0.04, 0.14], [-0.5, -0.1, 0.02]], 0.008, 0x1b1e22, { steps: 12 });
    holoTag(mc4, "String connector", 0, 0.2, 0, { css: "#f0645b", w: 0.32 });
    reg(hits, mc4, "hot-mc4");

    // ----------------------------------------------------- inverter + combiner
    const wall = group(g, -2.05, 0, -0.4, Math.PI / 2);
    const inverter = group(wall, 0, 0, 0);
    slab(inverter, 0.66, 0.9, 0.28, 0, 0.95, 0, 0x2f3a44, { radius: 0.04, rough: 0.45, metal: 0.4 });
    for (let i = 0; i < 7; i++) box(inverter, 0.6, 0.02, 0.02, 0, 0.62 + i * 0.09, 0.15, 0x22272c, { rough: 0.7 });
    const invScreen = decal(inverter, 0.3, 0.16, 0, 1.28, 0.15,
      signFace("OFFLINE", { bg: "#2a1a0d", accent: "#ffb648", fg: "#ffe3ac", scale: 0.42 }),
      { glow: true, ei: 0.85, px: 320 });
    holoTag(inverter, "Inverter", 0, 1.52, 0.1, { css: "#ffb648", w: 0.24 });

    const dcBox = group(wall, -0.62, 0, 0);
    slab(dcBox, 0.34, 0.36, 0.2, 0, 1.05, 0, 0x53585e, { radius: 0.02, rough: 0.5, metal: 0.5 });
    const dcHandle = box(dcBox, 0.05, 0.13, 0.04, 0, 1.05, 0.11, 0xf0645b, { rough: 0.5 });
    decal(dcBox, 0.26, 0.06, 0, 1.27, 0.101, signFace("DC DISCONNECT", { accent: "#ffb648", scale: 0.5 }));
    reg(hits, dcBox, "dc-disconnect");
    dcBox.userData.wheel = dcHandle; // the part app.js actually spins for the 'turn' step

    const acBox = group(wall, 0.62, 0, 0);
    slab(acBox, 0.3, 0.32, 0.18, 0, 1.05, 0, 0x53585e, { radius: 0.02, rough: 0.5, metal: 0.5 });
    const acHandle = box(acBox, 0.05, 0.12, 0.04, 0, 1.05, 0.1, 0xf2c14b, { rough: 0.5 });
    decal(acBox, 0.24, 0.06, 0, 1.25, 0.091, signFace("AC DISCONNECT", { accent: "#ffb648", scale: 0.5 }));
    reg(hits, acBox, "ac-disconnect");
    acBox.userData.wheel = acHandle;

    const lockPoint = group(wall, 0, 0.62, 0.16);
    box(lockPoint, 0.2, 0.1, 0.03, 0, 0, 0, 0xd8232a, { rough: 0.6 });
    decal(lockPoint, 0.18, 0.05, 0, 0.03, 0.018, signFace("LOTO", { bg: "#7d1512", accent: "#f2ae14", scale: 0.6 }));
    const dcLock = lockTag(dcBox, 0, 0.9, 0.11, { color: 0xd8232a });
    const acLock = lockTag(acBox, 0, 0.9, 0.1, { color: 0x1f7ae0 });
    dcLock.visible = false; acLock.visible = false;
    reg(hits, lockPoint, "lock-point");

    // Rapid shutdown initiator by the roof access.
    const rsd = group(g, 1.85, 0, 1.35, -0.7);
    cyl(rsd, 0.035, 0.045, 1.0, 0, 0.5, 0, CITY.darkSteel, { rough: 0.5, metal: 0.6, seg: 12 });
    box(rsd, 0.24, 0.24, 0.12, 0, 1.12, 0, 0xf0d24a, { rough: 0.6 });
    const rsdButton = cyl(rsd, 0.06, 0.06, 0.05, 0, 1.12, 0.08, 0xd8232a, { rough: 0.5, seg: 18 });
    rsdButton.rotation.x = Math.PI / 2;
    decal(rsd, 0.22, 0.06, 0, 1.28, 0.062, signFace("RAPID SHUTDOWN", { bg: "#7d1512", accent: "#f2ae14", scale: 0.46 }));
    holoTag(rsd, "Initiator", 0, 1.45, 0.05, { css: "#ffb648", w: 0.24 });
    reg(hits, rsd, "rapid-shutdown");

    // ---------------------------------------------------------- battery bank
    const bess = group(g, 1.55, 0, -1.35, -0.35);
    slab(bess, 0.9, 1.25, 0.42, 0, 0.63, 0, 0x36414b, { radius: 0.04, rough: 0.5, metal: 0.35 });
    box(bess, 0.94, 0.05, 0.46, 0, 1.28, 0, 0x2a333c, { rough: 0.55, metal: 0.4 });
    for (let i = 0; i < 4; i++) {
      box(bess, 0.8, 0.02, 0.02, 0, 0.28 + i * 0.24, 0.215, 0x22272c, { rough: 0.7 });
    }
    const bessScreen = decal(bess, 0.4, 0.2, 0, 1.06, 0.215,
      signFace("PACK\nSTANDBY", { bg: "#0d1c24", accent: "#4fd1ff", fg: "#bfeaf7", scale: 0.3 }),
      { glow: true, ei: 0.85, px: 384 });
    const bessLamps = [];
    for (let i = 0; i < 6; i++) {
      bessLamps.push(ball(bess, 0.012, -0.3 + i * 0.12, 0.72, 0.215, CITY.good,
        { emissive: CITY.good, ei: 1.4 }));
    }
    holoTag(bess, "BESS 30 kWh", 0, 1.5, 0.1, { css: "#ffb648", w: 0.3 });
    reg(hits, bessScreen, "bess-panel");

    const terminals = group(bess, 0.3, 0.4, 0.22);
    for (const sx of [-1, 1]) {
      cyl(terminals, 0.022, 0.022, 0.03, sx * 0.05, 0, 0, sx < 0 ? 0xb8402f : 0x1b1e22,
        { rough: 0.4, metal: 0.8, seg: 12 }).rotation.x = Math.PI / 2;
    }
    box(terminals, 0.16, 0.05, 0.01, 0, 0.05, 0, 0xf2c14b, { rough: 0.6 });
    reg(hits, terminals, "battery-terminal");

    // Crushed conduit run — the trap you find by looking.
    const conduit = group(g, -1.2, 0, 1.5, 0.25);
    hose(conduit, [[-0.8, 0.22, 0], [-0.2, 0.24, 0.1], [0.5, 0.22, -0.05]], 0.035, 0x8d959d,
      { steps: 16, rough: 0.5, metal: 0.5 });
    box(conduit, 0.14, 0.05, 0.09, -0.05, 0.22, 0.06, 0x6d757d, { rough: 0.7, metal: 0.4 });
    holoTag(conduit, "Crushed run", 0, 0.48, 0, { css: "#f0645b", w: 0.26 });
    reg(hits, conduit, "damaged-conduit");

    // -------------------------------------------------------- anchor + harness
    const anchor = group(g, -1.45, 0, -1.9);
    cyl(anchor, 0.11, 0.14, 0.1, 0, 0.21, 0, 0xd8b23a, { rough: 0.5, metal: 0.5, seg: 16 });
    torus(anchor, 0.06, 0.012, 0, 0.31, 0, 0xd8b23a, { rough: 0.4, metal: 0.7 });
    decal(anchor, 0.2, 0.05, 0, 0.44, 0, signFace("ANCHOR · 22 kN", { accent: "#ffb648", scale: 0.5 }));
    holoTag(anchor, "Certified anchor", 0, 0.62, 0, { css: "#ffb648", w: 0.34 });
    reg(hits, anchor, "anchor-point");
    const lifeline = hose(g, [[-1.45, 0.31, -1.9], [-0.9, 0.6, -1.2], [-0.3, 0.9, -0.4]], 0.01, 0xf2c14b,
      { steps: 18, rough: 0.8 });
    lifeline.visible = false;

    const chest = toolChest(g, 0.85, 1.5, { ry: -0.4, color: 0xffb648 });
    const harness = group(chest, -0.1, 0.79, 0, 0.4);
    for (const sx of [-1, 1]) {
      const strap = box(harness, 0.03, 0.02, 0.22, sx * 0.06, 0, 0, 0xf2c14b, { rough: 0.85 });
      strap.rotation.x = 0.22;
    }
    box(harness, 0.16, 0.02, 0.04, 0, 0.014, 0.03, 0xf2c14b, { rough: 0.85 });
    torus(harness, 0.022, 0.005, 0, 0.035, -0.07, CITY.steel, { rough: 0.3, metal: 0.9 });
    holoTag(harness, "Harness + lanyard", 0, 0.2, 0, { css: "#ffb648", w: 0.36 });
    reg(hits, harness, "harness");

    const meter = instrument(chest, 0.14, 0.79, 0.04, { ry: -0.3, idle: "0 V", color: 0xffb648 });
    holoTag(meter, "String tester", 0, 0.16, 0, { css: "#ffb648", w: 0.28 });
    reg(hits, meter, "string-meter");

    // String test checkpoints as holo markers on the combiner.
    const checks = [
      { id: "check-polarity", label: "POLARITY", x: -0.22 },
      { id: "check-insulation", label: "INSULATION", x: 0 },
      { id: "check-continuity", label: "CONTINUITY", x: 0.22 },
    ];
    const checkFaces = {};
    for (const c of checks) {
      const holder = group(wall, c.x, 1.62, 0.06);
      box(holder, 0.19, 0.1, 0.012, 0, 0, 0, 0x11181f, { rough: 0.6 });
      checkFaces[c.id] = decal(holder, 0.18, 0.085, 0, 0, 0.008,
        signFace(c.label + "\nPENDING", { bg: "#11181f", accent: "#ffb648", scale: 0.28 }), { px: 256 });
      reg(hits, holder, c.id);
    }

    // Holographic paperwork.
    const plan = holoPanel(g, 0.58, 0.4, 1.9, 1.5, 0.15, (ctx, w, h) => {
      ctx.fillStyle = "rgba(6,16,22,0.9)"; ctx.fillRect(0, 0, w, h);
      ctx.fillStyle = "#ffb648"; ctx.fillRect(0, 0, w, 5);
      ctx.fillStyle = "#8fb3c4";
      ctx.font = `600 ${Math.round(h * 0.09)}px 'Barlow Condensed', Arial, sans-serif`;
      ctx.textAlign = "left"; ctx.textBaseline = "middle";
      ctx.fillText("ROOF PLAN · BLOCK C", w * 0.06, h * 0.14);
      ctx.fillStyle = "#eaf6fb";
      ctx.font = `600 ${Math.round(h * 0.15)}px 'Barlow Condensed', Arial, sans-serif`;
      ctx.fillText("ARRAY 3 COMMISSIONING", w * 0.06, h * 0.33);
      ctx.font = `${Math.round(h * 0.085)}px Arial, sans-serif`;
      ctx.fillStyle = "#a9c6d6";
      ["Anchor: 22 kN, south-west", "Unprotected edge: north side",
       "String 3: 18 modules, Voc 620 V ±5%", "Insulation: >1 MΩ at 1000 V",
       "BESS commissioning SOC: 40–58%"].forEach((line, i) => ctx.fillText(line, w * 0.06, h * (0.5 + i * 0.11)));
    }, { ry: -0.75, accent: 0xffb648 });
    reg(hits, plan, "roof-plan");

    const commission = holoPanel(g, 0.44, 0.28, -1.05, 1.45, 1.85, (ctx, w, h) => {
      ctx.fillStyle = "rgba(6,16,22,0.9)"; ctx.fillRect(0, 0, w, h);
      ctx.fillStyle = "#ffb648"; ctx.fillRect(0, 0, w, 5);
      ctx.fillStyle = "#eaf6fb";
      ctx.font = `600 ${Math.round(h * 0.2)}px 'Barlow Condensed', Arial, sans-serif`;
      ctx.textAlign = "center"; ctx.textBaseline = "middle";
      ctx.fillText("COMMISSIONING LOG", w / 2, h * 0.32);
      ctx.font = `${Math.round(h * 0.12)}px Arial, sans-serif`;
      ctx.fillStyle = "#a9c6d6";
      ctx.fillText("Energise AC then DC · record", w / 2, h * 0.62);
      ctx.fillText("Voc, IR, continuity, SOC", w / 2, h * 0.8);
    }, { ry: 0.3, accent: 0xffb648 });
    reg(hits, commission, "commission-panel");

    let live = true;
    let anchored = false;
    let arcTimer = 0;
    const arc = particles(mc4, 50, 0xbfe4ff, { size: 0.016, life: 0.28 });

    return {
      hits,
      footprint: 2.05,

      onStepComplete(step) {
        if (step.id === "anchor") { anchored = true; lifeline.visible = true; }
        if (step.id === "shutdown") {
          live = false;
          rsdButton.position.z = 0.055;
          modules.forEach(({ glass }) => { glass.material = mat(0x1b3050, { rough: 0.15, metal: 0.2 }); });
          repaint(invScreen, signFace("RAPID\nSHUTDOWN", { bg: "#2a1a0d", accent: "#f0645b", fg: "#ffd2ce", scale: 0.3 }));
        }
        // Both handles are turned live by the player's drag — app.js drives
        // their rotation from session.turn while each step is active.
        if (step.id === "lock") { dcLock.visible = true; acLock.visible = true; }
        if (step.id === "checks") {
          for (const c of checks) {
            repaint(checkFaces[c.id], signFace(c.label + "\nPASS", {
              bg: "#0f1b14", accent: "#59c97b", fg: "#bff7d4", scale: 0.28,
            }));
          }
        }
        if (step.id === "energise") {
          dcLock.visible = false; acLock.visible = false;
          dcHandle.rotation.z = 0; acHandle.rotation.z = 0;
          repaint(invScreen, signFace("ONLINE\n11.4 kW", { bg: "#0d1c14", accent: "#59c97b", fg: "#bff7d4", scale: 0.3 }));
          repaint(bessScreen, signFace("PACK\nBALANCING", { bg: "#0d1c14", accent: "#59c97b", fg: "#bff7d4", scale: 0.3 }));
        }
      },

      onHazard(hitId) { if (hitId === "hot-mc4" && live) arcTimer = 0.45; },

      animate(t, dt, session) {
        bessLamps.forEach((l, i) => { l.material.emissiveIntensity = 1.0 + Math.sin(t * 2 + i * 0.6) * 0.6; });
        if (live) modules.forEach(({ glass }, i) => {
          glass.material.emissiveIntensity = 0.2 + Math.sin(t * 0.7 + i) * 0.08;
        });
        if (arcTimer > 0) {
          arcTimer -= dt;
          arc.visible = true;
          arc.userData.step(dt, new THREE.Vector3(0, 0, 0), 0.06, 1.6, -3.2);
        } else if (arc.visible) arc.visible = false;

        const gg = session?.gauge;
        if (gg && !gg.committed) {
          if (session.step?.id === "voc") {
            const v = Math.round(gg.t * 1200);
            repaint(meter.userData.screen, signFace(`${v} V`, {
              bg: "#0d1c24", accent: gg.t > 0.5 && gg.t < 0.64 ? "#59c97b" : "#ffb648", fg: "#bfeaf7", scale: 0.6,
            }));
          }
          if (session.step?.id === "bess") {
            repaint(bessScreen, signFace(`SOC\n${Math.round(gg.t * 100)}%`, {
              bg: "#0d1c24", accent: gg.t > 0.4 && gg.t < 0.58 ? "#59c97b" : "#ffb648", fg: "#bfeaf7", scale: 0.3,
            }));
          }
        }
      },
    };
  },
};

    slab(cleanKit, 0.14, 0.05, 0.1, 0, 0.025, 0, 0xdfe4e8, { radius: 0.01, rough: 0.6 });

    holoTag(cleanKit, "Lint-free wipes", 0, 0.16, 0, { css: "#a079ff", w: 0.32 });
    reg(hits, cleanKit, "cleaning-kit");

    const alcohol = group(bench, 0.46, 0.95, 0.16);
    cyl(alcohol, 0.03, 0.032, 0.13, 0, 0.065, 0, 0xdfe4e8, { rough: 0.25, opacity: 0.8, seg: 14 });
    cyl(alcohol, 0.028, 0.028, 0.08, 0, 0.05, 0, 0xbfe4f2, { rough: 0.15, opacity: 0.7, seg: 14 });
    cyl(alcohol, 0.014, 0.014, 0.03, 0, 0.145, 0, 0xb8402f, { rough: 0.5, seg: 10 });
    decal(alcohol, 0.05, 0.03, 0, 0.07, 0.033, signFace("IPA", { bg: "#dfe4e8", fg: "#1b1e22", accent: "#f0645b", scale: 0.7 }), { px: 96 });
    holoTag(alcohol, "Isopropyl", 0, 0.22, 0, { css: "#f0645b", w: 0.22 });
    reg(hits, alcohol, "alcohol-heat");

    const scraps = group(bench, -0.5, 0.95, 0.2);
    for (let i = 0; i < 7; i++) {
      const s = cyl(scraps, 0.0012, 0.0012, 0.02 + Math.random() * 0.02,
        (Math.random() - 0.5) * 0.08, 0.002, (Math.random() - 0.5) * 0.06, 0xdfe4e8,
        { rough: 0.2, metal: 0.1, seg: 6 });
      s.rotation.set(Math.PI / 2, Math.random() * 3, Math.random() * 3);
    }
    holoTag(scraps, "Fibre offcuts", 0, 0.14, 0, { css: "#f0645b", w: 0.28 });
    reg(hits, scraps, "fibre-scraps");

    // The exposed strand end on the bench rest — never look into it.
    const strandEnd = group(bench, -0.02, 0.96, -0.2);
    hose(strandEnd, [[-0.3, 0, 0.02], [-0.1, 0.005, 0], [0.1, 0, 0]], 0.0018, 0xf7f9fb, { steps: 12, rough: 0.3 });
    ball(strandEnd, 0.004, 0.1, 0, 0, 0xa079ff, { emissive: 0xa079ff, ei: 2.6 });
    reg(hits, strandEnd, "bare-fibre-end");
    const sleeve = cyl(strandEnd, 0.005, 0.005, 0.05, 0, 0.001, 0, 0x1b1e22, { rough: 0.6, seg: 10 });
    sleeve.rotation.z = Math.PI / 2;
    sleeve.visible = false;

    // ---------------------------------------------------------------- kit case
    const chest = toolChest(g, 1.55, 1.1, { ry: -0.8, color: 0x5b4a9a });
    const meter = instrument(chest, -0.1, 0.79, 0, { ry: 0.35, idle: "-- dBm", color: 0xa079ff, w: 0.11, d: 0.18 });
    holoTag(meter, "Power meter", 0, 0.16, 0, { css: "#a079ff", w: 0.28 });
    reg(hits, meter, "power-meter");

    const otdr = instrument(chest, 0.14, 0.79, 0.02, { ry: -0.35, idle: "TRACE", color: 0x2b3138, w: 0.16, d: 0.22 });
    holoTag(otdr, "OTDR", 0, 0.18, 0, { css: "#a079ff", w: 0.2 });
    reg(hits, otdr, "otdr");

    const glasses = group(chest, 0.0, 0.8, -0.14, 0.2);
    box(glasses, 0.14, 0.012, 0.035, 0, 0, 0, 0x22262b, { rough: 0.5 });
    const lens = box(glasses, 0.12, 0.03, 0.01, 0, 0.006, -0.012, 0xd8a53a,
      { rough: 0.15, opacity: 0.55, emissive: 0x7a5a12, ei: 0.4 });
    for (const sx of [-1, 1]) box(glasses, 0.012, 0.008, 0.08, sx * 0.066, 0, 0.04, 0x22262b, { rough: 0.5 });
    holoTag(glasses, "Laser eyewear", 0, 0.14, 0, { css: "#a079ff", w: 0.3 });
    reg(hits, glasses, "laser-glasses");

    // Sharps tube for the offcuts, sitting where it should be used.
    const sharps = group(bench, -0.5, 0.95, -0.14);
    cyl(sharps, 0.025, 0.028, 0.12, 0, 0.06, 0, 0xd8342a, { rough: 0.55, seg: 14 });
    cyl(sharps, 0.026, 0.026, 0.015, 0, 0.125, 0, 0xf2e9c9, { rough: 0.5, seg: 14 });

    // ------------------------------------------------------------ holo tickets
    const ticket = holoPanel(g, 0.56, 0.4, 1.75, 1.45, -1.15, (ctx, w, h) => {
      ctx.fillStyle = "rgba(10,8,22,0.9)"; ctx.fillRect(0, 0, w, h);
      ctx.fillStyle = "#a079ff"; ctx.fillRect(0, 0, w, 5);
      ctx.fillStyle = "#a99ecb";
      ctx.font = `600 ${Math.round(h * 0.09)}px 'Barlow Condensed', Arial, sans-serif`;
      ctx.textAlign = "left"; ctx.textBaseline = "middle";
      ctx.fillText("WORK TICKET FT-2290", w * 0.06, h * 0.14);
      ctx.fillStyle = "#f0ecff";
      ctx.font = `600 ${Math.round(h * 0.14)}px 'Barlow Condensed', Arial, sans-serif`;
      ctx.fillText("SPLICE STRAND 14 · TRAY 3", w * 0.06, h * 0.33);
      ctx.font = `${Math.round(h * 0.085)}px Arial, sans-serif`;
      ctx.fillStyle = "#bdb2dd";
      ["Circuit: metro ring west", "Port: OLT shelf 1 · P3",
       "Window approved: 01:00 – 04:00", "Cleave tolerance: ≤ 0.5°",
       "Splice budget: ≤ 0.08 dB"].forEach((line, i) => ctx.fillText(line, w * 0.06, h * (0.5 + i * 0.11)));
    }, { ry: -0.7, accent: 0xa079ff });
    reg(hits, ticket, "work-ticket");

    const labelTag = holoPanel(g, 0.4, 0.24, -1.85, 1.35, 0.5, (ctx, w, h) => {
      ctx.fillStyle = "rgba(10,8,22,0.9)"; ctx.fillRect(0, 0, w, h);
      ctx.fillStyle = "#a079ff"; ctx.fillRect(0, 0, w, 5);
      ctx.fillStyle = "#f0ecff";
      ctx.font = `600 ${Math.round(h * 0.22)}px 'Barlow Condensed', Arial, sans-serif`;
      ctx.textAlign = "center"; ctx.textBaseline = "middle";
      ctx.fillText("LABEL + RECORD", w / 2, h * 0.36);
      ctx.font = `${Math.round(h * 0.13)}px Arial, sans-serif`;
      ctx.fillStyle = "#bdb2dd";
      ctx.fillText("Strand ID · loss · date · tech", w / 2, h * 0.68);
    }, { ry: 0.85, accent: 0xa079ff });
    reg(hits, labelTag, "label-tag");

    let portLive = true;
    let arcTimer = 0;
    let ovenRunning = false;

    return {
      hits,
      footprint: 1.9,

      onStepComplete(step) {
        if (step.id === "shutdown") {
          portLive = false;
          ports[2].material = mat(0x3a3350, { emissive: 0x3a3350, ei: 0.6 });
        }
        if (step.id === "eyewear") lens.material = mat(0xd8a53a, { rough: 0.15, opacity: 0.75, emissive: 0x7a5a12, ei: 0.7 });
        if (step.id === "open") trays.position.z = 0.24;
        if (step.id === "splice") { arcTimer = 0.6; repaint(splicerScreen, signFace("FUSING", { bg: "#1a1030", accent: "#a079ff", fg: "#dccdff", scale: 0.55 })); }
        if (step.id === "loss") repaint(splicerScreen, signFace("0.041 dB", { bg: "#0f1b14", accent: "#59c97b", fg: "#bff7d4", scale: 0.48 }));
        if (step.id === "protect") { ovenRunning = true; sleeve.visible = true; }
        if (step.id === "document") {
          ports[2].material = mat(CITY.good, { emissive: CITY.good, ei: 2.2 });
        }
      },

      animate(t, dt, session) {
        ports.forEach((p, i) => {
          if (i === 2 && portLive) p.material.emissiveIntensity = 1.8 + Math.sin(t * 5) * 0.8;
        });
        if (ovenRunning) ovenLamp.material.emissiveIntensity = 1.6 + Math.sin(t * 8) * 0.8;
        if (arcTimer > 0) {
          arcTimer -= dt;
          arcFlash.visible = true;
          arcFlash.scale.setScalar(0.6 + Math.random() * 1.2);
        } else if (arcFlash.visible) arcFlash.visible = false;

        const gg = session?.gauge;
        if (gg && !gg.committed) {
          const id = session.step?.id;
          if (id === "power-check") {
            repaint(meter.userData.screen, signFace(`${(-62 + gg.t * 66).toFixed(1)}`, {
              bg: "#0d1c24", accent: gg.t < 0.12 ? "#59c97b" : "#f0645b", fg: "#bfeaf7", scale: 0.55,
            }));
          }
          if (id === "cleave") {
            repaint(cleaverDial, signFace(`${(gg.t * 3.2).toFixed(1)}`, {
              bg: "#0d2430", accent: gg.t < 0.16 ? "#59c97b" : "#f2c14b", scale: 0.7,
            }));
          }
          if (id === "loss") {
            repaint(otdr.userData.screen, signFace(`${(gg.t * 0.6).toFixed(2)}`, {
              bg: "#0d1c24", accent: gg.t < 0.14 ? "#59c97b" : "#f2c14b", fg: "#bfeaf7", scale: 0.55,
            }));
          }
        }
      },
    };
  },
};

      gauge: {
        label: "CELL VOLTAGE SPREAD", speed: 0.65, green: [0.0, 0.14],
        readout: (t) => `${(t * 180).toFixed(0)} mV spread`,
        missNote: "Spread outside tolerance. That pack goes to balance charging, not onto the airframe.",
      },
    },
    {
      id: "swollen", kind: "select", target: "containment-bag",
      title: "Contain the damaged battery",
      cue: "Bag the swollen pack in the fireproof containment sleeve.",
      why: "A venting cell in a normal storage bin can ignite everything around it. The fireproof bag buys the time for it to be handled properly.",
    },
    {
      id: "unpin", kind: "select", target: "prop-pins",
      title: "Remove the rotor pins",
      cue: "Pull all four pins once the inspection is complete.",
      why: "The pins come out last, right before release — never while there is still a reason for a hand to be near the airframe.",
    },
    {
      id: "plan-route", kind: "sequence", targets: ["wp-launch", "wp-relay", "wp-delivery"],
      title: "Plan the autonomous delivery route",
      cue: "Set the route waypoints on the mission map in the order the aircraft will actually fly them.",
      why: "The flight controller flies the waypoints in the order they were entered — swap the relay and the delivery point and the aircraft plans a straight line through restricted airspace instead of around it.",
      itemNames: { "wp-launch": "launch waypoint", "wp-relay": "relay waypoint", "wp-delivery": "delivery waypoint" },
      itemNotes: {
        "wp-launch": "The climb-out point clear of the ramp boundary.",
        "wp-relay": "Routes the aircraft around the restricted corridor, not through it.",
        "wp-delivery": "The drop point at the delivery address.",
      },
      outOfOrderNote: "That waypoint comes later in the actual route. Launch, then relay, then delivery — the controller flies them in the order you entered them, not the order that looks obvious on the map.",
    },
    {
      id: "upload-mission", kind: "select", target: "upload-mission-btn",
      title: "Upload the mission",
      cue: "Push the planned route to the flight controller.",
      why: "A planned route sitting on the tablet is not a flight plan yet — uploading it is what the aircraft actually flies.",
    },
    {
      id: "verify-mission", kind: "hold", target: "verify-mission-btn", seconds: 2.5,
      title: "Verify the route against restricted airspace",
      cue: "Hold VERIFY while the controller checks every leg of the uploaded route.",
      why: "Airspace restrictions shift by the hour. You verify the specific route you are about to fly, every time, not the general area it happens to be in.",
      holdBreakNote: "Released before the airspace check finished — hold it through the full check, that's the only way to catch a corridor that shifted since the route was drawn.",
    },
    {
      id: "release", kind: "select", target: "preflight-tablet",
      title: "Sign the pre-flight release",
      cue: "Complete the digital release with the inspection findings.",
      why: "The release is a signed record that a specific person checked specific things. It is what the incident investigation reads first if something goes wrong in the air.",
    },
  ],

  build(root) {
    const hits = {};
    const g = group(root);
    stationPad(g, 2.05, 0x4fd1ff);

    // ------------------------------------------------------------ ramp pad
    box(g, 4.4, 0.1, 4.4, 0, 0.05, 0, 0x3d434a, { rough: 0.9 });
    torus(g, 1.5, 0.03, 0, 0.105, 0, 0xf2c14b, { emissive: 0xf2c14b, ei: 0.6, rough: 0.5, cast: false, seg: 6, seg2: 48 });
    for (let i = 0; i < 8; i++) {
      const a = (i / 8) * Math.PI * 2;
      box(g, 0.3, 0.006, 0.08, Math.sin(a) * 1.5, 0.108, Math.cos(a) * 1.5, 0xf2c14b,
        { rough: 0.5, cast: false }).rotation.y = a;
    }
    decal(g, 1.2, 1.2, 0, 0.055, -0.4, (ctx, w, h) => {
      ctx.fillStyle = "#3d434a"; ctx.fillRect(0, 0, w, h);
      ctx.strokeStyle = "#f2c14b"; ctx.lineWidth = 14;
      ctx.beginPath(); ctx.arc(w / 2, h / 2, w * 0.4, 0, Math.PI * 2); ctx.stroke();
      ctx.fillStyle = "#f2c14b";
      ctx.font = `700 ${Math.round(h * 0.4)}px 'Barlow Condensed', Arial, sans-serif`;
      ctx.textAlign = "center"; ctx.textBaseline = "middle";
      ctx.fillText("H", w / 2, h / 2);
    }, { px: 384 }).rotation.x = -Math.PI / 2;

    // ------------------------------------------------------------- the drone
    const drone = group(g, -0.2, 0.16, -0.5, 0.4);
    slab(drone, 0.32, 0.11, 0.42, 0, 0.06, 0, 0x22272c, { radius: 0.04, rough: 0.4, metal: 0.4 });
    box(drone, 0.2, 0.06, 0.2, 0, 0.14, 0.02, 0xdfe4e8, { radius: 0.02, rough: 0.3 });
    const arms = [];
    const rotors = [];
    const pins = [];
    for (let i = 0; i < 4; i++) {
      const a = (i / 4) * Math.PI * 2 + Math.PI / 4;
      const armLen = 0.4;
      const arm = group(drone, 0, 0.08, 0);
      const armMesh = box(arm, armLen, 0.025, 0.03, Math.sin(a) * armLen / 2, 0, Math.cos(a) * armLen / 2,
        0x2b3138, { rough: 0.4, metal: 0.5 });
      armMesh.rotation.y = a;
      arms.push({ arm: armMesh, id: i === 1 ? "fault-arm" : `arm-${i}` });
      const motor = cyl(arm, 0.032, 0.032, 0.03, Math.sin(a) * armLen, 0.015, Math.cos(a) * armLen,
        0x1b1e22, { rough: 0.4, metal: 0.6, seg: 14 });
      const rotorGroup = group(arm, Math.sin(a) * armLen, 0.03, Math.cos(a) * armLen);
      for (const s of [-1, 1]) {
        const blade = box(rotorGroup, 0.14, 0.006, 0.022, s * 0.07, 0, 0, i === 0 ? 0x2b3138 : 0x1b1e22,
          { rough: 0.35, cast: false });
        if (i === 0 && s === 1) reg(hits, blade, "fault-prop");
      }
      rotors.push(rotorGroup);
      const pin = cyl(rotorGroup, 0.006, 0.006, 0.06, 0, 0.03, 0, 0xf2c14b, { rough: 0.5, seg: 8 });
      pin.visible = false;
      pins.push(pin);
      reg(hits, rotorGroup, i === 0 ? "damaged-prop" : "spinning-rotor");
    }
    reg(hits, arms[1].arm, "fault-arm");
    const sensorMud = group(drone, 0, 0.08, 0.19);
    ball(sensorMud, 0.02, 0, 0, 0, 0x4a3a2a, { rough: 0.95 });
    reg(hits, sensorMud, "fault-sensor");
    holoTag(drone, "UAS-14", 0, 0.4, 0.2, { css: "#4fd1ff", w: 0.24 });

    const battBay = group(drone, 0, 0.02, -0.16);
    const battDoor = box(battBay, 0.18, 0.02, 0.14, 0, 0, 0, 0x2b3138, { rough: 0.4, metal: 0.4 });
    holoTag(battBay, "Battery bay", 0, 0.1, 0, { css: "#4fd1ff", w: 0.26 });
    reg(hits, battBay, "battery-bay");

    // Flight controller / link status on the ramp side.
    const controller = group(g, 1.1, 0, -1.35, -0.4);
    slab(controller, 0.28, 0.16, 0.06, 0, 0.9, 0, 0x22272c, { radius: 0.02, rough: 0.5 });
    const controllerScreen = decal(controller, 0.22, 0.1, 0, 0.92, 0.032,
      signFace("ARMED", { bg: "#2a1416", accent: "#f0645b", fg: "#ffd2ce", scale: 0.5 }),
      { glow: true, ei: 0.85, px: 256 });
    holoTag(controller, "Flight controller link", 0, 1.05, 0.04, { css: "#4fd1ff", w: 0.4 });
    reg(hits, controller, "flight-controller");
    const uploadBtn = cyl(controller, 0.018, 0.018, 0.012, -0.05, 0.8, 0.032, 0x4fd1ff, { rough: 0.4, seg: 14 });
    uploadBtn.rotation.x = Math.PI / 2;
    reg(hits, uploadBtn, "upload-mission-btn");
    const verifyBtn = cyl(controller, 0.018, 0.018, 0.012, 0.05, 0.8, 0.032, 0x59c97b, { rough: 0.4, seg: 14 });
    verifyBtn.rotation.x = Math.PI / 2;
    reg(hits, verifyBtn, "verify-mission-btn");
    holoTag(controller, "Upload · Verify", 0, 0.76, 0.03, { css: "#4fd1ff", w: 0.32 });

    // --------------------------------------------------------- route waypoints
    // Ground markers standing in for the mission-map pins on the tablet — the
    // same abstraction Robot Cell uses for taught positions. The connecting
    // line only lights up once the route is uploaded and verified.
    const wpLaunch = new THREE.Vector3(-1.4, 0.02, 0.4);
    const wpRelay = new THREE.Vector3(0, 0.02, -1.75);
    const wpDelivery = new THREE.Vector3(1.4, 0.02, 0.4);
    const waypointDefs = [
      [wpLaunch, "wp-launch", "1 · Launch", 0x59c97b],
      [wpRelay, "wp-relay", "2 · Relay", 0x4fd1ff],
      [wpDelivery, "wp-delivery", "3 · Delivery", 0xffcc00],
    ];
    for (const [pos, id, label, color] of waypointDefs) {
      const ring = torus(g, 0.09, 0.012, pos.x, pos.y, pos.z, color,
        { emissive: color, ei: 1.2, rough: 0.4, cast: false, seg: 6, seg2: 24 });
      ring.rotation.x = Math.PI / 2;
      holoTag(g, label, pos.x, pos.y + 0.24, pos.z, { css: "#4fd1ff", w: 0.32 });
      reg(hits, ring, id);
    }
    const routeLine = new THREE.Line(
      new THREE.BufferGeometry().setFromPoints([wpLaunch, wpRelay, wpDelivery]),
      new THREE.LineBasicMaterial({ color: 0x4fd1ff, transparent: true, opacity: 0.12 }));
    g.add(routeLine);

    // Spare propeller and containment bag on the tool chest.
    const chest = toolChest(g, 1.6, 0.9, { ry: -0.6, color: 0x2b6f8c });
    const pinCase = group(chest, -0.16, 0.79, 0.08, 0.3);
    box(pinCase, 0.1, 0.03, 0.07, 0, 0, 0, 0xf2c14b, { rough: 0.5 });
    for (let i = 0; i < 4; i++) {
      cyl(pinCase, 0.004, 0.004, 0.03, -0.03 + i * 0.02, 0.023, 0, 0xf2c14b, { rough: 0.5, seg: 8 });
    }
    holoTag(pinCase, "Rotor locking pins", 0, 0.1, 0, { css: "#4fd1ff", w: 0.32 });
    reg(hits, pinCase, "prop-pins");
    const spareProp = group(chest, -0.1, 0.79, 0, 0.4);
    for (const s of [-1, 1]) box(spareProp, 0.1, 0.005, 0.016, s * 0.05, 0, 0, 0xdfe4e8, { rough: 0.35 });
    holoTag(spareProp, "Spare propeller", 0, 0.1, 0, { css: "#4fd1ff", w: 0.28 });
    reg(hits, spareProp, "spare-prop");

    const bag = group(chest, 0.14, 0.8, -0.02);
    box(bag, 0.12, 0.03, 0.09, 0, 0, 0, 0xd8232a, { rough: 0.7 });
    decal(bag, 0.1, 0.02, 0, 0.017, 0.03, signFace("LiPo BAG", { bg: "#7d1512", accent: "#f2ae14", scale: 0.5 }), { px: 128 });
    holoTag(bag, "Containment bag", 0, 0.14, 0, { css: "#f0645b", w: 0.3 });
    reg(hits, bag, "containment-bag");

    const battMeter = instrument(chest, 0.02, 0.82, 0.14, { ry: -0.5, idle: "-- mV", color: 0x4fd1ff });
    holoTag(battMeter, "Cell checker", 0, 0.16, 0, { css: "#4fd1ff", w: 0.28 });
    reg(hits, battMeter, "battery-meter");

    // Swollen battery pack on the bench, visibly puffed.
    const swollenBatt = group(g, 1.75, 0, -0.15, 0.3);
    slab(swollenBatt, 0.16, 0.055, 0.09, 0, 0.05, 0, 0xd8b23a, { radius: 0.02, rough: 0.55 });
    ball(swollenBatt, 0.05, 0, 0.07, 0, 0xd8b23a, { rough: 0.55 }).scale.set(1.6, 0.7, 1);
    holoTag(swollenBatt, "Swollen pack", 0, 0.16, 0, { css: "#f0645b", w: 0.28 });
    reg(hits, swollenBatt, "swollen-battery");

    // Work zone.
    reg(hits, cone(g, -1.9, 1.3, { color: 0x4fd1ff }), "cone-a");
    reg(hits, cone(g, 1.9, 1.6, { color: 0x4fd1ff }), "cone-b");
    reg(hits, barrierPanel(g, 0, 1.9, { ry: 0.05, color: 0x4fd1ff }), "ramp-barrier");

    // Bystander crossing behind the boundary — the incursion trap.
    const bystander = standingFigure(g, 0.4, 2.3, { ry: 3.0, cloth: 0x445566 });
    reg(hits, bystander, "ramp-incursion");

    // Holo NOTAM board and pre-flight tablet.
    const notam = holoPanel(g, 0.56, 0.4, -1.85, 1.45, -1.15, (ctx, w, h) => {
      ctx.fillStyle = "rgba(6,16,22,0.9)"; ctx.fillRect(0, 0, w, h);
      ctx.fillStyle = "#4fd1ff"; ctx.fillRect(0, 0, w, 5);
      ctx.fillStyle = "#8fb3c4";
      ctx.font = `600 ${Math.round(h * 0.09)}px 'Barlow Condensed', Arial, sans-serif`;
      ctx.textAlign = "left"; ctx.textBaseline = "middle";
      ctx.fillText("NOTAM · VERTIPORT 4", w * 0.06, h * 0.14);
      ctx.fillStyle = "#eaf6fb";
      ctx.font = `600 ${Math.round(h * 0.15)}px 'Barlow Condensed', Arial, sans-serif`;
      ctx.fillText("GROUND OPS APPROVED", w * 0.06, h * 0.33);
      ctx.font = `${Math.round(h * 0.085)}px Arial, sans-serif`;
      ctx.fillStyle = "#a9c6d6";
      ["Aircraft: UAS-14, quad rotor", "Payload: medical delivery",
       "Battery: 6S LiPo, balance ±50 mV", "Cell spread limit: 100 mV",
       "Next scheduled flight: 14:20"].forEach((line, i) => ctx.fillText(line, w * 0.06, h * (0.5 + i * 0.11)));
    }, { ry: 0.7, accent: 0x4fd1ff });
    reg(hits, notam, "notam-board");

    const tablet = holoPanel(g, 0.4, 0.26, 1.85, 1.4, 0.6, (ctx, w, h) => {
      ctx.fillStyle = "rgba(6,16,22,0.9)"; ctx.fillRect(0, 0, w, h);
      ctx.fillStyle = "#4fd1ff"; ctx.fillRect(0, 0, w, 5);
      ctx.fillStyle = "#eaf6fb";
      ctx.font = `600 ${Math.round(h * 0.2)}px 'Barlow Condensed', Arial, sans-serif`;
      ctx.textAlign = "center"; ctx.textBaseline = "middle";
      ctx.fillText("PRE-FLIGHT RELEASE", w / 2, h * 0.34);
      ctx.font = `${Math.round(h * 0.12)}px Arial, sans-serif`;
      ctx.fillStyle = "#a9c6d6";
      ctx.fillText("Sign off inspection findings", w / 2, h * 0.64);
      ctx.fillText("and release to flight", w / 2, h * 0.8);
    }, { ry: -0.6, accent: 0x4fd1ff });
    reg(hits, tablet, "preflight-tablet");

    let armed = true;
    let pinned = false;

    return {
      hits,
      footprint: 2.05,

      onStepComplete(step) {
        if (step.id === "disarm") {
          armed = false;
          repaint(controllerScreen, signFace("DISARMED", { bg: "#0d1c14", accent: "#59c97b", fg: "#bff7d4", scale: 0.42 }));
        }
        if (step.id === "pin") { pinned = true; pins.forEach((p) => { p.visible = true; }); }
        // spare-prop's own position/rotation are already set by the drag-and-
        // drop gesture (app.js snaps it onto the damaged rotor mount on a
        // successful drop); hide the old damaged rotor assembly it replaces.
        if (step.id === "swap-prop") rotors[0].visible = false;
        if (step.id === "battery") battDoor.rotation.x = -1.2;
        if (step.id === "swollen") swollenBatt.visible = false;
        if (step.id === "unpin") { pinned = false; pins.forEach((p) => { p.visible = false; }); }
        if (step.id === "upload-mission") routeLine.material.opacity = 0.45;
        if (step.id === "verify-mission") {
          routeLine.material.opacity = 1;
          routeLine.material.color.set(0x59c97b);
        }
        if (step.id === "release") {
          repaint(controllerScreen, signFace("RELEASED", { bg: "#0d1c14", accent: "#4fd1ff", fg: "#bfeaf7", scale: 0.4 }));
        }
      },

      animate(t, dt, session) {
        if (armed && !pinned) rotors.forEach((r) => { r.rotation.y += dt * 26; });
        bystander.userData.head.rotation.y = Math.sin(t * 0.5) * 0.4;

        const gg = session?.gauge;
        if (gg && !gg.committed && session.step?.id === "cellcheck") {
          repaint(battMeter.userData.screen, signFace(`${Math.round(gg.t * 180)} mV`, {
            bg: "#0d1c24", accent: gg.t < 0.14 ? "#59c97b" : "#f0645b", fg: "#bfeaf7", scale: 0.55,
          }));
        }

        if (session?.step?.id === "verify-mission" && session.holding) {
          const p = Math.min(1, session.holdFor / session.step.seconds);
          routeLine.material.opacity = 0.45 + p * 0.55;
          routeLine.material.color.set(p > 0.98 ? 0x59c97b : 0x4fd1ff);
        }
      },
    };
  },
};

      title: "Fit the rail bonding clamp",
      cue: "Clamp the bond across the joint before working on it.",
