<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Holodeck ~ Speak a Simulation Into Existence (Powered by AGI Corp &amp; Visko)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600&family=Barlow:wght@400;500;600&display=swap">
<style>
  :root{
    --void:#0a0714; --panel:#150f24; --glass:rgba(15,10,26,.88); --raised:#1d1530;
    --text:#f3edfb; --muted:#a998c4; --accent:#c58cff; --warn:#f2c14b;
    --danger:#f0645b; --edge:#3a2a52; --good:#59c97b;
    --sans:"Barlow", system-ui, sans-serif; --cond:"Barlow Condensed", "Barlow", system-ui, sans-serif;
  }
  *{box-sizing:border-box}
  [hidden]{display:none !important}
  html,body{height:100%;margin:0;overscroll-behavior:none}
  body{ background:var(--void); color:var(--text); font-family:var(--sans); overflow:hidden; -webkit-font-smoothing:antialiased; }
  #stage{position:fixed;inset:0}
  #stage canvas{display:block;touch-action:none}

  .chip{ position:fixed; background:var(--glass); border:1px solid var(--edge); border-radius:5px;
         padding:9px 14px; pointer-events:none; backdrop-filter:blur(4px); }
  .eyebrow{ font-family:var(--cond); font-weight:600; font-size:11px; letter-spacing:.16em;
            text-transform:uppercase; color:var(--muted); }
  .brandline{ font-family:var(--cond); font-weight:600; font-size:10.5px; letter-spacing:.2em;
              text-transform:uppercase; color:var(--accent); opacity:.85; margin:0 0 4px; }
  #hud-hole-chip{ top:14px; left:14px; }
  #hud-hole-name{ font-family:var(--cond); font-weight:600; font-size:19px; letter-spacing:.03em; text-transform:uppercase; }
  #hud-hole-sub{ font-size:12px; color:var(--muted); margin-top:1px }
  #hud-gesture{ display:inline-block; margin-top:6px; font-family:var(--cond); font-weight:600;
    font-size:10.5px; letter-spacing:.1em; color:var(--accent); border:1px solid var(--accent);
    border-radius:3px; padding:2px 8px; text-transform:uppercase; }
  #gesture-tip{ position:fixed; left:50%; bottom:98px; transform:translateX(-50%) translateY(6px);
    max-width:min(520px, calc(100vw - 28px)); background:var(--glass); border:1px solid var(--accent);
    border-radius:6px; padding:10px 16px; text-align:center; font-size:13px; color:var(--text);
    line-height:1.4; pointer-events:none; opacity:0; transition:opacity .25s ease, transform .25s ease;
    z-index:12; backdrop-filter:blur(4px); }
  #gesture-tip.show{ opacity:1; transform:translateX(-50%) translateY(0); }
  #gesture-tip b{ color:var(--accent); }
  #speak-btn{ position:fixed; right:14px; bottom:14px; z-index:11; display:flex; align-items:center;
    justify-content:center; width:44px; height:44px; border-radius:50%; font-size:18px; padding:0;
    border:1px solid var(--edge); background:var(--glass); color:var(--text); backdrop-filter:blur(4px); }
  #speak-btn:hover{ filter:brightness(1.15) }
  @supports (padding: max(0px)){
    #speak-btn{ right:max(14px, env(safe-area-inset-right)); bottom:max(14px, env(safe-area-inset-bottom)) }
  }
  #hud-score-chip{ top:14px; right:14px; text-align:right; min-width:150px; }
  #hud-strokes{ font-family:var(--cond); font-weight:600; font-size:26px; letter-spacing:.05em; font-variant-numeric:tabular-nums; }
  #hud-par{ font-family:var(--cond); font-weight:600; font-size:12px; letter-spacing:.08em; color:var(--accent); }
  #hud-rail{ position:fixed; left:50%; transform:translateX(-50%); bottom:14px;
    width:min(560px, calc(100vw - 28px)); background:var(--glass);
    border:1px solid var(--edge); border-left:3px solid var(--accent);
    border-radius:5px; padding:11px 16px; pointer-events:none; backdrop-filter:blur(4px); }
  #hud-rail[data-state="ok"]{ border-left-color:var(--good) }
  #hud-rail[data-state="warn"]{ border-left-color:var(--warn) }
  #hud-rail[data-state="danger"]{ border-left-color:var(--danger) }
  #hud-rail[data-state="neutral"]{ border-left-color:var(--accent) }
  #hud-count{ font-family:var(--cond); font-weight:600; font-size:11.5px; letter-spacing:.09em;
    color:var(--muted); margin-top:8px; display:block }
  #hud-feedback{ font-size:14px; line-height:1.5 }
  #hud-power-track{ height:6px; background:var(--raised); border-radius:3px; overflow:hidden; margin-top:9px }
  #hud-power-fill{ height:100%; width:0; background:var(--accent); transition:width .05s linear }

  .overlay{ position:fixed; inset:0; z-index:20; display:flex; align-items:center; justify-content:center;
    background:rgba(5,3,10,.86); padding:16px; overflow-y:auto; }
  .card{ width:min(680px,100%); max-height:calc(100vh - 32px); max-height:calc(100dvh - 32px); overflow-y:auto;
    background:var(--panel); border:1px solid var(--edge); border-top:3px solid var(--accent);
    border-radius:8px; padding:24px 28px; }
  .card h1{ font-family:var(--cond); font-weight:600; font-size:clamp(26px,5vw,36px);
    letter-spacing:.03em; text-transform:uppercase; margin:3px 0 5px; }
  .card p{ color:var(--muted); font-size:13.5px; line-height:1.55; margin:0 0 10px; max-width:64ch }
  .card p.lead{ color:var(--text) }
  .btnrow{ display:flex; gap:8px; flex-wrap:wrap; margin:10px 0 12px }
  button{ font-family:var(--cond); font-weight:600; font-size:15px; letter-spacing:.08em;
    text-transform:uppercase; cursor:pointer; border-radius:4px; padding:11px 20px; min-height:44px;
    border:1px solid var(--edge); background:var(--raised); color:var(--text); touch-action:manipulation; }
  button.primary{ background:var(--accent); border-color:var(--accent); color:#1c0d33 }
  button:hover{ filter:brightness(1.12) }
  button:focus-visible{ outline:2px solid var(--accent); outline-offset:2px }
  button[disabled]{ opacity:.4; cursor:not-allowed; filter:none }
  .fineprint{ font-size:12px; color:var(--muted); line-height:1.55; margin:0 }
  .fineprint a{ color:var(--accent) }

  #prompt-row{ margin:14px 0 6px }
  #prompt-row label{ display:block; margin-bottom:6px }
  #prompt-input{ width:100%; background:var(--raised); border:1px solid var(--edge); border-radius:6px;
    color:var(--text); font-family:var(--sans); font-size:15px; padding:12px 14px; resize:vertical;
    min-height:64px; }
  #prompt-input:focus{ outline:2px solid var(--accent); outline-offset:1px }
  #prompt-actions{ display:flex; gap:8px; margin-top:8px; flex-wrap:wrap }
  #mic-btn.listening{ background:var(--danger); border-color:var(--danger); color:#2a0c0c; animation:pulseMic 1s ease-in-out infinite; }
  @keyframes pulseMic{ 0%,100%{ transform:scale(1); } 50%{ transform:scale(1.05); } }
  #prompt-error{ color:var(--danger); font-size:13px; margin:6px 0 0 }
  #prompt-heard{ font-size:13px; color:var(--accent); margin:6px 0 0 }

  .theme-picks{ display:flex; gap:8px; flex-wrap:wrap; margin:6px 0 4px }
  .theme-chip{ font-family:var(--cond); font-weight:600; font-size:12.5px; letter-spacing:.05em;
    text-transform:uppercase; padding:8px 12px; border-radius:20px; border:1px solid var(--edge);
    background:var(--raised); color:var(--text); cursor:pointer; touch-action:manipulation; min-height:auto; }
  .theme-chip.active{ background:var(--accent); border-color:var(--accent); color:#1c0d33 }

  .scorecard{ width:100%; border-collapse:collapse; margin:10px 0; font-size:14px }
  .scorecard th{ text-align:left; font-family:var(--cond); font-weight:600; letter-spacing:.06em;
    font-size:11px; color:var(--muted); text-transform:uppercase; padding:6px 8px; border-bottom:1px solid var(--edge) }
  .scorecard td{ padding:7px 8px; border-bottom:1px solid rgba(58,42,82,.4); font-variant-numeric:tabular-nums }
  .res-stars{ font-size:34px; letter-spacing:.1em; color:var(--warn); line-height:1; margin-bottom:6px }
  .res-note{ font-size:13.5px !important }
  body.danger-flash::after{ content:""; position:fixed; inset:0; pointer-events:none; z-index:15;
    background:radial-gradient(circle at 50% 55%, rgba(197,140,255,.34), rgba(197,140,255,0) 62%);
    animation:flash .42s ease-out; }
  @keyframes flash{ from{opacity:1} to{opacity:0} }
  @media (prefers-reduced-motion:reduce){ body.danger-flash::after{ animation:none; opacity:.28 } #mic-btn.listening{ animation:none } }
  @media (max-width:640px){
    #hud-hole-name{ font-size:15px } #hud-strokes{ font-size:20px }
    .btnrow button{ flex:1 1 calc(50% - 4px) }
    .card{ padding:20px 18px }
  }
  @supports (padding: max(0px)){
    #hud-hole-chip{ left:max(14px, env(safe-area-inset-left)) }
    #hud-score-chip{ right:max(14px, env(safe-area-inset-right)) }
    #hud-rail{ bottom:max(14px, env(safe-area-inset-bottom)) }
  }
    /* A composed programme reads as a plan: a numbered list of real stations,
       each one a link into the app that owns it. Wider than the result cards
       because it is something a learner works down rather than glances at. */
    .lesson-card { max-width: 640px; text-align: left; }
    .lesson-card h2 { margin: 0 0 6px; font-size: 22px; }
    .lesson-meta { margin: 6px 0; font-size: 13px; color: #8fb3c4; }
    .lesson-list { list-style: none; margin: 14px 0; padding: 0; }
    .lesson-row { display: flex; gap: 12px; align-items: flex-start; padding: 8px 0; border-top: 1px solid rgba(143,179,196,.18); }
    .lesson-n { flex: 0 0 26px; height: 26px; border-radius: 13px; background: rgba(79,209,255,.15);
      color: #4fd1ff; font-weight: 700; font-size: 13px; display: grid; place-items: center; }
    .lesson-body { display: flex; flex-direction: column; gap: 2px; }
    .lesson-launch { color: #eaf6fb; font-weight: 700; text-decoration: none; }
    .lesson-launch:hover, .lesson-launch:focus-visible { text-decoration: underline; }
    .lesson-body small { color: #8fb3c4; font-size: 12px; }

</style>

<!-- Generated by tools/bundle_webxr.py from WebXR/holodeck/js — edit the modules, not this file. -->


<div id="stage"></div>

<div id="react-root"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script type="module">
import * as THREE from "https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.module.min.js";

/* ===== shared/a11y.js ===== */
// Accessibility support shared by every app.
//
// A simulator that can only be operated by looking and clicking is one a
// publicly funded training centre cannot buy, and it excludes learners who
// belong in the trade. This module carries the three things the apps need to
// offer a keyboard path and a spoken one: a live region a screen reader
// reads, a keyboard cursor over the current step's targets, and a
// reduced-motion flag the scene honours.
//
// What it does not do is pretend the headset modes are keyboard-operable.
// A VR session is hand controllers by definition; the accessible path is the
// flat-screen mode, which runs the same procedure, scores it the same way and
// writes the same record. That is stated plainly in ACCESSIBILITY.md rather
// than papered over.

/** The learner asked their system for less animation. Read once per call so a
 *  change during a session is picked up on the next frame that asks. */
/**
 * Escape text before it goes into innerHTML.
 *
 * This lived as a private function in SmartCiti.X's app.js while the Trade
 * Skills app called it by the same name and never defined it — so every
 * trades debrief threw ReferenceError the moment it tried to render a step
 * title, and the results screen never appeared. Shared, because the next app
 * to build a debrief will reach for it too.
 */
function escapeHtml(s) {
  return String(s ?? "").replace(/[&<>"']/g, (c) =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

function reducedMotion() {
  try { return !!window.matchMedia?.("(prefers-reduced-motion: reduce)")?.matches; }
  catch (_) { return false; }
}

/**
 * A visually hidden ARIA live region. Everything the app says out loud —
 * the step, the focused control, feedback, the verdict — goes here too, so a
 * screen reader user gets it without the synthesised voice.
 *
 * Polite by default; hazards and other interruptions are assertive.
 */
function createAnnouncer(doc = typeof document !== "undefined" ? document : null) {
  if (!doc?.body) return { say() { return false; }, alert() { return false; }, node: null };
  const make = (live) => {
    const n = doc.createElement("div");
    n.setAttribute("role", live === "assertive" ? "alert" : "status");
    n.setAttribute("aria-live", live);
    n.setAttribute("aria-atomic", "true");
    // Clipped rather than display:none, which screen readers skip entirely.
    Object.assign(n.style, {
      position: "absolute", width: "1px", height: "1px", margin: "-1px", padding: "0",
      overflow: "hidden", clip: "rect(0 0 0 0)", clipPath: "inset(50%)", whiteSpace: "nowrap", border: "0",
    });
    doc.body.appendChild(n);
    return n;
  };
  const polite = make("polite");
  const urgent = make("assertive");
  let lastPolite = "";
  const write = (node, text) => {
    const t = String(text ?? "").replace(/<[^>]*>/g, " ").replace(/\s+/g, " ").trim();
    if (!t) return false;
    // A region whose text does not change is not re-announced, so nudge it.
    node.textContent = node.textContent === t ? t + " " : t;
    return true;
  };
  return {
    node: polite,
    say(text) { const t = String(text ?? ""); if (t === lastPolite) return false; lastPolite = t; return write(polite, t); },
    alert(text) { return write(urgent, text); },
  };
}

/**
 * A cursor over the controls the current step can act on, so Tab walks them
 * in the order the procedure names them rather than in scene-graph order.
 *
 * The app owns what the list is (see targetsForStep); this only remembers
 * where the learner is in it and hands back the id to focus.
 */
function createTargetCursor() {
  let ids = [], i = -1;
  const same = (a, b) => a.length === b.length && a.every((v, k) => v === b[k]);
  return {
    get ids() { return ids; },
    get current() { return i >= 0 && i < ids.length ? ids[i] : null; },
    get index() { return i; },
    /** Replace the list. Keeps the cursor on the same id when it survives. */
    set(next = []) {
      const list = next.filter(Boolean);
      if (same(list, ids)) return this.current;
      const held = this.current;
      ids = list;
      i = held && ids.includes(held) ? ids.indexOf(held) : (ids.length ? 0 : -1);
      return this.current;
    },
    next() { if (!ids.length) return null; i = (i + 1) % ids.length; return ids[i]; },
    prev() { if (!ids.length) return null; i = (i - 1 + ids.length) % ids.length; return ids[i]; },
    focus(id) { const k = ids.indexOf(id); if (k >= 0) i = k; return this.current; },
    clear() { ids = []; i = -1; },
  };
}

/**
 * The sentence read out when the cursor lands on a control: what it is, what
 * this step wants done with it, and how to do that from the keyboard.
 */
function describeTarget(id, step, { names = {}, position = null } = {}) {
  const name = names[id] ?? String(id).replace(/[-_]/g, " ");
  const where = position ? ` ${position[0]} of ${position[1]}.` : "";
  if (!step) return `${name}.${where}`;
  const live = id === step.target || (step.targets ?? []).includes(id);
  if (!live) return `${name}.${where} Not part of this step.`;
  const how = {
    select: "Press Enter to select it.",
    sequence: "Press Enter to take it in turn.",
    find: "Press Enter to mark it.",
    gauge: "Up and down arrows move the reading, Enter commits it.",
    turn: "Up and down arrows turn it, it completes when it reaches the required turns.",
    hold: "Hold the space bar to keep it held, release to stop.",
    track: "Hold the space bar and use the arrows to keep the reading in the band.",
    drag: "Press Enter to pick it up, then Enter again on the place it belongs.",
  }[step.kind] ?? "Press Enter to act on it.";
  return `${name}.${where} ${how}`;
}


/* ===== shared/devices.js ===== */
// Device profiles: how the apps run on the head-worn hardware a construction,
// industrial, maritime or emergency-services crew actually wears — and the
// headsets a union training centre buys for the training room.
//
// Many of these are assisted-reality or optical see-through AR devices, not
// VR headsets: the wearer keeps direct sight of the real site, the display is
// small and often monocular, and the input is voice, a touchpad or a few
// buttons rather than controllers. A procedure that renders a full plaza with
// rain at 2× pixel ratio behind a 28px HUD is unreadable on an 854-pixel-wide
// monocular display clipped to a hardhat. So each device maps to a run
// profile, and the profile decides: pixel ratio and shadows, whether the
// weather layer and the skyline are built, how large the HUD is drawn, whether
// the scene sits on black (optical see-through: black is transparent), which
// entry mode the intro offers first, and what the select verb is called in a
// hint (a trigger, a pinch, a touchpad, a spoken word).
//
// Detection is by URL (`?device=<id>`, the way a training office pins a
// kiosk), then user agent, then screen size. A wrong guess only changes the
// profile, never the procedure, and the intro names what it chose so a
// learner can correct it. A user-agent rule exists only for devices whose
// browser is known to announce itself (Quest browsers say "OculusBrowser" and
// the model, PICO browsers say "PICO", RealWear, Vuzix M-series, Moverio,
// Rokid, Iristick, ThirdEye, Univet, HoloLens); every other device has
// `ua: null` and is reached by the URL override only. Apple Vision Pro's
// Safari sends a desktop-Mac user agent on purpose, so it is URL-only.
// Specific rules sit above generic ones in the table because the detector
// takes the first match; tools/check_devices.mjs proves no rule shadows
// another.
//
// `class` groups the hardware the way a procurement sheet does:
//   vr        opaque headset, passthrough optional (Quest, Pico, Vive, Varjo,
//             Vision Pro)
//   mr        optical see-through headset with room tracking (HoloLens 2,
//             Magic Leap 2)
//   goggle    binocular see-through glasses without WebXR (Moverio, Shield,
//             ThinkReality A3, Blade, X-Craft, X2, VisionAR)
//   monocular a single small display on a hardhat or a frame (RealWear,
//             Vuzix M-series and Z100, Iristick, Glass EE2)
//   helmet    the display is built into head or face protection (Atom,
//             DAQRI, MIDAS)
//
// `input` is what another team's Controls panel reads: `primary` is the way
// the learner selects, `voiceFirst` means the vendor designs for voice as
// the main input, `controllers` means tracked hand controllers, `hands`
// means the device tracks the learner's bare hands, `keyboard` means a
// keyboard reaches the page, `gaze` means where the learner looks is an
// input the page can act on. `safety` records the vendor's own statements —
// `true` is a vendor claim to be verified, "unverified" means no statement
// was confirmed — and never a certification by this project. The three
// questions a safety officer has to answer (eye protection rating, helmet
// mount through an approved accessory slot, operational suitability) are in
// docs/devices.md.

const CLASSES = ["vr", "mr", "goggle", "monocular", "helmet"];
const INPUT_PRIMARY = ["controllers", "hands", "voice", "touchpad", "buttons", "mouse"];

/** A run profile. Beyond the render flags, `display` says what is in front
 *  of the eye (flat screen, opaque headset, binocular see-through, monocular),
 *  `targetScale` is how much larger the app may draw selectable targets,
 *  `selectVerb` is the one word a hint uses for selecting, and `hint` is the
 *  sentence the Controls panel shows before the first step. */
const PROFILES = {
  desktop: {
    label: "Desktop / tablet / phone",
    pixelRatio: 2, shadows: true, weather: true, skyline: true, hudScale: 1, contrast: "normal",
    background: null, prefer: "flat", voicePrompt: false, display: "flat", targetScale: 1, selectVerb: "click",
    hint: "Click or tap a highlighted part to select it.", note: "The full scene.",
  },
  vr: {
    label: "VR headset",
    pixelRatio: 2, shadows: true, weather: true, skyline: true, hudScale: 1, contrast: "normal",
    background: null, prefer: "vr", voicePrompt: false, display: "opaque", targetScale: 1, selectVerb: "trigger",
    hint: "Point the controller at a part and pull the trigger to select it.", note: "Immersive VR with controllers, hands where the browser offers them.",
  },
  hands: {
    label: "Hand-tracked headset",
    pixelRatio: 2, shadows: true, weather: true, skyline: true, hudScale: 1.1, contrast: "normal",
    background: null, prefer: "vr", voicePrompt: false, display: "opaque", targetScale: 1.15, selectVerb: "pinch",
    hint: "Look at a part and pinch thumb and finger together to select it.",
    note: "Immersive VR driven by tracked hands with no controllers: the HUD and the selectable targets are drawn a little larger, and every hint names a pinch rather than a trigger.",
  },
  mr: {
    label: "Mixed-reality headset",
    pixelRatio: 1, shadows: false, weather: "light", skyline: false, hudScale: 1.15, contrast: "high",
    background: null, prefer: "ar", voicePrompt: true, display: "seethrough", targetScale: 1.15, selectVerb: "pinch",
    hint: "Air-tap: pinch thumb and finger on a part to select it.",
    note: "WebXR immersive AR with hit-test and hands where the browser offers it; the station is placed on the real floor and the plaza is not built.",
  },
  seethrough: {
    label: "Optical see-through AR glasses",
    pixelRatio: 1, shadows: false, weather: false, skyline: false, hudScale: 1.3, contrast: "high",
    background: "black", prefer: "flat", voicePrompt: true, display: "seethrough", targetScale: 1.2, selectVerb: "touchpad",
    hint: "Select with the glasses' touchpad or controller; voice reads each step back.",
    note: "Binocular see-through display without WebXR: the scene is drawn on black so the real site shows through, the HUD is enlarged and high-contrast, and voice runs the steps.",
  },
  assisted: {
    label: "Assisted-reality (monocular) display",
    pixelRatio: 1, shadows: false, weather: false, skyline: false, hudScale: 1.5, contrast: "high",
    background: "dark", prefer: "flat", voicePrompt: true, display: "monocular", targetScale: 1.3, selectVerb: "say",
    hint: "Say the part's name or press the action button to select it.",
    note: "A small monocular display on a hardhat: one large step card at a time, voice-driven, no drag gestures required, minimal scene.",
  },
};

// Record builders, as function declarations: the bundler reads a one-line
// `const` with destructured defaults as several declared names.
function IN(primary, flags = {}) {
  return { primary, voiceFirst: false, controllers: false, hands: false, keyboard: false, gaze: false, ...flags };
}
function SAFE(flags = {}) {
  return { ansiZ87: false, intrinsicallySafe: false, helmetMount: false, ...flags };
}
const NOT_PPE = "Not PPE; training-room use";

/** The device table. `kind` is what the vendor calls it; `class` is the
 *  procurement grouping above; `profile` is how the apps run it; `xr` is
 *  whether the device's browser is known to offer WebXR immersive sessions
 *  (none / ar / vr / both) — "none" means the flat mode with the profile's
 *  theme, and is also what an unverified browser gets. `mount` and `ppe` are
 *  the vendor's own statements, to be verified with the vendor and the
 *  safety officer. Order matters for user-agent detection: a specific rule

const SYNTHETIC = {
  "generic-assisted": { brand: "Unknown", product: "Small monocular display", kind: "Assisted reality", class: "monocular", profile: "assisted", xr: "none", input: IN("voice", { voiceFirst: true }), safety: SAFE({ ansiZ87: "unverified", intrinsicallySafe: "unverified" }) },
  desktop: { brand: "—", product: "Desktop, tablet or phone browser", kind: "Flat screen", class: "flat", profile: "desktop", xr: "unknown", input: IN("mouse", { keyboard: true }), safety: SAFE() },
};

/** Which device this page is on: the URL wins, then the user agent, then a
 *  small-monocular screen heuristic, else desktop. */
function detectDevice({ ua = typeof navigator !== "undefined" ? navigator.userAgent : "", width = typeof screen !== "undefined" ? screen.width : 1920, height = typeof screen !== "undefined" ? screen.height : 1080, search = typeof location !== "undefined" ? location.search : "" } = {}) {
  const q = new URLSearchParams(search).get("device");
  if (q && DEVICES[q]) return { id: q, ...DEVICES[q], how: "url" };
  for (const [id, d] of Object.entries(DEVICES)) if (d.ua?.test(ua)) return { id, ...d, how: "user agent" };
  if (width <= 900 && height <= 540) return { id: "generic-assisted", ...SYNTHETIC["generic-assisted"], how: "screen size" };
  return { id: "desktop", ...SYNTHETIC.desktop, how: "default" };
}

/** Apply a device's profile to the renderer and the page. Returns the
 *  profile with the device attached so the app can read its flags. */
function applyProfile(device, { renderer = null, root = typeof document !== "undefined" ? document.documentElement : null } = {}) {
  const profile = { ...(PROFILES[device.profile] ?? PROFILES.desktop), id: device.profile, device };
  if (renderer) {
    const dpr = typeof devicePixelRatio === "number" ? devicePixelRatio : 1;
    renderer.setPixelRatio(Math.min(dpr, profile.pixelRatio));
    renderer.shadowMap.enabled = profile.shadows;
  }
  if (root) {
    root.dataset.profile = profile.id;
    root.dataset.device = device.id;
    root.style.setProperty("--hud-scale", String(profile.hudScale));
  }
  return profile;
}

/** The weather kind a station should build under this profile. */
function weatherUnder(profile, kind) {
  if (profile.weather === true) return kind;
  if (profile.weather === "light") return kind === "storm" || kind === "rain" || kind === "smoke" ? "overcast" : kind;
  return "clear";
}

/** Sit the scene on the profile's background: black for optical
 *  see-through (transparent to the wearer), a flat dark tone for a
 *  monocular display, untouched for everything else. Hides the skyline
 *  group when the profile does not build a horizon. */
function themeScene(profile, scene, stageRoot, THREE) {
  if (profile.background === "black") { scene.background = new THREE.Color(0x000000); scene.fog = null; }
  else if (profile.background === "dark") { scene.background = new THREE.Color(0x06090f); scene.fog = null; }
  if (!profile.skyline && stageRoot) stageRoot.traverse((o) => { if (o.name === "skyline" || o.name === "district") o.visible = false; });
}

/** The input style in one clause, from a device's `input` record: what the
 *  Controls panel and the intro say the learner drives the station with. */
function describeInput(input) {
  if (!input) return "";
  if (input.voiceFirst) return "voice-first";
  switch (input.primary) {
    case "hands": return input.gaze ? "hands and gaze" : "hands";
    case "controllers": return input.hands ? "controllers or hands" : "controllers";
    case "mouse": return input.keyboard ? "mouse, touch and keyboard" : "mouse or touch";
    case "touchpad": return input.keyboard ? "touchpad or keyboard" : "touchpad";
    case "buttons": return "buttons";
    case "voice": return "voice";
    default: return String(input.primary);
  }
}

/** One line for the intro: what was detected, how it will run and what
 *  drives it. */
function describeDevice(device, profile) {
  const name = device.brand === "—" ? device.product : `${device.brand} ${device.product}`;
  const drive = describeInput(device.input);
  return `${name} — ${profile.label.toLowerCase()} profile${drive ? `, ${drive}` : ""} (${device.how}).`;
}


/* ===== shared/ei-guide.js ===== */
// The guide's emotional intelligence: what it says when a learner strikes a
// hazard, misses an interruption, answers one wrong, or finishes a run — and
// the check-in it offers at the end.
//
// The engine already scores. This layer decides the tone of what is said
// around the score, and it follows the rules a good peer-support trainer
// follows: name what happened in one plain sentence, say what to do next,
// never blame, never minimise, and after a hard run ask how the person is
// and point at the real support line. Every line is short enough to be
// spoken by the voice assist without covering the next step.
//
// A first responder who just missed a Mayday in a simulation does not need
// "Unsafe action detected". They need "You missed the Mayday while the line
// was stretched. Next time, the radio wins. Reset and go again." The same is
// true of an apprentice who touched a live bus.

const EI_HAZARD = [
  "That one would have hurt someone. Take a breath, look at what you reached for, and go again from the step.",
  "Stop there. That is the reach the procedure exists to prevent. The step is still open — take it the right way.",
  "That is an unsafe action, and it is why we practise here and not on the job. Reset your hands and finish the step.",
];
const EI_HAZARD_AGAIN = [
  "Twice on the same thing. That usually means the setup is wrong, not the hands — look at where you are standing before the next move.",
  "Same trap again. Slow down: read the cue, find the control, then act. There is no clock on this that matters more than the order.",
];
const EI_MISSED = [
  "You missed it — the {kind} came while your hands were busy, which is exactly when it comes on the job. Next time the alarm wins.",
  "That {kind} went unanswered. Nobody notices the first one; the training is so you notice the second.",
];
const EI_WRONG = [
  "You answered the {kind}, but with the wrong control. The right one is separate from what you were holding — that separation is the lesson.",
  "Right instinct, wrong control. Look for the one that is not the thing in your hands.",
];
const EI_FINISH_CLEAN = [
  "Clean run. You caught every interruption and touched nothing you should not have. That is the standard — keep it.",
];
const EI_FINISH_ROUGH = [
  "Finished, with some unsafe actions on the sheet. That is what the sheet is for. Read the debrief before you run it again.",
];

const eiPick = (list, idx) => list[Math.abs(idx || 0) % list.length];

/** The guide's line for a moment. `ctx.kind` names the interruption kind
 *  ("alarm", "person in the wrong place"); `ctx.count` how many hazards so
 *  far this run; `ctx.clean` for a finish. */
function eiLine(moment, ctx = {}) {
  const kind = ctx.kind || "interruption";
  switch (moment) {
    case "hazard": return (ctx.count ?? 1) >= 2 ? eiPick(EI_HAZARD_AGAIN, ctx.count) : eiPick(EI_HAZARD, ctx.seed ?? 0);
    case "missed": return eiPick(EI_MISSED, ctx.seed ?? 0).replace("{kind}", kind);
    case "wrong": return eiPick(EI_WRONG, ctx.seed ?? 0).replace("{kind}", kind);
    case "finish": return ctx.clean ? EI_FINISH_CLEAN[0] : EI_FINISH_ROUGH[0];
    default: return "";
  }
}

/** The end-of-run check-in. Three answers, none scored, one supportive line
 *  each; a hard run (hazards or missed interruptions) adds the support
 *  pointer. The department's or local's own line goes in `supportLine`. */
const CHECKIN_OPTIONS = [
  { id: "steady", label: "Steady", reply: "Good. Take the debrief with you." },
  { id: "shaken", label: "A bit shaken", reply: "That is a normal reaction to a run that felt real. Give it a minute before the next one." },
  { id: "minute", label: "Need a minute", reply: "Take it. The station will be here. If it stays with you, say so to someone — that is what peer support is for." },
];

function checkInPrompt({ rough = false, supportLine = "your local's peer-support team or EAP line" } = {}) {
  return rough
    ? `How are you doing after that one? There is no score on this question. If it stayed with you, ${supportLine} is the right call, and there is no penalty for making it.`
    : "How are you doing after that run? There is no score on this question.";
}

const EI_KEY = "smartcitix-checkins-v1";
/** Record a check-in in the learner's own browser only (never transmitted). */
function recordCheckIn(entry) {
  try {
    const list = JSON.parse(localStorage.getItem(EI_KEY) || "[]");
    list.push({ ...entry, at: new Date().toISOString() });
    localStorage.setItem(EI_KEY, JSON.stringify(list.slice(-200)));
    return true;
  } catch { return false; }
}
function checkIns() { try { return JSON.parse(localStorage.getItem(EI_KEY) || "[]"); } catch { return []; } }

/**
 * The deep input layer: the gamepad poller, the keyboard binding table and
 * the voice grammar — all of it pure, so every one of them can be driven
 * headless from Node with a fake `navigator` (see tools/check_input.mjs).
 *
 * Why this is one module rather than three:
 *
 * - The three devices name the same small set of actions. A d-pad press, a
 *   Tab key and the word "next" all mean "focus the next control this step
 *   names". Keeping one action table is what makes the interface brief's rule
 *   — every bound action is also reachable by keyboard and mouse — checkable
 *   rather than aspirational.
 * - None of it may complete a step. Voice and the pads navigate, focus,
 *   adjust, read back and open panels; the select/press/drag/turn paths in
 *   shared/game.js stay where they are. `focus` moves the keyboard cursor and
 *   nothing else, which is why it lives here and not near the Session.
 * - The app is the only place that knows what a control IS. This module deals
 *   in action ids, key tokens, button indices and parsed phrases; app.js maps
 *   those onto the station's own hit ids.
 *
 * Nothing here touches the DOM, three.js or a Session. `localStorage` is
 * reached through an injectable handle, so a checker passes a plain object.
 */

// --------------------------------------------------------------- the actions
//
// One row per thing a learner can ask for with a key or a button. `group`
// only orders the panel. Locomotion (WASD/arrows to walk, the mouse or a
// stick to look) is continuous rather than an action, and is listed
// separately as CONTINUOUS_ACTIONS below.

const INPUT_ACTIONS = [
  { id: "focusPrev", group: "step", label: "Focus previous control", what: "Walks the cursor back through the controls this step names." },
  { id: "focusNext", group: "step", label: "Focus next control", what: "Walks the cursor forward through the controls this step names, in procedure order." },
  { id: "activate", group: "step", label: "Take the focused control", what: "Exactly what a click does: select it, or place what you are carrying." },
  { id: "hold", group: "step", label: "Press and hold", what: "Holds the focused control down for a hold or track step; let go to release." },
  { id: "adjustUp", group: "step", label: "Adjust up", what: "Raises a gauge reading, a tracked value, or a valve's turns." },
  { id: "adjustDown", group: "step", label: "Adjust down", what: "Lowers a gauge reading, a tracked value, or a valve's turns." },
  { id: "turnLeft", group: "step", label: "Turn anticlockwise", what: "Turns a turn step's target the way a wrist roll or a mouse arc would." },
  { id: "turnRight", group: "step", label: "Turn clockwise", what: "The same, the other way." },
  { id: "speakHint", group: "assist", label: "Read the step aloud", what: "Speaks the live step's title and cue, and writes it to the live region." },
  { id: "voice", group: "assist", label: "Start or stop listening", what: "The microphone button, from the keyboard." },
  { id: "mute", group: "assist", label: "Mute or unmute", what: "Silences the sound effects and the spoken lines." },
  { id: "controls", group: "panel", label: "Open the controls panel", what: "This panel." },
  { id: "back", group: "panel", label: "Close the panel, or back to the campus", what: "Closes the topmost overlay first, then leaves the station." },
];

/** Continuous input: not remappable, and each one already has a pointer or
 *  keyboard equivalent, which is the fallback rule the brief states. */
const CONTINUOUS_ACTIONS = [
  { id: "look", label: "Look around", fallback: "Drag with the mouse" },
  { id: "walk", label: "Walk and strafe", fallback: "WASD or the arrow keys" },
];

const ACTION_IDS = INPUT_ACTIONS.map((a) => a.id);
const ACTION_BY_ID = Object.fromEntries(INPUT_ACTIONS.map((a) => [a.id, a]));

// ------------------------------------------------------------ keyboard presets
//
// A binding is a list of key tokens: a `KeyboardEvent.code`, optionally with a
// `Shift+` prefix. Codes rather than `key` values, so a binding survives a
// non-US layout and a caps-lock state the way the existing Tab/Enter/Space
// scheme does.
//
// Two rules hold in every preset, and tools/check_input.mjs enforces both:
// every action is bound, and no key is bound twice inside one preset.

const KEYBOARD_PRESETS = {
  standard: {
    label: "Standard",
    note: "What the app has always used: Tab walks the step's controls, Enter takes the one in focus, the space bar is the hold, the arrows work an analogue control.",
    keys: {
      focusPrev: ["Shift+Tab", "ArrowLeft"],
      focusNext: ["Tab", "ArrowRight"],
      activate: ["Enter", "NumpadEnter"],
      hold: ["Space"],
      adjustUp: ["ArrowUp"],
      adjustDown: ["ArrowDown"],
      turnLeft: ["KeyQ"],
      turnRight: ["KeyE"],
      speakHint: ["KeyH"],
      voice: ["KeyV"],
      mute: ["KeyM"],
      controls: ["Slash", "F1"],
      back: ["Escape"],
    },
  },
  wasd: {
    label: "WASD + IJKL",
    note: "The left hand stays on WASD to walk; the right hand works the step on the IJKL cluster instead of reaching for Tab.",
    keys: {
      focusPrev: ["KeyJ"],
      focusNext: ["KeyL"],
      activate: ["Enter"],
      hold: ["Space"],
      adjustUp: ["KeyI"],
      adjustDown: ["KeyK"],
      turnLeft: ["KeyU"],
      turnRight: ["KeyO"],
      speakHint: ["KeyH"],
      voice: ["KeyY"],
      mute: ["KeyM"],
      controls: ["Slash", "F1"],
      back: ["Escape"],
    },
  },
  "left-hand": {
    label: "Left hand",
    note: "For a learner who keeps the mouse in the right hand: every action sits on the left third of the board, with Enter moved to G.",
    keys: {
      focusPrev: ["Shift+Tab"],
      focusNext: ["Tab"],
      activate: ["KeyG"],
      hold: ["Space"],
      adjustUp: ["KeyR"],
      adjustDown: ["KeyF"],
      turnLeft: ["KeyZ"],
      turnRight: ["KeyC"],
      speakHint: ["KeyT"],
      voice: ["KeyB"],
      mute: ["KeyV"],
      controls: ["Backquote", "F1"],
      back: ["Escape"],
    },
  },
  numpad: {
    label: "Numeric keypad",
    note: "The whole procedure from the keypad, the way an operator works a panel: 4 and 6 walk the controls, 8 and 2 adjust, 5 takes, 0 holds.",
    keys: {
      focusPrev: ["Numpad4"],
      focusNext: ["Numpad6"],
      activate: ["Numpad5", "NumpadEnter"],
      hold: ["Numpad0"],
      adjustUp: ["Numpad8"],
      adjustDown: ["Numpad2"],
      turnLeft: ["Numpad7"],
      turnRight: ["Numpad9"],
      speakHint: ["Numpad1"],
      voice: ["NumpadMultiply"],
      mute: ["Numpad3"],
      controls: ["NumpadDivide", "F1"],
      back: ["NumpadSubtract", "Escape"],
    },
  },
  "one-hand": {
    label: "One hand",
    note: "Every action inside the span of one hand, with no chord, no modifier, no Tab and no function key — the preset to pick when the other hand is holding a tool, a rail or a radio.",
    keys: {
      focusPrev: ["KeyZ"],
      focusNext: ["KeyX"],
      activate: ["KeyC"],
      hold: ["Space"],
      adjustUp: ["KeyR"],
      adjustDown: ["KeyV"],
      turnLeft: ["KeyQ"],
      turnRight: ["KeyE"],
      speakHint: ["KeyT"],
      voice: ["KeyB"],
      mute: ["KeyF"],
      controls: ["KeyG"],
      back: ["Escape"],
    },
  },
};

const PRESET_IDS = Object.keys(KEYBOARD_PRESETS);
const INPUT_STORAGE_KEY = "smartcitix-input-v1";

function cloneKeys(keys) {
  const out = {};
  for (const [action, list] of Object.entries(keys ?? {})) out[action] = [...list];
  return out;
}

/** The bindings a preset ships with, as a fresh object nobody else shares. */
function presetBindings(presetId = "standard") {
  const id = KEYBOARD_PRESETS[presetId] ? presetId : "standard";
  return { preset: id, keys: cloneKeys(KEYBOARD_PRESETS[id].keys) };
}

/** Keys bound to more than one action inside one binding set. */
function duplicateKeys(keys = {}) {
  const seen = new Map();
  const dupes = [];
  for (const action of Object.keys(keys)) {
    for (const token of keys[action] ?? []) {
      if (seen.has(token)) dupes.push({ token, actions: [seen.get(token), action] });
      else seen.set(token, action);
    }
  }
  return dupes;
}

function storageHandle(storage) {
  if (storage) return storage;
  try { return typeof localStorage !== "undefined" ? localStorage : null; } catch { return null; }
}

/** Read the saved profile, repairing anything odd rather than throwing: an
 *  unknown preset falls back to standard, a malformed list is ignored, and an
 *  action the saved file never heard of (because it was added after that file
 *  was written) keeps its preset default instead of going unbound. */
function loadBindings(storage) {
  const handle = storageHandle(storage);
  let saved = null;
  try { saved = JSON.parse(handle?.getItem(INPUT_STORAGE_KEY) ?? "null"); } catch { saved = null; }
  const base = presetBindings(saved?.preset);
  if (saved && saved.keys && typeof saved.keys === "object") {
    for (const action of ACTION_IDS) {
      const list = saved.keys[action];
      if (!Array.isArray(list)) continue;
      const clean = list.filter((t) => typeof t === "string" && t.length > 0 && t.length < 40);
      if (clean.length) base.keys[action] = clean;
    }
  }
  return base;
}

function saveBindings(profile, storage) {
  const handle = storageHandle(storage);
  const safe = {
    preset: KEYBOARD_PRESETS[profile?.preset] ? profile.preset : "standard",
    keys: cloneKeys(profile?.keys ?? presetBindings(profile?.preset).keys),
  };
  // A locked, full or private-mode store is not a reason to stop taking input.
  try { handle?.setItem(INPUT_STORAGE_KEY, JSON.stringify(safe)); } catch { /* ignore */ }
  return safe;
}

/** Back to a preset's own keys, and forget the saved overrides. */
function resetBindings(presetId = "standard", storage) {
  const handle = storageHandle(storage);
  try { handle?.removeItem(INPUT_STORAGE_KEY); } catch { /* ignore */ }
  return presetBindings(presetId);
}

/** Bind one key to one action. The token comes off every other action first,
 *  so a remap can never create the duplicate the checker forbids, and an
 *  action left with nothing falls back to its preset key rather than going
 *  dark — an unreachable action is the one thing the brief rules out. */
function remapAction(profile, action, token) {
  if (!ACTION_BY_ID[action] || typeof token !== "string" || !token) return profile;
  const keys = cloneKeys(profile?.keys ?? presetBindings(profile?.preset).keys);
  for (const other of Object.keys(keys)) {
    if (other === action) continue;
    keys[other] = keys[other].filter((t) => t !== token);
  }
  const preset = KEYBOARD_PRESETS[profile?.preset] ?? KEYBOARD_PRESETS.standard;
  for (const other of Object.keys(keys)) {
    if (other === action || keys[other].length) continue;
    const fallback = (preset.keys[other] ?? []).filter((t) => t !== token);
    keys[other] = fallback.length ? fallback : [`Unbound:${other}`];
  }
  keys[action] = [token];
  return { preset: profile?.preset ?? "standard", keys };
}

/** A `KeyboardEvent` as the token a binding is written with. */
function keyToken(event) {
  const code = event?.code ?? "";
  if (!code) return "";
  if (code === "ShiftLeft" || code === "ShiftRight") return code;
  return `${event.shiftKey ? "Shift+" : ""}${code}`;
}

/** Which action this key runs, or null. Tab and Shift+Tab are two separate
 *  bindings; a binding written without the prefix still answers to the
 *  shifted form, so Shift+M is mute, unless something else claims it. */
function actionForKey(profile, token) {
  if (!token) return null;
  const keys = profile?.keys ?? {};
  for (const action of ACTION_IDS) if ((keys[action] ?? []).includes(token)) return action;
  if (!token.startsWith("Shift+")) return null;
  const bare = token.slice(6);
  for (const action of ACTION_IDS) if ((keys[action] ?? []).includes(bare)) return action;
  return null;
}

const KEY_NAMES = {
  Space: "Space", Escape: "Esc", Enter: "Enter", NumpadEnter: "Numpad Enter", Tab: "Tab",
  ArrowUp: "↑", ArrowDown: "↓", ArrowLeft: "←", ArrowRight: "→",
  Slash: "/", Backquote: "`", NumpadDivide: "Numpad /", NumpadMultiply: "Numpad ×",
  NumpadSubtract: "Numpad −", NumpadAdd: "Numpad +", NumpadDecimal: "Numpad .",
};

/** A key token the way a learner reads it on the panel. */
function prettyKey(token = "") {
  const shift = token.startsWith("Shift+");
  const code = shift ? token.slice(6) : token;
  let name = KEY_NAMES[code];
  if (!name && code.startsWith("Key")) name = code.slice(3);
  if (!name && code.startsWith("Digit")) name = code.slice(5);
  if (!name && code.startsWith("Numpad")) name = `Numpad ${code.slice(6)}`;
  if (!name && code.startsWith("Unbound:")) name = "not bound";
  if (!name) name = code;
  return shift ? `Shift + ${name}` : name;
}

/** One row per action for the Keyboard tab: the action, what it does, the
 *  keys bound to it now, and whether that differs from the preset. */
function describeBindings(profile) {
  const active = profile?.keys ? profile : presetBindings(profile?.preset ?? "standard");
  const preset = KEYBOARD_PRESETS[active.preset] ?? KEYBOARD_PRESETS.standard;
  return INPUT_ACTIONS.map((action) => {
    const keys = active.keys[action.id] ?? [];
    const base = preset.keys[action.id] ?? [];
    return {
      action: action.id,
      label: action.label,
      what: action.what,
      group: action.group,
      keys: [...keys],
      pretty: keys.map(prettyKey),
      custom: keys.join("|") !== base.join("|"),
      unbound: keys.length === 0 || keys.every((t) => t.startsWith("Unbound:")),
    };
  });
}

// --------------------------------------------------------------- the gamepad
//
// The W3C Standard Gamepad mapping, by index only. An Xbox pad, a PlayStation
// pad and a generic one all report the same indices when
// `gamepad.mapping === "standard"`; only the printing on the plastic differs,
// so the detected vendor decides the LABELS and never the mapping. This runs
// in flat/desktop mode only: inside an immersive session the controllers
// arrive as `XRInputSource.gamepad`, which app.js's xrMove already reads.

const GAMEPAD_DEADZONE = 0.18;

const PAD_LABELS = {
  xbox: {
    name: "Xbox",
    buttons: ["A", "B", "X", "Y", "LB", "RB", "LT", "RT", "View", "Menu", "L3", "R3", "D-pad up", "D-pad down", "D-pad left", "D-pad right", "Guide"],
    axes: ["Left stick X", "Left stick Y", "Right stick X", "Right stick Y"],
  },
  playstation: {
    name: "PlayStation",
    buttons: ["Cross", "Circle", "Square", "Triangle", "L1", "R1", "L2", "R2", "Share / Create", "Options", "L3", "R3", "D-pad up", "D-pad down", "D-pad left", "D-pad right", "PS"],
    axes: ["Left stick X", "Left stick Y", "Right stick X", "Right stick Y"],
  },
  generic: {
    name: "Generic",
    buttons: ["Bottom face", "Right face", "Left face", "Top face", "Left bumper", "Right bumper", "Left trigger", "Right trigger", "Select", "Start", "Left stick press", "Right stick press", "D-pad up", "D-pad down", "D-pad left", "D-pad right", "Home"],
    axes: ["Left stick X", "Left stick Y", "Right stick X", "Right stick Y"],
  },
};

/** Which printing to use for the labels. A vendor id is the only hint a
 *  browser gives, and a pad nobody recognises still works — it just gets the
 *  neutral names. */
function detectPadVendor(id = "") {
  const s = String(id).toLowerCase();
  if (/xbox|xinput|microsoft|045e/.test(s)) return "xbox";
  if (/playstation|dualsense|dualshock|sony|054c/.test(s)) return "playstation";
  return "generic";
}

function padButtonLabel(index, vendor = "generic") {
  const set = PAD_LABELS[vendor] ?? PAD_LABELS.generic;
  return set.buttons[index] ?? `Button ${index}`;
}

function padAxisLabel(index, vendor = "generic") {
  const set = PAD_LABELS[vendor] ?? PAD_LABELS.generic;
  return set.axes[index] ?? `Axis ${index}`;
}

// `mode` is how a button repeats, and it is the whole of the edge detection:
//   edge        — fires once on the press, however long it is held
//   repeat      — fires on the press, then every repeatMs while held
//   analog      — a trigger: fires every poll above its threshold, with value
//   press-hold  — a tap is `activate`; keeping it down is `hold` (start/end)
const GAMEPAD_MAP = [
  { index: 0, mode: "press-hold", action: "activate", holdAction: "hold", note: "Tap to take the control in focus; keep it down for a hold or track step." },
  { index: 1, mode: "edge", action: "back", note: "Closes the topmost panel, then leaves the station — the Escape path." },
  { index: 2, mode: "edge", action: "voice", note: "Starts and stops listening." },
  { index: 3, mode: "edge", action: "speakHint", note: "Reads the live step aloud." },
  { index: 4, mode: "repeat", action: "turnLeft", note: "Turns a turn step's target anticlockwise while held." },
  { index: 5, mode: "repeat", action: "turnRight", note: "Turns it clockwise while held." },
  { index: 6, mode: "analog", action: "adjustDown", note: "Gauge, tracked value or valve down, as far as the trigger is pulled." },
  { index: 7, mode: "analog", action: "adjustUp", note: "The same, up." },
  { index: 8, mode: "edge", action: "back", note: "Back to the campus." },
  { index: 9, mode: "edge", action: "controls", note: "Opens and closes the controls panel." },
  { index: 10, mode: "edge", action: "mute", note: "Mutes the sound and the spoken lines." },
  { index: 12, mode: "repeat", action: "adjustUp", note: "Steps a gauge, a tracked value or a valve up." },
  { index: 13, mode: "repeat", action: "adjustDown", note: "Steps it down." },
  { index: 14, mode: "edge", action: "focusPrev", note: "Focus the previous control this step names." },
  { index: 15, mode: "edge", action: "focusNext", note: "Focus the next one." },
];

const GAMEPAD_AXIS_MAP = [
  { axes: [0, 1], action: "look", note: "Orbits and pitches the view, the way dragging with the mouse does." },
  { axes: [2, 3], action: "walk", note: "Walks and strafes inside the station's roam limit, like WASD." },
];

function applyDeadzone(value, deadzone) {
  const v = typeof value === "number" && Number.isFinite(value) ? value : 0;
  const a = Math.abs(v);
  if (a < deadzone) return 0;
  return Math.sign(v) * ((a - deadzone) / (1 - deadzone));
}

function buttonValue(button) {
  if (button == null) return 0;
  if (typeof button === "number") return button;
  if (typeof button.value === "number" && Number.isFinite(button.value)) return button.value;
  return button.pressed ? 1 : 0;
}

/**
 * The poller. `getGamepads` is whatever returns an array-like of pads:
 * `() => navigator.getGamepads()` in a browser, `() => [fakePad]` in a test.
 * `onAction(action, info)` is called for every action the pad produces, with
 * `info` carrying `{ value, phase, repeat, dx, dy, dt, index, source }`.
 *
 *     const pad = createGamepad({ getGamepads: () => navigator.getGamepads(), onAction });
 *     pad.poll(dt);   // once per frame, outside an immersive session
 */
function createGamepad({
  getGamepads,
  bindings = GAMEPAD_MAP,
  axisBindings = GAMEPAD_AXIS_MAP,
  onAction = () => {},
  onConnect = null,
  deadzone = GAMEPAD_DEADZONE,
  holdMs = 320,
  repeatMs = 140,
  triggerThreshold = 0.12,
  shouldPoll = () => true,
  now = () => (typeof performance !== "undefined" && performance.now ? performance.now() : Date.now()),
} = {}) {
  const down = new Map();      // button index → { since, firedAt, holding }
  let padId = null, vendor = "generic", connected = false;
  let last = { connected: false, id: "", vendor: "generic", mapping: "", buttons: [], axes: [] };

  function pickPad() {
    let pads = [];
    try { pads = getGamepads?.() ?? []; } catch { pads = []; }
    for (const pad of Array.from(pads)) {
      if (!pad || pad.connected === false) continue;
      if (!pad.buttons && !pad.axes) continue;
      return pad;
    }
    return null;
  }

  function reset() { down.clear(); }

  function poll(dt = 1 / 60) {
    if (!shouldPoll()) {
      if (connected) { connected = false; reset(); }
      return null;
    }
    const pad = pickPad();
    if (!pad) {
      if (connected) { connected = false; reset(); last = { ...last, connected: false }; onConnect?.(last); }
      return null;
    }
    const id = String(pad.id ?? "");
    if (!connected || id !== padId) {
      padId = id; vendor = detectPadVendor(id); connected = true; reset();
      last = { connected: true, id, vendor, mapping: String(pad.mapping ?? ""), buttons: [], axes: [] };
      onConnect?.(last);
    }
    const t = now();
    const buttons = pad.buttons ?? [];
    const axes = pad.axes ?? [];

    for (const bind of bindings) {
      const value = buttonValue(buttons[bind.index]);
      if (bind.mode === "analog") {
        if (value > triggerThreshold) onAction(bind.action, { value, analog: true, dt, index: bind.index, source: "gamepad" });
        continue;
      }
      const isDown = value > 0.5;
      const state = down.get(bind.index);
      if (isDown && !state) {
        down.set(bind.index, { since: t, firedAt: t, holding: false });
        // A press-hold button decides on release, or when the hold timer runs
        // out below — that is what makes one physical press one action.
        if (bind.mode !== "press-hold") onAction(bind.action, { value: 1, dt, index: bind.index, source: "gamepad" });
      } else if (isDown && state) {
        if (bind.mode === "repeat" && t - state.firedAt >= repeatMs) {
          state.firedAt = t;
          onAction(bind.action, { value: 1, repeat: true, dt, index: bind.index, source: "gamepad" });
        }
        if (bind.mode === "press-hold" && !state.holding && t - state.since >= holdMs) {
          state.holding = true;
          onAction(bind.holdAction ?? "hold", { phase: "start", dt, index: bind.index, source: "gamepad" });
        }
      } else if (!isDown && state) {
        down.delete(bind.index);
        if (bind.mode === "press-hold") {
          if (state.holding) onAction(bind.holdAction ?? "hold", { phase: "end", dt, index: bind.index, source: "gamepad" });
          else onAction(bind.action, { value: 1, dt, index: bind.index, source: "gamepad", tap: true });
        }
      }
    }

    for (const bind of axisBindings) {
      const [xi, yi] = bind.axes;
      const dx = applyDeadzone(axes[xi], deadzone);
      const dy = applyDeadzone(axes[yi], deadzone);
      if (dx || dy) onAction(bind.action, { dx, dy, dt, source: "gamepad" });
    }

    last = {
      connected: true, id, vendor, mapping: String(pad.mapping ?? ""),
      buttons: Array.from(buttons, (b, i) => {
        const bind = bindings.find((x) => x.index === i);
        const v = buttonValue(b);
        return { index: i, label: padButtonLabel(i, vendor), value: Number(v.toFixed(3)), pressed: v > 0.5, action: bind?.action ?? null, mode: bind?.mode ?? null };
      }),
      axes: Array.from(axes, (v, i) => ({
        index: i, label: padAxisLabel(i, vendor),
        value: Number((typeof v === "number" ? v : 0).toFixed(3)),
        live: applyDeadzone(v, deadzone) !== 0,
      })),
    };
    return last;
  }

  return {
    poll,
    reset,
    get vendor() { return vendor; },
    get connected() { return connected; },
    snapshot() { return last; },
    /** The panel's map table for whichever pad is in hand. */
    describe(forVendor = vendor) {
      return bindings.map((b) => ({
        index: b.index, mode: b.mode, action: b.action,
        label: padButtonLabel(b.index, forVendor),
        actionLabel: ACTION_BY_ID[b.action]?.label ?? b.action,
        note: b.note ?? "",
      }));
    },
  };
}

/** The gamepad map as rows without a live pad — for the docs and for the
 *  panel before anything is plugged in. */
function describeGamepadMap(vendor = "generic") {
  const rows = GAMEPAD_MAP.map((b) => ({
    index: b.index, mode: b.mode, action: b.action,
    label: padButtonLabel(b.index, vendor),
    actionLabel: ACTION_BY_ID[b.action]?.label ?? b.action,
    note: b.note ?? "",
  }));
  for (const a of GAMEPAD_AXIS_MAP) {
    rows.push({
      index: null, mode: "axis", action: a.action,
      label: a.axes.map((i) => padAxisLabel(i, vendor)).join(" / "),
      actionLabel: CONTINUOUS_ACTIONS.find((c) => c.id === a.action)?.label ?? a.action,
      note: a.note,
    });
  }
  return rows;
}

// ----------------------------------------------------------- the voice grammar
//
// Navigation, focus, read-back and panels. Nothing here completes a step:
// `focus` moves the keyboard cursor, `next`/`previous` walk it, `read step`
// and `repeat` only speak. That is the interface brief's first rule, and it is
// why "select item N" numbers the hub's cards and the panel's buttons rather
// than the station's own controls.

const NUMBER_WORDS = {
  one: 1, two: 2, three: 3, four: 4, five: 5, six: 6, seven: 7, eight: 8, nine: 9, ten: 10,
  eleven: 11, twelve: 12, thirteen: 13, fourteen: 14, fifteen: 15, sixteen: 16,
  seventeen: 17, eighteen: 18, nineteen: 19, twenty: 20,
  // What a recogniser hears instead, on a noisy site.
  won: 1, to: 2, too: 2, tu: 2, free: 3, tree: 3, for: 4, ate: 8, nein: 9,
};

function spokenNumber(word) {
  if (word == null) return null;
  const s = String(word).trim().toLowerCase();
  if (/^\d+$/.test(s)) { const n = parseInt(s, 10); return n > 0 ? n : null; }
  return NUMBER_WORDS[s] ?? null;
}

/** The item a "select item N" refers to, from the numbered menu the app
 *  passes as `ctx.menu` (hub cards and panel buttons, in badge order). */
function resolveMenuItem(n, menu = []) {
  if (!Array.isArray(menu) || !n || n < 1 || n > menu.length) return null;
  return menu[n - 1] ?? null;
}

/** Match a spoken name against `[{ id, name }]`: exact first, then a
 *  containment either way, longest name first so a short name cannot shadow
 *  a longer one that contains it. */
function matchTargetName(spoken, entries = []) {
  const flatten = (s) => String(s ?? "").toLowerCase().replace(/[^a-z0-9 ]+/g, " ").replace(/\s+/g, " ").trim();
  const want = flatten(spoken);
  if (!want) return null;
  const rows = [...entries]
    .filter((e) => e && (e.name || e.id))
    .map((e) => ({ ...e, hay: flatten(e.name ?? e.id) }))
    .sort((a, b) => b.hay.length - a.hay.length);
  return rows.find((r) => r.hay === want)
    ?? rows.find((r) => r.hay.includes(want) || want.includes(r.hay))
    ?? null;
}

// Order is the grammar: the specific phrases are matched before the general
// ones, so "what next" stays a hint instead of becoming "next".
const VOICE_GRAMMAR = [

  // Plural "controls" only: the singular belongs to "next control" and
  // "last control", which walk the focus and must not open a panel.
  { type: "controls", scope: "any", phrases: ["controls", "show controls"], what: "Opens the controls panel.", re: /\b(controls|control panel|key ?bindings?|button map)\b/ },
  { type: "showNumbers", scope: "any", phrases: ["show numbers", "hide numbers"], what: "Puts a small number badge on every hub card and panel button, so each can be chosen by number.", re: /\b(show|hide|turn off|turn on)\s+(?:the\s+)?numbers?\b/, parse: (m) => ({ on: /show|turn on/.test(m[1]) }) },
  { type: "selectItem", scope: "any", phrases: ["select item 3", "item three", "number 7"], what: "Takes the numbered hub card or panel button — the voice-first path on a monocular display.", re: /\b(?:select|pick|choose|open|activate)?\s*(?:item|option|number|card|button)\s+([a-z0-9]+)\b|\b(?:select|pick|choose)\s+([a-z0-9]+)\b/, parse: (m, ctx) => { const n = spokenNumber(m[1] ?? m[2]); return n ? { index: n, item: resolveMenuItem(n, ctx?.menu) } : null; } },
  { type: "whereIs", scope: "run", phrases: ["where is the isolation valve"], what: "Says where a control is, relative to where the learner is standing. It never touches it.", re: /\bwhere(?:'s| is| are)\s+(?:the\s+)?(.+?)\s*\??$/, parse: (m) => ({ name: m[1].trim() }) },
  { type: "focus", scope: "run", phrases: ["focus the tag bag", "highlight the gauge"], what: "Moves the keyboard cursor onto a named control and reads it out. It never takes it — hands do that.", re: /\b(?:focus(?: on)?|highlight|point (?:at|to))\s+(?:the\s+)?(.+?)\s*\??$/, parse: (m) => ({ name: m[1].trim() }) },
  { type: "readStep", scope: "run", phrases: ["read step", "read the step"], what: "Reads the live step's title, cue and progress.", re: /\bread(?: me)?(?: out)?(?: the)?\s+(step|cue|objective)\b/ },
  { type: "repeat", scope: "any", phrases: ["repeat", "say that again"], what: "Says the last spoken line again.", re: /\b(repeat|say (?:that|it) again|again please)\b/ },
  { type: "hint", scope: "any", phrases: ["hint", "what now"], what: "The live step's title and cue, or how to start a station.", re: /\b(hint|what now|what next|what do i do|current step)\b/ },
  { type: "checkIn", scope: "any", phrases: ["check in"], what: "Opens the well-being check-in: how the learner is after a hard run. Nothing about it is scored.", re: /\bcheck[- ]?in\b|\bchecking in\b/ },
  { type: "checkInAnswer", scope: "any", phrases: ["steady", "a bit shaken", "need a minute"], what: "Answers the check-in.", re: /\b(steady|shaken|need a minute|give me a minute)\b/, parse: (m) => ({ answer: /steady/.test(m[1]) ? "steady" : /shaken/.test(m[1]) ? "shaken" : "minute" }) },

  { type: "bigger", scope: "any", phrases: ["bigger"], what: "A larger HUD, or a larger diorama in AR — the command a monocular display needs most.", re: /\b(bigger|larger|zoom in|magnify|scale up)\b/ },
  { type: "smaller", scope: "any", phrases: ["smaller"], what: "A smaller HUD, or a smaller diorama in AR.", re: /\b(smaller|zoom out|shrink|scale down)\b/ },
  { type: "leaderboard", scope: "hub", phrases: ["leaderboards"], what: "Opens the leaderboards.", re: /\bleaderboards?\b/ },
  { type: "programs", scope: "hub", phrases: ["programmes"], what: "Opens the training programmes.", re: /\b(programme?s?|programs?|curricul(?:um|a)|pathway)\b/ },

  { type: "editor", scope: "hub", phrases: ["editor"], what: "Opens the scenario editor.", re: /\b(scenario|editor)\b/ },
  { type: "reset", scope: "hub", phrases: ["reset"], what: "Clears the progress held in this browser.", re: /\breset\b/ },
  { type: "brief", scope: "any", phrases: ["brief"], what: "Reads the station's briefing line.", re: /\b(brief|briefing|about this station)\b/ },
  { type: "status", scope: "any", phrases: ["status"], what: "Stations cleared, stars, level.", re: /\b(status|progress|score)\b/ },
  { type: "hub", scope: "any", phrases: ["hub", "campus"], what: "Back to the campus.", re: /\b(hub|campus|home|back)\b/ },

const VOICE_HELP_LINE =
  'Say a station name, or "next", "previous", "focus" and a control\'s name, "where is" and a control\'s name, ' +
  '"read step", "repeat", "hint", "brief", "status", "select item" and a number, "show numbers", "bigger", "smaller", ' +
  '"mute", "unmute", "controls", "check in", "hub", "leaderboards", "records", "programmes", "tour", "editor", "reset", or "help".';

/**
 * Parse one heard phrase into `{ type, ... }`, with `type: "unknown"` when
 * nothing matches. Station names are NOT matched here — app.js owns the
 * roster, matches a station name first, and delegates everything else to
 * this. `ctx.menu` is the numbered menu for "select item N".
 */
function parseVoice(text, ctx = {}) {
  const lower = String(text ?? "").toLowerCase().trim();
  if (!lower) return { type: "unknown", text: "" };
  for (const entry of VOICE_GRAMMAR) {
    const m = entry.re.exec(lower);
    if (!m) continue;
    const extra = entry.parse ? entry.parse(m, ctx, lower) : {};
    // An entry may decline: "select the valve" is not an item number.
    if (extra === null) continue;
    return { type: entry.type, text: lower, ...extra };
  }
  return { type: "unknown", text: lower };
}

/** The check-in's spoken short forms. The fuller wording a peer-support
 *  trainer would use is in shared/ei-guide.js; these are what a monocular
 *  display reads aloud, where every line has to fit one breath. */
const CHECKIN_QUESTION =
  'How are you doing after that one? Nothing about this is scored. Say "steady", "shaken", or "need a minute".';
const CHECKIN_REPLIES = {
  steady: "Good. Take the debrief with you.",
  shaken: "That is a normal reaction to a run that felt real. Give it a minute before the next one.",
  minute: "Take it. The station will be here, and peer support exists for exactly this.",
};

// ------------------------------------------------- what this device can drive
//
// devices.js is the one place a headset is described (interface brief), so
// this reads a device rather than sniffing anything itself. A DEVICES entry
// may carry an `input` object — { primary, voiceFirst, controllers, hands,
// keyboard } — and when it does, that decides which tabs the controls panel
// shows and in what order. Entries that list input kinds as a plain array,
// and any device with no entry at all, fall back to the run profile.

const PROFILE_INPUTS = {
  desktop: { primary: "keyboard", voiceFirst: false, controllers: true, hands: false, keyboard: true },
  vr: { primary: "controllers", voiceFirst: false, controllers: true, hands: true, keyboard: true },
  mr: { primary: "hands", voiceFirst: true, controllers: false, hands: true, keyboard: true },
  seethrough: { primary: "voice", voiceFirst: true, controllers: false, hands: false, keyboard: true },
  assisted: { primary: "voice", voiceFirst: true, controllers: false, hands: false, keyboard: true },
};

const TAB_FOR_PRIMARY = { keyboard: "keyboard", controllers: "gamepad", gamepad: "gamepad", voice: "voice", hands: "voice" };

/**
 * Which controls tabs to show, in which order, and which to hide.
 * `device` is a devices.js entry (or the detector's result) and `profile` is
 * what applyProfile returned. Returns `{ tabs, primary, voiceFirst, hands,
 * controllers, keyboard, source }` — `source` says whether the device or the
 * profile decided.
 */
function describeInputs(device = null, profile = null) {
  const raw = device?.input;
  const fromDevice = !!raw && !Array.isArray(raw) && typeof raw === "object";
  const io = fromDevice
    ? { primary: "keyboard", voiceFirst: false, controllers: true, hands: false, keyboard: true, ...raw }
    : (PROFILE_INPUTS[profile?.id ?? device?.profile] ?? PROFILE_INPUTS.desktop);
  const tabs = [];
  const add = (id) => {
    if (!id || tabs.includes(id)) return;
    if (id === "gamepad" && io.controllers === false) return;
    if (id === "keyboard" && io.keyboard === false) return;
    tabs.push(id);
  };
  add(TAB_FOR_PRIMARY[io.primary]);
  if (io.voiceFirst) add("voice");
  add("keyboard");
  add("gamepad");
  add("voice");
  return {
    tabs: tabs.length ? tabs : ["voice"],
    primary: io.primary ?? "keyboard",
    voiceFirst: !!io.voiceFirst,
    hands: !!io.hands,
    controllers: io.controllers !== false,
    keyboard: io.keyboard !== false,
    source: fromDevice ? "device" : "profile",
  };
}


/* ===== shared/hands.js ===== */
/**
 * Hand gesture control for the XR sessions.
 *
 * A gloved trade is the wrong audience for "press the grip button": the whole
 * point of these simulators is that the actions look like the real ones, and
 * on a headset with hand tracking the learner already has the right tool
 * attached to their wrist. This maps bare hands onto the same verbs the
 * controllers drive, so no station needs to know which one is in use.
 *
 * The gesture classifier is a pure function of joint positions, separate from
 * anything three.js or WebXR. That is deliberate: hand tracking cannot be
 * tested without hardware, so the part that decides what a hand is doing is
 * written to be driven by a table of coordinates and checked headlessly
 * (tools/check_hands.mjs). What is left unverified is the plumbing — that the
 * runtime hands us joints at all — which is the part a device has to confirm.
 */

const JOINTS = {
  wrist: "wrist",
  thumbTip: "thumb-tip",
  indexTip: "index-finger-tip",
  middleTip: "middle-finger-tip",
  ringTip: "ring-finger-tip",
  pinkyTip: "pinky-finger-tip",
  indexKnuckle: "index-finger-phalanx-proximal",
  middleKnuckle: "middle-finger-phalanx-proximal",
  ringKnuckle: "ring-finger-phalanx-proximal",
  pinkyKnuckle: "pinky-finger-phalanx-proximal",
};

// Metres. Hand tracking is noisy, so every threshold has a release value
// further out than its trigger — a pinch that flickers on and off at the
// boundary is worse than one that is slightly slow to let go.
const PINCH_ON = 0.022;
const PINCH_OFF = 0.035;
const CURL_ON = 0.065;      // fingertip to its own knuckle
const CURL_OFF = 0.085;

const dist = (a, b) => (a && b ? Math.hypot(a.x - b.x, a.y - b.y, a.z - b.z) : Infinity);

/**
 * What a hand is doing, from its joint positions.
 *
 * `joints` is a plain map of joint name to {x,y,z} — whatever the runtime
 * reports, in any one consistent space. `prev` is the previous result, so the
 * thresholds can have hysteresis; pass null on the first frame.
 *
 * Returns { pinch, grab, point, open, pinchGap, curled } where the four
 * booleans are mutually sensible: a fist is a grab and not a point, an index
 * finger out on its own is a point, and a pinch is read before either because
 * it is the most deliberate thing a hand can do.
 */
function classifyHandPose(joints, prev = null) {
  const j = (name) => joints?.[name] ?? null;
  const wrist = j(JOINTS.wrist);
  const pinchGap = dist(j(JOINTS.thumbTip), j(JOINTS.indexTip));

  const wasPinch = !!prev?.pinch;
  const pinch = Number.isFinite(pinchGap)
    ? (wasPinch ? pinchGap < PINCH_OFF : pinchGap < PINCH_ON)
    : false;

  // How many of the four fingers are folded to their own knuckle. Measuring
  // tip-to-knuckle rather than tip-to-palm keeps it independent of hand size.
  const fingers = [
    [JOINTS.indexTip, JOINTS.indexKnuckle],
    [JOINTS.middleTip, JOINTS.middleKnuckle],
    [JOINTS.ringTip, JOINTS.ringKnuckle],
    [JOINTS.pinkyTip, JOINTS.pinkyKnuckle],
  ].map(([tip, knuckle]) => dist(j(tip), j(knuckle)));
  const known = fingers.filter(Number.isFinite);
  if (!known.length) return { pinch: false, grab: false, point: false, open: false, pinchGap, curled: 0, tracked: false };

  const limit = prev?.grab ? CURL_OFF : CURL_ON;
  const curled = fingers.filter((d) => Number.isFinite(d) && d < limit).length;

  // The index finger decides between the two closed poses. Counting folded
  // fingers alone cannot: a pointing hand has three folded and so does a fist
  // with a loose pinky, and reading a point as a grab would start a drag every
  // time somebody indicated something across the bay.
  const indexCurled = Number.isFinite(fingers[0]) && fingers[0] < limit;
  const grab = !pinch && indexCurled && curled >= 3;
  // A point: index out, at least two of the others folded.
  const point = !pinch && !indexCurled && Number.isFinite(fingers[0]) && curled >= 2;
  const open = !pinch && !grab && curled === 0;

  return { pinch, grab, point, open, pinchGap, curled, tracked: !!wrist };
}

/** Read a three.js XRHand's joints into the plain map classifyHandPose wants. */
function readJoints(hand) {
  const out = {};
  const src = hand?.joints;
  if (!src) return out;
  for (const name of Object.values(JOINTS)) {
    const joint = src[name];
    if (joint?.position) out[name] = { x: joint.position.x, y: joint.position.y, z: joint.position.z };
  }
  return out;
}

/**
 * Wire hand tracking into an app.
 *
 * The app supplies the verbs it already implements for controllers, so this
 * adds an input device rather than a second interaction model:
 *
 *   onSelectStart(hand)  a pinch closed        — same as a trigger press
 *   onSelectEnd(hand)    the pinch opened      — same as a trigger release
 *   onGrabStart(hand)    a fist closed         — sustained hold, for drag and turn
 *   onGrabEnd(hand)
 *   onRoll(hand, delta)  wrist roll while grabbing, in radians — drives turn steps
 *   onPose(hand, pose)   every frame, for the pointer ray and the gesture hint
 *
 * Returns { hands, update(), dispose() }. update() is called from the render
 * loop; everything else is event-driven off three.js's own pinch events where
 * they exist, with the classifier as the fallback and the source of grab.
 */
function createHandInput(renderer, rig, handlers = {}) {
  const THREE = renderer?.xr?.constructor ? null : null;   // three is passed in via meshFactory
  const hands = [];
  const state = [];
  if (!renderer?.xr?.getHand) return { hands, update() {}, dispose() {}, supported: false };

  for (let i = 0; i < 2; i++) {
    const hand = renderer.xr.getHand(i);
    hand.userData.index = i;
    if (handlers.decorate) handlers.decorate(hand, i);
    rig.add(hand);
    hands.push(hand);
    state.push({ pose: null, grabbing: false, lastRoll: null, pinching: false });
  }

  function update() {
    for (let i = 0; i < hands.length; i++) {
      const hand = hands[i];
      const st = state[i];
      const joints = readJoints(hand);
      const pose = classifyHandPose(joints, st.pose);
      st.pose = pose;
      if (!pose.tracked) {
        if (st.grabbing) { st.grabbing = false; handlers.onGrabEnd?.(hand); }
        if (st.pinching) { st.pinching = false; handlers.onSelectEnd?.(hand); }
        continue;
      }
      handlers.onPose?.(hand, pose);

      if (pose.pinch && !st.pinching) { st.pinching = true; handlers.onSelectStart?.(hand); }
      else if (!pose.pinch && st.pinching) { st.pinching = false; handlers.onSelectEnd?.(hand); }

      if (pose.grab && !st.grabbing) {
        st.grabbing = true;
        st.lastRoll = hand.rotation?.z ?? 0;
        handlers.onGrabStart?.(hand);
      } else if (!pose.grab && st.grabbing) {
        st.grabbing = false;
        st.lastRoll = null;
        handlers.onGrabEnd?.(hand);
      } else if (pose.grab && st.grabbing && handlers.onRoll) {
        const roll = hand.rotation?.z ?? 0;
        if (st.lastRoll != null) {
          let d = roll - st.lastRoll;
          // Shortest way round, so passing through ±π does not read as a
          // whole turn of the valve.
          if (d > Math.PI) d -= Math.PI * 2;
          if (d < -Math.PI) d += Math.PI * 2;
          if (Math.abs(d) > 1e-4) handlers.onRoll(hand, d);
        }
        st.lastRoll = roll;
      }
    }
  }

  function dispose() {
    for (const hand of hands) hand.parent?.remove(hand);
    hands.length = 0;
  }

  void THREE;
  return { hands, update, dispose, supported: true, poseOf: (i) => state[i]?.pose ?? null };
}

/** What to tell the learner their hands can do, in the app's own hint rail. */
const HAND_HINTS = {
  pinch: "Pinch thumb and finger to select",
  grab: "Close your hand to grab and hold",
  roll: "Grab and turn your wrist to rotate",
  point: "Point to aim at something further away",
};


/* ===== shared/kit.js ===== */
// Shared procedural asset kit. Every prop in the simulator is built from these
// primitives at real-world scale in metres, so rooms stay consistent and no

  edge: "#426174", good: "#59C97B",

/**

 * verb for the HUD and one sentence for a first-time explainer. A room's own

const GESTURE_HINTS = {
  select: { verb: "CLICK", tip: "Click the highlighted control to select it." },
  sequence: { verb: "CLICK IN ORDER", tip: "Click each highlighted item, in the order the procedure calls for." },
  find: { verb: "SEARCH & CLICK", tip: "Look around and click whatever you find wrong — some objects are decoys." },
  gauge: { verb: "WATCH & CLICK", tip: "Watch the marker sweep the band, then click to commit while it's centred." },

  track: { verb: "HOLD TO CORRECT", tip: "Hold to raise the value, release to let it fall, and keep it inside the band." },
  turn: { verb: "CLICK & DRAG TO TURN", tip: "Click the control and drag in a circle around it, like turning a real wheel or handle." },
