/* ===== holodeck/js/training.js ===== */
/**
 * Generates a real, scored safety-training procedure from a template +
 * equipment noun — the room object shape this returns is played through
 * the actual Session engine from shared/game.js, the same one every
 * hand-authored SmartCiti.X and Trade Skills room uses. Nothing about the
 * scoring, hazards or combo system is a toy version; only the content
 * (which steps, which equipment) is generated rather than hand-authored.
 *
 * Three templates today (lockout & verify, confined-space entry,
 * pressure isolation & bleed-down), each applicable to any equipment
 * noun in the registry — proving the generator isn't one hardcoded
 * procedure, the same way three themes prove themes.js isn't
 * hardcoded to Alaska.
 */

const EQUIPMENT = [
  { id: "electrical-panel", noun: "electrical panel", keywords: ["electrical panel", "breaker panel", "panel", "circuit"], accent: "#4fd1ff", energy: "electrical", unit: "V", max: 480 },
  { id: "forklift", noun: "forklift", keywords: ["forklift", "lift truck"], accent: "#f2c14b", energy: "hydraulic", unit: "PSI", max: 2200 },
  { id: "boiler", noun: "boiler", keywords: ["boiler", "steam"], accent: "#f0645b", energy: "thermal", unit: "PSI", max: 150 },
  { id: "conveyor", noun: "conveyor line", keywords: ["conveyor", "belt line"], accent: "#ff8a3c", energy: "mechanical", unit: "V", max: 480 },
  { id: "compressor", noun: "air compressor", keywords: ["compressor", "air tank"], accent: "#59c97b", energy: "pneumatic", unit: "PSI", max: 175 },
  { id: "tank", noun: "storage tank", keywords: ["tank", "vessel", "silo"], accent: "#a079ff", energy: "atmospheric", unit: "% O₂", max: 21 },
];
const DEFAULT_EQUIPMENT_ID = "electrical-panel";

const TEMPLATES = [
  { id: "lockout", name: "Lockout & Verify", keywords: ["lockout", "loto", "tag out", "tagout", "isolate", "isolation", "de-energize", "deenergize"] },
  { id: "confined-space", name: "Confined Space Entry", keywords: ["confined space", "permit space", "vessel entry", "tank entry", "enclosed space"] },
  { id: "pressure-bleed", name: "Pressure Isolation & Bleed-Down", keywords: ["pressure release", "bleed down", "bleed-down", "bleed the line", "depressurize", "depressurization", "blind flange", "isolation blind"] },
];
const DEFAULT_TEMPLATE_ID = "lockout";

function findEquipment(id) {
  return EQUIPMENT.find((e) => e.id === id) ?? EQUIPMENT.find((e) => e.id === DEFAULT_EQUIPMENT_ID);
}
function findTemplate(id) {
  return TEMPLATES.find((t) => t.id === id) ?? TEMPLATES.find((t) => t.id === DEFAULT_TEMPLATE_ID);
}

const titleCase = (s) => s.replace(/\b\w/g, (c) => c.toUpperCase());

function lockoutSteps(eq) {
  return [
    {
      id: "workorder", kind: "select", target: "work-order",
      title: `Read the ${eq.noun} work order`,
      cue: `Confirm the task and the isolation point listed for this ${eq.noun}.`,
      why: `Every isolation starts with knowing exactly which ${eq.noun} and which energy source you are working on — not the one that looks similar next to it.`,
    },
    {
      id: "isolate", kind: "turn", target: "disconnect",
      title: `Isolate the ${eq.noun}`,
      cue: "Rotate the main disconnect to off.",
      why: `This is what actually removes ${eq.energy} energy from the ${eq.noun} — stopping it from running is not the same thing as isolating it.`,
      turn: { turns: 0.2, axis: "z", reverse: true, label: "MAIN DISCONNECT" },
    },
    {
      id: "lock", kind: "select", target: "hasp",
      title: "Apply your lock",
      cue: "Lock the disconnect with your own padlock.",
      why: "Your lock is what says nobody re-energizes it while you are still on the job — not a note, not a verbal heads-up.",
    },
    {
      id: "verify", kind: "gauge", target: "meter",
      title: "Verify zero energy",
      cue: `Meter the ${eq.noun} and commit only once it reads dead.`,
      why: "The disconnect being open is not proof by itself — a fault or a miswired feed can leave a path live. You confirm it the same way every time.",
      gauge: {
        label: `${eq.energy.toUpperCase()} — ${eq.unit}`, speed: 0.65, green: [0.0, 0.1],
        readout: (t) => `${Math.round(t * eq.max)} ${eq.unit}`,
        missNote: "Still reading live. Recheck the disconnect before the task starts.",
      },
    },
    {
      id: "task", kind: "select", target: "task-point",
      title: "Complete the task",
      cue: `Do the work on the ${eq.noun} now that it is proven dead.`,
      why: "With zero energy confirmed, the task itself is finally just a mechanical job, not a hazard.",
    },
    {
      id: "restore", kind: "select", target: "disconnect",
      title: "Remove your lock and restore",
      cue: "Remove your lock and close the disconnect once you are clear.",
      why: "Your lock, your call — nobody else takes it off, and you confirm you are the last one clear before it comes off.",
    },
  ];
}

function confinedSpaceSteps(eq) {
  return [
    {
      id: "permit", kind: "select", target: "permit-board",
      title: "Read the entry permit",
      cue: `Confirm the ${eq.noun} entry permit and the hazards listed on it.`,
      why: "A confined-space permit is what says this specific space was actually evaluated today, not assumed safe from the last entry.",
    },
    {
      id: "atmosphere", kind: "gauge", target: "meter",
      title: "Test the atmosphere",
      cue: `Meter the ${eq.noun} and commit only inside the safe range.`,
      why: "A confined space can turn oxygen-deficient or toxic with no smell and no colour to warn you first.",
      gauge: {
        label: "ATMOSPHERE — OXYGEN", speed: 0.6, green: [0.46, 0.6],
        readout: (t) => `${(15 + t * 12).toFixed(1)}%`,
        missNote: "Outside the safe range. Ventilate and re-test before anyone enters.",
      },
    },
    {
      id: "ventilate", kind: "select", target: "vent-fan",
      title: "Ventilate the space",
      cue: `Start forced-air ventilation on the ${eq.noun}.`,
      why: "Continuous ventilation is what keeps a tested-safe reading from drifting the moment someone is actually inside.",
    },
    {
      id: "attendant", kind: "select", target: "attendant",
      title: "Post an attendant",
      cue: "Confirm an attendant is posted at the entry point before anyone goes in.",
      why: "The attendant outside is the only line of communication and the one who triggers rescue if something goes wrong inside.",
    },
    {
      id: "task", kind: "select", target: "task-point",
      title: "Complete the task",
      cue: `Do the work inside the ${eq.noun}.`,
      why: "The task only starts once the atmosphere, the ventilation and the attendant are all already in place — not run in parallel with them.",
    },
    {
      id: "exit", kind: "select", target: "permit-board",
      title: "Confirm exit and close the permit",
      cue: "Confirm everyone is out, then close the permit.",
      why: "Closing the permit is what tells the next crew this space is no longer an open entry.",
    },
  ];
}

function pressureBleedSteps(eq) {
  return [
    {
      id: "workorder", kind: "select", target: "work-order",
      title: `Read the ${eq.noun} work order`,
      cue: `Confirm the task and the isolation valve listed for this ${eq.noun}.`,
      why: `Every isolation starts with knowing exactly which valve controls this ${eq.noun} — not the one that looks similar next to it.`,
    },
    {
      id: "isolate", kind: "turn", target: "disconnect",
      title: `Close the ${eq.noun} isolation valve`,
      cue: "Rotate the upstream isolation valve to closed.",
      why: `Closing the valve is what actually stops ${eq.energy} pressure from feeding the ${eq.noun} — the gauge dropping later is the proof, not this step itself.`,
      turn: { turns: 0.2, axis: "z", reverse: true, label: "ISOLATION VALVE" },
    },
    {
      id: "bleed", kind: "hold", target: "bleed-valve", seconds: 4,
      title: "Bleed the trapped pressure",
      cue: "Hold the bleed valve open for a full 4 seconds.",
      why: `Closing the isolation valve traps whatever ${eq.energy} pressure was already in the line — the bleed is what actually gets it to zero.`,
      holdBreakNote: "Released early — residual pressure is still trapped in the line. Hold the full duration.",
    },
    {
      id: "verify", kind: "gauge", target: "meter",
      title: "Verify zero pressure",
      cue: `Meter the ${eq.noun} and commit only once it reads zero.`,
      why: "A closed valve and a bled line are not proof by themselves — a stuck check valve can leave a trapped pocket. You confirm it the same way every time.",
      gauge: {
        label: `${eq.energy.toUpperCase()} — ${eq.unit}`, speed: 0.65, green: [0.0, 0.08],
        readout: (t) => `${Math.round(t * eq.max)} ${eq.unit}`,
        missNote: "Still reading pressure. Recheck the isolation valve and bleed again before breaking the line.",
      },
    },
    {
      id: "blind", kind: "select", target: "flange",
      title: "Install the isolation blind",
      cue: `Fit the blind flange before opening the ${eq.noun} line.`,
      why: "A valve can leak through or be reopened by someone else — a blind is the only barrier that physically cannot pass pressure.",
    },
    {
      id: "task", kind: "select", target: "task-point",
      title: "Complete the task",
      cue: `Do the work on the ${eq.noun} now that the line is blinded.`,
      why: "With a physical blind in place, the task itself is finally just a mechanical job, not a pressure hazard.",
    },
    {
      id: "restore", kind: "select", target: "flange",
      title: "Remove the blind and restore",
      cue: "Remove the blind and reopen the isolation valve once you are clear.",
      why: "The blind comes out only after the task is done and everyone is clear — the same order every time, never before.",
    },
  ];
}

const HAZARDS_BY_TEMPLATE = {
  "confined-space": (eq) => ({
    "vent-fan-off": `Entering with ventilation off risks the atmosphere drifting the moment anyone is actually inside the ${eq.noun}.`,
    "no-attendant": `No attendant posted — nobody outside would know if someone inside the ${eq.noun} needed help.`,
  }),
  "pressure-bleed": (eq) => ({
    "flange-loose": `That blind isn't seated. A loose blind on a ${eq.noun} line can blow through the moment pressure returns.`,
    "valve-open": `The isolation valve is open. Working on the ${eq.noun} line with the valve open defeats the point of blinding it.`,
  }),
  lockout: (eq) => ({
    "disconnect-hot": `That disconnect is still live. Touching a live ${eq.noun} circuit is exactly what lockout exists to prevent.`,
    "no-lock": `Working on the ${eq.noun} without your own lock means anyone could re-energize it while you are still on it.`,
  }),
};

const STEPS_BY_TEMPLATE = {
  "confined-space": confinedSpaceSteps,
  "pressure-bleed": pressureBleedSteps,
  lockout: lockoutSteps,
};

function buildTrainingRoom({ templateId, equipmentId }) {
  const eq = findEquipment(equipmentId);
  const tpl = findTemplate(templateId);
  const steps = (STEPS_BY_TEMPLATE[tpl.id] ?? lockoutSteps)(eq);
  const hazards = (HAZARDS_BY_TEMPLATE[tpl.id] ?? HAZARDS_BY_TEMPLATE.lockout)(eq);

  return {
    id: `gen-${tpl.id}-${eq.id}`,
    title: `${titleCase(eq.noun)} — ${tpl.name}`,
    tagline: `A generated ${tpl.name.toLowerCase()} procedure for a ${eq.noun}.`,
    accentCss: eq.accent,
    parSeconds: steps.length * 24,
    hazards,
    steps,
    templateId: tpl.id,
    equipment: eq,
  };
}

      {
        "title": "The data-integrity case",
        "body": "Between 2003 and 2014 the Navy's radiological remediation contractor, Tetra Tech EC, was required to survey soil and buildings and remediate excess radiation so parcels could be transferred to the city. Federal False Claims Act litigation alleged that employees and subcontractors substituted clean soil for potentially contaminated samples and fabricated radiological readings the Navy relied on. A Navy review found roughly 48% of the contractor's radiological data suspect or showing signs of manipulation; an EPA letter raised concerns about a far larger share in parts of the site. In August 2026 a federal judge approved a $57 million settlement of the government's False Claims Act claims; the company did not admit liability, and the settlement does not resolve a separate suit by homeowners.",
        "source": {
          "label": "U.S. Department of Justice press release (2026)",
          "url": "https://www.justice.gov/opa/pr/tetra-tech-ec-inc-agrees-pay-57m-settle-false-claims-act-allegations-falsifying-soil-test"
        }
      },
      {
        "title": "The community and the litigation",
        "body": "Bayview Hunters Point is a residential neighborhood next to the shipyard fence. Greenaction for Health and Environmental Justice filed a federal lawsuit against the Navy in 2024 alleging the cleanup is not protective of human health and the environment; a court hearing on it was held in February 2026, and in June 2026 Greenaction and the Marie Harrison Community Foundation issued a public call to action and demands. Marie Harrison (1948–2019) was a Greenaction organizer, a Bayview resident for decades and, as a young woman, a worker at the shipyard; residents later installed neighborhood air monitors in her memory. That community air-monitoring effort, run by Greenaction with the Marie Harrison Community Foundation, is the independent neighborhood air record this station points you to — there is no on-site monitoring program of ours here.",
        "source": {
          "label": "Greenaction — Bayview Hunters Point",
          "url": "https://greenaction.org/bayview-hunters-point/"
        },
        "source2": {
          "label": "Greenaction — in memory of Marie Harrison",
          "url": "https://greenaction.org/2020/05/06/in-honor-and-memory-of-marie-harrison-1-30-1948-5-5-2019/"
        }
      },
      {
        "title": "Who does the work",
        "body": "Environmental monitoring and remediation on a site like this is union trade work with real training gates: hazmat and environmental laborers (LIUNA) under OSHA HAZWOPER — a 40-hour course, three days of supervised field time and an annual 8-hour refresher (29 CFR 1910.120(e)); operating engineers (IUOE) on the excavators and soil-handling equipment; Teamsters hauling regulated soil under DOT hazardous-materials rules; radiation control technicians on survey and clearance; and industrial hygienists and environmental sampling technicians keeping chain of custody on every sample. The lesson of this site is that the last item is not paperwork — independent split samples, chain of custody and third-party verification are the only reason anyone can trust a clearance number.",
        "source": {

      {
        "title": "The organisation",
        "body": "The Marie Harrison Community Foundation, Inc. — known as \"Can We Live?\" — is a community-based 501(c)(3) in Bayview Hunters Point, San Francisco, founded and led by Executive Director Arieann Harrison in honour of her mother. Its programmes include the Community Pollution Patrol Network, the Hunters Point Biomonitoring Initiative, the Marie Harrison Community Foundation Academic Scholarship, Solutions for Women, the YES Camp youth summer camp-internship, the BaySpark youth climate event and the Bayview Hunters Point Air Monitor Project. Arieann Harrison serves on the Bay Area Air Quality Management District's Community Advisory Council.",

          "url": "https://www.canwelive.org/"
        },
        "source2": {
          "label": "BAAQMD Community Advisory Council — Arieann Harrison",
          "url": "https://www.baaqmd.gov/en/about-the-air-district/community-advisory-council/harrison"
        }
      },
      {
        "title": "Marie Harrison, 1948–2019",
        "body": "Marie Harrison (30 January 1948 – 5 May 2019) was called the mother of the environmental justice movement in Bayview Hunters Point. As a young woman she worked at the Hunters Point Shipyard. She lived in Hunters View beside the PG&E Hunters Point power plant, and the community campaign she was part of saw the plant shut down in 2006 and its stacks imploded on 18 June 2008. She wrote a column for the San Francisco Bay View, then worked full time for Greenaction for Health and Environmental Justice, staying on its board when her health no longer allowed her to work. A non-smoker, she lived her last years with lung damage that kept her on oxygen, and she kept testifying at hearings and protests until the end. Greenaction and her family created a youth environmental justice scholarship fund in her name.",
        "source": {
          "label": "San Francisco Bay View — Marie Harrison, mother of the movement (2019)",
          "url": "https://sfbayview.com/2019/05/marie-harrison-mother-of-the-movement-for-environmental-justice/"
        },
        "source2": {
          "label": "Greenaction — in honor and memory of Marie Harrison",
          "url": "https://greenaction.org/2020/05/06/in-honor-and-memory-of-marie-harrison-1-30-1948-5-5-2019/"
        }
      },
      {
        "title": "The air the neighbourhood measures itself",
        "body": "The Marie Harrison Bayview Air Monitoring Project, named for her after her death from lung disease, placed ten air monitors in and around Bayview Hunters Point so that residents have their own record of what they breathe. The foundation works with residents to screen them for toxins through its biomonitoring initiative and offers scholarships to students who study environmental justice. In June 2026 the foundation and Greenaction issued a joint community call to action and demands on the shipyard cleanup.",
        "source": {
          "label": "Inside Climate News — advocates have taken air monitoring into their own hands (2021)",
          "url": "https://insideclimatenews.org/news/27112021/air-pollution-bayview-hunters-point-san-francisco/"
        },
        "source2": {
          "label": "Greenaction — June 2026 community call to action and demands",
          "url": "https://greenaction.org/2026/06/06/june-2026-bayview-hunters-point-community-call-to-action-and-demands-issued-by-greenaction-and-the-marie-harrison-community-foundation-inc/"
        }
      },
      {
        "title": "The site record",
        "body": "Hunters Point Naval Shipyard has been an EPA Superfund site since 1989, with the Navy as lead agency under EPA and California oversight. Federal False Claims Act litigation over falsified radiological soil data by the Navy's contractor was settled for $57 million in 2026 without resolving the residents' own federal suit, filed by Greenaction in 2024, over whether the cleanup protects health. The Hunters Point Briefing station carries that record in full; this station is about the people beside the fence.",
        "source": {
          "label": "EPA Superfund site profile",
          "url": "https://cumulis.epa.gov/supercpad/cursites/csitinfo.cfm?id=0902722"
        },
        "source2": {
          "label": "Greenaction — Bayview Hunters Point",
          "url": "https://greenaction.org/bayview-hunters-point/"
        }
      },
      {
        "title": "What this edition is, and is not",
        "body": "The twenty-five stations that follow train the skills a community science programme and the trades beside it actually use: installing and checking air sensors, running a pollution patrol, supporting biomonitoring with consent and chain of custody, fence-line dust and haul-route observation, split soil and sediment samples, radiological literacy, the training gate into cleanup work, and turning data into public testimony. Every one is sited generically. This edition is a training aid built to be offered to the foundation and its partners; it is not the foundation's own programme and does not speak for it. The foundation's CLEAR page could not be retrieved when this station was written, so its own description of that work belongs here, in its own words, before the edition is used with learners.",

/* ===== holodeck/js/prompt-parser.js ===== */
/**
 * Turns a spoken or typed prompt into a scene request: { gameType, themeId }.
 *
 * There is no live model behind this yet — no working API endpoint or
 * credentials have been wired into this project (the same reason the
 * Reactor/Orbis-Stable integrations elsewhere in this repo are stubs, not
 * live calls), and this is a public, static-hosted, client-only app with
 * nowhere safe to hold a real API key even if one existed. `localInterpreter`
 * is a small keyword-matching stand-in that actually runs and actually
 * works for the vocabulary it knows.
 *
 * The seam is real, though: `interpretPrompt` takes an injectable
 * `interpreter`, exactly like createOrbisClient's `transport` in
 * shared/orbis-stable.js. Swapping in a real model later — one that reads
 * arbitrary prompts and returns a richer scene description — means passing
 * a different `interpreter` here, not rewriting the app around it. Whatever
 * a real interpreter returns must stay data (a plain object describing what
 * to build), never code to execute — the renderer in minigolf.js is the
 * only thing that turns a scene request into 3D content.
 */







// The generators that actually exist today. Listed explicitly (rather than
// inferred from whatever the parser matches) so the UI can be honest about
// what "speaking a simulation into existence" currently covers.
const SUPPORTED_GAME_TYPES = ["minigolf", "training", "lesson", "incident"];

// A near-miss report is recognised before everything else, because it is the
// one prompt that is a piece of prose rather than a request. "Last week on the
// trench box a spoil pile started moving while the box was going in" names a
// station and would otherwise load that station as an ordinary visit, losing
// the whole point of the report. parseIncident() is what decides whether the
// text is really a report — the words below only say it is worth asking.
const INCIDENT_WORDS = ["near miss", "near-miss", "nearmiss", "close call", "incident",
  "last week", "last month", "yesterday", "last shift", "toolbox talk", "tailgate",
  "what happened", "report says", "reported", "wrote up", "write-up", "accident",
  "almost", "nearly"];

// Asking to run a station as one member of a crew. Only meaningful alongside a
// named station, the same way an assessment request is — "as the signaller" on
// its own has no procedure to be a signaller on. See shared/crew.js, which
// refuses to split a station whose second person has no duties.
const CREW_WORDS = Object.values(ROLES)
  .filter((r) => r.id !== "solo")
  .flatMap((r) => {
    const n = r.name.toLowerCase();
    const short = n.split(" / ")[0];
    return [`as the ${n}`, `as the ${short}`, `as a ${short}`, `${short} role`, `i am the ${short}`, `my role is ${short}`];
  });

// A lesson is a programme of real stations rather than a scene — see
// shared/lessons.js. It is recognised before anything else, because "put me a
// lockout block together for the apprentices" names a station vocabulary the
// other generators would happily match one word of and then build a single
// generic drill from.
const LESSON_WORDS = ["lesson", "programme", "program", "curriculum", "block",
  "refresher", "course", "syllabus", "training plan", "recert", "apprentices",
  "journeymen", "put together", "build me a", "onboarding"];

// The roster a lesson is composed over: every enterable station both apps
// ship, with the fields shared/lessons.js matches on.
const LESSON_ROSTER = SIMS_META.filter((s) => !s.flat).map((s) => ({
  app: "smartcity", id: s.id, name: s.name, category: s.category,
  certification: s.certification ?? "", tagline: s.tagline ?? "",
  stepCount: s.stepCount ?? 0, parSeconds: s.parSeconds ?? 240,
  interruptCount: s.interruptCount ?? 0,
}));

// Naming one of these directly loads the real SmartCiti.X station instead of
// building a generic Mad-Libs procedure — see app.js's loadRealSim(). The
// roster is SmartCiti.X's own generated metadata, so a station added there is
// reachable here by name the moment it exists; every interaction kind a
// SmartCiti.X step can use (select/sequence/find/gauge/hold/turn/drag) has a
// Holodeck gesture behind it. Flat briefing stations (no 3D scene) are the
// one exclusion — they render as a dossier card SmartCiti.X owns.
const REAL_SIMS = SIMS_META.filter((s) => !s.flat).map((s) => ({ id: s.id, name: s.name }));
// Longest name first so "dock crane" can't be shadow-matched by a shorter
// name that happens to be a substring of a longer phrase.
const REAL_SIMS_BY_LENGTH = [...REAL_SIMS].sort((a, b) => b.name.length - a.name.length);

const GAME_KEYWORDS = {
  // Checked before minigolf: a phrase like "confined space entry training"
  // never mentions golf, but "training" alone is unambiguous, so order only
  // matters for a prompt that could plausibly say both.
  training: ["training", "safety simulation", "simulation training", "procedure", ...TEMPLATES.flatMap((t) => t.keywords)],
  minigolf: ["mini golf", "minigolf", "mini-golf", "golf course", "putt putt", "putt-putt", "golf"],
};

// Asking to be tested on a station is different from asking to visit it: the
// same procedure, but with the hint rail off, a tighter clock and the alarms
// somewhere the learner has not met them. See shared/variants.js.
const VARIANT_WORDS = {
  pressure: ["under pressure", "hard mode", "make it hard", "toughest"],
  assessment: ["assess", "assessment", "test me", "exam", "certify", "certification run", "no hints", "sign me off", "check me out"],
  practice: ["practice", "practise", "try again", "retake", "another go", "different", "variant", "mix it up"],
};

const BLANK = {
  lesson: null, realSimId: null, matchedRealSim: false, variantLevel: null, matchedVariant: false,
  crewRole: null, matchedCrew: false, incident: null, matchedIncident: false,
  themeId: DEFAULT_THEME_ID, matchedTheme: false, templateId: DEFAULT_TEMPLATE_ID, matchedTemplate: false,
  equipmentId: DEFAULT_EQUIPMENT_ID, matchedEquipment: false,
};

function localInterpreter(text) {
  const lower = String(text ?? "").toLowerCase();

  // An incident report first. parseIncident() returns null unless the text
  // actually names a station, so a prompt that merely says "almost" falls
  // through to everything below rather than producing a drill about nothing.
  if (INCIDENT_WORDS.some((w) => lower.includes(w))) {
    const incident = parseIncident(text, LESSON_ROSTER);
    if (incident) {
      return { ...BLANK, gameType: "incident", matchedGame: true, incident, matchedIncident: true,
        realSimId: incident.stationId, matchedRealSim: true, raw: text };
    }
  }

  // A programme request first. composeLesson returns null when the sentence
  // names nothing the roster can satisfy, so a prompt that merely contains
  // "course" — "a golf course" — falls through to the scene generators
  // instead of producing an empty syllabus.
  if (LESSON_WORDS.some((w) => lower.includes(w))) {
    const lesson = composeLesson(text, LESSON_ROSTER);
    if (lesson) {
      return { ...BLANK, gameType: "lesson", matchedGame: true, lesson, raw: text };
    }
  }

  // Naming a real station beats generic keyword matching — it's the more
  // specific, more confident signal, so it decides gameType outright.
  const realSim = REAL_SIMS_BY_LENGTH.find((s) => lower.includes(s.name.toLowerCase()));
  const realSimId = realSim?.id ?? null;

  // "Test me on the trench box" is that station, run as an assessment. Only
  // meaningful alongside a named station — "test me" on its own has nothing
  // to be an assessment of.
  let variantLevel = null;
  if (realSimId) {
    for (const [level, words] of Object.entries(VARIANT_WORDS)) {
      if (words.some((w) => lower.includes(w))) { variantLevel = level; break; }
    }
  }

  // "Run the crane yard as the signaller" is that station seen from one post.
  // Like an assessment, it needs a station to be a role on.
  let crewRole = null;
  if (realSimId) {
    const hit = CREW_WORDS.find((w) => lower.includes(w));
    if (hit) {
      const said = hit.replace(/^(as the |as a |i am the |my role is )/, "").replace(/ role$/, "");
      crewRole = Object.values(ROLES).find((r) => r.id !== "solo"
        && (r.id === said || r.name.toLowerCase() === said || r.name.toLowerCase().split(" / ")[0] === said))?.id ?? null;
    }
  }

  let gameType = realSimId ? "training" : "minigolf"; // the fallback if nothing at all matches
  let matchedGame = !!realSimId;
  if (!realSimId) {
    for (const [type, words] of Object.entries(GAME_KEYWORDS)) {
      if (words.some((w) => lower.includes(w))) { gameType = type; matchedGame = true; break; }
    }
  }

  let themeId = DEFAULT_THEME_ID;
  let matchedTheme = false;
  for (const theme of THEMES) {
    if (theme.keywords.some((w) => lower.includes(w))) { themeId = theme.id; matchedTheme = true; break; }
  }

  let templateId = DEFAULT_TEMPLATE_ID;
  let matchedTemplate = false;
  for (const tpl of TEMPLATES) {
    if (tpl.keywords.some((w) => lower.includes(w))) { templateId = tpl.id; matchedTemplate = true; break; }
  }

  let equipmentId = DEFAULT_EQUIPMENT_ID;
  let matchedEquipment = false;
  for (const eq of EQUIPMENT) {
    if (eq.keywords.some((w) => lower.includes(w))) { equipmentId = eq.id; matchedEquipment = true; break; }
  }

  return {
    gameType, matchedGame,
    realSimId, matchedRealSim: !!realSimId,
    variantLevel, matchedVariant: !!variantLevel,
    crewRole, matchedCrew: !!crewRole,
    incident: null, matchedIncident: false,
    themeId, matchedTheme,
    templateId, matchedTemplate,
    equipmentId, matchedEquipment,
    raw: text,
  };
}

async function interpretPrompt(text, { interpreter = localInterpreter } = {}) {
  return interpreter(text);
}


/* ===== holodeck/js/minigolf.js ===== */
/**
 * Mini-golf course data and ball physics — pure data and arithmetic, no
 * THREE dependency, so this can be unit-tested with plain Node (see
 * tools/check_holodeck.mjs) the same way the physics-free parts of the
 * union-trade sims are checked without a browser.
 *
 * The 3D rendering of a hole (turning this data into meshes, with theme
 * colors and props) lives in app.js, which already imports THREE — keeping
 * that split is what makes the physics testable at all.
 */

// A local, uniquely-named clamp rather than importing shared/kit.js's: that
// module's own top-level import of THREE (from a remote URL) would make
// this file unloadable under plain Node, breaking tools/check_holodeck.mjs's
// ability to test this physics code without a browser.
const clampNum = (v, lo, hi) => Math.max(lo, Math.min(hi, v));

const BALL_RADIUS = 0.055;
// A fixed deceleration (m/s^2), not a percentage-per-frame decay: with a
// percentage decay a fast putt coasts for many seconds approaching zero
// asymptotically, which felt broken in practice (a browser test caught a
// ball still "Rolling…" 1.5s after a routine putt). Linear friction stops
// in bounded time — roughly v0/FRICTION_DECEL seconds — and covers a
// bounded distance — roughly v0^2/(2*FRICTION_DECEL) — which is what lets
// MAX_PUTT_SPEED be tuned against the longest hole below.
const FRICTION_DECEL = 2.4;
const MAX_PUTT_SPEED = 6.5;
const MOVING_EPS = 0.02;
const SINK_SPEED_LIMIT = 1.4;
const WALL_RESTITUTION = 0.6;

// Three hole shapes, theme-agnostic — theme only changes how a hole is
// decorated (props, colors), never its geometry. Walls are axis-aligned
// rectangles in the hole's own local space: {x, z} is the wall's centre,
// {w, d} its full width (along local x) and depth (along local z).
const HOLE_LAYOUTS = [
  {
    id: "straight",
    name: "The Straightaway",
    par: 2,
    width: 2.4,
    length: 6.5,
    tee: { x: 0, z: 0.6 },
    cup: { x: 0, z: 5.9, r: 0.16 },
    walls: [],
  },
  {
    id: "dogleg-left",
    name: "The Bend",
    par: 3,
    width: 3.2,
    length: 7.5,
    tee: { x: -0.9, z: 0.6 },
    cup: { x: 1.1, z: 6.9, r: 0.16 },
    walls: [
      { x: 0.4, z: 3.6, w: 1.8, d: 0.3 },
    ],
  },
  {
    id: "gauntlet",
    name: "The Gauntlet",
    par: 4,
    width: 2.8,
    length: 9.0,
    tee: { x: 0, z: 0.6 },
    cup: { x: 0, z: 8.4, r: 0.16 },
    walls: [
      { x: -0.65, z: 3.0, w: 0.3, d: 1.6 },
      { x: 0.65, z: 5.6, w: 0.3, d: 1.6 },
    ],
  },
];

function buildCourse(theme, holeIds = HOLE_LAYOUTS.map((h) => h.id)) {
  return {
    themeId: theme.id,
    holes: HOLE_LAYOUTS.filter((h) => holeIds.includes(h.id)),
  };
}

function createBall(hole) {
  return { x: hole.tee.x, z: hole.tee.z, vx: 0, vz: 0, r: BALL_RADIUS, sunk: false, strokes: 0 };
}

/** Launch the ball. `dirX`/`dirZ` need not be normalized; `power` is 0..1. */
function putt(ball, dirX, dirZ, power) {
  const len = Math.hypot(dirX, dirZ) || 1;
  const speed = clampNum(power, 0, 1) * MAX_PUTT_SPEED;
  ball.vx = (dirX / len) * speed;
  ball.vz = (dirZ / len) * speed;
  ball.strokes += 1;
}

function collideWithWall(ball, wall) {
  const halfW = wall.w / 2, halfD = wall.d / 2;
  const closestX = clampNum(ball.x, wall.x - halfW, wall.x + halfW);
  const closestZ = clampNum(ball.z, wall.z - halfD, wall.z + halfD);
  const dx = ball.x - closestX, dz = ball.z - closestZ;
  const distSq = dx * dx + dz * dz;
  if (distSq >= ball.r * ball.r) return;
  const dist = Math.sqrt(distSq) || 0.0001;
  const nx = dx / dist, nz = dz / dist;
  const overlap = ball.r - dist;
  ball.x += nx * overlap;
  ball.z += nz * overlap;
  const vn = ball.vx * nx + ball.vz * nz;
  if (vn < 0) {
    ball.vx -= (1 + WALL_RESTITUTION) * vn * nx;
    ball.vz -= (1 + WALL_RESTITUTION) * vn * nz;
  }
}

/** Advance the ball by `dt` seconds. Returns { moving, sunk }. */
function stepBall(ball, hole, dt) {
  if (ball.sunk) return { moving: false, sunk: true };

  const speed0 = Math.hypot(ball.vx, ball.vz);
  if (speed0 > 0) {
    const speed1 = Math.max(0, speed0 - FRICTION_DECEL * dt);
    const scale = speed1 / speed0;
    ball.vx *= scale;
    ball.vz *= scale;
  }
  if (Math.hypot(ball.vx, ball.vz) < MOVING_EPS) { ball.vx = 0; ball.vz = 0; }

  ball.x += ball.vx * dt;
  ball.z += ball.vz * dt;

  const halfW = hole.width / 2;
  if (ball.x < -halfW + ball.r) { ball.x = -halfW + ball.r; ball.vx = Math.abs(ball.vx) * WALL_RESTITUTION; }
  if (ball.x > halfW - ball.r) { ball.x = halfW - ball.r; ball.vx = -Math.abs(ball.vx) * WALL_RESTITUTION; }
  if (ball.z < ball.r) { ball.z = ball.r; ball.vz = Math.abs(ball.vz) * WALL_RESTITUTION; }
  if (ball.z > hole.length - ball.r) { ball.z = hole.length - ball.r; ball.vz = -Math.abs(ball.vz) * WALL_RESTITUTION; }

  for (const wall of hole.walls) collideWithWall(ball, wall);

  const dx = ball.x - hole.cup.x, dz = ball.z - hole.cup.z;
  const dist = Math.hypot(dx, dz);
  const speed = Math.hypot(ball.vx, ball.vz);
  if (dist < hole.cup.r && speed < SINK_SPEED_LIMIT) {
    ball.sunk = true;
    ball.vx = 0; ball.vz = 0;
    return { moving: false, sunk: true };
  }
  return { moving: speed > MOVING_EPS, sunk: false };
}


/* ===== holodeck/js/store.js ===== */
/**
 * A minimal reactive store — identical in shape to smartcity's store.js.
 * Duplicated rather than shared because each WebXR app is bundled
 * independently into one self-contained file; this file is small enough
 * that copying it is simpler than adding a cross-app shared module.
 */
function createStore(initial) {
  let state = initial;
  const subs = new Set();

  function get() {
    return state;
  }

  function set(patch) {
    state = typeof patch === "function" ? patch(state) : { ...state, ...patch };
    for (const fn of subs) fn(state);
  }

  function patch(key, partial) {
    const prev = state[key];
    const delta = typeof partial === "function" ? partial(prev) : partial;
    set({ [key]: { ...prev, ...delta } });
  }

  function subscribe(fn) {
    subs.add(fn);
    return () => subs.delete(fn);
  }

  return { get, set, patch, subscribe };
}


/* ===== holodeck/js/react-ui.js ===== */
/**
 * Holodeck's 2D UI chrome — same architecture as SmartCiti.X's react-ui.js:
 * React owns the HUD/overlays, app.js owns the Three.js scene and physics
 * and only writes into the store.
 */


const h = React.createElement;
const { Fragment, useSyncExternalStore } = React;

/** "a Technician" vs "an Automation Lead" — rank names are real sim content
 * (e.g. "Automation Lead", "Elevator Constructor"), not picked to avoid
 * vowels, so the article has to actually check. */
const article = (word) => (/^[aeiou]/i.test(word) ? "an" : "a");

function mountUI(store, actions) {
  function useSlice(key) {
    return useSyncExternalStore(store.subscribe, () => store.get()[key]);
  }

  function HoleChip() {
    const hud = useSlice("hud");
    if (!hud.visible) return null;
    if (hud.mode === "training") {
      return h("div", { className: "chip", id: "hud-hole-chip" },
        h("div", { className: "eyebrow" }, "Training"),
        h("div", { id: "hud-hole-name" }, hud.step),
        h("div", { id: "hud-hole-sub" }, hud.cue),
        h("div", { id: "hud-gesture", hidden: !hud.gestureVisible }, hud.gestureVerb));
    }
    return h("div", { className: "chip", id: "hud-hole-chip" },
      h("div", { className: "eyebrow" }, "Hole"),
      h("div", { id: "hud-hole-name" }, hud.holeName),
      h("div", { id: "hud-hole-sub" }, hud.holeSub));
  }

  function ScoreChip() {
    const hud = useSlice("hud");
    if (!hud.visible) return null;
    if (hud.mode === "training") {
      return h("div", { className: "chip", id: "hud-score-chip" },
        h("div", { className: "eyebrow" }, "Score"),
        h("div", { id: "hud-strokes" }, hud.score),
        h("div", { id: "hud-par" }, hud.comboText));
    }
    return h("div", { className: "chip", id: "hud-score-chip" },
      h("div", { className: "eyebrow" }, "Strokes"),
      h("div", { id: "hud-strokes" }, hud.strokes),
      h("div", { id: "hud-par" }, `PAR ${hud.par}`));
  }

  function Rail() {
    const hud = useSlice("hud");
    if (!hud.visible) return null;
    return h("div", { id: "hud-rail", "data-state": hud.railState },
      h("div", { id: "hud-feedback", "aria-live": "polite", dangerouslySetInnerHTML: { __html: hud.feedback } }),

// Progress is the profile shared with SmartCiti.X and Trade Skills. It has
// to be loaded before any Session finishes: Session.finish() calls
// Progress.record()/submitScore(), which save the in-memory profile — and
// without this load that in-memory profile was the empty default, so one
// finished Holodeck run overwrote the learner's XP, badges and leaderboards
// from the other two apps with nothing.
Progress.load();
Identity.load();
if (Identity.tag()) Progress.setPlayerName(Identity.tag());
Identity.listen(() => { if (Identity.tag()) Progress.setPlayerName(Identity.tag()); });
// Live LRS delivery, configured by launch URL or the embedding page; a
// queue left by an earlier tab is retried on load.
Lrs.load();
Lrs.listen(() => Identity.current?.homePage, () => Lrs.flush());
