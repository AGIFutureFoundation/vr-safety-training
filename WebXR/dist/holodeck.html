/** A role must own this much of the procedure for the split to mean anything. */
const MIN_ROLE_STEPS = 2;

function pairOf(id) { return PAIRS.find((p) => p.id === id) ?? null; }

/** SmartCiti.X stations carry `name`; Trade Skills rooms only carry `title`. */
function stationName(station) { return station?.name ?? station?.title ?? station?.id ?? "station"; }

/** Every interactable id a station's steps and interruptions can reach for. */
function interactableIds(station) {
  const ids = new Set();
  for (const step of station.steps ?? []) {
    if (step.target) ids.add(step.target);
    for (const t of step.targets ?? []) ids.add(t);
  }
  for (const it of station.interrupts ?? []) if (it.target) ids.add(it.target);
  return [...ids];
}

/**
 * The two halves of a step's text, kept apart on purpose.
 *
 * `action` is what the learner does — the title, the cue, the ids of the
 * things they touch. `why` is the reason it is right, and it routinely names
 * the other role ("the attendant never leaves the hole") in a step that role
 * does not perform. Scoring the two together is how a splitter talks itself
 * into a confident wrong answer, so `why` is only ever consulted when the
 * action text said nothing at all.
 */
function stepText(step) {
  const ids = [step.target, ...(step.targets ?? [])].filter(Boolean);
  const names = Object.values(step.itemNames ?? {});
  return {
    ids,
    action: [step.id, ...ids, ...names, step.title ?? "", step.cue ?? ""].join(" ").toLowerCase(),
    why: (step.why ?? "").toLowerCase(),
  };
}

function score(signals, text) {
  let n = 0;
  for (const re of signals) if (re.test(text)) n += 1;
  return n;
}

/**
 * Attribute one step to one of a pair's two roles, or to neither.
 *
 * Three rules, in order, and each one refuses rather than guesses:
 *
 *  1. You cannot be the person you are reaching for. A step whose target is
 *     the attendant, the spotter or the signal person is performed by the
 *     other role — that is what makes it a coordination step at all.
 *  2. Otherwise the action text decides, and only when one role's evidence is
 *     the only evidence. A step with signals on both sides is a step the
 *     author wrote for two people at once; splitting it either way invents a
 *     division of duties the station never stated.
 *  3. A step whose action text says nothing falls back to its reason, under
 *     the same one-sided rule.
 */
function attribute(step, pair) {
  const [a, b] = pair.roles;
  const text = stepText(step);

  const reaches = (roleId) => {
    const posts = ROLES[roleId].posts;
    return !!posts && text.ids.some((id) => posts.test(id));
  };
  if (reaches(a) && !reaches(b)) return { role: b, by: "post" };
  if (reaches(b) && !reaches(a)) return { role: a, by: "post" };
  if (reaches(a) && reaches(b)) return { role: null, by: "both-posts" };

  for (const [field, by] of [["action", "action"], ["why", "why"]]) {
    const sa = score(pair.signals[a], text[field]);
    const sb = score(pair.signals[b], text[field]);
    if (sa > 0 && sb === 0) return { role: a, by };
    if (sb > 0 && sa === 0) return { role: b, by };
    if (sa > 0 && sb > 0) return { role: null, by: "contested" };
  }
  return { role: null, by: "silent" };
}

function declined(station, reason, unassigned = []) {
  const assignments = {};
  for (const step of station.steps ?? []) assignments[step.id] = "solo";
  return { split: false, pair: null, roles: [ROLES.solo], assignments, basis: {}, unassigned, reason };
}

/**
 * Which role owns each step of an authored station.
 *
 * Returns `{ split, pair, roles, assignments, basis, unassigned, reason }`. When
 * `split` is false the station is single-role: `roles` is the whole crew,
 * every step is assigned to it, and `reason` says in one sentence what the
 * station did not provide. `unassigned` is the diagnostic — the steps that
 * defeated the split — and it is empty when no split was attempted, because
 * the station models nobody to split with.
 *
 * A split is only returned when every single step attributed cleanly. A
 * procedure with one orphan step is precisely the failure this feature exists
 * to teach about, so it is not a thing to ship in the feature itself.
 */
function splitByRole(station) {
  const steps = station?.steps ?? [];
  if (!steps.length) return declined(station ?? { steps: [] }, "the station has no steps");

  const ids = interactableIds(station);
  const text = [stationName(station), station.trade ?? "",
    ...steps.map((s) => `${s.title ?? ""} ${s.cue ?? ""} ${s.why ?? ""}`),
    ...(station.interrupts ?? []).map((i) => `${i.kind ?? ""} ${i.alert ?? ""} ${i.why ?? ""}`)].join(" ").toLowerCase();

  const matched = PAIRS.filter((p) => (p.evidence === "ids" ? ids.some((id) => p.test.test(id)) : p.test.test(text)));
  if (!matched.length) {
    return declined(station, "no second role is modelled in this station — the other person is not something the learner can reach for");
  }
  if (matched.length > 1) {
    // Three posts is a different exercise from two, and picking the loudest
    // pair would be inventing the crew structure rather than reading it.
    return declined(station, `more than one crew pairing is modelled here (${matched.map((p) => p.name).join(", ")}) — a two-role view would have to pick one`);
  }

  const pair = matched[0];
  const [a, b] = pair.roles;
  const assignments = {};
  // Which of the three rules decided each step, so an author reviewing a
  // split can see what it read rather than only what it concluded.
  const basis = {};
  const unassigned = [];
  for (const step of steps) {
    const { role, by } = attribute(step, pair);
    basis[step.id] = by;
    if (role) assignments[step.id] = role; else unassigned.push(step.id);
  }
  if (unassigned.length) {
    return declined(station,
      `${unassigned.length} of ${steps.length} step(s) could not be attributed to one side of a ${pair.name.toLowerCase()} pair without guessing`,
      unassigned);
  }

  const owned = { [a]: [], [b]: [] };
  for (const step of steps) owned[assignments[step.id]].push(step.id);
  for (const roleId of pair.roles) {
    if (owned[roleId].length < MIN_ROLE_STEPS) {
      return declined(station,
        `every duty here belongs to the ${ROLES[roleId === a ? b : a].name.toLowerCase()} — the ${ROLES[roleId].name.toLowerCase()} owns ${owned[roleId].length} step(s), so this is a one-post procedure with a second person in the scene`);
    }
  }

  const roles = pair.roles.map((id) => ({
    ...ROLES[id],
    owns: owned[id].length,
    watches: steps.length - owned[id].length,
    share: Math.round((owned[id].length / steps.length) * 100) / 100,
  }));
  return { split: true, pair: pair.id, roles, assignments, basis, unassigned: [], reason: null };
}

/**
 * Turn a step the learner does not own into a watch step.
 *
 * The kind has to change — the whole point is that they do not run the gauge,
 * hold the line or spin the valve — but nothing else may be lost, so the
 * authored kind and every target the step had are kept verbatim under
 * `watch`. What the learner is left with is one deliberate act: look at the
 * thing the other person was supposed to have dealt with, and confirm it.
 * That is the drill. It is also the only moment in a two-person job where the
 * assumption that kills people is available to be caught.
 */
function watchStep(step, mine, theirs) {
  const targets = [step.target, ...(step.targets ?? [])].filter(Boolean);
  const out = { ...step };
  // Kind-specific configuration would make the engine run the task rather
  // than a confirmation, so it moves wholesale onto `watch`.
  for (const key of ["targets", "anyOrder", "gauge", "track", "turn", "drag", "seconds",
    "itemNames", "itemNotes", "decoyNotes", "outOfOrderNote", "holdBreakNote"]) delete out[key];
  out.kind = "select";
  out.target = step.target ?? targets[0];
  out.title = `Confirm — ${step.title}`;
  out.cue = `${theirs.name} does this one. Check it is done, then carry on.`;
  out.why = `${step.why} This is ${theirs.name.toLowerCase()}'s step, not yours. You confirm it because the way a two-person job goes wrong is each of you assuming the other one did it.`;
  out.watch = {
    of: step.kind,
    by: theirs.id,
    byName: theirs.name,
    for: mine.id,
    targets,
    // Kept so a HUD can still name the items the other person worked through.
    itemNames: step.itemNames ?? null,
  };
  return out;
}

/**
 * One role's view of a station, as a room the Session engine plays unchanged.
 *
 * Same id, same order, same targets, same hazards, same reasons. The steps
 * this role owns are the authored steps; the rest are watch steps. An
 * interruption whose answer is this role's own post is dropped, because an
 * alarm that says the attendant has left the hole cannot be answered by the
 * attendant — every other interruption stays, since noticing is a duty both
 * posts have.
 *
 * A station that cannot be split honestly returns itself, so a caller never
 * has to branch on whether the split succeeded.
 */
function roleView(station, roleId, split = splitByRole(station)) {
  if (!split.split) return station;
  const mine = ROLES[roleId];
  if (!mine || !split.roles.some((r) => r.id === roleId)) return null;
  const theirs = ROLES[mine.counterpart];

  const steps = station.steps.map((step) =>
    (split.assignments[step.id] === roleId ? { ...step } : watchStep(step, mine, theirs)));

  const interrupts = (station.interrupts ?? []).filter((it) =>
    !(mine.posts && it.target && mine.posts.test(it.target)));

  const owned = steps.filter((s) => !s.watch).length;
  return {
    ...station,
    id: `crew:${station.id}:${roleId}`,
    index: "◈",
    name: `${stationName(station)} — ${mine.name}`,
    title: `${station.title ?? stationName(station)} · ${mine.name}`,
    tagline: `${mine.post} The rest of the procedure belongs to the ${theirs.name.toLowerCase()} — you confirm it, you do not do it.`,
    steps,
    interrupts,
    isCrewView: true,
    crew: {
      baseId: station.id, baseName: stationName(station), pair: split.pair,
      role: roleId, roleName: mine.name, counterpart: theirs.id, counterpartName: theirs.name,
      owns: owned, watches: steps.length - owned,
      droppedInterrupts: (station.interrupts ?? []).length - interrupts.length,
    },
    build: (root) => station.build(root),
  };
}

/** Every playable view of a station — one per role, or the station itself. */
function roleViews(station, split = splitByRole(station)) {
  if (!split.split) return [station];
  return split.roles.map((r) => roleView(station, r.id, split));
}

/** A one-line description an instructor can read before issuing it. */
function describeSplit(station, split = splitByRole(station)) {
  if (!split.split) return `${stationName(station)} · single-role · ${split.reason}`;
  const parts = split.roles.map((r) => `${r.name} ${r.owns}/${station.steps.length}`);
  return `${stationName(station)} · ${pairOf(split.pair)?.name ?? split.pair} pair · ${parts.join(" · ")}`;
}


/* ===== shared/observer.js ===== */
/**
 * Instructor mode: a live view of a learner's session for the person running
 * the class, and the commands that person can send back into it.
 *
 * Every VR training sale asks for this, and it is the largest single feature
 * in the roadmap's pilot phase. The default carries no server: the learner's
 * app broadcasts its session on a BroadcastChannel, and an instructor console
 * open on the same machine — another tab, another window, a second monitor at
 * the front of the room — receives it and can send commands back. That covers
 * the common case of a hall with a row of laptops or headsets mirrored to one
 * screen.
 *
 * A BroadcastChannel is same-origin and same-device by definition, so for the
 * other case — an instructor on their own machine — both sides accept
 * `?relay=<ws url>` and put the *same* JSON envelope on a WebSocket as well.
 * The relay is a dumb fan-out: it hands every frame to every other client and
 * understands nothing about it (tools/relay_server.mjs, docs/instructor-console.md).
 * When the app is embedded in an LMS the same events also go to the host page
 * through Identity.emit, which is the third honest path.
 *
 * Nothing is stored here. The channel carries what is happening right now, and
 * closing the console loses it; the record of the attempt is the training
 * record, which is a different, durable thing — and every command the console
 * sends is appended to that record as an instructorAction, so a run driven by
 * an instructor is never mistaken for one the learner drove alone.
 *
 * Protocol 2 added the content-and-interaction commands (open, interrupt,
 * weather, profile, hazard mode, assign) and the `action` event that reports
 * what the app did with one. Both sides still accept protocol 1, so a console
 * or an app from before the bump interoperates with note, freeze and roll.
 *
 * Protocol 3 added `flow`: the one command that carries a payload rather than
 * a short string, because a flow is a node graph (shared/flowhub.js) and there
 * is no useful way to name one in 120 characters. It travels as a parsed
 * object on the `flow` field, size-capped like every other field here, and the
 * app validates it against the catalog before it will run it — the console is
 * not trusted to have handed over a flow that makes sense.
 */

const CHANNEL = "smartcitix:instructor";
const OBSERVER_PROTOCOL = 3;
const ACCEPTED_PROTOCOLS = [1, 2, 3];

// Learner → instructor.
const EV_HELLO = "hello";       // a session opened (or answered a roll call)
const EV_STATE = "state";       // throttled snapshot: station, step, score
const EV_STEP = "step";         // a step completed
const EV_HAZARD = "hazard";     // an unsafe action, with its consequence
const EV_ACTION = "action";     // the app answered an instructor command
const EV_FINISH = "finish";     // the run ended, with the verdict
const EV_BYE = "bye";           // the session left a station or closed
// Instructor → learner.
const CMD_ROLL = "roll";               // who is out there?
const CMD_NOTE = "note";               // a line to put in front of the learner
const CMD_FREEZE = "freeze";           // pause / resume the session
const CMD_OPEN = "open";               // send this learner to a station or programme
const CMD_INTERRUPT = "interrupt";     // fire one declared interruption now
const CMD_WEATHER = "weather";         // the weather the next station runs under
const CMD_PROFILE = "profile";         // the device profile the next station runs under
const CMD_HAZARD_MODE = "hazard-mode"; // "coach" warns once; "assess" scores it
const CMD_ASSIGN = "assign";           // pin a programme in the learner's panel
const CMD_FLOW = "flow";               // hand over a flow and start it (shared/flowhub.js)
const LEARNER_EVENTS = [EV_HELLO, EV_STATE, EV_STEP, EV_HAZARD, EV_ACTION, EV_FINISH, EV_BYE];
const INSTRUCTOR_COMMANDS = [CMD_ROLL, CMD_NOTE, CMD_FREEZE, CMD_OPEN, CMD_INTERRUPT, CMD_WEATHER, CMD_PROFILE, CMD_HAZARD_MODE, CMD_ASSIGN, CMD_FLOW];

/** What each command means, for the console's own labels and the docs. */
const COMMAND_LABELS = {
  [CMD_ROLL]: "Roll call",
  [CMD_NOTE]: "Note",
  [CMD_FREEZE]: "Hold / release",
  [CMD_OPEN]: "Open station or programme",
  [CMD_INTERRUPT]: "Fire interruption",
  [CMD_WEATHER]: "Weather for next station",
  [CMD_PROFILE]: "Device profile for next station",
  [CMD_HAZARD_MODE]: "Hazard mode",
  [CMD_ASSIGN]: "Assign programme",
  [CMD_FLOW]: "Load flow",
};

const MAX_TEXT = 400;
const MAX_DETAIL = 120;
/** A flow is a graph, not a label. Capped so a relay frame stays sane. */
const MAX_FLOW_JSON = 64000;
const clip = (v, n = MAX_TEXT) => (typeof v === "string" ? v.slice(0, n) : v);

/**
 * The one structured payload this protocol carries. Re-serialised and size
 * checked here so a malformed or enormous flow never reaches an app's handler;
 * whether it is a *valid* flow is flowhub's question, asked by the app.
 */
function clipFlow(flow) {
  if (!flow || typeof flow !== "object" || Array.isArray(flow)) return null;
  let json;
  try { json = JSON.stringify(flow); } catch (_) { return null; }
  if (!json || json.length > MAX_FLOW_JSON) return null;
  try { return JSON.parse(json); } catch (_) { return null; }
}
const knownProtocol = (m) => !!m && ACCEPTED_PROTOCOLS.includes(m.protocol);

/**
 * With both legs open — a BroadcastChannel and a relay — the same message
 * arrives twice, and a note shown twice or an interruption armed twice is a
 * bug the room would see. Every message carries its own id and each side drops
 * one it has already handled. A protocol-1 message has no id and is never
 * dropped: an old console's note is rare and shown once anyway.
 */
function makeSeen(limit = 240) {
  const seen = new Set();
  return (mid) => {
    if (!mid) return false;
    if (seen.has(mid)) return true;
    seen.add(mid);
    if (seen.size > limit) for (const old of seen) { seen.delete(old); if (seen.size <= limit) break; }
    return false;
  };
}

function messageId() {
  return `m-${Math.random().toString(36).slice(2, 10)}${Date.now().toString(36).slice(-4)}`;
}

/** A stable id for this tab, so one console can tell two learners apart. */
function tabId() {
  return `s-${Math.random().toString(36).slice(2, 8)}${Date.now().toString(36).slice(-4)}`;
}

function openChannel() {
  if (typeof BroadcastChannel !== "function") return null;
  try { return new BroadcastChannel(CHANNEL); } catch (_) { return null; }
}

/** `?relay=wss://host/path` on either page, when one is given. */
function relayFromSearch(search = typeof location !== "undefined" ? location.search : "") {
  try {
    const raw = new URLSearchParams(search).get("relay");
    if (!raw) return null;
    return /^wss?:\/\//.test(raw) ? raw : null;
  } catch (_) { return null; }
}

/**
 * The optional WebSocket leg. Same envelope as the BroadcastChannel, one JSON
 * object per frame; the server fans a frame out to every other client and
 * never to the sender. Failure is silent by design — the relay is an extra
 * leg, and a session must not break because a room's relay is down. Frames
 * sent before the socket opens are queued, because a station is often entered
 * within a second of the page loading.
 */
function openRelay(url, onMessage) {
  if (!url || typeof WebSocket !== "function") return null;
  let sock = null;
  try { sock = new WebSocket(url); } catch (_) { return null; }
  let queue = [];
  let closed = false;
  sock.onopen = () => { const pending = queue; queue = []; for (const frame of pending) { try { sock.send(frame); } catch (_) { /* ignore */ } } };
  sock.onmessage = (e) => {
    let msg = null;
    try { msg = JSON.parse(typeof e.data === "string" ? e.data : ""); } catch (_) { return; }
    if (msg && typeof msg === "object") onMessage(msg);
  };
  sock.onerror = () => { /* the BroadcastChannel leg carries on */ };
  return {
    get url() { return url; },
    get open() { return sock.readyState === 1; },
    send(msg) {
      if (closed) return false;
      let frame;
      try { frame = JSON.stringify(msg); } catch (_) { return false; }
      if (sock.readyState === 1) { try { sock.send(frame); return true; } catch (_) { return false; } }
      if (sock.readyState === 0 && queue.length < 400) { queue.push(frame); return true; }
      return false;
    },
    close() { closed = true; queue = []; try { sock.close(); } catch (_) { /* ignore */ } },
  };
}

/**
 * The learner side. `app` is "smartcity" | "trades" | "holodeck".
 * Returns a handle even when neither leg is available, so callers never have
 * to branch: every method is then a no-op.
 */
function createBroadcaster(app, { learner = "", station = "", stationName = "", relay = relayFromSearch() } = {}) {
  const ch = openChannel();
  const id = tabId();
  let last = 0, onCommand = null, closed = false, describe = null;
  let ctx = { app, learner, station, stationName: stationName || station };
  const handled = makeSeen();

  const handle = (m) => {
    if (!knownProtocol(m) || handled(m.mid)) return;
    if (m.kind === CMD_ROLL) { post(EV_HELLO, describe?.() ?? {}); return; }
    if (!INSTRUCTOR_COMMANDS.includes(m.kind)) return;
    // A command addressed to one session is ignored by the others.
    if (m.to && m.to !== id) return;
    onCommand?.({ kind: m.kind, text: clip(m.text), on: !!m.on, detail: clip(m.detail, MAX_DETAIL), flow: clipFlow(m.flow) });
  };

  const link = openRelay(relay, handle);

  const post = (kind, data = {}) => {
    if (closed) return false;
    const msg = { protocol: OBSERVER_PROTOCOL, mid: messageId(), kind, id, at: Date.now(), ...ctx, ...data };
    let sent = false;
    if (ch) { try { ch.postMessage(msg); sent = true; } catch (_) { /* ignore */ } }
    if (link?.send(msg)) sent = true;
    return sent;
  };

  if (ch) ch.onmessage = (e) => handle(e?.data);

  return {
    id,
    get available() { return !!ch || !!link; },
    get relay() { return link?.url ?? null; },
    /** Extra fields every hello carries — the station's steps and declared
     *  interruptions, which only the app knows. Called on each roll call too,
     *  so a console opened mid-run gets the panel it needs. */
    describes(fn) { describe = typeof fn === "function" ? fn : null; },
    /** Update who and where, and announce it. */
    hello(next = {}) { ctx = { ...ctx, ...next }; return post(EV_HELLO, describe?.() ?? {}); },
    /** Throttled: the console does not need more than a few frames a second. */
    state(snapshot, { minMs = 500 } = {}) {
      const now = Date.now();
      if (now - last < minMs) return false;
      last = now;
      return post(EV_STATE, snapshot);
    },
    step(data) { return post(EV_STEP, data); },
    hazard(data) { return post(EV_HAZARD, { ...data, note: clip(data?.note) }); },
    /** What the app did with a command: the console's proof it landed. */
    action(data) { return post(EV_ACTION, { ...data, cmd: clip(data?.cmd, MAX_DETAIL), detail: clip(data?.detail, MAX_DETAIL), note: clip(data?.note) }); },
    finish(data) { return post(EV_FINISH, data); },
    bye() { const ok = post(EV_BYE); return ok; },
    onCommand(fn) { onCommand = typeof fn === "function" ? fn : null; },
    close() { if (closed) return; post(EV_BYE); closed = true; try { ch?.close(); } catch (_) {} link?.close(); },
  };
}

/**
 * The instructor side. `onEvent` receives every learner event; call
 * `roll()` once on open so sessions that started earlier announce themselves.
 * `onSend` (optional) sees every command as it goes out, which is how the
 * console's session log records both directions from one place.
 */
function createConsole(onEvent, { relay = relayFromSearch(), onSend = null } = {}) {
  const ch = openChannel();
  const handled = makeSeen();
  const handle = (m) => {
    if (!knownProtocol(m) || handled(m.mid) || !LEARNER_EVENTS.includes(m.kind)) return;
    onEvent?.(m);
  };
  const link = openRelay(relay, handle);
  if (ch) ch.onmessage = (e) => handle(e?.data);
  const send = (kind, extra = {}) => {
    const msg = { protocol: OBSERVER_PROTOCOL, mid: messageId(), kind, at: Date.now(), ...extra };
    let sent = false;
    if (ch) { try { ch.postMessage(msg); sent = true; } catch (_) { /* ignore */ } }
    if (link?.send(msg)) sent = true;
    if (sent) onSend?.(msg);
    return sent;
  };
  return {
    get available() { return !!ch || !!link; },
    get relay() { return link?.url ?? null; },
    roll() { return send(CMD_ROLL); },
    note(to, text) { return send(CMD_NOTE, { to, text: clip(text) }); },
    freeze(to, on) { return send(CMD_FREEZE, { to, on: !!on }); },
    /** A station id, or a programme id — the app resolves which. */
    open(to, detail) { return send(CMD_OPEN, { to, detail: clip(detail, MAX_DETAIL) }); },
    /** One of the current station's declared interruption ids. */
    interrupt(to, detail) { return send(CMD_INTERRUPT, { to, detail: clip(detail, MAX_DETAIL) }); },
    weather(to, detail) { return send(CMD_WEATHER, { to, detail: clip(detail, MAX_DETAIL) }); },
    profile(to, detail) { return send(CMD_PROFILE, { to, detail: clip(detail, MAX_DETAIL) }); },
    hazardMode(to, detail) { return send(CMD_HAZARD_MODE, { to, detail: clip(detail, MAX_DETAIL) }); },
    assign(to, detail) { return send(CMD_ASSIGN, { to, detail: clip(detail, MAX_DETAIL) }); },
    /**
     * Hand a flow to a learner's app and ask it to start. `detail` is the
     * flow's id, for the console's own log and the app's refusal message; the
     * graph itself rides on `flow`. The app validates it against the catalog
     * and answers with an `action` event either way.
     */
    flow(to, flow, detail = null) {
      const payload = clipFlow(flow);
      if (!payload) return false;
      return send(CMD_FLOW, { to, flow: payload, detail: clip(detail ?? payload.id ?? "", MAX_DETAIL) });
    },
    close() { try { ch?.close(); } catch (_) {} link?.close(); },
  };
}

/** Fold a stream of learner events into a roster the console can render. */
function reduceRoster(roster, ev, { staleMs = 45000 } = {}) {
  const next = new Map(roster);
  const prev = next.get(ev.id) ?? { id: ev.id, events: [], hazards: 0, steps: 0, actions: 0, fired: [], steplist: [], interrupts: [] };
  const row = {
    ...prev,
    id: ev.id, app: ev.app ?? prev.app, learner: ev.learner || prev.learner || "Unnamed",
    station: ev.station ?? prev.station, stationName: ev.stationName ?? prev.stationName ?? prev.station,
    at: ev.at,
  };
  if (ev.kind === EV_HELLO) {
    // A hello is where the station itself arrives: the steps in order and the
    // interruptions it declares, which is what the per-learner panel drives
    // its buttons from. Only the app knows them, and only for the station it
    // actually loaded.
    Object.assign(row, {
      live: true, finished: false,
      steplist: Array.isArray(ev.steps) ? ev.steps : prev.steplist ?? [],
      interrupts: Array.isArray(ev.interrupts) ? ev.interrupts : prev.interrupts ?? [],
      fired: Array.isArray(ev.fired) ? ev.fired : prev.fired ?? [],
      hazardMode: ev.hazardMode ?? prev.hazardMode ?? "assess",
      weather: ev.weather ?? prev.weather, profile: ev.profile ?? prev.profile,
      assigned: ev.assigned ?? prev.assigned ?? null,
      // The flow the session is on, if any: id, node and why it is there.
      flow: ev.flow ?? prev.flow ?? null,
      flowNode: ev.flowNode ?? prev.flowNode ?? null,
      stepIndex: ev.stepIndex ?? prev.stepIndex, stepCount: ev.stepCount ?? prev.stepCount,
    });
  }
  if (ev.kind === EV_STATE) {
    Object.assign(row, {
      stepIndex: ev.stepIndex, stepCount: ev.stepCount, stepTitle: ev.stepTitle,
      score: ev.score, stars: ev.stars, errors: ev.errors, hazardHits: ev.hazardHits, seconds: ev.seconds,
      answered: ev.answered ?? prev.answered ?? 0, interruptTotal: ev.interruptTotal ?? prev.interruptTotal ?? 0,
      fired: Array.isArray(ev.fired) ? ev.fired : prev.fired ?? [],
      hazardMode: ev.hazardMode ?? prev.hazardMode ?? "assess",
      live: true, finished: false,
    });
  }
  if (ev.kind === EV_STEP) { row.steps = (prev.steps ?? 0) + 1; row.live = true; }
  if (ev.kind === EV_HAZARD) {
    row.hazards = (prev.hazards ?? 0) + 1;
    row.events = [...(prev.events ?? []), { at: ev.at, kind: "hazard", text: ev.note ?? ev.hazardId ?? "unsafe action" }].slice(-12);
    row.live = true;
  }
  if (ev.kind === EV_ACTION) {
    // The app's own answer to a command: what it did, and — for an
    // interruption — that it is now fired, so the console disables the button
    // rather than letting a class fire the same alarm twice.
    row.actions = (prev.actions ?? 0) + 1;
    row.live = true;
    if (ev.cmd === CMD_INTERRUPT && ev.ok && ev.detail) row.fired = [...new Set([...(prev.fired ?? []), ev.detail])];
    if (ev.cmd === CMD_HAZARD_MODE && ev.ok) row.hazardMode = ev.detail ?? row.hazardMode;
    if (ev.cmd === CMD_WEATHER && ev.ok) row.weather = ev.detail ?? row.weather;
    if (ev.cmd === CMD_PROFILE && ev.ok) row.profile = ev.detail ?? row.profile;
    if (ev.cmd === CMD_ASSIGN && ev.ok) row.assigned = ev.detail ?? row.assigned;
    if (ev.cmd === CMD_FLOW && ev.ok) row.flow = ev.detail ?? row.flow;
    row.events = [...(prev.events ?? []), {
      at: ev.at, kind: ev.ok ? "action" : "refused",
      text: `${ev.cmd}${ev.detail ? ` ${ev.detail}` : ""} — ${ev.note ?? (ev.ok ? "done" : "refused")}`,
    }].slice(-12);
  }
  if (ev.kind === EV_FINISH) {
    Object.assign(row, { finished: true, live: true, passed: !!ev.passed, stars: ev.stars, score: ev.score, seconds: ev.seconds });
    row.events = [...(prev.events ?? []), { at: ev.at, kind: ev.passed ? "pass" : "fail", text: ev.verdict ?? (ev.passed ? "passed" : "not passed") }].slice(-12);
  }
  if (ev.kind === EV_BYE) row.live = false;
  next.set(ev.id, row);
  // Drop rows nothing has been heard from for a while.
  const cutoff = Date.now() - staleMs;
  for (const [k, v] of next) if (!v.live && v.at < cutoff) next.delete(k);
  return next;
}


/* ===== shared/platform.js ===== */
// Platform channel — how a hosting platform (an LMS, a portal, a metaverse
// world that embeds a station in a frame or a panel) drives an app and hears
// back from it. It sits on top of identity.js and reuses its trust rule:
//
//   * On load, when embedded, the app announces itself upward with
//     { type: "smartcitix:ready", protocol, app } — to any parent, since it
//     carries nothing but the app's name and protocol version.
//   * The host establishes trust the way identity.js already defines it:
//     postMessage({ type: "smartcitix:identity", learner, learner_id,
//     learner_home }) where learner_home equals the host's real origin.
//   * From that origin only, the app accepts commands:
//       smartcitix:open     { sim | room, skipBrief? }   open a station
//       smartcitix:hub      {}                            back to the hub
//       smartcitix:status   {}                            ask for state
//       smartcitix:catalog  {}                            ask for the roster
//   * And it emits, only to that origin (Identity.emit):
//       smartcitix:state     { app, room, stepIndex, stepCount, score, level, ... }
//       smartcitix:catalog   { app, stations: [...] }
//       smartcitix:progress  { sim, step, index, count, score }   each step
//       smartcitix:record    { record }                           each finish (records.js)
//       smartcitix:credential{ assertion }                        each pass (records.js)
//
// The static catalog (WebXR/smartcity/catalog.json, generated by
// tools/gen_catalog.mjs) is the same roster a platform can index without
// loading the app at all: ids, categories, certifications and deep links.
//
// ---------------------------------------------------------------------------
// Protocol 2 — flows
//
// A host that orchestrates more than one station needs more than "open this
// one". Protocol 2 adds the flow channel: the host hands over a flow (a graph
// of nodes with a condition on every edge — see shared/flowhub.js), this app
// runs the nodes that are its to run, and every transition is reported back.
//
//   * Commands, from the learner's home origin only:
//       smartcitix:flow.load    { flow }                 a flow definition (object or JSON text)
//       smartcitix:flow.start   { flowId?, restart? }    begin (or restart) a loaded flow
//       smartcitix:flow.resume  { nodeId, outcome }      the host finished an external node
//   * Events, to that origin only:
//       smartcitix:flow.state    { flow: <state>, transition }   every transition
//       smartcitix:flow.done     { flow: <state> }               the flow reached a terminal node
//       smartcitix:flow.external { flowId, nodeId, node }        a node the HOST runs; we wait
//
// A protocol-1 host never sends a flow command and never sees a flow event, so
// both sides interoperate unchanged; PROTOCOL is the version the app announces
// in `ready` and stamps on every event, and ACCEPTED_HOST_PROTOCOLS is what it
// will take from a host. The trust rule is identity.js's, unchanged: a flow is
// accepted only from the origin the learner's launch context named as home,
// and every flow event goes only there.
//
// The contract above is what a host must speak. The user's host platform is
// Cognition.X, whose orchestration component is called FlowHub; no FlowHub
// specification exists in this repository, so docs/flowhub.md states this as
// the SmartCiti.X side of the contract and nothing here claims to know how
// FlowHub implements or adapts to it.


const PROTOCOL = 2;
/**
 * What this app will accept from a host: protocol 1 hosts still work. Named for
 * the host side, because observer.js has its own ACCEPTED_PROTOCOLS for the
 * instructor channel and the two are bundled into one file.
 */
const ACCEPTED_HOST_PROTOCOLS = [1, 2];

const BASE_COMMANDS = ["smartcitix:open", "smartcitix:hub", "smartcitix:status", "smartcitix:catalog"];

// The flow channel (protocol 2). Named constants rather than literals because
// three apps and the instructor console all have to agree on them, and
// tools/check_flowhub.mjs checks that they do.
const FLOW_LOAD = "smartcitix:flow.load";
const FLOW_START = "smartcitix:flow.start";
const FLOW_RESUME = "smartcitix:flow.resume";
const FLOW_STATE = "smartcitix:flow.state";
const FLOW_DONE = "smartcitix:flow.done";
const FLOW_EXTERNAL = "smartcitix:flow.external";

const FLOW_COMMANDS = [FLOW_LOAD, FLOW_START, FLOW_RESUME];
const FLOW_EVENTS = [FLOW_STATE, FLOW_DONE, FLOW_EXTERNAL];

const COMMANDS = [...BASE_COMMANDS, ...FLOW_COMMANDS];

const Platform = {
  app: null,
  _off: null,

  /**
   * Announce readiness (when embedded) and start listening for commands.
   * `onCommand(type, data, reply)` is called only for commands from the
   * learner's home origin; `reply(type, payload)` answers that origin.
   */
  init({ app, onCommand }) {
    this.app = app;
    if (this._off) { this._off(); this._off = null; }
    const handler = (e) => {
      const type = e.data?.type;
      if (!COMMANDS.includes(type)) return;
      const trusted = Identity.current?.homePage;
      if (!trusted || e.origin !== trusted) return;
      const data = { ...e.data }; delete data.type;
      onCommand?.(type, data, (replyType, payload) => this.emit(replyType, payload));
    };
    addEventListener("message", handler);
    this._off = () => removeEventListener("message", handler);
    if (Identity.embedded) {
      try { window.parent.postMessage({ type: "smartcitix:ready", protocol: PROTOCOL, app }, "*"); } catch (_) { /* ignore */ }
    }
    return this;
  },

  /** Post to the learner's home origin only (never broadcast). */
  emit(type, payload) { return Identity.emit(type, { app: this.app, protocol: PROTOCOL, ...payload }); },

  /** Convenience for the per-step heartbeat a live host HUD wants. */
  progress(payload) { return this.emit("smartcitix:progress", payload); },

  /**
   * The flow events, named so an app cannot misspell one. `state` is what
   * shared/flowhub.js's stateMessage() produced; it is nested under `flow` so
   * the flow's own protocol version travels beside the channel's rather than
   * overwriting it.
   */
  flowState(state, transition = null) { return this.emit(FLOW_STATE, { flow: state, transition }); },
  flowDone(state) { return this.emit(FLOW_DONE, { flow: state }); },
  /** A node the host runs: we park until smartcitix:flow.resume arrives. */
  flowExternal(payload) { return this.emit(FLOW_EXTERNAL, { ...payload, awaiting: FLOW_RESUME }); },
};


/* ===== shared/flowhub.js ===== */
/**
 * FlowHub — the SmartCiti.X side of a host-orchestrated training flow.
 *
 * A host platform (the learner's LMS, portal or world) knows things this
 * repository cannot: which lesson a learner read this morning, which
 * assessment they owe, what their employer's induction requires this quarter.
 * What it does not know is how a station runs, what a passing attempt is, or
 * which station comes next when the last one was only scraped through. A
 * *flow* is the contract between the two: the host hands over an ordered graph
 * of nodes with the conditions on each edge, this side runs the nodes it owns,
 * reports every transition, and hands a node back to the host when the node is
 * the host's to run.
 *
 * The user's host platform is Cognition.X and its orchestration component is
 * called FlowHub. **No FlowHub specification exists in this repository and
 * nothing here is derived from one.** Everything below is the SmartCiti.X side
 * of the contract, specified from this end: the schema we validate, the
 * messages we accept and the messages we emit. What Cognition.X's FlowHub —
 * or any other host — implements or adapts to speak it is documented in
 * `docs/flowhub.md` as an assumption, never as knowledge of its internals.
 *
 * This module is deliberately pure: no DOM, no three.js, no import of an app.
 * `node tools/check_flowhub.mjs` runs it directly, which is the only reason
 * the branch conditions can be gated at all.
 *
 * ## The schema
 *
 *   flow  = { id, title, version, start, nodes: [node], edges: [edge], meta? }
 *   node  = { id, kind, app?, ref?, params?, title?, why? }
 *           kind: "station" | "programme" | "brief" | "checkin" | "gate" | "external"
 *   edge  = { from, to, when? }
 *           when: { passed?, minStars?, maxHazards?, competency?, custom? }
 *
 * An outcome is the attempt record this engine already writes (`passed`,
 * `stars`, `hazardHits`, `interrupts`, `seconds`, `parSeconds` — see
 * `shared/records.js`) reduced by `outcomeFromRecord`. Nothing new is scored
 * for a flow: a flow reads the same verdict the certificate claim rests on.
 *
 * ## The competency layer
 *
 * A `gate` node asks whether a competency has been *demonstrated*, which is a
 * question the competency layer (`shared/competency.js`) owns. That module is
 * not in this tree, so this one never imports it: `hasCompetencyLayer()` is
 * the feature check and `setCompetencyResolver()` is the seam. Until it lands,
 * the default resolver answers from the run itself, using the mastery rule the
 * proof brief states (>= 2 stars, no unsafe action, every interruption
 * answered, time <= 1.5 x par) over the stations the gate names. When the
 * module lands, one call in each app replaces that default and nothing else
 * changes.
 */

const FLOW_PROTOCOL = 1;

/**
 * The one localStorage key a flow run lives under, versioned like every other
 * store in this engine. It holds every loaded flow and its run, so a flow that
 * sends a learner from SmartCiti.X to Trade Skills and back survives the app
 * switch (the three apps are separate pages on one origin).
 */
const FLOW_STORE_KEY = "vr-training-flowhub-v1";

const NODE_KINDS = ["station", "programme", "brief", "checkin", "gate", "external"];
const LEARNER_APPS = ["smartcity", "trades", "holodeck"];
/** The app id an `external` node carries: the host runs it, not us. */
const HOST_APP = "host";
const WHEN_KEYS = ["passed", "minStars", "maxHazards", "competency", "custom"];
const GATE_RULES = ["mastery", "passed"];

const SLUG = /^[a-z0-9][a-z0-9-]{0,63}$/;
const isSlug = (v) => typeof v === "string" && SLUG.test(v);
const isInt = (v) => Number.isInteger(v);

// ------------------------------------------------------------------ outcomes

/**
 * One attempt, as a flow reads it. Takes the record `shared/records.js`
 * writes (or a Session summary shaped like one) and keeps only the fields an
 * edge condition may ask about, so a flow can never branch on something an
 * attempt record does not actually carry.
 */
function outcomeFromRecord(record = {}, extra = {}) {
  const iv = record.debrief?.interrupts ?? record.interrupts ?? {};
  const stars = record.stars | 0;
  const hazardHits = record.hazardHits | 0;
  const interrupts = {
    total: iv.total | 0,
    answered: iv.answered | 0,
    missed: iv.missed | 0,
    wrong: iv.wrong | 0,
  };
  return {
    passed: typeof record.passed === "boolean" ? record.passed : stars >= 2 && hazardHits === 0,
    stars, hazardHits, interrupts,
    seconds: record.seconds == null ? null : Math.round(record.seconds),
    parSeconds: record.parSeconds == null ? null : Math.round(record.parSeconds),
    app: record.app ?? null,
    ref: record.simId ?? record.ref ?? null,
    competencies: Array.isArray(record.competencies) ? [...record.competencies] : [],
    ...extra,
  };
}

/** The proof brief's mastery rule, stated once. */
function mastered(outcome = {}) {
  const o = outcome ?? {};
  if ((o.stars | 0) < 2) return false;
  if ((o.hazardHits | 0) !== 0) return false;
  const iv = o.interrupts ?? {};
  if ((iv.missed | 0) + (iv.wrong | 0) > 0) return false;
  if (o.seconds != null && o.parSeconds) return o.seconds <= o.parSeconds * 1.5;
  return true;
}

/** An outcome a node that is not scored produces (a brief read, a check-in answered). */
function acknowledgedOutcome(extra = {}) {
  return {
    passed: true, stars: 0, hazardHits: 0,
    interrupts: { total: 0, answered: 0, missed: 0, wrong: 0 },
    seconds: null, parSeconds: null, competencies: [], acknowledged: true,
    ...extra,
  };
}

// -------------------------------------------------------------- competencies

let competencyResolver = null;

/** True when a competency layer has been wired in (see the header note). */
function hasCompetencyLayer() { return typeof competencyResolver === "function"; }

/**
 * Hand in the competency layer's own answer. `fn(id, { outcome, run, flow })`
 * returns true when the learner holds that competency. Pass null to go back
 * to the built-in rule.
 */
function setCompetencyResolver(fn) { competencyResolver = typeof fn === "function" ? fn : null; }

/**
 * Does the learner hold this competency at this point in the run? The wired
 * layer answers if there is one; otherwise the outcome in hand and the run's
 * own granted set do, which is what a gate node fills.
 */
function competencyHeld(id, outcome = {}, ctx = {}) {
  if (!id) return false;
  if (competencyResolver) {
    try { return !!competencyResolver(id, { outcome, ...ctx }); } catch (_) { return false; }
  }
  if (Array.isArray(outcome.competencies) && outcome.competencies.includes(id)) return true;
  return Array.isArray(ctx.competencies) && ctx.competencies.includes(id);
}

// ----------------------------------------------------- custom edge conditions

const CONDITIONS = new Map();

/** Register a named predicate an edge may use as `when.custom`. */
function registerCondition(name, fn) {
  if (typeof name !== "string" || !name || typeof fn !== "function") return false;
  CONDITIONS.set(name, fn);
  return true;
}
function conditionNames() { return [...CONDITIONS.keys()].sort(); }
function hasCondition(name) { return CONDITIONS.has(name); }

// The two a flow actually wants, so `custom` is a usable field rather than an
// escape hatch nothing implements. Both read only the attempt record.
registerCondition("under-par", (o) => o?.seconds != null && !!o?.parSeconds && o.seconds <= o.parSeconds);
registerCondition("clean", (o) => (o?.hazardHits | 0) === 0 && ((o?.interrupts?.missed | 0) + (o?.interrupts?.wrong | 0)) === 0);

// --------------------------------------------------------------- flow reading

function nodeById(flow, id) { return (flow?.nodes ?? []).find((n) => n.id === id) ?? null; }
function edgesFrom(flow, id) { return (flow?.edges ?? []).filter((e) => e.from === id); }
function terminalNodes(flow) {
  return (flow?.nodes ?? []).filter((n) => edgesFrom(flow, n.id).length === 0).map((n) => n.id);
}

/** A node's own label for a HUD, a panel or a console row. */
function nodeLabel(node) {
  if (!node) return "";
  if (node.title) return node.title;
  if (node.ref) return String(node.ref).replace(/-/g, " ");
  return String(node.id ?? "").replace(/-/g, " ");
}

/** A `when` in words — this is the `why` every transition reports. */
function describeWhen(when) {
  const w = when ?? {};
  const parts = [];
  if ("passed" in w) parts.push(w.passed ? "passed" : "not passed");
  if ("minStars" in w) parts.push(`${w.minStars} star${w.minStars === 1 ? "" : "s"} or better`);
  if ("maxHazards" in w) parts.push(w.maxHazards === 0 ? "no unsafe action" : `at most ${w.maxHazards} unsafe actions`);
  if ("competency" in w) parts.push(`competency ${w.competency} demonstrated`);
  if ("custom" in w) parts.push(`condition ${w.custom}`);
  return parts.length ? parts.join(" and ") : "always";
}

/** Does this edge's condition hold for this outcome? Absent keys never block. */
function edgeMatches(edge, outcome = {}, ctx = {}) {
  const w = edge?.when ?? {};
  if ("passed" in w && !!w.passed !== !!outcome.passed) return false;
  if ("minStars" in w && (outcome.stars | 0) < (w.minStars | 0)) return false;
  if ("maxHazards" in w && (outcome.hazardHits | 0) > (w.maxHazards | 0)) return false;
  if ("competency" in w && !competencyHeld(w.competency, outcome, ctx)) return false;
  if ("custom" in w) {
    const fn = CONDITIONS.get(w.custom);
    if (!fn) return false;
    try { if (!fn(outcome, ctx)) return false; } catch (_) { return false; }
  }
  return true;
}

/**
 * Where this outcome sends the flow from `nodeId`. Edges are tried in the
 * order the flow declares them and the first match wins, so a flow reads
 * top-down like the decision it is. A node with no outgoing edge ends the
 * flow; a node whose every edge condition fails also ends it, and says so.
 */
function nextNode(flow, nodeId, outcome = {}, ctx = {}) {
  const out = edgesFrom(flow, nodeId);
  if (!out.length) return { to: null, node: null, edge: null, done: true, why: "end of flow" };
  for (const edge of out) {
    if (!edgeMatches(edge, outcome, ctx)) continue;
    return { to: edge.to, node: nodeById(flow, edge.to), edge, done: false, why: describeWhen(edge.when) };
  }
  return { to: null, node: null, edge: null, done: true, why: "no branch condition matched" };
}

// ---------------------------------------------------------------------- gates

/**
 * A gate runs nothing. It reads the run that led to it and answers whether the
 * competency it names has been demonstrated, under the rule it names, over the
 * stations it names. The answer is an outcome, so the gate's own outgoing
 * edges are evaluated exactly like a station's.
 */
function evaluateGate(node, run, flow = null, ctx = {}) {
  const p = node?.params ?? {};
  const rule = GATE_RULES.includes(p.rule) ? p.rule : "mastery";
  const wanted = Array.isArray(p.stations) ? p.stations : [];
  const best = new Map();
  for (const entry of run?.history ?? []) {
    if (!entry?.ref || !entry.outcome) continue;
    const prev = best.get(entry.ref);
    const score = (entry.outcome.stars | 0) - (entry.outcome.hazardHits | 0) * 10;
    if (!prev || score > prev.score) best.set(entry.ref, { score, outcome: entry.outcome });
  }
  const evidence = wanted.map((ref) => {
    const o = best.get(ref)?.outcome ?? null;
    const ok = !o ? false : rule === "mastery" ? mastered(o) : !!o.passed;
    const note = !o
      ? "not attempted in this flow"
      : ok
        ? (rule === "mastery" ? "mastered" : "passed")
        : (rule === "mastery" ? "attempted, not to the mastery rule" : "attempted, not passed");
    return { ref, ok, stars: o?.stars ?? null, hazardHits: o?.hazardHits ?? null, note };
  });
  // A competency layer, when one is wired in, is the authority; the stations
  // in the run are the fallback evidence.
  const layerSays = p.competency && hasCompetencyLayer()
    ? competencyHeld(p.competency, {}, { ...ctx, run, flow, competencies: run?.competencies ?? [] })
    : null;
  const byEvidence = evidence.length > 0 && evidence.every((e) => e.ok);
  const held = layerSays === null ? byEvidence : layerSays;
  const missing = evidence.filter((e) => !e.ok).map((e) => e.ref);
  return {
    ...acknowledgedOutcome(),
    passed: held, gate: true, rule,
    competency: p.competency ?? null,
    competencies: held && p.competency ? [p.competency] : [],
    evidence,
    source: layerSays === null ? "run evidence" : "competency layer",
    why: held
      ? `${p.competency ?? "gate"} demonstrated — ${evidence.filter((e) => e.ok).length}/${evidence.length} stations to the ${rule} rule`
      : `${p.competency ?? "gate"} not yet demonstrated — ${missing.join(", ") || "no evidence"}`,
  };
}

// ----------------------------------------------------------------- validation

/**
 * Everything that must be true of a flow before an app will run it.
 * `catalog` is `WebXR/smartcity/catalog.json` (or anything with the same
 * `stations` / `curricula` arrays); pass null to skip the existence checks and
 * get a warning saying so — a host that hands us a flow gets the full check.
 */
function validateFlow(flow, catalog = null) {
  const errors = [], warnings = [];
  const bad = (m) => errors.push(m);
  if (!flow || typeof flow !== "object" || Array.isArray(flow)) {
    return { ok: false, errors: ["flow is not an object"], warnings, nodes: 0, edges: 0, terminals: [] };
  }
  if (!isSlug(flow.id)) bad(`flow id ${JSON.stringify(flow.id)} is not a slug (a-z, 0-9, dashes)`);
  if (typeof flow.title !== "string" || !flow.title.trim()) bad("flow has no title");
  if (!isInt(flow.version) || flow.version < 1) bad(`flow version ${JSON.stringify(flow.version)} is not a positive integer`);
  const nodes = Array.isArray(flow.nodes) ? flow.nodes : null;
  const edges = Array.isArray(flow.edges) ? flow.edges : null;
  if (!nodes) bad("flow.nodes is not an array");
  if (!edges) bad("flow.edges is not an array");
  if (!nodes || !edges) return { ok: false, errors, warnings, nodes: 0, edges: 0, terminals: [] };
  if (!nodes.length) bad("flow has no nodes");

  const stationIds = new Set();
  const programmeIds = new Set();
  if (catalog) {
    for (const s of catalog.stations ?? []) stationIds.add(`${s.app}:${s.id}`);
    for (const c of catalog.curricula ?? []) programmeIds.add(c.id);
    if (!stationIds.size) warnings.push("the catalog handed in lists no stations");
  } else {
    warnings.push("no catalog handed in — station and programme ids were not checked against the roster");
  }

  const seen = new Set();
  for (const n of nodes) {
    const at = `node ${JSON.stringify(n?.id)}`;
    if (!n || typeof n !== "object") { bad("a node is not an object"); continue; }
    if (!isSlug(n.id)) bad(`${at} is not a slug`);
    else if (seen.has(n.id)) bad(`${at} is declared twice`);
    seen.add(n.id);
    if (!NODE_KINDS.includes(n.kind)) { bad(`${at} has kind ${JSON.stringify(n.kind)}, not one of ${NODE_KINDS.join(", ")}`); continue; }
    if (n.kind === "external") {
      if (n.app !== HOST_APP) bad(`${at} is external, so its app must be "${HOST_APP}" — the host runs it`);
      if (typeof n.ref !== "string" || !n.ref.trim()) bad(`${at} is external but names nothing for the host to run`);
      continue;
    }
    if (n.kind === "checkin") {
      if (n.app && !LEARNER_APPS.includes(n.app)) bad(`${at} has app ${JSON.stringify(n.app)}`);
      continue;
    }
    if (n.kind === "gate") {
      const p = n.params ?? {};
      if (typeof p.competency !== "string" || !p.competency.trim()) bad(`${at} is a gate with no params.competency`);
      if (p.rule != null && !GATE_RULES.includes(p.rule)) bad(`${at} gate rule ${JSON.stringify(p.rule)} is not one of ${GATE_RULES.join(", ")}`);
      if (!Array.isArray(p.stations) || !p.stations.length) bad(`${at} is a gate with no params.stations to read evidence from`);
      else if (catalog) {
        for (const ref of p.stations) {
          if (!stationIds.has(`smartcity:${ref}`) && !stationIds.has(`trades:${ref}`)) {
            bad(`${at} gate names station ${JSON.stringify(ref)}, which is not in the catalog`);
          }
        }
      }
      continue;
    }
    const app = n.app ?? "smartcity";
    if (!LEARNER_APPS.includes(app)) bad(`${at} has app ${JSON.stringify(n.app)}, not one of ${LEARNER_APPS.join(", ")}`);
    if (typeof n.ref !== "string" || !n.ref.trim()) { bad(`${at} is a ${n.kind} node with no ref`); continue; }
    if (n.kind === "programme") {
      if (app !== "smartcity") bad(`${at} is a programme node, which only SmartCiti.X runs`);
      if (catalog && !programmeIds.has(n.ref)) bad(`${at} names programme ${JSON.stringify(n.ref)}, which is not in the catalog`);
      continue;
    }
    // station and brief both name a station in one of the learner apps.
    if (catalog && !stationIds.has(`${app}:${n.ref}`)) bad(`${at} names ${app} station ${JSON.stringify(n.ref)}, which is not in the catalog`);
  }

  if (!isSlug(flow.start)) bad(`flow.start ${JSON.stringify(flow.start)} is not a slug`);
  else if (!seen.has(flow.start)) bad(`flow.start names ${JSON.stringify(flow.start)}, which is not a node`);

  for (const e of edges) {
    const at = `edge ${JSON.stringify(e?.from)} -> ${JSON.stringify(e?.to)}`;
    if (!e || typeof e !== "object") { bad("an edge is not an object"); continue; }
    if (!seen.has(e.from)) bad(`${at}: no node ${JSON.stringify(e.from)}`);
    if (!seen.has(e.to)) bad(`${at}: no node ${JSON.stringify(e.to)}`);
    const w = e.when;
    if (w == null) continue;
    if (typeof w !== "object" || Array.isArray(w)) { bad(`${at}: when is not an object`); continue; }
    for (const k of Object.keys(w)) if (!WHEN_KEYS.includes(k)) bad(`${at}: when.${k} is not one of ${WHEN_KEYS.join(", ")}`);
    if ("passed" in w && typeof w.passed !== "boolean") bad(`${at}: when.passed is not a boolean`);
    if ("minStars" in w && (!isInt(w.minStars) || w.minStars < 0 || w.minStars > 3)) bad(`${at}: when.minStars is not 0-3`);
    if ("maxHazards" in w && (!isInt(w.maxHazards) || w.maxHazards < 0)) bad(`${at}: when.maxHazards is not a count`);
    if ("competency" in w && (typeof w.competency !== "string" || !w.competency.trim())) bad(`${at}: when.competency is not a name`);
    if ("custom" in w && !CONDITIONS.has(w.custom)) bad(`${at}: when.custom names ${JSON.stringify(w.custom)}, which no condition implements (have: ${conditionNames().join(", ")})`);
  }

  // An external node is the host's; the flow must be able to come back from it.
  for (const n of nodes) {
    if (n.kind !== "external") continue;
    if (!edgesFrom(flow, n.id).length) {
      warnings.push(`node "${n.id}" is external and terminal — the host's node ends the flow, so nothing waits for a resume`);
    }
  }

  // Every node has to be reachable, and every node with outgoing edges must be
  // able to leave itself: a retry loop is fine, a node whose only edge points
  // back at itself is a dead end that looks like progress.
  const reachable = new Set();
  const walk = [flow.start];
  while (walk.length) {
    const id = walk.pop();
    if (!seen.has(id) || reachable.has(id)) continue;
    reachable.add(id);
    for (const e of edgesFrom(flow, id)) walk.push(e.to);
  }
  for (const n of nodes) if (!reachable.has(n.id)) bad(`node ${JSON.stringify(n.id)} is not reachable from the start`);
  for (const n of nodes) {
    const out = edgesFrom(flow, n.id);
    if (out.length && !out.some((e) => e.to !== n.id)) bad(`node ${JSON.stringify(n.id)} can only ever loop back to itself`);
  }
  const terminals = terminalNodes(flow);
  if (!terminals.length) bad("no node ends the flow — every node has an outgoing edge, so the flow can never finish");

  return { ok: errors.length === 0, errors, warnings, nodes: nodes.length, edges: edges.length, terminals };
}

/**
 * Probe every edge with a spread of plausible outcomes and report which edges
 * a real run could actually take. An edge no outcome selects is a branch the
 * flow's author believes in and the engine will never walk — the checker
 * treats that as a failure.
 */
function edgeCoverage(flow) {
  const probes = [];
  for (const passed of [true, false]) {
    for (const stars of [0, 1, 2, 3]) {
      for (const hazardHits of [0, 1]) {
        for (const competencies of [[], ["*"]]) {
          probes.push({
            passed, stars, hazardHits, seconds: 100, parSeconds: 200,
            interrupts: { total: 1, answered: 1, missed: 0, wrong: 0 }, competencies,
          });
        }
      }
    }
  }
  // A slow, messy run too, so a `custom: "under-par"` / `"clean"` edge and its
  // complement are both probed.
  probes.push({
    passed: true, stars: 2, hazardHits: 0, seconds: 900, parSeconds: 200,
    interrupts: { total: 2, answered: 1, missed: 1, wrong: 0 }, competencies: [],
  });
  const rows = [];
  for (const node of flow.nodes ?? []) {
    const out = edgesFrom(flow, node.id);
    const taken = out.map(() => 0);
    // "*" stands for whatever competency this node's edges ask about, so a
    // gate's held and not-held branches are both probed.
    const asked = out.map((e) => e.when?.competency).filter(Boolean);
    for (const probe of probes) {
      const cs = probe.competencies.includes("*") ? asked : [];
      for (let i = 0; i < out.length; i += 1) {
        if (edgeMatches(out[i], { ...probe, competencies: cs }, { competencies: cs })) { taken[i] += 1; break; }
      }
    }
    out.forEach((e, i) => rows.push({ from: node.id, to: e.to, when: e.when ?? null, why: describeWhen(e.when), hits: taken[i] }));
  }
  return { edges: rows, unreachable: rows.filter((r) => r.hits === 0) };
}

// ------------------------------------------------------------------ run state

/** A fresh run of `flow`, parked on its start node. */
function startRun(flow, { at = Date.now(), source = "host", restarts = 0 } = {}) {
  return {
    protocol: FLOW_PROTOCOL,
    flowId: flow?.id ?? null,
    version: flow?.version ?? null,
    nodeId: flow?.start ?? null,
    startedAt: at, updatedAt: at,
    done: false, source, restarts,
    competencies: [],
    history: [],
  };
}

/** The node the run is parked on. */
function position(run, flow) { return run && flow ? nodeById(flow, run.nodeId) : null; }

/** Every node the run has completed, oldest first. */
function history(run) { return [...(run?.history ?? [])]; }

/** The last branch the run took: where from, where to, and why. */
function branchTaken(run) {
  const last = run?.history?.at(-1);
  if (!last) return null;
  return { from: last.nodeId, to: last.next ?? null, why: last.why ?? null, outcome: last.outcome ?? null };
}

/** Why the run is standing where it is, in words. */
function whyHere(run) {
  const b = branchTaken(run);
  if (!b) return "the flow's start node";
  return b.to ? `${b.from} -> ${b.to}: ${b.why}` : `${b.from} ended the flow: ${b.why}`;
}

/**
 * The path taken, as the rows a panel or a console renders: one per completed
 * node plus the node standing now. Plain data — no markup, no node objects.
 */
function pathTaken(run, flow) {
  const rows = (run?.history ?? []).map((h, i) => {
    const node = nodeById(flow, h.nodeId);
    return {
      index: i, id: h.nodeId, kind: h.kind ?? node?.kind ?? null, app: h.app ?? node?.app ?? null,
      ref: h.ref ?? node?.ref ?? null, label: nodeLabel(node) || h.nodeId,
      passed: h.outcome ? !!h.outcome.passed : null, stars: h.outcome?.stars ?? null,
      why: h.why ?? null, next: h.next ?? null, current: false, at: h.at ?? null,
    };
  });
  if (run && !run.done) {
    const node = position(run, flow);
    rows.push({
      index: rows.length, id: run.nodeId, kind: node?.kind ?? null, app: node?.app ?? null,
      ref: node?.ref ?? null, label: nodeLabel(node) || run.nodeId,
      passed: null, stars: null, why: null, next: null, current: true, at: null,
    });
  }
  return rows;
}

/**
 * Complete the node the run stands on with `outcome` and move. Returns a new
 * run object and the transition, which is exactly what `smartcitix:flow.state`
 * carries.
 */
function advance(run, flow, outcome = {}, ctx = {}) {
  if (!run || !flow || run.done) return { run, transition: null };
  const at = ctx.at ?? Date.now();
  const node = position(run, flow);
  const grants = Array.isArray(outcome.competencies) ? outcome.competencies.filter(Boolean) : [];
  const competencies = [...new Set([...(run.competencies ?? []), ...grants])];
  const step = nextNode(flow, run.nodeId, outcome, { ...ctx, competencies, run, flow });
  const entry = {
    nodeId: run.nodeId, kind: node?.kind ?? null, app: node?.app ?? null, ref: node?.ref ?? null,
    outcome: compactOutcome(outcome), at, next: step.to, why: step.why,
  };
  const next = {
    ...run,
    nodeId: step.to ?? run.nodeId,
    done: step.done,
    updatedAt: at,
    competencies,
    history: [...(run.history ?? []), entry],
  };
  return {
    run: next,
    transition: {
      flowId: flow.id, version: flow.version,
      from: entry.nodeId, to: step.to, done: step.done, why: step.why,
      node: step.node ? publicNode(step.node) : null,
      outcome: entry.outcome,
      branch: step.edge ? { from: step.edge.from, to: step.edge.to, when: step.edge.when ?? null } : null,
      competencies,
    },
  };
}

/** Back to the start, with the restart counted. */
function restartRun(flow, run = null) {
  return startRun(flow, { restarts: (run?.restarts | 0) + 1, source: run?.source ?? "host" });
}

/** The outcome fields a run keeps: an attempt record is durable elsewhere. */
function compactOutcome(outcome = {}) {
  const o = outcome ?? {};
  const keep = {
    passed: !!o.passed, stars: o.stars | 0, hazardHits: o.hazardHits | 0,
    seconds: o.seconds ?? null, parSeconds: o.parSeconds ?? null,
    interrupts: o.interrupts
      ? { total: o.interrupts.total | 0, answered: o.interrupts.answered | 0, missed: o.interrupts.missed | 0, wrong: o.interrupts.wrong | 0 }
      : null,
  };
  if (o.acknowledged) keep.acknowledged = true;
  if (o.gate) {
    keep.gate = true; keep.rule = o.rule ?? null; keep.competency = o.competency ?? null;
    keep.evidence = o.evidence ?? []; keep.source = o.source ?? null;
  }
  if (o.external) { keep.external = true; keep.ref = o.ref ?? null; }
  if (Array.isArray(o.competencies) && o.competencies.length) keep.competencies = [...o.competencies];
  if (typeof o.why === "string") keep.why = o.why;
  return keep;
}

/** The node as it goes over the wire: no functions, nothing app-private. */
function publicNode(node) {
  if (!node) return null;
  return {
    id: node.id, kind: node.kind,
    app: node.app ?? (node.kind === "external" ? HOST_APP : "smartcity"),
    ref: node.ref ?? null, title: node.title ?? null, why: node.why ?? null,
    params: node.params ? { ...node.params } : null,
  };
}

/** What `smartcitix:flow.state` carries. */
function stateMessage(flow, run) {
  const node = position(run, flow);
  return {
    protocol: FLOW_PROTOCOL,
    flowId: flow?.id ?? null, version: flow?.version ?? null, title: flow?.title ?? null,
    nodeId: run?.nodeId ?? null, node: publicNode(node), done: !!run?.done,
    why: whyHere(run), branch: branchTaken(run),
    path: pathTaken(run, flow), competencies: [...(run?.competencies ?? [])],
    restarts: run?.restarts | 0,
  };
}

// -------------------------------------------------------------- serialisation

function flowToJSON(flow, pretty = true) { return JSON.stringify(flow, null, pretty ? 2 : 0); }
function runToJSON(run, pretty = false) { return JSON.stringify(run, null, pretty ? 2 : 0); }

/** Parse a flow from JSON text. Never throws: `{ flow, error }`. */
function flowFromJSON(text) {
  let parsed;
  try { parsed = JSON.parse(String(text ?? "")); }
  catch (err) { return { flow: null, error: `not valid JSON: ${err.message}` }; }
  if (!parsed || typeof parsed !== "object" || Array.isArray(parsed)) return { flow: null, error: "not a flow object" };
  return { flow: parsed, error: null };
}

function runFromJSON(text) {
  let parsed;
  try { parsed = JSON.parse(String(text ?? "")); }
  catch (err) { return { run: null, error: `not valid JSON: ${err.message}` }; }
  if (!parsed || typeof parsed !== "object" || Array.isArray(parsed)) return { run: null, error: "not a run object" };
  if (parsed.protocol != null && parsed.protocol !== FLOW_PROTOCOL) {
    return { run: null, error: `run protocol ${parsed.protocol}, this build speaks ${FLOW_PROTOCOL}` };
  }
  return { run: parsed, error: null };
}

// ---------------------------------------------------- the one store, one key

function emptyStore() { return { protocol: FLOW_PROTOCOL, flows: [], runs: {}, current: null }; }

function storeToJSON(store) { return JSON.stringify(store ?? emptyStore()); }

function storeFromJSON(text) {
  let parsed;
  try { parsed = JSON.parse(String(text ?? "")); } catch (_) { return emptyStore(); }
  if (!parsed || typeof parsed !== "object" || Array.isArray(parsed)) return emptyStore();
  if (parsed.protocol !== FLOW_PROTOCOL) return emptyStore();
  return {
    protocol: FLOW_PROTOCOL,
    flows: Array.isArray(parsed.flows) ? parsed.flows.filter((f) => f && typeof f === "object") : [],
    runs: parsed.runs && typeof parsed.runs === "object" ? { ...parsed.runs } : {},
    current: typeof parsed.current === "string" ? parsed.current : null,
  };
}

/** Add or replace a flow, keeping the rest of the store. */
function upsertFlow(store, flow) {
  const base = store ?? emptyStore();
  const flows = (base.flows ?? []).filter((f) => f.id !== flow.id);
  return { ...base, flows: [...flows, flow], current: base.current ?? flow.id };
}

function putRun(store, run) {
  const base = store ?? emptyStore();
  if (!run?.flowId) return base;
  return { ...base, runs: { ...(base.runs ?? {}), [run.flowId]: run }, current: run.flowId };
}

function dropFlow(store, flowId) {
  const base = store ?? emptyStore();
  const runs = { ...(base.runs ?? {}) }; delete runs[flowId];
  const flows = (base.flows ?? []).filter((f) => f.id !== flowId);
  return { ...base, flows, runs, current: base.current === flowId ? (flows[0]?.id ?? null) : base.current };
}

function flowIn(store, flowId) { return (store?.flows ?? []).find((f) => f.id === flowId) ?? null; }
function runIn(store, flowId) { return store?.runs?.[flowId] ?? null; }

/** The flow and run the learner is on, if any. */
function currentPair(store) {
  const id = store?.current ?? null;
  if (!id) return { flow: null, run: null };
  return { flow: flowIn(store, id), run: runIn(store, id) };
}

function defaultStorage() {
  try { return globalThis.localStorage ?? null; } catch (_) { return null; }
}

/**
 * Read the store from localStorage. Private mode, a blocked origin or a
 * headless run all return an empty store rather than throwing — the same
 * discipline records.js and identity.js use.
 */
function readStore(storage = defaultStorage()) {
  try { return storeFromJSON(storage?.getItem(FLOW_STORE_KEY) ?? null); }
  catch (_) { return emptyStore(); }
}

function writeStore(store, storage = defaultStorage()) {
  try { storage?.setItem(FLOW_STORE_KEY, storeToJSON(store)); return true; }
  catch (_) { return false; }
}

function clearStore(storage = defaultStorage()) {
  try { storage?.removeItem(FLOW_STORE_KEY); return true; } catch (_) { return false; }
}

// ------------------------------------------------------- cross-app hand-off

/**
 * The deep link that carries a flow across the app switch. The three learner
 * apps are three pages on one origin, reached by the portal's own cross-app
 * links; a flow node in another app is that same link with the flow id and the
 * node id on it, and the run itself waits in localStorage under FLOW_STORE_KEY.
 */
function appHref(node, { flowId, nodeId, from = "smartcity" } = {}) {
  const n = node ?? {};
  const app = n.app ?? "smartcity";
  if (!LEARNER_APPS.includes(app) || !n.ref) return null;
  const q = new URLSearchParams();
  if (app === "smartcity") q.set("sim", n.ref);
  else if (app === "trades") q.set("room", n.ref);
  else q.set("station", n.ref);
  if (flowId) q.set("flow", flowId);
  if (nodeId ?? n.id) q.set("node", nodeId ?? n.id);
  const prefix = from === app ? "" : `../${app}/`;
  return `${prefix}index.html?${q.toString()}`;
}

/** `?flow=&node=` off a launch URL — the other half of appHref. */
function parseFlowLink(search = "") {
  let params;
  try { params = new URLSearchParams(search); } catch (_) { return { flowId: null, nodeId: null }; }
  const flowId = params.get("flow");
  const nodeId = params.get("node");
  return { flowId: isSlug(flowId ?? "") ? flowId : null, nodeId: isSlug(nodeId ?? "") ? nodeId : null };
}

// ----------------------------------------------------------------- the runner
//
// The part every app needs and none of them should own a copy of: hold the
// loaded flows, keep the run in the one localStorage key, move when a node
// finishes, run a gate itself, park on an external node, and hand a node in
// another app off to that app's page. It touches no DOM and imports nothing,
// so tools/check_flowhub.mjs drives the whole state machine headless.
//
// The app supplies the four things only it can do:
//   enter(node, { flow, run, href })  -> start this node here, or false
//   onState(state, transition)        -> emit smartcitix:flow.state
//   onExternal(payload)               -> emit smartcitix:flow.external and wait
//   onDone(state)                     -> emit smartcitix:flow.done

function createFlowRunner({
  app = "smartcity",
  enter = null,
  onState = null,
  onExternal = null,
  onDone = null,
  catalog = null,
  storage = undefined,
  now = () => Date.now(),
} = {}) {
  const store = { value: readStore(storage) };
  const save = () => writeStore(store.value, storage);
  let awaitingExternal = null;

  const flowOf = (id) => flowIn(store.value, id ?? store.value.current);
  const runOf = (id) => runIn(store.value, id ?? store.value.current);

  function snapshot(flowId = null) {
    const flow = flowOf(flowId), run = runOf(flowId);
    return flow ? stateMessage(flow, run ?? startRun(flow, { at: now() })) : null;
  }

  function report(transition = null) {
    const state = snapshot();
    if (state) onState?.(state, transition);
    return state;
  }

  /**
   * Stand on `run.nodeId` and do whatever that node means here. A gate is
   * evaluated and stepped through in the same breath (it runs nothing, so
   * leaving a flow parked on one would be a stall the learner cannot clear);
   * an external node is handed back to the host; a node in another app becomes
   * a cross-app link the caller navigates to.
   */
  function settle(transition = null, guard = 0, enterNode = true) {
    const flow = flowOf(), run = runOf();
    if (!flow || !run) return { ok: false, reason: "no flow loaded" };
    if (run.done) {
      save();
      const state = report(transition);
      onDone?.(state);
      return { ok: true, done: true, state };
    }
    const node = position(run, flow);
    if (!node) { save(); return { ok: false, reason: `flow ${flow.id} has no node ${run.nodeId}` }; }
    if (node.kind === "gate") {
      if (guard > (flow.nodes?.length ?? 0) + 4) return { ok: false, reason: "gate chain does not settle" };
      // The hop that arrived at the gate is reported here, because the gate
      // itself is about to move again and the recursion will report that one:
      // every hop is reported exactly once, in order.
      if (transition) report(transition);
      const verdict = evaluateGate(node, run, flow);
      const stepped = advance(run, flow, verdict, { at: now() });
      store.value = putRun(store.value, stepped.run);
      save();
      return settle(stepped.transition, guard + 1, enterNode);
    }
    save();
    if (node.kind === "external") {
      awaitingExternal = { flowId: flow.id, nodeId: node.id };
      const state = report(transition);
      onExternal?.({ flowId: flow.id, version: flow.version, nodeId: node.id, node: publicNode(node), awaiting: "resume", state });
      return { ok: true, external: true, node: publicNode(node), state };
    }
    const state = report(transition);
    const nodeApp = node.app ?? "smartcity";
    const href = nodeApp === app ? null : appHref(node, { flowId: flow.id, nodeId: node.id, from: app });
    // `enterNode: false` moves the run and reports it — which is what the host
    // and the panel need at once — but leaves the learner where they are, so an
    // app can let them read their result before the next node opens. The panel's
    // Continue (resumeHere) is then what enters it.
    if (!enterNode) return { ok: true, node: publicNode(node), href, handled: false, pending: true, state };
    const handled = enter ? enter(node, { flow, run: runOf(), href, state }) : false;
    return { ok: true, node: publicNode(node), href, handled: handled !== false, state };
  }

  return {
    /** Every flow this browser has been handed, in the order they arrived. */
    flows() { return (store.value.flows ?? []).map((f) => ({ ...f })); },
    runs() { return { ...(store.value.runs ?? {}) }; },
    current() {
      const flow = flowOf(), run = runOf();
      return { flow, run, node: position(run, flow), awaitingExternal };
    },
    state(flowId = null) { return snapshot(flowId); },

    /** Rows for a panel: one per loaded flow with where its run stands. */
    rows() {
      return (store.value.flows ?? []).map((flow) => {
        const run = runIn(store.value, flow.id);
        const node = run ? position(run, flow) : nodeById(flow, flow.start);
        return {
          id: flow.id, title: flow.title, version: flow.version,
          current: store.value.current === flow.id,
          started: !!run, done: !!run?.done, restarts: run?.restarts | 0,
          nodeId: run?.nodeId ?? flow.start, nodeKind: node?.kind ?? null,
          nodeLabel: nodeLabel(node), nodeApp: node?.app ?? null,
          why: run ? whyHere(run) : "not started",
          competencies: [...(run?.competencies ?? [])],
          path: pathTaken(run ?? startRun(flow, { at: now() }), flow),
          nodes: (flow.nodes ?? []).length, edges: (flow.edges ?? []).length,
        };
      });
    },

    /**
     * The host (or an instructor) hands over a flow. It is validated against
     * the catalog before anything is stored: a flow naming a station that does
     * not exist is refused with the reasons, never half-loaded.
     */
    load(raw, { validateAgainst = catalog, select = true } = {}) {
      const parsed = typeof raw === "string" ? flowFromJSON(raw) : { flow: raw, error: null };
      if (parsed.error) return { ok: false, errors: [parsed.error], flow: null };
      const verdict = validateFlow(parsed.flow, validateAgainst ?? null);
      if (!verdict.ok) return { ok: false, errors: verdict.errors, warnings: verdict.warnings, flow: null };
      store.value = upsertFlow(store.value, parsed.flow);
      if (select) store.value = { ...store.value, current: parsed.flow.id };
      save();
      return { ok: true, errors: [], warnings: verdict.warnings, flow: parsed.flow, state: snapshot(parsed.flow.id) };
    },

    /** Begin (or restart) a loaded flow and stand on its first node. */
    start(flowId = null, { restart = false } = {}) {
      const flow = flowOf(flowId);
      if (!flow) return { ok: false, reason: `no flow ${flowId ?? "(none selected)"} loaded` };
      const existing = runIn(store.value, flow.id);
      const run = !existing || restart || existing.done
        ? (existing ? restartRun(flow, existing) : startRun(flow, { at: now(), source: "host" }))
        : existing;
      awaitingExternal = null;
      store.value = putRun({ ...store.value, current: flow.id }, run);
      save();
      return settle(null);
    },

    /** Stand on the current node again — the panel's Continue. */
    resumeHere() { awaitingExternal = null; return settle(null); },

    /** The node running here finished. `outcome` is an attempt record or an ack. */
    complete(outcome, { nodeId = null, enterNode = true } = {}) {
      const flow = flowOf(), run = runOf();
      if (!flow || !run || run.done) return { ok: false, reason: "no live flow run" };
      if (nodeId && nodeId !== run.nodeId) return { ok: false, reason: `flow is on ${run.nodeId}, not ${nodeId}` };
      const stepped = advance(run, flow, outcome, { at: now() });
      store.value = putRun(store.value, stepped.run);
      save();
      return settle(stepped.transition, 0, enterNode);
    },

    /**
     * The host finished the external node it was handed. Accepted only for the
     * node the flow is actually parked on, so a stray resume cannot skip a
     * station the learner still owes.
     */
    resume({ nodeId = null, outcome = null } = {}) {
      const flow = flowOf(), run = runOf();
      if (!flow || !run || run.done) return { ok: false, reason: "no live flow run" };
      const node = position(run, flow);
      if (node?.kind !== "external") return { ok: false, reason: `flow is on ${run.nodeId}, which is not an external node` };
      if (nodeId && nodeId !== run.nodeId) return { ok: false, reason: `flow is parked on ${run.nodeId}, not ${nodeId}` };
      awaitingExternal = null;
      const o = { ...outcomeFromRecord(outcome ?? {}), external: true, ref: node.ref ?? null };
      return this.complete(o, { nodeId: run.nodeId });
    },

    /** Restart the current (or named) flow from its start node. */
    restart(flowId = null) { return this.start(flowId, { restart: true }); },

    /** Select a loaded flow without starting it. */
    select(flowId) {
      if (!flowIn(store.value, flowId)) return false;
      store.value = { ...store.value, current: flowId };
      save();
      return true;
    },

    drop(flowId) { store.value = dropFlow(store.value, flowId); save(); return true; },

    /**
     * After an app switch: `?flow=&node=` said which flow and node this page
     * was opened for. The run itself came through localStorage, so all this
     * does is agree with it — and refuse politely when it cannot.
     */
    restore({ flowId = null, nodeId = null } = {}) {
      store.value = readStore(storage);
      if (!flowId) return { ok: false, reason: "no flow id on the link" };
      const flow = flowIn(store.value, flowId);
      if (!flow) return { ok: false, reason: `flow ${flowId} is not in this browser's flow store` };
      const run = runIn(store.value, flowId);
      if (!run) return { ok: false, reason: `flow ${flowId} has no run in progress` };
      if (nodeId && run.nodeId !== nodeId) return { ok: false, reason: `the link asks for ${nodeId}, the run is on ${run.nodeId}` };
      store.value = { ...store.value, current: flowId };
      save();
      const node = position(run, flow);
      return { ok: true, flow, run, node, state: snapshot(flowId) };
    },

    /** Re-read the one key — another app on this origin may have moved the run. */
    reload() { store.value = readStore(storage); return store.value; },
  };
}
