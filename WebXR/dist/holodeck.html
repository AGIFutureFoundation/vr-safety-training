  const id = cleanField(raw?.learner_id, MAX_ID);
  const homePage = cleanOrigin(raw?.learner_home);
  if (!name && !id) return null;
  if (senderOrigin != null && homePage !== senderOrigin) return null;
  return { name: name ?? id, id: id ?? name, homePage, source: senderOrigin == null ? "url" : "message" };
}

const Identity = {
  current: null,

  /** Launch-URL identity first (then scrubbed), else whatever this tab already has. */
  load() {
    let found = null;
    try {
      const params = new URLSearchParams(location.search);
      if (params.has("learner") || params.has("learner_id")) {
        found = parseIdentity({
          learner: params.get("learner"), learner_id: params.get("learner_id"), learner_home: params.get("learner_home"),
        });
        for (const k of ["learner", "learner_id", "learner_home"]) params.delete(k);
        const q = params.toString();
        history.replaceState(null, "", location.pathname + (q ? `?${q}` : "") + location.hash);
      }
    } catch (_) { /* no URL API (headless stub) — fall through */ }
    if (found) this.set(found);
    else {
      try { const saved = JSON.parse(sessionStorage.getItem(IDENTITY_KEY) || "null"); if (saved?.id) this.current = saved; }
      catch (_) { /* ignore */ }
    }
    return this.current;
  },

  set(identity) {
    this.current = identity;
    try { sessionStorage.setItem(IDENTITY_KEY, JSON.stringify(identity)); } catch (_) { /* ignore */ }
  },

  clear() {
    this.current = null;
    try { sessionStorage.removeItem(IDENTITY_KEY); } catch (_) { /* ignore */ }
  },

  /** Accept identity from an embedding page. Returns the unsubscribe function. */
  listen(onChange) {
    const handler = (e) => {
      if (e.data?.type !== MSG_IDENTITY) return;
      const identity = parseIdentity(e.data, e.origin);
      if (!identity) return;
      this.set(identity);
      onChange?.(identity);
    };
    addEventListener("message", handler);
    return () => removeEventListener("message", handler);
  },

  /** True when running inside another page (an LMS iframe, a portal). */
  get embedded() { try { return window.parent !== window; } catch (_) { return false; } },

  /**
   * Post an event to the host page — only when embedded AND the learner's
   * home origin is known, and only to that origin. Never broadcasts.
   */
  emit(type, payload) {
    const target = this.current?.homePage;
    if (!this.embedded || !target) return false;
    try { window.parent.postMessage({ type, ...payload }, target); return true; }
    catch (_) { return false; }
  },

  /** A short crew-tag-sized label for HUDs and leaderboards. */
  tag() {
    const n = this.current?.name;
    return n ? n.replace(/\s+/g, " ").slice(0, 12).toUpperCase() : null;
  },
};


/* ===== shared/auth.js ===== */
/**
 * Sign-in options for a static training page — honestly scoped.
 *
 * These apps are static files. There is no server here, so this module cannot
 * and does not verify anybody: what it does is collect a *credential* from a
 * provider the deployment configured, turn it into the same launch context
 * `identity.js` already understands, and hand the raw token to the host page
 * so a real back end (Cognition.X, an LMS, a union hall's portal) can verify
 * it. `docs/sign-in.md` states which half happens where, in the same words.
 *
 * Four ways in, each only offered when it is actually possible here:
 *
 *   google      Google Identity Services. Needs `googleClientId`. The ID token
 *               is decoded for a display name and subject, never verified —
 *               verification is the host's server's job.
 *   microsoft   MSAL redirect flow. Needs `microsoftClientId` and a tenant.
 *   email       A magic link: one POST to the configured `emailEndpoint`, which
 *               mails a link back to this page carrying ?learner=… . With no
 *               endpoint configured there is nothing to post to, so the option
 *               becomes a device passkey (WebAuthn) instead, labelled "this
 *               device only" because that is exactly what it is.
 *   wallet      Sign-In with Ethereum (EIP-4361): the page builds the message,
 *               the wallet signs it, the identity is the address the wallet
 *               returned. The signature is verified on the host's server.
 *
 * Configuration comes from `WebXR/auth-config.json` beside the page (same
 * origin, no third party) and may be overridden per launch with
 * `?googleClientId=`, `?microsoftClientId=`, `?microsoftTenant=`,
 * `?emailEndpoint=`, `?walletChainId=`, `?learner_home=`.
 *
 * The hard rule, which `tools/check_home.mjs` proves by driving every provider
 * against an empty configuration and counting network attempts: **nothing is
 * ever sent to an endpoint that was not configured.** With no configuration,
 * every provider refuses without touching the network.
 */



/** One versioned key. A shape change gets a new suffix, not a migration. */
const AUTH_KEY = "vr-training-auth-v1";
/**
 * Same-origin, beside the page. The only URL this module reads unprompted — and
 * a page one directory deeper than the config (every app under WebXR/<app>/)
 * passes its own relative path through `makeAuthEnv({ configUrl })`.
 */
const AUTH_CONFIG_URL = "auth-config.json";

/**
 * A page's own configuration path, which may only ever be a relative path on
 * this origin. An absolute URL, a protocol-relative one or a root-absolute one
 * is refused and the default used instead: a launch parameter must not be able
 * to point the configuration read at somebody else's server.
 */
function cleanConfigUrl(v) {
  if (typeof v !== "string") return null;
  const s = v.trim();
  if (!s || s.includes("//") || s.includes(":") || s.startsWith("/")) return null;
  return /^[A-Za-z0-9._/-]{1,120}$/.test(s) ? s : null;
}
const AUTH_MSG_IDENTITY = "smartcitix:identity";
const AUTH_MSG_SIGNOUT = "smartcitix:signout";

/**
 * Every absolute URL this module can ever touch, in one table, so a reader
 * (and a checker) can see the whole network surface at a glance. Each one is
 * reached only from a branch that has already found the matching configured
 * client id — there is no code path from an empty configuration to any of them.
 */
const ENDPOINTS = {
  googleScript: "https://accounts.google.com/gsi/client",
  msalScript: "https://cdn.jsdelivr.net/npm/@azure/msal-browser@3.20.0/lib/msal-browser.min.js",
  msAuthority: "https://login.microsoftonline.com/",
};

// ------------------------------------------------------------------ cleaning

const AUTH_CONTROL_CHARS = new RegExp(`[${String.fromCharCode(0)}-${String.fromCharCode(31)}${String.fromCharCode(127)}]`, "g");

function authText(v, max) {
  if (typeof v !== "string") return "";
  return v.replace(AUTH_CONTROL_CHARS, "").trim().slice(0, max);
}

/** A client id as the providers actually write them: no spaces, no markup. */
function cleanClientId(v) {
  const s = authText(v, 200);
  return /^[A-Za-z0-9._:~-]{8,200}$/.test(s) ? s : null;
}

/** A tenant id, or one of the three Microsoft keywords. */
function cleanTenant(v) {
  const s = authText(v, 64);
  if (["common", "organizations", "consumers"].includes(s)) return s;
  return /^[A-Za-z0-9-]{4,64}$/.test(s) ? s : null;
}

/**
 * An https endpoint with no credentials in it — or null. http is allowed only
 * on localhost, which is the same rule identity.js applies to a home origin.
 */
function cleanHttpsUrl(v) {
  if (typeof v !== "string") return null;
  try {
    const u = new URL(v.trim());
    const local = u.hostname === "localhost" || u.hostname === "127.0.0.1";
    if (u.protocol !== "https:" && !(u.protocol === "http:" && local)) return null;
    if (u.username || u.password) return null;
    return u.href;
  } catch (_) { return null; }
}

/** A chain id as a positive integer, or null. */
function cleanChainId(v) {
  const n = typeof v === "number" ? v : parseInt(String(v ?? ""), 10);
  return Number.isInteger(n) && n > 0 && n < 1e12 ? n : null;
}

/**
 * The deployment's configuration: the file's values, then the launch URL's
 * overrides. Anything that does not clean is dropped, so a malformed value
 * disables its provider rather than half-configuring it.
 */
function parseAuthConfig(file = null, search = "") {
  let params = null;
  try { params = new URLSearchParams(search || ""); } catch (_) { params = null; }
  const pick = (key) => {
    const fromUrl = params?.get(key);
    if (fromUrl != null && fromUrl !== "") return fromUrl;
    return file?.[key];
  };
  const statement = authText(pick("walletStatement"), 200);
  return {
    googleClientId: cleanClientId(pick("googleClientId")),
    microsoftClientId: cleanClientId(pick("microsoftClientId")),
    microsoftTenant: cleanTenant(pick("microsoftTenant")),
    emailEndpoint: cleanHttpsUrl(pick("emailEndpoint")),
    walletChainId: cleanChainId(pick("walletChainId")) ?? 1,
    walletStatement: statement || null,
    // Where a signed-in identity and its token are posted, and the only origin
    // this page will ever post to (identity.js enforces that).
    homePage: cleanOrigin(pick("learner_home") ?? pick("homePage")),
  };
}

/** What a deployment that configured nothing gets. */
const EMPTY_AUTH_CONFIG = parseAuthConfig(null, "");

// ------------------------------------------------------------------- results

/** Refused: nothing happened, and the reason is shown to the learner. */
function authRefuse(provider, reason) { return { kind: "refused", provider, reason }; }
/** Started but not finished here — a redirect, or a link in the post. */
function authPending(provider, note) { return { kind: "pending", provider, note }; }
/** Signed in: an identity, plus the raw token for the host to verify. */
function authAccept(session) { return { kind: "signed-in", provider: session.provider, session }; }

// --------------------------------------------------------------- pure pieces

/** base64url of bytes, without a dependency. */
function authB64url(bytes) {
  let s = "";
  for (const b of new Uint8Array(bytes)) s += String.fromCharCode(b);
  const b64 = typeof btoa === "function" ? btoa(s) : Buffer.from(s, "binary").toString("base64");
  return b64.replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
}

/** A 16-byte nonce as hex — EIP-4361 asks for at least eight alphanumerics. */
function authNonce(crypto = globalThis.crypto) {
  const bytes = new Uint8Array(16);
  if (crypto?.getRandomValues) crypto.getRandomValues(bytes);
  else for (let i = 0; i < bytes.length; i += 1) bytes[i] = Math.floor(Math.random() * 256);
  return [...bytes].map((b) => b.toString(16).padStart(2, "0")).join("");
}

/**
 * A JWT's payload, decoded and NOT verified — the signature is not checked
 * here and cannot be, which is the whole reason the raw token is handed on.
 * Used only for a display name and a subject id.
 */
function decodeJwtPayload(token) {
  if (typeof token !== "string") return null;
  const parts = token.split(".");
  if (parts.length !== 3) return null;
  try {
    const b64 = parts[1].replace(/-/g, "+").replace(/_/g, "/");
    const padded = b64 + "=".repeat((4 - (b64.length % 4)) % 4);
    const raw = typeof atob === "function" ? atob(padded) : Buffer.from(padded, "base64").toString("binary");
    const json = decodeURIComponent([...raw].map((c) => `%${c.charCodeAt(0).toString(16).padStart(2, "0")}`).join(""));
    const claims = JSON.parse(json);
    return claims && typeof claims === "object" ? claims : null;
  } catch (_) { return null; }
}

/** 0x1234…cdef — an address short enough for a HUD. */
function shortAddress(address) {
  const a = String(address ?? "");
  return a.length > 12 ? `${a.slice(0, 6)}…${a.slice(-4)}` : a;
}

/** A 0x-prefixed 20-byte address as the wallet returned it, or null. */
function cleanAddress(v) {
  const s = typeof v === "string" ? v.trim() : "";
  return /^0x[0-9a-fA-F]{40}$/.test(s) ? s : null;
}

/**
 * An EIP-4361 (Sign-In with Ethereum) message, built in the order the
 * specification fixes: the blank-line-delimited statement block is present
 * only when there is a statement, and every field appears once.
 */
function buildSiweMessage({ domain, address, uri, statement = null, chainId = 1, nonce, issuedAt }) {
  if (!domain || !address || !uri || !nonce || !issuedAt) return null;
  const lines = [`${domain} wants you to sign in with your Ethereum account:`, address, ""];
  if (statement) lines.push(statement, "");
  lines.push(`URI: ${uri}`, "Version: 1", `Chain ID: ${chainId}`, `Nonce: ${nonce}`, `Issued At: ${issuedAt}`);
  return lines.join("\n");
}

// --------------------------------------------------------------- environment

/**
 * Everything about the browser this module touches, in one injectable object,
 * so the checker can run every provider headlessly — and so a reader can see
 * the entire outside surface in twenty lines.
 */
function makeAuthEnv(overrides = {}) {
  const g = globalThis;
  const at = (fn, fallback) => { try { return fn() ?? fallback; } catch (_) { return fallback; } };
  return {
    href: at(() => g.location?.href, ""),
    origin: at(() => g.location?.origin, ""),
    host: at(() => g.location?.host, ""),
    search: at(() => g.location?.search, ""),
    ethereum: at(() => g.window?.ethereum ?? g.ethereum, null),
    hasPasskey: typeof g.PublicKeyCredential === "function",
    credentials: at(() => g.navigator?.credentials, null),
    crypto: at(() => g.crypto, null),
    now: () => new Date().toISOString(),
    /** Resolved fetch, or null when the page has none (headless). */
    fetch: typeof g.fetch === "function" ? (...a) => g.fetch(...a) : null,
    /** A provider SDK, loaded only from a branch that found its client id. */
    loadScript: (src) => new Promise((resolve, reject) => {
      const doc = g.document;
      if (!doc) { reject(new Error("no document")); return; }
      const already = doc.querySelector(`script[data-auth-src="${src}"]`);
      if (already) {
        if (already.dataset.authLoaded) resolve(true);
        else already.addEventListener("load", () => resolve(true));
        return;
      }
      const el = doc.createElement("script");
      el.src = src; el.async = true; el.dataset.authSrc = src;
      el.addEventListener("load", () => { el.dataset.authLoaded = "1"; resolve(true); });
      el.addEventListener("error", () => reject(new Error("the provider script did not load")));
      doc.head.appendChild(el);
    }),
    google: at(() => g.google, null),
    msal: at(() => g.msal, null),
    ...overrides,
  };
}

// ----------------------------------------------------------------- providers

async function startGoogle(ctx) {
  const { config, env } = ctx;
  if (!config.googleClientId) {
    return authRefuse("google", "This deployment has no Google client id, so there is nothing to sign in to.");
  }
  try { await env.loadScript(ENDPOINTS.googleScript); } catch (_) { /* checked on the next line */ }
  const api = (env.google ?? globalThis.google)?.accounts?.id;
  if (!api) return authRefuse("google", "The Google Identity Services script did not load in this browser.");
  const credential = await new Promise((resolve) => {
    let settled = false;
    const done = (v) => { if (!settled) { settled = true; resolve(v); } };
    try {
      api.initialize({
        client_id: config.googleClientId, auto_select: false, cancel_on_tap_outside: true,
        callback: (r) => done(typeof r?.credential === "string" ? r.credential : null),
      });
      if (ctx.mount) api.renderButton(ctx.mount, { type: "standard", theme: "filled_black", text: "signin_with", shape: "rectangular" });
      api.prompt?.((n) => { if (n?.isNotDisplayed?.() || n?.isSkippedMoment?.() || n?.isDismissedMoment?.()) done(null); });
    } catch (_) { done(null); }
  });
  if (!credential) return authRefuse("google", "Google sign-in was dismissed.");
  const claims = decodeJwtPayload(credential);
  if (!claims?.sub) return authRefuse("google", "The Google credential carried no account id.");
  return authAccept({
    provider: "google", id: `google:${claims.sub}`,
    name: claims.name || claims.email || `google:${claims.sub}`,
    token: credential, tokenKind: "google-id-token",
    verifiedBy: "host-server", at: env.now(),
  });
}

async function startMicrosoft(ctx) {
  const { config, env } = ctx;
  if (!config.microsoftClientId || !config.microsoftTenant) {
    return authRefuse("microsoft", "This deployment has no Microsoft client id and tenant, so there is nothing to sign in to.");
  }
  try { await env.loadScript(ENDPOINTS.msalScript); } catch (_) { /* checked on the next line */ }
  const lib = env.msal ?? globalThis.msal;
  if (!lib?.PublicClientApplication) return authRefuse("microsoft", "The Microsoft sign-in library did not load in this browser.");
  let app = null;
  try {
    app = new lib.PublicClientApplication({
      auth: { clientId: config.microsoftClientId, authority: ENDPOINTS.msAuthority + config.microsoftTenant, redirectUri: env.href },
      cache: { cacheLocation: "sessionStorage" },
    });
    await app.initialize?.();
  } catch (_) { return authRefuse("microsoft", "Microsoft sign-in could not start in this browser."); }
  let result = null;
  try { result = await app.handleRedirectPromise(); } catch (_) { result = null; }
  const account = result?.account ?? app.getAllAccounts?.()?.[0] ?? null;
  if (account) {
    return authAccept({
      provider: "microsoft",
      id: `microsoft:${account.homeAccountId ?? account.localAccountId ?? account.username}`,
      name: account.name || account.username || "Microsoft account",
      token: result?.idToken ?? null, tokenKind: "microsoft-id-token",
      verifiedBy: "host-server", at: env.now(),
    });
  }
  try { await app.loginRedirect({ scopes: ["openid", "profile", "email"] }); }
  catch (_) { return authRefuse("microsoft", "Microsoft sign-in could not redirect this browser."); }
  return authPending("microsoft", "Redirecting to Microsoft. This page reopens signed in.");
}

/**
 * A passkey on this device. No endpoint, no server, no account anywhere: the
 * credential lives in this browser's authenticator and identifies this device
 * to this origin. Every label in the UI says so.
 */
async function startPasskey(ctx) {
  const { env } = ctx;
  if (!env.hasPasskey || !env.credentials) {
    return authRefuse("passkey", "No e-mail endpoint is configured and this browser has no passkey support, so there is no way to sign in here.");
  }
  const name = authText(ctx.name, 60);
  const challenge = new Uint8Array(32);
  if (env.crypto?.getRandomValues) env.crypto.getRandomValues(challenge);
  const rpId = env.host ? env.host.split(":")[0] : undefined;
  let credential = null;
  if (ctx.existing) {
    try {
      credential = await env.credentials.get({ publicKey: { challenge, rpId, userVerification: "preferred", timeout: 60000 } });
    } catch (_) { return authRefuse("passkey", "This device did not offer a passkey."); }
  } else {
    if (!name) return authRefuse("passkey", "A passkey needs a name to label it with.");
    const userId = new Uint8Array(16);
    if (env.crypto?.getRandomValues) env.crypto.getRandomValues(userId);
    try {
      credential = await env.credentials.create({
        publicKey: {
          challenge, rp: { id: rpId, name: "Training simulators" },
          user: { id: userId, name, displayName: name },
          pubKeyCredParams: [{ type: "public-key", alg: -7 }, { type: "public-key", alg: -257 }],
          authenticatorSelection: { residentKey: "preferred", userVerification: "preferred" },
          timeout: 60000, attestation: "none",
        },
      });
    } catch (_) { return authRefuse("passkey", "The passkey was not created — the prompt was cancelled or refused."); }
  }
  if (!credential?.rawId) return authRefuse("passkey", "This device returned no passkey.");
  return authAccept({
    provider: "passkey", id: `passkey:${authB64url(credential.rawId)}`, name: name || "This device",
    token: null, tokenKind: "none", verifiedBy: "this-device-only", at: env.now(),
  });
}

async function startEmail(ctx) {
  const { config, env } = ctx;
  const endpoint = config.emailEndpoint;
  // No endpoint means there is nowhere to post to, so nothing is posted: the
  // option becomes a device passkey instead. This is the branch the checker
  // drives to prove that an unconfigured deployment makes no request at all.
  if (!endpoint) return startPasskey(ctx);
  const email = authText(ctx.email, 200);
  if (!/^[^\s@]+@[^\s@.]+\.[^\s@]+$/.test(email)) return authRefuse("email", "That does not look like an e-mail address.");
  if (!env.fetch) return authRefuse("email", "This browser cannot send the request.");
  let res = null;
  try {
    res = await env.fetch(endpoint, {
      method: "POST", mode: "cors", credentials: "omit",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ email, returnTo: env.href }),
    });
  } catch (_) { return authRefuse("email", "The sign-in service could not be reached."); }
  if (!res?.ok) return authRefuse("email", "The sign-in service refused the request.");
  return authPending("email", "Check your inbox. The link opens this page already signed in.");
}

async function startWallet(ctx) {
  const { config, env } = ctx;
  const eth = env.ethereum;
  if (!eth?.request) return authRefuse("wallet", "No Ethereum wallet is available in this browser.");
  let accounts = null;
  try { accounts = await eth.request({ method: "eth_requestAccounts" }); }
  catch (_) { return authRefuse("wallet", "The wallet refused the connection."); }
  const address = cleanAddress(Array.isArray(accounts) ? accounts[0] : null);
  if (!address) return authRefuse("wallet", "The wallet returned no account.");
  const message = buildSiweMessage({
    domain: env.host || env.origin, address, uri: env.href || env.origin,
    statement: config.walletStatement
      ?? "Sign in to the training simulators. This signature proves you control this address; it authorises nothing and spends nothing.",
    chainId: config.walletChainId ?? 1, nonce: authNonce(env.crypto), issuedAt: env.now(),
  });
  if (!message) return authRefuse("wallet", "This page could not build a sign-in message.");
  let signature = null;
  try { signature = await eth.request({ method: "personal_sign", params: [message, address] }); }
  catch (_) { return authRefuse("wallet", "The wallet declined to sign."); }
  if (typeof signature !== "string" || !signature) return authRefuse("wallet", "The wallet returned no signature.");
  return authAccept({
    provider: "wallet", id: `eip155:${config.walletChainId ?? 1}:${address}`,
    name: shortAddress(address), address,
    token: { message, signature }, tokenKind: "eip4361",
    verifiedBy: "host-server", at: env.now(),
  });
}

/**
 * The registry. `configured` asks whether this deployment set the option up;
 * `possible` asks whether this browser could do it at all. The dialog lists
 * only the options where both are true, so nothing is offered that cannot
 * work — and each entry carries, in one sentence, where verification happens.
 */
const PROVIDERS = [
  {
    id: "google", label: "Continue with Google", short: "Google",
    note: "Google returns a signed ID token. This page reads your name out of it; your training host verifies the signature.",
    verifies: "host-server",
    configured: (cfg) => !!cfg.googleClientId,
    possible: () => true,
    start: startGoogle,
  },
  {
    id: "microsoft", label: "Continue with Microsoft", short: "Microsoft",
    note: "Your organisation's Microsoft sign-in, by redirect. This page reads your name out of the token; your training host verifies it.",
    verifies: "host-server",
    configured: (cfg) => !!cfg.microsoftClientId && !!cfg.microsoftTenant,
    possible: () => true,
    start: startMicrosoft,
  },
  {
    id: "email", label: "E-mail me a sign-in link", short: "E-mail link",
    note: "One request to your training provider's link service. It mails a link that opens this page signed in.",
    verifies: "host-server",
    configured: (cfg) => !!cfg.emailEndpoint,
    possible: () => true,
    start: startEmail,
    needs: "email",
  },
  {
    id: "passkey", label: "Use a passkey on this device", short: "Passkey",
    note: "This device only. No account is created anywhere and nothing is sent; the passkey identifies this browser on this site so your records carry a name.",
    verifies: "this-device-only",
    // Offered exactly when the e-mail link is not configured: it is that
    // option's fallback, not a fifth way in.
    configured: (cfg) => !cfg.emailEndpoint,
    possible: (env) => !!env.hasPasskey && !!env.credentials,
    start: startPasskey,
    needs: "name",
  },
  {
    id: "wallet", label: "Sign in with Ethereum", short: "Wallet",
    note: "Your wallet signs an EIP-4361 message and the address becomes your learner id. Signature verification happens on your training host's server, not in this page.",
    verifies: "host-server",
    configured: () => true,
    possible: (env) => !!env.ethereum?.request,
    start: startWallet,
  },
];

/** The options to offer here: configured by this deployment, possible in this browser. */
function availableProviders(config = EMPTY_AUTH_CONFIG, env = makeAuthEnv()) {
  return PROVIDERS.filter((p) => p.configured(config) && p.possible(env));
}

/** A provider by id, or null. */
function providerById(id) { return PROVIDERS.find((p) => p.id === id) ?? null; }

// ------------------------------------------------------------------- session

function cleanSession(raw) {
  if (!raw || typeof raw !== "object") return null;
  const id = authText(raw.id, 200);
  const name = authText(raw.name, 60);
  const provider = typeof raw.provider === "string" && /^[a-z]{3,20}$/.test(raw.provider) ? raw.provider : null;
  if (!id || !provider) return null;
  return {
    provider, id, name: name || id,
    address: cleanAddress(raw.address),
    tokenKind: typeof raw.tokenKind === "string" ? raw.tokenKind.slice(0, 40) : "none",
    verifiedBy: raw.verifiedBy === "this-device-only" ? "this-device-only" : "host-server",
    at: typeof raw.at === "string" ? raw.at.slice(0, 40) : null,
    token: raw.token ?? null,
  };
}

const Auth = {
  /** The deployment's configuration, once loaded. */
  config: EMPTY_AUTH_CONFIG,
  /** The signed-in session, or null. */
  session: null,
  env: null,

  /**
   * Read `auth-config.json` beside the page, then apply the launch URL's
   * overrides. The file is same-origin and optional: a deployment that
   * configures nothing simply gets the passkey and wallet options.
   */
  async loadConfig(env = makeAuthEnv()) {
    this.env = env;
    let file = null;
    const configUrl = cleanConfigUrl(env.configUrl) ?? AUTH_CONFIG_URL;
    if (env.fetch) {
      try {
        const res = await env.fetch(configUrl, { cache: "no-cache" });
        if (res?.ok) file = await res.json();
      } catch (_) { file = null; }
    }
    this.config = parseAuthConfig(file && typeof file === "object" ? file : null, env.search);
    return this.config;
  },

  /** The stored session, pushed into Identity so every app sees the learner. */
  load() {
    let saved = null;
    try { saved = JSON.parse(localStorage.getItem(AUTH_KEY) || "null"); } catch (_) { saved = null; }
    const session = cleanSession(saved);
    this.session = session;
    if (session) this.adopt(session, { store: false });
    return session;
  },

  /**
   * Make a session the current identity: stored under the one versioned key,
   * handed to Identity exactly like a launch-URL identity, and posted to the
   * host page (origin-bound, by identity.js) together with the raw token, so a
   * real back end can verify what this page cannot.
   */
  adopt(raw, { store = true } = {}) {
    const session = cleanSession(raw);
    if (!session) return null;
    this.session = session;
    if (store) { try { localStorage.setItem(AUTH_KEY, JSON.stringify(session)); } catch (_) { /* private mode */ } }
    Identity.set({
      name: session.name, id: session.id,
      homePage: this.config?.homePage ?? null,
      source: "auth", provider: session.provider,
    });
    Identity.emit(AUTH_MSG_IDENTITY, {
      learner: session.name, learner_id: session.id, learner_home: this.config?.homePage ?? null,
      provider: session.provider, token: session.token, tokenKind: session.tokenKind,
      verifiedBy: session.verifiedBy,
    });
    return session;
  },

  /** Run one option. Never throws; always returns a result with a reason. */
  async signIn(providerId, opts = {}) {
    const provider = providerById(providerId);
    if (!provider) return authRefuse(String(providerId), "Unknown sign-in option.");
    const env = opts.env ?? this.env ?? makeAuthEnv();
    this.env = env;
    const config = opts.config ?? this.config ?? EMPTY_AUTH_CONFIG;
    if (!provider.configured(config)) return authRefuse(provider.id, `This deployment has not configured ${provider.short}.`);
    if (!provider.possible(env)) return authRefuse(provider.id, `${provider.short} is not available in this browser.`);
    let result;
    try { result = await provider.start({ ...opts, config, env }); }
    catch (_) { return authRefuse(provider.id, `${provider.short} sign-in failed in this browser.`); }
    if (result?.kind === "signed-in") this.adopt(result.session);
    return result;
  },

  /**
   * Sign out. Clears the identity always; clears this browser's training
   * records only when the learner asked for that, because the records are
   * theirs and leaving a kiosk is not the same as discarding them.
   */
  signOut({ clearRecords = false } = {}) {
    Identity.emit(AUTH_MSG_SIGNOUT, { provider: this.session?.provider ?? null });
    this.session = null;
    try { localStorage.removeItem(AUTH_KEY); } catch (_) { /* ignore */ }
    Identity.clear();
    if (clearRecords) TrainingRecords.clear();
    return true;
  },

  /** The one line a HUD shows: who is signed in, and how far that goes. */
  describe() {
    if (!this.session) return null;
    const s = this.session;
    const where = s.verifiedBy === "this-device-only"
      ? "this device only — nothing was sent anywhere"
      : "verified by your training host, not by this page";
    return `${s.name} · ${providerById(s.provider)?.short ?? s.provider} · ${where}`;
  },
};


/* ===== shared/lrs.js ===== */
// Live Learning Record Store connection — the step after exporting xAPI as
// a file. When an LRS endpoint is configured, every finished attempt is
// queued as an xAPI statement and POSTed to `<endpoint>/statements`; the
// queue lives in localStorage so a statement that fails to send (offline
// kiosk, LRS down) is retried on the next attempt, the next page load or a
// manual "send now" — nothing is lost and nothing is sent twice, because
// every statement carries the record's own id and an LRS de-duplicates on
// statement id.
//
// Configuration arrives three ways, all under the deployer's control:
//   1. A form on the Training Records overlay (endpoint + credential),
//      kept per tab in sessionStorage — a credential is never written to
//      localStorage, so it does not outlive the tab.
//   2. The embedding page, via postMessage({ type: "smartcitix:lrs",
//      endpoint, auth }) — accepted only from the learner's home origin
//      (see identity.js), so a stray frame cannot redirect records.
//   3. The launch URL's `lrs_endpoint` param — endpoint only, never a
//      credential, for LRSs that accept unauthenticated statements from a
//      kiosk network. Scrubbed from the address bar like the identity params.
//
// Nothing is queued while unconfigured: an LRS added later gets the local
// history through "Send all", not silently.


const LRS_CONFIG_KEY = "vr-training-lrs-v1";
const LRS_QUEUE_KEY = "vr-training-lrs-queue-v1";
const MSG_LRS = "smartcitix:lrs";
const XAPI_VERSION = "1.0.3";
const MAX_QUEUE = 500;
const SEND_BATCH = 50;

/** An https (or http on localhost) URL with its trailing slash trimmed — or null. */
function cleanEndpoint(v) {
  if (typeof v !== "string") return null;
  try {
    const u = new URL(v.trim());
    const local = u.hostname === "localhost" || u.hostname === "127.0.0.1";
    if (u.protocol !== "https:" && !(u.protocol === "http:" && local)) return null;
    u.hash = ""; u.search = "";
    return u.href.replace(/\/+$/, "");
  } catch (_) { return null; }
}

/**
 * The Authorization header value for a credential typed by a person:
 * "user:secret" becomes Basic, a bare "Basic …"/"Bearer …" is kept, a
 * token with no scheme is treated as Bearer, blank means no header.
 */
function cleanAuth(v) {
  if (typeof v !== "string") return null;
  const s = v.replace(/[\r\n]/g, "").trim();
  if (!s) return null;
  if (/^(basic|bearer)\s+\S/i.test(s)) return s;
  if (s.includes(":")) {
    try { return `Basic ${btoa(unescape(encodeURIComponent(s)))}`; } catch (_) { return null; }
  }
  return `Bearer ${s}`;
}

function loadQueue() {
  try { const q = JSON.parse(localStorage.getItem(LRS_QUEUE_KEY) || "[]"); return Array.isArray(q) ? q : []; }
  catch (_) { return []; }
}
function saveQueue(q) {
  try { q.length ? localStorage.setItem(LRS_QUEUE_KEY, JSON.stringify(q)) : localStorage.removeItem(LRS_QUEUE_KEY); }
  catch (_) { /* private mode */ }
}

const Lrs = {
  config: null,
  /** Outcome of the most recent flush, for the status line: { at, sent, error }. */
  last: null,
  _inFlight: null,

  /** Launch-URL endpoint first (then scrubbed), else whatever this tab already has. */
  load() {
    let fromUrl = null;
    try {
      const params = new URLSearchParams(location.search);
      if (params.has("lrs_endpoint")) {
        fromUrl = cleanEndpoint(params.get("lrs_endpoint"));
        params.delete("lrs_endpoint");
        const q = params.toString();
        history.replaceState(null, "", location.pathname + (q ? `?${q}` : "") + location.hash);
      }
    } catch (_) { /* no URL API */ }
    if (fromUrl) this.configure({ endpoint: fromUrl, auth: null });
    else {
      try { const saved = JSON.parse(sessionStorage.getItem(LRS_CONFIG_KEY) || "null"); if (saved?.endpoint) this.config = saved; }
      catch (_) { /* ignore */ }
    }
    return this.config;
  },

  /** Validate and store. Returns the stored config, or null if the endpoint was unusable. */
  configure({ endpoint, auth } = {}) {
    const clean = cleanEndpoint(endpoint);
    if (!clean) return null;
    this.config = { endpoint: clean, auth: cleanAuth(auth) };
    try { sessionStorage.setItem(LRS_CONFIG_KEY, JSON.stringify(this.config)); } catch (_) { /* ignore */ }
    return this.config;
  },

  disconnect() {
    this.config = null; this.last = null;
    try { sessionStorage.removeItem(LRS_CONFIG_KEY); } catch (_) { /* ignore */ }
  },

  get configured() { return !!this.config?.endpoint; },

  pending() { return loadQueue().length; },

  /** Queue statements for sending. No-op (returns 0) while unconfigured. */
  enqueue(statements) {
    if (!this.configured || !Array.isArray(statements) || !statements.length) return 0;
    const q = loadQueue();
    const have = new Set(q.map((s) => s.id));
    let added = 0;
    for (const s of statements) if (s?.id && !have.has(s.id)) { q.push(s); have.add(s.id); added += 1; }
    if (q.length > MAX_QUEUE) q.splice(0, q.length - MAX_QUEUE);
    saveQueue(q);
    return added;
  },

  /**
   * Send the queue in batches. Resolves { sent, pending, error } — never
   * rejects, so callers can fire-and-forget from a results screen. A
   * failed batch stays queued for next time.
   */
  async flush({ fetch = globalThis.fetch } = {}) {
    if (this._inFlight) return this._inFlight;
    this._inFlight = (async () => {
      let sent = 0, error = null;
      if (!this.configured || typeof fetch !== "function") return { sent, pending: this.pending(), error };
      const { endpoint, auth } = this.config;
      while (true) {
        const q = loadQueue();
        if (!q.length) break;
        const batch = q.slice(0, SEND_BATCH);
        try {
          const headers = { "Content-Type": "application/json", "X-Experience-API-Version": XAPI_VERSION };
          if (auth) headers.Authorization = auth;
          const res = await fetch(`${endpoint}/statements`, { method: "POST", headers, body: JSON.stringify(batch), mode: "cors", credentials: "omit" });
          if (!res.ok) { error = `LRS answered ${res.status}`; break; }
          saveQueue(loadQueue().filter((s) => !batch.some((b) => b.id === s.id)));
          sent += batch.length;
        } catch (err) { error = err?.message ?? String(err); break; }
      }
      this.last = { at: new Date().toISOString(), sent, error };
      return { sent, pending: this.pending(), error };
    })();
    try { return await this._inFlight; } finally { this._inFlight = null; }
  },

  /**
   * Queue attempt records (the shape TrainingRecords.record returns) as
   * xAPI statements and send. Resolves like flush(); no-op while unconfigured.
   */
  ship(records, opts) {
    if (!this.configured) return Promise.resolve({ sent: 0, pending: 0, error: null });
    this.enqueue(toXAPI(records, opts).statements);
    return this.flush();
  },

  /**
   * Accept a configuration from the embedding page — only from the origin
   * `trustedOrigin()` names (the learner's home page). Returns unsubscribe.
   */
  listen(trustedOrigin, onChange) {
    const handler = (e) => {
      if (e.data?.type !== MSG_LRS) return;
      const origin = trustedOrigin?.();
      if (!origin || e.origin !== origin) return;
      const cfg = this.configure({ endpoint: e.data.endpoint, auth: e.data.auth });
      if (cfg) onChange?.(cfg);
    };
    addEventListener("message", handler);
    return () => removeEventListener("message", handler);
  },

  /** Plain data for a status line. */
  status() {
    let host = null;
    try { host = this.config ? new URL(this.config.endpoint).host : null; } catch (_) { /* ignore */ }
    return { configured: this.configured, endpoint: this.config?.endpoint ?? null, host, authed: !!this.config?.auth, pending: this.pending(), last: this.last };
  },
};


/* ===== shared/lessons.js ===== */
/**
 * Lesson automation: turn a sentence into a runnable programme of real
 * stations.
 *
 * The Holodeck could already summon one authored station by name. This is the
 * next thing a training director actually asks for — "put me a lockout
 * refresher together for the third-year apprentices" — which is not one
 * station, it is a sequence of them with a reason for the order, a points
 * target and a pass bar.
 *
 * Nothing here invents content. A lesson is a selection over the station
 * roster the two simulators already ship, scored with the points those
 * stations already award. That matters for a union hall: the certificate at
 * the end has to name procedures that exist and standards that are real.
 */

// What a prompt can ask for, and how to recognise it. Each facet reads the
// station metadata rather than a hand-maintained list, so a station added to
// either app is selectable the day it lands.
const FACETS = [
  { id: "lockout", label: "Energy control and isolation",
    words: ["lockout", "lock out", "loto", "isolation", "isolate", "energy control", "de-energise", "de-energize", "1910.147"],
    match: (s) => /lockout|isolat|energy control|1910\.147|70E|de-?energ/i.test(`${s.certification} ${s.tagline}`) },
  { id: "confined", label: "Permit-required confined space",
    words: ["confined", "permit space", "vault", "manhole", "1910.146", "entry"],
    match: (s) => /confined|permit space|1910\.146|vault|wet well|firebox/i.test(`${s.certification} ${s.tagline}`) },
  { id: "height", label: "Work at height and fall protection",
    words: ["height", "fall", "climb", "tower", "scaffold", "roof", "1926.502", "harness"],
    match: (s) => /fall protection|1926\.502|climb|scaffold|mast|tower|aerial|height/i.test(`${s.certification} ${s.tagline}`) },
  { id: "electrical", label: "Electrical safe work practice",
    words: ["electrical", "arc flash", "70e", "switching", "busway", "transformer", "volt"],
    match: (s) => /NFPA 70E|arc.?flash|1910\.269|switching|busway|kV|volt/i.test(`${s.certification} ${s.tagline}`) },
  { id: "rigging", label: "Rigging, lifting and suspended loads",
    words: ["rigging", "crane", "hoist", "lift", "load chart", "sling", "1926.1400"],
    match: (s) => /rigging|crane|hoist|1926\.1400|load chart|lashing|mooring/i.test(`${s.certification} ${s.tagline}`) },
  { id: "atmosphere", label: "Atmospheric and respiratory hazards",
    words: ["atmosphere", "gas", "respirator", "scba", "hazmat", "1910.134", "chlorine", "h2s"],
    match: (s) => /1910\.134|respirat|atmospher|gas|chlorine|hazmat|decon|abatement/i.test(`${s.certification} ${s.tagline}`) },
  { id: "machine", label: "Machine guarding and automation",
    words: ["machine", "guard", "robot", "press", "conveyor", "cnc", "automation"],
    match: (s) => /machine|guard|robot|press brake|conveyor|CNC|automation/i.test(`${s.certification} ${s.tagline} ${s.category}`) },
  { id: "awareness", label: "Situational awareness under interruption",
    words: ["awareness", "attention", "interruption", "distraction", "noticing"],
    match: (s) => (s.interruptCount ?? 0) > 0 },
];

// Union locals are named on the stations themselves; this pulls the acronym
// out of whatever prose the certification line uses.
const UNION_RE = /\b(IBEW|LIUNA|UA\b|CWA|IATSE|ILWU|IUOE|IUEC|IAFF|IAM|SIU|MEBA|MM&P|ATU|AFSCME|UAW|BMWED|IAEP|Ironworkers|Teamsters|IUPAT)\b/g;

function unionsOf(station) {
  return [...new Set(String(station.certification ?? "").match(UNION_RE) ?? [])];
}

/** Level of the learner the prompt is asking about, which sets the pass bar. */
function audienceOf(lower) {
  if (/apprentice|first year|new hire|intro|basic|onboard/.test(lower)) return { id: "apprentice", label: "Apprentices", pass: 0.6, size: 4 };
  if (/journey|refresher|recert|annual/.test(lower)) return { id: "journeyman", label: "Journeymen", pass: 0.75, size: 5 };
  if (/lead|supervis|foreman|competent person|master/.test(lower)) return { id: "lead", label: "Leads and competent persons", pass: 0.85, size: 6 };
  return { id: "crew", label: "Working crew", pass: 0.7, size: 5 };
}

/**
 * Compose a lesson from a sentence.
 *
 * `roster` is the station metadata both apps already publish — id, name,
 * category, certification, tagline, stepCount, parSeconds and (where known)
 * interruptCount. Returns null when nothing in the sentence names anything
 * the roster can satisfy, because a lesson of arbitrary stations is worse
 * than telling the user it did not understand.
 */
function composeLesson(text, roster, { max = 6 } = {}) {
  const lower = String(text ?? "").toLowerCase();
  const audience = audienceOf(lower);

  const facets = FACETS.filter((f) => f.words.some((w) => lower.includes(w)));
  const askedUnions = [...new Set(lower.toUpperCase().match(UNION_RE) ?? [])];
  const askedCategory = [...new Set(roster.map((s) => s.category).filter(Boolean))]
    .filter((c) => lower.includes(c.toLowerCase().split(" &")[0]));

  if (!facets.length && !askedUnions.length && !askedCategory.length) return null;

  // Score every station against what was asked. Facet match is the strongest
  // signal, then the union, then the sector.
  const scored = roster.map((s) => {
    let score = 0;
    const why = [];
    for (const f of facets) {
      if (f.match(s)) { score += 3; why.push(f.label); }
    }
    const us = unionsOf(s);
    if (askedUnions.length && us.some((u) => askedUnions.includes(u))) { score += 2; why.push(`${us.filter((u) => askedUnions.includes(u)).join(", ")} station`); }
    if (askedCategory.length && askedCategory.includes(s.category)) { score += 2; why.push(s.category); }
    // An interrupted procedure is worth more in any block, because noticing is
    // the part a procedural refresher usually leaves out.
    if ((s.interruptCount ?? 0) > 0) score += 1;
    return { station: s, score, why: [...new Set(why)] };
  }).filter((r) => r.score > 0);

  if (!scored.length) return null;

  // Order by fit, then shortest first, so a block opens with something a
  // learner can finish and builds toward the long procedures.
  scored.sort((a, b) => b.score - a.score || (a.station.stepCount ?? 0) - (b.station.stepCount ?? 0));
  const chosen = scored.slice(0, Math.min(max, audience.size));

  const steps = chosen.reduce((a, r) => a + (r.station.stepCount ?? 0), 0);
  const interrupts = chosen.reduce((a, r) => a + (r.station.interruptCount ?? 0), 0);
  const minutes = Math.round(chosen.reduce((a, r) => a + (r.station.parSeconds ?? 240), 0) / 60);
  // The points a station awards are a hundred per step plus its interruption
  // value; the target is the pass fraction of a clean run across the block.
  const perfect = steps * 100 + interrupts * 120;
  const target = Math.round(perfect * audience.pass);

  const unions = [...new Set(chosen.flatMap((r) => unionsOf(r.station)))];
  // The code, not the sentence around it. Matching to the next comma dragged
  // in half a clause — "NFPA 70E arc-flash PPE for the ve" — which is worse
  // than useless on a certificate.
  const STANDARD_RE = /\b(?:NFPA\s+\d+[A-Z]?|OSHA\s+29\s+CFR\s+[\d.]+(?:\([a-z0-9)(]+\))?|29\s+CFR\s+[\d.]+|ANSI\s+[A-Z]?[\d.]+[A-Z]?|ASTM\s+[A-Z]\d+|IEEE\s+\d+|1910\.\d+|1926\.\d+)/g;
  const standards = [...new Set(chosen.flatMap((r) =>
    (String(r.station.certification ?? "").match(STANDARD_RE) ?? []).map((x) => x.replace(/\s+/g, " ").trim())))]
    .slice(0, 8);

  const title = facets.length
    ? `${facets.map((f) => f.label).join(" + ")} — ${audience.label}`
    : `${(askedCategory[0] ?? unions.join("/"))} block — ${audience.label}`;

  return {
    id: `lesson-${Date.now().toString(36)}`,
    title,
    audience,
    prompt: text,
    facets: facets.map((f) => f.id),
    unions,
    standards,
    stations: chosen.map((r, i) => ({
      order: i + 1,
      app: r.station.app ?? "smartcity",
      id: r.station.id,
      name: r.station.name,
      steps: r.station.stepCount ?? 0,
      interrupts: r.station.interruptCount ?? 0,
      why: r.why.length ? r.why.join(" · ") : "Selected for sector fit",
    })),
    points: { perfect, target, pass: audience.pass },
    estimate: { minutes, steps, interrupts },
  };
}

/**
 * Whether a learner's records clear the lesson.
 *
 * Kept here rather than in the UI so the same arithmetic answers the learner's
 * progress bar, the instructor console and the certificate.
 */
function lessonProgress(lesson, records = []) {
  const best = new Map();
  for (const rec of records) {
    const key = rec.simId ?? rec.roomId ?? rec.id;
    if (!key) continue;
    if (!best.has(key) || (rec.score ?? 0) > best.get(key)) best.set(key, rec.score ?? 0);
  }
  const done = lesson.stations.filter((s) => best.has(s.id));
  const scored = done.reduce((a, s) => a + (best.get(s.id) ?? 0), 0);
  return {
    stationsDone: done.length,
    stationsTotal: lesson.stations.length,
    points: scored,
    target: lesson.points.target,
    passed: done.length === lesson.stations.length && scored >= lesson.points.target,
    pct: lesson.points.target ? Math.min(1, scored / lesson.points.target) : 0,
  };
}


/* ===== shared/variants.js ===== */
/**
 * Assessment variants: the same procedure, a different run.
 *
 * The weakness in any authored simulator is the second attempt. A learner who
 * repeats a station learns the answer key — which control, in which order,
 * with the hint rail naming it — and the score stops measuring competence and
 * starts measuring recall. Every station here is authored, so every station
 * has this problem, and subsetting steps (scenarios.js) does not fix it.
 *
 * A variant changes what the run asks of the learner without ever changing
 * what is correct. That distinction is the whole design:
 *
 *   varied      hints, the alarms that fire and when, the time allowed, and
 *               the order of steps the procedure itself says may be done in
 *               any order
 *   never       the steps, their targets, their kinds, the order of anything
 *               order-critical, the hazards, or the reason any of it is right
 *
 * Reordering a procedure would teach a wrong procedure, so it is not on the
 * list however much it would vary the run. The seed makes a variant
 * reproducible: an instructor can issue the same assessment to a whole
 * apprenticeship and compare like with like.
 */

/** Small deterministic PRNG, so a seed always produces the same variant. */
function rng(seed) {
  let s = (typeof seed === "string"
    ? [...seed].reduce((a, c) => (a * 31 + c.charCodeAt(0)) >>> 0, 7)
    : (seed >>> 0)) || 1;
  return () => {
    s ^= s << 13; s >>>= 0;
    s ^= s >> 17;
    s ^= s << 5; s >>>= 0;
    return s / 4294967296;
  };
}

function shuffle(list, rand) {
  const a = [...list];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(rand() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

const LEVELS = {
  // Hints stay on; this is a practice re-run with a different alarm pattern.
  practice: { id: "practice", name: "Practice variant", hints: true, par: 1.0, interruptScale: 1.0, extraInterrupts: 0 },
  // The assessment a certificate is issued against.
  assessment: { id: "assessment", name: "Assessment run", hints: false, par: 0.85, interruptScale: 0.8, extraInterrupts: 0 },
  // For a learner who has passed and wants the procedure under pressure.
  pressure: { id: "pressure", name: "Under pressure", hints: false, par: 0.7, interruptScale: 0.6, extraInterrupts: 1 },
};

function findLevel(id) {
  return LEVELS[id] ?? LEVELS.assessment;
}

/**
 * Build a variant room from an authored station.
 *
 * Returns a room object of the same shape the Session engine already plays,
 * so nothing downstream — scoring, records, xAPI, the debrief — needs to know
 * it was generated.
 */
function makeVariant(base, { seed = Date.now(), level = "assessment" } = {}) {
  if (!base?.steps?.length) return null;
  const lv = findLevel(level);
  const rand = rng(`${base.id}:${seed}:${lv.id}`);

  const steps = base.steps.map((step) => {
    const out = { ...step };
    // Hints off is the single biggest difference between a practice run and an
    // assessment: with the rail naming the control, the step is a reading test.
    if (!lv.hints) out.noHint = true;
    // Only a sequence the procedure itself marks as order-independent may be
    // shuffled. Anything else is order-critical and shuffling it would be
    // teaching the wrong job.
    if (step.kind === "sequence" && step.anyOrder && Array.isArray(step.targets) && step.targets.length > 2) {
      out.targets = shuffle(step.targets, rand);
    }
    return out;
  });

  // The alarms: which ones fire, hung off different steps, with less time to
  // answer. A learner who has met this station once knows the lock comes off
  // the hasp; they should not know it comes off during step four.
  const stepIds = steps.map((s) => s.id);
  const pool = (base.interrupts ?? []).map((it) => ({ ...it }));
  const chosen = shuffle(pool, rand);
  const interrupts = chosen.map((it) => {
    // Rehang it on a different step, never the step whose own control answers
    // it — that is a nudge rather than an interruption, and the engine's own
    // checker rejects it.
    const candidates = stepIds.filter((id) => {
      const st = steps.find((s) => s.id === id);
      if (!st) return false;
      if (st.target === it.target) return false;
      if ((st.targets ?? []).includes(it.target)) return false;
      return true;
    });
    const after = candidates.length ? candidates[Math.floor(rand() * candidates.length)] : it.after;
    const seconds = Math.max(6, Math.round((it.seconds ?? 12) * lv.interruptScale));
    const delay = Math.max(2, Math.round((it.delay ?? 3) + rand() * 3));
    return { ...it, after, seconds, delay, variantOf: it.after };
  });

  const parSeconds = Math.max(60, Math.round((base.parSeconds ?? 240) * lv.par));

  // How much this station can actually be varied. A procedure with no alarms
  // and no order-independent sequence has nothing to reshuffle, so every seed
  // produces the same run and the UI should say "no hints and a tighter
  // clock" rather than implying the learner has not seen this before.
  const reshuffled = steps.filter((s, i) => Array.isArray(s.targets)
    && s.targets.join() !== (base.steps[i].targets ?? []).join()).length;
  const rehung = interrupts.filter((it) => it.after !== it.variantOf).length;
  const variety = reshuffled + rehung;

  return {
    ...base,
    id: `variant:${base.id}:${lv.id}:${seed}`,
    index: "◆",
    domain: "Assessment",
    name: `${base.name} — ${lv.name}`,
    title: `${base.title ?? base.name} · ${lv.name}`,
    tagline: lv.hints
      ? `${base.name} again, with the alarms in different places.`
      : `${base.name} with no hints, a tighter clock and alarms you have not seen in this order. Same procedure, same answers — you are on your own for which control and when.`,
    parSeconds,
    steps,
    interrupts,
    isVariant: true,
    variant: { baseId: base.id, baseName: base.name, level: lv.id, seed, hints: lv.hints,
      variety, reshuffled, rehung,
      // What is honestly different about this run, for the card the learner reads.
      differs: [
        ...(lv.hints ? [] : ["no hints"]),
        ...(lv.par < 1 ? [`${Math.round((1 - lv.par) * 100)}% tighter clock`] : []),
        ...(rehung ? [`${rehung} alarm${rehung === 1 ? "" : "s"} moved`] : []),
        ...(reshuffled ? [`${reshuffled} sequence${reshuffled === 1 ? "" : "s"} reordered`] : []),
      ] },
    build: (root) => base.build(root),
  };
}

/** A one-line description an instructor can read before issuing it. */
function describeVariant(v) {
  if (!v?.variant) return "";
  const { baseName, level, seed } = v.variant;
  return `${baseName} · ${findLevel(level).name} · seed ${seed} · ${v.steps.length} steps · ${v.interrupts?.length ?? 0} interruptions · par ${v.parSeconds}s`;
}


/* ===== shared/incidents.js ===== */
/**
 * Incident replay: last week's near-miss, run on the station it happened on.
 *
 * A toolbox talk is somebody reading out what went wrong on the job and the
 * crew nodding. Nobody rehearses it, so the next crew meets the same event
 * cold. The platform already owns the hard part — real procedures, in a real
 * scene, with an interruption layer built for exactly this shape of thing
 * (something arrives while you are busy and you have seconds to break off) —
 * so a near-miss report should not need a new station written for it. It
 * needs the station that already exists, with the event dropped in at the
 * step where it happened.
 *
 * What a replay may and may not do is the whole design, and it is the same
 * line variants.js draws:
 *
 *   added       one interruption, hung off the step the report points at,
 *               answered by a control that is already in the scene
 *   never       the steps, their targets, their kinds, their order, the
 *               hazards, or the reason any of it is right
 *
 * The rule holds even when the report contradicts the procedure. If a crew
 * grounded before testing and got away with it, the replay still runs the
 * station's order; what the incident earns is an interruption, not a rewrite.
 * A drill that teaches the job as it was done wrong is worse than no drill.
 *
 * Nothing here writes safety advice. The learner-facing text of a replay is
 * the reporter's own sentence plus, where the answer is a control the station
 * already explains, that station's own words about it. Where neither is
 * available the text stays short and factual — see the `why` built in
 * buildReplay(). Invented lore on a union drill is how a platform loses a
 * hall, and the composeLesson() precedent in lessons.js applies here too:
 * refuse rather than fill in.
 */

// Words that identify nothing. Station ids and names are full of them —
// charge-POINT, valve-VAULT, boiler-ROOM, line-TRUCK — and a report that
// mentions "the room" or "the line" has not named a station. Matching on one
// of these is how a coffee-machine complaint becomes a chlorine drill.
const GENERIC = new Set([
  "point", "line", "cell", "room", "yard", "well", "deck", "access", "watch", "system",
  "station", "plant", "node", "hall", "pit", "ramp", "loft", "guard", "test", "power",
  "pour", "air", "lift", "chamber", "box", "truck", "site", "dock", "depot", "back",
  "fly", "stage", "data", "field", "job", "work", "crew", "shift", "area", "floor",
  "build", "machine",
  // "incident" is what every report in this feature is about, so it cannot be
  // what tells two of them apart. It only became reachable when the first
  // station ids carrying it shipped (critical-incident-debrief,
  // traffic-incident-management), and without it here "summarise last month's
  // incidents" scored as a report against one of them.
  "incident",
]);

const STOP = new Set([
  "the", "a", "an", "and", "or", "but", "of", "on", "in", "at", "to", "for", "with",
  "was", "were", "is", "are", "be", "been", "had", "has", "have", "did", "do", "done",
  "we", "they", "he", "she", "it", "i", "our", "his", "her", "their", "its", "my",
  "that", "this", "there", "then", "than", "so", "as", "by", "from", "up", "off",
  "out", "into", "over", "under", "about", "while", "during", "when", "after",
  "before", "just", "got", "get", "went", "came", "come", "one", "two", "some",
  "last", "week", "today", "morning", "afternoon", "night", "again", "still",
  "monday", "tuesday", "wednesday", "thursday", "friday", "saturday", "sunday",
]);

/**
 * What kind of event a report describes, and what sort of control answers it.
 *
 * `words` recognises the event in the report. `wants` and `alsoWants` are
 * matched against the hit ids the station already registers, so the answer to
 * an injected event is always a control the scene has — this layer never
 * invents an interactable, because a target that is not in the scene is an
 * interruption nobody can answer and the engine scores it as an unsafe action.
 *
 * The two tiers matter more than they look. On a substation, a lock coming
 * off the hasp and a report of the wrong breaker being pulled both match
 * something, but "hold-tag" answers the first and "switching-order" does not;
 * without the split, whichever control happened to be registered first won.
 */
const EVENTS = [
  { id: "energy-control", label: "Energy control",
    words: ["lock", "locks", "hasp", "lockout", "loto", "tag", "tagged", "tagout", "isolation", "re-energised", "re-energized", "reenergised", "energised", "energized", "back on", "switched on", "closed in", "wrong breaker"],
    wants: /lock|hasp|tag/, alsoWants: /isolat|breaker|disconnect|switch|valve/ },
  { id: "comms", label: "Control call",
    words: ["radio", "call", "called", "calling", "phone", "dispatch", "control centre", "control center", "supervisor", "foreman rang", "message"],
    wants: /radio|phone|comm|dispatch/, alsoWants: /handoff|hand-off|log|permit/ },
  { id: "intruder", label: "Somebody in the area",
    words: ["visitor", "walked in", "walked into", "wandered", "unescorted", "public", "bystander", "member of the public", "stranger", "no badge", "tourist", "driver got out"],
    wants: /visitor|figure|barrier|barricade|fence|gate|cone|stand|zone|exclusion/, alsoWants: /badge|permit|suit|hood|spotter|signal/ },
  { id: "atmosphere", label: "Atmosphere",
    words: ["gas", "alarm went off", "h2s", "hydrogen sulphide", "hydrogen sulfide", "oxygen", "fumes", "smoke", "vapour", "vapor", "leak", "chlorine", "co alarm", "monitor alarmed"],
    wants: /gas|meter|monitor|detector|sensor|alarm/, alsoWants: /vent|fan|blower|scba|respirator|mask|purge/ },
  { id: "plant-movement", label: "Plant movement",
    words: ["excavator", "swung", "forklift", "truck reversed", "vehicle", "backed up", "load swung", "crane moved", "started", "start-up", "reversing"],
    wants: /spotter|estop|e-stop|stop|horn|brake|chock/, alsoWants: /barrier|cone|zone|tagline|tag-line|guard|signal/ },
  { id: "dropped", label: "Dropped object",
    words: ["dropped", "fell", "falling", "came loose", "let go", "slipped out", "shackle", "tool fell", "load dropped"],
    wants: /tether|lanyard|net|shackle|hook|latch/, alsoWants: /harness|sling|barrier|cone|rail|zone/ },
  { id: "weather", label: "Weather",
    words: ["wind", "gust", "lightning", "storm", "rain came", "ice", "squall"],
    wants: /wind|weather|anemometer|abort|stop/, alsoWants: /tagline|tag-line|rail|harness|lanyard|chart/ },
  { id: "casualty", label: "Somebody hurt",
    words: ["injured", "hurt", "collapsed", "passed out", "unconscious", "cut himself", "cut herself", "burn", "casualty", "ambulance"],
    wants: /rescue|retrieval|tripod|eyewash|shower|first|kit/, alsoWants: /radio|phone|alarm|patient|stretcher/ },
  { id: "equipment-failure", label: "Equipment failure",
    words: ["burst", "failed", "failure", "tripped", "stopped working", "packed up", "hose", "seal", "pump quit", "breaker tripped", "went dead"],
    wants: /valve|shutoff|shut-off|estop|e-stop|isolat/, alsoWants: /stop|panel|breaker|pump|drain|gauge/ },
  { id: "lone-worker", label: "Left alone",
    words: ["walked off", "left alone", "on his own", "on her own", "nobody watching", "attendant left", "spotter left", "no attendant", "unattended"],
    wants: /spotter|attendant|watch/, alsoWants: /radio|tripod|retrieval|harness|permit/ },
];

const stem = (w) => (w.length > 5 ? w.replace(/(ing|ed|es|s)$/, "") : w);
const wordsOf = (s) => String(s ?? "").toLowerCase().split(/[^a-z0-9]+/).filter(Boolean);
const contentWords = (s) => [...new Set(wordsOf(s).filter((w) => w.length > 2 && !STOP.has(w)).map(stem))];
const deslug = (id) => String(id ?? "").replace(/[-_]/g, " ").trim();

/** One sentence in the reporter's own words, which is the only text a replay can honestly quote. */
function summarise(raw) {
  // Angle brackets are dropped rather than escaped. This text is quoted
  // verbatim into an interruption's alert, and the HUDs that render an alert
  // put it into the page as markup (react-ui.js uses dangerouslySetInnerHTML,
  // so the shared engine's feedback string is trusted by the time it gets
  // there). A crew's report never needs a tag; escaping would put "&lt;" in
  // front of a class, and leaving them in would put whatever was typed into
  // the page. Stripping is the only one of the three that is both safe and
  // readable, and it is done here so every caller gets it.
  const clean = String(raw).replace(/[<>]/g, " ").replace(/\s+/g, " ").trim();
  const cut = clean.length > 220 ? `${clean.slice(0, 217).replace(/\s+\S*$/, "")}…` : clean;
  const cased = cut.charAt(0).toUpperCase() + cut.slice(1);
  return /[.!?…]$/.test(cased) ? cased : `${cased}.`;
}

/**
 * The clause that says when it happened — "while the crew was testing dead".
 *
 * Kept as the reporter's words rather than resolved to a step here, because
 * parseIncident() only sees roster metadata: the steps live on the station
 * module, and buildReplay() is where the hint meets them.
 */
function extractStepHint(lower) {
  const m = lower.match(/\b(?:while|whilst|during|as|when|part ?way through|halfway through|midway through|just after|right after|straight after|after)\b\s+([^.,;]{4,80})/);
  return m ? m[1].replace(/\s+/g, " ").trim() : "";
}

function classify(lower) {
  let best = null, bestScore = 0;
  for (const ev of EVENTS) {
    const score = ev.words.filter((w) => lower.includes(w)).length;
    if (score > bestScore) { best = ev; bestScore = score; }
  }
  return best?.id ?? "unplanned";
}

function findEvent(id) {
  return EVENTS.find((e) => e.id === id) ?? null;
}

/**
 * Which station a report is about.
 *
 * Only the station's own id and name identify it; the trade and tagline break
 * ties. A distinctive word is worth three because "substation" names one
 * station and "line" names nothing, and a station is only returned when it
 * scored on something distinctive — a report has to actually name a station.
 */
function matchStation(lower, roster) {
  const hay = ` ${lower} `;
  const scored = [];
  for (const s of roster) {
    if (!s?.id) continue;
    const nameWords = [...new Set([...wordsOf(s.id), ...wordsOf(s.name)])];
    let score = 0, distinctive = 0;
    const hit = [];
    for (const w of nameWords) {
      if (w.length < 3 || STOP.has(w)) continue;
      if (!new RegExp(`\\b${w}s?\\b`).test(hay)) continue;
      hit.push(w);
      if (GENERIC.has(w)) score += 1;
      else { score += 3; distinctive += 1; }
    }
    // The whole name said out loud — "the trench box job" — is as explicit as
    // a report ever gets. It outranks any amount of incidental word overlap,
    // and it counts as distinctive on its own: "data hall" names a station
    // even though neither of its words does.
    const phrase = String(s.name ?? "").toLowerCase();
    if (phrase && hay.includes(` ${phrase} `)) { score += 6; distinctive += 1; }
    for (const w of contentWords(`${s.trade ?? ""} ${s.tagline ?? ""}`)) {
      if (!GENERIC.has(w) && w.length > 4 && hay.includes(w)) score += 1;
    }
    if (distinctive && score >= 3) scored.push({ station: s, score, hit });
  }
  if (!scored.length) return null;
  scored.sort((a, b) => b.score - a.score || a.station.id.length - b.station.id.length);
  return scored[0].station;
}

/**
 * Read a near-miss report.
 *
 * `roster` is the station metadata both apps publish — id, name, trade,
 * tagline — the same list composeLesson() takes. Returns null when the report
 * names no station on it, which is the common case for the things people type
 * into a box, and is a refusal rather than a failure: a replay of the wrong
 * station teaches the wrong job to the crew it actually happened to.
 *
 * `stepHint` is the reporter's own "while ..." clause, or "" when the report
 * did not say when it happened.
 */
function parseIncident(text, roster = []) {
  const raw = String(text ?? "").replace(/\s+/g, " ").trim();
  if (raw.length < 8 || !Array.isArray(roster) || !roster.length) return null;
  const lower = raw.toLowerCase();
  const station = matchStation(lower, roster);
  if (!station) return null;
  return {
    stationId: station.id,
    stepHint: extractStepHint(lower),
    eventKind: classify(lower),
    summary: summarise(raw),
  };
}

/** Every control the learner could be asked to reach for, with where it came from. */
function controlsOf(base, steps) {
  const out = new Map();
  for (const step of steps) {
    // A `find` step's items are things to notice and report, not controls to
    // operate. Answering an alarm by clicking a cracked insulator is not a
    // response, so they stay out of the pool.
    if (step.kind === "find") continue;
    for (const t of step.targets ?? (step.target ? [step.target] : [])) {
      if (!out.has(t)) out.set(t, { id: t, step, fromInterrupt: false });
    }
  }
  for (const it of base.interrupts ?? []) {
    const known = out.get(it.target);
    if (known) known.fromInterrupt = true;
    else if (it.target) out.set(it.target, { id: it.target, step: null, fromInterrupt: true });
  }
  // Hazard ids are registered in the scene too, and selecting one is normally
  // scored as an unsafe action, so asking for one as the answer would mark a
  // learner down for obeying the drill. The exception is a hazard the station
  // already uses as an interruption target — crane-yard answers "somebody is
  // under the load" with its own swing-radius marker — because there the
  // author has decided the alarm makes that control the right thing to reach
  // for, and the engine routes the selection to the alarm while it is up.
  for (const id of Object.keys(base.hazards ?? {})) {
    if (!out.get(id)?.fromInterrupt) out.delete(id);
  }
  return [...out.values()];
}

/** The step the report points at, and how confident that placement is. */
function placeStep(steps, incident) {
  const hint = contentWords(incident.stepHint);
  const wide = contentWords(incident.summary);
  for (const [words, placement] of [[hint, "hinted"], [wide, "inferred"]]) {
    if (!words.length) continue;
    let best = null, bestScore = 0;
    for (const step of steps) {
      const hay = new Set(contentWords(`${step.id} ${step.title ?? ""} ${step.cue ?? ""}`));
      const score = words.filter((w) => hay.has(w)).length;
      if (score > bestScore) { best = step; bestScore = score; }
    }
    if (best) return { step: best, placement, matched: bestScore };
  }
  // Nothing in the report lines up with anything in the procedure. The event
  // still happened on this station, so the replay is worth running — but it
  // says so rather than implying the middle of the job is where it was.
  return { step: steps[Math.floor(steps.length / 2)], placement: "unplaced", matched: 0 };
}

/**
 * The control that answers the injected event.
 *
 * Ordered by how defensible the answer is: a control the event's own kind
 * points at, then one the station already uses as an interruption answer,
 * then one whose name the report itself uses. Nothing below that — an
 * arbitrary control would make a drill whose right answer has no relation to
 * what happened, and the honest move there is to build no replay at all.
 */
function pickTarget(controls, host, incident) {
  const event = findEvent(incident.eventKind);
  const hostControls = new Set([host.target, ...(host.targets ?? [])].filter(Boolean));
  // Rule two of this layer, and the engine's own checker enforces it as well:
  // an alarm answered by the control the learner already has in their hand is
  // a nudge, not an interruption — there is nothing to break off from.
  const open = controls.filter((c) => !hostControls.has(c.id));
  if (!open.length) return null;

  const said = new Set(contentWords(incident.summary));
  const rank = (c) => {
    let r = 0;
    if (event?.wants?.test(c.id)) r += 5;
    else if (event?.alsoWants?.test(c.id)) r += 3;
    // A control the station itself already uses as an interruption answer is
    // one the author decided is worth breaking off a step for. That is better
    // knowledge about this scene than anything this file can work out, so it
    // scores alongside a direct match on the kind of event.
    if (c.fromInterrupt) r += 3;
    if (contentWords(deslug(c.id)).some((w) => said.has(w))) r += 1;
    return r;
  };
  const ranked = open.map((c) => ({ c, r: rank(c) })).filter((x) => x.r > 0);
  if (!ranked.length) return null;
  ranked.sort((a, b) => b.r - a.r);
  return ranked[0].c;
}

/** What to call a control on screen: the station's own word for it, or its id read out. */
function labelFor(steps, id) {
  for (const step of steps) {
    const named = step.itemNames?.[id];
    if (named) return named;
  }
  // An id like "zone-pt-a" means nothing read out on its own, so the step it
  // belongs to says what it is — the station's words again, not this file's.
  const step = steps.find((s) => s.target === id);
  if (step?.title) return `${deslug(id)} (${step.title.toLowerCase()})`;
  return deslug(id);
}

/**
 * Build a replay room from an authored station and a parsed incident.
 *
 * Returns a room object of the same shape the Session engine already plays,
 * exactly as makeVariant() does, so scoring, records, xAPI and the debrief
 * need to know nothing about where it came from. The station's own steps are
 * copied through untouched and its own interruptions are kept: the only
 * difference between this and the station is one more thing that happens.
 *
 * Returns null when the incident belongs to a different station, or when no
 * control in the scene can be defended as the answer to this event.
 */
function buildReplay(base, incident, { seconds = 12, delay = 3, stage = null } = {}) {
  if (!base?.steps?.length || !incident?.summary) return null;
  // A replay is a claim about a specific job. Building one from an incident
  // parsed against another station would put a real crew's event on the wrong
  // procedure, which is the one mistake this feature cannot make.
  if (incident.stationId && base.id && incident.stationId !== base.id) return null;

  // Trade Skills rooms carry a `title` and no `name`; SmartCiti.X stations
  // carry both and the name is the short one.
  const baseName = base.name ?? base.title ?? base.id;
  const steps = base.steps.map((step) => ({ ...step }));
  const { step: host, placement, matched } = placeStep(steps, incident);
  const target = pickTarget(controlsOf(base, steps), host, incident);
  if (!target) return null;

  const event = findEvent(incident.eventKind);
  const label = labelFor(steps, target.id);
  // The station's own sentence about that control, when it has one. This is
  // the only teaching text in a replay that was not written by the person who
  // reported the incident, and it is quoted rather than paraphrased.
  const stationWhy = target.step && target.step !== host ? target.step.why : "";

  // An event on a step that already has one of the station's own alarms is
  // not a conflict — it is what a busy step is like — but the two should not
  // be racing for the same window, so the reported one arrives first.
  const sharesStep = (base.interrupts ?? []).some((i) => i.after === host.id);

  const taken = new Set((base.interrupts ?? []).map((i) => i.id));
  let id = `incident-${incident.eventKind}`;
  for (let n = 2; taken.has(id); n++) id = `incident-${incident.eventKind}-${n}`;

  const injected = {
    id,
    kind: event?.label ?? "Reported incident",
    after: host.id,
    // Two seconds is the engine's floor for "the learner is busy by now".
    delay: sharesStep ? 2 : Math.max(2, Math.round(delay)),
    // Six seconds is the floor below which this stops measuring noticing and
    // starts measuring reflexes.
    seconds: Math.min(30, Math.max(6, Math.round(seconds))),
    alert: incident.summary,
    cue: "This is the report. Break off the step and deal with it.",
    target: target.id,
    why: stationWhy
      ? `Reported on this job: ${incident.summary} ${stationWhy}`
      : `Reported on this job: ${incident.summary} On this station it is answered at the ${label}.`,
    missNote: `Nothing was done about it and the procedure carried on, which is the part of the report worth rehearsing: ${incident.summary}`,
    wrongNote: `That is not it, and the event is still running. It is answered at the ${label}.`,
    // Where this came from, for the debrief and for anyone auditing a drill
    // that names a real crew's bad day.
    fromIncident: { eventKind: incident.eventKind, placement, stepHint: incident.stepHint },
  };

  const placedNote = placement === "unplaced"
    ? "The report did not say where in the job it happened, so it arrives mid-procedure."
    : `It arrives during "${host.title ?? host.id}", where the report puts it.`;

  return {
    ...base,
    id: `incident:${base.id}:${id}`,
    index: "▲",
    domain: "Incident replay",
    name: `${baseName} — incident replay`,
    title: `${base.title ?? baseName} · incident replay`,
    tagline: `${baseName}, run as authored, with one reported event added. ${placedNote}`,
    steps,
    interrupts: [...(base.interrupts ?? []).map((it) => ({ ...it })), injected],
    isReplay: true,
    replay: {
      baseId: base.id,
      baseName,
      eventKind: incident.eventKind,
      eventLabel: event?.label ?? "Reported incident",
      summary: incident.summary,
      stepHint: incident.stepHint,
      stepId: host.id,
      stepTitle: host.title ?? host.id,
      placement,
      matchedWords: matched,
      interruptId: id,
      target: target.id,
      targetLabel: label,
      seconds: injected.seconds,
      sharesStep,
      // Whether the teaching text leans on the station's own words or only on
      // the report. An instructor reviewing a drill should be able to see
      // which, because "grounded: false" means the answer is defensible but
      // the station never explained that control.
      grounded: !!stationWhy,
      // False means the event will fire with a banner and an unchanged room.
      // A caller that leaves this false is shipping a caption.
      staged: !!stage,
    },
    // `stage` is what makes the event something to notice rather than a
    // caption — see shared/incident-stage.js. It is injected rather than
    // imported so this module stays free of three.js, which is what lets the
    // prompt parser reach parseIncident() without dragging a renderer in.
    build: (root) => {
      const scene = base.build(root);
      return stage ? stage(scene, root, id) : scene;
    },
  };
}

/** A one-line description an instructor can read before issuing it. */
function describeReplay(replay) {
  if (!replay?.replay) return "";
  const r = replay.replay;
  const where = r.placement === "unplaced" ? "no step given" : `at "${r.stepTitle}"`;
  return `${r.baseName} · ${r.eventLabel} ${where} · answered at ${r.target} in ${r.seconds}s · ${replay.steps.length} steps · ${replay.interrupts.length} interruptions`;
}


/* ===== shared/incident-stage.js ===== */
/**
 * The scene half of incident replay: something the learner can see happen.
 *
 * Kept apart from shared/incidents.js on purpose. That module is text and
 * structure only, so the Holodeck prompt parser can call parseIncident()
 * without pulling three.js in behind it; this one builds geometry and is
 * imported by the app that renders. buildReplay() takes it as its `stage`
 * option.
 */

/**
 * Give the injected event something to do in the world.
 *
 * A station's own `onInterrupt` dispatches on the literal ids its author
 * wrote (`if (it.id === "spoil-creeping")`), so an event with a new id fires
 * straight past all of them and the learner gets a banner and an unchanged
 * room — the thing tools/interrupt_react.mjs calls a caption rather than
 * something to notice. Reusing an authored id is not available: the authored
 * interruption is still in the list and a replay is not allowed to remove it.
 *
 * So the replay brings its own object. A beacon on a stand goes up at the
 * edge of the pad, dark for the whole run, lit amber for exactly as long as
 * the reported event is live. It is deliberately not the answer and it does
 * not point at the answer — a beacon says something is happening, not what to
 * do about it, which is the same amount of help the report gave the crew.
 */
function stageReplay(scene, root, interruptId) {
  if (!scene) return scene;
  const stand = group(root, -2.9, 0, -0.4);
  cyl(stand, 0.05, 0.07, 2.0, 0, 1.0, 0, 0x2b3138, { rough: 0.7, metal: 0.4, seg: 10 });
  cyl(stand, 0.26, 0.3, 0.05, 0, 0.025, 0, 0x2b3138, { rough: 0.8, seg: 14 });
  const dark = mat(0x4a3a18, { rough: 0.45 });
  const lit = mat(0xf2a33b, { emissive: 0xf2a33b, ei: 2.2, rough: 0.35 });
  const lamp = ball(stand, 0.11, 0, 2.1, 0, 0x4a3a18, { rough: 0.45, seg: 16 });
  lamp.material = dark;
  cyl(stand, 0.13, 0.13, 0.04, 0, 2.24, 0, 0x2b3138, { rough: 0.7, seg: 14 });

  const priorStart = scene.onInterrupt;
  const priorEnd = scene.onInterruptEnd;
  return {
    ...scene,
    onInterrupt(it) {
      if (typeof priorStart === "function") priorStart.call(scene, it);
      if (it?.id === interruptId) { lamp.material = lit; lamp.scale.setScalar(1.35); }
    },
    onInterruptEnd(it) {
      if (typeof priorEnd === "function") priorEnd.call(scene, it);
      if (it?.id === interruptId) { lamp.material = dark; lamp.scale.setScalar(1); }
    },
  };
}


/* ===== shared/crew.js ===== */
/**
 * Crew roles: the same procedure, split between two people.
 *
 * Several stations in this platform are authored as one learner doing a job
 * that nobody does alone. A confined-space entry has an attendant and an
