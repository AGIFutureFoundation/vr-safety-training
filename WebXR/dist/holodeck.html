      o.boots ?? 0x1b1e22, { rough: 0.85, seg: 10 });
    boot.rotation.x = Math.PI / 2;
    boot.scale.set(0.78, 1, 0.70);
  }
  const head = group(torso, 0, 1.06, 0.01);
  personHead(head, {
    look, helmet: o.hat, cap: o.cap, glasses: o.glasses, respirator: o.respirator,
  });
  const arms = [];
  for (const sx of [-1, 1]) {
    arms.push(personArm(torso, sx, {
      span: 0.166, y: 0.893, sleeve: cloth, skin: look.skin, glove: o.gloves, dress,
    }));
  }
  return { root: g, torso, head, arms };
}

// ------------------------------------------------------------------ particles

/** Cheap additive point burst reused for sparks, steam and water. */
function particles(parent, count, color, o = {}) {
  const positions = new Float32Array(count * 3);
  const geo = track(new THREE.BufferGeometry());
  geo.setAttribute("position", new THREE.BufferAttribute(positions, 3));
  const material = new THREE.PointsMaterial({
    color, size: o.size ?? 0.02, transparent: true, opacity: o.opacity ?? 0.9,
    blending: o.additive === false ? THREE.NormalBlending : THREE.AdditiveBlending,
    depthWrite: false, sizeAttenuation: true,
  });
  material.userData.ownMaterial = true;
  const points = new THREE.Points(geo, material);
  points.frustumCulled = false;
  points.visible = false;
  parent.add(points);
  const life = new Float32Array(count);
  const vel = new Float32Array(count * 3);
  points.userData.step = (dt, origin, spread, speed, gravity) => {
    for (let i = 0; i < count; i++) {
      life[i] -= dt;
      if (life[i] <= 0) {
        life[i] = 0.25 + Math.random() * (o.life ?? 0.6);
        positions[i * 3] = origin.x + (Math.random() - 0.5) * spread;
        positions[i * 3 + 1] = origin.y + (Math.random() - 0.5) * spread;
        positions[i * 3 + 2] = origin.z + (Math.random() - 0.5) * spread;
        vel[i * 3] = (Math.random() - 0.5) * speed;
        vel[i * 3 + 1] = (Math.random() * 0.6 + 0.4) * speed;
        vel[i * 3 + 2] = (Math.random() - 0.5) * speed;
      }
      positions[i * 3] += vel[i * 3] * dt;
      positions[i * 3 + 1] += vel[i * 3 + 1] * dt;
      positions[i * 3 + 2] += vel[i * 3 + 2] * dt;
      vel[i * 3 + 1] += gravity * dt;
    }
    geo.attributes.position.needsUpdate = true;
  };
  return points;
}

/**
 * A one-shot, self-driving particle celebration for "big moment" feedback — a
 * hot-streak step, a rank-up, a personal best. Parented once to `parent` (any
 * static node already in the scene, e.g. the room root); after that, call the
 * returned `fire(localPoint)` whenever the moment happens and call `update(dt)`
 * unconditionally from the render loop — it is a cheap no-op once the burst
 * has finished, so the caller never needs to track whether one is playing.
 */
function celebrationBurst(parent, o = {}) {
  const points = particles(parent, o.count ?? 70, o.color ?? 0xffe37a, {
    size: o.size ?? 0.032, life: o.life ?? 0.6, additive: o.additive !== false, opacity: o.opacity ?? 0.95,
  });
  const origin = new THREE.Vector3();
  let timer = 0;
  return {
    fire(localPoint) {
      origin.copy(localPoint);
      timer = o.duration ?? 0.5;
      points.visible = true;
    },
    update(dt) {
      if (timer <= 0) { if (points.visible) points.visible = false; return; }
      timer -= dt;
      points.userData.step(dt, origin, o.spread ?? 0.1, o.speed ?? 1.6, o.gravity ?? -1.8);
    },
  };
}

// ------------------------------------------------------------------- helpers

function markInteractive(objectOrGroup, id, o = {}) {
  objectOrGroup.userData.hitId = id;
  objectOrGroup.userData.hitLabel = o.label ?? id;
  return objectOrGroup;
}

const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
const lerp = (a, b, t) => a + (b - a) * t;
const easeOut = (t) => 1 - Math.pow(1 - clamp(t, 0, 1), 3);


/* ===== shared/game.js ===== */
// Procedure engine and gamification layer.
//
// A room supplies an ordered list of steps. The engine owns correctness: it
// decides whether an interaction advances the procedure, applies score, and
// produces the coaching line the HUD shows. Rooms never score themselves, so
// the assessment stays deterministic and auditable — the same contract the
// Unity build uses.

const STEP_POINTS = 100;
const WRONG_STEP_PENALTY = 25;
const HAZARD_PENALTY = 50;
const MAX_COMBO = 2.0;
// Noticing an interruption while task-loaded is worth more than a step,
// because it is the harder thing and the one nobody practises. Answering
// quickly is worth more again — the whole measure is how long you took.
const INTERRUPT_POINTS = 120;
const INTERRUPT_SPEED_BONUS = 60;

// Named combo tiers — the HUD shows the label, not just the multiplier, so a
// hot streak reads as a game feel moment rather than an accounting detail.
const COMBO_TIERS = [
  { at: 0, label: "" },
  { at: 1.2, label: "Nice" },
  { at: 1.4, label: "Great" },
  { at: 1.6, label: "Awesome" },
  { at: 1.8, label: "On Fire" },
  { at: MAX_COMBO, label: "Unstoppable" },
];

// One profile, shared on purpose: SmartCiti.X, Trade Skills Simulator and
// Holodeck's real-station mode all import this same module, so a learner's
// XP/level/badges/player name are a single cross-app total rather than
// three separate ones — a room/sim's own record (data.rooms[id]) can't
// collide between apps because every id in the whole vocabulary is unique.
// The key name predates that: it was written when only Trade Skills
// existed. Renamed to say what it actually is now, with a one-time,
// one-way migration from the old key so nobody's saved progress vanishes.
const STORE_KEY = "vr-training-profile-v1";
const LEGACY_STORE_KEY = "trades-sim-v1";
const NAME_KEY = "vr-training-profile-name";
const LEGACY_NAME_KEY = "trades-sim-name";

// ---------------------------------------------------------------- progression

const MAX_BOARD_ENTRIES = 8;

// The account-wide level ladder — one number spanning every room/sim across
// every app sharing this profile, capped at a real endgame rather than
// growing forever. Levels 1-32 use a smooth curve (each level costs more
// than the last); level 33 is the cap — once reached, further XP still
// accumulates (it still counts toward suite standing and leaderboards) but
// no longer raises the level number. Tuned so clearing every sim in the
// current 20-sim SmartCiti.X catalog once (roughly 300 XP each) lands
// solidly in the "Journeyworker" band, leaving "Foreman" and above as a
// real long-term goal — one that gets more reachable, not less, as the
// catalog grows toward its planned 330 sims.
const MAX_LEVEL = 33;
const LEVEL_XP = Array.from({ length: MAX_LEVEL }, (_, i) => Math.round(120 * Math.pow(i, 1.65)));
// Several levels share a tier name, the same way a real trade ladder doesn't
// mint a new title every single level — "through" is the highest level still
// carrying that name.
const LEVEL_TIERS = [
  { through: 4, name: "Trainee" },
  { through: 8, name: "Apprentice" },
  { through: 12, name: "Journeyworker" },
  { through: 16, name: "Technician" },
  { through: 20, name: "Specialist" },
  { through: 24, name: "Foreman" },
  { through: 28, name: "Master" },
  { through: 32, name: "Certified Master" },
  { through: MAX_LEVEL, name: "Legend" },
];

/**
 * Awards every station can earn, judged by the engine itself rather than by
 * a sim's own system — the flipped-classroom mechanic lives here so all
 * three apps reward it identically. Apps merge these into a sim's own
 * badge/challenge list when naming what a run earned.
 */
const UNIVERSAL_AWARDS = [
  {
    id: "prepared", name: "Prepared",
    note: "Studied the pre-brief before the run — learn first, prove it in the sim",
    test: (s) => !!s.prepared,
  },
];
/** Score bonus for a run the learner prepared for (fraction of the run's own score). */
const PREPARED_BONUS = 0.1;

const Progress = {
  data: { xp: 0, rooms: {}, badges: [], boards: {}, briefed: {} },
  playerName: "YOU",

  load() {
    try {
      let raw = JSON.parse(localStorage.getItem(STORE_KEY) || "null");
      if (!raw) {
        const legacy = localStorage.getItem(LEGACY_STORE_KEY);
        if (legacy) { raw = JSON.parse(legacy); localStorage.setItem(STORE_KEY, legacy); }
      }
      if (raw && typeof raw === "object") {
        this.data = {
          xp: raw.xp | 0,
          rooms: raw.rooms && typeof raw.rooms === "object" ? raw.rooms : {},
          badges: Array.isArray(raw.badges) ? raw.badges : [],
          boards: raw.boards && typeof raw.boards === "object" ? raw.boards : {},
          briefed: raw.briefed && typeof raw.briefed === "object" ? raw.briefed : {},
        };
      }
    } catch (_) { /* private mode or blocked storage — run unsaved */ }
    try {
      const savedName = localStorage.getItem(NAME_KEY) ?? localStorage.getItem(LEGACY_NAME_KEY);
      if (savedName) this.playerName = savedName.slice(0, 12);
    } catch (_) { /* ignore */ }
    return this.data;
  },

  setPlayerName(name) {
    this.playerName = (name || "YOU").trim().slice(0, 12).toUpperCase() || "YOU";
    try { localStorage.setItem(NAME_KEY, this.playerName); } catch (_) { /* ignore */ }
  },

  save() {
    try { localStorage.setItem(STORE_KEY, JSON.stringify(this.data)); } catch (_) { /* ignore */ }
  },

  reset() {
    this.data = { xp: 0, rooms: {}, badges: [], boards: {}, briefed: {} };
    try { localStorage.removeItem(STORE_KEY); localStorage.removeItem(LEGACY_STORE_KEY); } catch (_) { /* ignore */ }
  },

  /**
   * Local competitive leaderboard for one simulator: the top runs recorded on
   * this device, arcade-cabinet style. Everyone sharing the machine — a crew,
   * a classroom, a kiosk — competes on the same board under their own name.
   * There is no server: this never leaves the browser.
   */
  leaderboard(simId) {
    return (this.data.boards[simId] ?? []).slice().sort(
      (a, b) => b.score - a.score || a.seconds - b.seconds);
  },

  submitScore(simId, { name, score, seconds, stars }) {
    const board = this.leaderboard(simId);
    const entry = { name: (name || this.playerName).slice(0, 12).toUpperCase(), score, seconds, stars, at: Date.now() };
    board.push(entry);
    board.sort((a, b) => b.score - a.score || a.seconds - b.seconds);
    const trimmed = board.slice(0, MAX_BOARD_ENTRIES);
    this.data.boards[simId] = trimmed;
    this.save();
    const rank = trimmed.indexOf(entry);
    return { rank: rank < 0 ? null : rank + 1, board: trimmed, madeBoard: rank >= 0 };
  },

  /** Combined standing across every simulator this device has played. Pass
   * this app's own room/sim ids to scope it to that app's own catalog —
   * every id in the shared profile is unique, so without a scope this
   * silently spans every app built on this engine, not just the caller's. */
  suiteStanding(ids) {
    const entries = ids ? ids.map((id) => this.data.rooms[id]).filter(Boolean) : Object.values(this.data.rooms);
    let totalScore = 0, totalRuns = 0, totalStars = 0, simsPlayed = 0;
    for (const state of entries) {
      if (!state.runs) continue;
      simsPlayed += 1;
      totalRuns += state.runs | 0;
      totalScore += state.best | 0;
      totalStars += state.stars | 0;
    }
    return { totalScore, totalRuns, totalStars, simsPlayed };
  },

  /** Rooms/sims cleared and stars earned, scoped to one app's own id list —
   * the shared profile's own completedRooms/totalStars getters below are
   * the true cross-network totals; use these two instead anywhere a count
   * is shown against that app's own catalog size (an "X/N" readout), so a
   * learner who has also played a sibling app doesn't see an inflated or
   * over-100% figure. */
  roomsClearedIn(ids) { return ids.filter((id) => (this.data.rooms[id]?.stars ?? 0) > 0).length; },
  starsIn(ids) { return ids.reduce((n, id) => n + (this.data.rooms[id]?.stars ?? 0), 0); },

  get level() {
    let lvl = 1;
    for (let i = 1; i < LEVEL_XP.length; i++) if (this.data.xp >= LEVEL_XP[i]) lvl = i + 1;
    return lvl;
  },
  get maxLevel() { return this.level >= MAX_LEVEL; },
  /** The trade-apprenticeship-style tier name for the current level — several
   * levels share a name (e.g. 9-12 are all "Journeyworker"), the same way a
   * real union ladder doesn't mint a new title every single level. */
  get levelName() {
    const lvl = this.level;
    return LEVEL_TIERS.find((t) => lvl <= t.through)?.name ?? LEVEL_TIERS[LEVEL_TIERS.length - 1].name;
  },
  get xpIntoLevel() {
    const lvl = this.level;
    const base = LEVEL_XP[lvl - 1];
    const next = lvl < MAX_LEVEL ? LEVEL_XP[lvl] : base;
    return { into: this.data.xp - base, span: Math.max(1, next - base) };
  },
  roomState(id) {
    return this.data.rooms[id] || { stars: 0, best: 0, bestTime: null, runs: 0, xp: 0, badges: [] };
  },

  /**
   * Rank inside one simulator's own system. Each area defines its own ladder,
   * so a learner is (say) a Fault Lead on the charge point and still an
   * apprentice in the vault — progression is per trade, not one global level.
   */
  simRank(id, game) {
    const xp = this.roomState(id).xp | 0;
    const marks = game?.rankAt ?? [0, 900, 2200, 4000, 6500];
    const names = game?.ranks ?? ["Apprentice", "Operator", "Technician", "Lead", "Certified"];
    let tier = 0;
    for (let i = 0; i < marks.length; i++) if (xp >= marks[i]) tier = i;
    const next = marks[tier + 1] ?? null;
    return {
      tier, name: names[Math.min(tier, names.length - 1)], xp,
      next, into: xp - marks[tier], span: next == null ? 0 : next - marks[tier],
      max: tier >= marks.length - 1,
    };
  },

  simBadges(id) { return this.roomState(id).badges ?? []; },

  /** Flipped classroom: the learner read a station's pre-brief (its steps and
   * the reason for each) before running it. Stamped once per station; the
   * next Session on that station starts `prepared`. */
  markBriefed(id) {
    if (!this.data.briefed) this.data.briefed = {};
    this.data.briefed[id] = new Date().toISOString();
    this.save();
  },
  isBriefed(id) { return !!this.data.briefed?.[id]; },
  // True cross-network totals — every room/sim ever cleared in any app
  // sharing this profile, not just the caller's own catalog. Use
  // roomsClearedIn()/starsIn() above for an app-scoped "X/N" readout.
  get completedRooms() { return Object.values(this.data.rooms).filter((r) => r.stars > 0).length; },
  get totalStars() { return Object.values(this.data.rooms).reduce((n, r) => n + (r.stars | 0), 0); },

  record(roomId, { score, stars, seconds, badge, earned = [] }) {
    const prev = this.roomState(roomId);
    const badges = [...(prev.badges ?? [])];
    for (const id of earned) if (!badges.includes(id)) badges.push(id);
    const next = {
      stars: Math.max(prev.stars | 0, stars),
      best: Math.max(prev.best | 0, score),
      bestTime: prev.bestTime == null ? seconds : Math.min(prev.bestTime, seconds),
      runs: (prev.runs | 0) + 1,
      xp: (prev.xp | 0) + Math.max(0, score),
      badges,
    };
    this.data.rooms[roomId] = next;
    this.data.xp += Math.max(0, Math.round(score / 8));
    if (badge && !this.data.badges.includes(badge)) this.data.badges.push(badge);
    for (const id of earned) {
      const scoped = `${roomId}:${id}`;
      if (!this.data.badges.includes(scoped)) this.data.badges.push(scoped);
    }
    this.save();
    return next;
  },
};

// ------------------------------------------------------------------ the audio

/** Tiny WebAudio synth — feedback tones with no asset downloads. */
const Sfx = {
  ctx: null,
  muted: false,
  ensure() {
    if (!this.ctx) {
      const Ctor = window.AudioContext || window.webkitAudioContext;
      if (Ctor) this.ctx = new Ctor();
    }
    if (this.ctx?.state === "suspended") this.ctx.resume();
    return this.ctx;
  },
  blip(freq, dur = 0.12, type = "sine", gain = 0.06) {
    if (this.muted) return;
    const ctx = this.ensure();
    if (!ctx) return;
    const osc = ctx.createOscillator();
    const amp = ctx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, ctx.currentTime);
    amp.gain.setValueAtTime(0.0001, ctx.currentTime);
    amp.gain.exponentialRampToValueAtTime(gain, ctx.currentTime + 0.01);
    amp.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + dur);
    osc.connect(amp).connect(ctx.destination);
    osc.start();
    osc.stop(ctx.currentTime + dur + 0.02);
  },
  good() { this.blip(660, 0.09, "triangle"); setTimeout(() => this.blip(990, 0.12, "triangle"), 70); },
  great() { [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => this.blip(f, 0.1, "triangle"), i * 65)); },
  bad() { this.blip(150, 0.22, "sawtooth", 0.05); },
  tick() { this.blip(1200, 0.03, "square", 0.02); },
  alarm() { [0, 1, 2].forEach((i) => setTimeout(() => this.blip(220, 0.16, "square", 0.05), i * 190)); },
};

// ---------------------------------------------------------------- the session

/**
 * One run of one room. `hooks` receives every state change so the HUD, the 3D
 * scene and the audio stay in sync without the engine knowing about any of them.
 */
class Session {
  constructor(room, hooks = {}) {
    this.room = room;
    this.hooks = hooks;
    this.index = 0;
    this.score = 0;
    this.streak = 0;
    this.peakCombo = 1;      // best combo multiplier reached this run
    this.errors = 0;
    this.finished = false;
    this.elapsed = 0;
    this.log = [];
    this.sequence = [];      // progress within a 'sequence' step
    this.holdFor = 0;        // progress within a 'hold' step
    this.holding = false;
    this.gauge = null;       // live gauge state for a 'gauge' step
    this.track = null;       // live state for a 'track' step
    this.turn = null;        // live state for a 'turn' step
    this.stars = 0;
    this.badgeEarned = null;
    this.hazardHits = 0;      // unsafe-action selections in this run
    // Per-step timing and mistakes, so a run can be reviewed step by step
    // rather than as one score. This is what the debrief, the instructor's
    // after-action view and the xAPI statement are all built from.
    this.stepLog = [];
    this.stepStartedAt = 0;
    this.stepErrors = 0;
    this.stepHazards = 0;
    this.gaugeScores = [];    // 0..1 accuracy for each graded skill step
    this.holdBreaks = 0;      // timed steps released early
    this.earned = [];         // per-sim badges and challenges cleared this run
    // Interruptions: things that happen TO the learner mid-procedure and have
    // to be noticed and answered while they are busy with something else. See
    // armInterrupt() below for why this is its own layer and not a step.
    this.interrupts = (room.interrupts ?? []).map((i) => ({ ...i, fired: false, resolved: null }));
    this.activeInterrupt = null;
    this.interruptLog = [];
  }

  /** Mean accuracy across graded steps, 0 when the run had none. */
  get precision() {
    if (!this.gaugeScores.length) return 0;
    return this.gaugeScores.reduce((a, b) => a + b, 0) / this.gaugeScores.length;
  }

  get steps() { return this.room.steps; }
  get step() { return this.steps[this.index] || null; }
  get combo() { return Math.min(MAX_COMBO, 1 + this.streak * 0.1); }
  /** Named tier for the current combo — the HUD shows this, not just the number. */
  get comboLabel() {
    let label = "";
    for (const tier of COMBO_TIERS) if (this.combo >= tier.at) label = tier.label;
    return label;
  }
  get progress01() { return this.steps.length ? this.index / this.steps.length : 0; }

  start() {
    this.elapsed = 0;
    this.stepLog = [];
    this.stepStartedAt = 0;
    this.stepErrors = 0;
    this.stepHazards = 0;
    // Snapshot rank before this run so finish() can tell whether it moved the
    // needle — a rank-up mid-progression is a moment worth celebrating.
    this.rankBefore = this.room.game ? Progress.simRank(this.room.id, this.room.game) : null;
    this.levelBefore = Progress.level;
    this.prepared = Progress.isBriefed(this.room.id);
    this.preparedBonus = 0;
    this.enterStep();
    return this;
  }

  enterStep() {
    const step = this.step;
    // A step's clock starts when the learner arrives at it, not at the run's
    // start, so a slow step is visible even in a fast run.
    this.stepStartedAt = this.elapsed;
    this.stepErrors = 0;
    this.stepHazards = 0;
    this.sequence = [];
    this.holdFor = 0;
    this.holding = false;
    this.gauge = null;
    this.track = null;
    this.turn = null;
    if (!step) return;
    // Anything scheduled to interrupt this step starts its fuse now.
    this.armInterrupt(step.id);
    if (step.kind === "track") {
      const cfg = step.track ?? {};
      this.track = {
        v: cfg.start ?? 0.1,
        green: cfg.green ?? [0.42, 0.62],
        rise: cfg.rise ?? 0.62,
        fall: cfg.fall ?? 0.46,
        drift: cfg.drift ?? 0.1,
        wobble: Math.random() * 6,
        inBand: 0,
        dropouts: 0,
        wasIn: false,
        label: cfg.label ?? "",
        readout: cfg.readout ?? null,
      };
    }
    if (step.kind === "gauge") {
      this.gauge = {
        t: 0, dir: 1,
        speed: step.gauge.speed ?? 0.85,
        green: step.gauge.green ?? [0.44, 0.62],
        label: step.gauge.label ?? "",
        readout: step.gauge.readout ?? null,
        committed: false,
      };
    }
    if (step.kind === "turn") {
      this.turn = {
        amount: 0,
        required: step.turn?.turns ?? 1,
        label: step.turn?.label ?? "",
        readout: step.turn?.readout ?? null,
      };
    }
    this.hooks.onStep?.(step, this);
  }

  /** Player selected an interactable by id. Returns a feedback record. */
  select(hitId) {
    if (this.finished || !this.step) return null;
    // A live alarm takes the next thing the learner touches. That is the
    // whole exercise: break off what you are doing and deal with it.
    if (this.activeInterrupt) return this.resolveInterrupt(hitId);
    const step = this.step;

    if (step.kind === "sequence") return this.selectInSequence(hitId, step);

    if (step.kind === "gauge") {
      if (hitId === step.target || hitId === "gauge-commit") return this.commitGauge();
      return this.wrong(hitId, "Set the gauge first, then commit the reading.");
    }

    if (step.kind === "hold" || step.kind === "track") {
      if (hitId === step.target) return null; // driven by press and release
      return this.wrong(hitId);
    }

    if (step.kind === "turn") {
      if (hitId === step.target) return null; // driven by rotate(), a continuous drag input
      return this.wrong(hitId);
    }

    if (step.kind === "drag") {
      if (hitId === step.target) return null; // driven by dropAt(), a pick-up-and-carry gesture
      return this.wrong(hitId);
    }

    if (step.kind === "find") return this.selectInSequence(hitId, { ...step, anyOrder: true });

    if (hitId === step.target) return this.advance(STEP_POINTS);
    return this.wrong(hitId);
  }

  selectInSequence(hitId, step) {
    if (this.sequence.includes(hitId)) {
      const feedback = { kind: "partial", text: `Already verified — ${step.itemNames?.[hitId] ?? hitId}.` };
      this.hooks.onFeedback?.(feedback, this);
      return feedback;
    }
    // anyOrder steps require completeness, not a particular order: use them where
    // the real procedure has no mandated sequence, and strict order where it does.
    const expected = step.anyOrder
      ? (step.targets.includes(hitId) ? hitId : null)
      : step.targets[this.sequence.length];
    if (hitId === expected) {
      this.sequence.push(hitId);
      const done = this.sequence.length === step.targets.length;
      if (done) return this.advance(STEP_POINTS + 20 * (step.targets.length - 1));
      Sfx.tick();
      const note = step.itemNotes?.[hitId];
      const feedback = {
        kind: "partial",
        text: `<b>${this.sequence.length}/${step.targets.length} — ${step.itemNames?.[hitId] ?? hitId}.</b>` +
          (note ? `<br>${note}` : " Keep going."),
      };
      this.hooks.onFeedback?.(feedback, this);
      return feedback;
    }
    if (step.decoyNotes?.[hitId]) {
      return this.wrong(hitId, step.decoyNotes[hitId]);
    }
    if (step.targets.includes(hitId)) {
      return this.wrong(hitId, step.outOfOrderNote
        ?? "Out of order. Sequence matters here — reset and take them in the required order.", true);
    }
    return this.wrong(hitId);
  }

  /** Called each frame while a 'hold' step's target is held. */
  setHolding(on) {
    if (!this.step) return;
    if (this.step.kind === "track") { this.holding = on; return; }
    if (this.step.kind !== "hold") return;
    this.holding = on;
    if (!on && this.holdFor > 0 && this.holdFor < this.step.seconds) {
      this.holdFor = 0;
      this.holdBreaks += 1;
      const feedback = { kind: "warn", text: `${this.step.holdBreakNote ?? "Released too early — start the full duration again."}` };
      Sfx.bad();
      this.hooks.onFeedback?.(feedback, this);
    }
  }

  commitGauge() {
    const step = this.step;
    if (!this.gauge || this.gauge.committed) return null;
    const [lo, hi] = this.gauge.green;
    const t = this.gauge.t;
    this.gauge.committed = true;
    if (t < lo || t > hi) {
      this.gauge.committed = false;
      return this.wrong(step.target, step.gauge.missNote
        ?? "Outside the acceptable band. Watch the marker and commit inside the green zone.");
    }
    const centre = (lo + hi) / 2;
    const halfBand = (hi - lo) / 2;
    const accuracy = 1 - Math.abs(t - centre) / halfBand;      // 1 at centre, 0 at edge
    this.gaugeScores.push(Math.max(0, accuracy));
    const bonus = Math.round(50 * Math.max(0, accuracy));
    return this.advance(STEP_POINTS + bonus, bonus >= 40 ? "Dead centre." : null);
  }

  /**
   * Continuous rotational input for a 'turn' step — spinning a valve wheel or
   * throwing a switch by dragging it, rather than clicking an abstract target.
   * `deltaTurns` is a signed fraction of one full turn; the UI layer converts a
   * pointer or controller angular delta into this. Turning backward is free —
   * it lets a learner back off an overshoot rather than being penalised for it.
   */
  rotate(hitId, deltaTurns) {
    if (this.finished || !this.step || this.step.kind !== "turn" || hitId !== this.step.target || !this.turn) return null;
    this.turn.amount = Math.max(0, Math.min(this.turn.required, this.turn.amount + deltaTurns));
    if (this.turn.amount >= this.turn.required) return this.advance(STEP_POINTS);
    return null;
  }

  /** Whether `hitId` is a live pick-up point for the current 'drag' step. */
  canDrag(hitId) {
    return !this.finished && this.step?.kind === "drag" && hitId === this.step.target;
  }

  /**
   * Player released a carried object. `distance` is how far, in metres, the
   * drop landed from the step's required socket; pass null for "no useful
   * distance" (also treated as a miss). Unlike a gauge, a drag near-miss costs
   * nothing — carrying something into place is exploratory, not a precision
   * test — the object is expected to spring back to be tried again. Dropping
   * it onto a registered hazard is still scored, through the normal hazard
   * path, by calling wrong() with that hazard's id instead of this method.
   */
  dropAt(hitId, distance) {
    if (this.finished || !this.step || this.step.kind !== "drag" || hitId !== this.step.target) return null;
    const radius = this.step.drag?.radius ?? 0.35;
    if (distance != null && distance <= radius) return this.advance(STEP_POINTS);
    const feedback = { kind: "partial", text: this.step.drag?.missNote ?? "Not quite lined up — line it up with the marker and try again." };
    this.hooks.onFeedback?.(feedback, this);
    return feedback;
  }

  advance(points, extraNote = null) {
    const step = this.step;
    const earned = Math.round(points * this.combo);
    this.score += earned;
    this.streak += 1;
    this.peakCombo = Math.max(this.peakCombo, this.combo);
    this.log.push({ step: step.id, ok: true, points: earned });
    const feedback = {
      kind: "ok",
      points: earned,
      combo: this.combo,
      text: `<b>+${earned} — ${step.title}</b>${this.combo > 1.05 ? ` <span class="mult">×${this.combo.toFixed(1)}</span>` : ""}<br>${extraNote ? extraNote + " " : ""}${step.why}`,
    };
    if (this.combo >= 1.5) Sfx.great(); else Sfx.good();
    this.stepLog.push({
      id: step.id, title: step.title, kind: step.kind,
      seconds: Math.max(0, Math.round((this.elapsed - this.stepStartedAt) * 10) / 10),
      corrections: this.stepErrors, hazards: this.stepHazards,
      clean: this.stepErrors === 0 && this.stepHazards === 0,
      points: earned,
    });
    this.hooks.onFeedback?.(feedback, this);
    this.hooks.onStepComplete?.(step, this);
    this.index += 1;
    if (this.index >= this.steps.length) this.finish();
    else this.enterStep();
    return feedback;
  }

  /** True when `hitId` belongs to a step the learner has not reached yet. */
  isLaterStep(hitId) {
    for (let i = this.index + 1; i < this.steps.length; i++) {
      const s = this.steps[i];
      if (s.target === hitId || s.targets?.includes(hitId)) return s;
    }
    return null;
  }

  wrong(hitId, note = null, isOrderError = false) {
    const hazard = this.room.hazards?.[hitId];
    const later = hazard ? null : this.isLaterStep(hitId);
    const penalty = hazard ? HAZARD_PENALTY : WRONG_STEP_PENALTY;
    this.score = Math.max(0, this.score - penalty);
    this.streak = 0;
    this.errors += 1;
    this.stepErrors += 1;
    if (hazard) this.stepHazards += 1;
    this.log.push({ step: this.step?.id, ok: false, hit: hitId });
    const lateNote = later
      ? (this.room.lateNotes?.[hitId] ?? `That control belongs to a later step. ${this.step?.cue ?? ""}`)
      : null;
    const body = hazard ?? note ?? lateNote ?? `That is not the next control. ${this.step?.cue ?? ""}`;
    const label = hazard ? "Unsafe action"
      : isOrderError ? "Out of sequence"
      : later ? "Too early" : "Wrong step";
    const feedback = {
      kind: hazard ? "danger" : "warn",
      text: `<b>−${penalty} — ${label}</b><br>${body}`,
      // Plain-text version of the same call-out, for apps that speak hazard
      // feedback aloud — the HTML in `text` is fine on a HUD, not in a TTS queue.
      speech: `${label}. ${body}`,
      hazard: !!hazard,
    };
    if (hazard) { this.hazardHits += 1; Sfx.alarm(); this.hooks.onHazard?.(hitId, this); } else Sfx.bad();
    this.hooks.onFeedback?.(feedback, this);
    return feedback;
  }

  /**
   * Interruptions.
   *
   * Every step kind in this engine asks the same question: do you know what
   * comes next. That is worth assessing and it is not what gets people hurt.
   * What gets people hurt is the thing that happens while they are busy —
   * somebody walks into the exclusion zone, a reading drifts out of band, the
   * permit runs out, the radio calls — and the crew is too task-loaded to
   * notice for thirty seconds.
   *
   * So an interruption is not a step. It arrives unannounced partway through
   * a step the learner is already working, it runs on its own clock, and the
   * learner has to break off, deal with it, and come back. The procedure
   * underneath is untouched: the same steps in the same order, still scored
   * the same way. What changes is whether you were paying attention.
   *
   * A station declares them as:
   *
   *   interrupts: [{
   *     id, after: "<stepId>", delay: 4,     // fires 4s into that step
   *     alert: "...",                        // what the learner sees or hears
   *     target: "<hitId>",                   // the right response
   *     seconds: 12,                         // how long they have
   *     why: "...",                          // why that is the right response
   *     missNote: "...",                     // the consequence of not acting
   *     wrongNote: "...",                    // optional, for the wrong control
   *   }]
   *
   * Scoring is deliberately asymmetric. Answering correctly is worth real
   * points because noticing is the skill. Missing it entirely counts as an
   * unsafe action, not an ordinary mistake, because in every case the thing
   * that went unanswered was a safety condition — and that means it lands on
   * hazardHits, which is what the pass rule and the badges key off.
   */
  armInterrupt(stepId) {
    for (const it of this.interrupts) {
      // Leaving a step disarms anything that was waiting on it. An
      // interruption is an event DURING a particular task: if the learner got
      // through that task faster than the fuse, there was no window and it
      // does not happen. Without this, a stale arm fires several steps later,
      // where its alert makes no sense ("somebody took your lock off while you
      // were testing" during the grounding step) and — worse — reaching for
      // the control the current step actually wants is scored as a wrong
      // response to an alarm the learner had no reason to expect.
      if (!it.fired && it.armedAt != null && it.after !== stepId) it.armedAt = null;
      if (!it.fired && it.after === stepId) it.armedAt = this.elapsed + (it.delay ?? 3);
    }
  }

  tickInterrupts(dt) {
    void dt;
    // Fire anything whose moment has come, one at a time — two alarms at once
    // is a different exercise and not one this engine claims to run.
    if (!this.activeInterrupt) {
      const due = this.interrupts.find((i) => !i.fired && i.armedAt != null && this.elapsed >= i.armedAt);
      if (due) {
        due.fired = true;
        due.firedAt = this.elapsed;
        this.activeInterrupt = due;
        Sfx.alarm();
        this.hooks.onInterrupt?.(due, this);
      }
    }
    const it = this.activeInterrupt;
    if (!it) return;
    it.left = Math.max(0, (it.firedAt + (it.seconds ?? 12)) - this.elapsed);
    if (it.left <= 0) this.resolveInterrupt(null);
  }

  /** The learner answered an interruption, or ran out of time (hitId null). */
  resolveInterrupt(hitId) {
    const it = this.activeInterrupt;
    if (!it) return null;
    this.activeInterrupt = null;
    const took = Math.round((this.elapsed - it.firedAt) * 10) / 10;
    const ok = hitId === it.target;
    it.resolved = ok ? "answered" : hitId ? "wrong" : "missed";
    this.interruptLog.push({ id: it.id, alert: it.alert, outcome: it.resolved, seconds: took });

    let feedback;
    if (ok) {
      // Answering fast is worth more, because the whole point is how long it
      // took you to notice.
      const speed = Math.max(0, 1 - took / (it.seconds ?? 12));
      const points = INTERRUPT_POINTS + Math.round(speed * INTERRUPT_SPEED_BONUS);
      this.score += points;
      feedback = { kind: "ok", text: `<b>+${points} — Caught it</b><br>${it.why}`, speech: `Caught it. ${it.why}`, points };
      Sfx.great();
    } else {
      // Both a wrong answer and no answer are unsafe actions: the condition
      // that raised the alarm is still there either way.
      this.score = Math.max(0, this.score - HAZARD_PENALTY);
      this.streak = 0;
      this.errors += 1;
      this.stepErrors += 1;
      this.stepHazards += 1;
      this.hazardHits += 1;
      const body = hitId ? (it.wrongNote ?? it.missNote) : it.missNote;
      const label = hitId ? "Wrong response" : "Missed it";
      feedback = {
        kind: "danger",
        text: `<b>−${HAZARD_PENALTY} — ${label}</b><br>${body}`,
        speech: `${label}. ${body}`,
        hazard: true,
      };
      Sfx.alarm();
      this.hooks.onHazard?.(it.target, this);
    }
    this.hooks.onInterruptEnd?.(it, this);
    this.hooks.onFeedback?.(feedback, this);
    return feedback;
  }

  /** How the run handled its interruptions, for the debrief and the record. */
  interruptSummary() {
    const log = this.interruptLog;
    if (!log.length) return null;
    return {
      total: this.interrupts.length,
      answered: log.filter((l) => l.outcome === "answered").length,
      wrong: log.filter((l) => l.outcome === "wrong").length,
      missed: log.filter((l) => l.outcome === "missed").length,
      slowest: [...log].sort((a, b) => b.seconds - a.seconds)[0] ?? null,
      log,
    };
  }

  tick(dt) {
    if (this.finished) return;
    this.elapsed += dt;
    this.tickInterrupts(dt);
    const step = this.step;
    if (!step) return;

    if (step.kind === "gauge" && this.gauge && !this.gauge.committed) {
      this.gauge.t += this.gauge.dir * this.gauge.speed * dt;
      if (this.gauge.t >= 1) { this.gauge.t = 1; this.gauge.dir = -1; }
      if (this.gauge.t <= 0) { this.gauge.t = 0; this.gauge.dir = 1; }
    }

    if (step.kind === "track" && this.track) {
      const tr = this.track;
      // Press to drive the value up, release to let it fall, with a slow drift
      // the learner has to correct for — the point is holding it steady.
      tr.v += (this.holding ? tr.rise : -tr.fall) * dt;
      tr.v += Math.sin((this.elapsed + tr.wobble) * 1.7) * tr.drift * dt;
      tr.v = Math.max(0, Math.min(1, tr.v));
      const inside = tr.v >= tr.green[0] && tr.v <= tr.green[1];
      if (inside) {
        tr.inBand += dt;
        if (!tr.wasIn) Sfx.tick();
      } else {
        if (tr.wasIn) tr.dropouts += 1;
        tr.inBand = Math.max(0, tr.inBand - dt * 0.8);
      }
      tr.wasIn = inside;
      if (tr.inBand >= step.seconds) {
        const clean = Math.max(0, 40 - tr.dropouts * 12);
        this.advance(STEP_POINTS + 20 + clean,
          tr.dropouts === 0 ? "Held it clean the whole way." : null);
      }
      return;
    }

    if (step.kind === "hold" && this.holding) {
      const before = this.holdFor;
      this.holdFor = Math.min(step.seconds, this.holdFor + dt);
      if (Math.floor(this.holdFor) !== Math.floor(before)) Sfx.tick();
      if (this.holdFor >= step.seconds) {
        this.holding = false;
        this.advance(STEP_POINTS + 25);
      }
    }
  }

  /**
   * The after-action review of this run: every step with the time it took
   * and the mistakes made on it, plus the two questions an instructor asks
   * first — where did it go slowest, and where did it go wrong.
   *
   * Derived from stepLog, so it costs nothing until something asks for it,
   * and it is the same object the results panel, the training record and
   * the xAPI statement all use.
   */
  debrief() {
    const steps = this.stepLog;
    if (!steps.length) return { steps: [], cleanSteps: 0, totalSteps: this.steps.length, slowest: null, worst: null, medianSeconds: 0, interrupts: this.interruptSummary() };
    const byTime = [...steps].sort((a, b) => b.seconds - a.seconds);
    const byTrouble = [...steps].sort((a, b) => (b.hazards * 10 + b.corrections) - (a.hazards * 10 + a.corrections));
    const sorted = [...steps].map((s) => s.seconds).sort((a, b) => a - b);
    const mid = Math.floor(sorted.length / 2);
    return {
      steps,
      totalSteps: this.steps.length,
      cleanSteps: steps.filter((s) => s.clean).length,
      interrupts: this.interruptSummary(),
      slowest: byTime[0] ?? null,
      worst: byTrouble[0]?.corrections || byTrouble[0]?.hazards ? byTrouble[0] : null,
      medianSeconds: sorted.length % 2 ? sorted[mid] : Math.round(((sorted[mid - 1] + sorted[mid]) / 2) * 10) / 10,
    };
  }

  finish() {
    if (this.finished) return;
    this.finished = true;
    const par = this.room.parSeconds ?? 150;
    const timeBonus = Math.max(0, Math.round((par - this.elapsed) * 2));
    this.score += timeBonus;
    this.timeBonus = timeBonus;
    if (this.prepared) {
      this.preparedBonus = Math.round(this.score * PREPARED_BONUS);
      this.score += this.preparedBonus;
    }
    this.stars = this.errors === 0 && this.elapsed <= par ? 3
      : this.errors <= 1 && this.elapsed <= par * 1.5 ? 2 : 1;
    if (this.stars === 3 && this.room.badge) this.badgeEarned = this.room.badge.id;

    // Engine-wide awards first, then each simulator judges its own badges
    // and challenges against this run.
    for (const award of UNIVERSAL_AWARDS) if (award.test(this)) this.earned.push(award.id);
    const system = this.room.game;
    if (system) {
      for (const award of [...(system.badges ?? []), ...(system.challenges ?? [])]) {
        try {
          if (award.test?.(this)) this.earned.push(award.id);
        } catch (_) { /* a broken predicate must not break the run */ }
      }
    }

    const summary = Progress.record(this.room.id, {
      score: this.score, stars: this.stars, seconds: Math.round(this.elapsed),
      badge: this.badgeEarned, earned: this.earned,
    });
    this.rank = Progress.simRank(this.room.id, system);
    this.rankedUp = !!(this.rankBefore && this.rank.tier > this.rankBefore.tier);
    this.level = Progress.level;
    this.levelName = Progress.levelName;
    this.leveledUp = this.level > this.levelBefore;
    this.leaderboard = Progress.submitScore(this.room.id, {
      score: this.score, seconds: Math.round(this.elapsed), stars: this.stars,
    });
    Sfx.great();
    this.hooks.onFinish?.(this, summary);
  }
}


/* ===== shared/voice-assist.js ===== */
// Text-to-speech helper shared by every app's voice layer. This is purely
// assistive narration — reading back a hint, a room briefing, or progress —
// never a way to perform a step. The hands-on click/drag/turn stays the only
// way to actually advance a procedure; speaking to the app only ever tells
// you things, it never does things for you.

const speechSupported = typeof window !== "undefined" && "speechSynthesis" in window;

/**
 * Speak a line, cancelling whatever the app was already saying so responses
 * never queue up and talk over the run. Silently does nothing where speech
 * synthesis isn't available (older browsers, headless test runners) so
 * callers never need their own support check.
 */
function speak(text, { rate = 1, pitch = 1 } = {}) {
  if (!speechSupported || !text) return false;
  const synth = window.speechSynthesis;
  synth.cancel();
  const utterance = new SpeechSynthesisUtterance(text);
  utterance.rate = rate;
  utterance.pitch = pitch;
  synth.speak(utterance);
  return true;
}

function stopSpeaking() {
  if (speechSupported) window.speechSynthesis.cancel();
}


/* ===== shared/records.js ===== */
// Training records — the auditable attempt log an employer, union hall or
// LMS actually needs from a simulator, as opposed to the gamified profile in
// game.js (XP, ranks, leaderboards) which is there to motivate.
//
// Every finished run appends one immutable entry. Entries carry what an
// assessment record needs (station, category, the real certification the
// station maps to, score, stars, corrections, unsafe actions, time vs par,
// pass/fail against a stated rule) and nothing it must not (no biometrics,
// no free text beyond the learner's own crew tag). Storage is this browser
// only, like everything else in these apps; export is the hand-off — CSV for
// a spreadsheet or HR system, xAPI 1.0.3 statements for a Learning Record
// Store.
//
// Shared by every app on this engine; SmartCiti.X is the first to wire it.

const RECORDS_KEY = "vr-training-records-v1";
const MAX_ENTRIES = 1000;

/**
 * The pass rule, stated once so the results card, the export and the
 * summary can never disagree: no unsafe action, at most one correction,
 * and finished inside 1.5x par (which is exactly the engine's 2-star
 * threshold, so stars >= 2 already encodes the time and correction limits).
 */
function passed(entry) {
  return (entry.stars | 0) >= 2 && (entry.hazardHits | 0) === 0;
}

/**
 * The interruption tally, lifted onto the record itself from the session's
 * interruptSummary (game.js) rather than left buried in `debrief.interrupts`.
 *
 * The competency layer (shared/competency.js) asks "was every interruption
 * answered" of every record it judges, and a proof rule should not have to
 * dig through a debrief object — nor should it break on a record written
 * before the debrief existed. `null` means no interruption fired in that run,
 * which the mastery rule reads as nothing to answer.
 */
function interruptTally(entry) {
  const iv = entry?.interrupts ?? entry?.debrief?.interrupts;
  if (!iv) return null;
  return { answered: iv.answered | 0, wrong: iv.wrong | 0, missed: iv.missed | 0 };
}

function loadRecords() {
  try {
    const raw = JSON.parse(localStorage.getItem(RECORDS_KEY) || "[]");
    return Array.isArray(raw) ? raw : [];
  } catch (_) { return []; }
}

function saveRecords(list) {
  try { localStorage.setItem(RECORDS_KEY, JSON.stringify(list)); } catch (_) { /* private mode — run unsaved */ }
}

const TrainingRecords = {
  /** Oldest first. */
  list() { return loadRecords(); },

  count() { return loadRecords().length; },

  /**
   * Append one attempt. `entry` is the plain data a finished Session yields
   * (see SmartCiti.X's showResults); this adds the id, timestamp and the
   * pass verdict so callers never compute it themselves.
   */
  record(entry) {
    const list = loadRecords();
    const full = {
      id: `${Date.now().toString(36)}-${Math.random().toString(36).slice(2, 8)}`,
      at: new Date().toISOString(),
      ...entry,
    };
    full.passed = passed(full);
    full.interrupts = interruptTally(full);
    list.push(full);
    if (list.length > MAX_ENTRIES) list.splice(0, list.length - MAX_ENTRIES);
    saveRecords(list);
    return full;
  },

  clear() { try { localStorage.removeItem(RECORDS_KEY); } catch (_) { /* ignore */ } },

  /**
   * Per-category roll-up for an instructor view: attempts, passes, distinct
   * stations passed, best stars. Categories come from the entries themselves
   * so a record from a since-renamed category still counts.
   */
  summary(list = loadRecords()) {
    const by = new Map();
    for (const r of list) {
      const key = r.category ?? "Uncategorized";
      if (!by.has(key)) by.set(key, { category: key, attempts: 0, passes: 0, stations: new Set(), stationsPassed: new Set(), bestStars: 0 });
      const s = by.get(key);
      s.attempts += 1;
      s.stations.add(r.simId);
      if (r.passed) { s.passes += 1; s.stationsPassed.add(r.simId); }
      s.bestStars = Math.max(s.bestStars, r.stars | 0);
    }
    return [...by.values()].map((s) => ({
      category: s.category, attempts: s.attempts, passes: s.passes,
      stations: s.stations.size, stationsPassed: s.stationsPassed.size, bestStars: s.bestStars,
    }));
  },
};

// -------------------------------------------------------------------- export

const CSV_COLUMNS = [
  "at", "learner", "learnerName", "learnerId", "homePage", "app", "simId", "simName", "category", "trade", "certification", "system",
  "score", "stars", "errors", "hazardHits", "holdBreaks", "seconds", "parSeconds", "passed",
  "badges", "level", "levelName", "id",
];

function csvCell(v) {
  if (v == null) return "";
  const s = Array.isArray(v) ? v.join("; ") : String(v);
  return /[",\n\r]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s;
}

/** RFC 4180 CSV, one row per attempt, columns in CSV_COLUMNS order. */
function toCSV(list) {
  const lines = [CSV_COLUMNS.join(",")];
  for (const r of list) lines.push(CSV_COLUMNS.map((c) => csvCell(r[c])).join(","));
  return lines.join("\r\n") + "\r\n";
}

/** ISO 8601 duration from whole seconds, e.g. 125 -> "PT2M5S". */
function isoDuration(seconds) {
  const s = Math.max(0, Math.round(seconds | 0));
  const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), sec = s % 60;
  return `PT${h ? `${h}H` : ""}${m ? `${m}M` : ""}${sec || (!h && !m) ? `${sec}S` : ""}`;
}

/**
 * xAPI 1.0.3 statements — the standard a Learning Record Store ingests.
 * `homePage` scopes the activity ids and is the fallback actor account
 * home; a record that carries a launch identity (learnerId/homePage from
 * shared/identity.js) uses that as the actor account instead, so the LRS
 * can join it to the LMS user. Extensions carry the assessment detail
 * (category, certification, stars, unsafe actions) that the core result
 * object has no field for.
 */
function toXAPI(list, { actorName = "YOU", homePage = "https://smartciti.example" } = {}) {
  const ext = (k) => `${homePage}/xapi/ext/${k}`;
  return {
    statements: list.map((r) => ({
      id: r.id,
      timestamp: r.at,
      actor: {
        objectType: "Agent",
        name: r.learnerName ?? r.learner ?? actorName,
        account: { homePage: r.homePage ?? homePage, name: r.learnerId ?? r.learner ?? actorName },
      },
      verb: {
        id: r.passed ? "http://adlnet.gov/expapi/verbs/passed" : "http://adlnet.gov/expapi/verbs/failed",
        display: { "en-US": r.passed ? "passed" : "failed" },
      },
      object: {
        objectType: "Activity",
        id: `${homePage}/${r.app ?? "app"}/${r.simId}`,
        definition: {
          name: { "en-US": r.simName ?? r.simId },
          description: { "en-US": `${r.trade ?? ""}${r.certification ? ` — ${r.certification}` : ""}`.trim() },
          type: "http://adlnet.gov/expapi/activities/simulation",
        },
      },
      result: {
        score: { raw: r.score | 0, min: 0 },
        success: !!r.passed,
        completion: true,
        duration: isoDuration(r.seconds),
        extensions: {
          [ext("stars")]: r.stars | 0,
          [ext("corrections")]: r.errors | 0,
          [ext("unsafe-actions")]: r.hazardHits | 0,
          [ext("hold-breaks")]: r.holdBreaks | 0,
          // The step-by-step review, so an LRS holds where a run went slow
          // or wrong rather than only what it scored.
          ...(r.debrief ? {
            [ext("clean-steps")]: r.debrief.cleanSteps | 0,
            [ext("median-step-seconds")]: r.debrief.medianSeconds ?? 0,
            [ext("slowest-step")]: r.debrief.slowest ? `${r.debrief.slowest.title} (${r.debrief.slowest.seconds}s)` : null,
            [ext("step-log")]: (r.debrief.steps ?? []).map((st) => ({
              id: st.id, seconds: st.seconds, corrections: st.corrections, hazards: st.hazards,
            })),
            // Interruptions are assessed separately from the procedure: an
            // LRS should be able to ask "who misses alarms" without unpicking
            // the step log to find out.
            ...(r.debrief.interrupts ? {
              [ext("interrupts-caught")]: r.debrief.interrupts.answered,
              [ext("interrupts-missed")]: r.debrief.interrupts.missed + r.debrief.interrupts.wrong,
              [ext("interrupt-log")]: r.debrief.interrupts.log.map((l) => ({
                id: l.id, outcome: l.outcome, seconds: l.seconds,
              })),
            } : {}),
          } : {}),
          [ext("par-seconds")]: r.parSeconds ?? null,
          [ext("badges")]: r.badges ?? [],
        },
      },
      context: {
        platform: "SmartCiti.X ~VR Simulators",
        extensions: {
          [ext("category")]: r.category ?? null,
          [ext("certification")]: r.certification ?? null,
          [ext("system")]: r.system ?? null,
          [ext("learner-level")]: r.level ?? null,
        },
      },
    })),
  };
}

// ------------------------------------------------------------- credentials

/** Distinct certifications with a passing attempt — the latest pass for each. */
function earnedCertifications(list) {
  const by = new Map();
  for (const r of list) {
    if (!r.passed || !r.certification) continue;
    const prev = by.get(r.certification);
    if (!prev || String(r.at) > String(prev.at)) by.set(r.certification, r);
  }
  return [...by.values()].sort((a, b) => String(b.at).localeCompare(String(a.at)));
}

function badgeImage(label) {
  const safe = String(label).replace(/[<>&"]/g, "");
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="240" height="240"><rect width="240" height="240" rx="24" fill="#0b1219"/>` +
    `<circle cx="120" cy="104" r="62" fill="none" stroke="#37d6c0" stroke-width="10"/>` +
    `<text x="120" y="196" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#e6f0f6">${safe}</text></svg>`;
  return `data:image/svg+xml;utf8,${encodeURIComponent(svg)}`;
}

/**
 * Open Badges 2.0 assertions — the portable credential format LMSs, wallets
 * and other training ecosystems ingest — one per certification with a
 * passing attempt. These are self-asserted by a static page: an issuer that
 * hosts the BadgeClass and Assertion URLs is what makes them verifiable, so
 * the ids are laid out as URLs under `homePage` ready for that host. The
 * evidence entry points at the same xAPI statement the LRS export carries.
 */
function toOpenBadges(list, { issuerName = "SmartCiti.X Training Network", homePage = "https://smartciti.example", actorName = "YOU" } = {}) {
  return earnedCertifications(list).map((r) => {
    const home = r.homePage ?? homePage;
    const who = r.learnerId ?? r.learner ?? actorName;
    return {
      "@context": "https://w3id.org/openbadges/v2",
      type: "Assertion",
      id: `${home}/credentials/${r.id}`,
      recipient: { type: "url", hashed: false, identity: `${home}/learners/${encodeURIComponent(who)}`, name: r.learnerName ?? r.learner ?? actorName },
      issuedOn: r.at,
      verification: { type: "hosted" },
      badge: {
        type: "BadgeClass",
        id: `${homePage}/badges/${r.app ?? "app"}/${r.simId}`,
        name: `${r.simName ?? r.simId} — ${r.certification}`,
        description: `Passed the ${r.simName ?? r.simId} simulator (${r.category ?? "uncategorized"}): ${r.stars | 0} stars, ` +
          `${r.hazardHits | 0} unsafe actions, ${r.errors | 0} corrections. Maps to: ${r.certification}.`,
        image: badgeImage(r.simName ?? r.simId),
        criteria: { narrative: "Two or more stars with no unsafe action on the station's real ordered procedure, assessed by the SmartCiti.X procedure engine. Passing a simulator evidences readiness for the named certification; it is not the certification itself." },
        issuer: { type: "Profile", id: `${homePage}/issuer`, name: issuerName, url: homePage },
        tags: [r.category, r.trade].filter(Boolean),
      },
      evidence: [{ id: `${homePage}/xapi/statements/${r.id}`, narrative: `Score ${r.score | 0}, ${r.stars | 0} stars, ${r.seconds | 0} s against par ${r.parSeconds ?? "—"} s; xAPI statement ${r.id}.` }],
    };
  });
}

/** Browser-only: hand the learner a file. No-op outside a DOM. */
function download(filename, text, mime = "text/plain") {
  if (typeof document === "undefined" || typeof URL?.createObjectURL !== "function") return false;
  const blob = new Blob([text], { type: mime });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
  return true;
}


/* ===== shared/competency.js ===== */
// Competency and proof of training — the sober tier above the badges.
//
// A station badge (gamify.js) says a learner played a station well. That is
// motivation, and it is not what a hall, a JATC or a safety director signs.
// What they sign is a *competency*: a named thing a journeyman can do, tied
// to the standards a body actually publishes, demonstrated by passing named
// stations under one stated rule that never bends.
//
// That rule is MASTERY below. It is stricter than the pass rule in
// records.js on purpose: a pass is "you got through it", mastery is "you got
// through it the way the standard describes". Nothing else earns a
// competency — there is no partial credit, no curve, and no second rule for
// a learner who nearly made it. A near miss is reported with the reason it
// did not count (see transcript()), because a learner who cannot see why a
// run failed learns nothing from failing it.
//
// This module is pure data and pure functions over the training record. It
// touches no DOM and no storage, so tools/check_competency.mjs runs the
// whole layer in Node. The only import is the scoring constants from
// game.js, so the rubric a learner reads is the rubric the engine used
// rather than a second copy of it that can drift.


/**
 * The mastery rule, stated once. Every status, badge, transcript row and
 * export below reads these numbers rather than repeating them, so the rule a
 * learner is shown and the rule the code applies cannot disagree.
 *
 * - `minStars` 2: the engine's 2-star band is "at most one correction and
 *   inside 1.5x par" (game.js finish()), so stars already encode most of it.
 * - `maxHazardHits` 0: an unsafe action is disqualifying, full stop. A wrong
 *   or unanswered interruption counts as one (game.js resolveInterrupt()).
 * - every interruption answered: the procedure and noticing the alarm are
 *   two different competencies and this layer demands both.
 * - `parMultiple` 1.5: the same multiple the 2-star band uses.
 */
const MASTERY = {
  id: "mastery-v1",
  minStars: 2,
  maxHazardHits: 0,
  answerEveryInterruption: true,
  parMultiple: 1.5,
  text: "A run demonstrates mastery when it earns two or more stars, records zero unsafe actions, " +
    "answers every interruption it was given, and finishes within 1.5 times the station's par time. " +
    "One mastery run on enough of a competency's stations earns \"demonstrated\"; mastery runs on " +
    "three different days earn \"consistent\". No other rule earns a competency.",
};

/** One clean run demonstrates; mastery on this many different days is consistent. */
const CONSISTENT_DAYS = 3;

/**
 * The scoring rubric, read straight from game.js's own constants so a
 * learner sees why a run scored what it scored. Shown in the Proof tab and
 * repeated in docs/proof-of-training.md.
 */
const RUBRIC = {
  stepPoints: STEP_POINTS,
  wrongStepPenalty: WRONG_STEP_PENALTY,
  hazardPenalty: HAZARD_PENALTY,
  maxCombo: MAX_COMBO,
  interruptPoints: INTERRUPT_POINTS,
  interruptSpeedBonus: INTERRUPT_SPEED_BONUS,
  timeBonusPerSecond: 2,
  lines: [
    ["Score", `Each correct step in the procedure is worth ${STEP_POINTS} points times the current combo. A wrong control costs ${WRONG_STEP_PENALTY}; touching a registered hazard costs ${HAZARD_PENALTY} and is recorded as an unsafe action. Finishing under par adds 2 points per second saved.`],
    ["Combo", `Correct steps in a row multiply the next step: the multiplier is 1 + 0.1 per step in the streak, capped at ${MAX_COMBO.toFixed(1)}x. Any wrong control resets the streak to zero. Combo raises the score; it never changes the star band.`],
    ["Interruptions", `An alarm that fires mid-procedure is worth ${INTERRUPT_POINTS} points, plus up to ${INTERRUPT_SPEED_BONUS} more the faster it is answered. A wrong answer and no answer are treated the same way: the condition is still there, so both cost ${HAZARD_PENALTY} and count as an unsafe action.`],
    ["Stars", "3 stars: no corrections at all and finished inside par. 2 stars: at most one correction and finished inside 1.5x par. 1 star: anything else. Stars, not score, decide whether a run counts."],
    ["Why a high score can still fail", "Score rewards speed and streaks. Mastery asks a different question — was it safe and complete — so a fast run with one unsafe action scores well and counts for nothing."],
  ],
};

// ------------------------------------------------------------------- mastery

/** Whole seconds as m:ss, for a transcript a person reads. */
function clockText(seconds) {
  const s = Math.max(0, Math.round(seconds | 0));
  return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`;
}

/** The interruption tally on a record, normalised. Absent means none fired. */
function interrupts(record) {
  const iv = record?.interrupts ?? record?.debrief?.interrupts;
  if (!iv) return null;
  return { answered: iv.answered | 0, wrong: iv.wrong | 0, missed: iv.missed | 0 };
}

/** The par this run is judged against: the argument first, then the record's own. */
function parOf(record, parSeconds) {
  const par = parSeconds ?? record?.parSeconds;
  return typeof par === "number" && par > 0 ? par : null;
}

/**
 * Why a run did not reach mastery, or null when it did. One reason, the first
 * that applies, in the order the rule states them — a learner who touched a
 * live bus and also ran long needs to hear about the live bus.
 *
 * This is the single place the rule is evaluated: isMastery() is this
 * function asking whether there was anything to say, and the transcript
 * prints what it said.
 */
function masteryShortfall(record, parSeconds) {
  if (!record || typeof record !== "object") return { rule: "record", reason: "No attempt record." };
  const stars = record.stars | 0;
  if (stars < MASTERY.minStars) {
    return { rule: "stars", reason: `${stars} star${stars === 1 ? "" : "s"} — mastery needs ${MASTERY.minStars}. The 2-star band is at most one correction and inside 1.5x par.` };
  }
  const hazards = record.hazardHits | 0;
  if (hazards > MASTERY.maxHazardHits) {
    return { rule: "unsafe", reason: `${hazards} unsafe action${hazards === 1 ? "" : "s"} — mastery allows none.` };
  }
  const iv = interrupts(record);
  if (iv && (iv.wrong > 0 || iv.missed > 0)) {
    const parts = [];
    if (iv.missed) parts.push(`${iv.missed} missed`);
    if (iv.wrong) parts.push(`${iv.wrong} answered wrongly`);
    return { rule: "interrupts", reason: `${parts.join(" and ")} of ${iv.answered + iv.wrong + iv.missed} interruptions — mastery needs every one answered.` };
  }
  const par = parOf(record, parSeconds);
  if (par != null) {
    const limit = par * MASTERY.parMultiple;
    const seconds = record.seconds | 0;
    if (seconds > limit) {
      return { rule: "time", reason: `${clockText(seconds)} against par ${clockText(par)} — mastery allows ${clockText(limit)}.` };
    }
  }
  return null;
}

/**
 * The mastery rule. `parSeconds` overrides the record's own par (an
 * instructor re-judging a run against a station whose par has since moved);
 * when neither is known the time limit cannot be applied and the other three
 * conditions decide.
 */
function isMastery(record, parSeconds) {
  return masteryShortfall(record, parSeconds) === null;
}

// -------------------------------------------------------------------- status

/** The UTC calendar day of an ISO timestamp — what "different days" counts. */
function day(at) {
  const s = String(at ?? "");
  return /^\d{4}-\d{2}-\d{2}/.test(s) ? s.slice(0, 10) : s;
}

/** A compact, serialisable view of one attempt, for status and transcript. */
function attemptRow(r) {
  const par = parOf(r, null);
  const shortfall = masteryShortfall(r);
  return {
    attemptId: r.id ?? null,
    at: r.at ?? null,
    stationId: r.simId ?? null,
    stationName: r.simName ?? r.simId ?? null,
    learner: r.learnerName ?? r.learner ?? null,
    score: r.score | 0,
    stars: r.stars | 0,
    hazardHits: r.hazardHits | 0,
    errors: r.errors | 0,
    interrupts: interrupts(r),
    seconds: r.seconds | 0,
    parSeconds: par,
    parRatio: par ? Math.round((r.seconds | 0) / par * 100) / 100 : null,
    mastery: shortfall === null,
    reason: shortfall?.reason ?? null,
    rule: shortfall?.rule ?? null,
  };
}

/** Best first: mastery over not, then stars, then score. */
function betterAttempt(a, b) {
  if (!b) return a;
  if (a.mastery !== b.mastery) return a.mastery ? a : b;
  if (a.stars !== b.stars) return a.stars > b.stars ? a : b;
  return a.score >= b.score ? a : b;
}

/**
 * Where the learner stands on every competency, from the training record.
 *
 * Per competency: `demonstrated` when `require` of its stations each carry at
 * least one mastery run; `consistent` when it is demonstrated and its mastery
 * runs fall on three or more different days. `stations` holds one entry per
 * station the record has any attempt on — `best` is the best attempt seen
 * there and `masteryAt` the timestamp of the FIRST mastery run, which is the
 * date the station was earned and the date the badge is issued on.
 */
function competencyStatus(records = []) {
  const byStation = new Map();
  for (const r of records) {
    if (!r?.simId) continue;
    if (!byStation.has(r.simId)) byStation.set(r.simId, []);
    byStation.get(r.simId).push(r);
  }
  const out = {};
  for (const c of COMPETENCIES) {
    const stations = {};
    const days = new Set();
    let masteryRuns = 0, attempts = 0;
    const earnedDates = [];
    for (const id of c.stations) {
      const runs = byStation.get(id);
      if (!runs?.length) continue;
      let best = null, masteryAt = null;
      for (const r of runs) {
        const row = attemptRow(r);
        attempts += 1;
        best = betterAttempt(row, best);
        if (!row.mastery) continue;
        masteryRuns += 1;
        days.add(day(row.at));
        if (masteryAt == null || String(row.at) < String(masteryAt)) masteryAt = row.at;
      }
      stations[id] = { best, masteryAt };
      if (masteryAt) earnedDates.push(masteryAt);
    }
    const stationsMet = earnedDates.length;
    const demonstrated = stationsMet >= c.require;
    // Dated by the evidence rather than by the export: the competency was
    // earned the moment its `require`-th station was, so that is the date the
    // badge is issued on. Sorted chronologically, not in station order.
    earnedDates.sort((a, b) => String(a).localeCompare(String(b)));
    const earnedAt = demonstrated ? earnedDates[c.require - 1] ?? null : null;
    out[c.id] = {
      id: c.id, title: c.title, kind: c.kind, standards: c.standards,
      require: c.require, total: c.stations.length,
      demonstrated,
      consistent: demonstrated && days.size >= CONSISTENT_DAYS,
      status: demonstrated ? (days.size >= CONSISTENT_DAYS ? "consistent" : "demonstrated") : "in progress",
      stationsMet, masteryRuns, attempts, days: days.size,
      earnedAt,
      stations,
    };
  }
  return out;
}

/** Ids of competencies demonstrated in `after` that were not in `before`. */
function newlyDemonstrated(before, after) {
  return Object.keys(after).filter((id) => after[id].demonstrated && !before?.[id]?.demonstrated);
}

// ----------------------------------------------------------------- transcript

/**
 * The proof transcript: one row per competency the learner has touched, with
 * the evidence under it. `evidence` is every attempt on the competency's
 * stations, newest first, each carrying score, stars, unsafe actions, the
 * interruption tally and time against par — and, for a run that did not
 * count, the reason. That reason is the point of the whole table: a learner
 * looking at a near miss can see it was one missed alarm rather than "fail".
 *
 * `opts.all` keeps competencies with no attempts at all (the full catalogue,
 * for a hall printing what is available); by default they are dropped.
 */
function transcript(records = [], { learner = null, all = false } = {}) {
  const status = competencyStatus(records);
  const rows = [];
  for (const c of COMPETENCIES) {
    const st = status[c.id];
    const stations = new Set(c.stations);
    const evidence = records
      .filter((r) => stations.has(r?.simId))
      .map(attemptRow)
      .sort((a, b) => String(b.at).localeCompare(String(a.at)));
    if (!evidence.length && !all) continue;
    rows.push({
      learner: learner ?? evidence.find((e) => e.learner)?.learner ?? "YOU",
      competency: { id: c.id, title: c.title, kind: c.kind },
      status: st.status,
      demonstrated: st.demonstrated,
      consistent: st.consistent,
      stationsMet: st.stationsMet,
      require: st.require,
      total: st.total,
      days: st.days,
      earnedAt: st.earnedAt,
      standards: c.standards.map((id) => {
        const s = standard(id);
        return { id: s.id, body: s.body, title: s.title, source: s.source };
      }),
      masteryRule: MASTERY.text,
      evidence,
    });
  }
  return rows;
}

/** Flat CSV of the transcript — one row per evidence attempt. */
const PROOF_COLUMNS = [
  "learner", "competency", "competencyTitle", "status", "stationsMet", "require",
  "standards", "at", "stationId", "stationName", "attemptId",
  "score", "stars", "hazardHits", "interruptsAnswered", "interruptsWrong", "interruptsMissed",
  "seconds", "parSeconds", "parRatio", "mastery", "reason",
];

function proofCsvCell(v) {
  if (v == null) return "";
  const s = Array.isArray(v) ? v.join("; ") : String(v);
  return /[",\n\r]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s;
}

/** RFC 4180 CSV of the proof transcript, one line per evidence attempt. */
function toProofCSV(rows) {
  const lines = [PROOF_COLUMNS.join(",")];
  for (const row of rows) {
    for (const e of row.evidence) {
      const flat = {
        learner: row.learner, competency: row.competency.id, competencyTitle: row.competency.title,
        status: row.status, stationsMet: row.stationsMet, require: row.require,
        standards: row.standards.map((s) => `${s.body} ${s.title}`),
        at: e.at, stationId: e.stationId, stationName: e.stationName, attemptId: e.attemptId,
        score: e.score, stars: e.stars, hazardHits: e.hazardHits,
        interruptsAnswered: e.interrupts?.answered ?? "", interruptsWrong: e.interrupts?.wrong ?? "", interruptsMissed: e.interrupts?.missed ?? "",
        seconds: e.seconds, parSeconds: e.parSeconds, parRatio: e.parRatio,
        mastery: e.mastery, reason: e.reason,
      };
      lines.push(PROOF_COLUMNS.map((c) => proofCsvCell(flat[c])).join(","));
    }
  }
  return lines.join("\r\n") + "\r\n";
}

// --------------------------------------------------------- competency badges

function competencyBadgeImage(label) {
  const safe = String(label).replace(/[<>&"]/g, "").slice(0, 28);
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="240" height="240"><rect width="240" height="240" rx="24" fill="#0b1219"/>` +
    `<rect x="36" y="34" width="168" height="140" rx="10" fill="none" stroke="#7ee6ff" stroke-width="8"/>` +
    `<path d="M74 104 l24 24 l48 -52" fill="none" stroke="#59c97b" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>` +
    `<text x="120" y="208" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#e6f0f6">${safe}</text></svg>`;
  return `data:image/svg+xml;utf8,${encodeURIComponent(svg)}`;
}

/**
 * Open Badges 2.0 assertions for demonstrated competencies — the second,
 * sober tier beside the station badges in records.js, which stay exactly as
 * they are. Each assertion carries the competency, every standard it
 * evidences (as OB alignment entries a receiving system can read), the
 * station ids, the attempt ids behind it, and the mastery rule text in the
 * criteria narrative, so a hall reading it later can tell what was actually
 * required without this repository in front of them.
 *
 * Like the station badges these are self-asserted by a static page: the ids
 * are laid out as URLs under `homePage` ready for a hall that hosts them,
 * which is what makes hosted verification mean anything.
 */
function toCompetencyBadges(records = [], {
  issuerName = "SmartCiti.X Training Network",
  homePage = "https://smartciti.example",
  actorName = "YOU",
  learnerHome = null,
  learnerId = null,
  learnerName = null,
} = {}) {
  const status = competencyStatus(records);
  const out = [];
  for (const c of COMPETENCIES) {
    const st = status[c.id];
    if (!st.demonstrated) continue;
    const evidence = [];
    const stationIds = [];
    for (const [id, s] of Object.entries(st.stations)) {
      if (!s.masteryAt) continue;
      stationIds.push(id);
      const best = s.best;
      evidence.push({
        id: `${homePage}/xapi/statements/${best.attemptId}`,
        name: best.stationName ?? id,
        narrative: `${id}: ${best.stars} stars, ${best.hazardHits} unsafe actions, ` +
          `${best.interrupts ? `${best.interrupts.answered} of ${best.interrupts.answered + best.interrupts.wrong + best.interrupts.missed} interruptions answered, ` : "no interruptions fired, "} ` +
          `${clockText(best.seconds)} against par ${best.parSeconds ? clockText(best.parSeconds) : "—"}; mastery run ${best.attemptId} on ${day(s.masteryAt)}.`,
      });
    }
    const home = learnerHome ?? homePage;
    const who = learnerId ?? actorName;
    const standards = c.standards.map((id) => standard(id));
    out.push({
      "@context": "https://w3id.org/openbadges/v2",
      type: "Assertion",
      id: `${home}/credentials/competency/${encodeURIComponent(c.id)}`,
      recipient: {
        type: "url", hashed: false,
        identity: `${home}/learners/${encodeURIComponent(who)}`,
        name: learnerName ?? actorName,
      },
      issuedOn: st.earnedAt ?? new Date().toISOString(),
      verification: { type: "hosted" },
      badge: {
        type: "BadgeClass",
        id: `${homePage}/badges/competency/${encodeURIComponent(c.id)}`,
        name: c.title,
        description: `Competency "${c.title}" (${c.id}), demonstrated on ${st.stationsMet} of the ${st.total} stations named for it, ` +
          `${st.require} being required. Evidenced against ${standards.map((s) => `${s.body} ${s.title}`).join("; ")}. ` +
          `Status: ${st.status}${st.consistent ? ` (mastery runs on ${st.days} different days)` : ""}. ` +
          "A demonstrated competency evidences readiness against the named standards; it is not a licence or a certification issued by those bodies.",
        image: competencyBadgeImage(c.id),
        criteria: { narrative: `${MASTERY.text} This competency requires mastery on ${c.require} of these stations: ${c.stations.join(", ")}.` },
        issuer: { type: "Profile", id: `${homePage}/issuer`, name: issuerName, url: homePage },
        tags: ["competency", c.kind, ...new Set(standards.map((s) => s.body))],
        alignment: standards.map((s) => ({
          targetName: `${s.body} — ${s.title}`,
          targetUrl: `${homePage}/standards/${encodeURIComponent(s.id)}`,
          targetCode: s.id,
          targetFramework: s.body,
          targetDescription: s.source === "verified" ? s.title : `${s.title} (citation form unverified in this registry)`,
        })),
      },
      evidence,
      // The detail a receiving system wants as data rather than prose. Extra
      // keys on an assertion are ignored by a strict OB 2.0 validator (the
      // verifier in WebXR/verify/ checks the assertion and passes this
      // through), so nothing is lost by carrying it.
      competency: {
        id: c.id, title: c.title, kind: c.kind,
        status: st.status, demonstrated: true, consistent: st.consistent,
        require: c.require, stationsMet: st.stationsMet, stationsTotal: st.total, masteryDays: st.days,
        stations: c.stations,
        stationsDemonstrated: stationIds,
        attempts: evidence.map((e) => e.id.split("/").pop()),
        standards: standards.map((s) => ({ id: s.id, body: s.body, title: s.title, source: s.source, slug: s.slug })),
        masteryRule: { id: MASTERY.id, text: MASTERY.text },
      },
    });
  }
  return out;
}

/**
 * xAPI statements for demonstrated competencies, verb "achieved" — what goes
 * through the live LRS queue (shared/lrs.js) beside the per-attempt
 * passed/failed statements. The assertion rides along in an extension so an
 * LRS holds the credential and its evidence, not just the fact.
 *
 * `only` limits it to named competency ids, which is what the app uses to
 * send exactly the competencies a run just earned.
 */
function toCompetencyXAPI(records = [], {
  homePage = "https://smartciti.example",
  actorName = "YOU",
  learnerName = null,
  learnerId = null,
  learnerHome = null,
  only = null,
  app = "smartcity",
} = {}) {
  const ext = (k) => `${homePage}/xapi/ext/${k}`;
  const wanted = only ? new Set(only) : null;
  const status = competencyStatus(records);
  const assertions = Object.fromEntries(
    toCompetencyBadges(records, { homePage, actorName, learnerName, learnerId, learnerHome })
      .map((a) => [a.competency.id, a]),
  );
  const statements = [];
  for (const c of COMPETENCIES) {
    const st = status[c.id];
    if (!st.demonstrated) continue;
    if (wanted && !wanted.has(c.id)) continue;
    const assertion = assertions[c.id];
    const at = st.earnedAt ?? new Date().toISOString();
    statements.push({
      // Stable and derived from the competency, so an LRS de-duplicates a
      // competency that is re-sent rather than recording it twice.
      id: `${app}-competency-${c.id}`,
      timestamp: at,
      actor: {
        objectType: "Agent",
        name: learnerName ?? actorName,
        account: { homePage: learnerHome ?? homePage, name: learnerId ?? actorName },
      },
      verb: { id: "http://adlnet.gov/expapi/verbs/achieved", display: { "en-US": "achieved" } },
      object: {
        objectType: "Activity",
        id: `${homePage}/competency/${encodeURIComponent(c.id)}`,
        definition: {
          name: { "en-US": c.title },
          description: { "en-US": `Competency ${c.id}: mastery on ${st.stationsMet} of ${st.total} stations, ${c.require} required.` },
          type: "http://adlnet.gov/expapi/activities/objective",
        },
      },
      result: {
        success: true,
        completion: true,
        extensions: {
          [ext("competency")]: c.id,
          [ext("competency-status")]: st.status,
          [ext("stations-demonstrated")]: Object.entries(st.stations).filter(([, s]) => s.masteryAt).map(([id]) => id),
          [ext("attempts")]: assertion?.competency.attempts ?? [],
          [ext("standards")]: c.standards.map((id) => standard(id).slug),
          [ext("mastery-rule")]: MASTERY.text,
          [ext("open-badge")]: assertion ?? null,
        },
      },
      context: {
        platform: "SmartCiti.X ~VR Simulators",
        extensions: { [ext("competency-kind")]: c.kind, [ext("mastery-rule-id")]: MASTERY.id },
      },
    });
  }
  return { statements };
}


/* ===== shared/identity.js ===== */
// Learner identity for a static app — the launch context an LMS, portal or
// union-hall kiosk hands us, so a training record is attributable to a
// person rather than a self-typed crew tag.
//
// There is no server here, so nothing can be cryptographically verified:
// this is a *launch context*, not authentication, and the docs say so. What
// it does guarantee is provenance — identity only arrives two ways, both
// under the host's control:
//
//   1. Launch URL:  ?learner=<display name>&learner_id=<account id>&learner_home=<https origin>
//      Read once, stored per tab (sessionStorage), then scrubbed from the
//      address bar so bookmarks and screenshots never carry it.
//   2. Embedding page (iframe): window.postMessage({ type: "smartcitix:identity",
//      learner, learner_id, learner_home }) — accepted only when learner_home
//      equals the sender's real origin, so a frame can't claim a home it isn't.
//
// In return the app posts every finished attempt back to that same origin
// (see emit()), so a hosting LMS can capture records live without an LRS.

const IDENTITY_KEY = "vr-training-identity-v1";
const MSG_IDENTITY = "smartcitix:identity";
const MAX_NAME = 60, MAX_ID = 120;
// ASCII control characters (0-31 and 127), built without escape sequences so
// the source stays plain text in every editor and bundler.
const CONTROL_CHARS = new RegExp(`[${String.fromCharCode(0)}-${String.fromCharCode(31)}${String.fromCharCode(127)}]`, "g");

function cleanField(v, max) {
  if (typeof v !== "string") return null;
  const s = v.replace(CONTROL_CHARS, "").trim().slice(0, max);
  return s || null;
}

/** An https (or http on localhost) origin with no path — or null. */
function cleanOrigin(v) {
  if (typeof v !== "string") return null;
  try {
    const u = new URL(v);
    const local = u.hostname === "localhost" || u.hostname === "127.0.0.1";
    if (u.protocol !== "https:" && !(u.protocol === "http:" && local)) return null;
    return u.origin;
  } catch (_) { return null; }
}

function parseIdentity(raw, senderOrigin = null) {
  const name = cleanField(raw?.learner, MAX_NAME);
